<style>
  body{--bg:#2a3036;--accent:#e9c77a;--font-display:'Cinzel',serif;--font-ui:'Cinzel',serif;--font-body:'EB Garamond',serif;

  .lb{font-family:'Cinzel',serif;font-weight:700;text-anchor:middle;letter-spacing:.1em}
  #barge{animation:barge 40s linear infinite}
  @keyframes barge{from{transform:translateX(0)}to{transform:translateX(220px)}}
  #easel.ready #sheetface{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-5px)}}
  #dust circle{animation:dust 9s steps(9,end) infinite}
  #dust circle:nth-child(2n){animation-duration:13s;animation-delay:-4s}
  @keyframes dust{0%{transform:translate(0,0);opacity:.0}30%{opacity:.6}100%{transform:translate(30px,60px);opacity:0}}
  #jf,#papers{display:none}
  body.fall #jf,body.fall #papers,body.down #papers{display:inline}
  body.down #jj{display:none}

  /* the proof, with its pins */
  .pf{display:grid;grid-template-columns:minmax(0,800px) 230px;gap:18px;width:min(1060px,97vw);align-items:start}
  .pf-sheet{background:#efe6cf;padding:10px 12px 10px;box-shadow:0 18px 44px rgba(0,0,0,.6);border:1px solid #b9a77a}
  .pf-sheet svg{display:block;width:100%;height:auto}
  .grp{cursor:pointer}
  .grp .hit{fill:transparent}
  .grp:hover .hit{fill:rgba(233,199,122,.22)}
  .grp.bad .hit{fill:rgba(179,38,28,.28)}
  .grp.good .hit{fill:rgba(61,107,52,.25)}
  .pf-slip{margin-top:8px;padding:8px 12px 6px;background:#fbf7ea;border-left:5px solid #7a5a2a;font-family:'EB Garamond',serif;font-size:15.6px;line-height:1.36;color:#2a2116}
  .pf-slip h6{margin:0 0 3px;font-family:'Cinzel',serif;font-weight:700;font-size:11.5px;letter-spacing:.16em;color:#7a5a2a}
  .pf-slip p{margin:0}
  .pf-slip b{font-family:'Cinzel',serif;font-weight:700;font-size:.9em;letter-spacing:.04em}
  .pf-slip .gk{font-family:'Libre Caslon Text',serif;font-size:13px;color:#6a5a40}
  .k-k{color:#a8261c}.k-p{color:#2a4f8c}.k-t{color:#2d6a34}.k-f{color:#8a5a00}
  .pins{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .pinb{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#efe9da;font-family:'EB Garamond',serif;font-size:15px;line-height:1.15;text-align:left;cursor:pointer;border-radius:3px}
  .pinb i{flex:0 0 14px;height:14px;border-radius:50%;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
  .pinb small{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.12em;opacity:.7}
  .pinb.held{outline:3px solid var(--accent)}
  .pinb.set{opacity:.6}
  .pinb.no{border-color:#d0574a}
  .pf-btns{display:flex;flex-direction:column;gap:6px}
  @media (max-width:900px){.pf{grid-template-columns:1fr}}
</style>
</head>

    var s = '<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg">';
    s += '<path d="M0 34L60 8 130 26 210 0 300 22 380 4 470 20 560 2 650 18 740 6 820 22 900 10V470H0z" fill="#2b2d2f"/>';
    s += '<text x="890" y="40" text-anchor="end" font-family="Cinzel,serif" font-size="12" fill="#bdb6a4" letter-spacing="2">SACRED SIGNS</text>';
    var y = 40;
    HLINES.forEach(function (line) {
      var x = 18;
      line.forEach(function (id) { var g = hgroup(id, x, y, 0.62); s += g.svg; x += g.w + 22; });
      y += 46;
    });
    s += '<path d="M10 182H890" stroke="#6a6a66" stroke-width="1.5" stroke-dasharray="6 5"/>';
    s += '<text x="890" y="204" text-anchor="end" font-family="Cinzel,serif" font-size="12" fill="#bdb6a4" letter-spacing="2">THE MIDDLE SCRIPT</text>';
    var k = 0; y = 210;
    DLINES.forEach(function (n) {
      var x = 24;
      for (var i = 0; i < n; i++, k++) {
        var id = DSEQ[k];
        s += '<g class="grp" data-band="d" data-g="' + id + '" data-n="' + k + '" transform="translate(' + x + ' ' + y + ') scale(1.35)"><rect class="hit" x="-6" y="-2" width="58" height="40"/><path d="' + DEM[id] + '" fill="none" stroke="#e9e3d2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>';
        x += 118;
      }
      y += 56;
    });
    s += '<path d="M10 380H890" stroke="#6a6a66" stroke-width="1.5" stroke-dasharray="6 5"/>';
    s += '<text x="890" y="398" text-anchor="end" font-family="Cinzel,serif" font-size="12" fill="#bdb6a4" letter-spacing="2">GREEK</text>';
    s += '<g stroke="#bdb6a4" stroke-width="2" opacity=".5"><path d="M24 410h170M206 410h120M338 410h200M550 410h90M24 428h220M256 428h80M348 428h150M510 428h160"/></g>';
    s += '<text x="24" y="456" font-family="\'Libre Caslon Text\',serif" font-size="15.5" fill="#e9e3d2" letter-spacing="1.5">&Tau;&Omicron;&Iota;&Sigma; &Tau;&Epsilon; &Iota;&Epsilon;&Rho;&Omicron;&Iota;&Sigma; &Kappa;&Alpha;&Iota; &Epsilon;&Gamma;&Chi;&Omega;&Rho;&Iota;&Omicron;&Iota;&Sigma; &Kappa;&Alpha;&Iota; &Epsilon;&Lambda;&Lambda;&Eta;&Nu;&Iota;&Kappa;&Omicron;&Iota;&Sigma; &Gamma;&Rho;&Alpha;&Mu;&Mu;&Alpha;&Sigma;&Iota;&Nu;</text>';
    s += '<g id="pf-pins"></g></svg>';
    return s;
  }
  var SLIP = '<h6>The end of the Greek, word for word, by M. Champollion-Figeac</h6>' +
    '<p>&hellip; and in every <b class="k-t">TEMPLE</b> they shall set up a statue of <b class="k-k">KING</b> <b class="k-p">PTOLEMY</b>, <b class="k-f">LIVING FOR EVER, BELOVED OF PTAH</b>,</p>' +
    '<p>and the priests shall serve it three times a day. Every year, on the BIRTHDAY of the <b class="k-k">KING</b>,</p>' +
    '<p>they shall hold a feast in every <b class="k-t">TEMPLE</b> of Egypt, and carry the statue of <b class="k-k">KING</b> <b class="k-p">PTOLEMY</b> in the processions;</p>' +
    '<p>and this decree shall be written on a stela of hard stone in sacred and native and Greek letters,</p>' +
    '<p>and set up beside the statue of <b class="k-k">KING</b> <b class="k-p">PTOLEMY</b>. <span class="gk">(the last line of the Greek, under the sheet: &ldquo;in sacred and native and Greek letters&rdquo;)</span></p>';

  /* the little copy on the easel in the scene */
  function drawMini() {
    var s = '', i;
    for (i = 0; i < 5; i++) s += '<rect x="' + (622 + i * 56) + '" y="' + (214 + (i % 2) * 6) + '" width="' + (30 + (i % 3) * 8) + '" height="12" rx="6" fill="none" stroke="#d9d4c6" stroke-width="2"/>';
    for (i = 0; i < 9; i++) s += '<path d="M' + (618 + i * 32) + ' 262q8-10 14 0t12-4" fill="none" stroke="#d9d4c6" stroke-width="2"/>';
    for (i = 0; i < 4; i++) s += '<path d="M622 ' + (350 + i * 22) + 'h' + (240 + (i % 2) * 30) + '" stroke="#d9d4c6" stroke-width="2" opacity=".7"/>';
    for (i = 0; i < 6; i++) s += '<path d="M622 ' + (470 + i * 18) + 'h' + (260 - (i % 3) * 20) + '" stroke="#d9d4c6" stroke-width="1.6" opacity=".55"/>';
    $('#mini').innerHTML = s;
    $('#pinsMini').innerHTML = nextFile ? '<g><circle cx="700" cy="214" r="6" fill="#2a4f8c"/><circle cx="640" cy="262" r="6" fill="#2d6a34"/><circle cx="740" cy="262" r="6" fill="#a8261c"/><circle cx="780" cy="214" r="6" fill="#8a5a00"/></g>' : '';
  }

  function begin() {
    paint();
    if (ER.flag('o-in')) { busy = false; ER.say(nextFile ? 'The office. The doctor has been, and M. Champollion has been carried home.' : 'The office at the Institut. M. Champollion-Figeac is writing letters, and the proof is on the easel.'); return; }
    ST.learn('apprentice', 'proof');
    ER.narrate([
      'The Institut de France, on the left bank of the Seine, at eleven in the morning. You have carried a roll of paper as tall as yourself up the stairs, and Zélie has carried the ribbons and the pins.',
      'Your name is Vigneau, and you are an apprentice at Madame Thorel&rsquo;s lithographic press, across the river. Zélie is fifteen and Madame Thorel&rsquo;s niece. Her father taught Greek; he left her his books and his opinions. The roll is the biggest job the press has had all year: a copy of the Rosetta Stone, for the lecture room of the Académie.',
      'M. Champollion-Figeac, who works for M. Dacier, the secretary of the Académie, pins it to an easel by the window. He is a careful man with a quiet voice. His younger brother has been trying for years to read the sacred signs of Egypt, and has been working day and night all week.',
      '&ldquo;Before I pay your mistress,&rdquo; he says, &ldquo;the gentlemen of the Académie must be able to see, from the back of the room, where the same words stand in the three scripts. Pin them for me. My card will tell you how.&rdquo; And he sits down to his letters.'
    ], function () { busy = false; ER.flag('o-in', 1); paint(); });
  }

  $('#card').addEventListener('click', function (e) {
    e.stopPropagation();
    if (busy) return;
    ER.read({ html: ST.STONE, cls: 'card', clue: { id: 'stone', title: 'How to read the copy of the stone', kind: 'Pinned to the easel' }, done: function () {
      ST.learn('decree', 'hieroglyphs', 'Demotic', 'script'); ER.flag('o-card', 1); paint();
    } });
  });
  $('#cutting').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ST.CUTTING, cls: 'cutting', clue: { id: 'cutting', title: 'Courier of Egypt', kind: 'Framed, on the wall' }, done: function () { ST.learn('Republic'); ER.flag('o-cut', 1); } });
  });
  $('#pamph').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ST.PAMPH, cls: 'pamph', clue: { id: 'pamph', title: 'A Key to the Sacred Letters', kind: 'A pamphlet on the desk' }, done: function () { ST.learn('pamphlet'); ER.flag('o-pam', 1); } });
  });
  $('#easel').addEventListener('click', function (e) {
    if (busy) return;
    if (nextFile) { ER.say('The proof, with its pins. Even the gentlemen at the back will see them.'); return; }
    if (!ER.flag('o-card')) { ER.say('The proof. Before you pin anything, read the card in its top right corner.'); return; }
    openLock();
  });
  $('#zelie').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Zélie is picking up the last of the drawings. Her hands are not quite steady.'); return; }
    ER.talk({ who: 'Zélie Thorel', role: 'Madame Thorel’s niece, fifteen', face: ST.FACE('zelie'), lines: [
      '&ldquo;I can read every word of the Greek. That is the trouble: so can everybody. The Greek is the only part that nobody needs to read.&rdquo;',
      { q: 'What about the other two?', a: '&ldquo;The middle one looks like a spider that fell in the ink. The top one is pictures: birds, lions, bits of rope. And the top is broken off, so it is a third of a puzzle. We copied every mark exactly, though. My aunt made me do the lions three times.&rdquo;' },
      { q: 'Have you read the pamphlet on the desk?', a: '&ldquo;M. Sautel&rsquo;s? Every word. He says each picture is a word: the lion means strength, the square a throne. Then the king&rsquo;s name means &ldquo;throne, strength, soul&rdquo;. I should like to see him write a shopping list.&rdquo;' },
      { q: 'And the framed paper by the clock?', a: '&ldquo;From the army&rsquo;s newspaper in Egypt. It is dated Year VII. Do you know what year that is? Neither do I. My aunt says it was the year the bread was dear, but she says that about every year.&rdquo;' }
    ], clue: { id: 'zelie1', title: 'Zélie, about the three scripts', kind: 'What she said' } });
  });
  $('#jj').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('M. Champollion-Figeac has gone with the doctor. His letters lie unfinished on the desk.'); return; }
    ER.talk({ who: 'M. Champollion-Figeac', role: 'Jacques-Joseph, the elder brother; he works for M. Dacier at the Institut', face: ST.FACE('jj'), lines: [
      '&ldquo;My brother has studied these signs since he was a boy. He learnt Coptic, the last form of the old Egyptian tongue, before he was twenty. If anybody in Europe can read them, it is he.&rdquo;',
      { q: 'Why does the Académie need a big copy?', a: '&ldquo;Because a room full of learned men cannot all stand round one engraving. When somebody says &ldquo;this group is the king&rdquo;, they must all be able to see which group he means.&rdquo;' },
      { q: 'What about M. Sautel?', a: '&ldquo;He sent his pamphlet to every member. He was with the army in Egypt as a young man, and he saw the stone. Seeing a thing is not the same as reading it. But he is not a fool, and he is very persistent.&rdquo;' }
    ], clue: { id: 'jj1', title: 'M. Champollion-Figeac, about the copy', kind: 'What he said' } });
  });
  ST.thing('#window', null, 'The Seine, and across it the long grey front of the Louvre. A barge loaded with firewood is going downstream.', isBusy);
  ST.thing('#door', null, function () { return nextFile ? 'The door to the stairs, still open.' : 'The door to the stairs. Somebody is coming up them, two at a time.'; }, isBusy);

  /* ---------- the lock: five pins ---------- */
  var PINS = [['k', 'KING', 'in the middle script', '#a8261c', 'd'], ['p', 'PTOLEMY', 'in the middle script', '#2a4f8c', 'd'], ['t', 'TEMPLE', 'in the middle script', '#2d6a34', 'd'],
    ['s', 'PTOLEMY', 'in the sacred signs', '#2a4f8c', 'h'], ['f', 'LIVING FOR EVER, BELOVED OF PTAH', 'the full title, in the sacred signs', '#8a5a00', 'h']];
  function build() {
    var b = ER.el('div', 'pf'), at = {}, held = null, lock = false;
    b.innerHTML = '<div><div class="pf-sheet">' + sheetSvg() + '<div class="pf-slip">' + SLIP + '</div></div></div>' +
      '<div class="lk-side"><div class="lk-face">' + ST.FACE('jj') + '</div><h6 class="lk-h">M. Champollion-Figeac</h6><p class="pmsg"></p>' +
      '<div class="pins">' + PINS.map(function (p) { return '<button type="button" class="pinb" data-p="' + p[0] + '"><i style="background:' + p[3] + '"></i><span>' + p[1] + '<small>' + p[2] + '</small></span></button>'; }).join('') + '</div>' +
      '<div class="pf-btns"><button type="button" class="btn" id="pf-clear">Take the pins out</button><button type="button" class="btn" id="pf-go" disabled>Show him the pins</button></div></div>';
    var msgEl = b.querySelector('.pmsg'), go = b.querySelector('#pf-go'), layer = b.querySelector('#pf-pins');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function pinOf(k) { for (var i = 0; i < PINS.length; i++) if (PINS[i][0] === k) return PINS[i]; }
    function draw() {
      var s = '', count = {};
      Object.keys(at).forEach(function (k) {
        var g = b.querySelector('.grp[data-n="' + at[k].n + '"]') || b.querySelector('.grp[data-g="' + at[k].g + '"]');
        if (!g) return;
        var tr = g.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/), x = +tr[1], y = +tr[2];
        var key = at[k].g + at[k].n; count[key] = (count[key] || 0) + 1;
        var ox = x + 10 + (count[key] - 1) * 14;
        s += '<g><path d="M' + ox + ' ' + (y - 4) + 'l6 16" stroke="#3a3a36" stroke-width="2"/><circle cx="' + ox + '" cy="' + (y - 6) + '" r="7" fill="' + pinOf(k)[3] + '" stroke="#fff" stroke-width="1.5"/></g>';
      });
      layer.innerHTML = s;
      ER.$$('.pinb', b).forEach(function (pb) { pb.classList.toggle('set', !!at[pb.getAttribute('data-p')]); pb.classList.toggle('held', pb.getAttribute('data-p') === held); });
      go.disabled = Object.keys(at).length < PINS.length;
    }
    ER.$$('.pinb', b).forEach(function (pb) {
      pb.addEventListener('click', function () {
        if (lock) return;
        var k = pb.getAttribute('data-p');
        held = held === k ? null : k; pb.classList.remove('no'); ST.sfx.pin(); draw();
        if (held) msg('Now click the group in ' + (pinOf(k)[4] === 'd' ? 'the middle script' : 'the sacred signs') + ' where it belongs.');
      });
    });
    ER.$$('.grp', b).forEach(function (g) {
      g.addEventListener('click', function () {
        if (lock) return;
        ER.$$('.grp', b).forEach(function (x) { x.classList.remove('bad', 'good'); });
        if (!held) { msg('Pick up a pin first: click one of the coloured pins on the right.'); return; }
        var p = pinOf(held);
        if (g.getAttribute('data-band') !== p[4]) { msg(p[4] === 'd' ? 'That pin is for the middle script.' : 'That pin is for the sacred signs, at the top.'); ER.sfx.no(); return; }
        at[held] = { g: g.getAttribute('data-g'), n: g.getAttribute('data-n') || '' };
        held = null; ST.sfx.pin(); draw(); msg('');
      });
    });
    b.querySelector('#pf-clear').addEventListener('click', function () { if (lock) return; at = {}; held = null; ER.$$('.grp', b).forEach(function (x) { x.classList.remove('bad', 'good'); }); draw(); });
    function why(k, g) {
      if (k === 'k') return g === 'd7' ? '&ldquo;That group comes three times. How many times does KING come in the slip?&rdquo;' : '&ldquo;KING comes four times in the slip. Which group in the middle script comes back four times?&rdquo;';
      if (k === 'p') return g === 'd4' ? 'He taps the pamphlet on his desk. &ldquo;That is M. Sautel&rsquo;s reading. Count it: four times. How many times does the slip say PTOLEMY? And which word comes four times?&rdquo;' : '&ldquo;PTOLEMY comes three times in the slip, and each time straight after KING.&rdquo;';
      if (k === 't') return ['d1', 'd3', 'd5', 'd6'].indexOf(g) >= 0 ? '&ldquo;That group does come twice. So do four others. Now look at where TEMPLE stands in the slip, counted by the KINGs round it.&rdquo;' : '&ldquo;TEMPLE comes twice in the slip. Count again.&rdquo;';
      if (k === 's') return g === 'h3' ? '&ldquo;That ring is longer than the others: there are more signs after the name. Where does the slip have PTOLEMY with nothing after it?&rdquo;' : '&ldquo;In the sacred signs the king&rsquo;s name is drawn inside a ring. My card says so.&rdquo;';
      if (k === 'f') return g === 'h6' ? '&ldquo;That is one of the short rings. The full title is the longest thing said of the king.&rdquo;' : '&ldquo;The full title belongs to the king&rsquo;s name, and the king&rsquo;s name is in a ring.&rdquo;';
    }
    go.addEventListener('click', function () {
      if (lock || go.disabled) return;
      var bad = [], first = '';
      ER.$$('.grp', b).forEach(function (x) { x.classList.remove('bad', 'good'); });
      PINS.forEach(function (p) {
        var v = at[p[0]], ok = ER.check('pin', p[0] + ':' + v.g), pb = b.querySelector('.pinb[data-p="' + p[0] + '"]');
        pb.classList.toggle('no', !ok);
        if (!ok) { bad.push(p[0]); if (!first) first = why(p[0], v.g); }
      });
      b.setAttribute('data-bad', bad.join(' '));
      if (bad.length) {
        ST.slip(); ER.sfx.no();
        msg(first + (bad.length > 1 ? ' He shakes his head at ' + (bad.length === 2 ? 'one other pin too.' : (bad.length - 1) + ' other pins too.') : ''));
        return;
      }
      var cand = PINS.map(function (p) { return p[0] + ':' + at[p[0]].g; }).join('-');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('Something is wrong with the pins: tell your teacher.'); return; }
      lock = true; nextFile = file; ER.flag('o-file', file); go.disabled = true;
      msg('He walks to the far side of the room, and then to the door, and looks back. &ldquo;Yes,&rdquo; he says. &ldquo;Even the gentlemen at the back will see it.&rdquo;');
      setTimeout(function () { ER.closeAll(); after(); }, 2600);
    });
    b.first = function () { msg('&ldquo;Five pins. Three in the middle script, two in the sacred signs. The slip under the sheet is the end of the Greek, word for word. Count, and keep to the order.&rdquo;'); };
    return b;
  }
  function openLock() {
    var fresh = !box; if (!box) box = build();
    inLock = true; ER.open('ov-lock', box, function () { inLock = false; });
    if (fresh) box.first();
  }
  function after() {
    busy = true; inLock = false; falling = true;
    ST.mine('pins', 'The pins on the proof', '<p>In the middle script: <b>KING</b> is the group that comes four times, <b>PTOLEMY</b> the one that comes three times, always just after KING, <b>TEMPLE</b> the one that comes twice, in the places where the slip has it. M. Sautel took KING for PTOLEMY.</p><p>In the sacred signs: the <b>long ring</b> is PTOLEMY with his full title; the <b>short rings</b> are PTOLEMY alone:</p><p class="sgrow">' + ST.ring(ST.PTOL, 50) + '</p>', true);
    ER.narrate([
      'M. Champollion-Figeac takes a pencil and adds a small mark of his own, among the sacred signs, between the long ring and the next one. &ldquo;And one for the gentlemen who like a puzzle. Where the Greek says BIRTHDAY, a group that begins with a sign like three skins tied together. Nobody knows what sound it makes.&rdquo;',
      'Then there are running feet on the stairs. The door flies open. A young man with black curly hair and no hat stands there, out of breath, with a roll of drawings under his arm.',
      '&ldquo;<span class="fr">Je tiens l&rsquo;affaire!</span>&rdquo; he cries. I&rsquo;ve got it! He takes two steps towards his brother. Then his knees fold, and he goes down on the floor like a coat falling off a peg.',
      'For a moment nobody moves. Then M. Champollion-Figeac is on his knees beside him, loosening his cravat, and Zélie is running for water. &ldquo;Day and night,&rdquo; says his brother, to nobody. &ldquo;Day and night, all week.&rdquo;',
      'He is breathing. The doctor, when he comes, says what the brother has already said: bed, and quiet, for five days at least, and no pencils. Two porters carry him home round the corner to the rue Mazarine.',
      'His drawings are all over the floor. You pick them up, every one. The top one is a ring of signs copied from some temple, and the first sign in it is a circle with a dot in the middle. You give them all to his brother.',
      '&ldquo;Come to the rue Mazarine tomorrow, both of you,&rdquo; he says. &ldquo;Bring your pencils. If my brother cannot hold his, somebody must.&rdquo;'
    ], function () {
      ER.addClue('birth', 'The birthday sign', '<h4>The birthday sign</h4>' + ST.BIRTH, 'card', 'Pencilled on the proof');
      ST.learn('cartouche'); busy = false; falling = false; paint();
    });
    paint();
  }
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; ER.leave(nextFile);
  });
})();
</script>
</body>
</html>
