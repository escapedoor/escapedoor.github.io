<style>
  body{--bg:#2a1a1a;--accent:#ffb070;--font-display:'Cinzel',serif;--font-ui:'Cinzel',serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(34,20,20,.96);--tc-ink:#f6eadc;--cap-bg:rgba(36,22,22,.94);--panel:#2e1e1e;--face-bg:#4a2e2a;--q-ink:#ffc890;--fade:#0a0606;--hud-bg:rgba(36,22,22,.84)}
  .lb{font-family:'Cinzel',serif;font-weight:700;text-anchor:middle;letter-spacing:.1em}
  #steam path{animation:st 3s steps(6,end) infinite}
  #steam path+path{animation-delay:-1.5s}
  @keyframes st{0%{opacity:0;transform:translateY(0)}30%{opacity:.6}100%{opacity:0;transform:translateY(-34px)}}
  #glowL,#glowR{animation:lamp 5s steps(1,end) infinite}
  #glowR{animation-delay:-2s}
  @keyframes lamp{0%{opacity:1}60%{opacity:.85}62%{opacity:1}}
  #sunset{animation:sink 60s linear forwards}
  @keyframes sink{to{transform:translateY(60px)}}
  #table.ready{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-5px)}}

  /* reading two rings */
  .rd{display:grid;grid-template-columns:minmax(0,800px) 210px;gap:18px;width:min(1030px,97vw);align-items:start}
  .rd-p{padding:10px 14px 10px;background:#f6efe0;color:#2a2116;box-shadow:0 18px 44px rgba(0,0,0,.6);border:1px solid #c9b48a;margin-bottom:10px}
  .rd-p.off{opacity:.38;pointer-events:none}
  .rd-p.done{opacity:.8;pointer-events:none}
  .rd-p h6{margin:0 0 4px;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.14em;color:#7a3a24}
  .rd-p > svg{display:block;width:100%;height:auto;color:#2a2116}
  .rd .slot rect{fill:#fbf7ea;stroke:#8a6a3a;stroke-width:1.5}
  .rd .slot text{font-family:'Cinzel',serif;font-weight:700;font-size:19px;fill:#2a2116;text-anchor:middle}
  .rd .slot{cursor:pointer}
  .rd .slot.on rect{stroke:#ff8a3a;stroke-width:3}
  .rd .slot.ok rect{fill:#dcecd2;stroke:#3d6b34}
  .rd .slot.no rect{fill:#f6d6cf;stroke:#b3261c}
  .rd-n{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-family:'EB Garamond',serif;font-size:15px}
  .rd-n > span{font-style:italic;color:#5a4a30;margin-right:4px}
  .rd-n button,.rd-c button{padding:4px 9px;border:1px solid #8a7a5a;background:#fbf7ea;font-family:'EB Garamond',serif;font-size:14.6px;color:#22201b;cursor:pointer;border-radius:2px;text-align:left}
  .rd-n button.on,.rd-c button.on{background:#22201b;color:#fbf7ea}
  .rd-n button.ok,.rd-c button.ok{background:#2d6a34;color:#fff;border-color:#2d6a34}
  .rd-n button.no,.rd-c button.no{background:#9a2a1c;color:#fff;border-color:#9a2a1c}
  .rd-n .gk{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em}
  .rd-cs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
  .rd-c{display:flex;flex-direction:column;gap:3px;align-items:stretch}
  .rd-c > div{display:flex;justify-content:center;height:48px;align-items:center;color:#2a2116}
  .rd-c button{font-size:13.6px;line-height:1.15;padding:4px 6px}
  .rd-btns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  @media (max-width:900px){.rd{grid-template-columns:1fr}.rd-cs{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, box = null, inLock = false, stage = 0;

  ER.init({
    theme: 'history', story: 'stone', storyTitle: 'Sign by Sign', id: 'cafe', no: 'V', title: 'The Café by the Bridge',
    go: 'Sit down', back: '../index.html', backLabel: 'Archive',
    intro: [
      'At the press every sign went into the row of its sound. The half-loaf and the hand both went under T: one sound can have two signs, as French writes K with C, K or QU. The egg went to the bottom row. It is not a sound but a sign of meaning, and it says that the name is a woman&rsquo;s; the half-loaf before it is the T that Egyptian puts on words for women, as Coptic still says <i>t-shime</i>, the woman.',
      'Under the printed table in the portfolio there is a café bill for three coffees, with a ring of signs drawn on the back of it in pencil.',
      'Then it is Friday 20 September 1822, five o&rsquo;clock in the afternoon, and the sun is low over the river.'
    ],
    exit: {"next":"academy","w":{"8cf1548d":"2c29da16"}}, tags: {"al":["03cd31ec","13776602","b9445a38","37ec9c04","5c3b5a1a","1b950f27","feea5420","9d10f4b7","488a9c05","f85a40a6","7faea5af","90a20965"],"an":["589cff94"],"rs":["37742af0","12d1da68","6c9fdf89","f7ded8b2"],"rn":["ff8c81eb"],"rm":["7219f21c"]},
    hints: hints, onBegin: begin
  });
  nextFile = ER.flag('c-file') || null;
  stage = ER.flag('c-st') || 0;

  function isBusy() { return busy; }
  function ready() { return ER.flag('c-kar') && ER.flag('c-huy') && ER.flag('c-kin'); }
  function paint() {
    $('#table').classList.toggle('ready', !!ready() && !nextFile);
    ER.pips(nextFile ? 2 : stage, 2);
    if (nextFile) $('#go').classList.add('on');
  }
  function hints() {
    if (nextFile) return ['go', ['Both rings are read. Use the button at the bottom of the screen.']];
    if (inLock && stage === 0) return ['karnak', [
      'Read the ring from Karnak with your plate (it is in your notebook): give each sign you know its letter. Two signs are new: leave them for now.',
      'You will have A, L, ?, S, a vowel, ?, T, R, S. Which of the Greek names on the Rosetta Stone fits that? The card about the stone lists them.',
      'ALEXANDROS: A-L-E-X-A-N-D-R-O-S, and X is K and S together. Let the name give the two new signs their letters. And the hand stands for the Greek D here: it is a sound between our T and D.'
    ]];
    if (inLock) return ['huyot', [
      'This ring is not a Greek name. Read each sign in the way it works: some signs are sounds, some are words. Your notebook has the birthday sign and the Coptic grammar.',
      'The sun is a picture, and in Coptic the sun is RĒ: the name of the sun god, Ra. The three skins stand where the Greek of the stone says BIRTHDAY, and Coptic MISE means to give birth.',
      'Ra, mes, s, s. Which of the old kings in Madame Usson&rsquo;s little history has a name like that?'
    ]];
    if (!ready()) return ['read', [
      'Three things on the table to read first: the ring from Karnak, the drawing from Abu Simbel, and the little history of Egypt from Madame Usson.',
      'The drawings are the two papers on the marble table; the history is the small blue book on the right of it. Then click the table.'
    ]];
    return ['table', ['Click the marble table to read the two rings.']];
  }

  function begin() {
    paint();
    ST.need('stone', 'How to read the copy of the stone', ST.STONE, 'card', 'Pinned to the easel');
    ST.need('birth', 'The birthday sign', '<h4>The birthday sign</h4>' + ST.BIRTH, 'card', 'Pencilled on the proof');
    ST.need('coptic', 'A grammar of the Coptic tongue', ST.COPTIC, 'print', 'From Madame Usson');
    if (!ST.has('plate')) ST.mine('plate', 'The plate of sound signs', '<p>A ' + ST.sign('a', 24) + ' &middot; E ' + ST.sign('i', 24) + ' &middot; I ' + ST.sign('ii', 24) + ' &middot; K ' + ST.sign('q', 24) + ' &middot; L ' + ST.sign('l', 24) + ' &middot; M ' + ST.sign('m', 24) + ' &middot; O ' + ST.sign('o', 24) + ' &middot; P ' + ST.sign('p', 24) + ' &middot; R ' + ST.sign('r', 24) + ' &middot; S ' + ST.sign('s', 24) + ' &middot; T ' + ST.sign('t', 24) + ST.sign('d', 24) + '</p><p>no sound: ' + ST.sign('egg', 24) + ' (a woman)</p>', true);
    if (ER.flag('c-in')) { busy = false; ER.say(nextFile ? 'The café. The light is going, and the lamps are lit.' : 'The café by the bridge. M. Champollion-Figeac is stirring his coffee and not drinking it.'); return; }
    ST.learn('café');
    ER.narrate([
      'The café at the end of the bridge is full of the five o&rsquo;clock noise: cups, newspapers, men arguing about the price of bread and the government. Behind the counter a lady in a blue dress takes the money and misses nothing.',
      'M. Champollion-Figeac has a table by the window. He looks as if he has slept for the first time in a week. &ldquo;My brother is better,&rdquo; he says. &ldquo;Better enough to be impossible. He has sent you these.&rdquo;',
      'He lays two drawings on the marble. One is a ring copied from a temple wall at Karnak, with a question mark under it. The other is the drawing you picked up off the office floor on Saturday: the ring that begins with a circle with a dot in the middle.',
      '&ldquo;He says: if you can read both, you will know why he fell down.&rdquo;'
    ], function () { busy = false; ER.flag('c-in', 1); paint(); });
  }

  $('#karnak').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.read({ html: ST.KARNAK, cls: 'card', clue: { id: 'karnak', title: 'A ring from Karnak', kind: 'Drawing, on the table' }, done: function () { ER.flag('c-kar', 1); paint(); } });
  });
  $('#huyot').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.read({ html: ST.HUYOT, cls: 'card', clue: { id: 'huyot', title: 'From a temple far up the Nile', kind: 'Drawing, on the table' }, done: function () { ST.learn('temple'); ER.flag('c-huy', 1); paint(); } });
  });
  $('#kings').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.read({ html: ST.KINGS, cls: 'print', clue: { id: 'kings', title: 'The old kings, as the Greeks wrote them', kind: 'From Madame Usson' }, done: function () { ER.flag('c-kin', 1); paint(); } });
  });
  $('#table').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Two rings, both read. The coffee has gone cold, and nobody minds.'); return; }
    if (!ready()) { ER.say('First read what is on the table: the ring from Karnak, the drawing from Abu Simbel, and the little blue history.'); return; }
    openLock();
  });
  $('#zelie').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Ra,&rdquo; says Zélie, very quietly, to the window. &ldquo;Mes. Ses.&rdquo;'); return; }
    ER.talk({ who: 'Zélie Thorel', role: 'Madame Thorel’s niece, fifteen', face: ST.FACE('zelie'), lines: [
      '&ldquo;The Karnak ring has two signs we have never seen: a bowl with a handle, and a zigzag like water. But we know the rest. Seven signs out of nine. That is more than I usually know of a Latin lesson.&rdquo;',
      { q: 'And the other ring?', a: '&ldquo;Only four signs, and only one of them is on our plate: the folded cloth, twice. The circle with the dot is not a sound we have. Nor are the three skins. Unless they are not sounds.&rdquo;' },
      { q: 'What do you mean?', a: '&ldquo;M. Sautel says each picture is a word. On Sunday that was nonsense: the lion was an L. But a picture of the sun has to mean something. Perhaps some pictures are pictures after all.&rdquo;' }
    ], clue: { id: 'zelie5', title: 'Zélie, about the two rings', kind: 'What she said' } });
  });
  $('#jj').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'M. Champollion-Figeac', role: 'Jacques-Joseph, the elder brother', face: ST.FACE('jj'), lines: [
      '&ldquo;The drawing with the circle came on Saturday morning. M. Huyot, an architect, made it at a temple in Nubia, at Abu Simbel, far up the Nile. My brother read it, and then he ran.&rdquo;',
      { q: 'Why does it matter so much?', a: '&ldquo;Because that temple is far older than any Greek in Egypt. Ptolemy, Cleopatra, Alexander: those are Greek names, written by Egyptians for their foreign rulers. Dr Young believes that is the only time the sound signs were used. If an old Egyptian king&rsquo;s name can be read the same way, Dr Young is wrong about that, and the whole of the writing can be read.&rdquo;' },
      { q: 'How can a sign be a word?', a: '&ldquo;Ask your grammar. My brother has been reading Coptic since he was sixteen: he says the old words are still in it, like coins in a wall.&rdquo;' }
    ], clue: { id: 'jj5', title: 'M. Champollion-Figeac, about the old king', kind: 'What he said' } });
  });
  ST.thing('#window', null, 'The sun is low over the river, downstream, and the river has turned the colour of the inside of a shell.', isBusy);
  ST.thing('#mirror', null, 'The big mirror doubles the lamps, the cups and the arguments.', isBusy);
  ST.thing('#paper', null, 'Today&rsquo;s paper on its stick. Nothing in it about Egypt. Nothing in it about anything, says the man at the next table.', isBusy);
  ST.thing('#till', null, 'The lady at the till. She has heard every argument in Paris twice, and charges for the second hearing.', isBusy);

  /* ---------- the lock: a new name, then an old king ---------- */
  var LET = ['A', 'D', 'E', 'I', 'K', 'L', 'M', 'N', 'O', 'P', 'R', 'S', 'T'];
  var NAMES = [['ars', 'ARSINOE'], ['alex', 'ALEXANDROS'], ['ber', 'BERENIKE'], ['ptol', 'PTOLEMAIOS']];
  var COLS = [
    [['r', 'R, a sound'], ['re', 'R&Emacr;: the sun, and the sun god&rsquo;s name, Ra'], ['ring', 'a picture of a ring: &ldquo;king&rdquo;']],
    [['m', 'M, a sound'], ['ms', 'MS: to give birth (the birthday sign)'], ['tails', 'a picture of three tails: &ldquo;an animal&rdquo;']],
    [['s', 'S, a sound'], ['t', 'T, a sound'], ['x', 'no sound: a sign of meaning']],
    [['s', 'S, a sound'], ['t', 'T, a sound'], ['x', 'no sound: a sign of meaning']]
  ];
  var KN = [['amen', 'Amenophis'], ['thout', 'Thoutmosis'], ['ram', 'Ramesses'], ['ses', 'Sesostris'], ['psam', 'Psammetichus']];
  var MEAN = [['bore', 'Ra is the one who bore him: a child of the sun.'], ['sunk', 'The sun is king.'], ['anim', 'The animals of the sun.']];
  function build() {
    var b = ER.el('div', 'rd'), lock = false, val = {}, pick = null, nm = '', rs = {}, rn = '', rm = '';
    var SC = 1.22, X0 = 16, Y0 = 8, r = ST.ringG(ST.ALEX, { gap: 8 });
    var xs = r.at.map(function (x) { return X0 + x * SC; });
    var svg = '<svg viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg"><g transform="translate(' + X0 + ' ' + Y0 + ') scale(' + SC + ')">' + r.svg + '</g><g id="slA"></g></svg>';
    b.innerHTML = '<div><div class="rd-p" id="pA"><h6>I. The ring from Karnak. Click a box, then a letter. Then choose the name.</h6>' + svg +
      '<div class="lp" id="lp"></div><div class="rd-n" id="nA"><span>It is the name of:</span>' + NAMES.map(function (n) { return '<button type="button" class="gk" data-v="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="rd-p off" id="pB"><h6>II. The ring from Abu Simbel. How does each sign work?</h6><div class="rd-cs">' +
      ST.RAMS.map(function (k, i) { return '<div class="rd-c" data-i="' + (i + 1) + '"><div>' + ST.sign(k, 44) + '</div>' + COLS[i].map(function (o) { return '<button type="button" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>'; }).join('') + '</div>' +
      '<div class="rd-n" id="nB"><span>The king is:</span>' + KN.map(function (n) { return '<button type="button" data-v="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</div>' +
      '<div class="rd-n" id="mB"><span>His name means:</span>' + MEAN.map(function (n) { return '<button type="button" data-v="' + n[0] + '">' + n[1] + '</button>'; }).join('') + '</div></div></div>' +
      '<div class="lk-side"><div class="lk-face">' + ST.FACE('jj') + '</div><h6 class="lk-h">M. Champollion-Figeac</h6><p class="pmsg"></p>' +
      '<div class="rd-btns"><button type="button" class="btn" id="rd-go">Read it to him</button></div></div>';
    var msgEl = b.querySelector('.pmsg'), go = b.querySelector('#rd-go'), lp = b.querySelector('#lp'), pA = b.querySelector('#pA'), pB = b.querySelector('#pB');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function drawSlots(on) {
      b.querySelector('#slA').innerHTML = xs.map(function (x, k) {
        var v = val[k + 1] || '';
        return '<g class="slot' + (on === k + 1 ? ' on' : '') + '" data-i="' + (k + 1) + '" transform="translate(' + (x - 15) + ' ' + (Y0 + 62 * SC + 6) + ')"><rect width="30" height="30" rx="3"/><text x="15" y="22">' + v + '</text></g>';
      }).join('');
      ER.$$('#slA .slot', b).forEach(function (n) {
        n.addEventListener('click', function () {
          if (lock || stage) return;
          pick = +n.getAttribute('data-i'); drawSlots(pick);
          lp.innerHTML = '<span class="lp-l">Karnak, sign ' + pick + ':</span>' + LET.map(function (l) { return '<button type="button" data-l="' + l + '">' + l + '</button>'; }).join('');
          ER.$$('button', lp).forEach(function (bt) { bt.addEventListener('click', function () { if (!pick || lock) return; val[pick] = bt.getAttribute('data-l'); ST.sfx.pencil(); drawSlots(pick); }); });
        });
      });
    }
    function group(sel, set) {
      ER.$$(sel + ' button', b).forEach(function (bt) {
        bt.addEventListener('click', function () {
          if (lock) return;
          set(bt.getAttribute('data-v'));
          ER.$$(sel + ' button', b).forEach(function (o) { o.classList.remove('on', 'ok', 'no'); }); bt.classList.add('on'); ST.sfx.pencil();
        });
      });
    }
    group('#nA', function (v) { nm = v; });
    group('#nB', function (v) { rn = v; });
    group('#mB', function (v) { rm = v; });
    ER.$$('.rd-c', b).forEach(function (c) { var i = c.getAttribute('data-i'); group('.rd-c[data-i="' + i + '"]', function (v) { rs[i] = v; }); });
    function slotMark(i, ok) { var n = b.querySelector('#slA .slot[data-i="' + i + '"]'); if (n) { n.classList.remove('on'); n.classList.add(ok ? 'ok' : 'no'); } }
    function markBtn(sel, v, ok) { var bt = b.querySelector(sel + ' button[data-v="' + v + '"]'); if (bt) { bt.classList.remove('on'); bt.classList.add(ok ? 'ok' : 'no'); } }
    go.addEventListener('click', function () {
      if (lock) return;
      if (!stage) {
        var miss = 0, i; for (i = 1; i <= 9; i++) if (!val[i]) miss++;
        if (miss) { msg('&ldquo;Every box needs a letter. If a sign is new to you, find the name first. The name will tell you.&rdquo;'); return; }
        if (!nm) { msg('&ldquo;And whose name is it? Choose one of the four.&rdquo;'); return; }
        drawSlots(0);
        var first = '', nb = 0;
        for (i = 1; i <= 9; i++) { var ok = ER.check('al', i + ':' + val[i]); slotMark(i, ok); if (!ok) { nb++; if (!first) first = whyA(i); } }
        var okn = ER.check('an', nm); markBtn('#nA', nm, okn);
        if (!okn) { nb++; first = whyName(nm); }
        if (nb) { ST.slip(); ER.sfx.no(); msg(first + (nb > 1 ? ' (' + nb + ' things are wrong.)' : '')); return; }
        stage = 1; ER.flag('c-st', 1); ER.flag('c-a', [val[3], val[6]].join('-') + '|' + nm); pA.classList.add('done'); pB.classList.remove('off'); lp.innerHTML = ''; ER.sfx.ok(); paint();
        msg('&ldquo;Alexander. A name you had never seen in signs, read with the signs of two other names, and two new signs found besides: the basket is a K, the water an N. That is how my brother read a whole list of them. Now the other ring.&rdquo;');
        return;
      }
      if ([1, 2, 3, 4].some(function (k) { return !rs[k]; }) || !rn || !rm) { msg('&ldquo;Every sign, the king, and what his name means. All of it.&rdquo;'); return; }
      var bad = '', n2 = 0;
      [1, 2, 3, 4].forEach(function (k) { var ok = ER.check('rs', k + ':' + rs[k]); markBtn('.rd-c[data-i="' + k + '"]', rs[k], ok); if (!ok) { n2++; if (!bad) bad = whyR(k, rs[k]); } });
      var okk = ER.check('rn', rn); markBtn('#nB', rn, okk); if (!okk) { n2++; if (!bad) bad = '&ldquo;Read what the signs give you, in order, and say it aloud. Which of the old kings in the little history sounds like that?&rdquo;'; }
      var okm = ER.check('rm', rm); markBtn('#mB', rm, okm); if (!okm) { n2++; if (!bad) bad = '&ldquo;Put the two words together: the sun god Ra, and to give birth. What does a name like that say about the king?&rdquo;'; }
      if (n2) { ST.slip(); ER.sfx.no(); msg(bad + (n2 > 1 ? ' (' + n2 + ' things are wrong.)' : '')); return; }
      var cand = ER.flag('c-a') + '|' + [1, 2, 3, 4].map(function (k) { return rs[k]; }).join('-') + '|' + rn + '|' + rm;
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('Something is wrong with the rings: tell your teacher.'); return; }
      lock = true; nextFile = file; ER.flag('c-file', file); go.disabled = true;
      msg('He reads your answers, and then he reads the ring himself, under his breath. His hand is not quite steady on the cup.');
      setTimeout(function () { ER.closeAll(); after(); }, 2600);
    });
    function whyA(i) {
      var k = ST.ALEX[i - 1];
      if (k === 'k' || k === 'n') return nm === 'alex' ? '&ldquo;The name is right. Now let the Greek fill the gaps: which letter of ALEXANDROS stands where ' + ST.NAME[k] + ' is? Remember that X is K and S together.&rdquo;' : '&ldquo;' + ST.NAME[k].charAt(0).toUpperCase() + ST.NAME[k].slice(1) + ' is new. Find the name first, and let it tell you.&rdquo;';
      if (k === 'd') return '&ldquo;The hand. On your plate it is a T. Here the Greek has a D in that place: the hand stands for a sound between the two.&rdquo;';
      return '&ldquo;' + ST.NAME[k].charAt(0).toUpperCase() + ST.NAME[k].slice(1) + ' is on your plate. What sound did it have there?&rdquo;';
    }
    function whyName(v) {
      if (v === 'ptol') return '&ldquo;Ptolemy&rsquo;s ring begins with the square, and this one with the vulture. Read your letters again.&rdquo;';
      if (v === 'ber') return '&ldquo;BERENIKE begins with B, and has no L. And no queen&rsquo;s ring ends without the half-loaf and the egg.&rdquo;';
      return '&ldquo;ARSINOE has no L, and no K and S together. And a queen&rsquo;s ring would end with the half-loaf and the egg.&rdquo;';
    }
    function whyR(k, v) {
      if (k === 1) return v === 'r' ? '&ldquo;An R, and then? A circle with a dot is a picture of the sun. What is the sun in Coptic? Look in the grammar.&rdquo;' : '&ldquo;A ring is drawn round the whole name, not inside it. The circle with the dot is the sun.&rdquo;';
      if (k === 2) return v === 'm' ? '&ldquo;Only M? You have seen this sign before: on the proof, where the Greek of the stone says BIRTHDAY. What is to give birth in Coptic?&rdquo;' : '&ldquo;M. Sautel would say so: each picture is a word. But you have seen this sign on the proof, where the Greek of the stone says BIRTHDAY.&rdquo;';
      return '&ldquo;The folded cloth is on your plate. What sound did it have in Ptolemy?&rdquo;';
    }
    b.first = function () {
      drawSlots(0);
      if (stage) { pB.classList.remove('off'); msg('&ldquo;Alexander is read. Now the other ring.&rdquo;'); }
      else msg('&ldquo;Read the ring from Karnak with your plate. Two of its signs you have never seen. My brother says that does not matter, if you know whose name it is.&rdquo;');
    };
    return b;
  }
  function openLock() {
    var fresh = !box; if (!box) box = build();
    inLock = true; ER.open('ov-lock', box, function () { inLock = false; });
    if (fresh) box.first();
  }
  function after() {
    busy = true; inLock = false;
    ST.mine('names', 'From names to words', '<p class="sgrow">' + ST.ring(ST.ALEX, 40) + '</p><p>A &middot; L &middot; <b>K</b> &middot; S &middot; (a vowel) &middot; <b>N</b> &middot; D &middot; R &middot; S: <b>ALEXANDROS</b>. Two new signs: the basket K, the water N.</p>' +
      '<p class="sgrow">' + ST.ring(ST.RAMS, 40) + '</p><p>the sun, <b>R&Emacr;</b> (a word: the god Ra) &middot; <b>MS</b>, to give birth (the birthday sign; Coptic <i>mise</i>) &middot; S &middot; S: <b>RAMESSES</b>, &ldquo;Ra is the one who bore him&rdquo;.</p>' +
      '<p>An old Egyptian king, long before the Greeks, written with <b>sound signs and word signs together</b>.</p>', true);
    ER.narrate([
      '&ldquo;Ra,&rdquo; says Zélie. &ldquo;Mes. S, S. Ramesses.&rdquo; She says it again, as if it might go away if she stopped. &ldquo;That is not a Greek. That is one of the old kings, from long before Alexander.&rdquo;',
      'M. Champollion-Figeac sits very still. &ldquo;Yes. That is what my brother read on Saturday morning, before he ran to my office. The sun is a picture and a word: Ra. The skins are the sound of a word, mes, to give birth: the Rosetta Stone has the sign where the Greek says birthday, and Coptic still says <i>mise</i>. And the S is the same folded cloth as in Ptolemy. Pictures and sounds, in one name.&rdquo;',
      '&ldquo;Then Dr Young was wrong,&rdquo; says Zélie. &ldquo;The sound signs are not only for foreigners.&rdquo; &ldquo;Dr Young was right about Ptolemy,&rdquo; says M. Champollion-Figeac, &ldquo;and nobody before him got so far. M. Sautel was wrong about the lion, and right that some pictures mean what they show: the sun means the sun. Everybody had a piece. My brother has put the pieces together.&rdquo;',
      'He pays for the coffee. &ldquo;The letter is nearly finished. It is about the sound signs in the names of the Greek and Roman rulers: that much he can prove to the Académie, sign by sign, with your plate. The old kings and the rest of it, he says, will take him a book.&rdquo; He stands up. &ldquo;Friday next, at the Institut. Bring the plates.&rdquo;'
    ], function () { ST.learn('sign of meaning', 'word sign'); busy = false; paint(); });
    paint();
  }
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; ER.leave(nextFile);
  });
})();
</script>
</body>
</html>
