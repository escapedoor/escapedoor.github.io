    if (!told.lyle) return ['lyle', ['Somebody labelled bundles of photos over lunch.', 'Lyle, under the roof on the left, by the blue crate, with his lunch and the cat.']];
    if (!told.jaz) return ['jaz', ['Jaz is waiting at the yard office.', 'The yard office is the grey-blue cabin on the right. Jaz is out in the rain beside it.']];
    if (!told.manual) return ['manual', ['Jaz said a page of the manual is on the office wall.', 'Page fifteen is on the yard office wall, between the window and the door.']];
    return ['window', ['Everything is ready inside the yard office.', 'Click the yard office window, where the light table glows.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Ninety cards in the drawer, thirty of each. The kit is learning.'); return; }
    if (told.inn) { busy = false; ER.say('The bale yard. Rain on the roof, and the clock on the office wall.'); return; }
    tell('inn');
    ER.narrate([
      'Under the high roof the bales stand in rows, each one tied with wire and taller than you. In the sides of three of them, something blue shows through the paper.',
      'Out in the rain, the yard office is a grey-blue cabin with a window, and through the window a white glow: a light table. A letter is taped to the office door. Somebody has written 4 p.m.! on it in red.',
      'Lyle stands under the roof, out of the rain, eating a pork pie. A grey cat sits on the blue crate beside him and watches the pie.'
    ], function () { busy = false; });
  }

  $('#lyle').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Thirty of each,&rdquo; says Lyle. &ldquo;Fair&rsquo;s fair. Even the crisp packets get a say.&rdquo;'); return; }
    if (told.lyle) { var L = ['&ldquo;Gubbins,&rdquo; says Lyle to the cat. &ldquo;Nobody asked you.&rdquo;', '&ldquo;Checked labels,&rdquo; says Lyle. &ldquo;Not the agency lad&rsquo;s.&rdquo;']; ER.say(L[lyleN++ % L.length]); return; }
    ER.talk({
      who: 'Lyle Hepple', role: 'Picker · on his lunch break', face: SR.face('lyle'),
      lines: [
        { note: 'Gina has told him. He is nearly smiling.', a: '&ldquo;We did bundles,&rdquo; says Lyle. &ldquo;Jaz took the photos, I wrote the labels, she checked mine and I checked her checking. Ten photos to a bundle. Every kind of thing we could find on the belt.&rdquo;' },
        { q: 'Are they all checked?', a: '&ldquo;All of ours. There&rsquo;s one bundle on that shelf from September that the agency lad labelled on his own, on his last afternoon. Nobody checked it. I had a look at lunch. He&rsquo;s labelled two cans PAPER. He was in a hurry for his bus.&rdquo;' },
        { q: 'What should the Eye learn from?', a: 'Everything it&rsquo;s going to meet. Shiny cans and dull ones. Shiny paper and dull paper. Card, crisp packets, cartons, the lot. Show it one sort of can and it learns that sort of can. Show it all sorts, and it has to learn what a can is.' },
        { q: 'Is the belt really mostly paper?', a: '&ldquo;Nine-tenths paper, most days. Always has been. That&rsquo;s not the Eye&rsquo;s fault. But it doesn&rsquo;t have to learn nine-tenths paper as well.&rdquo;' },
        { a: '&ldquo;Gubbins,&rdquo; says Lyle to the cat, who has moved closer to the pie. &ldquo;Nobody asked you.&rdquo;' }
      ],
      clue: { id: 'lyle4', title: 'Lyle: every kind it will meet', kind: 'What he said' },
      done: function (seen) { if (seen && tell('lyle')) { paint(); ER.say('Checked labels, every kind of thing. Jaz is at the yard office.'); } }
    });
  });

  $('#jaz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Fifty-five minutes, it says,&rdquo; says Jaz. &ldquo;Then we test it on our ten.&rdquo;'); return; }
    if (told.jaz) { var J = ['&ldquo;Page fifteen,&rdquo; says Jaz. &ldquo;On the office wall. Then the light table.&rdquo;', '&ldquo;Count first,&rdquo; says Jaz. &ldquo;Then choose.&rdquo;']; ER.say(J[jazN++ % J.length]); return; }
    ER.talk({
      who: 'Jaz Iqbal', role: 'Maintenance apprentice · wet', face: SR.face('jaz'),
      lines: [
        { a: '&ldquo;Ilona&rsquo;s fifty are on the light table,&rdquo; says Jaz. &ldquo;I tipped them out of the drawer. Before we put anything new in, I want to count what she gave it.&rdquo;' },
        { q: 'Why count?', a: '&ldquo;Because her log says forty-five paper, four cans and one other, and I&rsquo;d like to see that with my own eyes. And because page fifteen says count. It&rsquo;s on the office wall.&rdquo;' },
        { q: 'Then what?', a: 'Then we fill the drawer again. It takes ninety cards: nine bundles of ten. We choose them from the shelf. The Eye learns from whatever we put in, and from nothing else, so think.' },
        { a: '&ldquo;It takes about an hour to learn,&rdquo; says Jaz. &ldquo;If we want it back on the belt before the lorry, we get the drawer right first time. Or second.&rdquo;' }
      ],
      clue: { id: 'jaz4', title: 'Jaz: nine bundles of ten', kind: 'What she said' },
      done: function (seen) { if (seen && tell('jaz')) { paint(); ER.say('Page fifteen on the office wall. Then the light table, through the window.'); } }
    });
  });

  var MANUAL = '<div class="band"></div><div class="hd"><span>GANNAWAY EYE &middot; OPERATOR&rsquo;S MANUAL</span><span>15</span></div>' +
    '<h4>Choosing examples</h4><div class="two"><div>' +
    '<p>The Eye learns the patterns in what you give it, and nothing else.</p>' +
    '<p><b>Count each class.</b> A class is one kind of label: PAPER, CAN or OTHER. If 90 of every 100 examples are paper, an Eye that says PAPER every time, without looking, is right 90 times in 100. Its score looks good, and it is useless.</p>' +
    '</div><div class="fig"><svg viewBox="0 0 270 150" width="270" height="150"><path d="M70 20v20M20 40h100" stroke="#1b1d20" stroke-width="4"/><path d="M20 40l-14 40h28zM120 40l-14 30h28z" fill="none" stroke="#1b1d20" stroke-width="3"/>' +
    '<rect x="6" y="80" width="28" height="30" fill="#e9d9a6"/><text x="20" y="128" text-anchor="middle" font-family="Roboto Mono" font-size="11" fill="#1b1d20">45</text><rect x="110" y="62" width="20" height="8" fill="#9fb4c4"/><text x="120" y="96" text-anchor="middle" font-family="Roboto Mono" font-size="11" fill="#1b1d20">5</text>' +
    '<path d="M200 20v20M150 50h100" stroke="#1b1d20" stroke-width="4"/><g fill="#e9d9a6"><rect x="150" y="60" width="26" height="26"/></g><rect x="187" y="60" width="26" height="26" fill="#9fb4c4"/><rect x="224" y="60" width="26" height="26" fill="#c9e0b8"/>' +
    '<text x="200" y="110" text-anchor="middle" font-family="Roboto Mono" font-size="11" fill="#1b1d20">30 · 30 · 30</text><text x="70" y="146" text-anchor="middle" font-family="Roboto Mono" font-size="10" fill="#5a6066">lopsided</text><text x="200" y="146" text-anchor="middle" font-family="Roboto Mono" font-size="10" fill="#5a6066">balanced</text></svg><small>Fig. 15a: count, then balance</small></div></div>' +
    '<p><b>Balance.</b> Give it about the same number of examples of each class. <b>Variety.</b> In each class, give it every kind of thing it will meet: every colour, shiny and matt, crushed and not. Otherwise it may lean on a feature that just happened to be true of your examples.</p>' +
    '<p><b>Checked labels only.</b> A wrong label teaches a wrong lesson. <b>Never train on your test examples.</b></p>' +
    '<div class="pg">Gannaway Robotics &middot; EYE-3 &middot; page 15 of 40</div>';
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'sr-manual', clue: { id: 'manual15', title: 'Manual, page 15: choosing examples', kind: 'On the office wall' }, done: function () {
      SR.terms(['class', 'lopsided', 'balanced', 'variety']);
      if (tell('manual')) { paint(); ER.say('Count each class. Balance. Variety. Checked labels only. Never train on your test examples.'); }
    } });
  });
  var LETTER = '<h4>Jebb&rsquo;s Mill</h4><h5>PAPER FOR RECYCLING &middot; SINCE 1921</h5><p>Dear Mrs Hulme,</p>' +
    '<p>In Friday&rsquo;s load from Kilverley (15 bales) we found drinks cans in 11 of the bales: 31 cans in all, every one of them aluminium, and blue.</p>' +
    '<p>Metal in our pulper damages the screens and stops the paper machine. I am afraid we have sent the load back to you.</p>' +
    '<p>If the next load has metal in it, we shall have to stop taking paper from Kilverley. Our lorry will call on Tuesday at 4 p.m. as usual.</p>' +
    '<p>Yours sincerely,<br>L. Jebb (Mrs), Mill Manager</p>';
  $('#letter').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LETTER, cls: 'sr-letter', clue: { id: 'letter', title: 'The letter from Jebb&rsquo;s Mill', kind: 'Taped to the door' }, done: function () {
      SR.terms(['contamination']);
      if (tell('letter')) ER.say('Thirty-one cans in eleven bales. Every one aluminium, and blue. The lorry at four.');
    } });
  });
  var PPOSTER = '<h4>Paper goes round five to seven times</h4><p>Paper is made of tiny wood <b>fibres</b>. Each time paper is recycled, the fibres get a little shorter and weaker. After about five to seven times round, they are too short to hold together, and the mill has to mix in some new fibre.</p>' +
    '<p>So keep it clean. No metal, no food, no plastic: one can in a bale can stop a paper machine.</p>';
  $('#pposter').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PPOSTER, cls: 'sr-leaflet', clue: { id: 'fibres', title: 'Poster: paper goes round five to seven times', kind: 'On the pillar' }, done: function () {
      SR.terms(['fibre']);
      if (tell('pposter')) ER.say('Five to seven times round. As long as nobody puts a can in it.');
    } });
  });
  SR.thing('#cat', 'Gubbins', 'Gubbins, the yard cat. Nobody knows whose he is. He is in charge of mice, and of other people&rsquo;s lunches.', isBusy);
  SR.thing('#bales', 'bale', 'This week&rsquo;s bales for the mill, fifteen of them so far. In three, a blue can shows through the paper. Somebody will have to open those up.', isBusy);
  SR.thing('#forklift', 'forklift', 'The forklift, with a bale on its forks. It beeps when it backs up, like everything else here.', isBusy);
  SR.thing('#clock', null, 'Twenty past one, by the office clock. Which is four minutes fast, Lyle says. It has been four minutes fast since 2011.', isBusy);
  $('#window').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Through the window: the drawer full, the screen saying LEARNING, and Gubbins asleep on box B.'); return; }
    if (!told.lyle) { ER.say('&ldquo;Ask Lyle about the bundles first,&rdquo; says Jaz. &ldquo;He labelled them.&rdquo;'); return; }
    if (!told.jaz) { ER.say('The light table glows through the window. Jaz is by the office: she has a plan.'); return; }
    if (!told.manual) { ER.say('&ldquo;Page fifteen first,&rdquo; says Jaz. &ldquo;On the wall, by the door.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the light table (count), then the drawer (choose) ---------- */
  function makeLock() {
    var part = ER.flag('d-counted') ? 2 : 1, wait = false, val = ER.flag('d-val') || { pa: 0, ca: 0, ot: 0, lz: 0 }, saved = ER.flag('d-put') || [];
    var box = ER.el('div', 'pz yd'), msgEl;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function dial(k, label) {
      return '<div class="dl" data-k="' + k + '"><label>' + label + '</label><span class="v"></span><button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button><button type="button" data-d="1">+1</button><button type="button" data-d="10">+10</button></div>';
    }
    function render() {
      if (part === 1) {
        box.innerHTML = '<div class="yd-in"><div class="yd-hd"><b>THE LIGHT TABLE</b>Ilona&rsquo;s fifty training cards, as they came out of the drawer. Each has her label on it.</div><div class="lt"><div class="glass">' +
          FIFTY.map(function (f) { return '<div class="ph">' + SR.icon(f[0], 60) + '<b>' + f[1] + '</b></div>'; }).join('') + '</div>' +
          '<div class="cnt"><h5>Count each class</h5>' + dial('pa', 'PAPER') + dial('ca', 'CAN') + dial('ot', 'OTHER') +
          '<p>An Eye that said PAPER every time, without looking, would be right on how many per cent of these fifty?</p>' + dial('lz', 'per cent') + '</div></div></div>' +
          '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="yd-count">Write it on the drawer</button></div>';
        msgEl = box.querySelector('.pmsg');
        ER.$$('.dl', box).forEach(function (d) {
          var k = d.getAttribute('data-k'), v = d.querySelector('.v');
          function show() { v.textContent = val[k] + (k === 'lz' ? '%' : ''); }
          ER.$$('button', d).forEach(function (b) { b.addEventListener('click', function () { if (wait) return; val[k] = Math.max(0, Math.min(100, val[k] + parseInt(b.getAttribute('data-d'), 10))); ER.flag('d-val', val); SR.sfx.dial(); show(); }); });
          show();
        });
        box.querySelector('#yd-count').addEventListener('click', count);
        msg('Count Ilona&rsquo;s labels, class by class. Then work out the score of an Eye that never looks.');
      } else {
        box.innerHTML = '<div class="yd-in"><div class="yd-hd"><b>THE DRAWER</b>It takes nine bundles of ten. Drag a bundle from the shelf into the drawer, or click a bundle and then a place.</div>' +
          '<div class="shelf" id="yd-home">' + BUND.map(function (b) {
            return '<div class="bu dnd-item k-' + b.c + '" data-id="' + b.id + '"><span class="id">' + b.id.toUpperCase() + '<small>' + b.cls + '</small></span><span class="ic">' + SR.icon(b.ic[0], 42) + SR.icon(b.ic[1], 42) + '</span><p>' + b.t + '<i' + (b.no ? ' class="no"' : '') + '>' + b.ok + '</i></p></div>';
          }).join('') + '</div>' +
          '<div class="drawer"><h5>TRAINING DRAWER<span id="yd-tally"></span></h5><div class="dslots">' + new Array(10).join('<div class="ds"></div>') + '</div></div></div>' +
          '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="yd-go">Shut the drawer and train</button></div>';
        msgEl = box.querySelector('.pmsg');
        var home = box.querySelector('#yd-home'), slots = ER.$$('.ds', box);
        saved.forEach(function (id, i) { var it = home.querySelector('.bu[data-id="' + id + '"]'); if (it && slots[i]) slots[i].appendChild(it); });
        ER.dnd(box, { item: '.bu', slot: '.ds', home: home, lock: function () { return wait || !!nextFile; }, change: function () { ER.flag('d-put', inDrawer(true)); SR.sfx.card(); tally(); } });
        box.querySelector('#yd-go').addEventListener('click', train);
        tally();
        msg('Choose nine bundles for the Eye to learn from. The drawer counts the classes as you go.');
      }
    }
    function inDrawer(withGaps) {
      var out = [];
      ER.$$('.ds', box).forEach(function (s) { var it = s.querySelector('.bu'); if (it) out.push(it.getAttribute('data-id')); else if (withGaps) out.push(''); });
      return out;
    }
    function counts() {
      var o = { p: 0, c: 0, o: 0, t: 0, x: 0 };
      inDrawer().forEach(function (id) { o[bund(id).c] += 10; });
      return o;
    }
    function tally() {
      var o = counts();
      box.querySelector('#yd-tally').textContent = 'PAPER ' + o.p + ' · CAN ' + o.c + ' · OTHER ' + o.o + (o.t ? ' · MIXED ' + o.t : '') + (o.x ? ' · NO LABEL ' + o.x : '') + ' · cards ' + (o.p + o.c + o.o + o.t + o.x) + ' of 90';
    }
    function count() {
      if (wait) return;
      var bad = [];
      if (!ER.check('pa', String(val.pa))) bad.push('PAPER');
      if (!ER.check('ca', String(val.ca))) bad.push('CAN');
      if (!ER.check('ot', String(val.ot))) bad.push('OTHER');
      if (bad.length) { ER.sfx.no(); msg('&ldquo;Count the ' + bad.join(' and the ') + ' cards again,&rdquo; says Jaz. &ldquo;The three should come to fifty.&rdquo;' + (val.pa + val.ca + val.ot !== 50 ? ' (Yours come to ' + (val.pa + val.ca + val.ot) + '.)' : '')); return; }
      if (!ER.check('lz', String(val.lz))) {
        ER.sfx.no();
        if (val.lz === val.pa) msg('&ldquo;' + val.lz + ' is how many it would get right,&rdquo; says Jaz. &ldquo;Out of fifty, as a per cent?&rdquo;');
        else msg('&ldquo;It says PAPER every time,&rdquo; says Jaz. &ldquo;So it is right on every PAPER card, and wrong on all the rest. Right ÷ 50 × 100.&rdquo;');
        return;
      }
      ER.flag('d-counted', 1); SR.sfx.thud(); paint();
      SR.terms(['lopsided']);
      SR.mine('count', 'Ilona&rsquo;s fifty, counted', '<p>PAPER 45, CAN 4, OTHER 1. Lopsided: 9 in every 10 are paper.</p><p>An Eye that never looks and always says PAPER: 45 right out of 50, 45 ÷ 50 × 100 = 90%. Ilona&rsquo;s pass mark was 90%. Her Eye scored 94%: only four points better than not looking at all.</p><p>And every can was silver and shiny, and every paper but three glossy magazines was matt.</p>', true);
      part = 2; render();
      msg('&ldquo;Forty-five, four and one,&rdquo; says Jaz. &ldquo;An Eye with its eyes shut gets ninety per cent. And her pass mark was ninety.&rdquo; She puts the fifty cards to one side. &ldquo;Now the drawer.&rdquo;');
    }
    function flash(id) { var n = box.querySelector('.bu[data-id="' + id + '"]'); if (!n) return; n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1400); }
    function train() {
      if (wait || nextFile) return;
      var ids = inDrawer(), i, o, file;
      if (ids.length < 9) { ER.sfx.no(); msg('&ldquo;The drawer takes nine bundles,&rdquo; says Jaz. &ldquo;' + (9 - ids.length) + (9 - ids.length === 1 ? ' place is' : ' places are') + ' still empty.&rdquo;'); return; }
      for (i = 0; i < ids.length; i++) {
        if (!ER.check('bad', ids[i])) continue;
        ER.sfx.no(); flash(ids[i]);
        if (ids[i] === 'x') msg('&ldquo;Those haven&rsquo;t got labels yet,&rdquo; says Jaz. &ldquo;What would the Eye learn from a photo with no label? Page six.&rdquo;');
        else if (ids[i] === 't') msg('Jaz puts her hand flat on the bundle marked OURS. &ldquo;If it learns from these,&rdquo; she says, &ldquo;what do we test it on afterwards?&rdquo;');
        else msg('Lyle shakes his head. &ldquo;That&rsquo;s the agency lad&rsquo;s. Nobody checked it. He labelled two cans PAPER, and a wrong label teaches a wrong lesson.&rdquo;');
        return;
      }
      o = counts();
      if (o.p !== o.c || o.c !== o.o) { ER.sfx.no(); msg('&ldquo;Count the classes in the drawer,&rdquo; says Jaz. &ldquo;PAPER ' + o.p + ', CAN ' + o.c + ', OTHER ' + o.o + '. What does page fifteen say?&rdquo;'); return; }
      for (i = 0; i < BUND.length; i++) {
        if (ids.indexOf(BUND[i].id) >= 0 || !ER.check('need', BUND[i].id)) continue;
        ER.sfx.no();
        if (BUND[i].id === 'p3') msg('Lyle reads down the drawer. &ldquo;All your paper&rsquo;s dull,&rdquo; he says. &ldquo;Last time every paper it saw was dull and every can was shiny, and look what it learnt.&rdquo;');
        else msg('&ldquo;No card and no egg boxes?&rdquo; says Jaz. &ldquo;Half of what comes down that belt is card. Every kind of thing it will meet, page fifteen says.&rdquo;');
        return;
      }
      file = ER.exit([ids.slice().sort().join('-')], { wait: true });
      if (!file) { ER.sfx.no(); msg('&ldquo;Hmm,&rdquo; says Jaz, and reads page fifteen again. &ldquo;Something&rsquo;s not right. Look at each bundle once more.&rdquo;'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      SR.terms(['balanced', 'variety', 'retrain']);
      SR.mine('drawer', 'The new drawer', '<p>Nine bundles: PAPER 30, CAN 30, OTHER 30. Balanced.</p><p>Every kind it will meet: silver cans and matt blue ones, tins, dull paper and shiny magazines, card, bottles, cartons, crisp packets. So shine can no longer tell the classes apart on its own.</p><p>Left out: the photos with no labels, the agency bundle nobody checked, and our ten, which we keep for the test.</p>', true);
      msg('&ldquo;Thirty, thirty, thirty,&rdquo; says Jaz. &ldquo;Every label checked. Every kind of thing. And not one of our ten.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Jaz slides the drawer shut. The kit reads the ninety cards one by one, with a soft whirr, and the screen counts them: PAPER 30. CAN 30. OTHER 30. CHECKED LABELS: 90. TEST CARDS: 0.',
          'She presses LEARN. The screen says: ABOUT 55 MINUTES.',
          '&ldquo;And when it&rsquo;s learnt?&rdquo; says Lyle. &mdash; &ldquo;We test it again,&rdquo; says Jaz. &ldquo;On our ten. It still hasn&rsquo;t seen them.&rdquo;',
          '&ldquo;And if it gets them all right?&rdquo; &mdash; &ldquo;It won&rsquo;t,&rdquo; says Jaz. &ldquo;Nothing gets everything right. That&rsquo;s why you&rsquo;re staying on the paper line.&rdquo; Lyle looks pleased, and tries not to.',
          'Gubbins the cat climbs onto the shelf and lies down on box B, the ten photos marked OURS. DO NOT TRAIN. Somebody has to guard them.'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2800);
    }
    render();
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; }, part: function () { return part; } };
  }
})();
</script>
