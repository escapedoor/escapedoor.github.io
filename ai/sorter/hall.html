      'The tipping hall is a steel shed the size of a church. Its big shutter is rolled up, and a green council lorry is backing in out of the rain, beeping, to tip its load on the heap.',
      'Your aunt Gina stands by the shutter with a clipboard and a mug of tea that went cold an hour ago. On the right, under a row of strip lights, a young woman in a yellow vest is setting up a camera in front of a white box.',
      'At the front, on the wet floor, sits a blue plastic crate. Somebody has written on it in marker: awkward 10.'
    ], function () { busy = false; });
  }

  $('#gina').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Ten labels and two people who agree,&rdquo; says Gina. &ldquo;That&rsquo;s more than the council manages. Go on up. Lyle&rsquo;s on the line.&rdquo;'); return; }
    if (told.gina) { var G = ['&ldquo;Four o&rsquo;clock,&rdquo; says Gina. &ldquo;The mill&rsquo;s lorry. Talk to Jaz.&rdquo;', '&ldquo;Ninety-four per cent,&rdquo; says Gina, to nobody. &ldquo;On a certificate. With a gold edge.&rdquo;']; ER.say(G[ginaN++ % G.length]); return; }
    ER.talk({
      who: 'Gina Hulme', role: 'Your aunt · day shift manager', face: SR.face('gina'),
      lines: [
        { note: 'She looks at your hi-vis vest, which comes down to your knees, and nods.', a: '&ldquo;Welcome to the Murf. Rule one: don&rsquo;t touch anything that moves. Rule two: most things here move.&rdquo;' },
        { q: 'What has gone wrong?', a: 'Since Friday morning the sorter has been sending drinks cans up the paper line. Cans in the paper. The paper is pressed into bales, and the bales go to Jebb&rsquo;s Mill to be made into new paper. Metal in a bale can wreck a paper machine.' },
        { q: 'What is the sorter?', a: 'The Eye. A camera and a lamp over the belt, and a row of air jets. It looks at everything that goes past, and when it decides something is paper, a jet blows it up onto the paper line. Gannaway Robotics put it in last month. Their trainer, Ilona, trained it on our own rubbish.' },
        { q: 'Was it tested?', a: '&ldquo;Ninety-four per cent. Forty-seven out of fifty. It&rsquo;s on a certificate in the control room, with a gold edge. And it was perfect for three weeks.&rdquo;' },
        { q: 'So what changed on Thursday?', a: '&ldquo;Lyle cleaned its camera window on Thursday afternoon, and on Friday morning there were cans in the paper. I&rsquo;m not saying it was Lyle.&rdquo; She drinks some cold tea. &ldquo;Everybody else is saying it was Lyle.&rdquo;' },
        { q: 'Why does it matter today?', a: '&ldquo;The mill sent Friday&rsquo;s load back. One more load with cans in it and they stop taking our paper. Their lorry comes at four. If the Eye isn&rsquo;t right by then, I switch it off and we sort the whole belt by hand, like we did before it came. Talk to Jaz. She reads manuals. For fun.&rdquo;' }
      ],
      clue: { id: 'gina', title: 'Gina: cans in the paper since Friday', kind: 'What she said' },
      done: function (seen) { if (seen && tell('gina')) { paint(); ER.say('Cans in the paper since Friday. The mill&rsquo;s lorry at four. Jaz is by the light box.'); } }
    });
  });

  $('#jaz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Up the yellow stairs,&rdquo; says Jaz. &ldquo;I&rsquo;ll bring the camera. And don&rsquo;t let Lyle tell you he&rsquo;s not cross. He&rsquo;s cross.&rdquo;'); return; }
    if (!told.gina) { ER.say('Jaz is fixing a camera onto a stand. &ldquo;Talk to your aunt first,&rdquo; she says, without looking up. &ldquo;She&rsquo;s the one with the bad news.&rdquo;'); return; }
    if (told.jaz) { var J = ['&ldquo;Page six first,&rdquo; says Jaz. &ldquo;On the side of the box. Then the crate.&rdquo;', '&ldquo;Two people, every label,&rdquo; says Jaz. &ldquo;You, then me.&rdquo;']; ER.say(J[jazN++ % J.length]); return; }
    ER.talk({
      who: 'Jaz Iqbal', role: 'Maintenance apprentice · reads manuals', face: SR.face('jaz'),
      lines: [
        { note: 'Jaz is nineteen. She has a pencil behind one ear and a screwdriver in her top pocket.', a: '&ldquo;Your aunt says you ask too many questions,&rdquo; says Jaz. &ldquo;Good. So do I.&rdquo;' },
        { q: 'Is it Lyle&rsquo;s fault?', a: 'Lyle cleaned the window with a soft cloth and the proper spray, once a month, as the manual says. I&rsquo;ve been all over that camera since. It&rsquo;s clean and it&rsquo;s in focus. And yes, the belt motor has been running hot since Friday. That&rsquo;s a worn bearing. I&rsquo;ve ordered a new one.' },
        { q: 'Then what is wrong?', a: '&ldquo;I don&rsquo;t know yet, and I&rsquo;m not going to guess. The Eye learnt from examples. Ilona has gone to Scotland, but she says we can teach it again ourselves, if we have good examples. So first I want some of our own: things it has never seen.&rdquo;' },
        { q: 'What can I do?', a: 'Gina pulled ten awkward things off the heap this morning. They&rsquo;re in the blue crate. You label each one PAPER, CAN or OTHER. I photograph it in the light box, and I check your label. Two people, every label.' },
        { a: '&ldquo;Read page six of the manual first. It&rsquo;s taped to the light box. It&rsquo;s the only page anybody here has read, and that&rsquo;s only because it&rsquo;s taped to the light box.&rdquo;' }
      ],
      clue: { id: 'jaz', title: 'Jaz: examples it has never seen', kind: 'What she said' },
      done: function (seen) { if (seen && tell('jaz')) { paint(); ER.say('Page six is taped to the side of the light box. Then the blue crate.'); } }
    });
  });

  var MANUAL = '<div class="band"></div><div class="hd"><span>GANNAWAY EYE &middot; OPERATOR&rsquo;S MANUAL</span><span>6</span></div>' +
    '<h4>How the Eye learns</h4>' +
    '<div class="two"><div>' +
    '<p>Nobody tells the Eye what a can looks like. It learns from <b>examples</b>.</p>' +
    '<p><b>Training data</b> is a box of photos of real things from your own belt. Each photo is one example.</p>' +
    '<p>A person writes a <b>label</b> on every example: PAPER, CAN or OTHER. The Eye looks for the patterns that go with each label, and it believes every label it is given. A wrong label teaches it a wrong lesson, and it cannot tell.</p>' +
    '</div><div class="fig"><svg viewBox="0 0 270 170" width="270" height="170"><rect x="6" y="18" width="70" height="58" fill="#fff" stroke="#5a6066" stroke-width="2"/>' + SR.iconG('canSilverCrushed', 14, 24, .45) +
    '<path d="M24 92l38 0 10 10 -10 10h-38z" fill="#9fb4c4" stroke="#4a6274" stroke-width="2"/><text x="40" y="107" font-family="Stardos Stencil" font-size="13" fill="#10202c">CAN</text>' +
    '<path d="M82 60h36" stroke="#1b1d20" stroke-width="3"/><path d="M112 54l10 6 -10 6z" fill="#1b1d20"/>' +
    '<path d="M128 40h70v70h-70z" fill="#c9a26a" stroke="#7a5a32" stroke-width="2"/><text x="163" y="80" text-anchor="middle" font-family="Roboto Mono" font-size="9.5" fill="#2a1a0a">TRAINING</text><text x="163" y="92" text-anchor="middle" font-family="Roboto Mono" font-size="9.5" fill="#2a1a0a">DATA</text>' +
    '<path d="M204 76h20" stroke="#1b1d20" stroke-width="3"/><path d="M222 70l10 6 -10 6z" fill="#1b1d20"/>' +
    '<rect x="234" y="44" width="32" height="40" rx="4" fill="#5a6066"/><circle cx="250" cy="72" r="8" fill="#f2c230"/><text x="250" y="102" text-anchor="middle" font-family="Roboto Mono" font-size="9.5" fill="#1b1d20">EYE</text>' +
    '<text x="6" y="150" font-family="Roboto Mono" font-size="10" fill="#5a6066">photo + label = one example</text></svg><small>Fig. 6a: an example goes into the training data</small></div></div>' +
    '<p><b>How to label.</b> Label what a thing is made of: not its colour, not its shine, not what it held. A paper wrapper does not make a tin into paper. Two materials stuck together that cannot be pulled apart (card with plastic, plastic with foil) are OTHER.</p>' +
    '<p><b>Check.</b> A second person checks every label.</p>' +
    '<div class="pg">Gannaway Robotics &middot; EYE-3 &middot; page 6 of 40</div>';
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'sr-manual', clue: { id: 'manual', title: 'Manual, page 6: how the Eye learns', kind: 'Taped to the light box' }, done: function () {
      SR.terms(['machine learning', 'example', 'training data', 'label']);
      if (tell('manual')) { paint(); ER.say('It learns from labelled examples, and it believes every label. Now the crate.'); }
    } });
  });

  var LEAFLET = '<h4>What the arrows mean</h4><div class="two"><svg viewBox="0 0 150 150" width="150" height="150"><g fill="none" stroke="#2f7a3a" stroke-width="14" stroke-linejoin="round">' +
    '<path d="M75 22l40 66"/><path d="M110 112h-72"/><path d="M28 96l38 -64"/></g><g fill="#2f7a3a"><path d="M128 82l-6 30 -26 -12z"/><path d="M44 126l-24 -20 28 -10z"/><path d="M56 16l26 6 -16 22z"/></g>' +
    '<text x="75" y="88" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="20" fill="#16301c">30%</text></svg><div>' +
    '<p>Three arrows chasing each other round in a loop: this is the <b>Möbius loop</b>. It means the thing <b>can</b> be recycled. It does not mean that your council collects it, and it does not mean that it has been recycled.</p>' +
    '<p>If there is a number inside the loop, such as 30%, that much of the thing is made of recycled material.</p>' +
    '<p>The loop was drawn in 1970 by Gary Anderson, a student, for a competition.</p></div></div>' +
    '<small>KILVERLEY COUNCIL &middot; GREEN BIN GUIDE &middot; Not sure? Look it up on our list, or put it in the black bin.</small>';
  $('#leaflet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LEAFLET, cls: 'sr-leaflet', clue: { id: 'leaflet', title: 'The council leaflet: the arrows', kind: 'On the noticeboard' }, done: function () {
      SR.terms(['recycle']);
      if (tell('leaflet')) ER.say('&ldquo;Can be recycled,&rdquo; says Gina, passing. &ldquo;Somewhere. By somebody. Not necessarily us.&rdquo;');
    } });
  });
  SR.thing('#lorry', 'lorry', 'A council lorry, tipping its load: a slide of paper, card, bottles and cans. Its reversing beeper stops at last.', isBusy);
  SR.thing('#heap', 'heap', 'The heap. Mostly paper: nine parts in ten, Gina says, most days. Here and there a silver can catches the strip lights. The blue ones don&rsquo;t. They are matt.', isBusy);
  SR.thing('#bales', 'bale', 'Bales of paper, pressed and tied with wire, each the size of a fridge, waiting for the mill. In the side of one, something blue.', isBusy);
  SR.thing('#camera', null, 'Jaz&rsquo;s camera, on a stand, pointed into the light box. The same model as the Eye&rsquo;s own camera, under the same kind of lamp.', isBusy);
  $('#stairs').addEventListener('click', function () { if (busy) return; if (nextFile) { ER.leave(nextFile); return; } ER.say('The yellow stairs up to the line. &ldquo;After the crate,&rdquo; says Jaz.'); });
  $('#crate').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The crate is empty now. The ten photos are in a box of their own, on its lid: OURS. DO NOT TRAIN.'); return; }
    if (!told.gina) { ER.say('The blue crate: awkward 10. &ldquo;That&rsquo;s for later,&rdquo; says Gina. &ldquo;Come here first.&rdquo;'); return; }
    if (!told.jaz) { ER.say('&ldquo;Ask Jaz,&rdquo; says Gina. &ldquo;The crate is her idea.&rdquo;'); return; }
    if (!told.manual) { ER.say('&ldquo;Page six first,&rdquo; says Jaz. &ldquo;Taped to the light box. Then you&rsquo;ll know how to label.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the crate: a label for each of ten things ---------- */
  function makeLock() {
    var st = ER.flag('a-lab') || {}, wait = false, box = ER.el('div', 'pz lb');
    box.innerHTML = '<div class="lb-in"><div class="lb-hd"><b>AWKWARD 10</b>Label each one: what is it made of?<span>you label &middot; Jaz checks</span></div><div class="lb-grid">' +
      ITEMS.map(function (it, i) {
        return '<div class="it" data-i="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span>' + SR.icon(it.k, 92) + '<p>' + it.t + '</p><div class="tg">' +
          '<button type="button" data-l="can">CAN</button><button type="button" data-l="paper">PAPER</button><button type="button" data-l="other">OTHER</button></div></div>';
      }).join('') + '</div><p class="lb-rule"><b>Page 6:</b> what it is made of, not its colour, its shine or what it held &middot; a wrapper does not count &middot; stuck together and cannot be pulled apart: OTHER</p></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="lb-go">Jaz, check my labels</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintL() { ER.$$('.it', box).forEach(function (n) { var v = st[n.getAttribute('data-i')]; ER.$$('.tg button', n).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === v); }); }); }
    ER.$$('.it', box).forEach(function (n) {
      ER.$$('.tg button', n).forEach(function (b) {
        b.addEventListener('click', function () {
          if (wait || nextFile) return;
          var i = n.getAttribute('data-i'), l = b.getAttribute('data-l');
          st[i] = st[i] === l ? '' : l; ER.flag('a-lab', st); SR.sfx.tag(); paintL();
        });
      });
    });
    paintL();
    function flash(i) { var n = box.querySelector('.it[data-i="' + i + '"]'); n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1400); }
    box.querySelector('#lb-go').addEventListener('click', function () {
      var i, n = 0, wrong = [], file;
      if (wait || nextFile) return;
      for (i = 1; i <= ITEMS.length; i++) { if (st[i]) n++; if (st[i] && !ER.check('l' + i, st[i])) wrong.push(i); }
      if (n < ITEMS.length) { ER.sfx.no(); msg('&ldquo;Every one gets a label,&rdquo; says Jaz. &ldquo;' + (ITEMS.length - n) + ' still to go.&rdquo;'); return; }
      function first(kind) { for (var j = 0; j < wrong.length; j++) if (ITEMS[wrong[j] - 1].kind === kind) return wrong[j]; return 0; }
      var w;
      if ((w = first('look'))) { ER.sfx.no(); flash(w); msg('Jaz picks up number ' + w + ' and taps it on the table. <i>Tock.</i> &ldquo;Never mind the colour. What is it made of? Page six.&rdquo;'); return; }
      if ((w = first('shine'))) { ER.sfx.no(); flash(w); msg('Jaz holds number ' + w + ' up to the strip lights. &ldquo;Shiny, yes. Shiny what? Page six says not to label the shine.&rdquo;'); return; }
      if ((w = first('wrap'))) { ER.sfx.no(); flash(w); msg('&ldquo;Peel the wrapper off number ' + w + ' in your head,&rdquo; says Jaz. &ldquo;What&rsquo;s underneath?&rdquo;'); return; }
      if ((w = first('stuck'))) { ER.sfx.no(); flash(w); msg('&ldquo;Can you pull the card off the foil in number ' + w + '?&rdquo; says Jaz. &ldquo;Neither can the paper mill.&rdquo;'); return; }
      if ((w = first('stuck2'))) { ER.sfx.no(); flash(w); msg('&ldquo;Silver on the inside isn&rsquo;t the same as metal all the way through,&rdquo; says Jaz. &ldquo;Read number ' + w + ' again. What is it made of, and can the layers come apart?&rdquo;'); return; }
      if (wrong.length) { ER.sfx.no(); flash(wrong[0]); msg('Jaz frowns at number ' + wrong[0] + '. &ldquo;Read its card again. What is it made of?&rdquo;'); return; }
      var ans = []; for (i = 1; i <= ITEMS.length; i++) ans.push(st[i]);
      file = ER.exit([ans.join('-')], { wait: true });
      if (!file) { msg('Jaz&rsquo;s pencil breaks. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      SR.terms(['label', 'class']);
      SR.mine('ten', 'Our ten: labelled, checked, kept apart', '<p>1 silver can: CAN. 2 newspaper: PAPER. 3 juice carton: OTHER. 4 blue can, crushed: CAN. 5 glossy magazine: PAPER.</p><p>6 crisp packet: OTHER. 7 tin in a wrapper: CAN. 8 cardboard: PAPER. 9 blue can: CAN. 10 plastic bottle: OTHER.</p><p>4 CAN, 3 PAPER, 3 OTHER. Labelled by what each thing is made of. Never put in the training box.</p>', true);
      msg('&ldquo;Agreed,&rdquo; says Jaz. &ldquo;All ten. Four cans, three paper, three other.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Jaz photographs the ten, one at a time, inside the white box under the same kind of lamp as the Eye&rsquo;s. She reads your label aloud for each one, and checks it, and writes it on the back of the photo.',
          '&ldquo;The blue can is a can, whatever it looks like,&rdquo; she says. &ldquo;The magazine is paper, however it shines. And the carton is OTHER, because nobody can get its layers apart.&rdquo;',
          'She puts the ten photos in a box of their own and writes on the lid in thick marker: OURS. DO NOT TRAIN.',
          '&ldquo;Why not?&rdquo; &mdash; &ldquo;Because I want to try the Eye on things it has never seen,&rdquo; says Jaz. &ldquo;If it learns from these, I&rsquo;ve nothing left to try it on. Come on. Up to the line. Lyle&rsquo;s there, and Lyle has been counting.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    msg('Give each thing one label: CAN, PAPER or OTHER. Then ask Jaz to check.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
