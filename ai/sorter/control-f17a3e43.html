<style>
  body{--bg:#1f2633;--accent:#7fc4e8;--font-display:'Stardos Stencil',sans-serif;--font-ui:'Outfit',sans-serif;--font-body:'Literata',serif;
    --tc-bg:rgba(22,28,38,.96);--tc-ink:#e9eef4;--cap-bg:rgba(22,28,38,.94);--cap-ink:#e9eef4;--panel:#1a212c;--panel-ink:#e9eef4;--face-bg:#2c4f5a;--q-ink:#7fc4e8;
    --fade:#0c1016;--hud-bg:rgba(22,28,38,.84);--hud-ink:#e9eef4;--hud-line:rgba(233,238,244,.25);--ov-bg:rgba(6,9,14,.74)}
  .tc-room{font-size:clamp(40px,5.8vw,82px);color:#7fc4e8}
  .tc-theme{color:#f2c230}
  .tk-role{color:#7fc4e8}
  .hbtn b{color:#1b1d20}
  .amber{animation:amb 1.4s steps(1,end) infinite}
  @keyframes amb{50%{opacity:.25}}
  .steam{animation:steam 3s linear infinite;opacity:0}
  .steam.s2{animation-delay:-1.5s}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.6}100%{opacity:0;transform:translateY(-50px)}}
  #tinybelt{animation:tb 12s linear infinite}
  @keyframes tb{from{transform:translateX(-200px)}to{transform:translateX(0)}}

  /* the test screen */
  .tb{width:min(1100px,96vw)}
  .tb-in{background:#0f1720;color:#dbe6ee;border:10px solid #2c3440;border-radius:8px;padding:12px 16px 12px;box-shadow:0 26px 70px rgba(0,0,0,.6);font-family:'Outfit',sans-serif}
  .tb-hd{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-family:'Roboto Mono',monospace;font-size:13px;color:#8fb0c4}
  .tb-hd b{font-weight:500;color:#f2c230;background:#1b2632;padding:3px 8px;border-radius:3px}
  .boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .bx{display:flex;flex-direction:column;text-align:left;background:#c9a26a;color:#2a1a0a;border:0;border-radius:3px;padding:0 0 10px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);font-family:'Outfit',sans-serif}
  .bx:hover{filter:brightness(1.08)}
  .bx .lid{display:block;background:#b08a5a;padding:8px 10px;font-family:'Stardos Stencil',sans-serif;font-weight:700;font-size:20px;letter-spacing:.04em}
  .bx .lid.hand{font-family:'Kalam',cursive;font-weight:700;font-size:20px;letter-spacing:0;color:#1b2a4a}
  .bx p{margin:8px 10px 0;font-size:14.5px;line-height:1.32}
  .bx p small{display:block;margin-top:4px;font-family:'Roboto Mono',monospace;font-size:11.5px;color:#5a3a1a}
  .bx.bad{outline:4px solid #ff6b5a}
  .res{display:grid;grid-template-columns:1fr 290px;gap:16px}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
  .row{display:grid;grid-template-columns:24px 58px 1fr 34px;align-items:center;gap:6px;background:#172330;border:1px solid #2a3a48;border-radius:4px;padding:3px 6px;font-size:13.5px;line-height:1.2}
  .row .n{font-family:'Roboto Mono',monospace;font-size:12px;color:#8fb0c4}
  .row svg{display:block;width:56px;height:46px;background:#f1efe8;border-radius:2px}
  .row .lb{font-family:'Roboto Mono',monospace;font-size:12px}
  .row .lb b{font-weight:500;color:#f2c230}
  .row .ey b{font-weight:500;color:#7fc4e8}
  .row button{width:30px;height:30px;border:2px solid #3a4a58;border-radius:50%;font-size:16px;color:#5a6a78;background:transparent}
  .row button.y{border-color:#4caf6a;color:#4caf6a}.row button.x{border-color:#e0604a;color:#e0604a}
  .dials{background:#f4f6f2;color:#1b1d20;border-radius:3px;padding:10px 12px;align-self:start}
  .dials h5{margin:0 0 6px;font-family:'Outfit',sans-serif;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
  .dl{margin:0 0 10px}
  .dl label{display:block;font-size:14px;margin-bottom:3px}
  .dl .v{display:inline-block;min-width:84px;text-align:right;font-family:'Kalam',cursive;font-size:30px;line-height:1;color:#1f4f8a;margin-right:8px}
  .dl button{padding:3px 7px;margin:0 1px;border:1px solid #9aa2a8;border-radius:3px;font-family:'Roboto Mono',monospace;font-size:12.5px;background:#fff}
  .dl button:hover{border-color:#1b1d20}
  .dials p{margin:4px 0 0;font-size:13px;line-height:1.35;color:#3a4248}
  .tb .pmsg{color:#e9eef4}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null, ginaN = 0, jazN = 0;
  /* the ten from the crate: your label, and what the Eye did with each photo */
  var TEN = [
    { k: 'canSilverCrushed', t: 'silver can', lab: 'CAN', eye: 'STAYS ON' },
    { k: 'newspaper', t: 'newspaper', lab: 'PAPER', eye: 'PAPER LINE' },
    { k: 'carton', t: 'juice carton', lab: 'OTHER', eye: 'PAPER LINE' },
    { k: 'canBlueCrushed', t: 'blue can, crushed', lab: 'CAN', eye: 'PAPER LINE' },
    { k: 'magazine', t: 'glossy magazine', lab: 'PAPER', eye: 'STAYS ON' },
    { k: 'crisps', t: 'crisp packet', lab: 'OTHER', eye: 'STAYS ON' },
    { k: 'tin', t: 'tin in a wrapper', lab: 'CAN', eye: 'PAPER LINE' },
    { k: 'card', t: 'cardboard', lab: 'PAPER', eye: 'PAPER LINE' },
    { k: 'canBlueRound', t: 'blue can', lab: 'CAN', eye: 'PAPER LINE' },
    { k: 'bottle', t: 'plastic bottle', lab: 'OTHER', eye: 'STAYS ON' }
  ];

  (function () {
    var s = '', i;
    for (i = 0; i < 20; i++) s += '<rect x="' + (-1000 + i * 190) + '" y="' + (360 - i * 1.1) + '" width="' + (16 + (i % 3) * 6) + '" height="9" fill="' + ['#eceae3', '#c49a62', '#3c6fb2', '#cfd6dc'][i % 4] + '"/>';
    $('#tinybelt').innerHTML = s;
    s = '';
    for (i = 0; i < 40; i++) s += '<path d="M' + (-600 + i * 83) + ' ' + (130 + (i * 37) % 260) + 'q2 18 -1 36"/>';
    $('#streaks').innerHTML = s;
    $('#jaz').innerHTML = SR.who('jaz', { smile: 1 });
    $('#gina').innerHTML = SR.who('gina', { smile: 0, extra: '<rect x="28" y="-128" width="24" height="28" rx="3" fill="#2f6fd0"/><path d="M52 -120q10 2 8 14" fill="none" stroke="#2f6fd0" stroke-width="4"/>' });
  })();

  ER.init({
    theme: 'ai', story: 'sorter', storyTitle: 'Mostly Paper', id: 'control', no: 'III', title: 'The Control Room',
    go: 'Climb the last flight',
    intro: [
      'The Eye counts votes: shine six, colour three, outline one. So shine decides. Shiny things stay on the belt and matt things go up the paper line, whatever they are. The blue cans are matt. Lyle&rsquo;s magnet takes the tins off the paper line, because tins are steel; the blue cans are aluminium, so they ride on into the bales.',
      'The control room is a glass box at the top of the building, above the line. From here you can see the whole shed, and the rain.',
      'Twenty to twelve. The mill&rsquo;s lorry comes at four.'
    ],
    exit: {"next":"yard","w":{"cde70b51":"96e7d4f6"}}, tags: {"box":["1cb8031a"],"ov":["bc3da227"],"cn":["fc91855d"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.gina && told.jaz && told.manual && told.log; }
  function paint() {
    $('#screen').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.gina ? 1 : 0) + (told.jaz ? 1 : 0) + (told.manual ? 1 : 0) + (told.log ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The Eye fails on photos too, so the reason is in what it learnt. Down to the bale yard: the button at the bottom of the screen.']];
    if (lock && lock.isOpen()) {
      if (lock.stage() === 1) return ['box', [
        'Page twelve gives three things a fair test box must be. Read each lid with all three in mind.',
        'A: the Eye learnt from these. C: there are no labels, so nobody could say which answers are right. D: new to the Eye and labelled, but is it like Kilverley&rsquo;s belt this week?',
        'Only one box is new to the Eye, labelled, and like the belt today: the one Jaz wrote on this morning.'
      ]];
      return ['dials', [
        'A row is right when the Eye did the right thing: a PAPER that went up the paper line, or a CAN or an OTHER that stayed on the belt. You can tick or cross each row.',
        'Count the right rows, then right ÷ 10 × 100. For the cans, use only the four CAN rows: right ÷ 4 × 100.',
        'Five of the ten rows are right. Of the four cans, one stayed on the belt.'
      ]];
    }
    if (!told.gina) return ['gina', ['Somebody here has a theory.', 'Gina, on the right, with a blue mug.']];
    if (!told.jaz) return ['jaz', ['Jaz has an idea for a test.', 'Jaz is on the left, by the noticeboard.']];
    if (!told.manual) return ['manual', ['How should a machine be tested? A page of the manual says.', 'Page twelve is pinned on the noticeboard on the left wall.']];
    if (!told.log) return ['log', ['What did Ilona test the Eye on? She wrote it down.', 'Her training log is the clipboard hanging on the right wall, left of the certificate.']];
    return ['screen', ['Now try the Eye on photos.', 'The left-hand screen on the desk: TEST THE EYE.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Fifty per cent on photos it had never seen. A quarter of the cans.'); return; }
    if (told.inn) { busy = false; ER.say('The control room. Rain on the glass, and the kettle.'); return; }
    tell('inn');
    ER.narrate([
      'Up here the noise of the shed is a long way down. Rain runs across the big window. Below it, the belt is a grey ribbon with tiny bright things on it.',
      'On the desk are two screens: one says TEST THE EYE, and the other shows the belt&rsquo;s speed and a motor temperature in orange. On the wall a lamp blinks amber over a panel marked MOTOR 2.',
      'Gina has come up for a tea. She is standing in front of a framed certificate, and she looks at it as if it owes her money.'
    ], function () { busy = false; });
  }

  $('#gina').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Ninety-four,&rdquo; says Gina. &ldquo;And fifty. I&rsquo;m going to need a bigger tea.&rdquo;'); return; }
    if (told.gina) { var G = ['&ldquo;Find out in a way I can explain to the council,&rdquo; says Gina. &ldquo;They like numbers.&rdquo;', '&ldquo;It&rsquo;s the motor,&rdquo; says Gina, to the certificate. &ldquo;It must be the motor.&rdquo;']; ER.say(G[ginaN++ % G.length]); return; }
    ER.talk({
      who: 'Gina Hulme', role: 'Day shift manager · needs a reason by four', face: SR.face('gina'),
      lines: [
        { a: '&ldquo;Ninety-four per cent,&rdquo; says Gina. &ldquo;That&rsquo;s an A. I never got an A in my life, and I&rsquo;ve never sent a can to a paper mill either.&rdquo;' },
        { q: 'What do you think is wrong?', a: 'The motor. Jaz says it&rsquo;s been running hot since Friday, and the belt&rsquo;s ten per cent slow. Stands to reason: things go past slower, the camera gets muddled. Either that or Lyle&rsquo;s cloth.' },
        { q: 'But the Eye goes by shine. Matt things go up, whatever they are.', a: '&ldquo;Then maybe a slow belt makes things look matt. I don&rsquo;t know. I run a recycling centre, not a camera shop.&rdquo;' },
        { q: 'Has Ilona said anything?', a: 'She emailed this morning. It&rsquo;s on the desk. She&rsquo;s in Scotland putting an Eye into another centre. It passed its test, she says, so it must be our belt. And would we like to buy a better camera.' },
        { a: '&ldquo;Find out before four,&rdquo; says Gina. &ldquo;And find out in a way I can explain to the council. They like numbers. They like them even more when the numbers agree with each other.&rdquo;' }
      ],
      clue: { id: 'gina3', title: 'Gina: it must be the motor', kind: 'What she said' },
      done: function (seen) { if (seen && tell('gina')) { paint(); ER.say('The motor, or Lyle&rsquo;s cloth, says Gina. Jaz looks as if she has an idea.'); } }
    });
  });

  $('#jaz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Not the motor, not the window,&rdquo; says Jaz. &ldquo;Its lesson. Let&rsquo;s go and look at what Ilona taught it.&rdquo;'); return; }
    if (told.jaz) { var J = ['&ldquo;Page twelve first,&rdquo; says Jaz. &ldquo;Then Ilona&rsquo;s log. Then the screen.&rdquo;', '&ldquo;A photo can&rsquo;t go past slowly,&rdquo; says Jaz. &ldquo;Think about it.&rdquo;']; ER.say(J[jazN++ % J.length]); return; }
    ER.talk({
      who: 'Jaz Iqbal', role: 'Maintenance apprentice · would rather test than guess', face: SR.face('jaz'),
      lines: [
        { a: '&ldquo;Here&rsquo;s the thing,&rdquo; says Jaz. &ldquo;If it were the motor or the window, the Eye would be fine on a photo. A photo can&rsquo;t go past slowly. A photo has never been near Lyle&rsquo;s cloth.&rdquo;' },
        { q: 'So what do we do?', a: 'We test it on photos. That screen feeds a box of photos straight into its computer: no belt, no lens. Every photo has a label on the back, so the screen knows which answers are right.' },
        { q: 'Which photos?', a: '&ldquo;That&rsquo;s the whole question. There are four boxes on the shelf. Read page twelve before you choose one. It&rsquo;s on the noticeboard. And Ilona&rsquo;s log is on the hook: it says what she tested the Eye on.&rdquo;' },
        { q: 'And then?', a: '&ldquo;Then we count how many it gets right out of how many. And not only all of them together. Page twelve says why.&rdquo;' }
      ],
      clue: { id: 'jaz3', title: 'Jaz: a photo can&rsquo;t go past slowly', kind: 'What she said' },
      done: function (seen) { if (seen && tell('jaz')) { paint(); ER.say('Page twelve on the noticeboard, Ilona&rsquo;s log on the hook, then the screen.'); } }
    });
  });

  var MANUAL = '<div class="band"></div><div class="hd"><span>GANNAWAY EYE &middot; OPERATOR&rsquo;S MANUAL</span><span>12</span></div>' +
    '<h4>Testing the Eye</h4><div class="two"><div>' +
    '<p>A score on the examples the Eye learnt from tells you very little: it has seen them already. A fair <b>test set</b> is made of examples that are:</p>' +
    '<p>1. <b>new to the Eye:</b> kept back, and never put in the training box;<br>2. <b>labelled:</b> so that you know the right answer for each one;<br>3. <b>like the belt today:</b> from your own centre, as things look now.</p>' +
    '</div><div class="fig"><svg viewBox="0 0 270 150" width="270" height="150"><rect x="10" y="40" width="100" height="80" fill="#c9a26a" stroke="#7a5a32" stroke-width="2"/><text x="60" y="86" text-anchor="middle" font-family="Stardos Stencil" font-size="18" fill="#2a1a0a">TRAIN</text>' +
    '<rect x="160" y="40" width="100" height="80" fill="#9fb4c4" stroke="#4a6274" stroke-width="2"/><text x="210" y="86" text-anchor="middle" font-family="Stardos Stencil" font-size="18" fill="#10202c">TEST</text>' +
    '<rect x="128" y="20" width="14" height="120" fill="#5a6066"/><g stroke="#f2c230" stroke-width="4"><path d="M128 40l14 14M128 70l14 14M128 100l14 14"/></g><text x="135" y="14" text-anchor="middle" font-family="Roboto Mono" font-size="9.5" fill="#1b1d20">keep apart</text></svg><small>Fig. 12a: never let them mix</small></div></div>' +
    '<p><b>Accuracy</b> = right answers ÷ all answers × 100. For example, 47 right out of 50 is 47 ÷ 50 × 100 = 94%.</p>' +
    '<p>Then work out the accuracy for each kind of thing on its own. One number for everything can hide one kind of thing that the Eye nearly always gets wrong.</p>' +
    '<div class="pg">Gannaway Robotics &middot; EYE-3 &middot; page 12 of 40</div>';
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'sr-manual', clue: { id: 'manual12', title: 'Manual, page 12: testing the Eye', kind: 'On the noticeboard' }, done: function () {
      SR.terms(['test set', 'accuracy', 'keep back']);
      if (tell('manual')) { paint(); ER.say('New to the Eye, labelled, like the belt today. And look at each kind of thing on its own.'); }
    } });
  });
  var LOG = '<h4>Eye &middot; Kilverley &middot; training log</h4><h5>I. Grieve, Gannaway Robotics &middot; September</h5>' +
    '<table><tr><td>Day 1, morning</td><td>Photographed 50 things off the belt and labelled them: 45 PAPER, 4 CAN, 1 OTHER. (Quiet morning for cans!)</td></tr>' +
    '<tr><td>Day 1, afternoon</td><td>Trained the Eye on the 50. Took 12 minutes.</td></tr>' +
    '<tr><td>Day 2</td><td>Tested the Eye on the 50 photos. <b>47 right out of 50: 94%.</b> PASS (pass mark 90%).</td></tr>' +
    '<tr><td></td><td>Wrong: 3, all glossy magazines, sent on down the container line. PAPER 42 of 45 right, CAN 4 of 4, OTHER 1 of 1. The plastics pickers will catch the magazines.</td></tr></table>' +
    '<p class="hand">Lovely site, lovely people, terrible tea. &mdash; I.G.</p>';
  $('#log').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LOG, cls: 'sr-clip', clue: { id: 'log', title: 'Ilona&rsquo;s training log: 47 out of 50', kind: 'On the hook' }, done: function () {
      if (tell('log')) { paint(); ER.say('Trained on the fifty. Tested on the fifty. The same fifty.'); }
    } });
  });
  var CERT = '<h4>Certificate of testing</h4><p>Gannaway Robotics certifies that the</p><p><b>GANNAWAY EYE-3</b><br>at Kilverley Materials Recovery Facility</p><p>has been tested, with an accuracy of</p><div class="big">94%</div><small>tested by I. Grieve &middot; pass mark 90%</small>';
  $('#cert').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CERT, cls: 'sr-cert', clue: { id: 'cert', title: 'The certificate: 94%', kind: 'On the wall' }, done: function () {
      if (tell('cert')) ER.say('Ninety-four per cent, with a gold edge. True, as far as it goes. How far does it go?');
    } });
  });
  var MOTOR = '<h4>Belt motor 2 &middot; fault log</h4><table>' +
    '<tr><td>Fri 07.10</td><td>Running hot: 78 °C (normal: under 60). Belt speed 1.8 m/s (normal: 2.0).</td></tr>' +
    '<tr><td>Sat</td><td>Same.</td></tr><tr><td>Mon</td><td>Same. Bearing worn. New bearing ordered: comes Thursday.</td></tr>' +
    '<tr><td>Note</td><td>The Eye works at any belt speed from 1.5 to 2.5 m/s (manual, page 3). &mdash; J. Iqbal</td></tr></table>';
  $('#motor').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MOTOR, cls: 'sr-clip', clue: { id: 'motor', title: 'Motor 2: running hot since Friday', kind: 'Fault log' }, done: function () {
      if (tell('motor')) ER.say('A real fault: a worn bearing, a slow belt. But still inside the speeds the Eye works at.');
    } });
  });
  var EMAIL = '<div class="hd">From: Ilona Grieve, Gannaway Robotics<br>To: Gina Hulme, Kilverley MRF<br>Subject: RE: CANS IN THE PAPER!!!</div><h4>Hi Gina,</h4>' +
    '<p>So sorry, I&rsquo;m in Scotland until Monday, fitting another Eye. Yours passed its test with 94%, so the learning is fine. My guess is the belt: is it running slow?</p>' +
    '<p>If you want a quick fix, the new EYE-4 has a much better camera (quote attached: £38,500, fitted).</p>' +
    '<p>Or you can teach the Eye again yourselves. The training kit is in the yard office. The drawer takes 90 labelled photo cards, and it learns in about an hour.</p><p>Best wishes,<br>Ilona</p>';
  $('#email').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: EMAIL, cls: 'sr-email', clue: { id: 'email', title: 'Ilona&rsquo;s email', kind: 'On the desk' }, done: function () {
      SR.terms(['retrain']);
      if (tell('email')) ER.say('&ldquo;Thirty-eight thousand five hundred pounds,&rdquo; says Gina. &ldquo;For a better camera. To look at the same shine.&rdquo;');
    } });
  });
  var POSTER = '<h4>Why we chase every can</h4><div class="two"><div><p>Making a drinks can from <b>recycled aluminium</b> takes about <b>95% less energy</b> than making it from new metal, which has to be dug out of the ground as an ore called bauxite.</p>' +
    '<p>And aluminium can be recycled again and again without wearing out. The can in your hand may have been a can many times before.</p><p>A can in a paper bale is a can thrown away.</p></div>' +
    '<svg viewBox="0 0 230 160" width="230" height="160"><rect x="20" y="20" width="60" height="120" fill="#c0392b"/><text x="50" y="155" text-anchor="middle" font-family="Outfit" font-size="12" fill="#13233a">new</text><rect x="140" y="134" width="60" height="6" fill="#2f7a3a"/><text x="170" y="155" text-anchor="middle" font-family="Outfit" font-size="12" fill="#13233a">recycled</text><text x="170" y="122" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="16" fill="#2f7a3a">5%</text><text x="50" y="80" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="16" fill="#fff">100%</text></svg></div>' +
    '<p style="font-size:13px;color:#4a5a6a">Energy needed to make one can.</p>';
  $('#poster').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: POSTER, cls: 'sr-poster', clue: { id: 'alu', title: 'Poster: why we chase every can', kind: 'On the wall' }, done: function () {
      SR.terms(['aluminium', 'energy']);
      if (tell('poster')) ER.say('Every blue can in a paper bale is a can that will never be a can again.');
    } });
  });
  SR.thing('#kettle', 'kettle', 'The kettle, and two mugs. The red one says KILVERLEY MRF: WE SORT IT OUT. The green one has been used as a pen pot since 2019.', isBusy);
  SR.thing('#motor2', null, 'Belt 2: 1.8 metres a second, motor at 78 degrees. Jaz&rsquo;s note under the screen: still inside the Eye&rsquo;s range (1.5 to 2.5).', isBusy);
  $('#boxes').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Box B, back on the shelf: OURS. DO NOT TRAIN. Still never trained on.'); return; }
    ER.say('Four boxes of photos: A, B (OURS. DO NOT TRAIN.), C and D. &ldquo;Choose one on the test screen,&rdquo; says Jaz.');
  });
  $('#screen').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('TEST: box B, 10 photos. RIGHT: 5 (50%). CANS: 1 of 4 (25%).'); return; }
    if (!told.gina) { ER.say('&ldquo;Say hello to your aunt,&rdquo; says Jaz. &ldquo;She has a theory.&rdquo;'); return; }
    if (!told.jaz) { ER.say('The screen says TEST THE EYE. Jaz is waiting to tell you something about it.'); return; }
    if (!told.manual) { ER.say('&ldquo;Page twelve first,&rdquo; says Jaz. &ldquo;On the noticeboard.&rdquo;'); return; }
    if (!told.log) { ER.say('&ldquo;And Ilona&rsquo;s log,&rdquo; says Jaz. &ldquo;On the hook. What did she test it on?&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the test screen: a fair box, then the sums ---------- */
  function makeLock() {
    var stage = ER.flag('c-stage') || 1, wait = false, val = ER.flag('c-val') || { ov: 0, cn: 0 }, marks = ER.flag('c-marks') || {};
    var box = ER.el('div', 'pz tb');
    var BOXES = [
      { id: 'a', lid: 'A &middot; TRAINING', t: '50 photos, labelled.', s: 'Ilona, Day 1. The Eye learnt from these.' },
      { id: 'b', lid: 'B &middot; OURS. DO NOT TRAIN.', hand: 1, t: '10 photos, labelled by you and checked by Jaz.', s: 'This morning, from today&rsquo;s heap.' },
      { id: 'c', lid: 'C &middot; TODAY&rsquo;S BELT', t: '300 photos from the Eye&rsquo;s own camera.', s: 'This morning. Not labelled.' },
      { id: 'd', lid: 'D &middot; GANNAWAY DEMO', t: '40 photos, labelled.', s: 'Gannaway&rsquo;s own test yard, in another town, two years ago.' }
    ];
    var msgEl;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function render() {
      if (stage === 1) {
        box.innerHTML = '<div class="tb-in"><div class="tb-hd">TEST THE EYE <b>step 1</b> load a box of photos</div><div class="boxes">' +
          BOXES.map(function (b) { return '<button type="button" class="bx" data-b="' + b.id + '"><span class="lid' + (b.hand ? ' hand' : '') + '">' + b.lid + '</span><p>' + b.t + '<small>' + b.s + '</small></p></button>'; }).join('') +
          '</div></div><div class="pz-foot"><p class="pmsg"></p></div>';
        msgEl = box.querySelector('.pmsg');
        ER.$$('.bx', box).forEach(function (b) { b.addEventListener('click', function () { pick(b.getAttribute('data-b'), b); }); });
        msg('Which box makes a fair test? Click it to load it.');
      } else {
        box.innerHTML = '<div class="tb-in"><div class="tb-hd">TEST THE EYE <b>box B</b> 10 photos &middot; no belt, no lens &middot; straight into its computer</div><div class="res"><div class="rows">' +
          TEN.map(function (r, i) {
            return '<div class="row" data-i="' + (i + 1) + '"><span class="n">' + (i + 1) + '</span>' + SR.icon(r.k, 56) + '<span><span class="lb">label <b>' + r.lab + '</b></span><br><span class="ey">the Eye: <b>' + r.eye + '</b></span></span><button type="button" title="Right or wrong? (for your own counting)"></button></div>';
          }).join('') + '</div><div class="dials"><h5>Write it on the board</h5>' +
          '<div class="dl" data-k="ov"><label>Right, all ten together</label><span class="v"></span><button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button><button type="button" data-d="1">+1</button><button type="button" data-d="10">+10</button></div>' +
          '<div class="dl" data-k="cn"><label>Right, the cans only</label><span class="v"></span><button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button><button type="button" data-d="1">+1</button><button type="button" data-d="10">+10</button></div>' +
          '<p>Both as per cent. The Eye is right when PAPER goes up the paper line, and when a CAN or an OTHER stays on the belt.</p></div></div></div>' +
          '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="tb-go">Write it on the board</button></div>';
        msgEl = box.querySelector('.pmsg');
        ER.$$('.row', box).forEach(function (r) {
          var i = r.getAttribute('data-i'), b = r.querySelector('button');
          function show() { b.className = marks[i] === 'y' ? 'y' : marks[i] === 'x' ? 'x' : ''; b.textContent = marks[i] === 'y' ? '✓' : marks[i] === 'x' ? '✗' : '?'; }
          b.addEventListener('click', function () { if (nextFile) return; marks[i] = marks[i] === 'y' ? 'x' : marks[i] === 'x' ? '' : 'y'; ER.flag('c-marks', marks); SR.sfx.dial(); show(); });
          show();
        });
        ER.$$('.dl', box).forEach(function (d) {
          var k = d.getAttribute('data-k'), v = d.querySelector('.v');
          function show() { v.textContent = val[k] + '%'; }
          ER.$$('button', d).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; val[k] = Math.max(0, Math.min(100, val[k] + parseInt(b.getAttribute('data-d'), 10))); ER.flag('c-val', val); SR.sfx.dial(); show(); }); });
          show();
        });
        box.querySelector('#tb-go').addEventListener('click', submit);
        msg(nextFile ? 'Five right out of ten, and one can out of four.' : 'The Eye has sorted the ten photos. How often was it right? Work it out, and write both numbers on the board.');
      }
    }
    function pick(id, node) {
      if (wait) return;
      if (ER.check('box', id)) {
        SR.sfx.thud(); stage = 2; ER.flag('c-stage', 2); SR.mine('fair', 'A fair test', '<p>Box B: our ten. New to the Eye (never trained on), labelled and checked, and from today&rsquo;s heap.</p><p>Not A (it learnt from those), not C (no labels), not D (another town, two years ago: no blue cans).</p>', true);
        render(); return;
      }
      ER.sfx.no(); node.classList.add('bad'); setTimeout(function () { node.classList.remove('bad'); }, 1300);
      if (id === 'a') msg('&ldquo;Those are the fifty it learnt from,&rdquo; says Jaz. &ldquo;It has seen every one. That is how it got ninety-four. Page twelve, rule one.&rdquo;');
      else if (id === 'c') msg('&ldquo;Three hundred photos and not one label,&rdquo; says Jaz. &ldquo;How would the screen know which of its answers are right?&rdquo;');
      else msg('&ldquo;New to it, and labelled,&rdquo; says Jaz, turning a photo over. &ldquo;But it&rsquo;s Gannaway&rsquo;s yard, two years ago. Not one blue can in the box. Does it look like our belt this week?&rdquo;');
    }
    function submit() {
      if (wait || nextFile) return;
      var ov = String(val.ov), cn = String(val.cn), file;
      if (!ER.check('ov', ov)) {
        ER.sfx.no();
        if (val.ov > 0 && val.ov <= 10) msg('&ldquo;' + val.ov + ' is how many,&rdquo; says Jaz. &ldquo;Page twelve wants per cent: right ÷ all × 100.&rdquo;');
        else msg('&ldquo;Check the first number,&rdquo; says Jaz. &ldquo;Count the rows where the Eye did the right thing. PAPER up the paper line is right. CAN or OTHER on the belt is right. Then out of ten.&rdquo;');
        return;
      }
      if (!ER.check('cn', cn)) {
        ER.sfx.no();
        if (val.cn > 0 && val.cn <= 4) msg('&ldquo;' + val.cn + ' is how many,&rdquo; says Jaz. &ldquo;As a per cent, out of the four cans?&rdquo;');
        else if (val.cn === val.ov) msg('&ldquo;That&rsquo;s the number for all ten again,&rdquo; says Jaz. &ldquo;Only the four cans this time. How many of them stayed on the belt?&rdquo;');
        else msg('&ldquo;Only the four CAN rows,&rdquo; says Jaz. &ldquo;How many of them stayed on the belt? Out of four, as a per cent.&rdquo;');
        return;
      }
      file = ER.exit(['b-' + ov + '-' + cn], { wait: true });
      if (!file) { msg('The screen goes blue. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      SR.terms(['test set', 'accuracy']);
      SR.mine('fifty', 'Ninety-four and fifty', '<p>Ilona: tested on the 50 it learnt from. 47 ÷ 50 × 100 = 94%.</p><p>Us: tested on 10 it had never seen. Right: 5. 5 ÷ 10 × 100 = 50%.</p><p>Cans only: 1 right out of 4. 1 ÷ 4 × 100 = 25%. The one it got right was the silver one.</p><p>No belt and no lens in this test, and it still went wrong: so not the motor, not Lyle&rsquo;s cloth. It is what it learnt.</p>', true);
      msg('&ldquo;Fifty,&rdquo; says Jaz quietly. &ldquo;And twenty-five for the cans.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Five right out of ten: fifty per cent. Of the four cans it kept one on the belt: twenty-five per cent. The one it got right was the silver one.',
          '&ldquo;No belt,&rdquo; says Jaz. &ldquo;No lens. Photos straight into its computer, and it still gets half of them wrong. So it isn&rsquo;t the motor, and it isn&rsquo;t Lyle&rsquo;s cloth. It&rsquo;s what it learnt.&rdquo;',
          'Gina takes Ilona&rsquo;s log off the hook and reads it again. &ldquo;Tested on the fifty photos. The same fifty it learnt from?&rdquo; &mdash; &ldquo;The same fifty,&rdquo; says Jaz. &ldquo;Like marking your own homework with the answers open in front of you.&rdquo;',
          '&ldquo;So ninety-four per cent was&hellip;&rdquo; &mdash; &ldquo;True,&rdquo; says Jaz. &ldquo;And no use. It only tells you it remembers its own examples.&rdquo;',
          'Gina picks up the phone and says three words to Lyle: &ldquo;It wasn&rsquo;t you.&rdquo; She listens for a moment. &ldquo;No, I won&rsquo;t put it in writing.&rdquo;',
          '&ldquo;The training kit is in the yard office,&rdquo; says Jaz. &ldquo;Ilona&rsquo;s fifty cards are still in its drawer. I want to see exactly what she gave it.&rdquo; It is twenty past twelve. Gina buys everybody a sandwich.'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    }
    render();
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; }, stage: function () { return stage; } };
  }
})();
</script>
