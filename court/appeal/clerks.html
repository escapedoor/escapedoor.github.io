  .lampglow{animation:glow 5s steps(4) infinite alternate}
  @keyframes glow{0%{opacity:.5}100%{opacity:.75}}

  /* the spikes */
  .sp{width:min(1160px,96vw);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  .sp-desk{padding:14px 16px 12px;background:#5a3a22 linear-gradient(180deg,#6a4628,#4a2e1a);box-shadow:0 22px 60px rgba(0,0,0,.6);border-radius:3px}
  .sp-tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;min-height:60px;padding:8px;background:rgba(20,12,6,.35);border:1px dashed rgba(240,210,150,.35)}
  .sp-card{position:relative;padding:5px 9px 5px 26px;background:#fffdf3 repeating-linear-gradient(transparent 0 19px,rgba(90,140,200,.25) 19px 20px);border-top:3px solid #d96a6a;
    font-family:'Caveat',cursive;font-weight:700;font-size:17.5px;line-height:20px;color:#1f2f5a;box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer;min-height:48px}
  .sp-card b{position:absolute;left:7px;top:5px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;color:#a33a3a}
  .sp-card.held{outline:3px solid #f2c94c;transform:translateY(-3px)}
  .sp-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
  .sp-spike{position:relative;min-height:250px;padding:40px 8px 8px;background:rgba(20,12,6,.25);border-radius:3px;cursor:pointer}
  .sp-spike:before{content:'';position:absolute;left:50%;top:42px;width:4px;margin-left:-2px;bottom:30px;background:linear-gradient(90deg,#8a7a4a,#f0dca0,#8a7a4a)}
  .sp-spike:after{content:'';position:absolute;left:50%;bottom:8px;width:120px;margin-left:-60px;height:20px;border-radius:50%;background:radial-gradient(ellipse,#e8c870,#8a6a2a)}
  .sp-spike h6{position:absolute;left:0;right:0;top:-2px;margin:0;text-align:center;font-family:'Stardos Stencil',serif;font-size:15px;letter-spacing:.08em;color:#f6e6b8}
  .sp-spike h6 small{display:block;font-family:'EB Garamond',serif;font-size:12.5px;letter-spacing:0;color:#e8d4a8;font-style:italic}
  .sp-spike .sp-card{position:relative;z-index:1;margin:0 0 -16px;font-size:15.5px;line-height:17px;min-height:0;padding-top:4px;padding-bottom:20px;transform:rotate(-1.5deg)}
  .sp-spike .sp-card:nth-child(even){transform:rotate(1.5deg)}
  .sp-spike.hot{background:rgba(242,201,76,.16)}
  .sp .pmsg{min-height:150px;font-size:16.5px}
</style>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null, spBox = null;

  (function () {
    var s = '', r, c, names = ['KO', 'TB', 'NL', 'MN', 'OL', 'LK', 'NM', 'KL', 'ON', 'MK', 'LO', 'NK', 'OM', 'KN', 'LM'];
    for (r = 0; r < 5; r++) for (c = 0; c < 6; c++) {
      var x = 392 + c * 62, y = 112 + r * 62, n = names[(r * 6 + c) % names.length];
      s += '<rect x="' + x + '" y="' + y + '" width="56" height="56" fill="#2a180c"/>';
      if ((r + c) % 3) s += '<rect x="' + (x + 6) + '" y="' + (y + 26) + '" width="44" height="26" fill="#f1ead8" transform="rotate(' + ((r * 7 + c * 3) % 9 - 4) + ' ' + (x + 28) + ' ' + (y + 39) + ')"/>';
      s += '<rect x="' + (x + 14) + '" y="' + (y + 2) + '" width="28" height="12" fill="#e8d6a8"/><text x="' + (x + 28) + '" y="' + (y + 12) + '" class="sT" font-size="9" fill="#3a2a1a">' + n + '</text>';
    }
    $('#pigs').innerHTML = s;
  })();

  ER.init({
    theme: 'court', story: 'appeal', storyTitle: 'Under the Lamp', id: 'clerks', no: 'I', title: 'The Clerks&rsquo; Room',
    go: 'Go in',
    intro: [
      'Seven years ago last spring, a bicycle shop in Norbeck burned down in the night. Nobody was hurt. Its mechanic, Nathan Kershaw, then twenty-three, was found guilty of setting the fire, and went to prison.',
      'Two years ago a delivery driver, selling his old van, found a memory card in the glovebox. Now the Criminal Cases Review Commission has sent the case to the Court of Appeal, and tomorrow at half past ten three judges at the Royal Courts of Justice will hear it.',
      'You are a pupil barrister at 2 Medlar Court, in the Temple, ten minutes&rsquo; walk from that court. Your pupil supervisor, Ms Niamh Lorimer, acts for Mr Kershaw. Monday 23 November, a quarter past six. The clerks are still here. So is the rain.'
    ],
    exit: {"next":"library","w":{"fd78551c":"12ed782b"}}, tags: {"k1":["9ea06556"],"k2":["e253df6a"],"k3":["9937b293"],"k4":["2f611ddd"],"k5":["ec5fdb68"],"k6":["c43aec2f"],"k7":["703785be"],"k8":["f713da51"],"k9":["49f44f4d"],"kq":["14db4df5"]},
    hints: hints, onBegin: begin
  });
  nextFile = ER.flag('c-file') || null;

  var ACT = '<h4>Criminal Appeal Act 1968</h4><h5>Ms Lorimer&rsquo;s copy &middot; the parts that matter tomorrow</h5>' +
    '<p class="s"><b>2 (1)</b> &hellip; the Court of Appeal&mdash; (a) shall allow an appeal against conviction if they think that the conviction is unsafe; and (b) shall dismiss such an appeal in any other case.</p>' +
    '<p class="pn">shall = must. No choice.  &ldquo;Unsafe&rdquo;: not &ldquo;innocent&rdquo;!</p>' +
    '<p class="s"><b>2 (2)</b> In the case of an appeal against conviction the Court shall, if they allow the appeal, quash the conviction.</p>' +
    '<p class="pn">quash = cancel. Gone.</p>' +
    '<p class="s"><b>7 (1)</b> Where the Court of Appeal allow an appeal against conviction and it appears to the Court that the interests of justice so require, they may order the appellant to be retried.</p>' +
    '<p class="pn">may = can, if they choose. Retried = a new trial, new jury, in the Crown Court. Never in this court.</p>' +
    '<p class="s"><b>23 (1)</b> The Court of Appeal may, if they think it necessary or expedient in the interests of justice&mdash; &hellip; (c) receive any evidence which was not adduced in the proceedings from which the appeal lies.</p>' +
    '<p class="pn">= the footage. The tests for it: s.23(2). Tomorrow.</p>' +
    '<p class="pn">They can only do what this lets them do. If it isn&rsquo;t on this page, they can&rsquo;t do it.</p>';

  var CARDS = [
    ['k1', 'If they think the conviction is unsafe, do they have to let me off?'],
    ['k2', 'If they think it&rsquo;s safe, can they still let me off, because I&rsquo;ve done my time?'],
    ['k3', 'If they let me off, does the conviction actually go away?'],
    ['k4', 'Can they tell everyone I&rsquo;m innocent?'],
    ['k5', 'Can they send it back for a new trial?'],
    ['k6', 'Will they have the whole trial again themselves, with a jury?'],
    ['k7', 'Can they make Mrs Kilner say sorry?'],
    ['k8', 'Can they give me compensation for the time I did?'],
    ['k9', 'Will they watch Liam&rsquo;s film?']];
  var SPIKES = [['S', 'THEY SHALL', 'must: no choice'], ['M', 'THEY MAY', 'can, if they choose'], ['N', 'THEY CANNOT', 'not theirs to do']];
  var WHY = {
    k1: 'Card 1. If they think it is unsafe, read 2(1)(a). Is there a choice in &ldquo;shall&rdquo;?',
    k2: 'Card 2. If they think it is safe, that is &ldquo;any other case&rdquo;. Read 2(1)(b): what shall they do then?',
    k3: 'Card 3. Read 2(2). When they allow an appeal, is quashing the conviction up to them?',
    k4: 'Card 4. Is there anything on that page about saying who is innocent? They can only do what the Act lets them do.',
    k5: 'Card 5. Read 7(1). A new trial: must they order one, or may they?',
    k6: 'Card 6. The whole trial again, with a jury? There is no jury in the Court of Appeal. A new trial would be in the Crown Court, and only if they order one.',
    k7: 'Card 7. Punishing a witness for being wrong? Is that anywhere on the page?',
    k8: 'Card 8. Compensation? Look for it on the page. It is not there, so it is not theirs to give.',
    k9: 'Card 9. Read 23(1). Receiving evidence the jury never saw: must they, or may they?'
  };
  var Q = [['a', 'to find that Nathan did not set the fire.'], ['b', 'to find that the conviction is unsafe, and to quash it.'], ['c', 'to hear the whole case again, and find him not guilty.']];

  function hints() {
    if (nextFile) return ['go', ['Ms Lorimer has sent you to the library. The button at the bottom of the screen takes you there.']];
    if (spBox) return ['spike', [
      'Each question goes on one spike. SHALL means the court must do it. MAY means it can, if it chooses. CANNOT means the Act gives the court no such power. Keep Ms Lorimer&rsquo;s copy of the Act open: the Notebook button above has it.',
      '2(1)(a) and 2(2) both say shall: if the conviction is unsafe they must allow the appeal, and then they must quash the conviction. 7(1) and 23(1) both say may: a new trial, and the footage. If a thing is not on the page at all, it is CANNOT. And if they think the conviction is safe, 2(1)(b) says they shall dismiss the appeal.',
      'SHALL: cards 1 and 3. MAY: cards 5 and 9. CANNOT: cards 2, 4, 6, 7 and 8. Then the sentence that asks for exactly what the Act can give: unsafe, and quashed.'
    ]];
    if (!ER.flag('c-lor')) return ['lor', ['Ms Lorimer is at the pigeonholes, in her wet coat. Talk to her.']];
    if (!ER.flag('c-act')) return ['act', ['Ms Lorimer&rsquo;s green copy of the Act is on the table at the front. Read it.']];
    if (!ER.flag('c-mott')) return ['mott', ['Mr Mott, the senior clerk, is behind his desk on the right, between telephones. He has something for you.']];
    return ['env', ['The envelope from Mr Mendes and the three brass spikes are on Mr Mott&rsquo;s desk. Click them.']];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#lor').classList.toggle('ready', !nextFile && !ER.flag('c-lor') && !busy);
    $('#env').classList.toggle('ready', !nextFile && !!ER.flag('c-mott') && !!ER.flag('c-act'));
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The clerks&rsquo; room. Mr Mott is telling a solicitor on the telephone that Ms Lorimer is &ldquo;in the library, and not to be disturbed by anyone, including me&rdquo;.'); return; }
    if (ER.flag('c-in')) { ER.say('The clerks&rsquo; room. Rain on the window, three telephones and one kettle.'); return; }
    busy = true; ER.flag('c-in', 1);
    ER.narrate([
      'Barristers in England work alone, but share a building, the clerks and the biscuits. That building is called chambers. The clerks run it: they take in the cases, fix the fees, and know where everybody is.',
      'The clerks&rsquo; room at 2 Medlar Court has a sash window full of rain, a wall of pigeonholes, a kettle, a cricket bat, and Mr Mott, the senior clerk, who has been here longer than the kettle.',
      'Ms Lorimer is at the pigeonholes, reading tomorrow&rsquo;s papers standing up, with her coat still on.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#lor').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Ms Lorimer has gone to the library ahead of you. Her umbrella has stayed, dripping into somebody else&rsquo;s pigeonhole.'); return; }
    if (ER.flag('c-lor')) { ER.say('&ldquo;The Act,&rdquo; says Ms Lorimer, without looking up. &ldquo;Then Mr Mott. Then the spikes.&rdquo;'); return; }
    ER.talk({
      who: 'Ms Lorimer', role: 'Counsel for Mr Kershaw · your pupil supervisor', face: window.FACE('lorimer'),
      lines: [
        { note: 'Ms Lorimer is reading a brief standing up, with her umbrella dripping into somebody else&rsquo;s pigeonhole.', a: 'You&rsquo;ve read the papers? Good. Now forget most of them. Tomorrow is not a trial. Nobody in that court will ask whether Nathan Kershaw set fire to that shop.' },
        { q: 'Then what will they ask?', a: 'One question: is the conviction safe? At his trial the Crown had to prove its case beyond reasonable doubt. The jury had to be sure. Nathan had to prove nothing. Tomorrow it is his appeal, so it is for us to persuade three judges that the conviction is unsafe.' },
        { a: 'Not that he is innocent. Unsafe. If you remember one word tonight, make it that one.' },
        { note: 'She takes a small green book out of her bag. Its spine is held together with tape.', a: 'Here is the whole court on one page. Read what they shall do and what they may do. Then Mr Mott has something for you.' }
      ],
      clue: { id: 'lor1', title: 'Ms Lorimer, at the pigeonholes', kind: 'What she said' }, last: 'Read the Act',
      done: function (seen) { if (seen) { ER.flag('c-lor', 1); paint(); AP.learn(['appellant', 'conviction', 'unsafe', 'beyond reasonable doubt']); } }
    });
  });
  $('#act').addEventListener('click', function () {
    if (busy) return;
    if (!ER.flag('c-lor')) { ER.say('A small green book with a taped spine: Ms Lorimer&rsquo;s. Better ask her first.'); return; }
    ER.read({ html: ACT, cls: 'act', clue: { id: 'act', title: 'The Criminal Appeal Act 1968 (Ms Lorimer&rsquo;s copy)', kind: 'Law' },
      done: function () { ER.flag('c-act', 1); paint(); AP.learn(['shall', 'may', 'quash', 'retrial', 'Court of Appeal']); } });
  });
  $('#mott').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('c-mott')) { ER.say('&ldquo;Middle spike,&rdquo; says Mr Mott, with a telephone under his chin. &ldquo;Mind your cuffs.&rdquo;'); return; }
    ER.talk({
      who: 'Mr Mott', role: 'Senior clerk · 2 Medlar Court', face: window.FACE('mott'),
      lines: [
        { note: 'Mr Kelvin Mott has been senior clerk at 2 Medlar Court for thirty-one years. He has a telephone on each ear and a third one ringing.', a: 'Evening. You&rsquo;re Ms Lorimer&rsquo;s pupil? Then that envelope is yours. Mr Mendes sent it round on a bicycle at five. The client wrote out his questions himself, one to a card, the way she likes.' },
        { q: 'Why one to a card?', a: 'So they can go on the spikes. She&rsquo;s the last barrister in London who uses my spikes. Three of them, brass, older than me. Shall, may, and cannot. Each question goes on the one it belongs to, and she reads them in the morning.' },
        { a: 'Mind the middle one. A silk tore his cuff on it in 1987. We still send him a Christmas card, by way of apology.' }
      ],
      clue: { id: 'mott1', title: 'Mr Mott, between telephones', kind: 'What he said' }, last: 'Take the envelope',
      done: function (seen) { if (seen) { ER.flag('c-mott', 1); paint(); } }
    });
  });
  function openIt() {
    if (busy) return;
    if (nextFile) { ER.say('Nine cards on three spikes, in Nathan&rsquo;s careful capitals and joined-up hand.'); return; }
    if (!ER.flag('c-lor')) { ER.say('An envelope addressed to Ms Lorimer, and three brass spikes. Ask Ms Lorimer what tonight is for.'); return; }
    if (!ER.flag('c-act')) { ER.say('&ldquo;The Act first,&rdquo; says Ms Lorimer. &ldquo;Then you&rsquo;ll know which spike is which.&rdquo;'); return; }
    if (!ER.flag('c-mott')) { ER.say('&ldquo;Oi,&rdquo; says Mr Mott, kindly. &ldquo;That&rsquo;s my desk. Come and ask.&rdquo;'); return; }
    openSpikes();
  }
  $('#env').addEventListener('click', openIt);
  $('#spk').addEventListener('click', openIt);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  AP.thing('#win', null, 'Rain on the Temple. Across the court, one lit window: somebody else&rsquo;s brief, somebody else&rsquo;s long night.', isBusy);
  AP.thing('#pig', 'pigeonhole', 'A pigeonhole for every barrister in chambers, each with two letters on it. NL is full to the top.', isBusy);
  AP.thing('#board', null, 'The diary board. Tomorrow: NL, R v Kershaw, Court of Appeal (Criminal Division), half past ten, before Lady Justice Lanyon, Mr Justice Muncaster and Mrs Justice Kendal.', isBusy);
  AP.thing('#kettle', null, 'A kettle, a tin labelled CLERKS ONLY, and a mug that says WORLD&rsquo;S OKAYEST BARRISTER. Nobody will say whose it is.', isBusy);
  AP.thing('#bat', null, 'A cricket bat signed by the chambers team of 1994, who lost every match that summer and are still proud of it.', isBusy);
  AP.thing('#phone', null, 'The telephone rings. Mr Mott looks at it as if it owes him money, and lets it.', isBusy);

  /* ---------- the spikes ---------- */
  function openSpikes() {
    var box = ER.el('div', 'sp'), saved = ER.flag('c-sp') || {}, at = saved.at || {}, q = saved.q || '', done = false, held = null;
    var s = '<div class="sp-desk"><div class="sp-tray"></div><div class="sp-row">';
    SPIKES.forEach(function (k) { s += '<div class="sp-spike" data-s="' + k[0] + '"><h6>' + k[1] + '<small>' + k[2] + '</small></h6></div>'; });
    s += '</div></div><div class="side"><h6>Tomorrow we ask the court</h6><div class="opts"></div><button type="button" class="btn" id="sp-go">Show Ms Lorimer</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.sp-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    CARDS.forEach(function (c) {
      var d = ER.el('div', 'sp-card', '<b>' + c[0].slice(1) + '</b>' + c[1]); d.setAttribute('data-k', c[0]);
      (at[c[0]] ? box.querySelector('.sp-spike[data-s="' + at[c[0]] + '"]') : tray).appendChild(d);
    });
    Q.forEach(function (o) {
      var b = ER.el('button', q === o[0] ? 'on' : '', ER.gloss(o[1])); b.type = 'button'; b.setAttribute('data-k', o[0]);
      b.addEventListener('click', function () { if (done) return; q = o[0]; ER.$$('.opts button', box).forEach(function (x) { x.classList.toggle('on', x === b); }); AP.sfx.card(); keep(); });
      box.querySelector('.opts').appendChild(b);
    });
    function keep() {
      at = {};
      ER.$$('.sp-spike .sp-card', box).forEach(function (c) { at[c.getAttribute('data-k')] = c.parentNode.getAttribute('data-s'); });
      ER.flag('c-sp', { at: at, q: q }); box.setAttribute('data-on', Object.keys(at).length);
    }
    function hold(c) { if (held) held.classList.remove('held'); held = c; if (c) c.classList.add('held'); }
    box.addEventListener('click', function (e) {
      if (done) return;
      var card = e.target.closest('.sp-card'), spike = e.target.closest('.sp-spike');
      if (card && !(held && spike && card.parentNode === spike && held !== card)) { hold(held === card ? null : card); AP.sfx.card(); return; }
      if (held && spike) { spike.appendChild(held); hold(null); AP.sfx.spike(); keep(); return; }
      if (held && e.target.closest('.sp-tray')) { tray.appendChild(held); hold(null); AP.sfx.card(); keep(); }
    });
    box.querySelector('#sp-go').addEventListener('click', function () {
      var i, k, bad = null, more = 0, cand, file, left = tray.querySelectorAll('.sp-card').length;
      if (done) return;
      if (left) { msg('&ldquo;' + (left === 1 ? 'One card is' : left + ' cards are') + ' still in the tray,&rdquo; says Ms Lorimer. &ldquo;Every question gets a spike. Even the ones that hurt.&rdquo;'); return; }
      for (i = 0; i < CARDS.length; i++) { k = CARDS[i][0]; if (!ER.check(k, at[k])) { if (!bad) bad = k; else more++; } }
      if (bad) { AP.bump('c-tries'); AP.sfx.hm(); msg('&ldquo;' + WHY[bad] + '&rdquo;' + AP.more(more, 'card')); return; }
      if (!q) { msg('&ldquo;Every card is on the right spike. So: what exactly do we ask the court for tomorrow? Choose a sentence above.&rdquo;'); return; }
      if (!ER.check('kq', q)) {
        AP.bump('c-tries'); AP.sfx.hm();
        msg(q === 'a' ? '&ldquo;Look at card 4, on its spike. Nobody in that court can find that he didn&rsquo;t do it, and we don&rsquo;t need them to.&rdquo;' : '&ldquo;Look at card 6. They don&rsquo;t hear the case again, and there&rsquo;s no jury to say not guilty. What does section 2 let them do?&rdquo;');
        return;
      }
      cand = CARDS.map(function (c) { return at[c[0]]; }).join('') + '+' + q;
      file = ER.exitOk([cand]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('c-file', file); AP.done('clerks'); AP.sfx.spike();
      msg('Ms Lorimer reads the spikes from the top down, the way a clerk checks the post. <b>&ldquo;Shall, shall. May, may. And five things nobody in that building can give him.&rdquo;</b>');
      AP.mine('spikes', 'What the court can do', '<p>SHALL (no choice): allow the appeal if the conviction is unsafe, and then quash it. If it is safe: dismiss it.</p><p>MAY (if they choose): receive the footage (s.23); order a new trial in the Crown Court (s.7).</p><p>CANNOT: hold the trial again itself; say he is innocent; punish Mrs Kilner; give compensation.</p><p>We ask for one thing: UNSAFE, and quashed.</p>', true);
      setTimeout(function () {
        ER.closeAll(); AP.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;He&rsquo;ll ask me every one of those again tomorrow,&rdquo; says Ms Lorimer, &ldquo;and I&rsquo;ll answer every one again. That isn&rsquo;t him being slow. That&rsquo;s seven years.&rdquo;',
          '&ldquo;Now. The court will read his trial looking for one thing: did the jury convict him for good reasons, or for bad ones? Go to the library, find the transcript, and read it with a pencil. Mrs Kemp will lend you a book. Don&rsquo;t let her see you eat.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('Click a card, then click the <b>spike</b> it belongs on. Click a card on a spike to pick it up again. Then choose the sentence that says what we ask for tomorrow.');
    spBox = box; keep();
    ER.open('ov-lock', box, function () { spBox = null; });
  }
})();
</script>
</body>
</html>
