  .tx-page{padding:12px 18px 10px 40px;background:#fbfbf6;border-left:24px solid #e4e2d6;box-shadow:0 22px 60px rgba(0,0,0,.6);font-family:'Courier Prime',monospace;color:#22242a}

  .tx-l{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:10px;padding:5px 6px;border-bottom:1px dotted #b9b4a4;cursor:pointer}

  .tx-tags button,.tx-rs button{text-align:left;padding:5px 8px;background:#f4ecd4;border:1px solid #b9a070;color:#2a1e10;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.06em;line-height:1.15;border-radius:2px}
  .tx-tags button[data-t="n"]{grid-column:1/3;background:#e4eee0}
  .tx-tags button:hover,.tx-rs button:hover{background:#fff6cc}
  .tx-rs{display:grid;gap:4px;margin-bottom:8px}

<script>
(function () {

    var st = '';
    for (i = 0; i < 12; i++) st += '<path d="M140 ' + (680 - i * 50) + 'l' + (i % 2 ? 120 : 120) + ' ' + (i % 2 ? -12 : 12) + 'v10l-120 ' + (i % 2 ? 12 : -12) + 'z"/>';
    $('#steps').innerHTML = st;
  })();

  ER.init({
    theme: 'court', story: 'appeal', storyTitle: 'Under the Lamp', id: 'library', no: 'II', title: 'The Library',
    go: 'Go in',
    intro: [
      'In the clerks&rsquo; room you put Nathan&rsquo;s nine questions on three spikes. If the conviction is unsafe the court shall allow the appeal, and shall quash it. It may receive the film, and may order a new trial in the Crown Court. It cannot hold the trial again itself, call anybody innocent, punish a witness or pay compensation. So tomorrow you ask for one thing: unsafe, and quashed.',
      'The library of the Inn stays open late for barristers with a hearing in the morning. Twenty past seven. The transcript of Nathan&rsquo;s trial is waiting on a reading desk under a green lamp.'
    ],
    exit: {"next":"conference","w":{"0f74d887":"edb2fc18"}}, tags: {"t-l1":["62912bb2"],"t-l2":["dd9431f0"],"t-l3":["96a62823"],"t-l4":["d614b32f"],"t-l5":["df7a99d0"],"t-l6":["1aaff212"],"t-l7":["a04a003f"],"r-l2":["3298f3be"],"r-l4":["141578b0"],"r-l6":["0f9d1c6e"]},
    hints: hints, onBegin: begin
  });
  nextFile = ER.flag('l-file') || null;

  function ico(d) { return '<svg viewBox="0 0 44 36"><g fill="none" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</g></svg>'; }
  var LUSBY = '<h4>Six Ways to Lose an Argument</h4><h5>K. M. Lusby, Pocket Logic for Advocates, third edition (1971), page 12</h5><div class="six">' +
    '<div>' + ico('<circle cx="32" cy="14" r="8"/><path d="M4 16h16M16 12l4 4-4 4"/>') + '<p><b>Attacking the person</b> <small>(ad hominem)</small><br>Answers the speaker instead of the point. &ldquo;Well, he would say that. Look at him.&rdquo;</p></div>' +
    '<div>' + ico('<circle cx="22" cy="7" r="4"/><path d="M22 11v12M14 15h16M22 23l-6 10M22 23l6 10M12 33l4-2M30 31l4 2"/>') + '<p><b>The straw man</b><br>Puts up a weaker copy of what the other side said, and knocks that down instead.</p></div>' +
    '<div>' + ico('<path d="M22 34V20M22 20L8 6M22 20l14-14"/><path d="M22 20l0-16" stroke-dasharray="2 3"/>') + '<p><b>The false choice</b> <small>(false dilemma)</small><br>Offers two choices as if there were no others. &ldquo;Either we close the road, or people will die.&rdquo;</p></div>' +
    '<div>' + ico('<circle cx="10" cy="18" r="7"/><circle cx="34" cy="18" r="7"/><path d="M10 18v-4M34 18l3 2M19 18h6M23 16l2 2-2 2"/>') + '<p><b>After it, so because of it</b> <small>(post hoc)</small><br>B came after A, so A must have caused B. &ldquo;I wore my lucky socks, and we won.&rdquo;</p></div>' +
    '<div>' + ico('<path d="M8 20l14-8 14 8-14 8z"/><path d="M14 24v6q8 5 16 0v-6M36 20v8"/>') + '<p><b>The appeal to authority</b><br>It must be true because an expert, or somebody important, says so. An expert&rsquo;s reasons are evidence. A title alone is not.</p></div>' +
    '<div>' + ico('<path d="M34 18a12 12 0 1 1-4-9"/><path d="M30 3v6h6"/>') + '<p><b>Arguing in a circle</b> <small>(circular reasoning)</small><br>The conclusion is hidden in the reasons. &ldquo;He is honest, because he says so, and an honest man would not lie.&rdquo;</p></div></div>' +
    '<p>To answer a bad argument, do two things: <b>name it</b>, and then <b>say exactly why it fails here</b>. The name alone wins nothing.</p>';

  var LINES = [
    ['l1', 'Day 1 &middot; Mr Nolan, opening the case for the Crown', '&ldquo;Mr Kershaw had a key to the shop, and he was the last person in it that night. He agrees with both of those things.&rdquo;'],
    ['l2', 'Day 2 &middot; Mr Ludlow, fire investigator, cross-examined', 'Q. Did you test the two battery chargers? A. I didn&rsquo;t need to. I&rsquo;ve been to more than four hundred fires in twenty-two years. I know a fire that&rsquo;s been set when I see one.'],
    ['l3', 'Day 2 &middot; Mr Lowther, who owned the shop', '&ldquo;We&rsquo;d had words on the Friday about his hours. He said it wasn&rsquo;t fair. He wasn&rsquo;t angry, exactly. Just quiet.&rdquo;'],
    ['l4', 'Day 4 &middot; Mr Nolan, closing speech', '&ldquo;You heard Mr Kershaw tell you how much he loved that shop. This is a young man with a skull tattooed on his arm, who spends his nights on computer games. You may think you know the type.&rdquo;'],
    ['l5', 'Day 4 &middot; Mr Nolan, closing speech', '&ldquo;Mrs Kilner did not know Mr Kershaw. She had nothing to gain from either side. She came here to tell you what she remembers.&rdquo;'],
    ['l6', 'Day 4 &middot; Mr Nolan, closing speech', '&ldquo;At ten to ten he locked the door. Forty minutes later that shop was on fire. The fire came after him, members of the jury, as night follows day.&rdquo;'],
    ['l7', 'Day 4 &middot; His Honour Judge Kingham, summing up', '&ldquo;You have heard two experts, Mr Ludlow and Dr Mowat. You do not have to accept what either of them says. Look at their reasons, and decide what weight to give them.&rdquo;']];
  var TAGS = [['n', 'FAIR POINT'], ['ah', 'ATTACKING THE PERSON'], ['sm', 'STRAW MAN'], ['fd', 'FALSE CHOICE'], ['ph', 'AFTER IT, SO BECAUSE OF IT'], ['aa', 'APPEAL TO AUTHORITY'], ['cr', 'ARGUING IN A CIRCLE']];
  var TNAME = {}; TAGS.forEach(function (t) { TNAME[t[0]] = t[1]; });
  var REASONS = [
    ['a', 'He gives his experience instead of a reason. Four hundred other fires are not a test of these two chargers.'],
    ['b', 'Coming after is not the same as being caused by. Forty minutes is a long time in a workshop full of charging batteries.'],
    ['c', 'A tattoo and computer games say nothing about who set a fire. It answers the man, not his evidence.'],
    ['d', 'It offers two choices as if there were no others.']];
  var RTEXT = {}; REASONS.forEach(function (r) { RTEXT[r[0]] = r[1]; });
  var WHY = {
    l1: 'Line 1 is a plain fact, and Nathan agrees with it. An agreed fact is not a bad argument, however much it hurts.',
    l2: 'Line 2. Mr Ludlow did no test. What does he give the jury instead of a reason?',
    l3: 'Line 3 is Mr Lowther saying what happened on the Friday. A quarrel may be weak evidence, but it is evidence about events, not an attack on anybody.',
    l4: 'Line 4. What has a tattoo, or a computer game, to do with who set a fire? Whom is Mr Nolan answering: the evidence, or the man?',
    l5: 'Line 5 is true: Mrs Kilner had nothing to gain. Saying a witness is honest is fair. Whether she is right is a different question.',
    l6: 'Line 6. One thing came after another. Does that show that the first caused the second?',
    l7: 'Line 7 is the judge telling the jury to weigh the experts&rsquo; reasons. That is the cure for an appeal to authority, not an example of one.'
  };
  var BAD = { ah: 1, sm: 1, fd: 1, ph: 1, aa: 1, cr: 1 };

  function hints() {
    if (nextFile) return ['go', ['Nathan is waiting upstairs at chambers. The button at the bottom of the screen takes you to Conference Room 2.']];
    if (txBox) return ['tx', [
      'Click a line, then click a name on the right: FAIR POINT, or the name of the bad argument it is. For every bad one, click the slip that says exactly why it fails. Lusby&rsquo;s page is in your notebook.',
      'Four of the seven lines are fair: an agreed fact, a quarrel told as it happened, a witness with nothing to gain, and the judge&rsquo;s advice about experts. The three bad ones: an expert who gives his experience instead of a test, one thing coming after another, and a remark about a tattoo.',
      'Line 2: APPEAL TO AUTHORITY, with the slip about four hundred other fires. Line 4: ATTACKING THE PERSON, with the slip about the tattoo. Line 6: AFTER IT, SO BECAUSE OF IT, with the slip about forty minutes. Lines 1, 3, 5 and 7: FAIR POINT. One slip fits no line at all.'
    ]];
    if (!ER.flag('l-lor')) return ['lor', ['Ms Lorimer is at the far end of the long table, writing in green ink. Talk to her.']];
    if (!ER.flag('l-kemp')) return ['kemp', ['Mrs Kemp, the night librarian, is at her desk on the right. Ms Lorimer said she has a book for you.']];
    if (!ER.flag('l-book')) return ['book', ['The small red book on Mrs Kemp&rsquo;s desk is Lusby&rsquo;s Pocket Logic. Read page twelve.']];

  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#lor').classList.toggle('ready', !nextFile && !ER.flag('l-lor') && !busy);
    $('#kemp').classList.toggle('ready', !nextFile && !!ER.flag('l-lor') && !ER.flag('l-kemp') && !busy);

    if (nextFile) { ER.say('The library. Mrs Kemp is putting Lusby back on its shelf, exactly where it was, to the millimetre.'); return; }

    ER.narrate([
      'Every barrister belongs to one of the four Inns of Court, and every Inn has a library. This one has two storeys of law reports in red and green and brown, a gallery reached by a spiral stair, and a window with the moon in it.',
      'At the far end of the long table, under a green lamp, Ms Lorimer is writing tomorrow&rsquo;s argument in green ink. At her desk by the door, Mrs Kemp the night librarian is watching you in case you are carrying a sandwich.'
    ], function () { busy = false; paint(); });

  /* ---------- the room ---------- */
  $('#lor').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Ms Lorimer has gone up to chambers. Her green ink is drying on the pad she forgot.'); return; }

    ER.talk({
      who: 'Ms Lorimer', role: 'Counsel for Mr Kershaw · in the library', face: window.FACE('lorimer'),
      lines: [
        { note: 'Ms Lorimer is writing on a pad in green ink. She does not look up until she has finished the sentence.', a: 'The transcript of his trial is on the reading desk: four days, six hundred pages, and I have marked seven lines. The Court of Appeal will read them looking for one thing: did the jury convict for good reasons, or bad ones?' },
        { q: 'How do I tell?', a: 'Some of what Mr Nolan said for the Crown was perfectly fair. Some of it was among the oldest tricks there are, and the tricks have names. Mrs Kemp has the book. Be polite to her. She is the only person in the Temple more frightening than a judge.' },
        { a: 'For each line: a fair point, or a bad argument? If it&rsquo;s bad, give it its name, and then say exactly why it fails. The name alone wins nothing.' }
      ],
      clue: { id: 'lor2', title: 'Ms Lorimer, in the library', kind: 'What she said' }, last: 'Go and see Mrs Kemp',
      done: function (seen) { if (seen) { ER.flag('l-lor', 1); paint(); AP.learn(['transcript']); } }
    });
  });
  $('#kemp').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('l-kemp')) { ER.say('&ldquo;Page twelve,&rdquo; whispers Mrs Kemp, &ldquo;and it does not leave this room.&rdquo;'); return; }
    if (!ER.flag('l-lor')) { ER.say('Mrs Kemp looks at you over her glasses, then at Ms Lorimer, then back at you. Perhaps Ms Lorimer first.'); return; }
    ER.talk({
      who: 'Mrs Kemp', role: 'Night librarian of the Inn', face: window.FACE('kemp'),
      lines: [
        { note: 'Mrs Odette Kemp has a grey plait, a long green cardigan, and a pencil behind her ear that she has not needed since 1998.', a: 'Ms Lorimer&rsquo;s pupil. She telephoned. You&rsquo;ll be wanting Lusby.' },
        { q: 'Lusby?', a: 'Pocket Logic for Advocates, third edition, 1971. Small, red, and right. Nobody reads it, and everybody should. Page twelve: six ways to lose an argument. The judges have all read it, whatever they tell you.' },
        { a: 'It does not leave this room. Nor do you, until it is back on my desk. And whatever you are eating, I can hear it.' }
      ],
      clue: { id: 'kemp1', title: 'Mrs Kemp, at her desk', kind: 'What she said' }, last: 'Take the book',
      done: function (seen) { if (seen) { ER.flag('l-kemp', 1); paint(); $('#book').classList.add('ready'); } }
    });
  });
  $('#book').addEventListener('click', function () {
    if (busy) return;
    if (!ER.flag('l-kemp')) { ER.say('A small red book on the librarian&rsquo;s desk. You would not dare without asking.'); return; }
    $('#book').classList.remove('ready');
    ER.read({ html: LUSBY, cls: 'logic', clue: { id: 'lusby', title: 'Lusby: Six Ways to Lose an Argument', kind: 'A book' },
      done: function () { ER.flag('l-book', 1); paint(); AP.learn(['ad hominem', 'straw man', 'false dilemma', 'post hoc', 'appeal to authority', 'circular reasoning']); } });
  });
  $('#tr').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The transcript, with your pencil in the margin of seven lines.'); return; }
    if (!ER.flag('l-lor')) { ER.say('A lever-arch file open on a reading desk: R v Kershaw, Day 4. Ask Ms Lorimer what she wants done with it.'); return; }
    if (!ER.flag('l-book')) { ER.say('&ldquo;The book first,&rdquo; says Ms Lorimer. &ldquo;You can&rsquo;t name what you haven&rsquo;t met.&rdquo;'); return; }
    openTx();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  AP.thing('#win', null, 'The moon over the Temple, going in and out of a cloud as if it had not decided whether to stay.', isBusy);
  AP.thing('#stair', null, 'A spiral stair up to the gallery. Somebody has put a sign on it: ONE AT A TIME. NO RUNNING. NO EXCEPTIONS FOR SILKS.', isBusy);
  AP.thing('#ladder', null, 'A library ladder on a brass rail, for the law reports of 1880 to 1910, which nobody has wanted since 1910.', isBusy);
  AP.thing('#portrait', null, 'A long-dead judge in a full wig, painted looking as if he disapproves of electric light.', isBusy);
  AP.thing('#bell', null, 'A brass bell, and a card: RING FOR ASSISTANCE. Under it, in pencil: OR, BETTER, DON&rsquo;T.', isBusy);

  /* ---------- the transcript ---------- */
  function openTx() {
    var box = ER.el('div', 'tx'), saved = ER.flag('l-tx') || {}, tg = saved.t || {}, rs = saved.r || {}, sel = null, done = false;
    var s = '<div class="tx-page"><h5>R v Kershaw &middot; Norbeck Crown Court &middot; December 2019 &middot; the seven lines Ms Lorimer marked</h5>';
    LINES.forEach(function (l, i) {
      s += '<div class="tx-l" data-l="' + l[0] + '"><span class="no">' + (i + 1) + '</span><div><span class="who">' + l[1] + '</span><span class="say">' + l[2] + '</span></div><div class="tx-m"></div></div>';
    });
    s += '</div><div class="side"><h6>Name it</h6><div class="tx-tags"></div><h6>Why it fails</h6><div class="tx-rs"></div><button type="button" class="btn" id="tx-go">Show Ms Lorimer</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    TAGS.forEach(function (t) {
      var b = ER.el('button', '', t[1]); b.type = 'button'; b.setAttribute('data-t', t[0]);
      b.addEventListener('click', function () {
        if (done) return;
        if (!sel) { msg('Click a line on the page first, then its name.'); return; }
        var k = sel.getAttribute('data-l'); tg[k] = t[0]; if (!BAD[t[0]]) delete rs[k];
        AP.sfx.pencil(); keep();
      });
      box.querySelector('.tx-tags').appendChild(b);
    });
    REASONS.forEach(function (r) {
      var b = ER.el('button', '', r[1]); b.type = 'button'; b.setAttribute('data-r', r[0]);
      b.addEventListener('click', function () {
        if (done) return;
        if (!sel) { msg('Click a line on the page first.'); return; }
        var k = sel.getAttribute('data-l');
        if (!BAD[tg[k]]) { msg('Give that line the name of a bad argument first. A fair point needs no reason why it fails.'); return; }
        rs[k] = r[0]; AP.sfx.pencil(); keep();
      });
      box.querySelector('.tx-rs').appendChild(b);
    });
    ER.$$('.tx-l', box).forEach(function (l) {
      l.addEventListener('click', function () { if (done) return; sel = l; ER.$$('.tx-l', box).forEach(function (o) { o.classList.toggle('sel', o === l); }); AP.sfx.card(); });
    });
    function keep() {
      ER.flag('l-tx', { t: tg, r: rs });
      var named = 0;
      ER.$$('.tx-l', box).forEach(function (l) {
        var k = l.getAttribute('data-l'), m = l.querySelector('.tx-m'), t = tg[k];
        if (t) named++;
        m.innerHTML = t ? '<b' + (BAD[t] ? ' class="bad"' : '') + '>' + TNAME[t] + '</b>' + (rs[k] ? '<span>' + RTEXT[rs[k]] + '</span>' : (BAD[t] ? '<span>why?</span>' : '')) : '';
      });
      box.setAttribute('data-named', named);
    }
    box.querySelector('#tx-go').addEventListener('click', function () {
      var i, k, bad = null, more = 0, file, cand, miss = null;
      if (done) return;
      for (i = 0; i < LINES.length; i++) if (!tg[LINES[i][0]]) { msg('&ldquo;Line ' + (i + 1) + ' has nothing in the margin,&rdquo; says Ms Lorimer. &ldquo;Fair or not, every line gets a word.&rdquo;'); return; }
      for (i = 0; i < LINES.length; i++) { k = LINES[i][0]; if (!ER.check('t-' + k, tg[k])) { if (!bad) bad = k; else more++; } }
      if (bad) { AP.bump('l-tries'); AP.sfx.hm(); msg('&ldquo;' + WHY[bad] + '&rdquo;' + AP.more(more, 'line')); return; }
      for (i = 0; i < LINES.length; i++) { k = LINES[i][0]; if (BAD[tg[k]] && !rs[k]) { miss = i + 1; break; } }
      if (miss) { msg('&ldquo;Good names. Now line ' + miss + ': you&rsquo;ve named it, so say why it fails. Choose a slip.&rdquo;'); return; }
      for (i = 0; i < LINES.length; i++) { k = LINES[i][0]; if (BAD[tg[k]] && !ER.check('r-' + k, rs[k])) { if (!bad) bad = k; else more++; } }
      if (bad) {
        AP.bump('l-tries'); AP.sfx.hm();
        msg(rs[bad] === 'd' ? '&ldquo;Two choices as if there were no others? Is there a false choice anywhere on line ' + bad.slice(1) + '? That slip belongs to a different trick.&rdquo;' : '&ldquo;The name on line ' + bad.slice(1) + ' is right, but the reason you gave belongs to another line. Read it against the line.&rdquo;' + AP.more(more, 'reason'));
        return;
      }
      cand = LINES.map(function (l) { return tg[l[0]]; }).join(',') + '+' + LINES.filter(function (l) { return BAD[tg[l[0]]]; }).map(function (l) { return rs[l[0]]; }).join(',');
      file = ER.exitOk([cand]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('l-file', file); AP.done('library'); AP.sfx.pencil();
      msg('Ms Lorimer reads down your margin and nods at each line. <b>&ldquo;Four fair points. Three bad ones, each with its name and its reason. That is how you answer an argument.&rdquo;</b>');
      AP.mine('pencil', 'The old trial, in pencil', '<p>FAIR: he had a key and was last out (agreed). The quarrel on the Friday. Mrs Kilner had nothing to gain. The judge: weigh the experts&rsquo; reasons.</p><p>APPEAL TO AUTHORITY: Mr Ludlow, &ldquo;four hundred fires&rdquo;, but no test of the chargers.</p><p>ATTACKING THE PERSON: the tattoo and the computer games.</p><p>AFTER IT, SO BECAUSE OF IT: &ldquo;the fire came after him&rdquo;, forty minutes later.</p><p>Not used yet: straw man, false choice, arguing in a circle.</p>', true);
      setTimeout(function () {
        ER.closeAll(); AP.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Now the part they don&rsquo;t put in books,&rdquo; says Ms Lorimer. &ldquo;Line 4 was a disgrace, and the judge told the jury to put it out of their minds. That is one reason the Court refused him leave to appeal in 2020. A bad argument is not always a ground of appeal.&rdquo;',
          '&ldquo;But look at what is left when you take the bad ones out. A key. A quarrel. The last to leave. And Mrs Kilner. The whole case stands on what she remembers.&rdquo;',
          '&ldquo;Three names you didn&rsquo;t need tonight: the straw man, the false choice, the circle. Keep them in your pocket. Somebody will use one tomorrow without knowing it.&rdquo; She caps her pen. &ldquo;Nathan is coming in at nine. Conference Room 2. Bring her three tellings.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('<b>Click a line</b>, then click its name: <b>fair point</b>, or the bad argument it is. For each bad one, click the slip that says <b>why it fails</b>.');
    txBox = box; keep();
    ER.open('ov-lock', box, function () { txBox = null; });
  }
})();
</script>
