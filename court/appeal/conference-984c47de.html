    ['ly', 'She wants to see him punished, and is making it up', 'she is making it up'],
    ['ey', 'Her eyesight is poor in the dark', 'her eyesight']];
  var SHORT = {}; CAUSES.forEach(function (c) { SHORT[c[0]] = c[2]; });
  var SLOTS = ['t1', 't2', 'm1', 'm2', 'h1', 'h2', 's1', 's2'];
  var WHY = {
    t1: 'When, first change: &ldquo;half nine, ten?&rdquo; became &ldquo;about ten, maybe just after&rdquo;. What was she asked just before she said it? Read DC Marr&rsquo;s questions.',
    t2: 'When, second change: &ldquo;about ten&rdquo; became &ldquo;ten past ten. I&rsquo;m certain&rdquo;. Nobody gave her that time. What does she say she did, every night?',
    m1: 'How he moved, first change: walking became hurrying. Which of DC Marr&rsquo;s questions had running folded up inside it?',
    m2: 'How he moved, second change: hurrying became running. No new question and no new paper. What happened to the story between May and December?',
    h1: 'What he had, first change: a helmet became something like a can. Who said &ldquo;can&rdquo; first, Mrs Kilner or DC Marr?',
    h2: 'What he had, second change: something like a can became a red petrol can. Where could she have seen a red petrol can? Read the Messenger.',
    s1: 'How sure, first change: &ldquo;I didn&rsquo;t really look&rdquo; became &ldquo;I&rsquo;d know him again&rdquo;. What had she been shown on the Sunday?',
    s2: 'How sure, second change: &ldquo;fairly sure&rdquo; became &ldquo;I&rsquo;ll never forget his face&rdquo;. What was she told at the identification, before and after she chose?'
  };
  var Q = [['a', 'Mrs Kilner lied, and her evidence should be thrown out.'], ['b', 'Mrs Kilner was honest. Her first telling came before anybody suggested anything, so it is the one to test.'], ['c', 'Mrs Kilner was honest, so the jury were right to believe what she told them at the trial.']];
  var NEED = ['mem', 't7', 't8', 't12', 'idr', 'cut'];
  var NAMES = { mem: 'Dr Okello&rsquo;s book, on the shelf', t7: 'the 999 call', t8: 'DC Marr&rsquo;s body-worn video', t12: 'the trial transcript', idr: 'the identification record', cut: 'the Messenger cutting' };

  function unread() { return NEED.filter(function (k) { return !ER.flag('m-' + k); }); }
  function hints() {
    if (nextFile) return ['go', ['Tomorrow morning: the café on the Strand. The button at the bottom of the screen takes you there.']];
    if (mcBox) return ['chart', [
      'Each row is one detail of what she saw. Between one telling and the next, the detail changed: click a cause on the right, then click the dashed circle where it fits. Every cause comes from one of the papers in your notebook.',
      'The first changes came on Monday 15 April, in DC Marr&rsquo;s questions, and from the photo on Lettie&rsquo;s phone the day before. The second changes came from the Messenger&rsquo;s red can, from what PS Ness said at the identification, and from seven months of going over it. Two of the causes are wrong about her altogether.',
      'When: &ldquo;shortly before the fire?&rdquo;, then going over it every night. How he moved: &ldquo;how fast was he running?&rdquo;, then going over it. What he had: &ldquo;the can he had?&rdquo;, then the red can in the paper. How sure: the photo on Lettie&rsquo;s phone, then &ldquo;well done, that&rsquo;s our man&rdquo;. And she was honest: her first telling is the one to test.'
    ]];
    if (!ER.flag('m-nat')) return ['nat', ['Nathan Kershaw is at the table, beside his helmet and a cold cup of tea. Talk to him.']];
    if (!ER.flag('m-lor')) return ['lor', ['Ms Lorimer is standing at the dormer window. Talk to her.']];
    var u = unread();
    if (u.length) return ['read', ['Read everything before you go to the flip chart. Still to read: ' + u.map(function (k) { return NAMES[k]; }).join(', ') + '.']];
    return ['chartgo', ['The flip chart on its easel, on the right: What changed, and why? Click it.']];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#nat').classList.toggle('ready', !nextFile && !ER.flag('m-nat') && !busy);
    $('#lor').classList.toggle('ready', !nextFile && !!ER.flag('m-nat') && !ER.flag('m-lor') && !busy);
    $('#chart').classList.toggle('ready', !nextFile && !!ER.flag('m-lor') && !unread().length);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Conference Room 2, after midnight. The flip chart is covered in red arrows. Nathan has taken his helmet home.'); return; }
    if (ER.flag('m-in')) { ER.say('Conference Room 2. Rain on the dormer window, one lamp, and the papers fanned out along the table.'); return; }
    busy = true; ER.flag('m-in', 1);
    ER.narrate([
      'Conference Room 2 is where clients sit and wait to be told things. It has a long table, a lamp on a chain that moves a little when the wind finds the roof, and a dormer window full of rain and wet slates.',
      'Ms Lorimer has fanned five papers along the table, three of them with Mrs Kilner&rsquo;s words in them. Nathan sits behind them, with his cycle helmet beside the tea, as if somebody might ask to see it.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#nat').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('m-nat')) { ER.say(nextFile ? 'Nathan has gone home on his bicycle, in the rain, with his helmet on.' : 'Nathan turns his tea round and round by the handle and does not drink it.'); return; }
    ER.talk({
      who: 'Nathan Kershaw', role: 'The appellant', face: window.FACE('nathan'),
      lines: [
        { note: 'Nathan Kershaw is thirty-one, broad in the shoulders, with oil in the creases of his knuckles that soap has given up on. He works in a bicycle repair shop in east London now.', a: 'I locked up at ten to ten. Put my helmet on outside, under the lamp, and rode home. That&rsquo;s it. That&rsquo;s what I said in 2019, and it&rsquo;s what I&rsquo;ll say tomorrow, if anybody asks me.' },
        { q: 'What do you think of Mrs Kilner?', a: 'People think I must hate her. I don&rsquo;t. She saw me. I was there. She just remembers it wrong, and everybody kept telling her she remembered it right.' },
        { q: 'And the petrol can?', a: 'Mr Lowther&rsquo;s, for his scooter. Lived in the yard. Empty for months. My fingerprints weren&rsquo;t on it. The jury heard all that.' },
        { a: 'Ms Lorimer says not to hope. So I&rsquo;m not. I&rsquo;ve just brought the helmet, in case.' }
      ],
      clue: { id: 'nat1', title: 'Nathan Kershaw, in conference', kind: 'What he said' }, last: 'Close',
      done: function (seen) { if (seen) { ER.flag('m-nat', 1); paint(); } }
    });
  });
  $('#lor').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Ms Lorimer is writing a note to herself on the back of an envelope: FIRST TELLING.'); return; }
    if (ER.flag('m-lor')) { ER.say('&ldquo;Read everything,&rdquo; says Ms Lorimer, &ldquo;then the chart.&rdquo;'); return; }
    if (!ER.flag('m-nat')) { ER.say('Ms Lorimer nods towards Nathan. Say good evening to the client first.'); return; }
    ER.talk({
      who: 'Ms Lorimer', role: 'Counsel for Mr Kershaw · in conference', face: window.FACE('lorimer'),
      lines: [
        { note: 'Ms Lorimer stands at the dormer window with her back to the rain.', a: 'Three times Mrs Kilner told what she saw. On the night, to the 999 operator. Two days later, to a detective, with his camera running. And seven months later, to the jury. They are not the same story.' },
        { q: 'Was she lying?', a: 'That is what the Crown would love us to say, so that they can be shocked. No. Read Dr Okello first: page 41, the blue book on the shelf. Then all three tellings, and the two papers that came in between them.' },
        { a: 'Then the flip chart. For every change from one telling to the next, put up what caused it. Everything she added came from somewhere. Find where.' }
      ],
      clue: { id: 'lor3', title: 'Ms Lorimer, at the window', kind: 'What she said' }, last: 'Start reading',
      done: function (seen) { if (seen) { ER.flag('m-lor', 1); paint(); AP.learn(['eyewitness']); } }
    });
  });
  $('#mem').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MEM, cls: 'mem', clue: { id: 'okello', title: 'Dr Okello: Memory is not a recording', kind: 'A book' },
      done: function () { ER.flag('m-mem', 1); paint(); AP.learn(['leading question', 'first account']); } });
  });
  Object.keys(DOCS).forEach(function (k) {
    $('#' + k).addEventListener('click', function () {
      if (busy) return;
      var d = DOCS[k];
      ER.read({ html: d[1], cls: d[0], clue: { id: k, title: d[2], kind: d[3] },
        done: function () { ER.flag('m-' + k, 1); paint(); if (k === 'idr') AP.learn(['line-up']); if (k === 't8') AP.learn(['body-worn video']); } });
    });
  });
  $('#chart').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The flip chart: four rows, eight red arrows, and underneath, in Ms Lorimer&rsquo;s writing: SHE NEVER LIED.'); return; }
    if (!ER.flag('m-lor')) { ER.say('A flip chart: What changed, and why? Talk to Nathan and Ms Lorimer first.'); return; }
    var u = unread();
    if (u.length) { ER.say('&ldquo;Read everything first,&rdquo; says Ms Lorimer. Still to read: ' + u.map(function (k) { return NAMES[k]; }).join(', ') + '.'); return; }
    openChart();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  AP.thing('#win', null, 'Rain on the dormer window, wet slates, and the roof of the round church in the Temple, eight hundred years old, black against a grey sky.', isBusy);
  AP.thing('#coat', null, 'Nathan&rsquo;s work jacket on the coat stand: yellow, with silver stripes that light up in headlights.', isBusy);
  AP.thing('#helmet', null, 'An orange cycle helmet, scuffed on one side. Not the one from 2019: the police kept that one for a year, and then gave it back cracked.', isBusy);
  AP.thing('#tea', null, 'A cup of tea, gone cold, with a skin on it.', isBusy);

  /* ---------- the flip chart ---------- */
  function openChart() {
    var box = ER.el('div', 'mc'), saved = ER.flag('m-mc') || {}, at = saved.at || {}, q = saved.q || '', held = null, done = false;
    var s = '<div><div class="mc-sheet"><h5>What changed, and why?</h5><div class="mc-g"><div></div><div class="hd">On the night: the 999 call</div><div class="hd">what caused it?</div><div class="hd">Two days later: DC Marr</div><div class="hd">what caused it?</div><div class="hd">Seven months later: the trial</div>';
    ROWS.forEach(function (r) {
      s += '<div class="rw">' + r[1] + '</div><div class="ph">' + r[2] + '</div><div class="mc-s" data-s="' + r[0] + '1"></div><div class="ph">' + r[3] + '</div><div class="mc-s" data-s="' + r[0] + '2"></div><div class="ph">' + r[4] + '</div>';
    });
    s += '</div></div><div class="mc-q"><h6>So, Mrs Kilner</h6><div class="opts"></div></div></div><div class="side"><h6>Causes</h6><div class="mc-c"></div><button type="button" class="btn" id="mc-go">Show Ms Lorimer</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    CAUSES.forEach(function (c) {
      var b = ER.el('button', '', c[1]); b.type = 'button'; b.setAttribute('data-c', c[0]);
      b.addEventListener('click', function () { if (done) return; held = held === c[0] ? null : c[0]; ER.$$('.mc-c button', box).forEach(function (x) { x.classList.toggle('held', x.getAttribute('data-c') === held); }); AP.sfx.card(); });
      box.querySelector('.mc-c').appendChild(b);
    });
    ER.$$('.mc-s', box).forEach(function (sl) {
      sl.addEventListener('click', function () {
        if (done) return;
        var k = sl.getAttribute('data-s');
        if (held) { at[k] = held; AP.sfx.pencil(); } else if (at[k]) { delete at[k]; AP.sfx.card(); } else { msg('Click a cause on the right first, then the circle it belongs in. A cause can be used more than once.'); return; }
        keep();
      });
    });
    Q.forEach(function (o) {
      var b = ER.el('button', q === o[0] ? 'on' : '', ER.gloss(o[1])); b.type = 'button'; b.setAttribute('data-k', o[0]);
      b.addEventListener('click', function () { if (done) return; q = o[0]; ER.$$('.opts button', box).forEach(function (x) { x.classList.toggle('on', x === b); }); AP.sfx.card(); keep(); });
      box.querySelector('.opts').appendChild(b);
    });
    function keep() {
      ER.flag('m-mc', { at: at, q: q });
      ER.$$('.mc-s', box).forEach(function (sl) { var c = at[sl.getAttribute('data-s')]; sl.classList.toggle('on', !!c); sl.innerHTML = c ? SHORT[c] : 'cause?'; });
      box.setAttribute('data-in', Object.keys(at).length);
    }
    box.querySelector('#mc-go').addEventListener('click', function () {
      var i, k, bad = null, more = 0, file, cand;
      if (done) return;
      for (i = 0; i < SLOTS.length; i++) if (!at[SLOTS[i]]) { msg('&ldquo;There&rsquo;s still an empty circle,&rdquo; says Ms Lorimer. &ldquo;Every change came from somewhere.&rdquo;'); return; }
      for (i = 0; i < SLOTS.length; i++) { k = SLOTS[i]; if (!ER.check(k, at[k])) { if (!bad) bad = k; else more++; } }
      if (bad) {
        AP.bump('m-tries'); AP.sfx.hm();
        if (at[bad] === 'ly') msg('&ldquo;Making it up? She didn&rsquo;t know him and gained nothing. And look: every change comes just after something from outside her.&rdquo;' + AP.more(more, 'circle'));
        else if (at[bad] === 'ey') msg('&ldquo;Her eyesight? Her eyes did not change between April and December. Her story did, and every change came just after something from outside her.&rdquo;' + AP.more(more, 'circle'));
        else msg('&ldquo;' + WHY[bad] + '&rdquo;' + AP.more(more, 'circle'));
        return;
      }
      if (!q) { msg('&ldquo;Every arrow is right. So: what do we say about Mrs Kilner tomorrow? Choose a sentence.&rdquo;'); return; }
      if (!ER.check('kq', q)) {
        AP.bump('m-tries'); AP.sfx.hm();
        msg(q === 'a' ? '&ldquo;Lied? Every change came from outside her. A liar invents things. She was given them.&rdquo;' : '&ldquo;Honest, yes. But read Dr Okello again: confidence in court is not proof. An honest witness can be honestly wrong.&rdquo;');
        return;
      }
      cand = SLOTS.map(function (k) { return at[k]; }).join(',') + '+' + q;
      file = ER.exitOk([cand]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('m-file', file); AP.done('conference'); AP.sfx.pencil();
      msg('Ms Lorimer looks at the chart for a long time. <b>&ldquo;Every change came from outside her. She never told one lie.&rdquo;</b>');
      AP.mine('chart', 'Your chart: what changed, and why', '<p>WHEN: half nine, ten &rarr; (DC Marr: &ldquo;shortly before the fire?&rdquo;) about ten &rarr; (going over it, every night) ten past ten, certain.</p><p>MOVED: walking &rarr; (&ldquo;how fast was he running?&rdquo;) hurrying &rarr; (going over it) running.</p><p>HAD: a helmet, maybe &rarr; (&ldquo;the can he had?&rdquo;) something like a can &rarr; (the red can in the Messenger) a red petrol can.</p><p>SURE: didn&rsquo;t really look &rarr; (Lettie&rsquo;s phone) I&rsquo;d know him &rarr; (&ldquo;well done, that&rsquo;s our man&rdquo;) never forget his face.</p><p>Honest, and mistaken. Her FIRST telling is the one to test.</p>', true);
      setTimeout(function () {
        ER.closeAll(); AP.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;A question with the answer folded up inside it,&rdquo; says Ms Lorimer. &ldquo;A photograph on a phone. A red can in the paper. A sergeant saying well done. And seven months of going over it in the dark.&rdquo;',
          '&ldquo;She never told one lie. She was just given things, one after another, and she kept them, the way anybody would.&rdquo;',
          'Nathan has picked up his helmet and is turning it over in his hands. &ldquo;A helmet, maybe,&rdquo; he says quietly. &ldquo;That&rsquo;s what she said. The first time.&rdquo;',
          '&ldquo;The first time is closest. If only there were a way of seeing what she saw that night,&rdquo; says Ms Lorimer, and her phone buzzes. Mr Mendes: O&rsquo;KANE ARRIVED EUSTON. CAFE ON THE STRAND, 7.45 TOMORROW. BRING THE PUPIL.'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('Click a <b>cause</b>, then the <b>circle</b> between two tellings where it fits. Click a filled circle to empty it. Then say what this means about Mrs Kilner.');
    mcBox = box; keep();
    ER.open('ov-lock', box, function () { mcBox = null; });
  }
})();
</script>
