      ['wit', 'In January.']] },
    d: { note: 'It lies exactly on the 2008 signature: traced.', clue: { id: 'x6', title: 'He gives way: the signature' }, lines: [
      ['you', 'Mr Wedlake, this clear sheet carries the signature from your letter. Laid over the signature on the 2008 will, it fits exactly, without a hair&rsquo;s breadth between them. Nobody signs his name twice like that. You had a copy of the 2008 will, didn&rsquo;t you?'],
      ['wit', 'Underhill sent us both one. After Auntie Rosamund died.'],
      ['note', 'Nigel Wedlake takes off his glasses and holds them in his lap.'],
      ['judge', 'Go on, Ms Siddiqui.']] }
  };
  var NNO = {
    'e>*': 'Mr Wedlake is right about that telephone call, Ms Siddiqui. The letter to Mr Underhill, written the same day, says the same thing. His uncle did mean to put something right by him.',
    'f>*': 'That is Mr Wedlake&rsquo;s own account, and nobody disputes it. Whether it matters is another question.',
    'g>acet': 'Your clear sheet shows that the 2019 signature is not exactly like any other. That is what genuine signatures do. It is no contradiction of what Mr Wedlake believes.',
    'g>*': 'Mr Wedlake was not there when the will was signed. He gives me his opinion of a signature, and I shall weigh it. There is nothing there to contradict.',
    'a>w19': 'The 2019 will was typed on that machine too, Ms Siddiqui. That is common ground.',
    'a>*': 'That may tell me something about the letter. It does not touch what he says about the machine, or when it typed what.',
    'b>carb': 'The faults tell me something about when it was typed. Mr Wedlake is telling me what is written at the top. Which of your papers speaks to that?',
    'c>cal': 'The calendar tells me the day of the week. The card is about a shop.',
    'd>*': 'That signature is like his, as one man&rsquo;s signatures are. Is there one that it matches too well?',
    '*': 'I have put those side by side, Ms Siddiqui. They sit together comfortably enough.'
  };
  var NTARGET = [
    ['a', ['&ldquo;His machine&rdquo;: he is right that it is Mervyn&rsquo;s typewriter. But when did it type the letter? You found out at the cottage.', 'One of your papers says when each fault first appeared, and Nigel&rsquo;s own card &ldquo;Keepsake&rdquo; says when the machine was knocked.', 'Put &ldquo;The carbons&rdquo; beside &ldquo;His machine&rdquo;: the e rose after 28 November, after the car journey.']],
    ['b', ['&ldquo;21 November&rdquo;: which day of the week was that in 2025?', 'You checked it on the brass calendar at the post office.', 'Put &ldquo;Calendar, Nov 2025&rdquo; beside &ldquo;21 November&rdquo;.']],
    ['c', ['&ldquo;The key&rdquo;: what was that shop called in November 2025?', 'A notice on the post office board says when it changed its name.', 'Put &ldquo;Pridham&rsquo;s notice&rdquo; beside &ldquo;The key&rdquo;.']],
    ['d', ['&ldquo;His signature&rdquo;: is it, perhaps, too good?', 'Your clear sheet from the cottage.', 'Put &ldquo;Clear sheet&rdquo; beside &ldquo;His signature&rdquo;: it lies exactly on the 2008 signature.']]];

  /* ---------- the closing speech ---------- */
  var CLINES = [['L1', 'Mervyn signed the 2019 will at the counter, and Mrs Ockenden and Mr Yelland both watched and then both signed, # every rule in section 9 was kept.'],
    ['L2', 'Mr Yelland told the court it was a Thursday. #, his own certificate of posting says Tuesday 5 March 2019.'],
    ['L3', 'Neither witness gains anything from either will, # a gift to a witness, or to a witness&rsquo;s wife, fails.'],
    ['L4', 'The letter has a raised e that the typewriter got only in December, after Mervyn had died. #, he cannot have typed it.'],
    ['L5', '# he had typed it himself, it would cancel nothing: nobody witnessed it.']];
  var CONS = [['bc', 'because'], ['tf', 'Therefore'], ['hw', 'However'], ['ei', 'Even if'], ['wm', 'which means that']];
  var CWHY = { L1: 'Watching, then signing: so every rule was kept. The second half follows from the first, in the middle of the sentence. Which joint says what follows?',
    L2: 'He says one thing; his certificate says the opposite. Which joint turns a sentence round?',
    L3: 'The second half gives the reason for the first. Which joint gives a reason?',
    L4: 'The second sentence is the result of the first, and it starts with a capital letter. Which joint begins a sentence that is a result?',
    L5: 'He did not type it. But suppose for a moment that he did: it would still cancel nothing. Which joint supposes something?' };
  var OWHY = ['Start with the law, and how we meet it.', 'Then deal with their witness: the day he got wrong.', 'Then say why both witnesses can be believed: who gains.', 'Then their letter: who typed it, and when.', '&ldquo;Even if&rdquo; goes last, when you have won the point already.'];

  function wonList(k) { return (ER.flag('cx-' + k) || {}).won || []; }
  function has(k, card) { return wonList(k).some(function (p) { return p.split('>')[0] === card; }); }
  function hints() {
    if (nextFile) return ['go', ['His Honour will give judgment at a quarter to four. The button is at the bottom of the screen.']];
    if (clBox) return ['cl', [
      'Drag a joining word into the gap in each line, so that the sentence makes sense. Then use the arrows to put the five lines in the order of Ms Siddiqui&rsquo;s note.',
      'However turns a sentence round. Because gives a reason. Therefore and which means that give a result. Even if supposes something that is not true. A word with a capital letter starts a sentence.',
      'In the right order, the joints are: which means that; However; because; Therefore; Even if. The order: section 9 was kept; Thursday and the certificate; neither witness gains; the raised e; even if he had typed it.'
    ]];
    if (CX.isOpen()) {
      var k = ER.flag('k-s') ? 'n' : 's', T = k === 's' ? STARGET : NTARGET;
      for (var i = 0; i < T.length; i++) if (!has(k, T[i][0])) return [k + '-' + T[i][0], T[i][1]];
      return null;
    }
    if (!ER.flag('k-judge')) return ['judge', ['His Honour Judge Tremlett is on the bench. Click him: he has something to say before anybody begins.']];
    if (!ER.flag('k-card')) return ['card', ['There is a printed card on the ledge of the witness box, on the left. Read it before the first witness comes in.']];
    if (!ER.flag('k-s') || !ER.flag('k-n')) return ['cx', ['Click Ms Siddiqui: it is her turn to ask the witness questions.']];
    return ['speech', ['The court has risen for lunch. Click Ms Siddiqui: the closing speech.']];
  }
  function isBusy() { return busy; }
  function paint() {
    document.body.classList.toggle('nigel', !!ER.flag('k-s'));
    $('#go').classList.toggle('on', !!nextFile);
    $('#judge').classList.toggle('ready', !nextFile && !ER.flag('k-judge') && !busy);
    $('#uz').classList.toggle('ready', !nextFile && !busy && !!ER.flag('k-judge') && !!ER.flag('k-card'));
    ER.pips(nextFile ? TOTAL : wonList('s').length + wonList('n').length, TOTAL);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Court 1 is empty. His Honour is writing his judgment, somewhere behind the door at the back of the bench.'); return; }
    if (ER.flag('k-in')) { ER.say('Court 1. The rain has not stopped.'); return; }
    busy = true; ER.flag('k-in', 1);
    ER.narrate([
      '&ldquo;All rise.&rdquo; His Honour Judge Tremlett comes in through the door behind the bench, in a plain dark robe and no wig, bows, and sits. Everybody else sits too, a little late, like a congregation.',
      'Court 1 is the old court: dark oak to the height of a man, and above it plaster and two tall windows full of rain. Mr Yarde and Ms Siddiqui sit at the long table. Nigel sits behind Mr Yarde. Meriel sits behind you.',
      'Mr Yarde asks whether he may call Mr Yelland first, out of turn: he is seventy-nine, and he has sheep. &ldquo;Of course,&rdquo; says the judge. &ldquo;Sheep do not adjourn.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#judge').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('k-judge')) { ER.say('His Honour writes everything down with a fountain pen, and blots it, which nobody has done since 1950.'); return; }
    ER.talk({ who: 'His Honour Judge Tremlett', role: 'The judge · Court 1', face: window.FACE('tremlett'), lines: JUDGE,
      clue: { id: 'judge1', title: 'His Honour: who must prove what', kind: 'Said in Court 1' }, last: 'Thank you, Your Honour',
      done: function (seen) { if (seen) { ER.flag('k-judge', 1); paint(); WL.learn(['burden of proof', 'balance of probabilities']); } } });
  });
  $('#wbox').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'notice', clue: { id: 'wcard', title: 'The card in the witness box', kind: 'Court 1' },
      done: function () { ER.flag('k-card', 1); paint(); WL.learn(['statement of truth']); } });
  });
  $('#uz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Ms Siddiqui has taken her wig off and is turning it round on her finger. &ldquo;Now we wait,&rdquo; she says. &ldquo;The worst part.&rdquo;'); return; }
    if (!ER.flag('k-judge')) { ER.say('Ms Siddiqui whispers without turning round: &ldquo;His Honour wants to say something first. Listen.&rdquo;'); return; }
    if (!ER.flag('k-card')) { ER.say('&ldquo;Read the card on the witness box,&rdquo; Ms Siddiqui whispers. &ldquo;It is what Mr Yelland will be asked.&rdquo;'); return; }
    if (!ER.flag('k-s')) {
      if (ER.flag('k-s0')) { openCx('s'); return; }
      busy = true; ER.flag('k-s0', 1);
      ER.narrate([
        'Mr Yelland walks to the witness box in his waxed jacket, with his cap in his hand, and takes the oath in a voice meant for a field. Yes, that is his statement. Yes, it is true.',
        '&ldquo;Thursday, Mr Yelland?&rdquo; asks Mr Yarde. &ldquo;Thursday,&rdquo; says Mr Yelland. &ldquo;Market day.&rdquo; Mr Yarde sits down.',
        'Ms Siddiqui stands. &ldquo;Mr Yelland, I am not going to suggest that you have told a single lie. I may suggest that you have made a mistake. Shall we see?&rdquo;'
      ], function () { busy = false; paint(); openCx('s'); });
      return;
    }
    if (!ER.flag('k-n')) { openCx('n'); return; }
    openSpeech();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  WL.thing('#clock', null, 'The court clock, four minutes fast since 1868. Nobody has ever dared to touch it.', isBusy);
  WL.thing('#arms', null, 'The Royal Arms, carved and painted, over the bench. The unicorn has lost the tip of its horn.', isBusy);
  WL.thing('#windows', null, 'Two tall arched windows, too high to see out of, full of rain.', isBusy);
  WL.thing('#usher', null, 'Mr Ollerton, the usher, in a black gown. He brings the witnesses in, hands them the card and the book, and keeps the jug of water full.', isBusy);
  WL.thing('#yarde', null, function () { return ER.flag('k-n') ? 'Mr Yarde has stopped writing. He looks like a man who has followed the money all the way home and found nobody in.' : 'Mr Yarde, for Nigel, writing in a small neat hand with a very large pen.'; }, isBusy);
  WL.thing('#bundle', null, 'The trial bundle: four hundred pages in a blue binder, with your notes in the margins.', isBusy);

  function openCx(k, hello) {
    var seth = k === 's';
    var papers = seth ? [
      { id: 'so1', tab: 'SO/1', name: 'Mrs Ockenden’s calendar', look: function () { WL.look('so1', 'Exhibit SO/1, Mrs Ockenden’s calendar for 2019.'); } },
      { id: 'w19', tab: 'A', name: 'The 2019 will', look: function () { WL.look('w19', 'The 2019 will.'); } },
      { id: 'leaf', tab: 'B', name: 'Leaflet: section 15', look: function () { WL.look('leaf', 'The leaflet about witnesses.'); } }]
      : [{ id: 'carb', tab: 'MW/1-5', name: 'The carbons', look: function () { WL.look('faults', 'Your notes on the carbons and the faults.'); } },
      { id: 'cal', tab: 'C', name: 'Calendar, Nov 2025', look: function () { WL.look('dates', 'Your notes from the brass calendar.'); } },
      { id: 'shop', tab: 'D', name: 'Pridham’s notice', look: function () { WL.look('shop', 'The notice: Pridham’s is now the Corner Pantry, from 5 January 2026.'); } },
      { id: 'acet', tab: 'E', name: 'Clear sheet', look: function () { WL.look('sigs', 'Your notes on the four signatures.'); } },
      { id: 'w19', tab: 'A', name: 'The 2019 will', look: function () { WL.look('w19', 'The 2019 will.'); } },
      { id: 'u28', tab: 'F', name: 'Letter to Mr Underhill', look: function () { WL.look('u28', 'The letter to Mr Underhill, 28 November 2025.'); } }];
    var NO = seth ? SNO : NNO;
    CX.open({
      key: k, pencils: 4, total: seth ? 2 : 4, cards: seth ? SCARDS : NCARDS, won: seth ? SWON : NWON, papers: papers,
      witness: seth ? { name: 'Mr Yelland', role: 'Witness for Mr Wedlake · Hill Barn', face: window.FACE('seth') } : { name: 'Mr Nigel Wedlake', role: 'The claimant · Mervyn’s nephew', face: window.FACE('nigel') },
      judge: { name: 'His Honour Judge Tremlett', face: window.FACE('tremlett') },
      words: { today: 'said in answer today', patience: 'His Honour&rsquo;s<br>patience', cost: 'His Honour takes off his glasses, and waits.', kind: 'Said in Court 1', gave: 'He has given way on', you: 'Ms Siddiqui' },
      sfx: { card: WL.sfx.card, win: WL.sfx.pen, lose: WL.sfx.hm },
      hello: hello || (seth ? 'Yes, Ms Siddiqui.' : 'Mr Wedlake, you are still on your affirmation. Ms Siddiqui.'),
      idle: seth ? 'Every card is something Mr Yelland has said: in his statement, or this morning. Choose one. Ms Siddiqui can ask him more about it, or put something beside it.' : 'Every card is something Nigel Wedlake has said. Choose one. Ms Siddiqui can ask him more, or put one of your papers beside it.',
      bites: function (card, w) { return ER.check('cx' + k, card + '>' + w); },
      refuse: function (card, w) { return NO[card + '>' + w] || NO[card + '>*'] || NO['*>' + w] || NO['*']; },
      onWin: function () { ER.pips(wonList('s').length + wonList('n').length, TOTAL); },
      onOut: function () {
        WL.bump('k-outs'); busy = true;
        setTimeout(function () {
          ER.closeAll();
          ER.narrate([
            'His Honour puts his glasses back on his forehead. &ldquo;Ms Siddiqui. A paper answers a witness only when the two cannot both be true. If he can look at it and say &lsquo;yes, and?&rsquo;, I have learnt nothing, and my pen has dried.&rdquo;',
            '&ldquo;Five minutes.&rdquo; Mr Ollerton fills the water jug. Ms Siddiqui reads your notes again with her finger, very fast.'
          ], function () { busy = false; openCx(k, 'Thank you. Let us go on.'); });
        }, 3400);
      },
      done: function () {
        if (seth) {
          ER.flag('k-s', 1);
          setTimeout(function () {
            ER.closeAll(); WL.solved(true); busy = true;
            ER.narrate([
              'Mr Yarde stands to re-examine, looks at Mr Yelland, and sits down again. &ldquo;No questions, Your Honour.&rdquo; Mr Yelland is released, and goes out past Nigel without looking at him, his toffee tin under his arm.',
              'Mr Yarde calls Nigel Wedlake. Nigel affirms, confirms his statement, and tells Mr Yarde that the letter came at the end of November, in his uncle&rsquo;s own typing. &ldquo;I know that R anywhere.&rdquo;',
              'Ms Siddiqui stands again, and this time she does not say that she will be gentle.'
            ], function () { busy = false; paint(); openCx('n'); });
          }, 1400);
          return;
        }
        ER.flag('k-n', 1);
        setTimeout(function () {
          ER.closeAll(); WL.solved(true); busy = true;
          ER.narrate([
            'Nigel Wedlake holds his glasses in his lap for a long time. Then he says it, to the judge and not to anybody else.',
            '&ldquo;I typed it. In January, on his machine, at my kitchen table. He rang me in November and said he was going to put things right by me. Then he died, and Meriel found a will that left me two thousand pounds. I wrote down what I thought he meant. I traced his name off my copy of the old will.&rdquo;',
            '&ldquo;Thank you, Mr Wedlake,&rdquo; says His Honour. &ldquo;That cannot have been easy to say.&rdquo; Mr Yarde asks for a moment with his client. It is given.',
            'In the afternoon Meriel gives her evidence. &ldquo;You had a key to the cottage, Mrs Voysey?&rdquo; &ldquo;And a cat, Mr Yarde, and a kettle, and nine years.&rdquo; Then Mrs Ockenden: &ldquo;You were left three thousand pounds.&rdquo; &ldquo;Which I don&rsquo;t get, Mr Yarde, because I signed. Fancy.&rdquo;',
            '&ldquo;Speeches after lunch,&rdquo; says the judge. In the robing room, Ms Siddiqui pulls a sheet of paper out of the brief. &ldquo;My closing. I have the pieces. Help me join them.&rdquo;'
          ], function () { busy = false; paint(); });
        }, 1400);
      }
    });
  }

  function openSpeech() {
    var box = ER.el('div', 'cl'), saved = ER.flag('k-cl') || {}, done = false, order = saved.o || ['L4', 'L2', 'L5', 'L1', 'L3'];
    var s = '<div><div class="cl-sheet"><p class="cl-fix">Your Honour, Mrs Voysey says the 2019 will is valid, so it is for her to prove that it was properly made, on the balance of probabilities: that it is more likely than not.</p><div class="cl-lines"></div>' +
      '<p class="cl-fix">So the 2019 will was properly made. It revokes the will of 2008, and it should stand.</p></div><div class="cl-tray"></div></div>' +
      '<div class="side"><h6>Ms Siddiqui&rsquo;s note</h6><p class="k">Law first, and how we meet it. Then their witness. Then why both witnesses can be believed. Then their letter. &ldquo;Even if&rdquo; last: when you have won the point already.</p><button type="button" class="btn" id="cl-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var lines = box.querySelector('.cl-lines'), tray = box.querySelector('.cl-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    CLINES.forEach(function (L) {
      var d = ER.el('div', 'cl-line', '<div class="cl-mv"><button type="button" data-m="-1" title="Up">&#9650;</button><button type="button" data-m="1" title="Down">&#9660;</button></div><div class="cl-t">' + ER.gloss(L[1]).replace('#', '<span class="cl-gap" data-l="' + L[0] + '"></span>') + '</div>');
      d.setAttribute('data-l', L[0]); lines.appendChild(d);
      ER.$$('.cl-mv button', d).forEach(function (b) {
        b.addEventListener('click', function () { if (done) return; var i = order.indexOf(L[0]), j = i + (+b.getAttribute('data-m')); if (j < 0 || j >= order.length) return; order[i] = order[j]; order[j] = L[0]; place(); WL.sfx.card(); keep(); });
      });
    });
    CONS.forEach(function (c) { var t = ER.el('span', 'cl-con dnd-item', c[1]); t.setAttribute('data-c', c[0]); var at = (saved.c || {})[c[0]]; (at ? box.querySelector('.cl-gap[data-l="' + at + '"]') : tray).appendChild(t); });
    function place() { order.forEach(function (id) { lines.appendChild(lines.querySelector('.cl-line[data-l="' + id + '"]')); }); }
    function gaps() { var o = {}; ER.$$('.cl-gap', box).forEach(function (g) { var t = g.querySelector('.cl-con'); o[g.getAttribute('data-l')] = t ? t.getAttribute('data-c') : ''; }); return o; }
    function keep() { var g = gaps(), c = {}; Object.keys(g).forEach(function (l) { if (g[l]) c[g[l]] = l; }); ER.flag('k-cl', { o: order, c: c }); box.setAttribute('data-in', Object.keys(c).length); box.setAttribute('data-order', order.join('')); }
    ER.dnd(box, { item: '.cl-con', slot: '.cl-gap', home: tray, lock: function () { return done; }, change: function () { WL.sfx.card(); keep(); } });
    box.querySelector('#cl-go').addEventListener('click', function () {
      var g = gaps(), i, bad = null, more = 0, file, sp, nn;
      if (done) return;
      for (i = 0; i < CLINES.length; i++) if (!g[CLINES[i][0]]) { msg('&ldquo;Every line needs its joint,&rdquo; says Ms Siddiqui. &ldquo;There is still a gap.&rdquo;'); return; }
      for (i = 0; i < CLINES.length; i++) if (!ER.check('c-' + CLINES[i][0], g[CLINES[i][0]])) { if (!bad) bad = CLINES[i][0]; else more++; }
      if (bad) {
        WL.bump('k-ctries'); WL.sfx.hm(); ER.shake(box.querySelector('.cl-line[data-l="' + bad + '"]'));
        msg('Ms Siddiqui reads a line aloud, and stops at the joint. <i>&ldquo;' + CWHY[bad] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more joint' : more + ' more joints') + '.&rdquo;</i>' : ''));
        return;
      }
      for (i = 0; i < order.length; i++) if (!ER.check('o' + (i + 1), order[i])) { WL.bump('k-ctries'); WL.sfx.hm(); msg('&ldquo;Every joint is right. Now the order. Line ' + (i + 1) + ':&rdquo; <i>&ldquo;' + OWHY[i] + '&rdquo;</i>'); return; }
      sp = wonList('s').slice().sort().join('+'); nn = wonList('n').slice().sort().join('+');
      file = ER.exitOk([sp + '|' + nn + '|' + CLINES.map(function (L) { return g[L[0]]; }).join(',') + '|' + order.join('')]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('k-file', file); WL.done('court'); WL.sfx.stamp();
      msg('Ms Siddiqui reads the whole speech under her breath, start to finish. <b>&ldquo;Law, their witness, who gains, their letter, and even if. Yes. That will do.&rdquo;</b>');
      WL.learn(['connective']);
      WL.mine('speech', 'The closing speech', '<p>It is for Mrs Voysey to prove it, on the balance of probabilities.</p><p>1. All three at the counter, both signed, WHICH MEANS THAT section 9 was kept.</p><p>2. Thursday. HOWEVER, his own certificate says Tuesday.</p><p>3. Neither witness gains, BECAUSE their gifts fail (s.15).</p><p>4. A raised e from December. THEREFORE Mervyn cannot have typed the letter.</p><p>5. EVEN IF he had, nobody witnessed it.</p><p>So the 2019 will stands, and revokes the 2008 one.</p>', true);
      setTimeout(function () {
        ER.closeAll(); WL.solved(); paint(); busy = true;
        ER.narrate([
          'At two o&rsquo;clock Mr Yarde makes his speech, and it is short and honest: the letter, he says, is no longer relied upon; Mr Yelland is an honest man; the court must decide whether the will was properly made. He sits down and does not look at the money once.',
          'Ms Siddiqui makes yours. She does not change a word, and when she reaches &ldquo;even if&rdquo; His Honour writes it down and underlines it.',
          '&ldquo;Thank you both,&rdquo; says the judge. &ldquo;I shall give judgment at a quarter to four.&rdquo; &ldquo;All rise.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('Five lines of the closing speech. <b>Drag a joining word into each gap</b>, then <b>put the lines in order</b> with the arrows. <i>Drag a word, or click it and then the gap.</i>');
    clBox = box; place(); keep();
    ER.open('ov-lock', box, function () { clBox = null; });
  }
})();
</script>
</body>
</html>
