    if (busy) return;
    if (nextFile) { ER.say('The brief, tied up again in its pink tape, with your ledger on the back.'); return; }
    if (!ER.flag('r-uz')) { ER.say('A brief, tied in pink tape: Ms Siddiqui&rsquo;s, for today. She has not given it to you yet.'); return; }
    if (!ER.flag('r-leaf') || !ER.flag('r-mer')) { ER.say('&ldquo;The leaflet first,&rdquo; says Ms Siddiqui, &ldquo;and say good morning to our client. She is in the corridor, pretending not to look in.&rdquo;'); return; }
    openLedger();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  WL.thing('#lockers', null, 'Tall oak lockers, numbered. Number 10 stands open: in it, a black tin with U.S. painted on the lid, for the wig.', isBusy);
  WL.thing('#board', null, 'ROBING ROOM. COUNSEL ONLY. Underneath, in pencil: AND THE MOUSE.', isBusy);
  WL.thing('#rad', null, 'The radiator knocks twice, as if somebody wanted to come in. Nobody does. It has done this since 1952.', isBusy);
  WL.thing('#win', null, 'A high barred window. Through the frosted glass, the shadows of feet go past on the pavement.', isBusy);
  WL.thing('#urn', null, 'A tea urn the size of a small boiler, and a sign: PLEASE WASH YOUR OWN CUP. Nobody does.', isBusy);

  /* ---------- the ledger ---------- */
  function openLedger() {
    var box = ER.el('div', 'lg'), saved = ER.flag('r-lg') || {}, done = false, fl = saved.f || {}, rb = saved.r || {}, mq = saved.q || '';
    var s = '<div><div class="lg-sheet"><h5>Follow the money <small>&middot; an estate of about £340,000: the cottage (about £300,000) and savings (about £40,000)</small></h5><div class="lg-t">' +
      '<div class="h">Who</div><div class="h">2008 will</div><div class="h">2019 will</div><div class="h">Section 15</div><div class="h">Same either way?</div>';
    ROWS.forEach(function (r) {
      s += '<div class="lg-who" data-r="' + r[0] + '">' + r[1] + (r[2] ? '<small>' + r[2] + '</small>' : '') + '</div><div class="lg-old">' + r[3] + '</div>' +
        '<div><div class="lg-slot" data-r="' + r[0] + '"></div></div><div><button type="button" class="lg-f" data-r="' + r[0] + '">s.15</button></div><div><button type="button" class="lg-r" data-r="' + r[0] + '">ribbon</button></div>';
    });
    s += '</div></div><div class="lg-tray"></div></div><div class="side"><h6>And so:</h6><div class="lg-mq"></div><button type="button" class="btn" id="lg-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.lg-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    TOKS.forEach(function (t, i) {
      var d = ER.el('div', 'lg-tok dnd-item', t[1]); d.setAttribute('data-v', t[0]); d.setAttribute('data-i', i);
      var at = (saved.at || {})[i]; (at ? box.querySelector('.lg-slot[data-r="' + at + '"]') : tray).appendChild(d);
    });
    MQ.forEach(function (o) {
      var b = ER.el('button', mq === o[0] ? 'on' : '', ER.gloss(o[1])); b.type = 'button'; b.setAttribute('data-k', o[0]);
      b.addEventListener('click', function () { if (done) return; mq = o[0]; ER.$$('.lg-mq button', box).forEach(function (x) { x.classList.toggle('on', x === b); }); WL.sfx.card(); keep(); });
      box.querySelector('.lg-mq').appendChild(b);
    });
    function vals() { var o = {}; ROWS.forEach(function (r) { var t = box.querySelector('.lg-slot[data-r="' + r[0] + '"] .lg-tok'); o[r[0]] = t ? t.getAttribute('data-v') : ''; }); return o; }
    function keep() {
      var at = {}; ER.$$('.lg-tok', box).forEach(function (t) { var sl = t.parentNode.getAttribute('data-r'); if (sl) at[t.getAttribute('data-i')] = sl; });
      ER.flag('r-lg', { at: at, f: fl, r: rb, q: mq }); box.setAttribute('data-in', Object.keys(at).length);
      ER.$$('.lg-f', box).forEach(function (b) { var k = b.getAttribute('data-r'); b.classList.toggle('on', !!fl[k]); b.textContent = fl[k] ? 'FAILS' : 's.15'; box.querySelector('.lg-slot[data-r="' + k + '"]').parentNode.classList.toggle('lg-row-f', !!fl[k]); });
      ER.$$('.lg-r', box).forEach(function (b) { var k = b.getAttribute('data-r'); b.classList.toggle('on', !!rb[k]); b.textContent = rb[k] ? 'SAME' : 'ribbon'; });
    }
    ER.$$('.lg-f', box).forEach(function (b) { b.addEventListener('click', function () { if (done) return; var k = b.getAttribute('data-r'); fl[k] = !fl[k]; WL.sfx.stamp(); keep(); }); });
    ER.$$('.lg-r', box).forEach(function (b) { b.addEventListener('click', function () { if (done) return; var k = b.getAttribute('data-r'); rb[k] = !rb[k]; WL.sfx.flag(); keep(); }); });
    ER.dnd(box, { item: '.lg-tok', slot: '.lg-slot', home: tray, lock: function () { return done; }, change: function () { WL.sfx.card(); keep(); } });
    box.querySelector('#lg-go').addEventListener('click', function () {
      var v = vals(), i, k, bad = null, more = 0, file, cand;
      if (done) return;
      for (i = 0; i < ROWS.length; i++) if (!v[ROWS[i][0]]) { msg('&ldquo;The 2019 column first,&rdquo; says Ms Siddiqui. &ldquo;' + NAME[ROWS[i][0]].charAt(0).toUpperCase() + NAME[ROWS[i][0]].slice(1) + ' has nothing in it yet: not even &lsquo;nothing&rsquo;.&rdquo;'); return; }
      for (i = 0; i < ROWS.length; i++) { k = ROWS[i][0]; if (!ER.check('g-' + k, v[k])) { if (!bad) bad = k; else more++; } }
      if (bad) { WL.bump('r-tries'); WL.sfx.hm(); msg('&ldquo;Read the 2019 will again: what does it leave to ' + NAME[bad] + '?&rdquo;' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more line' : more + ' more lines') + ' in that column.&rdquo;</i>' : '')); return; }
      for (i = 0; i < ROWS.length; i++) { k = ROWS[i][0]; if (!ER.check('f-' + k, fl[k] ? 'Y' : 'N')) { if (!bad) bad = k; else more++; } }
      if (bad) { WL.bump('r-tries'); WL.sfx.hm(); msg('&ldquo;Section 15, on the line for ' + NAME[bad] + '.&rdquo; <i>&ldquo;' + FWHY[bad] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more stamp' : more + ' more stamps') + '.&rdquo;</i>' : '')); return; }
      for (i = 0; i < ROWS.length; i++) { k = ROWS[i][0]; if (!ER.check('r-' + k, rb[k] ? 'Y' : 'N')) { if (!bad) bad = k; else more++; } }
      if (bad) { WL.bump('r-tries'); WL.sfx.hm(); msg('&ldquo;The ribbons. Put what ' + NAME[bad] + ' gets under the 2008 will beside what ' + NAME[bad] + ' really gets under the 2019 will, after your stamps. The same, or not?&rdquo;' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more ribbon' : more + ' more ribbons') + '.&rdquo;</i>' : '')); return; }
      if (!mq) { msg('&ldquo;Good. And so? Choose a sentence on the right.&rdquo;'); return; }
      if (!ER.check('mq', mq)) {
        WL.bump('r-tries'); WL.sfx.hm();
        msg(mq === 'a' ? '&ldquo;Must have? We checked the will because she gains: the typewriter, the carbon, the calendar. Gaining is a reason to check. It proves nothing.&rdquo;' : '&ldquo;Her evidence counts like anybody&rsquo;s. The judge will weigh it knowing what she gains, as he will weigh Nigel&rsquo;s.&rdquo;');
        return;
      }
      cand = ROWS.map(function (r) { return v[r[0]]; }).join(',') + '+' + ROWS.map(function (r) { return fl[r[0]] ? 'Y' : 'N'; }).join('') + '+' + ROWS.map(function (r) { return rb[r[0]] ? 'Y' : 'N'; }).join('') + '+' + mq;
      file = ER.exitOk([cand]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('r-file', file); WL.done('robing'); WL.sfx.stamp();
      msg('Ms Siddiqui runs her pen down the ribbons. <b>&ldquo;The two witnesses who disagree get exactly the same whichever will wins. So whichever of them is wrong is wrong honestly.&rdquo;</b>');
      WL.mine('money', 'Follow the money', '<p>2008 will: Nigel half, Meriel half, Hall &pound;1,000.</p><p>2019 will: Meriel the cottage and the rest, Nigel &pound;2,000, Hall &pound;1,000.</p><p>Mrs Ockenden &pound;3,000: FAILS (she witnessed it).</p><p>Nesta Morcom &pound;1,000: FAILS (married to Seth, who witnessed it). Both go into the residue: to Meriel.</p><p>The will still stands.</p><p>SAME either way: Hall, Sylvia, Seth, Nesta. Only Nigel and Meriel gain or lose.</p><p>Gaining = a reason to check. Not a proof.</p>', true);
      setTimeout(function () {
        ER.closeAll(); WL.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Mrs Ockenden loses three thousand pounds by witnessing that will, and she will tell the court so with a straight face. Mr Yelland&rsquo;s wife loses a thousand. Neither of them gains a penny whichever way this goes.&rdquo;',
          '&ldquo;So I shall be gentle with Mr Yelland. An honest witness who is wrong is not an enemy. He is a man who needs a toffee tin.&rdquo;',
          'Mr Ollerton the usher puts his head round the door. &ldquo;Wedlake and Voysey, Court 1, please. His Honour has read everything, he says. Twice.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('<b>Fill the 2019 column</b> from the will: drag each slip to its line. Then <b>stamp</b> any gift that fails under section 15, and <b>tie a ribbon</b> on everybody who gets exactly the same whichever will stands.');
    lgBox = box; keep();
    ER.open('ov-lock', box, function () { lgBox = null; });
  }
})();
</script>
</body>
</html>
