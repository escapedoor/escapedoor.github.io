    '<p>Every key moves its own steel arm, the <b class="t">TYPEBAR</b>. At the end of each typebar is a small metal block, the slug, which carries two letters: the small one, and above it the capital that SHIFT gives you. Press a key, and the typebar swings up and strikes the ribbon against the paper.</p>' +

  function hints() {
    if (nextFile) return ['go', ['It is nearly five, and the post office shuts at half past. The button is at the bottom of the screen.']];
    if (sgBox) return ['sg', [
      'Drag the clear sheet with the red signature over each of the three signatures in turn, and watch the lines.',
      'Two signatures by the same man are alike, but never exactly. One of these lies under the red one with not a hair between them.',
      'It lies exactly on the signature of the 2008 will. Leave the sheet there, and show Ms Siddiqui.'
    ]];
    if (lbBox) return ['lb', [
      'Ring every letter that is out of line or broken, on every line. Some lines have no faults at all: ring nothing there. Your own test line shows you what the faults look like.',
      'There are two faults. The capital R has lost its foot. The small e and the capital E sit a little high, because one typebar carries both. Read the lines in date order: when does each fault first appear?',
      'The R is whole in 2012 and broken from 2016 on. The e stays level on every carbon, even the last one, of 28 November 2025; it rises only on today&rsquo;s line and on the letter to Nigel. So the 2019 will fits its date, and the letter was typed later than its date.'
    ]];
    if (!ER.flag('s-uz')) return ['uz', ['Ms Siddiqui is by the bureau, on the right. Talk to her.']];
    if (!ER.flag('s-manual')) return ['manual', ['The typewriter&rsquo;s manual, in a red cover, is on the desk beside the machine. Read it.']];
    if (!ER.flag('s-test')) return ['test', ['Now ask the machine itself. Click the typewriter and type a test line, as the manual says.']];
    if (!ER.flag('s-lb')) return ['box', ['The blue box file of carbon copies is on the desk, on the right. Open it.']];
    return ['sig', ['Ms Siddiqui has three signatures and a clear sheet. Talk to her.']];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#uz').classList.toggle('ready', !nextFile && !busy && (!ER.flag('s-uz') || (!!ER.flag('s-lb') && !ER.flag('s-sg'))));
    $('#tw').classList.toggle('ready', !nextFile && !!ER.flag('s-manual') && !ER.flag('s-test'));
    $('#cbox').classList.toggle('ready', !nextFile && !!ER.flag('s-test') && !ER.flag('s-lb'));
    ER.pips(nextFile ? 2 : ER.flag('s-lb') ? 1 : 0, 2);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The study at Myrtle Cottage. Mr Underhill is writing down everything you touched.'); return; }
    if (ER.flag('s-in')) { ER.say('The study at Myrtle Cottage. The wind has not dropped.'); return; }
    busy = true; ER.flag('s-in', 1);
    ER.narrate([
      'Thrushcombe, ten past four. Myrtle Cottage stands at the end of the lane past the church, and the wind is pushing the apple tree against the study window as if it wanted to come in.',
      'The study is as Mervyn left it: a bureau, an armchair with a blanket over its back, twelve stamp albums on a shelf, and on the desk, under a lamp, a green typewriter older than Mr Underhill&rsquo;s car.',
      'Beside it is a blue box file with a typed label. Mervyn kept a carbon copy of every letter he typed for fifteen years. &ldquo;Thirty-one years in a post office,&rdquo; says Mr Underhill. &ldquo;He could not post a letter without keeping a copy.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#uz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;The post office,&rdquo; says Ms Siddiqui, &ldquo;before Mrs Ockenden&rsquo;s daughter locks the door on us.&rdquo;'); return; }
    if (ER.flag('s-lb') && !ER.flag('s-sg')) { openSig(); return; }
    if (ER.flag('s-uz')) { ER.say('&ldquo;Manual, machine, carbons,&rdquo; says Ms Siddiqui. &ldquo;Let the typewriter give its evidence.&rdquo;'); return; }
    ER.talk({
      who: 'Ms Siddiqui', role: 'Counsel for Mrs Voysey', face: window.FACE('siddiqui'),
      lines: [
        { note: 'Ms Siddiqui has not taken her coat off. She is looking at the typewriter the way some people look at a witness.', a: 'Here is a strange thing. Nigel says his letter was typed on this machine: he says he knows its R. Meriel says the 2019 will was typed on this machine. On that one point, the two sides agree.' },
        { q: 'So it proves nothing either way?', a: 'It proves that both papers came out of this room. It does not prove when. Mr Yarde will say tomorrow that Meriel had a key, and could have typed that will at any time after Mervyn died.' },
        { note: 'She takes a statement out of her bag and hands it to you.', a: 'Nigel&rsquo;s witness statement. Read paragraph 5 twice. Then read the manual, and ask the machine when it typed what.' }
      ],
      clue: { id: 'uz2', title: 'Ms Siddiqui, in the study', kind: 'What she said' }, last: 'Read the statement',
      done: function (seen) {
        if (!seen) return;
        ER.flag('s-uz', 1); paint();
        ER.read({ html: NSTMT, cls: 'stmt', clue: { id: 'nstmt', title: 'Witness statement: Nigel Wedlake', kind: 'Trial bundle' } });
      }
    });
  });
  $('#und').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('s-und')) { ER.say('&ldquo;Nigel brought it back on Monday the ninth of February,&rdquo; says Mr Underhill. &ldquo;I wrote the date on the case.&rdquo;'); return; }
    ER.talk({
      who: 'Mr Underhill', role: 'Keeps the key', face: window.FACE('underhill'),
      lines: [
        { a: 'Nigel brought the machine back on Monday the ninth of February, in its case, on the back seat of his car. Strapped in, that time. I wrote the date on the case.' },
        { q: 'Who has been in here since?', a: 'Nobody but me. The cottage is locked, and the key lives in my waistcoat. Meriel had a key while he was alive: she came every day. She gave it to me in January.' },
        { note: 'He looks at the cat&rsquo;s bowl by the desk.', a: 'Tuppence lives with Meriel now. She is the only one in the family who has done well out of any of this.' }
      ],
      clue: { id: 'und2', title: 'Mr Underhill, at the cottage', kind: 'What he said' }, last: 'Thank you',
      done: function (seen) { if (seen) ER.flag('s-und', 1); }
    });
  });
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'manual', clue: { id: 'manual', title: 'The Vellacott manual: faults and carbons', kind: 'From the desk' },
      done: function () { ER.flag('s-manual', 1); paint(); WL.learn(['typebar', 'serif', 'carbon copy']); } });
  });
  $('#tw').addEventListener('click', function () {
    if (busy) return;
    if (!ER.flag('s-manual')) { ER.say('A Vellacott Portable No. 4, green, with a sheet of paper still in it. You would like to know how it works before you touch it: the manual is beside it.'); return; }
    openTest();
  });
  $('#cbox').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('s-lb')) { ER.say('The carbons, in date order, with your red rings on them.'); return; }
    if (!ER.flag('s-test')) { ER.say('A box of carbon copies, 2010 to 2025, each on thin paper in its place. &ldquo;Test line first,&rdquo; says Ms Siddiqui. &ldquo;You need to know what the machine does today.&rdquo;'); return; }
    openLb();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  WL.thing('#window', null, 'The garden at dusk, and an old apple tree bending in the wind. Nobody has picked the apples.', isBusy);
  WL.thing('#calendar', null, 'December 2025, still on the wall. Somebody has drawn a small circle round the 15th: &ldquo;Mr U., 11 o&rsquo;clock&rdquo;.', isBusy);
  WL.thing('#albums', null, 'Twelve stamp albums, labelled by reign. In the letter to Mr Underhill, he meant them for Nigel.', isBusy);
  WL.thing('#bureau', null, 'The bureau where Meriel found the 2019 will in January, in an envelope that said MY WILL. M.W. in his handwriting.', isBusy);
  WL.thing('#photo', null, 'Rosamund Wedlake, in a red coat, laughing at whoever held the camera. She died in 2016.', isBusy);
  WL.thing('#chair', null, 'His armchair. The blanket over the back was crocheted by Rosamund, in squares, in every colour she could find.', isBusy);
  WL.thing('#boxes2', null, 'A box of books, packed in January and never taken anywhere. On top, a stamp catalogue from 1962, held together with an elastic band.', isBusy);
  WL.thing('#bowl', null, 'A cat&rsquo;s bowl that says TUPPENCE. Empty. &ldquo;Remember me to the cat,&rdquo; says the letter to Nigel.', isBusy);

  /* ---------- the test line ---------- */
  function openTest() {
    var box = ER.el('div', 'tt'), typing = false;
    box.innerHTML = '<svg viewBox="0 0 560 230"><path d="M60 220l40-140h360l40 140z" fill="#2f4a3e"/><rect x="40" y="204" width="480" height="22" rx="6" fill="#24382e"/><rect x="100" y="70" width="360" height="30" rx="12" fill="#1c2a24"/>' +
      '<path d="M100 84l-60-24" stroke="#c9ccd0" stroke-width="8" stroke-linecap="round"/><g fill="#e9e4d6" id="tt-keys"></g><text x="280" y="140" class="sT" font-size="14" fill="#c9a45a" letter-spacing="5">VELLACOTT</text></svg>' +
      '<div class="sheet" id="tt-sheet"></div><button type="button" class="btn" id="tt-go">Type the test line</button><p class="pmsg"></p>';
    var keys = '', i; for (i = 0; i < 10; i++) keys += '<circle cx="' + (140 + i * 31) + '" cy="168" r="11"/>'; for (i = 0; i < 9; i++) keys += '<circle cx="' + (156 + i * 31) + '" cy="192" r="11"/>';
    box.querySelector('#tt-keys').innerHTML = keys;
    var sheet = box.querySelector('#tt-sheet'), msgEl = box.querySelector('.pmsg');
    if (ER.flag('s-test')) { sheet.innerHTML = WL.typed(TEST, { R: true, e: true }); box.querySelector('#tt-go').disabled = true; msgEl.innerHTML = ER.gloss('Your test line from today. It is in your notebook.'); }
    box.querySelector('#tt-go').addEventListener('click', function () {
      if (typing || ER.flag('s-test')) return;
      typing = true; this.disabled = true; var n = 0;
      (function next() {
        n++; sheet.innerHTML = WL.typed(TEST.slice(0, n), { R: true, e: true }); if (TEST.charAt(n - 1) !== ' ') WL.sfx.key();
        if (n < TEST.length) { setTimeout(next, 85); return; }
        WL.sfx.ret(); ER.flag('s-test', 1); paint();
        ER.addClue('test', 'Today&rsquo;s test line', '<h4>Today&rsquo;s test line</h4><p class="lbig">' + WL.typed(TEST, { R: true, e: true }) + '</p><p>Typed on the Vellacott, Monday 2 November 2026.</p>', 'tw', 'From the machine');
        msgEl.innerHTML = ER.gloss('The machine types today exactly as it is. Look at the line closely: something is wrong with more than one letter. Now the carbons.');
      })();
    });
    ER.open('ov-lock', box);
  }

  /* ---------- the lightbox ---------- */
  function openLb() {
    var box = ER.el('div', 'lb'), saved = ER.flag('s-lbs') || {}, done = false, s = '<div class="lb-rows">';
    var rings = saved.r || {}, st = saved.st || {};
    LINES.forEach(function (L) {
      s += '<div class="lb-row' + (L[5] ? ' dis' : '') + (L[0] === 'l7' ? ' gap' : '') + '" data-l="' + L[0] + '"><div class="lb-l"><b>' + L[1] + '</b>' + L[2] + '</div><div class="lb-t">';
      L[3].split('').forEach(function (c, i) {
        var g = WL.typed(c === ' ' ? '&nbsp;' : c, { R: L[4].R, e: L[4].e });
        s += c === ' ' ? '<span>&nbsp;</span>' : '<span class="c' + ((rings[L[0]] || []).indexOf(i) >= 0 ? ' ring' : '') + '" data-i="' + i + '">' + g + '</span>';
      });
      s += '</div><div>' + (L[5] ? '<button type="button" class="lb-st" data-l="' + L[0] + '"></button>' : '') + '</div></div>';
    });
    s += '</div><div class="side"><h6>Under the glass</h6><p class="k">Ring every faulty letter on every line. Then stamp the two pages at the bottom: was each one typed when its date says?</p><button type="button" class="btn" id="lb-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('s-lbs', { r: rings, st: st }); box.setAttribute('data-rings', ER.$$('.c.ring', box).length); }
    function paintSt() { ER.$$('.lb-st', box).forEach(function (b) { var v = st[b.getAttribute('data-l')] || ''; b.className = 'lb-st' + (v ? ' ' + v : ''); b.textContent = v === 'F' ? 'FITS ITS DATE' : v === 'L' ? 'TYPED LATER THAN ITS DATE' : 'stamp'; }); }
    ER.$$('.lb-t .c', box).forEach(function (c) {
      c.addEventListener('click', function () {
        if (done) return;
        var l = c.closest('.lb-row').getAttribute('data-l'), i = +c.getAttribute('data-i'), a = rings[l] || (rings[l] = []), k = a.indexOf(i);
        if (k >= 0) a.splice(k, 1); else a.push(i);
        c.classList.toggle('ring', k < 0); WL.sfx.pen(); keep();
      });
    });
    ER.$$('.lb-st', box).forEach(function (b) {
      b.addEventListener('click', function () { if (done) return; var l = b.getAttribute('data-l'); st[l] = st[l] === 'F' ? 'L' : st[l] === 'L' ? '' : 'F'; paintSt(); WL.sfx.stamp(); keep(); });
    });
    function classes(L) {        /* which kinds of letter have been ringed on a line: R, E, e, or x for any other */
      var t = L[3], seen = {};
      (rings[L[0]] || []).forEach(function (i) { var c = t.charAt(i); seen[c === 'R' || c === 'E' || c === 'e' ? c : 'x'] = 1; });
      var k = Object.keys(seen).sort(); return k.length ? k.join('') : '-';
    }
    box.querySelector('#lb-go').addEventListener('click', function () {
      var i, bad = null, more = 0, file;
      if (done) return;
      for (i = 0; i < LINES.length; i++) if (!ER.check(LINES[i][0], classes(LINES[i]))) { if (!bad) bad = LINES[i][0]; else more++; }
      if (bad) {
        WL.bump('s-tries'); WL.sfx.hm(); var row = box.querySelector('.lb-row[data-l="' + bad + '"]'); ER.shake(row);
        msg('Ms Siddiqui puts her finger on one line. <i>&ldquo;' + LWHY[bad] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more line needs' : more + ' more lines need') + ' another look.&rdquo;</i>' : ''));
        return;
      }
      if (!st.l7 || !st.l8) { msg('&ldquo;Every ring is right. Now the two stamps at the bottom: was each page typed when its date says, or later?&rdquo;'); return; }
      if (!ER.check('d7', st.l7)) { WL.bump('s-tries'); WL.sfx.hm(); msg('&ldquo;The 2019 will. Its R is broken, as from 2016 on, and its e is level, as on every carbon up to the end of November 2025. Is there anything that says it was typed later than March 2019?&rdquo;'); return; }
      if (!ER.check('d8', st.l8)) { WL.bump('s-tries'); WL.sfx.hm(); msg('&ldquo;The letter to Nigel says 21 November 2025. But its e is high, and on 28 November, a week later, his e was still level. Faults never mend themselves.&rdquo;'); return; }
      done = true; ER.flag('s-lb', 1); WL.sfx.stamp(); paint();
      msg('Ms Siddiqui reads down the lightbox once, slowly. <b>&ldquo;The R broke between 2012 and 2016. The e rose after the twenty-eighth of November 2025. The machine has just told us when.&rdquo;</b>');
      WL.learn(['forgery']);
      WL.mine('faults', 'What the typewriter says', '<p>R loses its foot: between 2012 and 2016 (whole in 2012, broken in 2016).</p><p>e and E sit high: only AFTER 28 Nov 2025 (level on his last carbon). Nigel&rsquo;s statement: it slid off his back seat after the funeral, 19 Dec.</p><p>2019 will: R broken, e level = typed 2016&ndash;Nov 2025. FITS 5 March 2019. Same as its carbon.</p><p>Letter to Nigel: R broken AND e high = typed after 28 Nov 2025. NOT on 21 Nov.</p>', true);
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          '&ldquo;The will was typed while Mervyn was alive, and its carbon has sat in his own box, in its place, since March 2019. Whatever Mr Yarde suggests about Meriel and her key, this machine says no.&rdquo;',
          '&ldquo;And the letter was typed after the twenty-eighth of November. If I had to guess, after a typewriter slid off the back seat of a car on the nineteenth of December. Tomorrow I shall not have to guess.&rdquo;',
          'She takes three photocopied signatures out of her bag, and a clear plastic sheet with one more signature traced on it in red. &ldquo;One more thing. Nobody signs his name exactly the same way twice. Not even on the same day.&rdquo;'
        ], function () { busy = false; paint(); openSig(); });
      }, 3200);
    });
    msg('Eight lines, from 2012 to today. <b>Click a letter to ring it</b> if it is out of line or broken. Ring nothing on a line that has no faults.');
    lbBox = box; paintSt(); keep();
    ER.open('ov-lock', box, function () { lbBox = null; });
  }

  /* ---------- the clear sheet ---------- */
  var SIGC = [['y2008', '2008 will', 30, 40], ['y2019', '2019 will', 340, 40], ['y2025', 'Letter to Mr Underhill, 28 Nov 2025', 185, 240]];
  function openSig() {
    var box = ER.el('div', 'sg'), done = false, at = ER.flag('s-sgat') || '';
    var s = '<div class="sg-board">';
    SIGC.forEach(function (c) { s += '<div class="sg-card" data-s="' + c[0] + '" style="left:' + c[2] + 'px;top:' + c[3] + 'px"><small>' + c[1] + '</small>' + WL.sig(c[0], '#1d2a52', 240) + '</div>'; });
    s += '<div id="sg-acet" style="left:480px;top:250px">' + WL.sig('letter', '#c0262c', 240) + '<small>letter to Nigel</small></div></div>' +
      '<div class="side"><h6>The clear sheet</h6><p class="k" style="font-family:EB Garamond,serif;font-size:15.5px;color:#d6d2c6;margin:0 0 10px">The red signature is traced from the letter to Nigel. Lay it over each of the others. Leave it on the one it came from.</p><button type="button" class="btn" id="sg-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var board = box.querySelector('.sg-board'), ac = box.querySelector('#sg-acet'), msgEl = box.querySelector('.pmsg'), ox = 0, oy = 0;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function place(id) {
      at = id; ER.flag('s-sgat', id); box.setAttribute('data-at', id || '');
      ER.$$('.sg-card', box).forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-s') === id); });
      if (id) { var c = box.querySelector('.sg-card[data-s="' + id + '"]'); ac.style.left = (c.offsetLeft + 10) + 'px'; ac.style.top = (c.offsetTop + 10) + 'px'; }
    }
    if (at) place(at);
    ER.drag(ac, {
      start: function (e) { if (done) return false; var r = ac.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top; },
      move: function (e) { var b = board.getBoundingClientRect(); ac.style.left = Math.max(0, Math.min(b.width - 270, e.clientX - b.left - ox)) + 'px'; ac.style.top = Math.max(0, Math.min(b.height - 150, e.clientY - b.top - oy)) + 'px'; },
      end: function () {
        var r = ac.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, hit = '';
        ER.$$('.sg-card', box).forEach(function (c) { var q = c.getBoundingClientRect(); if (cx > q.left && cx < q.right && cy > q.top && cy < q.bottom) hit = c.getAttribute('data-s'); });
        place(hit); if (hit) WL.sfx.card();
      }
    });
    box.querySelector('#sg-go').addEventListener('click', function () {
      if (done) return;
      if (!at) { msg('&ldquo;Leave the clear sheet lying on one of the three: the one you think it came from.&rdquo;'); return; }
      if (!ER.check('sg', at)) {
        WL.bump('s-tries'); WL.sfx.hm();
        msg(at === 'y2019' ? '&ldquo;They do not lie together anywhere. And look at that one tremble: that is a real hand, on a bad day, with something wrong. Mr Yelland may tell us what.&rdquo;' : '&ldquo;Close, as two signatures by one man are close. Not exact. Is there one that lies under it with nothing showing at all?&rdquo;');
        return;
      }
      var file = ER.exitOk([lbCand()]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('s-file', file); ER.flag('s-sg', 1); WL.done('study'); WL.sfx.stamp();
      msg('Not a hair&rsquo;s breadth between them. <b>&ldquo;Nobody signs twice like that,&rdquo;</b> says Ms Siddiqui. <b>&ldquo;Somebody traced it from the 2008 will.&rdquo;</b>');
      WL.learn(['traced']);
      WL.mine('sigs', 'Four signatures', '<p>Nobody signs exactly the same way twice.</p><p>2019 will: it shakes, but it is his own (different from all the others).</p><p>Letter to Mr U., 28 Nov 2025: like the others, never exactly the same.</p><p>Letter to Nigel: lies EXACTLY on the 2008 one. Traced from it.</p>', true);
      setTimeout(function () {
        ER.closeAll(); WL.solved(); paint(); busy = true;
        ER.narrate([
          'Mr Underhill looks at the two signatures for a long time. &ldquo;We sent each of them a copy of the 2008 will,&rdquo; he says at last, &ldquo;after Rosamund died. At Mervyn&rsquo;s request. Nigel kept his.&rdquo;',
          '&ldquo;None of that tells us who did it,&rdquo; says Ms Siddiqui. &ldquo;Only that Mervyn did not. And the shaky one is his: so why does it shake?&rdquo; She looks at her watch. &ldquo;Ten to five. The post office.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 2600);
    });
    msg('<b>Drag the clear sheet</b> over each signature. Leave it lying on the one it was traced from.');
    sgBox = box;
    ER.open('ov-lock', box, function () { sgBox = null; });
  }
  function lbCand() {
    var r = (ER.flag('s-lbs') || {}).r || {}, st = (ER.flag('s-lbs') || {}).st || {};
    var cls = LINES.map(function (L) { var seen = {}; (r[L[0]] || []).forEach(function (i) { var c = L[3].charAt(i); seen[c === 'R' || c === 'E' || c === 'e' ? c : 'x'] = 1; }); var k = Object.keys(seen).sort(); return k.length ? k.join('') : '-'; });
    return cls.join('/') + '+' + st.l7 + st.l8 + '+' + (ER.flag('s-sgat') || '');
  }
})();
</script>
