    for (i = 0; i < 14; i++) { var n = d.getDate(); s += '<div>' + n + (d.getMonth() === 1 ? ' Feb' : n === 1 ? ' Mar' : '') + (notes[n] && !(n === 1 && d.getMonth() === 1) ? '<i>' + notes[n] + '</i>' : '') + '</div>'; d.setDate(n + 1); }
    return s + '</div>';
  }
  var RUBY = '<h4>Happy Ruby Wedding</h4><p>SETH &amp; NESTA!</p><p>40 years: 12 April 1986 &ndash; 12 April 2026</p><p>With love from everybody at Thrushcombe Post Office, and from Pilchard.</p>';
  var SHOP = '<h4>Pridham&rsquo;s is now The Corner Pantry</h4><p>From <b>Monday 5 January 2026</b>, the shop on the green has a new name.</p><p>Same bread. Same papers. Same us.</p><p class="fine">R. &amp; M. Pridham</p>';

  var SLIPS = [['s1', 'The 2019 will', 'Tuesday 5th March 2019'], ['s2', 'The letter to Nigel', 'Saturday 21st November 2025'], ['s3', 'The letter to Mr Underhill', 'Friday 28th November 2025'],
    ['s4', 'The 2008 will', 'Wednesday the 16th of April 2008'], ['s5', 'The letter to Nigel, dated November 2025', '&ldquo;leave the spare key at the Corner Pantry&rdquo;']];
  var SWHY = { s1: 'Turn the calendar to March 2019 and find the 5th. Which day is it?', s2: 'Turn it to November 2025 and find the 21st. Then turn it on a year and look again.',
    s3: 'November 2025 again: the 28th.', s4: 'April 2008: the 16th.', s5: 'This one is not a day of the week. When did the Corner Pantry get its name? The notice by the door says.' };
  var MEM = [['m1', 'I had come straight from Dunsmere market.'], ['m2', 'Mervyn was asking Sylvia to witness his will.'], ['m3', 'I was posting Poppy&rsquo;s birthday parcel, and got my certificate.'],
    ['m4', 'Mervyn signed it with the pen on the chain.'], ['m5', 'Mervyn and Sylvia had both signed already. I put my name under hers.']];
  var MWHY = { m1: 'Which day is market day in Dunsmere? There is a poster about it by the door.', m2: 'Read Mrs Ockenden&rsquo;s note: on which morning did Mervyn come in to ask for witnesses?',
    m3: 'Poppy&rsquo;s birthday is on the 7th, and Mrs Ockenden noted the parcel. On which morning?', m4: 'Mrs Ockenden wrote about the pen and its chain. On which day?', m5: 'He signed under her name on the morning the will was signed. Which morning was that?' };
  var TQ = [['a', 'He is lying, to help Nigel.'], ['b', 'He has made one morning out of two: he heard Mervyn ask on the Thursday, and watched him sign on the Tuesday, with Mrs Ockenden there too.'], ['c', 'The will was signed on the Thursday, without him.']];

  function hints() {
    if (nextFile) return ['go', ['The post office is shut. The button at the bottom of the screen takes you to the next morning.']];
    if (tmBox) return ['tm', [
      'Put each thing Mr Yelland remembers on the morning it belongs to. Mrs Ockenden&rsquo;s calendar notes, at the top of each day, say what happened that morning.',
      'Market day is Thursday. The parcel, the certificate, the pen on the chain and the signing are all in her note for the Tuesday.',
      'Thursday 28 February: he came from market and heard Mervyn ask Sylvia to witness. Tuesday 5 March: Poppy&rsquo;s parcel, the pen on the chain, and his name under hers. He has made one morning out of two, honestly.'
    ]];
    if (pcBox) return ['pc', [
      'Turn the year and the month on the brass calendar to the date on each slip. Does the day of the week match? One slip is not about a day of the week at all: for that one, use the notices by the door.',
      'Saturday 21st November 2025: set the calendar to November 2025 and find the 21st. Then try November 2026. And when did the Corner Pantry get that name?',
      '21 November 2025 was a Friday; it is a Saturday only in 2026. The Corner Pantry had its name only from 5 January 2026. Those two slips CANNOT BE RIGHT. The other three fit.'
    ]];
    if (!ER.flag('p-uz')) return ['uz', ['Ms Siddiqui is by the door, under the noticeboard. Talk to her.']];
    if (!ER.flag('p-zoe')) return ['zoe', ['Zoe Ockenden is behind the post office counter. Talk to her.']];
    if (!ER.flag('p-cert')) return ['cert', ['The framed red notice on the wall, left of the counter, is about the certificates Mr Yelland keeps. Read it.']];
    if (!ER.flag('p-pc')) return ['perp', ['Ms Siddiqui&rsquo;s slips need a calendar. The brass perpetual calendar is on the counter, on the right. Click it.']];

  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#uz').classList.toggle('ready', !nextFile && !ER.flag('p-uz') && !busy);
    $('#perp').classList.toggle('ready', !nextFile && !!ER.flag('p-cert') && !!ER.flag('p-zoe'));
    ER.pips(nextFile ? 2 : ER.flag('p-pc') ? 1 : 0, 2);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Zoe turns the sign on the door to CLOSED. Pilchard has not moved.'); return; }
    if (ER.flag('p-in')) { ER.say('Thrushcombe Post Office and Stores. Pilchard is still asleep.'); return; }
    busy = true; ER.flag('p-in', 1); WL.sfx.shop();
    ER.narrate([
      'The bell over the door rings as you push it. Thrushcombe Post Office and Stores is one long warm room: tins and jars along one wall, a post office counter behind glass at the back, and a spaniel asleep on a mat in the middle of the floor, so that everybody has to walk round him.',
      'Mervyn Wedlake ran this post office for thirty-one years. Sylvia Ockenden has run it since 2002. Tonight her daughter Zoe is behind the counter, cashing up.',
      '&ldquo;We do not talk to Mrs Ockenden,&rdquo; Ms Siddiqui says quietly. &ldquo;She gives evidence tomorrow, and nobody on either side goes near a witness&rsquo;s story before then. We came to see the room.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#uz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Two mornings,&rdquo; says Ms Siddiqui, &ldquo;and a man who keeps every receipt. I shall ask him nicely.&rdquo;'); return; }
    if (ER.flag('p-uz')) { ER.say('&ldquo;The calendar on the counter,&rdquo; says Ms Siddiqui. &ldquo;Every date in the bundle, one by one.&rdquo;'); return; }
    ER.talk({
      who: 'Ms Siddiqui', role: 'Counsel for Mrs Voysey', face: window.FACE('siddiqui'),
      lines: [
        { note: 'Ms Siddiqui stands under the noticeboard, reading it as carefully as she read the bundle.', a: 'Mr Yelland&rsquo;s statement says Thursday. The will says Tuesday. Mr Yarde will say that Mervyn typed &ldquo;Tuesday&rdquo; at home, in advance, and that nobody signed anything until Thursday.' },
        { q: 'Could he be right?', a: 'If he is, the will fails. So we check every date we have, and we check what Mr Yelland remembers against something that was written down at the time.' },
        { note: 'She gives you two copies from the bundle and a handful of slips.', a: 'His statement. Mrs Ockenden&rsquo;s calendar for 2019, exhibit SO/1. And on these slips, every date in the case. Check each one against a calendar, and tell me which of them cannot be right.' }
      ],
      clue: { id: 'uz3', title: 'Ms Siddiqui, in the post office', kind: 'What she said' }, last: 'Read the statement',
      done: function (seen) {
        if (!seen) return;

        ER.addClue('so1', 'Exhibit SO/1: Mrs Ockenden&rsquo;s 2019 calendar', calHtml(), 'cal', 'Trial bundle', true);
        ER.read({ html: SSTMT, cls: 'stmt', clue: { id: 'sstmt', title: 'Witness statement: Seth Yelland', kind: 'Trial bundle' } });
      }
    });
  });
  $('#zoe').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('p-zoe')) { ER.say('&ldquo;Five minutes,&rdquo; says Zoe, counting stamps. &ldquo;Then I&rsquo;m turning the lights off on you.&rdquo;'); return; }
    if (!ER.flag('p-uz')) { ER.say('Zoe looks up from her cash bag. &ldquo;You&rsquo;re the lawyers. Your boss looks as if she wants you.&rdquo;'); return; }
    ER.talk({
      who: 'Zoe Ockenden', role: 'Behind the counter · Sylvia’s daughter', face: window.FACE('zoe'),
      lines: [
        { note: 'Zoe Ockenden is cashing up, with a pencil behind her ear and her feet tucked under the stool so as not to wake the dog.', a: 'Mum&rsquo;s at my auntie&rsquo;s in Dunsmere till tomorrow. She said you&rsquo;d come, and she said I&rsquo;m not to talk about the will, because she&rsquo;s a witness and you&rsquo;re lawyers. So I&rsquo;m not.' },
        { q: 'Does Mr Yelland come in often?', a: 'Seth? Thursdays, after market, regular as rain. And whenever he posts a parcel, which is a lot: four grandchildren. He gets a certificate of posting for every single one and keeps them in a toffee tin in his coat. Thirty years of them. He says it&rsquo;s in case the post office argues.' },
        { note: 'She nods at the big card pinned up behind the counter.', a: 'That&rsquo;s his Ruby Wedding card: forty years, him and Nesta, last April. Nesta kept her own name all that time, Morcom, like her tea room. Seth says it&rsquo;s the only argument he ever lost.' },
        { a: 'And that notice by the door is Pridham&rsquo;s. They&rsquo;re the Corner Pantry now, since January. Same bread, new sign, higher prices.' }
      ],
      clue: { id: 'zoe1', title: 'Zoe Ockenden, at the counter', kind: 'What she said' }, last: 'Thank you',
      done: function (seen) {
        if (!seen) return;
        ER.flag('p-zoe', 1); paint();
        ER.addClue('ruby', 'The Ruby Wedding card: Seth &amp; Nesta', RUBY, 'card', 'Behind the counter');
      }
    });
  });
  $('#cert').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CERT, cls: 'notice', clue: { id: 'cert', title: 'Certificate of posting (the notice)', kind: 'On the post office wall' },
      done: function () { ER.flag('p-cert', 1); paint(); WL.learn(['certificate of posting']); } });
  });
  $('#notice').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SHOP, cls: 'notice', clue: { id: 'shop', title: 'Notice: Pridham&rsquo;s is now The Corner Pantry', kind: 'On the noticeboard' } });
  });
  $('#ruby').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RUBY, cls: 'card', clue: { id: 'ruby', title: 'The Ruby Wedding card: Seth &amp; Nesta', kind: 'Behind the counter' } });
  });
  $('#perp').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The brass calendar, set back to November 2026. Zoe likes it to tell the truth.'); return; }
    if (!ER.flag('p-uz')) { ER.say('A brass perpetual calendar: turn the wheels to any month of any year. Ms Siddiqui has something for you to check on it.'); return; }
    if (!ER.flag('p-zoe') || !ER.flag('p-cert')) { ER.say('&ldquo;Ask Zoe first if we may touch it,&rdquo; says Ms Siddiqui. &ldquo;And read that red notice on the wall: it may matter tomorrow.&rdquo;'); return; }
    if (ER.flag('p-pc')) openTm(); else openPc();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  WL.thing('#poster', null, 'DUNSMERE MARKET, EVERY THURSDAY, 8 till 2. Livestock, produce, bric-a-brac.', isBusy);
  WL.thing('#pen', null, 'The counter pen, on a bead chain about as long as your hand. To sign anything on your side of the glass you have to bend right down. It has been like that for years.', isBusy);
  WL.thing('#dstamp', null, 'The date stamp. Every certificate of posting gets a thump from it: THRUSHCOMBE, and the day.', isBusy);
  WL.thing('#scales', null, 'Parcel scales. Pilchard was once weighed on them, as a puppy, for a bet.', isBusy);
  WL.thing('#shelves', null, 'Tins of soup, jars of humbugs, firelighters, birthday candles, string. Everything a village needs at ten past five.', isBusy);
  WL.thing('#rack', null, 'Birthday cards, sympathy cards, and one that says SORRY I CALLED YOU A FERRET. It has been there since 2019.', isBusy);
  WL.thing('#door', null, 'The door to the green. Outside it is dark already, and drizzling.', isBusy);
  WL.thing('#papers', null, 'This week&rsquo;s Dunsmere Weekly. The front page is about a hedge in Little Dunsmere and two neighbours who have not spoken since 2011.', isBusy);
  WL.thing('#dog', null, 'Pilchard, an old spaniel, asleep on his mat in the middle of the floor. He opens one eye, decides you are not a biscuit, and shuts it.', isBusy);

  /* ---------- the brass calendar and the slips ---------- */
  function openPc() {
    var box = ER.el('div', 'pc'), saved = ER.flag('p-pcs') || {}, done = false, y = saved.y || 2026, m = saved.m == null ? 10 : saved.m, st = saved.st || {};
    var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    var s = '<div class="pc-cal"><div class="pc-wheels"><div class="pc-wheel"><button type="button" data-w="m-">&lsaquo;</button><b id="pc-m"></b><button type="button" data-w="m+">&rsaquo;</button></div>' +
      '<div class="pc-wheel"><button type="button" data-w="y-">&lsaquo;</button><b id="pc-y"></b><button type="button" data-w="y+">&rsaquo;</button></div></div><div class="pc-grid"></div>' +
      '<p class="pc-plate">Each ordinary year, a date falls one day of the week later than the year before. After a 29 February, two days later.</p></div>' +
      '<div class="pc-slips">';
    SLIPS.forEach(function (sl) { s += '<div class="pc-slip" data-s="' + sl[0] + '"><div><small>' + sl[1] + '</small><q>' + sl[2] + '</q></div><button type="button" class="pc-st"></button></div>'; });
    s += '</div><div class="side"><button type="button" class="btn" id="pc-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('p-pcs', { y: y, m: m, st: st }); box.setAttribute('data-ym', y + '-' + (m + 1)); }
    function draw() {
      box.querySelector('#pc-m').textContent = MON[m]; box.querySelector('#pc-y').textContent = y;
      var g = '', off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), i;
      'MON TUE WED THU FRI SAT SUN'.split(' ').forEach(function (h) { g += '<i>' + h + '</i>'; });
      for (i = 0; i < off; i++) g += '<span></span>';
      for (i = 1; i <= n; i++) g += '<span' + ((off + i - 1) % 7 > 4 ? ' class="wk"' : '') + '>' + i + '</span>';
      box.querySelector('.pc-grid').innerHTML = g; keep();
    }
    function paintSt() { ER.$$('.pc-slip', box).forEach(function (r) { var v = st[r.getAttribute('data-s')] || '', b = r.querySelector('.pc-st'); b.className = 'pc-st' + (v ? ' ' + v : ''); b.textContent = v === 'F' ? 'FITS' : v === 'X' ? 'CANNOT BE RIGHT' : 'stamp'; }); }
    ER.$$('.pc-wheel button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var w = b.getAttribute('data-w');
        if (w === 'm-') { m--; if (m < 0) { m = 11; y--; } } else if (w === 'm+') { m++; if (m > 11) { m = 0; y++; } } else if (w === 'y-') y--; else y++;
        y = Math.max(1990, Math.min(2035, y)); WL.sfx.card(); draw();
      });
    });
    ER.$$('.pc-slip', box).forEach(function (r) {
      r.querySelector('.pc-st').addEventListener('click', function () { if (done) return; var k = r.getAttribute('data-s'); st[k] = st[k] === 'F' ? 'X' : st[k] === 'X' ? '' : 'F'; paintSt(); WL.sfx.stamp(); keep(); });
    });
    box.querySelector('#pc-go').addEventListener('click', function () {
      var i, bad = null, more = 0;
      if (done) return;
      for (i = 0; i < SLIPS.length; i++) if (!st[SLIPS[i][0]]) { msg('&ldquo;Every slip gets a stamp,&rdquo; says Ms Siddiqui. &ldquo;Slip ' + (i + 1) + ' has none.&rdquo;'); return; }
      for (i = 0; i < SLIPS.length; i++) if (!ER.check(SLIPS[i][0], st[SLIPS[i][0]])) { if (!bad) bad = SLIPS[i][0]; else more++; }
      if (bad) {
        WL.bump('p-tries'); WL.sfx.hm(); ER.shake(box.querySelector('.pc-slip[data-s="' + bad + '"]'));
        msg('Ms Siddiqui holds up one slip. <i>&ldquo;' + SWHY[bad] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more' : more + ' more') + ' to look at again.&rdquo;</i>' : ''));
        return;
      }
      done = true; ER.flag('p-pc', 1); WL.sfx.stamp(); paint();
      msg('<b>&ldquo;Saturday the twenty-first,&rdquo;</b> says Ms Siddiqui, <b>&ldquo;is a Saturday this year. Whoever dated that letter was looking at a calendar for 2026.&rdquo;</b>');
      WL.learn(['anachronism']);
      WL.mine('dates', 'Every date in the case', '<p>Will 2019, Tue 5 Mar 2019: FITS</p><p>Will 2008, Wed 16 Apr 2008: FITS</p><p>Letter to Mr U., Fri 28 Nov 2025: FITS</p><p>Letter to Nigel, &ldquo;Sat 21 Nov 2025&rdquo;: 21 Nov 2025 was a FRIDAY. Saturday only in 2026.</p><p>Letter to Nigel, &ldquo;the Corner Pantry&rdquo;: that name only from Mon 5 Jan 2026. An anachronism.</p>', true);
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          '&ldquo;Two things in that letter belong to 2026: a day of the week, and the name of a shop. A letter cannot know what has not happened yet.&rdquo;',
          '&ldquo;Now Mr Yelland. He is not lying, I think: he gains nothing either way. But he says Thursday.&rdquo; She lays Mrs Ockenden&rsquo;s calendar on the counter, open at the end of February 2019, and his statement beside it.'
        ], function () { busy = false; paint(); openTm(); });
      }, 3000);
    });
    msg('<b>Turn the wheels</b> to the month and year on each slip, and check the day. Then <b>stamp</b> each slip: FITS, or CANNOT BE RIGHT.');
    pcBox = box; draw(); paintSt();
    ER.open('ov-lock', box, function () { pcBox = null; });
  }

  /* ---------- Mr Yelland's two mornings ---------- */
  function openTm() {
    var box = ER.el('div', 'tm'), saved = ER.flag('p-tms') || {}, done = false, q = saved.q || '';
    function SL(d) { var s = '', i; for (i = 0; i < 5; i++) s += '<div class="ds" data-d="' + d + '"></div>'; return s; }
    var s = '<div><div class="tm-days"><div class="tm-day"><h5>Thursday 28 February 2019</h5><p class="tm-note"><small>Mrs Ockenden&rsquo;s calendar (SO/1):</small> Market day. Mervyn in with his WILL, wants 2 witnesses. Said come Tues am, quiet. Seth earwigging as usual.</p><div class="dz" data-d="h">' + SL('h') + '</div></div>' +
      '<div class="tm-day"><h5>Tuesday 5 March 2019</h5><p class="tm-note"><small>Mrs Ockenden&rsquo;s calendar (SO/1):</small> 10.40 Mervyn&rsquo;s will signed at the counter: me + Seth (in with Poppy&rsquo;s parcel, cert.). M. had to bend right down, chain pen too short!! Get a longer chain.</p><div class="dz" data-d="u">' + SL('u') + '</div></div></div>' +
      '<div class="tm-tray"></div></div>' +
      '<div class="side"><h6>What happened to his memory?</h6><div class="tm-q"></div><button type="button" class="btn" id="tm-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.tm-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    MEM.forEach(function (mm) {
      var c = ER.el('div', 'tm-card dnd-item', ER.gloss('&ldquo;' + mm[1] + '&rdquo;')); c.setAttribute('data-k', mm[0]);
      var at = (saved.at || {})[mm[0]], free = at ? ER.$$('.ds[data-d="' + at + '"]', box).filter(function (x) { return !x.children.length; })[0] : null; (free || tray).appendChild(c);
    });
    TQ.forEach(function (o) {
      var b = ER.el('button', q === o[0] ? 'on' : '', ER.gloss(o[1])); b.type = 'button'; b.setAttribute('data-k', o[0]);
      b.addEventListener('click', function () { if (done) return; q = o[0]; ER.$$('.tm-q button', box).forEach(function (x) { x.classList.toggle('on', x === b); }); WL.sfx.card(); keep(); });
      box.querySelector('.tm-q').appendChild(b);
    });
    function state() { var o = {}; ER.$$('.tm-card', box).forEach(function (c) { var z = c.parentNode.getAttribute('data-d'); if (z) o[c.getAttribute('data-k')] = z; }); return o; }
    function keep() { var o = state(); ER.flag('p-tms', { at: o, q: q }); box.setAttribute('data-in', Object.keys(o).length); }
    ER.dnd(box, { item: '.tm-card', slot: '.ds', home: tray, lock: function () { return done; }, change: function () { WL.sfx.card(); keep(); } });
    box.querySelector('#tm-go').addEventListener('click', function () {
      var o = state(), i, bad = null, more = 0, file;
      if (done) return;
      if (Object.keys(o).length < MEM.length) { msg('&ldquo;Five things he remembers,&rdquo; says Ms Siddiqui, &ldquo;and every one of them happened on one morning or the other.&rdquo;'); return; }
      for (i = 0; i < MEM.length; i++) if (!ER.check(MEM[i][0], o[MEM[i][0]])) { if (!bad) bad = MEM[i][0]; else more++; }
      if (bad) {
        WL.bump('p-tries'); WL.sfx.hm(); ER.shake(box.querySelector('.tm-card[data-k="' + bad + '"]'));
        msg('<i>&ldquo;' + MWHY[bad] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more card is' : more + ' more cards are') + ' on the wrong morning.&rdquo;</i>' : ''));
        return;
      }
      if (!q) { msg('&ldquo;Good. Now: what has happened to his memory? Choose one of the three on the right.&rdquo;'); return; }
      if (!ER.check('tq', q)) {
        WL.bump('p-tries'); WL.sfx.hm();
        msg(q === 'a' ? '&ldquo;Lying? Look at your own cards: on the Tuesday he watched Mervyn sign, beside Mrs Ockenden. A liar who wanted to help Nigel would never have told us that.&rdquo;' : '&ldquo;On the Thursday Mervyn asked. Who signed what, and when, according to her calendar?&rdquo;');
        return;
      }
      file = ER.exitOk([SLIPS.map(function (x) { return (ER.flag('p-pcs') || {}).st[x[0]]; }).join('') + '+' + MEM.map(function (x) { return o[x[0]]; }).join('') + '+' + q]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('p-file', file); WL.done('post'); WL.sfx.stamp();
      msg('Ms Siddiqui reads the two mornings. <b>&ldquo;He heard it asked on the Thursday, and he signed it on the Tuesday. An honest man has made one morning out of two.&rdquo;</b>');
      WL.mine('mornings', 'Mr Yelland&rsquo;s two mornings', '<p>THU 28 FEB 2019: came from Dunsmere market; heard Mervyn ask Sylvia to witness. Nothing signed.</p><p>TUE 5 MAR 2019, 10.40: Poppy&rsquo;s parcel (certificate!); Mervyn signs, bent over the counter (chain pen too short); Sylvia signs; Seth signs under her. ALL THREE THERE.</p><p>He is not lying. He is mistaken about the day.</p><p>Ask him: the toffee tin.</p>', true);
      setTimeout(function () {
        ER.closeAll(); WL.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;And the shaky signature,&rdquo; says Ms Siddiqui, looking at the pen on its chain. &ldquo;An old man bending right down over a counter, with a chain as long as your hand. Write your own name like that and see.&rdquo; You try it on a paying-in slip. It wobbles.',
          'Zoe switches off the lights over the shelves, one row at a time. &ldquo;If you want Seth&rsquo;s tin,&rdquo; she says, without looking up, &ldquo;he takes his coat everywhere. Even to court, I should think.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('Mr Yelland remembers five things. <b>Put each one on the morning it happened</b>, using Mrs Ockenden&rsquo;s calendar. Then say what has happened to his memory. <i>Drag a card, or click it and then the day.</i>');
    tmBox = box; keep();
    ER.open('ov-lock', box, function () { tmBox = null; });
  }
})();
