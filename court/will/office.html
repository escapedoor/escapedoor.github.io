    { id: 'p3', name: 'Letter to Nigel, &ldquo;21 Nov 2025&rdquo;', cls: 'tw', html: function () { var f = { R: true, e: true }; return '<p class="copy">Photocopy &middot; produced by Mr N. Wedlake</p>' +
      '<p><span class="hs" data-h="p3-date">' + WL.typed('Saturday 21st November 2025', f) + '</span></p><span class="hs blk" data-h="p3-text"><p>' + WL.typed('Dear Nigel,', f) + '</p>' +
      '<p>' + WL.typed('Every word of that will I typed at the post office was a mistake, made in a temper, and I have torn it up. My old will at Underhill’s stands, half to you and half to Meriel, as it always should have.', f) + '</p>' +
      '<p>' + WL.typed('When you come, leave the spare key at the Corner Pantry. Remember me to the cat.', f) + '</p></span>' +
      '<p><span class="hs" data-h="p3-close">' + WL.typed('Your loving uncle,', f) + '</span></p><span class="hs blk" data-h="p3-sig">' + WL.sig('letter') + '</span>'; },
      spots: ['p3-date', 'p3-text', 'p3-close', 'p3-sig'] },
    { id: 'p4', name: 'Birthday card, 2020', cls: 'card', html: function () { return '<h4 class="hs" data-h="p4-print">Happy Birthday</h4>' +
      '<span class="hs blk" data-h="p4-text"><p>Merry &mdash; 11 August 2020</p><p>Four years of soup and crosswords. This cottage will be yours one day, and quite right too.</p></span>' +
      '<p><span class="hs" data-h="p4-sig">Uncle M.</span></p>'; },
      spots: ['p4-print', 'p4-text', 'p4-sig'] },
    { id: 'p5', name: 'Letter to Mr Underhill, 28 Nov 2025', cls: 'tw', html: function () { var f = { R: true }; return '<p class="copy">The original &middot; from the file of Underhill &amp; Noakes</p>' +
      '<p><span class="hs" data-h="p5-date">' + WL.typed('Friday 28th November 2025', f) + '</span></p><span class="hs blk" data-h="p5-text"><p>' + WL.typed('Re: my will. Dear Mr Underhill,', f) + '</p>' +
      '<p>' + WL.typed('In 2019 I made a new will myself, at the post office. It is in my bureau. I have been unfair to my nephew Nigel and I want to put it right. Please add to my will: my Vellacott typewriter, my stamp albums and £5,000 to Nigel.', f) + '</p>' +
      '<p>' + WL.typed('Could you come out to the cottage? I do not get about much now.', f) + '</p><p>' + WL.typed('Yours sincerely,', f) + '</p></span>' +
      '<span class="hs blk" data-h="p5-sig">' + WL.sig('y2025') + '</span>' +
      '<p><span class="hs" data-h="p5-stamp" style="display:inline-block;padding:2px 8px;border:2.5px solid #2f4a8a;color:#2f4a8a;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.12em;transform:rotate(-4deg)">UNDERHILL &amp; NOAKES &middot; RECEIVED 1 DEC 2025</span></p>'; },
      spots: ['p5-date', 'p5-text', 'p5-sig', 'p5-stamp'] }
  ];
  var PADS = [['Y', 'In writing', '#f2c94c'], ['R', 'Signed by him', '#d64848'], ['B', 'Two witnesses, same time', '#4078d6'], ['G', 'Each witness signs', '#3aa05a']];
  var QS = [['a', 'whether Mervyn signed the 2019 will with both witnesses there at the same time, and each of them then signed it'], ['b', 'whether Meriel deserves the cottage more than Nigel does'], ['c', 'whether the letter dated 21 November cancels the 2019 will']];
  var WHY = {
    'p1-firm': 'That is the firm&rsquo;s name, printed at the top. It tells you who typed the will, not who made it.',
    'p1-text': 'Is the 2008 will written down at all? Then it needs the flag for writing.',
    'p1-date': 'A date is useful. Section 9 does not ask for one.',
    'p1-sig': 'Where did Mervyn sign it, in his own hand?',
    'p1-clause': 'Read the line under his signature: &ldquo;in our presence&rdquo;. In whose presence, and when? Which of the four rules does that line claim?',
    'p1-wits': 'Two names in two hands at the bottom. What did those two people do?',
    'p2-text': 'Typed counts as writing. My frame says so.',
    'p2-date': 'A date is useful, and we shall check this one. But section 9 does not ask for a date at all.',
    'p2-sig': 'Find his own handwriting on the page. It wobbles, but it is there.',
    'p2-name': 'That is his name typed, not signed. Anybody can type a name.',
    'p2-clause': 'The small typed line says &ldquo;in our joint presence&rdquo;. Joint means together. Which of the four rules does it claim?',
    'p2-wits': 'Two signatures under that line, with what each person does for a living. What did those two do?',
    'p3-date': 'A date is not a signature, and it is not a witness.',
    'p3-text': 'Typed counts as writing.',
    'p3-close': '&ldquo;Your loving uncle&rdquo; is typed. It is a way of ending a letter, not a signature.',
    'p3-sig': 'Who signed this letter, according to the page? A flag says only what the page shows. Whether it is true is for later.',
    'p4-print': '&ldquo;Happy Birthday&rdquo; was printed by the card company. It is nobody&rsquo;s writing.',
    'p4-text': 'Handwriting is writing too.',
    'p4-sig': 'Every card is signed by somebody. Who signed this one?',
    'p5-date': 'A date is useful. Section 9 does not ask for one.',
    'p5-text': 'Typed counts as writing.',
    'p5-sig': 'He signed it. Find where.',
    'p5-stamp': 'That is Mr Underhill&rsquo;s RECEIVED stamp, put on three days later in Dunsmere. Was anybody watching Mervyn sign?'
  };
  var VWHY = { p1: 'The 2008 will carries all four of your flags. On its face it could be a will. Whether a later one cancelled it is another question.',
    p2: 'Every one of the four rules has a flag on the 2019 will. On its face it could be a will: that is exactly why Mr Yarde has to attack it.',
    p3: 'Nobody witnessed this letter. Whoever wrote it, it cannot be a will, and it cannot cancel one.',
    p4: 'A card can be in writing and signed. But who witnessed it? &ldquo;This cottage will be yours one day&rdquo; is a kind wish, not a will.',
    p5: 'Mr Underhill&rsquo;s stamp says when the letter came. A stamp is not a witness. The letter tells us what Mervyn wanted; it cannot do it for him.' };

  function hints() {
    if (nextFile) return ['go', ['Mr Underhill is driving you out to Thrushcombe. The button is at the bottom of the screen.']];
    if (fxBox) return ['flags', [
      'Choose a flag on the right, then click the part of the paper that shows that rule. A paper gets only the flags that the page itself shows. Some papers need all four; some need only two.',
      'Writing: the words of the paper. Signed by him: his own handwriting, not his typed name. Two witnesses at the same time: the small line that says they were together. Each witness signs: their signatures. A date, a printed heading or a RECEIVED stamp needs no flag.',
      'Only the two wills get all four flags, and COULD BE A WILL. The letter to Nigel, the card and the letter to Mr Underhill are written and signed, but nobody witnessed them: two flags each, and NOT A WILL. The case turns on what happened at the post office counter in 2019.'
    ]];
    if (!ER.flag('o-uz')) return ['uz', ['Ms Siddiqui is reading by the window, on the left. Talk to her first.']];
    if (!ER.flag('o-frame')) return ['frame', ['The framed page on the wall behind the desk is the law itself, in plain words. Click it and read it.']];
    if (!ER.flag('o-und')) return ['und', ['Mr Underhill, behind the desk, has the file. Talk to him.']];
    return ['open', ['The five papers are fanned out on the desk, with pink tape round them. Click them.']];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#uz').classList.toggle('ready', !nextFile && !ER.flag('o-uz') && !busy);
    $('#papers').classList.toggle('ready', !nextFile && !!ER.flag('o-und') && !!ER.flag('o-frame'));
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Mr Underhill has his car keys in one hand and the key of Myrtle Cottage in the other.'); return; }
    if (ER.flag('o-in')) { ER.say('The back office of Underhill &amp; Noakes. The rain has not stopped.'); return; }
    busy = true; ER.flag('o-in', 1);
    ER.narrate([
      'Dunsmere, Monday 2 November, a quarter past two. The back office of Underhill &amp; Noakes is up a staircase behind the front office, and it smells of old paper and radiator.',
      'You are a pupil barrister: a barrister in training. For six months you follow Ms Uzma Siddiqui everywhere, carry her papers and take her notes. In court you say nothing at all.',
      'Ms Siddiqui acts for Mrs Meriel Voysey, the niece of Mervyn&rsquo;s late wife. Mervyn&rsquo;s nephew, Nigel Wedlake, has brought a claim: he says that the will which leaves Meriel the cottage is no good.',
      'Mr Vernon Underhill made Mervyn&rsquo;s first will, in 2008. Until the court decides, he keeps the key of Myrtle Cottage and the papers. He would like everybody to know that he is on nobody&rsquo;s side.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#uz').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Typewriter first,&rdquo; says Ms Siddiqui, buttoning her coat. &ldquo;Then the post office, before it shuts.&rdquo;'); return; }
    if (ER.flag('o-uz')) { ER.say('&ldquo;Frame, file, flags,&rdquo; says Ms Siddiqui, without looking up. &ldquo;In that order.&rdquo;'); return; }
    ER.talk({
      who: 'Ms Siddiqui', role: 'Counsel for Mrs Voysey · your pupil supervisor', face: window.FACE('siddiqui'),
      lines: [
        { note: 'Ms Siddiqui is reading at the window, standing up. She reads everything standing up, and fast, and she has never yet lost a page.', a: 'Mr Wedlake&rsquo;s case, in one sentence: the 2019 will was not properly made, and in any case Mervyn cancelled it, so the 2008 will stands. That would give Nigel half of everything, instead of two thousand pounds.' },
        { q: 'And our case?', a: 'That the 2019 will was properly made, and that nothing ever cancelled it. Then Meriel has the cottage. She also visited him every day for nine years, which Mr Yarde will mention tomorrow as if it were a crime.' },
        { a: 'There are five papers in Mr Underhill&rsquo;s file. Before we go out to the cottage, I want to know which of them could be a will at all. Read the frame on the wall first. Mr Underhill put it up himself the week the law changed, in 1983, and it is still right.' }
      ],
      clue: { id: 'uz1', title: 'Ms Siddiqui, in the back office', kind: 'What she said' }, last: 'Read the frame',
      done: function (seen) { if (seen) { ER.flag('o-uz', 1); paint(); WL.learn(['will', 'probate']); } }
    });
  });
  $('#frame').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: FRAME, cls: 'law', clue: { id: 'frame', title: 'The Wills Act, section 9 (the frame)', kind: 'On the office wall' },
      done: function () { ER.flag('o-frame', 1); paint(); WL.learn(['valid', 'testator', 'witness', 'revoke']); } });
  });
  $('#und').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Mr Underhill locks the strongroom, tries the handle twice, and puts the key of Myrtle Cottage in his waistcoat pocket.'); return; }
    if (ER.flag('o-und')) { ER.say('&ldquo;Copies, all but one,&rdquo; says Mr Underhill. &ldquo;The letter to me is the original.&rdquo;'); return; }
    if (!ER.flag('o-uz')) { ER.say('Mr Underhill nods towards the window. &ldquo;Ms Siddiqui first, I think. She has been reading since one o&rsquo;clock.&rdquo;'); return; }
    ER.talk({
      who: 'Mr Underhill', role: 'Underhill & Noakes, solicitors · keeps the key', face: window.FACE('underhill'),
      lines: [
        { note: 'Mr Underhill has a red spotted bow tie, half-moon glasses and the slow voice of a man who has read a great many wills aloud to families who did not like them.', a: 'I made his first will, in 2008. My firm is the executor named in it. I keep the key of the cottage until the court decides, and I am on nobody&rsquo;s side. I should like that written down somewhere.' },
        { q: 'Did he ever tell you about the 2019 will?', a: 'Once. In the last letter he ever wrote me. It came on Monday the first of December: he wanted to add something to his will, for Nigel. I booked him for Monday the fifteenth. He died in hospital on the ninth.' },
        { q: 'And the letter to Nigel, the one that says he tore the will up?', a: 'I first saw that in February, when Nigel&rsquo;s solicitors sent me a copy. Nigel says it came to him in November. I never saw an envelope.' },
        { note: 'He unties the pink tape round the file and fans five papers across the desk.', a: 'Copies, all but one. His letter to me is the original: I stamped it the day it came. Everything else in this file is somebody&rsquo;s photocopy of somebody&rsquo;s paper.' }
      ],
      clue: { id: 'und1', title: 'Mr Underhill, at his desk', kind: 'What he said' }, last: 'Look at the papers',
      done: function (seen) { if (seen) { ER.flag('o-und', 1); paint(); WL.learn(['executor']); } }
    });
  });
  $('#papers').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Five papers, with your flags still on them. Two of them could be a will. Three of them never could.'); return; }
    if (!ER.flag('o-und')) { ER.say('A fan of papers tied with pink tape. It is Mr Underhill&rsquo;s file, and he has not opened it yet.'); return; }
    if (!ER.flag('o-frame')) { ER.say('&ldquo;The frame first,&rdquo; says Ms Siddiqui. &ldquo;You cannot flag what a will needs until you know what it needs.&rdquo;'); return; }
    openFlags();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  WL.thing('#window', null, 'Dunsmere market square, in the rain. On a Thursday it is full of stalls. Today it is full of puddles.', isBusy);
  WL.thing('#boxes', null, 'Tin deed boxes, each with a name painted on it in white. One says WEDLAKE M.A. It is empty: everything that was in it is on the desk.', isBusy);
  WL.thing('#strong', null, 'The strongroom. The original 2008 will is in there. &ldquo;Originals do not leave the building,&rdquo; says Mr Underhill, &ldquo;until a judge asks for them.&rdquo;', isBusy);
  WL.thing('#kettle', null, 'A kettle, a jar of tea bags, and two mugs. One says WORLD&rsquo;S BEST GRANDAD. Mr Underhill has no grandchildren. He found it.', isBusy);
  WL.thing('#lamp', null, 'A green desk lamp, older than you. It has lit the reading of a good many wills.', isBusy);

  /* ---------- the flags ---------- */
  function openFlags() {
    var box = ER.el('div', 'fx'), saved = ER.flag('o-fx') || {}, done = false, s, arm = null, cur = saved.cur || 'p1';
    var fl = saved.fl || {}, vd = saved.vd || {}, q = saved.q || '';
    s = '<div class="fx-view"></div><div class="side"><h6>Ms Siddiqui&rsquo;s flags</h6><div class="fx-pads"></div><h6>The five papers</h6><div class="fx-tabs"></div>' +
      '<h6>The case turns on one question:</h6><div class="fx-q"></div><button type="button" class="btn" id="fx-go">Show Ms Siddiqui</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var view = box.querySelector('.fx-view'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('o-fx', { cur: cur, fl: fl, vd: vd, q: q }); box.setAttribute('data-flags', Object.keys(fl).filter(function (k) { return fl[k]; }).length); }
    PADS.forEach(function (p) {
      var b = ER.el('button', '', '<i style="background:' + p[2] + '"></i>' + p[1]); b.type = 'button'; b.setAttribute('data-c', p[0]);
      b.addEventListener('click', function () { arm = arm === p[0] ? null : p[0]; ER.$$('.fx-pads button', box).forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-c') === arm); }); box.classList.toggle('arm', !!arm); WL.sfx.card(); });
      box.querySelector('.fx-pads').appendChild(b);
    });
    PAPERS.forEach(function (p, i) {
      var t = ER.el('div', 'fx-tab', '<button type="button">' + (i + 1) + ' &middot; ' + p.name + '</button><button type="button" class="st" title="Click: could be a will, not a will, or nothing"></button>');
      t.setAttribute('data-p', p.id);
      t.children[0].addEventListener('click', function () { cur = p.id; show(); keep(); ER.sfx.paper(); });
      t.children[1].addEventListener('click', function () { if (done) return; vd[p.id] = vd[p.id] === 'C' ? 'N' : vd[p.id] === 'N' ? '' : 'C'; stamps(); keep(); WL.sfx.stamp(); });
      box.querySelector('.fx-tabs').appendChild(t);
    });
    QS.forEach(function (o) {
      var b = ER.el('button', q === o[0] ? 'on' : '', ER.gloss(o[1])); b.type = 'button'; b.setAttribute('data-k', o[0]);
      b.addEventListener('click', function () { if (done) return; q = o[0]; ER.$$('.fx-q button', box).forEach(function (x) { x.classList.toggle('on', x === b); }); WL.sfx.card(); keep(); });
      box.querySelector('.fx-q').appendChild(b);
    });
    function stamps() {
      ER.$$('.fx-tab', box).forEach(function (t) {
        var v = vd[t.getAttribute('data-p')] || '', st = t.children[1];
        st.className = 'st' + (v ? ' ' + v : ''); st.textContent = v === 'C' ? 'COULD BE A WILL' : v === 'N' ? 'NOT A WILL' : 'stamp';
        t.classList.toggle('cur', t.getAttribute('data-p') === cur);
      });
    }
    function show() {
      var p = PAPERS.filter(function (x) { return x.id === cur; })[0];
      view.innerHTML = '<div class="doc ' + p.cls + '">' + p.html() + '</div>'; view.scrollTop = 0;
      ER.$$('.hs', view).forEach(function (h) {
        var k = h.getAttribute('data-h'); if (fl[k]) h.classList.add('fl' + fl[k]);
        h.addEventListener('click', function () {
          if (done) return;
          if (!arm) { msg('First choose one of the four flags on the right. Then click the part of the paper that shows that rule.'); return; }
          ['Y', 'R', 'B', 'G'].forEach(function (c) { h.classList.remove('fl' + c); });
          fl[k] = fl[k] === arm ? '' : arm; if (fl[k]) h.classList.add('fl' + fl[k]);
          WL.sfx.flag(); keep();
        });
      });
      stamps();
    }
    box.querySelector('#fx-go').addEventListener('click', function () {
      var i, j, p, k, bad = null, more = 0, file, cand;
      if (done) return;
      for (i = 0; i < PAPERS.length; i++) if (!vd[PAPERS[i].id]) { msg('&ldquo;Every paper gets a stamp,&rdquo; says Ms Siddiqui. &ldquo;Paper ' + (i + 1) + ' has none yet. Could it be a will, or not?&rdquo;'); return; }
      for (i = 0; i < PAPERS.length; i++) {
        p = PAPERS[i];
        for (j = 0; j < p.spots.length; j++) { k = p.spots[j]; if (!ER.check('h-' + k, fl[k] || '-')) { if (!bad) bad = [p, k]; else more++; } }
      }
      if (bad) {
        WL.bump('o-tries'); WL.sfx.hm(); cur = bad[0].id; show(); keep();
        var hs = view.querySelector('[data-h="' + bad[1] + '"]'); if (hs) { hs.scrollIntoView({ block: 'center' }); ER.shake(hs); }
        msg('Ms Siddiqui taps the paper with her pen. <i>&ldquo;' + WHY[bad[1]] + '&rdquo;</i>' + (more ? ' <i>&ldquo;And ' + (more === 1 ? 'one more flag needs' : more + ' more flags need') + ' another look, on this paper or another.&rdquo;</i>' : ''));
        return;
      }
      for (i = 0; i < PAPERS.length; i++) if (!ER.check('v' + (i + 1), vd[PAPERS[i].id])) {
        WL.bump('o-tries'); WL.sfx.hm(); cur = PAPERS[i].id; show(); keep();
        msg('&ldquo;Your flags are right. Look at the stamp on paper ' + (i + 1) + '.&rdquo; <i>&ldquo;' + VWHY[PAPERS[i].id] + '&rdquo;</i>'); return;
      }
      if (!q) { msg('&ldquo;Good. Now the question at the bottom: what does tomorrow turn on?&rdquo;'); return; }
      if (!ER.check('q', q)) {
        WL.bump('o-tries'); WL.sfx.hm();
        msg(q === 'b' ? '&ldquo;Deserves? The law does not ask who deserves the cottage. It asks whether the paper was properly made.&rdquo;' : '&ldquo;Look at your flags on the letter. Even if every word of it is Mervyn&rsquo;s, can it cancel anything?&rdquo;');
        return;
      }
      cand = PAPERS.map(function (x) { return x.spots.map(function (z) { return fl[z] || '-'; }).join(''); }).join('/') + '+' + PAPERS.map(function (x) { return vd[x.id]; }).join('') + '+' + q;
      file = ER.exitOk([cand]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('o-file', file); WL.done('office'); WL.sfx.stamp();
      msg('Ms Siddiqui reads your flags paper by paper. <b>&ldquo;Two wills, three papers that never could be. And one question for tomorrow.&rdquo;</b>');
      WL.learn(['attestation clause']);
      [['w08', 'The 2008 will'], ['w19', 'The 2019 will'], ['n21', 'The letter to Nigel, dated 21 November 2025'], ['card', 'The birthday card, 2020'], ['u28', 'The letter to Mr Underhill, 28 November 2025']].forEach(function (c, i) {
        var h = PAPERS[i].html().replace(/\s?data-h="[^"]*"/g, '').replace(/ class="hs( blk)?"/g, '').replace(/ hs"/g, '"');
        ER.addClue(c[0], c[1], h, PAPERS[i].cls, 'Trial bundle', true);
      });
      WL.mine('flags', 'Five papers, four rules', '<p>2008 will: writing, signed, together, both signed: COULD BE A WILL</p><p>2019 will: all four too (the line &ldquo;in our joint presence&rdquo;): COULD BE A WILL</p><p>Letter to Nigel, card, letter to Mr U.: written and signed, NOBODY WITNESSED: NOT A WILL. They cannot cancel a will either.</p><p>If the 2019 will is valid, its first line cancels the 2008 one.</p><p>Tomorrow turns on: did he sign with BOTH witnesses there AT THE SAME TIME, and did each sign?</p>', true);
      setTimeout(function () {
        ER.closeAll(); WL.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;So,&rdquo; says Ms Siddiqui. &ldquo;The 2019 will looks right. It has the line that says the witnesses were there together, and both their signatures under it. The law presumes that a will which looks properly made was properly made, unless there is evidence that it was not.&rdquo;',
          '&ldquo;Mr Yarde has some evidence: Mr Yelland, the farmer who witnessed it. He says it was a Thursday, and that Mrs Ockenden had signed before he got there. If he is right, the witnesses were not together, and the will fails.&rdquo;',
          '&ldquo;And because we say the will is valid, it is for us to prove it was properly made: not beyond all doubt, only more likely than not. The balance of probabilities. A civil case, like any other.&rdquo;',
          'Mr Underhill takes his coat off the hook. &ldquo;The typewriter is in the study,&rdquo; he says. &ldquo;Nigel brought it back in February. Shall we?&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3000);
    });
    msg('Five papers. <b>Choose a flag, then click the part of each paper that shows that rule.</b> Then <b>stamp</b> each paper: could it be a will, or not? Last, choose what tomorrow turns on.');
    fxBox = box; show(); keep();
    ER.open('ov-lock', box, function () { fxBox = null; });
  }
})();
</script>
</body>
</html>
