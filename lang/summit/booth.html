  .tc-theme{color:#8ab4e8}
  .hbtn b{color:#141c2c}
  #onair{animation:onair 2.4s steps(1,end) infinite}
  @keyframes onair{50%{opacity:.25}}
  #hallglow{animation:hallglow 7s steps(3,end) infinite}
  @keyframes hallglow{50%{opacity:.75}}
  /* the relay board */
  .rb{width:min(1060px,96vw);background:#1e2636;border:10px solid #3a4456;border-radius:6px;padding:16px 20px 12px;box-shadow:0 26px 70px rgba(0,0,0,.6);color:#e8ecf2}
  .rb h5{margin:0 0 2px;font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;letter-spacing:.08em;color:#f0a83a}
  .rb .sub{margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#9aa6ba;letter-spacing:.04em}
  .rb-grid{display:grid;grid-template-columns:210px repeat(3,1fr);gap:8px;align-items:stretch}
  .rb-h{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c8d2e2;text-align:center;padding:6px 4px;background:#141a26;border-radius:3px;line-height:1.35}
  .rb-h.row{text-align:left;padding:8px 10px}
  .rb-h.row b{display:block;font-family:'Oswald',sans-serif;font-weight:500;font-size:17px;letter-spacing:.06em;color:#fff;text-transform:none}
  .dial{display:flex;align-items:center;gap:10px;justify-content:center;background:#141a26;border:2px solid #2c3546;border-radius:4px;padding:8px 6px;cursor:pointer;color:#e8ecf2;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;letter-spacing:.06em}
  .dial:hover{border-color:#f0a83a}
  .dial .knob{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6a7488,#2a3242);border:2px solid #0c1018;position:relative}
  .dial .knob:after{content:'';position:absolute;left:17px;top:3px;width:4px;height:14px;background:#f0a83a;border-radius:2px;transform-origin:2px 16px;transform:rotate(var(--r,0deg))}
  .dial .val{min-width:76px;text-align:left}
  .dial.bad{border-color:#e8574a;background:#3a1a1e}
  .dial.route{border-color:#5ad08a;background:#163024}
  .rb-legend{margin-top:9px;font-family:'Gentium Book Plus',serif;font-size:14.5px;color:#b8c2d2;line-height:1.35}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, rb = null, fl = SM.fl, K;

  $('#morag').innerHTML = SM.who('morag', { phones: 1 });
  $('#udo').innerHTML = SM.who('udo');

  ER.init({
    theme: 'lang', story: 'summit', storyTitle: 'Eventually', id: 'booth', no: 'I', title: 'Booth One',
    go: 'Into the booth',
    intro: [
      'Thursday 19 November, two minutes to eleven at night. The Pontmirelle Conference Centre stands on the River Mirelle, where it runs between Sauvenne and Ostrel, and at nine tomorrow morning the two countries are to sign the Mirelle Agreement: who gets the river&rsquo;s water in a dry summer, and when the Old Bridge opens again.',
      'You are on a week&rsquo;s work experience with the summit&rsquo;s interpreters. You carry papers between the booths and the documents office. Forty minutes ago, in the hall below the booths, the agreement fell apart.'
    ],
    exit: {"next":"hall","w":{"5ba59b04":"d492da9b"}}, tags: {"b1e":["9ef30400"],"b1f":["6116cd9e"],"b1s":["094cda39"],"b2e":["361ae063"],"b2f":["8edecae5"],"b2s":["ccad9f4d"],"b3e":["b3626847"],"b3f":["f5ab92d4"],"b3s":["e25ffc92"]},
    hints: hints, onBegin: begin
  });

  K = SM.told('a-told'); nextFile = ER.flag('a-file') || null;
  function isBusy() { return busy; }
  function paint() {
    $('#morag').classList.toggle('ready', !K.has('morag'));
    $('#card').classList.toggle('ready', K.has('morag') && !K.has('card'));
    $('#udo').classList.toggle('ready', K.has('card') && !K.has('udo'));
    $('#rota').classList.toggle('ready', K.has('udo') && !K.has('rota'));
    $('#board').classList.toggle('ready', K.has('rota') && !nextFile);
    ER.pips((K.has('morag') ? 1 : 0) + (K.has('card') ? 1 : 0) + (K.has('udo') ? 1 : 0) + (K.has('rota') ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The button at the bottom takes you down to the hall.']];
    if (rb && rb.isOpen()) return ['board', [
      'Set every dial for the half hour from 22.00 to 22.30. Start with the easy three: what does a booth do while the floor speaks the booth&rsquo;s own language?',
      'The rota says who was in each booth at 22.05 and which languages they have: A and B they speak, C they only understand. A booth takes the floor if the person on duty understands the speaker. If not, it takes relay from a booth that is talking at that moment, in a language they know.',
      'At 22.05 Booth One had Mischa (English, with Spanish and French), Booth Two had Noémie (French, with English only), and Booth Three had Paz (Spanish, with English and French). Noémie cannot take Spanish from the floor, and Booth Three is silent while the floor speaks Spanish.'
    ]];
    if (!K.has('morag')) return ['morag', ['Morag Sutherland, the chief interpreter, is on the left by the console. Talk to her first.']];
    if (!K.has('card')) return ['card', ['The white card on the right-hand wall says how the booths work. Read it before you touch anything.']];
    if (!K.has('udo')) return ['udo', ['Udo Weismann, on the right, has a list of complaints. Talk to him.']];
    if (!K.has('rota')) return ['rota', ['The rota is taped to the glass between this booth and the French booth. Read it.']];
    return ['board', ['Now the relay board in the middle of the console. Click it.', 'The complaint at 22.05, the cat, was made while the Ambassador was speaking Spanish. To know whose mouth it came out of first, you need to know how each booth was listening at that moment.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The route of the cat is on the board, in green. The hall is waiting.'); return; }
    if (K.has('in')) { busy = false; ER.say('Booth One: the console, the window over the hall, Morag and Udo.'); return; }
    K.tell('in'); ER.mood('tense');
    ER.narrate([
      'Booth One is a glass box above the hall, about the size of a lift: two chairs, two microphones and a smell of cold coffee. Through the window the hall is empty. A horseshoe of tables, two rows of flags, sixty headsets left where they were dropped.',
      'At 22.52 the Sauvenne delegation walked out. Their minister said, in French, that Sauvenne would not sign a promise that only says <i>possibly</i>. Ostrel&rsquo;s minister said his country had been called a liar. Somewhere in the middle of it, somebody heard the word <i>dog</i>.',
      'Morag Sutherland, the chief interpreter, has her phone to her ear. She says &ldquo;Yes, Ambassador&rdquo; three times, and then: &ldquo;By four. Understood.&rdquo; She puts the phone down very gently, the way people do when they would like to throw it.'
    ], function () { busy = false; });
  }

  $('#morag').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Morag Sutherland', role: 'Chief interpreter · Booth One, English', face: SM.face('morag'),
      lines: [
        { note: 'She looks at you over her glasses as if deciding whether you are old enough. Then she decides that you are.', a: '&ldquo;The Ambassador thinks somebody in a booth changed what people said tonight. She wants to know who, and how, by four in the morning, when she has to ring both ministers. If the answer is a booth, there is no signing at nine.&rdquo;' },
        { q: 'Who does she think it was?', a: '&ldquo;Noémie Vasseur. The French booth, next door. Every complaint tonight was about the French channel, and Noémie has gone out on the terrace and won&rsquo;t come in.&rdquo; A pause. &ldquo;I have worked with Noémie for six years. That is exactly why I am not going to decide anything until we have checked.&rdquo;' },
        { q: 'How do we check?', a: '&ldquo;The console keeps a log, the rota is on the glass, and Mr Weismann has a list. But before you touch anything, read the card on the wall. You need to know how these booths work, and nobody else in this building does.&rdquo;' },
        { a: '&ldquo;One thing to start you off. Every booth works into its own language. This is the English booth: everything that comes out of my microphone is English. Next door, French. Beyond that, Spanish, for the Ambassador, who chairs the talks in Spanish because she is entitled to, and because, she says, it keeps the interpreters honest.&rdquo;' }
      ],
      clue: { id: 'morag', title: 'Morag: by four in the morning', kind: 'What she said' },
      done: function (seen) { if (seen && K.tell('morag')) { paint(); ER.say('The card on the right-hand wall: &ldquo;How the booths work&rdquo;.'); } }
    });
  });

  var DIA = '<svg viewBox="0 0 290 250"><g font-family="IBM Plex Mono,monospace" font-size="11">' +
    '<circle cx="145" cy="30" r="20" fill="#f4d8b8" stroke="#1c2333" stroke-width="2"/><text x="145" y="66" text-anchor="middle" fill="#1c2333">FLOOR (the speaker)</text>' +
    '<path d="M145 72L50 128M145 72v56M145 72L240 128" stroke="#1c2333" stroke-width="2"/>' +
    '<g fill="#e8eef8" stroke="#2a5a9a" stroke-width="2"><rect x="18" y="130" width="64" height="40"/><rect x="113" y="130" width="64" height="40"/><rect x="208" y="130" width="64" height="40"/></g>' +
    '<g text-anchor="middle" fill="#1c2333"><text x="50" y="148">Booth 1</text><text x="50" y="163">into EN</text><text x="145" y="148">Booth 2</text><text x="145" y="163">into FR</text><text x="240" y="148">Booth 3</text><text x="240" y="163">into ES</text></g>' +
    '<path d="M82 140q32 -16 31 0" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><text x="98" y="122" text-anchor="middle" fill="#c0392b">relay</text>' +
    '<path d="M50 170v30M145 170v30M240 170v30" stroke="#2a5a9a" stroke-width="2"/>' +
    '<g text-anchor="middle" fill="#2a5a9a"><text x="50" y="216">channel 1</text><text x="145" y="216">channel 2</text><text x="240" y="216">channel 3</text></g>' +
    '<text x="145" y="242" text-anchor="middle" fill="#5a6070">channel 0: the floor itself</text></g></svg>';
  var CARD = '<h4>Language Service &middot; Booth One &middot; read me first</h4><h3>How the booths work</h3><div class="two"><div>' +
    '<p>In <b>simultaneous interpreting</b> the interpreter sits in a soundproof <b>booth</b>, hears the speaker through headphones and gives the same message in another language at almost the same time: usually two or three seconds behind, more when a sentence is hard. That delay is the <b>lag</b>. Delegates choose a <b>channel</b> on their headsets.</p>' +
    '<p>Each booth works into one language only, so when the speaker uses that language, the booth is silent. Interpreters work in pairs and change over about every half hour: after about thirty minutes, mistakes of meaning increase, and the tired interpreter often does not notice them.</p>' +
    '<p>If nobody on duty in a booth understands the speaker, the booth takes <b>relay</b>: it listens to another booth instead of the floor. Relay adds a few seconds, and it passes on every mistake. In <b>consecutive interpreting</b>, used in small meetings, there is no booth: the interpreter takes notes and speaks after the speaker.</p></div>' +
    '<div class="dia">' + DIA + '</div></div>' +
    '<p class="fact"><b>A real fact.</b> Simultaneous interpreting became famous at the Nuremberg trials of 1945 and 1946, where interpreters worked from booths in English, French, Russian and German.</p>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    if (!K.has('morag')) { ER.say('A card on the wall: &ldquo;How the booths work&rdquo;. Morag is waiting to talk to you first.'); return; }
    ER.read({ html: CARD, cls: 'card', clue: { id: 'card', title: 'Card: how the booths work', kind: 'Booth One' }, done: function () {
      SM.terms(['simultaneous interpreting', 'booth', 'lag', 'channel', 'relay', 'consecutive interpreting']);
      if (K.tell('card')) { paint(); ER.say('Mr Weismann, on the right, has been holding his folder very tightly.'); }
    } });
  });

  var COMPLAINTS = '<h4>Complaints about channel 2 (French), tonight</h4><p class="sub">Listed by U. Weismann, Chief of Staff to the Chair. Times are when the delegates heard the words on their headsets.</p>' +
    '<p><span class="t">20.08</span> &nbsp;&ldquo;' + fl('les écluses du barrage') + '&rdquo; for the sluices of the dam. The Sauvenne engineers smiled. <span class="t">(from the Sauvenne seats)</span></p>' +
    '<p><span class="t">22.05.41</span> &nbsp;A cat with three feet. Laughter in the Sauvenne seats. <span class="t">(Sauvenne)</span></p>' +
    '<p><span class="t">22.16</span> &nbsp;&ldquo;Our minister said something much harsher than that.&rdquo; <span class="t">(an Ostrel adviser who speaks French)</span></p>' +
    '<p><span class="t">22.31</span> &nbsp;&ldquo;The French left something out.&rdquo; <span class="t">(an Ostrel engineer)</span></p>' +
    '<p><span class="t">22.46.38</span> &nbsp;&ldquo;The French channel called our minister a dog.&rdquo; <span class="t">(Sauvenne)</span></p>';
  var NOTE1 = '<h4>Found under Ms Sutherland&rsquo;s papers in Booth One at 22.58</h4><p class="hand">' + fl('NE LES LAISSE PAS SIGNER') + '</p><p class="tr">A narrow strip torn from a notepad, in Noémie Vasseur&rsquo;s writing. Morag&rsquo;s translation: &ldquo;Don&rsquo;t let them sign.&rdquo; The bottom edge is torn.</p>';
  $('#udo').addEventListener('click', function () {
    if (busy) return;
    if (!K.has('card')) { ER.say('&ldquo;When you have read the card,&rdquo; says Mr Weismann. &ldquo;Ms Sutherland insists.&rdquo;'); return; }
    ER.talk({
      who: 'Udo Weismann', role: 'Chief of staff to the Chair', face: SM.face('udo'),
      lines: [
        { note: 'A tall man in a dark suit, holding a red folder against his chest like a shield.', a: '&ldquo;Five complaints tonight, every one about the French channel. I have listed them with the times the delegates heard them.&rdquo; He gives you a typed sheet.' },
        { a: '&ldquo;And this was under Ms Sutherland&rsquo;s papers when I came up at 22.58. A note from the French booth, in Ms Vasseur&rsquo;s writing.&rdquo; It is a narrow strip of paper. In capitals: ' + fl('NE LES LAISSE PAS SIGNER') + '.' },
        { q: 'What does it say?', a: 'Morag reads it without wanting to. &ldquo;Don&rsquo;t let them sign.&rdquo; Mr Weismann nods slowly. &ldquo;Written before the walk-out. She wanted it to fail. I am sorry, but that is what it says.&rdquo;' },
        { q: 'Is there any more?', a: '&ldquo;The bottom edge is torn,&rdquo; says Morag. &ldquo;Somebody wrote more, or meant to.&rdquo; Mr Weismann: &ldquo;Then she can show us the rest. She will not come in.&rdquo;' },
        { a: '&ldquo;I am not a linguist,&rdquo; says Mr Weismann. &ldquo;I am a man with minutes and a folder. But I know that five out of five is not bad luck.&rdquo;' }
      ],
      clue: { id: 'udo', title: 'Mr Weismann: five out of five', kind: 'What he said' },
      done: function (seen) {
        if (!seen) return;
        ER.addClue('complaints', 'Complaints about channel 2', COMPLAINTS, 'log', 'List');
        ER.addClue('note1', 'The torn strip: Don&rsquo;t let them sign', NOTE1, 'note', 'Note');
        if (K.tell('udo')) { paint(); ER.say('The rota is taped to the glass between the booths.'); }
      }
    });
  });

  var ROTA = '<h4>Thursday 19 November &middot; evening session 19.00&ndash;23.00</h4><h3>Tonight&rsquo;s booths</h3>' +
    '<p>A = your own language &middot; B = a language you also speak into &middot; C = a language you understand and work from. Pairs change over on the hour and the half hour.</p>' +
    '<table><tr><th>Booth</th><th>Interpreters</th><th>19.00</th><th>19.30</th><th>20.00</th><th>20.30</th><th>21.00</th><th>21.30</th><th>22.00</th><th>22.30</th></tr>' +
    '<tr><td><b>1</b> into English</td><td>MS Morag Sutherland: A English, B French, C Spanish<br>MO Mischa Ottaway: A English, C Spanish, C French</td><td>MO</td><td>MS</td><td>MO</td><td>MS</td><td>MO</td><td>MS</td><td>MO</td><td>MS</td></tr>' +
    '<tr><td><b>2</b> into French</td><td>NV Noémie Vasseur: A French, B English<br>YM Yves Montreuil: A French, B English</td><td>NV</td><td>YM</td><td>NV</td><td>YM</td><td>NV</td><td><s>YM</s> NV</td><td>NV</td><td>NV</td></tr>' +
    '<tr><td><b>3</b> into Spanish</td><td>PU Paz Ugarte: A Spanish, B English, C French<br>RN Rocío Navarro: A Spanish, B English</td><td>PU</td><td>RN</td><td>PU</td><td>RN</td><td>PU</td><td>RN</td><td>PU</td><td>RN</td></tr></table>' +
    '<p class="red">21.28 Yves unwell, sent home. 21.32 relief asked for (N.V.). 22.30 asked again. None came. N.V. alone from 21.30 &mdash; M.S.</p>';
  $('#rota').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ROTA, cls: 'sheet', clue: { id: 'rota', title: 'Tonight&rsquo;s rota', kind: 'Booth One' }, done: function () {
      SM.terms(['interpreter']);
      if (K.tell('rota')) { paint(); ER.say(K.has('udo') ? 'Now the relay board, in the middle of the console.' : 'Mr Weismann has something for you too.'); }
    } });
  });

  SM.thing('#window', null, 'The hall below, empty. The flags of Ostrel on the left, blue and gold; the flags of Sauvenne on the right, red and white. In the middle, the Chair&rsquo;s desk, and a glass of water nobody finished.', isBusy);
  SM.thing('#cup', null, 'Morag&rsquo;s coffee, cold since nine. She drinks some anyway, without looking at it.', isBusy);
  SM.thing('#headset', 'headset', 'Morag&rsquo;s headset. In it, very faintly, the hum of an empty hall.', isBusy);
  SM.thing('#cough', 'cough button', 'Hold it down and your microphone goes dead: for coughing, or for whispering to your partner without the whole hall hearing.', isBusy);

  /* ---------- the relay board ---------- */
  var OPTS = ['F', '1', '2', '3', 'S'], NAME = { F: 'FLOOR', '1': 'BOOTH 1', '2': 'BOOTH 2', '3': 'BOOTH 3', S: 'SILENT', '': '&mdash;' };
  var ROT = { F: 0, '1': 60, '2': 120, '3': 180, S: 270, '': 300 };
  var CELLS = ['b1e', 'b1f', 'b1s', 'b2e', 'b2f', 'b2s', 'b3e', 'b3f', 'b3s'];
  var WHY = {
    b1e: 'Booth One works into English. What does it do while the floor is speaking English?',
    b2f: 'Booth Two works into French. What does it do while the floor is speaking French?',
    b3s: 'Booth Three works into Spanish. What does it do while the floor is speaking Spanish?',
    b1f: 'Who is on in Booth One between 22.00 and 22.30? Look at the rota: is French one of his languages?',
    b1s: 'Who is on in Booth One at 22.05, and can he take Spanish from the floor himself? His languages are on the rota.',
    b2e: 'Noémie&rsquo;s B language is English. Can she take an English speaker from the floor herself?',
    b2s: 'Neither Noémie nor Yves has any Spanish, so Booth Two cannot take the floor. Which booths are talking while the floor speaks Spanish, and in what language?',
    b3e: 'Paz and Rocío both have English. Floor or relay?',
    b3f: 'Who is in Booth Three between 22.00 and 22.30? Check her C language before you send her to relay.'
  };
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The board still shows the route at 22.05, in green: floor, Booth One, Booth Two, channel 2.'); return; }
    if (!K.has('card')) { ER.say('&ldquo;Read the card first,&rdquo; says Morag, without turning round.'); return; }
    if (!K.has('rota')) { ER.say('&ldquo;You can&rsquo;t set that board without the rota,&rdquo; says Morag. &ldquo;It&rsquo;s on the glass.&rdquo;'); return; }
    if (!rb) rb = makeBoard();
    rb.open();
  });
  function makeBoard() {
    var box = ER.el('div', 'pz rb'), st = ER.flag('a-rb') || {}, done = false;
    var langs = [['e', 'English'], ['f', 'French'], ['s', 'Spanish']];
    var h = '<h5>Booth One &middot; relay board</h5><p class="sub">Setting for 22.00&ndash;22.30. For each booth: where does it listen while the floor speaks this language?</p><div class="rb-grid"><div></div>' +
      langs.map(function (l) { return '<div class="rb-h">Floor speaks<br>' + l[1] + '</div>'; }).join('');
    [['1', 'Booth 1', 'into English &middot; channel 1'], ['2', 'Booth 2', 'into French &middot; channel 2'], ['3', 'Booth 3', 'into Spanish &middot; channel 3']].forEach(function (b) {
      h += '<div class="rb-h row"><b>' + b[1] + '</b>' + b[2] + '</div>';
      langs.forEach(function (l) { h += '<button type="button" class="dial" data-c="b' + b[0] + l[0] + '"><span class="knob"></span><span class="val"></span></button>'; });
    });
    h += '</div><p class="rb-legend">Click a dial to turn it: FLOOR (listen to the speaker), BOOTH 1, 2 or 3 (take relay from that booth), SILENT (say nothing: the channel carries the speaker).</p>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="r-go">Test the board</button></div>';
    box.innerHTML = h;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() {
      ER.$$('.dial', box).forEach(function (d) {
        var v = st[d.getAttribute('data-c')] || '';
        d.querySelector('.val').innerHTML = NAME[v];
        d.querySelector('.knob').style.setProperty('--r', ROT[v] + 'deg');
      });
    }
    ER.$$('.dial', box).forEach(function (d) {
      d.addEventListener('click', function () {
        if (done) return;
        var c = d.getAttribute('data-c'), v = st[c] || '', i = OPTS.indexOf(v);
        st[c] = OPTS[(i + 1) % OPTS.length]; ER.flag('a-rb', st); SM.sfx.knob();
        ER.$$('.dial', box).forEach(function (n) { n.classList.remove('bad'); });
        draw();
      });
    });
    box.querySelector('#r-go').addEventListener('click', function () {
      if (done) return;
      ER.$$('.dial', box).forEach(function (n) { n.classList.remove('bad'); });
      var miss = CELLS.filter(function (c) { return !st[c]; });
      if (miss.length) { ER.sfx.no(); msg('Morag: &ldquo;Every dial, please. A board with gaps in it is how cats get through.&rdquo;'); return; }
      for (var i = 0; i < CELLS.length; i++) {
        var c = CELLS[i], v = st[c];
        if (v === c.charAt(1)) { bad(c); msg('Morag: &ldquo;A booth cannot listen to itself. Booth ' + v + ' would be taking relay from its own mouth.&rdquo;'); return; }
      }
      for (i = 0; i < CELLS.length; i++) {
        if (!ER.check(CELLS[i], st[CELLS[i]])) { bad(CELLS[i]); msg('Morag taps one dial. &ldquo;Not that one. ' + WHY[CELLS[i]] + '&rdquo;'); return; }
      }
      var cand = CELLS.map(function (c) { return st[c]; }).join('.');
      nextFile = ER.exit([cand], { wait: true });
      if (!nextFile) { msg('The way on will not open. Something is wrong with this page: tell your teacher.'); return; }
      done = true; ER.flag('a-file', nextFile); paint();
      ['b1s', 'b2s'].forEach(function (c) { box.querySelector('[data-c="' + c + '"]').classList.add('route'); });
      SM.mine('route', 'The route of the cat, 22.05', '<p>The Ambassador spoke Spanish. Booth One (Mischa, who has Spanish) took her from the floor and spoke English. Booth Two (Noémie, no Spanish) took <b>relay</b> from Booth One and spoke French. Booth Three was silent.</p><p>So the cat went into English first, in Mischa&rsquo;s mouth, and Noémie passed it on.</p><p>Paz has French, so Booth Three took French from the floor until 22.30.</p>');
      msg('<b>That is the board.</b> The two green dials are the route at 22.05: the Ambassador&rsquo;s Spanish went into Booth One, out in English, into Booth Two, and out in French on channel 2.');
      setTimeout(function () {
        ER.closeAll(); busy = true; ER.mood('calm');
        ER.narrate([
          'Morag looks at the board for a long moment. Then she says, &ldquo;Mischa.&rdquo; Not crossly. The way you say the name of a dog that has eaten a sock.',
          '&ldquo;The Ambassador said a Spanish idiom at five past ten, and Mischa was on the microphone in this booth. Whatever he said, Noémie heard it in her headphones and put it into French. If there was a cat in it, the cat was English before it was French.&rdquo;',
          'Mr Weismann writes in his folder. &ldquo;One complaint of five. The cat came by relay. I will put that in the report.&rdquo; He underlines something twice. &ldquo;Four remain. And the note.&rdquo;',
          '&ldquo;The worst of the four is the dog,&rdquo; says Morag, taking her cardigan from the back of the chair. &ldquo;The recording desk is in the hall. Come on, runner. Back stairs.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 3000);
    });
    function bad(c) { ER.sfx.no(); var d = box.querySelector('[data-c="' + c + '"]'); d.classList.add('bad'); ER.shake(d); }
    draw();
    msg(Object.keys(st).length ? 'The dials are where you left them.' : 'Click each dial to turn it. The rota and the card are in your notebook.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
