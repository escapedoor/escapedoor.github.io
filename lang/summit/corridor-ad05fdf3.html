<style>
  body{--bg:#c8ccc4;--accent:#2a7a5a;--font-display:'Old Standard TT',serif;--font-ui:'Outfit',sans-serif;--font-body:'Gentium Book Plus',serif;
    --tc-bg:rgba(236,238,232,.97);--tc-ink:#1c2420;--cap-bg:rgba(236,238,232,.96);--cap-ink:#1c2420;--panel:#f8f9f6;--panel-ink:#1c2420;--face-bg:#1f2f55;--q-ink:#2a7a5a;
    --fade:#e8eae4;--hud-bg:rgba(236,238,232,.9);--hud-ink:#1c2420;--hud-line:rgba(28,36,32,.3);--ov-bg:rgba(20,26,22,.62)}
  .tc-room{font-size:clamp(40px,6vw,84px);color:#2a7a5a}
  .tc-theme{color:#5a6a8a}
  .hbtn b{color:#fff}
  #tube1{animation:tube 4.2s steps(1,end) infinite}
  @keyframes tube{0%{opacity:1}91%{opacity:1}92%{opacity:.3}94%{opacity:1}96%{opacity:.4}97%{opacity:1}}
  #exitg{animation:exitg 3s steps(2,end) infinite}
  @keyframes exitg{50%{opacity:.85}}
  .pmsg{color:#f4f6f2}
  .ck .btn{--accent:#d8f4e2}
  /* the cork board */
  .ck{width:min(1140px,97vw);background:#b8865a;background-image:radial-gradient(#a87650 1px,transparent 1.5px);background-size:9px 9px;border:12px solid #6a4a2c;padding:12px 14px 8px;box-shadow:0 26px 70px rgba(0,0,0,.55)}
  .ck-in{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  .ck h5{margin:0 0 5px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff8ec;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .said,.mean{display:block;width:100%;text-align:left;border:0;cursor:pointer;margin:0 0 6px;box-shadow:0 3px 7px rgba(0,0,0,.35)}
  .said{background:#fdfcf6;color:#1c2420;padding:6px 10px 6px 34px;font-family:'Gentium Book Plus',serif;font-size:14.5px;line-height:1.28;position:relative}
  .said small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:#6a6a5a;margin-bottom:1px}
  .said .no{position:absolute;left:7px;top:7px;width:20px;height:20px;line-height:20px;border-radius:50%;background:#c0392b;color:#fff;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;text-align:center}
  .said .got{display:block;margin-top:3px;font-family:'Kalam',cursive;font-size:15px;color:#2a7a5a}
  .said.on{outline:3px solid #f2c94c}
  .said.bad{outline:3px solid #e8574a;background:#fbe8e4}
  .mean{background:#fff2a8;color:#2a2410;padding:7px 10px;font-family:'Kalam',cursive;font-size:16.5px;line-height:1.25;transform:rotate(-.5deg)}
  .mean:nth-child(odd){transform:rotate(.6deg);background:#ffe9a0}
  .mean.used{opacity:.55}
  .mean .pin{float:right;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;color:#c0392b}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, ck = null, K;

  $('#udo').innerHTML = SM.who('udo');
  $('#morag').innerHTML = SM.who('morag', { cup: '#e8e4dc' });

  ER.init({
    theme: 'lang', story: 'summit', storyTitle: 'Eventually', id: 'corridor', no: 'IV', title: 'Meeting Room 3',
    go: 'Along the corridor',
    intro: [
      'In the lounge you put the Ambassador&rsquo;s three notes right: &ldquo;Dear Minister&rdquo; and &ldquo;would be most grateful&rdquo; for Madame Rouvier, &ldquo;Could you &hellip; please?&rdquo; for the Ostrel office, &ldquo;Can you lot pop up&rdquo; for the interpreters. The treaty sentence, the order and the text message stayed in the tray. Both sides said yes. Madame Rouvier&rsquo;s yes had a condition.',
      'She wants to know exactly what was agreed about the sluices at two o&rsquo;clock this afternoon in Meeting Room 3, half way along the corridor of meeting rooms. It is a quarter to one.'
    ],
    exit: {"next":"terrace","w":{"0f9e9399":"11932f21"}}, tags: {"s1":["5e132e85"],"s2":["f5161e97"],"s3":["a7402488"],"s4":["a75ad9a2"],"s5":["922b9d36"],"s6":["d1061339"],"s7":["1b4d76fe"]},
    hints: hints, onBegin: begin
  });

  K = SM.told('d-told'); nextFile = ER.flag('d-file') || null;
  function isBusy() { return busy; }
  var ORDER = ['udo', 'card', 'rec', 'pad'];
  function paint() {
    var next = null;
    ORDER.forEach(function (k) { if (!next && !K.has(k)) next = k; });
    ORDER.forEach(function (k) { $('#' + k).classList.toggle('ready', k === next); });
    $('#cork').classList.toggle('ready', !next && !nextFile);
    ER.pips(ORDER.filter(function (k) { return K.has(k); }).length + (nextFile ? 1 : 0), ORDER.length + 1);
    if (nextFile) verdicts();
  }
  function verdicts() {
    $('#verdicts').innerHTML = '<text x="930" y="230">AGREED: 2 days</text><text x="900" y="280">AGREED: 1 March</text><text x="900" y="330" fill="#c0392b">NOT agreed</text>';
  }
  function hints() {
    if (nextFile) return ['go', ['The button at the bottom takes you out to the terrace, where Noémie is.']];
    if (ck && ck.isOpen()) return ['cork', [
      'Click a thing that was said, on the left, and then what it meant, on the right. The Ambassador&rsquo;s card is in your notebook: it explains note, welcome, agree, understatement and polite indirectness. Two meanings are left over.',
      'Numbers 4 and 6 use the same words. Who says each one, and to whom? A minister speaking to the other side is not a chair speaking to her own chief of staff.',
      'Number 1 is a plain promise. &ldquo;We note&rdquo; is only &ldquo;we have heard you&rdquo;. &ldquo;Not entirely without difficulty&rdquo; means it would hurt. &ldquo;A frank exchange of views&rdquo; is an argument. And the Chair&rsquo;s &ldquo;I wonder if it might be possible&rdquo; to Udo means: do it.'
    ]];
    if (!K.has('udo')) return ['udo', ['Mr Weismann is on the left, by the glass. Talk to him.']];
    if (!K.has('card')) return ['card', ['The Ambassador&rsquo;s card is on the table, on the right. Read it.']];
    if (!K.has('rec')) return ['rec', ['The little recorder on the table kept everything said in this room. Click it.']];
    if (!K.has('pad')) return ['pad', ['Noémie left her notepad on the chair on the right. Have a look at it.']];
    return ['cork', ['Now the cork board on the right-hand wall. Click it.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The sluices were agreed at two. Two days. Now the terrace.'); return; }
    if (K.has('in')) { busy = false; ER.say('Meeting Room 3: the table, the whiteboard, the cork board.'); return; }
    K.tell('in');
    ER.narrate([
      'The corridor of meeting rooms is lit by one long tube that flickers every few seconds, as if it is thinking about something. Rooms 1 to 5, all glass, all empty.',
      'Meeting Room 3 still has the afternoon in it: six chairs, a jug of water, an agenda on the whiteboard in blue pen, and a cork board that somebody started to use and gave up on.',
      'Mr Weismann holds out three typed sheets, as if he would rather not. &ldquo;My minutes,&rdquo; he says.'
    ], function () { busy = false; });
  }

  var MIN = '<h4>Minutes &middot; Meeting Room 3 &middot; Thursday 19 November &middot; 14.00&ndash;14.50</h4><h3>U. Weismann, for the Chair</h3>' +
    '<p><b>1. Sluices.</b> Ostrel agrees to open the sluices when the river is below the red mark for two days. Sauvenne agrees.</p>' +
    '<p><b>2. Old Bridge.</b> Ostrel offers to reopen the Old Bridge on 1 March 2027. Sauvenne welcomes the offer.</p>' +
    '<p><b>3. Tolls.</b> The ministers had a frank exchange of views on the tolls. Ostrel notes Sauvenne&rsquo;s concerns. To be looked at again in the spring.</p>' +
    '<p class="red">Sent to the drafting committee at 15.40, by four as asked. U.W.</p>';
  $('#udo').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Mr Weismann is reading his own first sentence again, very slowly, the way you look at a step you have just fallen down.'); return; }
    ER.talk({
      who: 'Udo Weismann', role: 'Chief of staff to the Chair', face: SM.face('udo'),
      lines: [
        { a: '&ldquo;I took the minutes in this room at two o&rsquo;clock. The Ambassador asked me for them by four, and the drafting committee wrote the agreement&rsquo;s articles from them. If anything was agreed here, it is in my minutes.&rdquo;' },
        { q: 'Then what is the problem?', a: '&ldquo;Ostrel&rsquo;s people say the sluices were agreed. Sauvenne&rsquo;s people say the same. But each side says the other has gone back on it, and the minutes of a meeting are only one man&rsquo;s English.&rdquo; He hands them over. &ldquo;Diplomats never say what they mean. The Ambassador has a card about it. She leaves it on every table.&rdquo;' },
        { a: '&ldquo;The room&rsquo;s recorder was on: the interpreter&rsquo;s microphone records everything. And Ms Vasseur interpreted here, consecutive, so her notes are somewhere. She leaves nothing behind. Except, today, apparently, her notepad.&rdquo;' }
      ],
      clue: { id: 'udo4', title: 'Mr Weismann: my minutes', kind: 'What he said' },
      done: function (seen) {
        if (!seen) return;
        ER.addClue('minutes', 'The Chair&rsquo;s minutes, Meeting Room 3', MIN, 'sheet', 'Minutes');
        SM.terms(['minutes']);
        if (K.tell('udo')) { paint(); ER.say('The Ambassador&rsquo;s card is on the table.'); }
      }
    });
  });

  var CARD = '<h4>Ambassador Ortúzar&rsquo;s desk card &middot; since 1987</h4><h3>What we say, and what we mean</h3>' +
    '<p>Diplomats rarely say no, and rarely shout. They use <b>understatement</b>, saying less than they mean, so that nobody has to lose face. &ldquo;That would not be without difficulty&rdquo; means &ldquo;That is very hard, and probably impossible.&rdquo; &ldquo;A frank exchange of views&rdquo; means an argument.</p>' +
    '<p>Watch the verbs. To <b>note</b> something, or take note of it, is only to say that you have heard it. To <b>welcome</b> it is to say that you like it. Only to agree, or to undertake to do something, is to promise.</p>' +
    '<p>Watch who is speaking, and to whom. &ldquo;I wonder if it might be possible to &hellip;&rdquo; is polite <b>indirectness</b>. From a chair to her own staff, it is an order. From a minister to the other side of the table, it is often a way of saying not now, or not ever.</p>' +
    '<p>And when a diplomat speaks plainly, listen hardest of all.</p>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    if (!K.has('udo')) { ER.say('A card on the table. Mr Weismann wants a word first.'); return; }
    ER.read({ html: CARD, cls: 'card', clue: { id: 'diplo', title: 'Card: what we say, and what we mean', kind: 'The Ambassador' }, done: function () {
      SM.terms(['understatement', 'indirectness']);
      if (K.tell('card')) { paint(); ER.say('The recorder on the table, next.'); }
    } });
  });

  var TR = '<h4>Meeting Room 3 &middot; 14.00&ndash;14.50 &middot; the interpreter&rsquo;s microphone</h4><p class="sub">Present: Mr Otterburn and an adviser (Ostrel); Mme Rouvier and Me Taillefer (Sauvenne); the Chair, who spoke English in this small meeting; Mr Weismann (minutes). Consecutive interpreting, English and French: N. Vasseur. Madame Rouvier&rsquo;s French is given here as Ms Vasseur gave it in English.</p>' +
    '<p><span class="t">14.06</span> <b>THE CHAIR</b>: Shall we begin with the sluices?</p>' +
    '<p><span class="t">14.07</span> <b>MR OTTERBURN</b>: Fine. Here it is. When the river at the Old Bridge falls below the red mark, we open the sluices. Give us two days to warn the farms below the dam. Two days, no more. You have my word.</p>' +
    '<p class="ch"><span class="t">14.09</span> <b>MME ROUVIER</b>: Forty-eight hours. Sauvenne agrees. Thank you, Minister.</p>' +
    '<p><span class="t">14.15</span> <b>MR OTTERBURN</b>: And the Old Bridge. Ostrel offers to reopen it on the first of March.</p>' +
    '<p class="ch"><span class="t">14.16</span> <b>MME ROUVIER</b>: Sauvenne welcomes the offer to reopen the Old Bridge on the first of March.</p>' +
    '<p class="ch"><span class="t">14.24</span> <b>MME ROUVIER</b>: Sauvenne would like the bridge to be free of tolls.</p>' +
    '<p><span class="t">14.25</span> <b>MR OTTERBURN</b>: We note Sauvenne&rsquo;s concerns about the tolls.</p>' +
    '<p class="ch"><span class="t">14.31</span> <b>MME ROUVIER</b>: A toll on every lorry would not be entirely without difficulty for our farmers.</p>' +
    '<p><span class="t">14.38</span> <b>MR OTTERBURN</b>: I wonder if it might be possible to look at the tolls again in the spring.</p>' +
    '<p><span class="t">14.49</span> <b>THE CHAIR</b>, to Mr Weismann: Udo, I wonder if it might be possible to have the minutes by four.</p>';
  $('#rec').addEventListener('click', function () {
    if (busy) return;
    if (!K.has('udo')) { ER.say('A small recorder, still switched on. Mr Weismann first.'); return; }
    ER.read({ html: TR, cls: 'log', clue: { id: 'room3', title: 'Meeting Room 3, 14.00: the recording', kind: 'Transcript' }, done: function () {
      if (K.tell('rec')) { paint(); ER.say('Noémie&rsquo;s notepad is on the chair on the right.'); }
    } });
  });

  var PADSVG = '<svg viewBox="0 0 520 330"><rect width="520" height="330" fill="#fdfcf6"/><path d="M0 0h520" stroke="#c0392b" stroke-width="6"/>' +
    '<g font-family="Kalam,cursive" font-size="21" fill="#1d3a7a">' +
    '<text x="20" y="40">OST &#8594; open &#9636;&#9636;</text><text x="250" y="40">when river &lt; red</text>' +
    '<text x="40" y="76">2 d = 48 h !!</text><text x="230" y="76">warn farms &#8595; dam</text>' +
    '<text x="40" y="112">&#8220;my word&#8221;</text><text x="200" y="112">&#10003;&#10003;</text>' +
    '<text x="20" y="150">SAUV: 48 h &#10003;</text>' +
    '<path d="M20 166h480" stroke="#9aa4c4" stroke-width="2"/>' +
    '<text x="20" y="200">Bridge: OST offer &#8594; 1/3</text><text x="330" y="200">SAUV &#9786; welc.</text>' +
    '<path d="M20 216h480" stroke="#9aa4c4" stroke-width="2"/>' +
    '<text x="20" y="250">Tolls: SAUV want 0</text><text x="260" y="250">OST &#8220;note&#8221;</text>' +
    '<text x="40" y="286">farmers: &#8220;not w/o diff.&#8221;</text><text x="40" y="318">OST: spring??</text></g></svg>';
  var PAD = '<h4>Left on a chair in Meeting Room 3</h4><h3>Noémie&rsquo;s notepad</h3>' + PADSVG +
    '<p class="red">Morag: &ldquo;Consecutive notes. Every interpreter has their own symbols: an arrow for gives or goes to, a tick for agreed, &lt; for below, a smile for pleased. You write ideas, not words, and you speak from them a minute later. These are Noémie&rsquo;s, from two o&rsquo;clock. Look how clear they are.&rdquo;</p>';
  $('#pad').addEventListener('click', function () {
    if (busy) return;
    if (!K.has('udo')) { ER.say('A notepad on a chair. Mr Weismann first.'); return; }
    ER.read({ html: PAD, cls: 'sheet', clue: { id: 'pad', title: 'Noémie&rsquo;s consecutive notes, 14.00', kind: 'Notepad' }, done: function () {
      if (K.tell('pad')) { paint(); ER.say('Now the cork board on the wall.'); }
    } });
  });

  $('#morag').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Two days,&rdquo; says Morag. &ldquo;Plainly said. And nobody listened to the plain bit.&rdquo;' : '&ldquo;Read everything first,&rdquo; says Morag, warming her hands on her tea. &ldquo;Then the cork board. Diplomats are like idioms: you translate what they mean, not what they say.&rdquo;');
  });
  SM.thing('#wb', null, 'The afternoon&rsquo;s agenda, in blue pen: sluices, the Old Bridge, tolls.', isBusy);

  /* ---------- the cork board ---------- */
  var SAID = [
    ['s1', 'Mr Otterburn, 14.07', '&ldquo;When the river at the Old Bridge falls below the red mark, we open the sluices. Give us two days to warn the farms below the dam. Two days, no more. You have my word.&rdquo;'],
    ['s2', 'Mme Rouvier, 14.16', '&ldquo;Sauvenne welcomes the offer to reopen the Old Bridge on the first of March.&rdquo;'],
    ['s3', 'Mr Otterburn, 14.25', '&ldquo;We note Sauvenne&rsquo;s concerns about the tolls.&rdquo;'],
    ['s4', 'Mr Otterburn, 14.38', '&ldquo;I wonder if it might be possible to look at the tolls again in the spring.&rdquo;'],
    ['s5', 'Mme Rouvier, 14.31', '&ldquo;A toll on every lorry would not be entirely without difficulty for our farmers.&rdquo;'],
    ['s6', 'The Chair to Mr Weismann, 14.49', '&ldquo;Udo, I wonder if it might be possible to have the minutes by four.&rdquo;'],
    ['s7', 'The minutes, item 3', '&ldquo;The ministers had a frank exchange of views on the tolls.&rdquo;']];
  var MEAN = [['th', 'We will think about it, and the answer is probably yes.'], ['hd', 'We have heard what you said. That is all.'], ['di', 'Have them on my desk by four.'],
    ['pr', 'We promise: within two days, every time.'], ['ag', 'They argued about the tolls.'], ['ya', 'We agree: no tolls.'], ['nn', 'Not now, and perhaps not ever.'],
    ['ht', 'That would hurt our farmers badly.'], ['lk', 'We are glad of it, and we want it.']];
  var WHY = {
    s1: 'Read it plainly. Is anything in it hedged, or is it a promise?',
    s2: '&ldquo;Welcome&rdquo; is warmer than &ldquo;note&rdquo;. Here it is how Sauvenne feels about Ostrel&rsquo;s offer.',
    s3: 'Look at the Ambassador&rsquo;s card: what is it to note something?',
    s4: 'Who is speaking, to whom? A minister, to the other side, about something he does not want to give.',
    s5: 'Understatement. What does &ldquo;not entirely without difficulty&rdquo; really mean, on the card?',
    s6: 'The same words as number 4, from a different person to a different person: the Chair, to her own chief of staff.',
    s7: 'A &ldquo;frank exchange of views&rdquo;: the card says what that means.'
  };
  $('#cork').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The cork board, full of red string. Two days, agreed. Tolls, not.'); return; }
    var miss = ORDER.filter(function (k) { return !K.has(k); });
    if (miss.length) { ER.say('&ldquo;Not yet,&rdquo; says Morag. &ldquo;The card, the recording and the notepad first. Then pin it up.&rdquo;'); return; }
    if (!ck) ck = makeCork();
    ck.open();
  });
  function makeCork() {
    var box = ER.el('div', 'pz ck'), st = ER.flag('d-ck') || {}, pick = null, done = false;
    box.innerHTML = '<div class="ck-in"><div><h5>What was said</h5>' + SAID.map(function (s, i) {
      return '<button type="button" class="said" data-s="' + s[0] + '"><span class="no">' + (i + 1) + '</span><small>' + s[1] + '</small>' + s[2] + '<span class="got"></span></button>';
    }).join('') + '</div><div><h5>What it meant</h5>' + MEAN.map(function (m) { return '<button type="button" class="mean" data-m="' + m[0] + '"><span class="pin"></span>' + m[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="k-go">Answer Madame Rouvier</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function textOf(m) { for (var i = 0; i < MEAN.length; i++) if (MEAN[i][0] === m) return MEAN[i][1]; return ''; }
    function draw() {
      ER.$$('.said', box).forEach(function (b) { var s = b.getAttribute('data-s'); b.classList.toggle('on', s === pick); b.querySelector('.got').textContent = st[s] ? '→ ' + textOf(st[s]) : ''; });
      ER.$$('.mean', box).forEach(function (b) {
        var m = b.getAttribute('data-m'), who = [];
        SAID.forEach(function (s, i) { if (st[s[0]] === m) who.push(i + 1); });
        b.classList.toggle('used', who.length > 0); b.querySelector('.pin').textContent = who.join(', ');
      });
    }
    ER.$$('.said', box).forEach(function (b) {
      b.addEventListener('click', function () { if (done) return; var s = b.getAttribute('data-s'); pick = pick === s ? null : s; ER.sfx.click(); ER.$$('.said', box).forEach(function (n) { n.classList.remove('bad'); }); draw(); if (pick) msg('Now click what it meant, on the right.'); });
    });
    ER.$$('.mean', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (done) return;
        if (!pick) { msg('Click something that was said, on the left, first.'); return; }
        var m = b.getAttribute('data-m');
        Object.keys(st).forEach(function (s) { if (st[s] === m) delete st[s]; });
        st[pick] = m; pick = null; ER.flag('d-ck', st); SM.sfx.string(); draw(); msg('Pinned. Red string from one card to the other.');
      });
    });
    box.querySelector('#k-go').addEventListener('click', function () {
      if (done) return;
      ER.$$('.said', box).forEach(function (n) { n.classList.remove('bad'); });
      var empty = SAID.filter(function (s) { return !st[s[0]]; });
      if (empty.length) { ER.sfx.no(); msg('Mr Weismann: &ldquo;Seven things were said. Each needs its meaning before we answer a minister.&rdquo;'); return; }
      for (var i = 0; i < SAID.length; i++) {
        var s = SAID[i][0];
        if (!ER.check(s, st[s])) { ER.sfx.no(); var n = box.querySelector('.said[data-s="' + s + '"]'); n.classList.add('bad'); ER.shake(n); msg('Morag taps card ' + (i + 1) + '. &ldquo;' + WHY[s] + '&rdquo;'); return; }
      }
      var cand = SAID.map(function (x) { return st[x[0]]; }).join('.');
      nextFile = ER.exit([cand], { wait: true });
      if (!nextFile) { msg('The way on will not open. Something is wrong with this page: tell your teacher.'); return; }
      done = true; ER.flag('d-file', nextFile); paint();
      SM.mine('agreed', 'What was agreed at two', '<p>SLUICES: AGREED. &ldquo;Two days, no more. You have my word.&rdquo; Plainly said: within 48 hours. Sauvenne agreed.</p><p>OLD BRIDGE: AGREED. Ostrel offered 1 March; Sauvenne welcomed it.</p><p>TOLLS: NOT AGREED. &ldquo;We note&rdquo; = we have heard you. &ldquo;I wonder if it might be possible &hellip; in the spring&rdquo; = not now. &ldquo;Not entirely without difficulty&rdquo; = it would hurt. &ldquo;A frank exchange of views&rdquo; = an argument.</p><p>The same words from the Chair to Udo = an order.</p><p>Nobody lied.</p>');
      msg('<b>That is what they meant.</b> The sluices were agreed, plainly: two days. The bridge was agreed. The tolls were not: noted, put off, argued about. Nobody lied.');
      setTimeout(function () {
        ER.closeAll(); busy = true; ER.mood('tense');
        ER.narrate([
          'Mr Weismann writes a note to Madame Rouvier in his best formal English: the sluices were agreed at two o&rsquo;clock, to open within two days of the river falling below the red mark. He sends it by hand. Then he picks up his own minutes and reads the first item aloud.',
          '&ldquo;&lsquo;Ostrel agrees to open the sluices when the river is below the red mark for two days.&rsquo;&rdquo; Morag puts her tea down. &ldquo;Udo. Open them for two days? Or open them after the river has been low for two days?&rdquo;',
          'Mr Weismann opens his mouth and shuts it again. &ldquo;I meant within two days. That is what he said.&rdquo; &ldquo;It is not what you wrote,&rdquo; says Morag, quite gently. &ldquo;And at twenty to four it went to the drafting committee.&rdquo;',
          '&ldquo;Then I will tell the Ambassador that myself,&rdquo; says Mr Weismann. He is pale, but he says it. &ldquo;But that is a sentence in my minutes, and the walk-out was about a word in the hall. The sluices were agreed at two, the hall broke up at ten to eleven, and in between, the only new voice in the room was the French booth.&rdquo;',
          '&ldquo;Then let&rsquo;s go and ask the French booth,&rdquo; says Morag, and picks up a second cup of tea, which is not for her.'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 3200);
    });
    draw();
    msg(Object.keys(st).length ? 'Your string is where you left it.' : 'Click a thing that was said, then what it meant. The Ambassador&rsquo;s card is in your notebook.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
