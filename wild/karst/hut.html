<style>
  body{--bg:#2e2622;--accent:#e9a23b;--font-display:'Fjalla One',sans-serif;--font-ui:'Overpass',sans-serif;--font-body:'Lora',serif;
    --tc-bg:rgba(36,28,22,.96);--tc-ink:#f2e8d6;--cap-bg:rgba(34,26,20,.93);--panel:#2a211b;--face-bg:#3a2e26;--q-ink:#ffc98a;--fade:#1e1814;--hud-bg:rgba(34,26,20,.84)}
  #glow{animation:glow 2.3s steps(1,end) infinite}
  @keyframes glow{0%{opacity:.85}30%{opacity:.6}36%{opacity:.95}70%{opacity:.72}}
  #rain{animation:rain .5s steps(4,end) infinite}
  @keyframes rain{to{transform:translate(-14px,40px)}}
  #ph{animation:ph 3s steps(1,end) infinite}
  @keyframes ph{50%{opacity:.6}}

  /* the kit: four people and a box of spares */
  .kit{display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:12px;padding:16px;background:#3b2f26 linear-gradient(160deg,#4a3b2e,#2f251e);border:1px solid #1a130e}
  .kp,.kbox{background:#efe6d2;border-radius:3px;padding:10px 10px 8px;color:#211a12;box-shadow:inset 0 0 0 1px #8a7656}
  .kp h5,.kbox h5{margin:0 0 7px;font-family:'Fjalla One',sans-serif;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#2f5a3a}
  .kp h5 small{display:block;font-family:'Overpass',sans-serif;font-size:10.5px;letter-spacing:.14em;color:#7a6a4a}
  .kfix,.kslot{display:flex;align-items:center;gap:7px;min-height:46px;margin:0 0 6px;padding:3px 6px;border-radius:3px;font-family:'Overpass',sans-serif;font-weight:700;font-size:12.5px}
  .kfix{background:#ddd2b8;color:#3a3020}
  .kslot{border:2px dashed #9a8660;background:rgba(255,255,255,.35)}
  .kslot:empty:before{content:'empty';color:#9a8660;font-weight:400;font-style:italic;padding-left:4px}
  .kbox{background:#c9b48c;box-shadow:inset 0 0 0 2px #6a5636}
  .kbox .home{min-height:270px;display:flex;flex-direction:column;gap:6px}
  .kitem{display:flex;align-items:center;gap:7px;min-height:44px;padding:3px 7px;border-radius:3px;background:#fbf6ea;border:1px solid #6a5636;cursor:grab;font-family:'Overpass',sans-serif;font-weight:700;font-size:12.5px;color:#2a2014;touch-action:none}
  .kitem.held{outline:3px solid #e9a23b}
  .kitem.fly{position:fixed;z-index:80;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .kitem svg,.kfix svg{flex:0 0 38px;width:38px;height:30px}
  .kslot .kitem{width:100%}

  /* the call-out board: a whiteboard with magnets and a marker pen */
  .board{background:#fbfcfa;color:#14233a;padding:12px 18px 10px;border:9px solid #b9c0c4;border-radius:3px;box-shadow:inset 0 0 40px rgba(120,140,150,.18)}
  .board h5{margin:0 0 6px;font-family:'Fjalla One',sans-serif;font-size:24px;letter-spacing:.12em;color:#c8321e;display:flex;justify-content:space-between;align-items:baseline}
  .board h5 small{font-family:'Overpass',sans-serif;font-weight:700;font-size:11px;letter-spacing:.18em;color:#5a6a76}
  .brow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #d4dbe0}
  .brow>label{font-family:'Fjalla One',sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#14233a;line-height:1.15}
  .brow .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .bslot{min-width:150px;min-height:36px;border-bottom:2px solid #9fb0bc;display:flex;align-items:center;padding:0 2px}
  .bslot.wide{min-width:250px}
  .btray{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:4px 6px;margin-left:auto;background:#eef2f4;border-radius:3px;min-height:40px}
  .mag{display:inline-block;padding:5px 10px 3px;border-radius:2px;font-family:'Caveat',cursive;font-size:21px;line-height:1.05;color:#14233a;background:#ffe36a;box-shadow:0 2px 0 #b89a20,0 3px 6px rgba(0,0,0,.25);cursor:grab;touch-action:none;white-space:nowrap}
  .mag.g{background:#bfe3c4;box-shadow:0 2px 0 #5a8a62,0 3px 6px rgba(0,0,0,.25)}
  .mag.b{background:#c6dcf2;box-shadow:0 2px 0 #5a7a9a,0 3px 6px rgba(0,0,0,.25)}
  .mag.held{outline:3px solid #c8321e}
  .mag.fly{position:fixed;z-index:80;pointer-events:none}
  .times{display:flex;gap:10px;flex-wrap:wrap}
  .times .wls{background:#20303a;box-shadow:inset 0 0 0 1px #7a9aae}
  .times .wls small{color:#d8e8f2}
  .lightsrow{font-family:'Caveat',cursive;font-size:24px;color:#2f5a3a}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lastErr = '';

  (function () {        /* the stone wall */
    var s = '', r = KARST.rnd(7), x, y, w, row = 0;
    for (y = -200; y < 760; y += 46) {
      row++;
      for (x = -700 + (row % 2) * 40; x < 2300; x += w + 6) {
        w = 60 + r() * 70;
        s += '<rect x="' + x.toFixed(0) + '" y="' + (y + r() * 6).toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + (38 + r() * 6).toFixed(0) + '" rx="12" fill="' + ['#5c5046', '#544a40', '#62564a', '#4e443b'][Math.floor(r() * 4)] + '" stroke="#3a3028" stroke-width="3"/>';
      }
    }
    $('#stones').innerHTML = s;
  })();

  ER.init({
    theme: 'wild', story: 'karst', storyTitle: 'The Cave That Breathes', id: 'hut', no: 'I', title: 'The Club Hut',
    go: 'Go in',
    intro: [
      'Stennerdale, a Saturday at the end of October, ten to one. The club hut is an old stone barn at the bottom of Rowan Moor, with a stove, forty pairs of wet socks, and a telephone on the wall that is painted red.',
      'You joined the Stennerdale Caving Club three weeks ago. Today is your first real trip: Ripple Gill Cave, through a low, wet place called the Duck, to help Morven Tennant re-draw the survey of the Formation Chamber. You have been told, by four different people, to stay close.',

      for (i = 0; i < n; i++) o += '<div class="bslot' + (wide ? ' wide' : '') + '"></div>';
      o += '<div class="btray">' + MAGS[r].map(function (m) { return '<span class="mag dnd-item ' + (cls || '') + '" data-k="' + m[0] + '">' + m[1] + '</span>'; }).join('') + '</div></div></div>';
      return o;
    }
    s = '<div class="frame board"><h5>CALL-OUT BOARD <small>RIPPLE GILL CAVE &middot; SATURDAY</small></h5>' +
      row('who', 'Party', 4, false, '') + row('ent', 'Cave / entrance', 1, true, 'g') + row('route', 'Route', 1, true, 'g') + row('wait', 'If the way out floods, we wait at', 1, true, 'b') +
      '<div class="brow"><label>In &middot; out by &middot; call-out</label><div class="times" id="b-times"></div></div>' +
      '<div class="brow"><label>Lights</label><div class="lightsrow">3 each &#10003;</div></div></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="b-sign">Sign the board</button></div>';
    box.innerHTML = s; msgEl = box.querySelector('.pmsg');
    function msg(x) { msgEl.innerHTML = ER.gloss(x); }
    ER.$$('.brow[data-row]', box).forEach(function (r) {
      ER.dnd(r, { item: '.mag', slot: '.bslot', home: r.querySelector('.btray'), change: function () { KARST.sfx.magnet(); } });
    });
    var T0 = ER.flag('a-times') || { tin: [12, 0], tout: [12, 0], call: [12, 0] };
    [['tin', 'In'], ['tout', 'Out by'], ['call', 'Call-out']].forEach(function (t) {
      wl[t[0]] = KARST.wheels(box.querySelector('#b-times'), { label: t[1], vals: [KARST.HOURS, KARST.QUARTERS], sep: { 1: '.' }, start: T0[t[0]], change: function () {
        ER.flag('a-times', { tin: wl.tin.at(), tout: wl.tout.at(), call: wl.call.at() });
      } });
    });
    function got(r) { return ER.$$('.brow[data-row="' + r + '"] .bslot .mag', box).map(function (m) { return m.getAttribute('data-k'); }); }
    box.querySelector('#b-sign').addEventListener('click', function () {
      var who = got('who').sort().join(''), ent = got('ent')[0] || '', route = got('route')[0] || '', wait = got('wait')[0] || '',
        tin = wl.tin.get(), tout = wl.tout.get(), call = wl.call.get(), c = [who, ent, route, wait, tin, tout, call].join('|');
      if (got('who').length < 4) { lastErr = 'who'; KARST.sfx.no(); msg('Morven counts the magnets in the party row, and then the people in this hut who are putting on oversuits. &ldquo;Those two numbers ought to be the same.&rdquo;'); return; }
      if (!ER.check('who', who)) { lastErr = 'who'; KARST.sfx.no(); msg('Mrs Ullathorne taps the party row with her pen. &ldquo;If I&rsquo;m down the cave,&rdquo; she says, &ldquo;who lifts the red telephone?&rdquo;'); return; }
      if (!ent || !ER.check('ent', ent)) { lastErr = 'ent'; KARST.sfx.no(); msg(ent ? '&ldquo;Not that way,&rdquo; says Morven. &ldquo;We go in where the water comes out.&rdquo;' : 'Which cave, and which entrance? Put a magnet in that row.'); return; }
      if (!route || !ER.check('route', route)) { lastErr = 'route'; KARST.sfx.no(); msg(route ? '&ldquo;That&rsquo;s somebody else&rsquo;s trip,&rdquo; says Morven. &ldquo;Ours is the one I told you.&rdquo;' : 'The route row is empty.'); return; }
      if (!wait || !ER.check('wait', wait)) { lastErr = 'wait'; KARST.sfx.no(); msg(wait ? 'Mrs Ullathorne shakes her head. &ldquo;That&rsquo;s where the water comes up. Where did I say the rescue would look for you?&rdquo;' : 'Where will you wait if the way out floods? The handbook says it must be on the board.'); return; }
      if (!ER.check('tin', tin)) { lastErr = 'tin'; KARST.sfx.no(); msg('&ldquo;In,&rdquo; says Morven, &ldquo;is when we go underground. I told you when.&rdquo;'); return; }
      if (!ER.check('tout', tout)) { lastErr = 'tout'; KARST.sfx.no(); msg(ER.check('tout_4', tout) ? 'That is four hours after you go in. Morven said four and a <b>quarter</b>.' : ER.check('tout_duck', tout) ? 'That might be when you come back through the Duck; the board wants when you will be out.' : '&ldquo;Out by&rdquo; is the time you go in, plus the time underground. Do the sum again.'); return; }
      if (!ER.check('call', call)) {
        lastErr = 'call'; KARST.sfx.no();
        msg(ER.check('call_same', call) ? '&ldquo;If I ring at the very minute you&rsquo;re due,&rdquo; says Mrs Ullathorne, &ldquo;the Cave Rescue will meet you in the car park, taking your boots off. They will not thank me.&rdquo;' :
          ER.check('call_short', call) ? 'Not enough margin. Look at the handbook: it gives Ripple Gill Cave its own number of hours.' :
          ER.check('call_late', call) ? '&ldquo;Too late,&rdquo; says Mrs Ullathorne. &ldquo;If the Duck closed at six, you&rsquo;d be sitting in the dark for hours before anybody even started putting their boots on.&rdquo;' :
          'The call-out time comes after the &ldquo;out by&rdquo; time. The handbook says how long after.');
        return;
      }
      var ok = ER.exitOk([c]);
      if (!ok) { KARST.sfx.no(); msg('Something on the board is not what was said. Read it again, line by line.'); return; }
      nextFile = ER.exit([c], { wait: true }); ER.flag('a-file', nextFile); ER.flag('a-board', c); lastErr = '';
      KARST.sfx.pencil();
      KARST.mine('plan', 'The call-out board', '<p>Party: Morven, Vaughan, Tegan and me. Mrs Ullathorne is the surface contact.</p><p>Ripple Gill Cave, in by the Gill Entrance. Route: the Duck, the Formation Chamber, the Attic.</p><p>If the way out floods, we wait in <b>the Attic, by the Flood Box</b>.</p><p>In 13.45. Out by 18.00 (four and a quarter hours). <b>Call-out 20.00</b> (out by + 2 hours). Three lights each.</p>', true);
      msg('Mrs Ullathorne reads the board aloud, every line, the way she would read it down the red telephone. &ldquo;Call-out eight o&rsquo;clock,&rdquo; she says. &ldquo;Off you go.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'You pull on your oversuit, your wellies and your helmet. Morven checks every lamp herself, twice, and then puts her laminated survey in a plastic tube.',
          'At the door Mrs Ullathorne looks up from her crossword. &ldquo;Seven across,&rdquo; she says. &ldquo;Eight letters. &lsquo;What a cave does on a cold night.&rsquo; Begins with B.&rdquo; Nobody knows. You go out into the drizzle.'
        ], function () { busy = false; showGo(); });
      }, 2600);
    });
    ER.open('ov-lock', box);
    msg('Drag a magnet from each row&rsquo;s tray onto the line (or click a magnet, then the line), and set the three times.');
  }
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The board is filled in, in your neatest writing. Call-out at eight.'); return; }
    if (!told.mor || !told.myf) { ER.say('&ldquo;You can&rsquo;t fill it in,&rdquo; says Morven, &ldquo;until you know the plan. Ask me. And ask Myfanwy: she&rsquo;s the one who reads it.&rdquo;'); return; }
    if (!told.book) { ER.say('There is a green handbook on a nail beside the board. The rules for the board are in it.'); return; }
    if (!told.lights) { ER.say('&ldquo;Lights first,&rdquo; says Tegan. &ldquo;Three each. The board says so, at the bottom.&rdquo;'); return; }
    openBoard();
  });
})();
</script>
</body>
</html>
