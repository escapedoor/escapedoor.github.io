      'The Attic is a round tube in the rock, as wide as a lane, with a floor of soft dry sand. It is old: the water that made it left long ago and went down to work at the lower passages. The walls are covered with shallow scoops, like the inside of a spoon.',
      'It is dry. It is quiet. After the roar of the Duck Pool, the silence is so loud you can hear Tegan&rsquo;s survival bag crackle when she breathes.',

    ], function () { busy = false; paint(); });
  }

  /* ---------- the Flood Box, Mrs Ullathorne's note, the candle ---------- */
  var MU = '<h4>The Attic breathes &middot; M.U. 1979</h4><div class="two"><div>' +
    '<p>A cave keeps nearly the same temperature all year round: here about 8 &deg;C, the average of the weather above it. Warm air is lighter than cold air, so when the air inside and the air outside are at different temperatures, the air moves.</p>' +
    '<p>On a <b>cold night</b> the cave air is the warmer: it rises and pours out of the highest entrance, and cold air is drawn in at the lower ones. On a <b>hot summer day</b> it is the other way round: cold, heavy cave air sinks and flows out of the lowest entrance.</p>' +
    '<p>So a steady <b>draught</b> means there is another way out, and its direction tells you which way is up and out. Hold a candle flame still in the passage: it leans the way the air is going.</p>' +
    '<p>In winter the Attic draughts towards the Wind Hole. If the draught stops, the <b>Trough</b> has sumped. It fills from below with the same water as the Duck Pool, at the same height.</p></div>' +
    '<div><svg viewBox="0 0 260 300"><rect width="260" height="300" fill="#fbfaf3"/><path d="M0 120L60 110L120 70L200 40L260 30" stroke="#2b2a2e" stroke-width="2.400" fill="none"/>' +
    '<path d="M20 116q0 40 40 50q60 10 90 -30q20 -40 54 -90" stroke="#8a7050" stroke-width="16" fill="none" stroke-linecap="round" opacity=".55"/>' +

    '<g font-family="Handlee,cursive" font-size="14" fill="#2b2a2e"><text x="100" y="200">cave 8 &deg;C</text><text x="10" y="40">night 1 &deg;C</text><text x="150" y="16">steam</text><text x="4" y="190">cold air in, low</text><text x="150" y="70">warm air out, high</text>' +

        'You pull the shelter over both of you and sit on its edges. In five minutes it is warm inside, from nothing but the two of you breathing. Tegan eats a square of Christmas chocolate and closes her eyes. &ldquo;Mrs U,&rdquo; she says, &ldquo;I love you.&rdquo;'

      KARST.terms(['draught']);

  $('#candle').addEventListener('click', function () {

      12: [530, 132, 13.5, null, 360, 'm'], 13: [580, 126, 12.5, null, 390, 'm'], 14: [630, 122, 12, null, 430, 'm', 'Flood Box'], 18: [700, 116, 1.6, 1.9, 500, 'm', 'the Trough'],
      19: [760, 104, 8, null, 560, 'm'], 20: [810, 96, 14, null, 610, 'm'], 21: [860, 86, 18, null, 660, 'm', 'Three Ways'],
      15: [640, 152, 11, null, 735, 'c'], 16: [540, 206, 5, null, 765, 'c'], 17: [300, 250, -1.0, -0.4, 800, 'c', 'Sandy Crawl'],
      31: [610, 86, 6, null, 860, 'b'], 32: [700, 62, -0.5, 0.2, 895, 'b'], 33: [780, 70, 6, null, 930, 'b', 'Bypass']
    };
    var E = [[1, 3], [3, 4], [4, 5], [5, 6], [6, 9], [9, 10], [10, 11], [11, 12], [12, 13], [13, 14], [14, 18], [18, 19], [19, 20], [20, 21], [14, 15], [15, 16], [16, 17], [17, 4], [13, 31], [31, 32], [32, 33], [33, 20]];
    var box = ER.el('div', 'bx'), svg, msgEl, go, undo, wlo, wback, wdry, s = '', i, k, route = ER.flag('e-route') ? ER.flag('e-route').split('-').map(Number) : [14], sel = null, part = ER.flag('e-part') || 0;
    function SY(h) { return 468 - h * 5.8; }
    function PY(y) { return y * 0.84 - 4; }

  function leaveNote() {
    var N = '<h4>Left on the lid of the Flood Box</h4><p>SUNDAY 06.30. TEGAN NUTTALL AND THE NEW MEMBER. BOTH WELL, BOTH WARM. ATE THE CHOCOLATE (SORRY, MRS U).</p><p>DUCK GAUGE 2.20 AT 00.30, FALLING 10 CM AN HOUR. TROUGH DRY AT 06.30. DRAUGHT TOWARDS THE WIND HOLE.</p><p>GONE THROUGH THE TROUGH AND UP THE WIND HOLE SERIES TO THE WIND HOLE.</p>';
    ER.read({ html: N, cls: 'mine', clue: { id: 'note', title: 'The note on the Flood Box', kind: 'Left for the rescue' }, done: function () {
      if (!tell('note')) return;
      busy = true; setStage(5);
      ER.narrate([
        'You weigh the note down with the jam jar of matches, on top of the blue lid, where nobody could miss it. Then you go down into the Trough.',
        'It is a short, wet crawl on your elbows, with the roof a hand&rsquo;s width over your helmet and the air going past your ears all the time, towards the Wind Hole. Up the other side. The passage climbs, and climbs.',
        'A quarter to seven. You come out into a junction where three passages meet: Three Ways. Your candle is in your hand.'
      ], function () { busy = false; paint(); openThree(); });
    } });
  }

  /* ---------- Three Ways ---------- */
  function openThree() {
    var box = ER.el('div', 'bx'), svg, pk, msgEl, at = ER.flag('e-at') || null;
    /* Three Ways seen from above. The mouths of the three passages, and what the flame does in each tonight (drawn, never said):
       the angle it points in, or null for a flame that stands straight up */
    var POS = { trough: [370, 274], rift: [650, 172], choke: [660, 288] }, LEAN = { trough: -19, rift: -21, choke: null };
    box.innerHTML = '<div class="frame"><svg class="cd" viewBox="0 0 1000 420"><defs><radialGradient id="tglow"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="1000" height="420" fill="#1e150c"/>' +
      '<g stroke-linecap="round" fill="none"><path d="M40 392L500 232M500 232L960 52M500 232L860 336" stroke="#0e0905" stroke-width="122"/><path d="M40 392L500 232M500 232L960 52M500 232L860 336" stroke="#6a5438" stroke-width="96"/>' +
      '<path d="M40 392L500 232M500 232L960 52M500 232L860 336" stroke="#8a7050" stroke-width="40" opacity=".5"/></g><circle cx="500" cy="232" r="70" fill="#7a6244"/>' +
      '<g fill="#3a2c1e"><circle cx="850" cy="330" r="30"/><circle cx="890" cy="356" r="22"/><circle cx="820" cy="350" r="18"/><circle cx="880" cy="310" r="16"/></g>' +
      '<text class="cdL" x="60" y="300">back to the Trough</text><text class="cdL" x="60" y="320" font-size="14">(the way you came)</text><text class="cdL" x="790" y="24">the Rift</text><text class="cdL" x="760" y="404">Choke Passage</text>' +
      '<text class="cdS" x="20" y="24">THREE WAYS, SEEN FROM ABOVE</text><text class="cdS" x="720" y="276" id="t-voice">A MURMUR, LIKE PEOPLE TALKING</text>' +
      '<g id="t-cand" class="tool"><circle r="120" fill="url(#tglow)"/><circle r="14" fill="#f4ecd8" stroke="#c8b898" stroke-width="2"/>' +
      '<g id="t-fl"><path d="M0 0q-9 -8 -5 -22q5 -16 5 -40q4 22 6 36q3 18 -6 26z" fill="#ffb24a"/><path d="M0 -4q-4 -4 -2 -12q2 -8 2 -18q2 12 3 18q1 8 -3 12z" fill="#fff2c8"/></g>' +
      '<g id="t-still"><circle r="8" fill="#ffb24a"/><circle r="4" fill="#fff2c8"/></g><circle r="40" fill="#fff" opacity="0"/></g></svg></div>' +
      '<div class="bx-foot"><p class="pmsg"></p></div><div class="bx-foot"><span id="t-pk"></span><button type="button" class="btn" id="t-go">This is the way out</button></div>';
    svg = box.querySelector('svg'); msgEl = box.querySelector('.pmsg');
    function msg(x) { msgEl.innerHTML = ER.gloss(x); }
    pk = KARST.picks(box.querySelector('#t-pk'), [['trough', 'Back to the Trough'], ['rift', 'The Rift'], ['choke', 'Choke Passage']], { start: null });
    var cur = at ? POS[at].slice() : [500, 232];
    function draw() {
      var lean = at ? LEAN[at] : -20;
      svg.querySelector('#t-cand').setAttribute('transform', 'translate(' + cur[0].toFixed(0) + ' ' + cur[1].toFixed(0) + ')');
      svg.querySelector('#t-fl').style.display = lean == null ? 'none' : '';
      svg.querySelector('#t-still').style.display = lean == null ? '' : 'none';
      if (lean != null) svg.querySelector('#t-fl').setAttribute('transform', 'rotate(' + (lean + 90) + ')');
      svg.setAttribute('data-at', at || ''); svg.setAttribute('data-lean', lean == null ? 'still' : String(lean));
    }
    ER.drag(svg.querySelector('#t-cand'), {
      move: function (e) { var q = ER.pt(svg, e); cur = [KARST.clamp(q.x, 60, 940), KARST.clamp(q.y, 40, 400)]; at = null; draw(); },
      end: function () {
        var best = null, bd = 1e9; Object.keys(POS).forEach(function (k) { var d = Math.pow(POS[k][0] - cur[0], 2) + Math.pow(POS[k][1] - cur[1], 2); if (d < bd) { bd = d; best = k; } });
        at = best; cur = POS[best].slice(); ER.flag('e-at', at); draw(); KARST.sfx.notch();
        msg({ trough: 'In the mouth of the passage you came by, the flame leans <b>out of it</b>, towards the junction: the air is coming from there.', rift: 'In the mouth of the Rift, the flame leans <b>into it</b>, along the passage, and stays leaning: the air is going up there.', choke: 'In the mouth of Choke Passage the flame stands <b>straight up</b>. From somewhere in the boulders comes the murmur of voices. &ldquo;People!&rdquo; says Tegan. &ldquo;Is it them?&rdquo;' }[at]);
      }
    });
    box.querySelector('#t-go').addEventListener('click', function () {
      var v = pk.get(), why = ER.flag('e-why'), lo = ER.flag('e-lo'), tm = ER.flag('e-times') || '|', c;
      if (!v) { msg('Choose a passage first.'); return; }
      c = ER.flag('e-route') + '|' + lo + '|' + tm + '|' + why + '|' + v;
      if (ER.exitOk([c])) {
        nextFile = ER.exit([c], { wait: true }); ER.flag('e-file', nextFile); stage = 6; ER.flag('e-stage', 6);
        KARST.mine('three', 'Three Ways', '<p>At Three Ways the candle leaned out of the Trough passage (the air came from there), into the Rift (the air went up there), and stood straight in Choke Passage: no draught. The voices in Choke Passage were water.</p><p>The way the air goes is the way out: <b>the Rift</b>.</p>', true);
        msg('&ldquo;The voices are water,&rdquo; says Tegan, a little sadly. &ldquo;The air knows the way.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            'You go up the Rift. It is tall and narrow, and the cold air goes past you all the way, getting colder, smelling of grass and frost. Ten minutes, fifteen, twenty, climbing.',
            'Then, high above, there is a grey square that is not rock. Sky. And under it, bolted to the wall, the iron ladder: rusty, checked every spring, and the most beautiful thing you have ever seen.',
            'Around you, the warm breath of the cave rises past you up the shaft and out into the morning.'
          ], function () { busy = false; showGo(); paint(); });
        }, 2400);
        return;
      }
      KARST.sfx.no();
      msg(ER.check('way_voices', v) ? 'Listen to the voices: they never stop for breath, and they never answer each other. And look at the flame in Choke Passage: no draught at all. No draught, no way out.' :
        ER.check('way_back', v) ? 'That is where you came from: the air comes out of it, from the lower cave. Which passage is the air going into?' :
        'Hold the candle in each mouth. The way out is the way the air is going.');
    });
    draw();
    ER.open('ov-lock', box);
    msg('Drag the candle into the mouth of each passage, hold it still, and watch the flame.');
    cand = { isOpen: function () { return !!box.parentNode; }, hint: function () { return ['three', [
      'Mrs Ullathorne&rsquo;s note: a steady draught means another way out, and on a cold night the air goes out at the top. Drag the candle to each of the three passages.',
      'The flame leans the way the air is going. In which passage does it lean away from you, into the passage? The murmur in Choke Passage is the same kind of voices as in the Formation Chamber.'
    ]]; } };
  }
})();
</script>
</body>
</html>
