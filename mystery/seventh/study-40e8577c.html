<script>
(function () {
  var $ = ER.$, busy = false, solved = false;
  var read = {}, marks = {};               /* read: rules, augusta, ferdy */

  (function () {
    var s = '', x, i, cols = ['#5a3a26', '#2f4a3a', '#6a1e22', '#3a3a5a', '#7a5a22'], y;
    for (x = -980; x < 2600; x += 160) s += '<rect x="' + (x + 12) + '" y="592" width="136" height="132"/>';
    $('#dado').innerHTML = s; s = '';
    [170, 260, 490, 580].forEach(function (y0, r) {
      x = 498; i = r * 5;
      while (x < 650) { var w = 13 + (i * 5) % 9, h = 66 + (i * 7) % 18; if (r === 2) { x = 700; break; } s += '<rect x="' + x + '" y="' + (y0 + 84 - h) + '" width="' + w + '" height="' + h + '" fill="' + cols[i % 5] + '"/>'; x += w + 1; i++; }
      s += '<rect x="490" y="' + (y0 + 84) + '" width="170" height="8" fill="#3a2416"/>';
    });
    $('#spines').innerHTML = s;
    $('#edBody').innerHTML = '<ellipse cx="1255" cy="742" rx="80" ry="9" fill="#000" opacity=".25"/><path d="M1180 500H1330L1318 740H1192Z" fill="#2f4a3a"/><path d="M1206 520H1304L1296 740H1214Z" fill="#3a2a2a"/>';
  })();
  function drawBox(open) {
    $('#boxArt').innerHTML = open ? SV.box({ x: 880, y: 534, s: 0.66, open: true }) + SV.lid(780, 556, 0.42, true).replace('<g ', '<g opacity=".97" ') : SV.box({ x: 880, y: 534, s: 0.66, flip: true });
  }

  ER.init({
    theme: 'mystery', story: 'seventh', storyTitle: 'The Seventh Book', id: 'study', no: 'II', title: 'The Study',
    go: 'Open the door',
    intro: [
      'You laid the table in the only way that kept everybody happy: Mrs Cleave at Aunt Edwina’s right hand with Ms Ahn beside her, Mr Earle facing the door, Ferdy at the foot by the fire, and Miss Caird and Mr Boyd together on the door side, with the empty place beside your great-aunt.',
      'Sunday, half past seven. Aunt Edwina unties the ribbon from your wrist. “My own knot,” she says. “Nobody else in this house can tie it.”',
      'Then she turns the key in the study door.'
    ],
    exit: {"next":"landing","w":{"d3f884bb":"8a17a1a4"}}, tags: {"a1":["34330011"],"a2":["62547112"],"a3":["4a7b2cdf"],"a4":["58cb51e3"],"a5":["7fa06371"],"a6":["5ceac0aa"],"a7":["9e8bcf73"],"a8":["4bc02a09"],"a9":["6b7091b9"],"f1":["6a24ca88"],"f2":["ad5e910e"],"f3":["d5928610"],"f4":["e53c5633"],"f5":["c66f247e"],"f6":["35f36309"],"f7":["51918187"],"f8":["6128f27f"],"f9":["1386aeb4"]},
    hints: hints,
    onBegin: begin
  });
  read = ER.flag('st-read') || {}; marks = ER.flag('st-marks') || {}; drawBox(!!ER.flag('st-open'));

  function readAll() { return read.rules && read.augusta && read.ferdy; }
  function pips() { ER.pips((read.rules ? 1 : 0) + (read.augusta ? 1 : 0) + (read.ferdy ? 1 : 0) + (solved ? 1 : 0), 4); }
  function hints() {
    if (solved) return null;
    if (!readAll()) {
      var left = [];
      if (!read.rules) left.push('the framed card over the fireplace');
      if (!read.augusta) left.push('Mrs Cleave’s statement (the lilac paper on the desk)');
      if (!read.ferdy) left.push('Ferdy’s statement (the squared paper on the desk)');
      return ['read', [
        'There are three things to read first: ' + left.join(', ') + '.',
        'When you have read them, click the pot of pencils on the desk.'
      ]];
    }
    return ['marks', [
      'Do one sentence at a time. Ask: did the writer see it or do it, did they hear it or were they told it, or did they work it out? Things a person did themselves count as seen.',
      'Look for the words that give an assumption away: must, so, because. A sentence that begins “Ferdy tells me” or “Aunt Edwina says” is heard, even if it is true.',
      'Each statement has exactly two assumptions, and they come where the writer stops reporting and starts deciding: who it was, whose fault it was, who could never do such a thing. Mrs Cleave’s spectacles and her book are something she did and felt with her own hands.'
    ]];
  }
  function begin() {
    pips();
    if (ER.flag('st-open')) { ER.say('The box is still empty. The statements are on the desk.'); showStatements(); return; }
    ER.narrate([
      'The study is cold and smells of old paper. Everything is where it was at eight minutes past ten last night.',
      'The grey box is on the desk, where you put it. Aunt Edwina lifts the lid.',
      'The box is empty.',
      'Behind you, on the landing, six people in dressing gowns begin to talk at once.',
      '“Nobody,” says Aunt Edwina, “goes downstairs until I have it in writing. Augusta, Ferdy: you first. Pen, paper, now.”'
    ], function () {
      ER.flag('st-open', 1); drawBox(true); ER.sfx.paper();
      setTimeout(function () { ER.say('A quarter of an hour later two statements are lying on the desk.'); showStatements(); }, 600);
    });
  }
  function showStatements() { $('#stAug').style.display = ''; $('#stFer').style.display = ''; }

  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) { if (busy || ER.isOpen()) return; if (word) ER.wordAt(e.clientX, e.clientY, word); if (line) ER.say(line); });
  }
  thing('#catch', 'catch', 'The window catch is across, as it was last night. It can only be turned from inside the room.');
  thing('#leads', 'leads', 'Below the window is the flat lead roof of the garden room, grey and wet with dew. A line of small round prints crosses it. “Comma,” says Aunt Edwina. “She walks there every night. She thinks it is a lawn.”');
  thing('#curtains', null, 'Nobody behind the curtains. Aunt Edwina looks again anyway.');
  thing('#grate', 'grate', 'Swept and cold. Nobody has lit a fire in here since August, and there is no ash at all.');
  thing('#shelf', null, 'Six first editions of Comfrey, in order, and a space at the end of the shelf for the seventh.');
  thing('#map', null, 'Miss Caird’s map from book three: a river, a wood, and a fox’s path home.');
  thing('#door', 'lock', 'A big old lock. There is not a scratch round the keyhole, inside or out. The key that opened it this morning spent the night on your wrist.');
  thing('#boxHot', null, 'Empty. The lid lies beside it with its label: COMFREY GOES HOME, A. Cleave, 412 pages. Everything is as it is in your photograph.');

  var RULES = SV.page(1, 'Saw, heard, assumed',
    '<p>My grandfather wrote these rules in 1926 for the people who read manuscripts for the firm. They work just as well for witnesses. Keep three things apart.</p>' +
    '<p class="ex"><b>Saw</b>: what happened in front of your own eyes, or what you did yourself. What you touched or lifted counts as seen.</p>' +
    '<p class="ex"><b>Heard</b>: what reached your ears (a voice, a step, a door) and anything somebody told you. Say who told you.</p>' +
    '<p class="ex"><b>Assumed</b>: everything you worked out, guessed or took for granted, however sure you feel. “It must have been Ferdy” is an assumption, even when it is right.</p>' +
    '<p>Words that give an assumption away: <i>must, so, because, obviously, of course, I expect</i>.</p>' +
    '<p>A good reader never lets an assumption pretend to be something she saw.</p>');

  var AUG = [
    ['a1', 'I went to bed at ten o’clock, and I did not leave my room until Edwina banged on my door this morning.'],
    ['a2', 'I heard Edwina lock the study at about ten past ten; that lock sounds like a prison door.'],
    ['a3', 'Before midnight somebody went down the front stairs, and came up again perhaps twenty minutes later.'],
    ['a4', 'It was a guest, because everybody in the family steps over the fourth stair, and this person trod on it both ways.'],
    ['a5', 'At half past eight last night I went to the library to fetch my spectacles, and I lifted my book.'],
    ['a6', 'It was as heavy as it was on the train, when I carried it on my knees for three hours.'],
    ['a7', 'This morning I looked into the box myself, and it was empty.'],
    ['a8', 'Ferdy tells me the garden room key was missing in the night.'],
    ['a9', 'Benedict has wanted my book in London for a year, so you need look no further.']
  ];
  var FER = [
    ['f1', 'I went to bed at a quarter past ten with a spreadsheet, which is the most exciting thing I have ever written in a statement.'],
    ['f2', 'At twenty past one I went down the back stairs for a glass of milk.'],
    ['f3', 'I took the back door key off the board, let Comma in from the yard and hung the key up again.'],
    ['f4', 'The hook for the garden room key was empty.'],
    ['f5', 'Aunt Edwina must have forgotten to hang it up.'],
    ['f6', 'I was back in bed by half past one.'],
    ['f7', 'Aunt Edwina says the spare key to the study has been in the bank since 1998.'],
    ['f8', 'I have not been inside the study since August.'],
    ['f9', 'Nobody in this family would steal from the firm: it is the only thing we own that makes money.']
  ];
  function stmtHtml(head, list, sig) { return '<h4>' + head + '</h4><p>' + list.map(function (s) { return s[1]; }).join(' ') + '</p><p class="sig">' + sig + '</p>'; }

  function doRead(k, o) {
    ER.read({ html: o.html, cls: o.cls, clue: o.clue, done: function () {
      if (!read[k]) { read[k] = 1; ER.flag('st-read', read); pips(); if (readAll()) ER.say('Now the pencils. Mark every sentence.'); }
    } });
  }
  $('#rules').addEventListener('click', function () { if (busy || ER.isOpen()) return; doRead('rules', { html: RULES, cls: 'npage', clue: { id: 'page1', title: 'Page 1 · Saw, heard, assumed', kind: 'Notebook' } }); });
  $('#stAug').addEventListener('click', function () { if (busy || ER.isOpen()) return; doRead('augusta', { html: stmtHtml('Augusta Cleave · written on the landing, under protest', AUG, 'A. C.'), cls: 'st st-augusta', clue: { id: 'st-augusta', title: 'Statement of Augusta Cleave', kind: 'Statement' } }); });
  $('#stFer').addEventListener('click', function () { if (busy || ER.isOpen()) return; doRead('ferdy', { html: stmtHtml('F. Dabney · Sunday · 7.45 a.m.', FER, 'F. D.'), cls: 'st st-ferdy', clue: { id: 'st-ferdy', title: 'Statement of Ferdy Dabney', kind: 'Statement' } }); });
  $('#edwina').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: 'Edwina Dabney', role: CAST.edwina.role, face: FACE('edwina'), clue: { id: 'st-edwina', title: 'Aunt Edwina, in the study', kind: 'Said' }, lines: [
      'Look at it. Not a scratch on the lock, the window fastened, the key on your wrist all night, and nothing in the box.',
      { q: 'What do we do now?', a: 'What my grandfather did with manuscripts. Read every word, and keep three things apart: what a person saw, what a person heard, and what a person only thinks. His rules are over the fireplace.' },
      { q: 'Shouldn’t we call the police?', a: 'On the firm’s hundredth birthday, with half of London waiting to hear about this book? Not yet. Give me until Benedict’s taxi comes at twenty to twelve.' },
      { q: 'Could somebody have climbed in?', a: 'Through a window that was fastened on the inside? Only Comma climbs on the leads, and she has no thumbs.' },
      'Augusta and Ferdy have written theirs. Read them both. Then take a pencil and mark every sentence: blue for seen, green for heard, red for assumed.'
    ] });
  });
  $('#pens').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!ER.flag('st-open')) return;
    if (!readAll()) { ER.say('“Read first, mark afterwards,” says Aunt Edwina. “That is the whole of publishing.”'); return; }
    openMarks();
  });

  function openMarks() {
    var box = ER.el('div', 'mkbox');
    box.innerHTML = '<div><h5>Three pencils</h5><p class="say">Choose a pencil, then click a sentence. Click it again with the same pencil to rub it out.</p><div class="mk-host-p"></div></div><div class="mk-host"></div>' +
      '<div class="mk-row"><div class="mk-msg"></div><button type="button" class="btn" id="mkGo">Give them to Aunt Edwina</button></div>';
    var host = box.querySelector('.mk-host'), msg = box.querySelector('.mk-msg');
    var w = SV.marks(host, [
      { cls: 'sh-augusta', head: 'Augusta Cleave', sents: AUG },
      { cls: 'sh-ferdy', head: 'F. Dabney', sents: FER }
    ], { state: marks, pensHost: box.querySelector('.mk-host-p'), locked: function () { return solved; }, change: function (s) { marks = s; ER.flag('st-marks', s); msg.textContent = ''; } });
    box.querySelector('#mkGo').addEventListener('click', function () {
      if (solved) return;
      var all = AUG.concat(FER), empty = all.filter(function (s) { return !marks[s[0]]; }).length;
      if (empty) { msg.textContent = empty === 1 ? 'One sentence has no mark yet.' : empty + ' sentences have no mark yet.'; ER.shake(host); return; }
      var code = 'a:' + AUG.map(function (s) { return marks[s[0]].charAt(0); }).join('') + '|f:' + FER.map(function (s) { return marks[s[0]].charAt(0); }).join('');
      var file = ER.exit([code.toUpperCase()], { wait: true });
      if (file) {
        solved = true; busy = true; pips();
        msg.style.color = '#c8f0c0'; msg.textContent = 'Aunt Edwina reads your pencil marks without a word, and then reads them again.';
        setTimeout(function () {
          ER.closeAll();
          ER.narrate([
            '“Two assumptions each,” says Aunt Edwina. “Augusta has decided it was Benedict. Ferdy has decided it was my fault, and that no Dabney could do such a thing. Neither of them saw anybody do anything.”',
            '“But they heard things. Somebody on the front stairs before midnight. A key gone from its hook by twenty past one.” She takes her glasses off. “Somebody in this house was walking about last night.”',
            '“Fenella is on the landing,” she says. “She has been waiting to tell somebody something since seven o’clock. She has the face of a person who has done nothing wrong and is sure she will be blamed for it.”'
          ], function () { ER.leave(file); });
        }, 1600);
        return;
      }
      var wrong = 0; all.forEach(function (s) { if (!ER.check(s[0], marks[s[0]])) wrong++; });
      ER.sfx.no();
      msg.textContent = wrong === 1 ? '“One mark is wrong,” says Aunt Edwina, and gives you the pencils back.' : '“' + wrong + ' marks are wrong,” says Aunt Edwina, and gives you the pencils back.';
    });
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
