    '<p>Breakfast is at eight, in the dining room.</p>' +
    '<p>There is no telephone signal anywhere in the house. If you must, stand by the birdbath at the east end of the terrace, where there is sometimes one bar. The telephone in the library is yours to use; please write your call in the book beside it.</p>' +

  var EUN = '<h4>Eunji Ahn · the Rose Room · sheet 1 of 2</h4>' +
    '<p>Mrs Dabney asked us to write from ten o’clock. I think the evening before ten may also matter, so I have written it too.</p>' +
    '<p>At dinner I sat between Mrs Cleave and Mr Earle, facing the door to the hall. At about ten past eight Mr Earle said that he was going to telephone his wife from the library. He came back at about twenty-five past. At half past eight Mrs Cleave went to fetch her spectacles, and she was back in four or five minutes with them on her nose. At twenty to nine Mr Boyd stood up and said that he was going out to his car, because he thought he had left its lights on. He came back after six or seven minutes, and his hands were cold. At a quarter past nine Mr Dabney went for the port.</p>' +
    '<p>We had coffee in the garden room. At ten to ten Miss Caird went to fetch her sketchbook from the library and came back a minute later with it under her arm, and nothing else. She drew the cat until we went up to bed.</p>' +
    '<h4 style="margin-top:22px">Sheet 2 of 2</h4>' +
    '<p>In the night I could not sleep, because in Seoul it was already morning. My window was open. At twenty to twelve, by my phone, I heard Mr Earle’s voice below my window, near the birdbath. I heard only his voice, with pauses between.</p>' +
    '<p>He said that he had it in his hands at that moment, and that he would bring it to London the next day. He said that nobody in this house knew, and that he would like to keep it that way until it was signed.</p>' +

    ['b2', 'I read for a quarter of an hour (the new Excelsior catalogue, which is thinner than it used to be).'],
    ['b3', 'I turned off my light at twenty-five past ten, and I did not leave my room until a quarter past seven this morning.'],
    ['b4', 'I saw nothing and I heard nothing.'],
    ['b5', 'I am sorry not to be more useful.'],
    ['b6', 'Augusta keeps no copy, you know. She never has.'],
    ['b7', 'My taxi comes at twenty to twelve, for the ten past twelve from Dunstow.']
  ];
  function benHtml() { return '<h4>Benedict Earle · the Oak Room</h4><p>' + BEN.map(function (b) { return b[1]; }).join(' ') + '</p><p class="sig">B. E.</p>'; }

  $('#letter').addEventListener('click', function () { if (busy || ER.isOpen()) return; ER.read({ html: LETTER, cls: 'letter2', clue: { id: 'welcome', title: 'Welcome to Copperwood', kind: 'Letter' }, done: function () { mark('letter'); } }); });
  $('#book').addEventListener('click', function () { if (busy || ER.isOpen()) return; ER.read({ html: PAGE3, cls: 'npage', clue: { id: 'page3', title: 'Page 3 · What people said', kind: 'Notebook' }, done: function () { mark('page'); } }); });
  $('#benedict').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.benedict.who, role: CAST.benedict.role, face: FACE('benedict'), clue: { id: 'ga-benedict', title: 'Benedict Earle, in the garden room', kind: 'Said' }, lines: [
      'You will want my statement. I wrote it before breakfast. I find it helps to get these things over with.',
      { q: 'Did you go outside last night?', a: 'Outside? It was October. I was asleep by eleven, like a sensible man.' },
      { q: 'Is there a telephone signal in the house?', a: 'None at all. It is like living in 1950, which I suspect is the point.' },
      { q: 'Why are you wearing your coat?', a: 'My taxi comes at twenty to twelve. I would not miss that train for anything. Not even for this.' },
      'I very much hope the book turns up. For everybody’s sake.'
    ], done: function (ok) {
      if (ok && !got.benedict) ER.read({ html: benHtml(), cls: 'st st-benedict', clue: { id: 'st-benedict', title: 'Statement of Benedict Earle', kind: 'Statement' }, done: function () { mark('benedict'); } });
    } });
  });
  $('#eunji').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.eunji.who, role: CAST.eunji.role, face: FACE('eunji'), clue: { id: 'ga-eunji', title: 'Eunji Ahn, in the garden room', kind: 'Said' }, lines: [
      'I have written everything I remember, in order. I hope it is not too long. I am a translator: we do not like to leave anything out.',
      { q: 'Are you sure it was Mr Earle’s voice?', a: 'I sat next to it for two hours at dinner. I am sure.' },
      { q: 'Who was he talking to?', a: 'I could hear only him. He spoke, and stopped, and spoke again, the way people do on the telephone.' },
      { q: 'Why didn’t you say so at breakfast?', a: 'Because nobody asked me. And because, in my experience, the person who speaks first at breakfast is the person everybody looks at.' },
      'Here is my statement, and my photograph.'
    ], done: function (ok) {
      if (ok && !got.eunji) ER.read({ html: EUN, cls: 'st st-eunji', clue: { id: 'st-eunji', title: 'Statement of Eunji Ahn', kind: 'Statement' }, done: function () {
        ER.read({ html: SV.photoDoc('eunji'), cls: 'photo', clue: { id: 'photo-eunji', title: 'Ms Ahn’s photograph, 6.41 pm', kind: 'Photograph' }, done: function () { mark('eunji'); } });
      } });
    } });
  });
  $('#pad').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!ready()) { ER.say('The message pad is blank. Collect what you need first: two statements, a letter and a page of your notebook.'); return; }
    openPad();
  });

  /* ---------- the lock: the call at twenty to twelve, and the sentence that is not true ---------- */
  var TOK = [['study', 'in the study'], ['libphone', 'at the library telephone'], ['birdbath', 'outside, by the birdbath'], ['oak', 'in the Oak Room'],
    ['eunji', 'Ms Ahn'], ['augusta', 'Mrs Cleave'], ['phone', 'somebody outside the house, on his phone'], ['self', 'nobody: he was reading aloud'],
    ['sat', 'on Saturday night'], ['sunday', 'on Sunday (today), on the 12.10'], ['monday', 'on Monday'], ['signed', 'once it is signed, next month']];
  var PRO = [['call', 'a telephone call that nobody in the house was to know about'], ['ms', 'the manuscript, which he has hidden'], ['fenella', 'Miss Caird, who was also up'], ['wife', 'a call to his wife']];
  function openPad() {
    var st = ER.flag('ga-pad') || {};
    var box = ER.el('div', 'ms');
    box.innerHTML = '<h5>The call at twenty to twelve</h5>' +
      '<div><div class="pad"><p>Time: 11.40 p.m. Saturday (by Ms Ahn’s phone)</p><p>Mr Earle was <span class="blank" data-b="where"></span></p><p>speaking to <span class="blank" data-b="to"></span></p><p>He means to take “it” to London <span class="blank" data-b="when"></span></p></div>' +
      '<div class="toks"></div></div>' +
      '<div class="bs off"><h6>Mr Earle’s statement · click the sentence that cannot be true</h6><p>' + BEN.map(function (b) { return '<span class="s" data-s="' + b[0] + '">' + ER.gloss(b[1]) + '</span>'; }).join(' ') + '</p>' +
      '<div class="bs-row"><button type="button" class="stp" data-k="lie">A lie</button><button type="button" class="stp mis" data-k="mistake">An honest mistake</button></div>' +
      '<div class="bs-row">' + PRO.map(function (p) { return '<button type="button" class="pro" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="ms-row"><div class="ms-msg"></div><button type="button" class="btn" id="msGo">Check the message</button></div>';
    var toks = box.querySelector('.toks'), msg = box.querySelector('.ms-msg'), bs = box.querySelector('.bs'), go = box.querySelector('#msGo');
    TOK.forEach(function (t) {
      var n = ER.el('span', 'tok dnd-item', t[1]); n.setAttribute('data-t', t[0]);
      var at = null; ['where', 'to', 'when'].forEach(function (b) { if (st[b] === t[0]) at = box.querySelector('[data-b=' + b + ']'); });
      (at || toks).appendChild(n);
    });
    function readPad() { ['where', 'to', 'when'].forEach(function (b) { var t = box.querySelector('[data-b=' + b + '] .tok'); st[b] = t ? t.getAttribute('data-t') : null; }); ER.flag('ga-pad', st); }
    ER.dnd(box.querySelector('.pad').parentNode, { item: '.tok', slot: '.blank', home: toks, lock: function () { return stage > 0; }, change: function () { readPad(); msg.textContent = ''; } });
    function paintB() {
      ER.$$('.s', bs).forEach(function (s) { s.classList.toggle('on', s.getAttribute('data-s') === st.s); });
      ER.$$('.stp', bs).forEach(function (s) { s.classList.toggle('on', s.getAttribute('data-k') === st.k); });
      ER.$$('.pro', bs).forEach(function (s) { s.classList.toggle('on', s.getAttribute('data-p') === st.p); });
      ER.flag('ga-pad', st);
    }
    bs.addEventListener('click', function (e) {
      if (solved || !e.target.closest) return;
      var s = e.target.closest('.s'), k = e.target.closest('.stp'), p = e.target.closest('.pro');
      if (s) { st.s = s.getAttribute('data-s'); ER.sfx.paper(); }
      else if (k) { st.k = k.getAttribute('data-k'); ER.sfx.clunk(); }
      else if (p) { st.p = p.getAttribute('data-p'); ER.sfx.paper(); }
      else return;
      msg.textContent = ''; paintB();
    });
    function openB() { stage = 1; bs.classList.remove('off'); go.textContent = 'Tell Aunt Edwina'; paintB(); }
    if (ER.flag('ga-stage')) openB();
    go.addEventListener('click', function () {
      if (solved) return;
      if (stage === 0) {
        readPad();
        var empty = ['where', 'to', 'when'].filter(function (b) { return !st[b]; }).length;
        if (empty) { msg.textContent = empty === 1 ? 'One line of the message is still blank.' : empty + ' lines of the message are still blank.'; return; }
        var wrong = 0;
        if (!ER.check('where', st.where)) wrong++; if (!ER.check('to', st.to)) wrong++; if (!ER.check('when', st.when)) wrong++;
        if (wrong) { ER.sfx.no(); msg.textContent = wrong === 1 ? '“One line of that is wrong,” says Aunt Edwina, reading over your shoulder.' : '“' + (wrong === 2 ? 'Two' : 'All three') + ' lines of that are wrong,” says Aunt Edwina, reading over your shoulder.'; return; }
        ER.sfx.ok(); ER.flag('ga-stage', 1); openB(); msg.style.color = '#1f4a2f'; msg.textContent = 'That is the call. Now Mr Earle’s statement.';
        setTimeout(function () { msg.style.color = ''; }, 2500);
        return;
      }
      if (!st.s || !st.k || !st.p) { msg.textContent = 'Click one sentence, choose a stamp, and say what it hides.'; return; }
      var file = ER.exit([st.where + '|' + st.to + '|' + st.when + '|' + st.s + '|' + st.k + '|' + st.p], { wait: true });
      if (file) {
        solved = true; busy = true; pips();
        msg.style.color = '#1f4a2f'; msg.textContent = 'Aunt Edwina folds the message in half, and then in half again.';
        setTimeout(function () {
          ER.closeAll();
          ER.narrate([
            '“Benedict,” says Aunt Edwina. “You went out to my birdbath at twenty to twelve with my garden room key, and you telephoned somebody in London. Then you wrote that you never left your room.”',
            'Mr Earle looks at his shoes for some time. “It was private business,” he says. “It has nothing to do with the book.”',
            '“Everything you do this weekend has to do with the book,” says Aunt Edwina. “You lied, and the lie was tidy. Now we only have to find out whether it hides a theft or a telephone call.”',
            'She looks at the clock. “Twenty past ten. Kitchen. Caspar has been making tea for everybody since seven, which is what Caspar does when he is frightened.”'
          ], function () { ER.leave(file); });
        }, 1500);
        return;
      }
      ER.sfx.no();
      if (!ER.check('false', st.s)) msg.textContent = '“Could Ms Ahn have heard him under her window if that sentence were false?” says Aunt Edwina. “Find the one that cannot be true.”';
      else if (!ER.check('kind', st.k)) msg.textContent = '“A mistake needs a reason: a clock, the dark, a wall,” says Aunt Edwina. “Can a man be mistaken about going out into the garden in October?”';
      else if (ER.check('tempt', st.p)) msg.textContent = '“Perhaps,” says Aunt Edwina. “But that is what you would like. What do you know? Write that, and only that.”';
      else msg.textContent = '“Read Ms Ahn again,” says Aunt Edwina. “Who was not to know?”';
    });
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
