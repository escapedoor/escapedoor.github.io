<style>
  body{--bg:#2a2620;--accent:#d9a84a;--font-display:'IM Fell English SC',serif;--font-ui:'Oswald',sans-serif;
    --tc-bg:rgba(34,30,24,.95);--cap-bg:rgba(36,32,26,.95);--panel:#2a251e;--q-ink:#e6c88a;--fade:#0e0c09}
  .tc-room{font-family:'IM Fell English SC',serif}
  #lampA,#lampB,#lampC{animation:lp 5s steps(2) infinite}
  #lampB{animation-delay:-2s}#lampC{animation-delay:-3.3s}
  @keyframes lp{50%{opacity:.78}}
  #catEar{animation:ce 6s steps(1) infinite;transform-origin:0 0}
  @keyframes ce{92%{transform:rotate(0)}96%{transform:rotate(-18deg)}}

  .wk{width:min(1120px,98vw);padding:16px 22px 16px;background:#f1e9d4;color:#2a2018;box-shadow:0 26px 70px rgba(0,0,0,.7);border-top:6px solid #8a5a2a}
  .wk h5{margin:0 0 2px;font-family:'IM Fell English SC',serif;font-weight:normal;font-size:26px}
  .wk .say{margin:0 0 8px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:17px}
  .wk .plan{display:block;width:100%;height:auto;max-height:44vh;background:#fbf6e6;border:1px solid #c9b48a}
  .plan .hit{cursor:pointer}
  .plan .hit:hover rect,.plan .hit:hover path{filter:brightness(1.12)}
  .vd{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:10px;align-items:start}
  .vd-q{padding:10px 14px;background:#fffdf6;border-left:5px solid #a8532f;font-family:'Caveat',cursive;font-size:24px;line-height:1.15;color:#5a3418}
  .vd-q small{display:block;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a6a4a;margin-bottom:4px}
  .stamps{display:flex;gap:10px;margin-top:10px}
  .stamp{flex:1;padding:8px 4px;border:3px solid #7a2a24;color:#7a2a24;font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;background:transparent;transform:rotate(-2deg);opacity:.55}
  .stamp.mis{border-color:#2a5a7a;color:#2a5a7a;transform:rotate(1.5deg)}
  .stamp.on{opacity:1;background:rgba(255,255,255,.6);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .slips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slip{text-align:left;padding:8px 12px;background:#fffdf6;border:1px solid #d8c8a0;font-family:'EB Garamond',Georgia,serif;font-size:16.5px;line-height:1.25;color:#2a2018;box-shadow:0 2px 4px rgba(0,0,0,.12)}
  .slip:before{content:'because ';font-style:italic;color:#8a6a4a}
  .slip.on{background:#fff3c8;border-color:#a8532f;box-shadow:0 0 0 2px #a8532f}
  .wk-row{display:flex;align-items:center;gap:14px;margin-top:10px}
  .wk-msg{flex:1;min-height:24px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:17.5px;color:#7a2a18}
  .wk .btn{--accent:#5a3418;background:#fffdf6}.wk .btn:hover:not([disabled]){color:#fffdf6}
  .doc.plandoc{width:min(860px,94vw);background:#fbf6e6;padding:22px 26px}
  .doc.plandoc h4{font-family:'IM Fell English SC',serif;font-weight:normal;font-size:24px;margin:0 0 6px}
  .doc.plandoc svg{display:block;width:100%;height:auto}
  .doc.plandoc p{font-size:16px;margin:6px 0 0;font-style:italic}
</style>
</head>

<script>
(function () {

      '<text x="' + ((r[3] + r[4]) / 2) + '" y="' + (r[0] === 'oak' || r[0] === 'grey' ? 84 : 92) + '" text-anchor="middle" font-size="' + (r[2].length > 12 ? 11 : 13) + '" fill="#3a2a1a">' + r[2].split(' · ')[0] + '</text>' +
      (r[2].indexOf(' · ') > 0 ? '<text x="' + ((r[3] + r[4]) / 2) + '" y="102" text-anchor="middle" font-size="11" fill="#6a5a4a">' + r[2].split(' · ')[1] + '</text>' : ''); });

  /* ---- the corridor in perspective, looking west from the top of the front stairs ---- */
  var VP = [800, 400];
  function P(x, y, z) { return (VP[0] + (x - VP[0]) / z).toFixed(1) + ' ' + (VP[1] + (y - VP[1]) / z).toFixed(1); }
  function zOf(px) { return 1 + (820 - px) / 370; }
  (function () {
    var L = -150, R = 1750, T = -150, B = 1000, s = '', d = '', zf = 3;
    s += '<path d="M' + P(L, T, 1) + 'L' + P(L, T, zf) + 'L' + P(L, B, zf) + 'L' + P(L, B, 1) + 'Z" fill="url(#stripe)"/>';
    s += '<path d="M' + P(R, T, 1) + 'L' + P(R, T, zf) + 'L' + P(R, B, zf) + 'L' + P(R, B, 1) + 'Z" fill="url(#stripe)"/>';
    s += '<path d="M' + P(L, T, 1) + 'L' + P(R, T, 1) + 'L' + P(R, T, zf) + 'L' + P(L, T, zf) + 'Z" fill="#e9e2d0"/>';
    s += '<path d="M' + P(L, B, 1) + 'L' + P(R, B, 1) + 'L' + P(R, B, zf) + 'L' + P(L, B, zf) + 'Z" fill="#5a3a24"/>';
    s += '<path d="M' + P(250, B, 1) + 'L' + P(1350, B, 1) + 'L' + P(1350, B, zf) + 'L' + P(250, B, zf) + 'Z" fill="#7a2c2c"/>';
    s += '<path d="M' + P(330, B, 1) + 'L' + P(1270, B, 1) + 'L' + P(1270, B, zf) + 'L' + P(330, B, zf) + 'Z" fill="none" stroke="#c9963a" stroke-width="4"/>';
    [L, R].forEach(function (x) {
      s += '<path d="M' + P(x, 930, 1) + 'L' + P(x, 930, zf) + 'L' + P(x, B, zf) + 'L' + P(x, B, 1) + 'Z" fill="#4a2e1c"/>';
      s += '<path d="M' + P(x, 500, 1) + 'L' + P(x, 500, zf) + '" stroke="#8a6a3a" stroke-width="4"/>';
    });
    s += '<path d="M' + P(L, T, zf) + 'L' + P(R, T, zf) + 'L' + P(R, B, zf) + 'L' + P(L, B, zf) + 'Z" fill="#c4b088"/>';
    $('#corr').innerHTML = s;
    /* doors: each one 80 plan-units wide, the same height everywhere */
    function door(side, px, id, hot) {
      var x = side === 'S' ? L : R, z0 = zOf(px + 40), z1 = zOf(px - 40), top = 140;
      var p = 'M' + P(x, top, z0) + 'L' + P(x, top, z1) + 'L' + P(x, B - 8, z1) + 'L' + P(x, B - 8, z0) + 'Z';
      var fr = 'M' + P(x, top - 30, z0 - 0.03) + 'L' + P(x, top - 30, z1 + 0.03) + 'L' + P(x, B - 8, z1 + 0.03) + 'L' + P(x, B - 8, z0 - 0.03) + 'Z';
      var kn = P(x, 600, side === 'S' ? z1 - 0.03 : z1 - 0.03).split(' ');
      var g = '<g' + (hot ? ' id="' + id + '" class="hot"' : '') + '><path d="' + fr + '" fill="#e8e0cc"/><path d="' + p + '" fill="#6d4428"/>' +
        '<path d="M' + P(x, 220, z0 + 0.03) + 'L' + P(x, 220, z1 - 0.03) + 'L' + P(x, 520, z1 - 0.03) + 'L' + P(x, 520, z0 + 0.03) + 'Z" fill="none" stroke="#4a2e1c" stroke-width="3"/>' +
        '<path d="M' + P(x, 600, z0 + 0.03) + 'L' + P(x, 600, z1 - 0.03) + 'L' + P(x, 900, z1 - 0.03) + 'L' + P(x, 900, z0 + 0.03) + 'Z" fill="none" stroke="#4a2e1c" stroke-width="3"/>' +
        '<circle cx="' + kn[0] + '" cy="' + kn[1] + '" r="' + (9 / z1).toFixed(1) + '" fill="url(#brass)"/>';
      if (hot) {         /* a wider strip to click on, because a door far down a corridor is thin */
        var a = P(x, top, z0).split(' '), b = P(x, B - 8, z1).split(' ');
        g += '<rect x="' + (Math.min(+a[0], +b[0]) - 16) + '" y="' + a[1] + '" width="' + (Math.abs(+a[0] - +b[0]) + 32) + '" height="' + (+b[1] - +a[1]) + '" fill="transparent"/>';

    [[L, 620, 'lampA'], [R, 520, 'lampB'], [L, 395, 'lampC'], [R, 280, null]].forEach(function (l) {

  ER.init({
    theme: 'mystery', story: 'seventh', storyTitle: 'The Seventh Book', id: 'landing', no: 'III', title: 'The Landing',

  });
  got = ER.flag('la-got') || {};

  function pips() { ER.pips(['fenella', 'stmt', 'plan', 'page'].filter(function (k) { return got[k]; }).length + (solved ? 1 : 0), 5); }

  function hints() {

    return ['walk', [
      'Where had Miss Caird been just before she tried the door? Which stairs did she come up?',

  }

  function thing(sel, word, line) {

  }
  thing('#backStairs', 'back stairs', 'The top of the back stairs, at the far end of the landing. They go down to the back passage and the kitchen.');
  thing('#cat', null, 'Comma is lying across the landing so that everybody has to step over her. It is her favourite game.');
  thing('#d-study', null, 'The study door. Locked. Aunt Edwina has the key on its ribbon round her own neck now.');
  thing('#d-blue', null, 'The Blue Room, Miss Caird’s. Its window opens onto the same flat roof as the study window.');
  thing('#d-oak', null, 'The Oak Room, Mr Earle’s. The door is shut, and you can hear somebody packing in a hurry.');
  $('#d-linen').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.narrate([
      'Aunt Edwina pushes the linen room door. It opens inwards, about an inch, and stops against something soft: the laundry basket that lives just inside.',
      'The room behind it is narrow and dark, with no window. The hot-water tank fills one end, and the air is very warm. The shelves of sheets have little bags of lavender tucked between them.',
      '“My grandmother’s lavender,” says Aunt Edwina. “Nobody has thrown it away since 1952.”'
    ], function () { ER.addClue('linen', 'The linen room', '<h4>The linen room</h4><p>Opposite the study. The door opens inwards and stops after about an inch against the laundry basket just inside. No window: pitch dark with the door shut. The hot-water tank makes it very warm. Lavender bags between the sheets.</p>', 'typed', 'Seen'); });
  });

  var FEN = '<h4>Fenella Caird · the Blue Room</h4>' +
    '<p>I couldn’t sleep. At about ten past eleven I went down the back stairs to make cocoa; Mrs Beddoes had shown me the way at tea-time, and I’d never used them before. In the back passage all the keys were on their hooks, each with one of Edwina’s little labels. I always notice lettering.</p>' +
    '<p>At about twenty-five past eleven I came back up the back stairs with my cocoa and my drawing for Augusta, the first picture for the last book. I wanted it to be on her box this morning.</p>' +
    '<p>Edwina told us at tea that the study was the third door on the left. So I went to the third door on the left and pushed. It wasn’t locked! It opened about an inch and stopped against something soft. It was pitch dark, very warm, and it smelt of lavender. I didn’t want to fall over anything, so I pulled it shut and went to bed. I still have the drawing.</p>' +
    '<p>P.S. At ten to ten last night I fetched my sketchbook from the library. The grey box was on the table with its label upside down. It annoyed me, but it wasn’t my box.</p><p class="sig">F. C.</p>';
  var PAGE2 = SV.page(2, 'Lies and honest mistakes',
    '<p>A false sentence in a statement is either a lie or an honest mistake. On paper they look the same. Ask two questions.</p>' +
    '<p class="ex"><b>Has it got a reason?</b> An honest mistake usually has one: a clock that is wrong, a voice heard through a wall, the dark, one door taken for another, a word misheard. Find the reason, and the mistake explains itself.</p>' +
    '<p class="ex"><b>Does it protect anything?</b> A lie does: a place, a time, a person, a secret. Ask what would happen if it were true.</p>' +
    '<p>Liars are often tidy. Their times are exact, they saw nothing, heard nothing, and never say “I think”. Honest witnesses are untidy: they guess, they correct themselves, and they tell you things that make them look bad.</p>' +
    '<p>A mistake can be put right with a plan, a clock or a map. A lie can only be put right with the truth.</p>');

  $('#fenella').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.fenella.who, role: CAST.fenella.role, face: FACE('fenella'), clue: { id: 'la-fenella', title: 'Fenella Caird, on the landing', kind: 'Said' }, lines: [
      'I didn’t take it. I know everybody says that. I’ve written it all down anyway, because the study door was open last night and I’m the only one who knows.',
      { q: 'Open?', a: 'Not locked, anyway. I pushed it and it moved. I nearly went in. Thank goodness I didn’t, or it would be me in the kitchen being asked questions.' },
      { q: 'Why did you want to go in?', a: 'To leave Augusta a present on her box. I’ve drawn Comfrey at the door of his home, which is where the last book ends, she told me. I wanted it to be the first thing she saw.' },
      { q: 'Does Mr Earle know you were up?', a: 'I haven’t spoken to Benedict since 2009 and I’m not starting at a crime.' },
      'Here. All of it. Even the bit about the box, though I don’t suppose that matters.'
    ], done: function (ok) {
      if (!ok) return;
      mark('fenella');
      if (!got.stmt) ER.read({ html: FEN, cls: 'st st-fenella', clue: { id: 'st-fenella', title: 'Statement of Fenella Caird', kind: 'Statement' }, done: function () { mark('stmt'); } });
    } });
  });
  $('#edwina').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.edwina.who, role: CAST.edwina.role, face: FACE('edwina'), clue: { id: 'la-edwina', title: 'Aunt Edwina, on the landing', kind: 'Said' }, lines: [
      'Fenella is the only person in this house who would confess to a crime she hasn’t committed, in writing, with a postscript.',
      { q: 'Did you tell her the study was the third door on the left?', a: 'Yes, at tea, standing exactly where you are now, at the top of the front stairs. I say it to every guest. Nobody ever needs to know, so nobody ever listens.' },
      { q: 'Is the linen room ever locked?', a: 'The linen room has never been locked in its life. It has the hot-water tank in it, and every towel in the house.' },
      'The plan on the table is the one I give the guests. Your notebook is beside it: I have typed you a second page.'
    ] });
  });
  $('#book').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.read({ html: PAGE2, cls: 'npage', clue: { id: 'page2', title: 'Page 2 · Lies and honest mistakes', kind: 'Notebook' }, done: function () { mark('page'); } });
  });
  $('#plan').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!ready()) {
      ER.read({ html: '<h4>The first floor at Copperwood</h4>' + planSvg(false) + '<p>The plan Aunt Edwina gives her guests. North is at the top; the drive is on that side, the garden on the other.</p>', cls: 'plandoc',
        clue: { id: 'plan1', title: 'Plan of the first floor', kind: 'Plan' }, done: function () { mark('plan'); if (ready()) ER.say('Click the plan again to follow Miss Caird’s walk.'); } });
      return;
    }
    openWalk();
  });

  /* ---------- the lock: Fenella's walk, and what kind of false sentence it is ---------- */
  var SLIPS = [['stairs', 'she came up the back stairs, so “the third door on the left” was a different door.'],
    ['dark', 'it was so dark that she pushed the study door the wrong way.'],
    ['protect', 'she wants us to think the study was open, to protect somebody else.'],
    ['forgot', 'Aunt Edwina really did forget to lock the study.']];
  function openWalk() {
    var st = ER.flag('la-walk') || {};
    var box = ER.el('div', 'wk');
    box.innerHTML = '<h5>Miss Caird’s walk, a quarter of an hour before midnight</h5><p class="say">Click the stairs she came up, then the door she pushed. Then say what kind of false sentence hers is.</p>' +
      planSvg(true) +
      '<div class="vd"><div><div class="vd-q"><small>Miss Caird wrote</small>“It wasn’t locked!”</div><div class="stamps"><button type="button" class="stamp" data-k="lie">A lie</button><button type="button" class="stamp mis" data-k="mistake">An honest mistake</button></div></div>' +
      '<div class="slips">' + SLIPS.map(function (s) { return '<button type="button" class="slip" data-r="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="wk-row"><div class="wk-msg"></div><button type="button" class="btn" id="wkGo">Tell Aunt Edwina</button></div>';
    var svg = box.querySelector('svg.plan'), msg = box.querySelector('.wk-msg'), candle = svg.querySelector('#candle');
    function paint() {
      ER.$$('.hit rect:nth-child(2)', svg).forEach(function (r) { r.setAttribute('fill', '#b9864a'); });
      ER.$$('[data-stairs] rect', svg).forEach(function (r) { r.setAttribute('fill', '#d8c8a6'); });
      if (st.stairs) {
        svg.querySelector('[data-stairs=' + st.stairs + '] rect').setAttribute('fill', '#ffd98a');
        candle.style.display = ''; candle.setAttribute('transform', 'translate(' + (st.stairs === 'back' ? 92 : 808) + ' 170)');
      }
      if (st.door) {
        var d = svg.querySelector('[data-door=' + st.door + '] rect:nth-child(2)'); d.setAttribute('fill', '#e8402a');
        var r = NORTH.concat(SOUTH).filter(function (x) { return x[0] === st.door; })[0];
        candle.style.display = ''; candle.setAttribute('transform', 'translate(' + r[1] + ' 170)');
      }
      ER.$$('.stamp', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-k') === st.kind); });
      ER.$$('.slip', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-r') === st.why); });
      ER.flag('la-walk', st);
    }
    svg.addEventListener('click', function (e) {
      if (solved) return;
      var h = e.target.closest ? e.target.closest('.hit') : null; if (!h) return;
      if (h.getAttribute('data-stairs')) { st.stairs = h.getAttribute('data-stairs'); st.door = null; }
      else { if (!st.stairs) { msg.textContent = 'Start where she started: at the top of the stairs she came up.'; return; } st.door = h.getAttribute('data-door'); }
      ER.sfx.tick(); msg.textContent = ''; paint();
    });
    ER.$$('.stamp', box).forEach(function (b) { b.addEventListener('click', function () { if (solved) return; st.kind = b.getAttribute('data-k'); ER.sfx.clunk(); msg.textContent = ''; paint(); }); });
    ER.$$('.slip', box).forEach(function (b) { b.addEventListener('click', function () { if (solved) return; st.why = b.getAttribute('data-r'); ER.sfx.paper(); msg.textContent = ''; paint(); }); });
    box.querySelector('#wkGo').addEventListener('click', function () {
      if (solved) return;
      if (!st.stairs || !st.door) { msg.textContent = 'Her walk is not finished: the stairs, and then a door.'; return; }
      if (!st.kind || !st.why) { msg.textContent = 'Choose a stamp for her sentence, and the slip that says why.'; return; }
      var file = ER.exit([st.stairs + '|' + st.door + '|' + st.kind + '|' + st.why], { wait: true });
      if (file) {
        solved = true; busy = true; pips();
        msg.style.color = '#1f4a2f'; msg.textContent = 'Aunt Edwina follows your candle along the plan with one finger.';
        setTimeout(function () {
          ER.closeAll();
          ER.narrate([
            '“The linen room,” says Aunt Edwina. “Warm, dark, lavender, and a laundry basket behind the door. Fenella, you pushed my towels.”',
            'Miss Caird sits down on the top stair. “Oh, thank goodness,” she says. “I have been a suspect for nine hours, and it was the towels.”',
            '“Her mistake had a reason,” says Aunt Edwina quietly, “and it made her look guilty. Liars don’t usually do that.” She looks along the landing at the Oak Room door. “Somebody else wrote a statement this morning that is much too tidy. Come down to the garden room.”'
          ], function () { ER.leave(file); });
        }, 1500);
        return;
      }
      ER.sfx.no();
      if (!ER.check('walk', st.stairs + '|' + st.door)) {
        if (ER.check('locked', st.door)) msg.textContent = '“The study was locked all night, and its key was on your wrist,” says Aunt Edwina. “Whatever she pushed, it wasn’t that.”';
        else msg.textContent = '“That isn’t where her walk ends,” says Aunt Edwina. “Which stairs had she just come up, and where was her left hand?”';
      } else if (!ER.check('kind', st.kind)) msg.textContent = '“A lie that puts the liar at the scene of the crime?” says Aunt Edwina. “Ask what it protects.”';
      else msg.textContent = '“Yes, a mistake. But that is not its reason,” says Aunt Edwina. “Look at where she started.”';
    });
    paint();
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
