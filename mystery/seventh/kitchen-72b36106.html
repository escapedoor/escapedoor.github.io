  ER.init({
    theme: 'mystery', story: 'seventh', storyTitle: 'The Seventh Book', id: 'kitchen', no: 'V', title: 'The Kitchen',
    go: 'Go through to the kitchen',
    intro: [
      'You wrote down the call at twenty to twelve: Mr Earle was outside by the birdbath, the only place with a signal, talking on his phone to somebody who was not in the house, and he meant to take “it” to London today, on the 12.10. So the sentence in his statement that says he never left his room is a lie, and a tidy one. It hides a telephone call. Whether it hides anything else, nobody knows yet.',
      'Sunday, twenty past ten. The kitchen is the warmest room in the house, and the only one where nobody has been accused of anything.',

    ],

      'Talk to Mr Boyd at the table: he gives you his statement. Mrs Beddoes’s note is under the teapot, and page 4 of your notebook is at the end of the table.',

    ]];
    return ['board', [
      'For each card ask: does the evidence prove it, rule it out, or only allow it? Ms Ahn, Mrs Cleave and Ferdy each tell you something about Mr Earle last night, and the garden room key was in its door this morning.',

    ]];

  }
  thing('#board', 'key board', 'Six hooks, six keys, six labels in Aunt Edwina’s best handwriting: front door, back door, garden room, cellar, shed, larder. The study has never had a hook. The garden room key is back on its hook, because Aunt Edwina hung it there at a quarter to eight this morning.');
  thing('#stairsFoot', null, 'The bottom of the back stairs. You put your foot on the first step, and it creaks like a ship. Mr Boyd flinches.');

  thing('#dresser', 'dresser', 'Willow-pattern plates, every one of them chipped in the same place.');
  thing('#cat', null, 'Comma is sitting by the range with the face of a cat who has not been fed, which is untrue.');

  var CAS = '<h4>Caspar Boyd · the Yellow Room</h4>' +
    '<p>I went up at about a quarter past ten. My room is at the top of the back stairs, and they creak like a ship, so I can tell you when they were used, if not who by. I didn’t sleep much.</p>' +
    '<p>Somebody went down at about ten past eleven and came up at about twenty-five past. Somebody went down at about twenty past one and came up ten minutes later. Nobody else used them until I went down myself at ten to seven to make the tea.</p>' +
    '<p>I didn’t hear anything from the study. I never went near it.</p>' +
    '<p>Earlier, at about a quarter past seven, I went out on the terrace for some air, but Mr Earle was on the telephone by the birdbath, so I came in again. And at twenty to nine I went out to my car for a few minutes.</p>' +
    '<p>I’m very sorry about the book. I’ve been waiting for it since I was nine.</p><p class="sig">C. B.</p>';
  var NOTE = '<h4>Under the teapot · Saturday, 9.40 p.m.</h4>' +
    '<p>Mrs D,</p><p>Shepherd’s pie in the bottom oven for tomorrow, it only wants warming.</p>' +
    '<p>Mr Ferdy came through for the port at quarter past nine and was down them cellar steps ten minutes complaining, and came back up the same way with two bottles, so he never went near your hall.</p>' +
    '<p>Your young visitor had two helpings and dried up.</p>' +
    '<p>I am off out the back at quarter to ten and I have locked it behind me with my own key. Cat fed, whatever she tells you.</p><p style="text-align:right">E. Beddoes</p>';
  var PAGE4 = SV.page(4, 'How sure are you?',
    '<p>A conclusion is only as strong as its evidence. Choose the words the evidence allows, no stronger and no weaker.</p>' +
    '<svg viewBox="0 0 460 58" width="460" height="58"><path d="M20 30H440" stroke="#2a2620" stroke-width="3"/><path d="M20 20v20M230 20v20M440 20v20" stroke="#2a2620" stroke-width="3"/>' +
    '<text x="20" y="14" font-family="Special Elite,monospace" font-size="13" fill="#7a2a24">CAN’T HAVE</text><text x="230" y="14" text-anchor="middle" font-family="Special Elite,monospace" font-size="13" fill="#2a5a7a">MIGHT / COULD HAVE</text><text x="440" y="14" text-anchor="end" font-family="Special Elite,monospace" font-size="13" fill="#2a6a3a">MUST HAVE</text>' +
    '<text x="20" y="54" font-family="Special Elite,monospace" font-size="11" fill="#5a5040">ruled out</text><text x="230" y="54" text-anchor="middle" font-family="Special Elite,monospace" font-size="11" fill="#5a5040">possible, not proved</text><text x="440" y="54" text-anchor="end" font-family="Special Elite,monospace" font-size="11" fill="#5a5040">no other way</text></svg>' +
    '<p class="ex"><b>must have</b>: the evidence leaves no other way. <i>He must have gone out: she heard him outside, and the key was in the door.</i></p>' +
    '<p class="ex"><b>can’t have</b> (or <b>couldn’t have</b>): the evidence rules it out. <i>She can’t have opened it: it was locked, and the key was on your wrist.</i></p>' +
    '<p class="ex"><b>might have</b> or <b>could have</b>: possible, and nothing rules it out, but nothing proves it either. “Could have” often means the person had the chance.</p>' +
    '<p>The opposite of “must have” is “can’t have”. “Mustn’t have” is not used for conclusions.</p>' +
    '<p>A wrong word is a wrong conclusion. “He might have lied” is too weak when you have proved it. “He must have taken it” is too strong when you only know that he could.</p>');

  $('#caspar').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.caspar.who, role: CAST.caspar.role, face: FACE('caspar'), clue: { id: 'ki-caspar', title: 'Caspar Boyd, in the kitchen', kind: 'Said' }, lines: [
      'Tea? There’s tea. There’s a great deal of tea. I’ve made four pots.',
      { q: 'You were awake most of the night?', a: 'Most of it. Those stairs. And I kept thinking about the book.' },
      { q: 'Why did you go out to your car at dinner?', a: '<p>I needed something from it. I wasn’t gone long. Ms Ahn will tell you. She notices everything.</p><p class="note">He has gone rather pink.</p>' },
      { q: 'What was Mr Earle saying on the terrace at a quarter past seven?', a: 'I didn’t stay to listen. I went straight back in.' },
      'Here. I’ve written it all down. Everything I heard on those stairs.'
    ], done: function (ok) {
      if (ok && !got.caspar) ER.read({ html: CAS, cls: 'st st-caspar', clue: { id: 'st-caspar', title: 'Statement of Caspar Boyd', kind: 'Statement' }, done: function () { mark('caspar'); } });
    } });
  });
  $('#edwina').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    ER.talk({ who: CAST.edwina.who, role: CAST.edwina.role, face: FACE('edwina'), clue: { id: 'ki-edwina', title: 'Aunt Edwina, in the kitchen', kind: 'Said' }, lines: [
      'Six statements, one lie and one honest mistake so far. Now we put the locked room on the table and look at it properly.',
      { q: 'Do you think Mr Earle took it?', a: 'I would very much like it to be Benedict. That is a preference, not a piece of evidence. Write the conclusions; we shall see what they say.' },
      { q: 'Could anybody have got your key?', a: 'Which one? The spare is in a bank in Dunstow, and the bank is shut on Sundays. The other spent the night on your wrist.' },
      'The cards are at the end of the table. One stamp in each gap. And mind the one at the back of the box: that stamp is for rules, not for detectives.'
    ] });
  });
  $('#teapot').addEventListener('click', function () { if (busy || ER.isOpen()) return; ER.read({ html: NOTE, cls: 'beddoes', clue: { id: 'beddoes', title: 'Mrs Beddoes’s note, Saturday 9.40 pm', kind: 'Note' }, done: function () { mark('note'); } }); });
  $('#book').addEventListener('click', function () { if (busy || ER.isOpen()) return; ER.read({ html: PAGE4, cls: 'npage', clue: { id: 'page4', title: 'Page 4 · How sure are you?', kind: 'Notebook' }, done: function () { mark('page'); } }); });
  $('#cards').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!ready()) { ER.say('“Statement, note, notebook,” says Aunt Edwina. “Then the cards.”'); return; }
    openBoard();
  });

  /* ---------- the lock: eight conclusions, one stamp each ---------- */
  var STAMPS = [['must', 'must have'], ['might', 'might have'], ['could', 'could have'], ['cant', 'can’t have'], ['mustnt', 'mustn’t have']];
  var CARDS = [
    ['c1', 'Mr Earle # gone out to the birdbath at twenty to twelve.'],
    ['c2', 'Mr Earle # taken the pages out of the study in the night.'],
    ['c3', 'Miss Caird # climbed out onto the leads from the Blue Room.'],
    ['c4', 'Miss Caird # opened the study door at twenty-five past eleven.'],
    ['c5', 'Somebody # come into the study through the window.'],
    ['c6', 'The key on your wrist # been used in the night.'],
    ['c7', 'Ferdy # let somebody in at the back door at twenty past one.'],
    ['c8', 'So the pages # been taken out of the study during the night.']
  ];
  function openBoard() {
    var st = ER.flag('ki-board') || {}, pick = null;
    var box = ER.el('div', 'cbx');
    box.innerHTML = '<div><h5>The stamps</h5><p class="say">Pick up a stamp, then click a gap. Click a gap again to clear it.</p><div class="rack">' +
      STAMPS.map(function (s) { return '<button type="button" class="rs" data-m="' + s[0] + '"><i></i>' + s[1] + '</button>'; }).join('') + '</div></div>' +
      '<div><h5>What the evidence allows</h5><div class="cards">' + CARDS.map(function (c, i) {
        return '<div class="cc' + (i === 7 ? ' last' : '') + '" data-n="' + (i + 1) + '">' + ER.gloss(c[1]).replace('#', '<span class="gap" data-c="' + c[0] + '"></span>') + '</div>';
      }).join('') + '</div></div>' +
      '<div class="cb-row"><div class="cb-msg"></div><button type="button" class="btn" id="cbGo">Show Aunt Edwina</button></div>';
    var msg = box.querySelector('.cb-msg');
    function label(m) { for (var i = 0; i < STAMPS.length; i++) if (STAMPS[i][0] === m) return STAMPS[i][1]; return ''; }
    function paint() {
      ER.$$('.gap', box).forEach(function (g) { var v = st[g.getAttribute('data-c')]; g.textContent = v ? label(v) : ''; g.classList.toggle('f', !!v); });
      ER.$$('.rs', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-m') === pick); });
      ER.flag('ki-board', st);
    }
    box.addEventListener('click', function (e) {
      if (solved || !e.target.closest) return;
      var r = e.target.closest('.rs'), g = e.target.closest('.gap');
      if (r) { pick = r.getAttribute('data-m') === pick ? null : r.getAttribute('data-m'); ER.sfx.click(); paint(); return; }
      if (g) {
        var c = g.getAttribute('data-c');
        if (pick && st[c] !== pick) { st[c] = pick; ER.sfx.clunk(); } else { delete st[c]; ER.sfx.paper(); }
        msg.textContent = ''; paint();
      }
    });
    box.querySelector('#cbGo').addEventListener('click', function () {
      if (solved) return;
      var empty = CARDS.filter(function (c) { return !st[c[0]]; }).length;
      if (empty) { msg.textContent = empty === 1 ? 'One card still has a gap in it.' : empty + ' cards still have gaps in them.'; return; }
      if (CARDS.some(function (c) { return st[c[0]] === 'mustnt'; })) {
        ER.sfx.no(); msg.textContent = '“Mustn’t is for rules, dear,” says Aunt Edwina. “You mustn’t feed the cat. Nobody ever concluded anything with it.”'; return;
      }
      var file = ER.exit([CARDS.map(function (c) { return st[c[0]]; }).join('|')], { wait: true });
      if (file) {
        solved = true; busy = true; pips();
        msg.style.color = '#1f4a2f'; msg.textContent = 'Aunt Edwina reads the cards from one to eight, and puts her stamps back in their box.';
        setTimeout(function () {
          ER.closeAll(); ER.mood('calm');
          ER.narrate([
            '“So,” says Aunt Edwina. “Nobody came in through the door. Nobody came in through the window. Benedict was in my garden, lying about it, and Fenella was in my towels.”',
            '“The pages can’t have left that study in the night. And yet this morning the box was empty.”',
            'She looks at you over her glasses. “There is only one way out of that. The pages were never in the study at all.”',
            '“But you carried them up yourself, at five past ten. You wrote it down.” She hands you your own notebook, open at Saturday night. “Didn’t you?”'
          ], function () { ER.leave(file); });
        }, 1500);
        return;
      }
      ER.sfx.no();
      var wrong = CARDS.filter(function (c) { return !ER.check(c[0], st[c[0]]); }).length;
      if (!ER.check('c2', st.c2)) msg.textContent = '“I would like it to be Benedict too,” says Aunt Edwina. “But he lied about the garden, not about the study. How did he get in?” ' + (wrong > 1 ? 'She taps ' + (wrong - 1) + ' other card' + (wrong > 2 ? 's' : '') + ' as well.' : '');
      else msg.textContent = wrong === 1 ? '“One of these says more than the evidence does, or less,” says Aunt Edwina.' : '“' + wrong + ' of these say more than the evidence does, or less,” says Aunt Edwina.';
    });
    paint();
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
