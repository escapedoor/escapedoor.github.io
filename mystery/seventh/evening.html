      'Then she takes her spectacles off, puts them down on the table, and lays four hundred and twelve typed pages in a grey box.',
      '“The only copy,” she says. “Carbons are for people who expect to lose things.”',
      'Aunt Edwina puts the lid on and writes the label. Ms Ahn takes a photograph. Everybody claps, except Mr Earle, who is looking at his watch.',
      '“Dinner at half past seven,” says Aunt Edwina, and puts a pile of place cards on the table. “You are in charge of who sits where. Come and see me first.”'
    ]);
  }

  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) { if (busy || ER.isOpen()) return; if (word) ER.wordAt(e.clientX, e.clientY, word); if (line) ER.say(line); });
  }
  thing('#win', 'window seat', 'The garden is black, and there is a thin moon over the beeches. A clear, cold night is coming.');
  thing('#shelvesL', null, 'A hundred years of Dabney &amp; Fane, in order. The six Comfrey books have a shelf of their own, with a gap at the end.');
  thing('#shelvesR', null, 'Detective stories, a whole wall of them. Aunt Edwina says thrillers paid for the roof.');
  thing('#portrait', 'founder', 'Aunt Edwina’s grandfather, who started the firm in 1926 with his friend Mr Fane. He looks as if he has just found a spelling mistake.');
  thing('#fireplace', 'mantelpiece', 'A good fire. Ferdy is standing as close to it as a person can without becoming part of it.');
  thing('#door', null, 'The door to the hall. The dining room is across the hall, and the front door is beside this one.');
  thing('#cat', null, 'Comma, the house cat: black, with a white chin and white socks. She has decided that Miss Caird is a chair.');
  thing('#trolley', 'decanter', 'Sherry, whisky and a jug of water that nobody has touched.');
  thing('#glasses', 'spectacles', 'Mrs Cleave’s spectacles, left on the table beside the box. She will want them when she has to read something.');
  thing('#boxHot', 'manuscript box', 'A grey manuscript box with a lift-off lid. DABNEY &amp; FANE is printed on the front, and Aunt Edwina’s label is on the lid: COMFREY GOES HOME, A. Cleave, 412 pages.');

  /* ---------- the people ---------- */
  var LINES = {
    edwina: [
      'Edwina Dabney. Your great-aunt, as you know, and the publisher of everything on these shelves that is worth reading.',
      'Dabney &amp; Fane is a hundred years old this weekend. We have published six Comfrey books. Tonight Augusta gave us the seventh, and she says it is the last.',
      { q: 'Who are all these people?', a: 'Ms Ahn translates Comfrey into Korean. Fenella has drawn him since 1979. Caspar edits him. Benedict sells him. Ferdy counts him. And Augusta made him up, which she will mention.' },
      { q: 'What happens to the book now?', a: 'It stays in its box until Monday morning, when the printer’s van comes for it. Tonight it sleeps in my study, and I lock the door.' },
      'Now: the table. Here is my list. Read it, and then ask the others. They will tell you, at length.'
    ],
    augusta: [
      'Augusta Cleave. I write the books. Everybody else in this room is here because of a fox I invented on a bus in 1978.',
      'Seven books, and that is the last of them. I typed every word myself, on the same machine as the first, and I have not kept a copy.',
      { q: 'Where would you like to sit?', a: 'At Edwina’s right hand, where I have always sat. And put that young woman from Seoul next to me. I mumble, and she is the only person in England who listens to every word.' },
      { q: 'You have left your spectacles on the table.', a: 'I know where my spectacles are. I can see perfectly well without them, as long as nobody expects me to read.' }
    ],
    benedict: [
      'Benedict Earle. I have been Augusta’s agent for twenty-two years, and her friend for longer, whatever she tells you.',
      'Seven books with a small firm. Dabney &amp; Fane are charming people. Charming people do not always sell films.',
      { q: 'Where would you like to sit?', a: 'Facing the door. In my business you always face the door. Somebody may come in with a better offer.' },
      { q: 'Are you staying until Monday?', a: 'Sadly not. I take the ten past twelve tomorrow. I have a meeting in London on Monday morning that cannot wait.' }
    ],
    eunji: [
      'Ahn Eunji. In English I am Eunji Ahn: here the family name goes last, I know. I translate the Comfrey books into Korean.',
      'In Korea, Comfrey has sold more copies than in England. Mrs Cleave does not believe me. I have brought the figures.',
      { q: 'Where would you like to sit?', a: 'Wherever Mrs Cleave needs me. And if possible, facing the door. My grandmother always sat facing the door, so that nobody could surprise her. I am the same.' },
      { q: 'Why the camera?', a: 'My publisher in Seoul wanted a photograph of the manuscript going into its box. I took it at forty-one minutes past six, exactly.' }
    ],
    fenella: [
      'Fenella Caird. I draw the pictures. I drew the first Comfrey on the back of a menu in 1979, and I have been drawing him ever since.',
      'Don’t mind the cat. Comma sits for me. She is better at it than Augusta.',
      { q: 'Where would you like to sit?', a: 'Anywhere, as long as it isn’t next to Benedict. Or opposite him: I would have to look at him. We haven’t spoken since 2009. It was about a semicolon.' }
    ],
    caspar: [
      'Caspar Boyd. I’m the editor. Well, I edit the commas. Mrs Cleave won’t let me touch anything else.',
      'I’ve been reading Comfrey since I was nine. The seventh is in that box, and I’m not allowed to read it until Monday. It’s like sitting next to a fire and being told not to get warm.',
      { q: 'Where would you like to sit?', a: 'Anywhere. Next to Miss Caird, if you can manage it? I want to ask her about the map in book three. I’ve wanted to ask her since I was nine.' }
    ],
    ferdy: [
      'Ferdy Dabney. Aunt Edwina’s nephew. I keep the accounts, which means I am the only person here who knows what that box is worth.',
      'Without book seven, Dabney &amp; Fane has about eleven months of money left. With it, about eleven years. No pressure on anybody.',
      { q: 'Where would you like to sit?', a: 'At the bottom of the table. The youngest Dabney at dinner sits at the bottom: family rule. Also it’s the end nearest the fire, and I have been cold since 1990.' }
    ]
  };
  var NOTE = '<h4>The table · half past seven</h4>' +
    '<p>Eight places, and seven of us. Mrs Beddoes will not lay a place for the cat.</p>' +
    '<p>I sit at the head, by the serving door, as always.</p>' +
    '<p>Augusta sits at my right hand, as she has every year since 1979.</p>' +
    '<p>The empty place goes beside me. Nobody wants to sit next to the hostess: they think I shall ask about their next book.</p>' +
    '<p>For everybody else: ask them. They will tell you, at length.</p><p style="text-align:right">E. D.</p>';

  Object.keys(LINES).forEach(function (k) {
    $('#' + k).addEventListener('click', function () {
      if (busy || ER.isOpen()) return;
      var c = CAST[k];
      ER.talk({ who: c.who, role: c.role, face: FACE(k), lines: LINES[k], clue: { id: 'ev-' + k, title: c.who + ', in the library', kind: 'Said' },
        done: function (ok) {
          if (!ok) return;
          if (k === 'edwina') { if (!noteRead) openNote(); }
          else if (!seen[k]) { seen[k] = 1; pips(); }
        } });
    });
  });
  function openNote() {
    ER.read({ html: NOTE, cls: 'typed', clue: { id: 'ev-note', title: 'Aunt Edwina’s list for the table', kind: 'Note' },
      done: function () { if (!noteRead) { noteRead = true; ER.flag('ev-note', 1); pips(); ER.say('Now ask the guests. Then the place cards on the table.'); } } });
  }
  $('#cards').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!noteRead) { ER.say('“My list first,” says Aunt Edwina, without looking round.'); return; }
    openTable();
  });

  /* ---------- the place cards ---------- */
  var POS = { N1: [168, 44], N2: [316, 44], N3: [464, 44], S1: [168, 274], S2: [316, 274], S3: [464, 274], F: [622, 158] };
  function openTable() {
    var box = ER.el('div', 'pc');
    box.innerHTML = '<h5>The dining room, from above</h5><p class="say">Put a card at each place. One place stays empty.</p>' +
      '<div class="room"><span class="wl top">door to the hall</span><span class="wl bot">window</span><span class="wl bot b2">window</span>' +
      '<span class="wl lft">serving door</span><span class="wl rgt">fire</span><div class="tbl"></div></div>' +
      '<div class="tray"></div><div class="pc-row"><div class="pc-msg"></div><button type="button" class="btn" id="pcGo">Lay the table</button></div>';
    var room = box.querySelector('.room'), tray = box.querySelector('.tray'), msg = box.querySelector('.pc-msg');
    var head = ER.el('div', 'seat fixed', '<div class="card">Edwina<br>Dabney</div>');
    head.style.left = '14px'; head.style.top = '158px'; head.setAttribute('data-n', 'HEAD'); room.appendChild(head);
    SEATS.forEach(function (id) {
      var s = ER.el('div', 'seat'); s.setAttribute('data-seat', id); s.setAttribute('data-n', id === 'F' ? 'FOOT' : '');
      s.style.left = POS[id][0] + 'px'; s.style.top = POS[id][1] + 'px'; room.appendChild(s);
    });
    GUESTS.forEach(function (g) {
      var c = ER.el('div', 'card dnd-item', CAST[g].who.replace(' ', '<br>'));
      c.setAttribute('data-g', g);
      var at = placed[g] ? room.querySelector('[data-seat=' + placed[g] + ']') : null;
      (at || tray).appendChild(c);
    });
    function read() {
      placed = {};
      ER.$$('.seat[data-seat]', room).forEach(function (s) { var c = s.querySelector('.card'); if (c) placed[c.getAttribute('data-g')] = s.getAttribute('data-seat'); });
      ER.flag('ev-seats', placed);
    }
    ER.dnd(box, { item: '.card.dnd-item', slot: '.seat[data-seat]', home: tray, lock: function () { return solved; },
      change: function () { read(); msg.textContent = ''; } });
    box.querySelector('#pcGo').addEventListener('click', function () {
      if (solved) return;
      read();
      var free = GUESTS.filter(function (g) { return !placed[g]; });
      if (free.length) { msg.textContent = free.length === 1 ? 'One card is still in your hand.' : free.length + ' cards are still in your hand.'; ER.shake(tray); return; }
      var at = {}; GUESTS.forEach(function (g) { at[placed[g]] = g; });
      var cand = SEATS.map(function (id) { return id + '=' + (at[id] || '-'); }).join(',');
      var file = ER.exit([cand], { wait: true });
      if (file) {
        solved = true; busy = true; pips();
        msg.style.color = '#1f4a2f'; msg.textContent = 'Aunt Edwina reads your table twice, which is once more than she reads most books.';
        setTimeout(function () { ER.closeAll(); coda(file); }, 1800);
        return;
      }
      var wrong = 0; SEATS.forEach(function (id) { if (!ER.check('seat' + id, at[id] || '-')) wrong++; });
      ER.sfx.no(); ER.shake(room);
      msg.textContent = wrong === 1 ? '“One of these people will complain before the soup,” says Aunt Edwina.' : '“' + ['', '', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven'][wrong] + ' of these people will complain before the soup,” says Aunt Edwina.';
    });
    ER.open('ov-lock', box);
  }

  /* ---------- after the table: dinner, five past ten, and your notes ---------- */
  function coda(file) {
    ER.narrate([
      '“Good,” says Aunt Edwina. “Nobody will throw anything.”',
      'Dinner. You eat in the kitchen with Mrs Beddoes, who calls the dining room “the good table” and the kitchen “the better one”. Shepherd’s pie, and the radio. As far as you can tell from the kitchen, nothing happens.',
      'At five past ten Aunt Edwina finds you. “Bring the box. The study.” You carry it up the front stairs behind her.',
      '“It’s lighter than I thought,” you say. “Three years of a woman’s life usually are,” says Aunt Edwina.',
      'In the study you put the box on the desk and take a photograph for the insurance. Aunt Edwina looks behind both curtains (“forty years of publishing thrillers”) and pushes the window catch across.',
      'At eight minutes past ten she locks the study door. The lock sounds like a prison. “The spare key has been in the bank since 1998,” she says, and ties the key to your wrist with a ribbon and a knot of her own.',
      'In bed, you write it all down.'
    ], function () {
      ER.read({ html: SV.photoDoc('mine'), cls: 'photo', clue: { id: 'photo-mine', title: 'Your photograph, 10.06 pm', kind: 'Photograph' }, done: function () {
        ER.read({ html: SV.notesDoc(), cls: 'notes', clue: { id: 'notes', title: 'My notes, Saturday night', kind: 'Your notes' }, done: function () {
          ER.say('Somewhere in the house a clock strikes eleven. You sleep with your hand on the key.');
          setTimeout(function () { ER.leave(file); }, 3600);
        } });
      } });
    });
  }
})();
</script>
