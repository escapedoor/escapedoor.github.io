  $('#notes').addEventListener('click', function () {
    if (busy || ER.isOpen()) return;
    if (!ready()) { ER.say('“Talk to me first,” says Aunt Edwina, “and read the telephone book, and your notebook. Then your notes.”'); return; }
    openTwist();
  });

  /* ---------- the lock: your notes, two photographs, and the dinner ---------- */
  var TIMES = ['6.40', '7.15', '7.30', '8.12', '8.24', '8.30', '8.40', '8.47', '9.15', '9.25', '9.40', '9.50', '10.05'];
  var WHO = ['augusta', 'benedict', 'eunji', 'fenella', 'caspar', 'ferdy'];
  function openTwist() {
    var marks = ER.flag('li-marks') || {}, pins = ER.flag('li-pins') || {}, who = ER.flag('li-who') || null;
    var box = ER.el('div', 'tw');
    box.innerHTML =
      '<div class="stp" data-s="1"><h5>1 · Your own statement</h5><p class="say">Your notes from Saturday night. Mark every sentence, as you did in the study.</p><div class="s1"><div class="pp"></div><div class="mh"></div></div></div>' +
      '<div class="stp" data-s="2"><h5>2 · What your notes left out</h5><p class="ed">“Three assumptions,” says Aunt Edwina. “Nothing happened at dinner: you weren’t there. Nobody can get in now: quite right, as it turns out. And this one: <i>Aunt Edwina and I carried the manuscript up to the study.</i> You carried a box. You never saw inside it, and on the stairs you told me it was lighter than you thought. What else did your notes leave out?”</p><p class="say">The box at twenty to seven, and the box at six minutes past ten. Click the thing on the box in your photograph that is not as it was.</p>' +
      '<div class="phs"><div class="ph"><b>Ms Ahn · 6.41 pm · the library</b>' + SV.photoSvg('eunji') + '</div><div class="ph mine"><b>You · 10.06 pm · the study</b>' + SV.photoSvg('mine', true) + '</div></div></div>' +
      '<div class="stp" data-s="3"><h5>3 · The dinner you did not see</h5><p class="say">Pin the last time the box was known to be full, and the first time it was known to have been opened. Then choose the person who left the table between your pins and could carry four hundred pages out past the library door with nobody watching.</p>' +
      '<div class="pins"><span class="lab">pins:</span></div><div class="strip">' + TIMES.map(function (t) { return '<div class="notch" data-t="' + t + '"></div>'; }).join('') + '</div>' +
      '<div class="who">' + WHO.map(function (g) { return '<button type="button" class="pc2" data-g="' + g + '">' + CAST[g].who.replace(' ', '<br>') + '</button>'; }).join('') + '</div></div>' +
      '<div class="tw-row"><div class="tw-msg"></div><button type="button" class="btn" id="twGo">Check</button></div>';
    var msg = box.querySelector('.tw-msg'), go = box.querySelector('#twGo');
    function show() { ER.$$('.stp', box).forEach(function (s) { s.classList.toggle('on', +s.getAttribute('data-s') === step); }); go.textContent = step === 3 ? 'Say it to Aunt Edwina' : 'Check'; go.style.display = step === 2 ? 'none' : ''; pips(); }
    /* step 1 */
    SV.marks(box.querySelector('.mh'), [{ cls: 'sh-notes', head: 'My notes · Saturday night', sents: SV.NOTES }],
      { state: marks, pensHost: box.querySelector('.pp'), locked: function () { return step !== 1; }, change: function (s) { marks = s; ER.flag('li-marks', s); msg.textContent = ''; } });
    /* step 2 */
    box.querySelector('.ph.mine svg').addEventListener('click', function (e) {
      if (step !== 2 || !e.target.closest) return;
      var h = e.target.closest('[data-h]'); if (!h) return;
      var k = h.getAttribute('data-h');
      if (ER.check('diff', k)) {
        ER.sfx.ok(); step = 3; ER.flag('li-step', 3);
        msg.style.color = '#1f4a2f'; msg.textContent = 'The label is upside down. At twenty to seven it read the same way as DABNEY & FANE. Somebody had the lid off before you ever touched the box.';
        setTimeout(function () { msg.style.color = ''; msg.textContent = ''; show(); }, 4200);
        return;
      }
      ER.sfx.no();
      msg.textContent = /^(window|curtain|desk|ink)$/.test(k) ? 'That is the study. Look at the box itself.' : 'That part of the box is just as it was in Ms Ahn’s photograph.';
    });
    /* step 3 */
    var pinHome = box.querySelector('.pins');
    [['full', 'last known full'], ['open', 'first known opened']].forEach(function (p) {
      var n = ER.el('span', 'pin dnd-item ' + p[0], p[1]); n.setAttribute('data-p', p[0]);
      var at = pins[p[0]] ? box.querySelector('.notch[data-t="' + pins[p[0]] + '"]') : null;
      (at || pinHome).appendChild(n);
    });
    ER.dnd(box.querySelector('[data-s="3"]'), { item: '.pin', slot: '.notch', home: pinHome, lock: function () { return solved; },
      change: function () { pins = {}; ER.$$('.notch', box).forEach(function (n) { var q = n.querySelector('.pin'); if (q) pins[q.getAttribute('data-p')] = n.getAttribute('data-t'); }); ER.flag('li-pins', pins); msg.textContent = ''; } });
    function paintWho() { ER.$$('.pc2', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-g') === who); }); }
    ER.$$('.pc2', box).forEach(function (b) { b.addEventListener('click', function () { if (solved) return; who = b.getAttribute('data-g'); ER.flag('li-who', who); ER.sfx.click(); msg.textContent = ''; paintWho(); }); });
    paintWho();

    go.addEventListener('click', function () {
      if (solved) return;
      if (step === 1) {
        var empty = SV.NOTES.filter(function (n) { return !marks[n[0]]; }).length;
        if (empty) { msg.textContent = empty === 1 ? 'One sentence has no mark yet.' : empty + ' sentences have no mark yet.'; return; }
        var wrong = SV.NOTES.filter(function (n) { return !ER.check(n[0], marks[n[0]]); }).length;
        if (wrong) { ER.sfx.no(); msg.textContent = wrong === 1 ? '“One mark is wrong,” says Aunt Edwina. “Be as hard on yourself as you were on Augusta.”' : '“' + wrong + ' marks are wrong,” says Aunt Edwina. “Be as hard on yourself as you were on Augusta.”'; return; }
        ER.sfx.ok(); step = 2; ER.flag('li-step', 2); msg.textContent = ''; show();
        return;
      }
      if (step === 3) {
        if (!pins.full || !pins.open) { msg.textContent = 'Both pins go on the evening first.'; return; }
        if (!who) { msg.textContent = 'Choose a person.'; return; }
        var file = ER.exit([pins.full + '|' + pins.open + '|' + who], { wait: true });
        if (file) {
          solved = true; busy = true; pips();
          msg.style.color = '#1f4a2f'; msg.textContent = 'You say the name out loud. In the hall, somebody puts down a teacup.';
          setTimeout(function () {
            ER.closeAll();
            ER.narrate([
              '“Half past eight, a full box: Augusta lifted it,” says Aunt Edwina slowly. “Ten to ten, a label upside down: Fenella saw it. And at twenty to nine, Caspar went out to his car because he thought he had left the lights on, and came back with cold hands.”',
              '“He went past this door, to the front door and the drive, while the rest of us sat at dinner. Nobody watched him but Ms Ahn, and she only saw him go.”',
              'Through the window you can see the drive. Mr Boyd is walking out to his small green car in the rain, without a coat, as if he has only just remembered something.',
              'Behind him a taxi turns in at the gate. It is twenty to twelve.'
            ], function () { ER.leave(file); });
          }, 1600);
          return;
        }
        ER.sfx.no();
        if (!ER.check('full', pins.full)) msg.textContent = '“When did anybody last know the box was full?” says Aunt Edwina. “Somebody lifted it with her own hands.”';
        else if (!ER.check('open', pins.open)) msg.textContent = '“Who noticed the label before you did?” says Aunt Edwina. “Somebody who always notices lettering.”';
        else msg.textContent = '“Was that person out of the room between your two pins, and could they get past this door with nobody watching?” says Aunt Edwina. “Read Ms Ahn, and Mrs Beddoes.”';
      }
    });
    show();
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
