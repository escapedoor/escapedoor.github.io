  ER.init({
    theme: 'fantasy', story: 'names', storyTitle: 'A Name That Is True', id: 'hall', no: 'V', title: 'The Name-Hall',
    go: 'Go into the Hall',
    intro: [
      'Three of Mr Mottram&rsquo;s words were true: COM&middot;PANION shares your bread, PER&middot;EGRINE goes through the fields, DIS&middot;ASTER is a bad star. The fourth was not. SINE is never fixed to the front of a word (without, at the front, is SE-, as in secure), and sincerus is one old word, clean and whole, whose parts nobody knows. There was never any wax. He unsaid it, and the end-gate opened.',
      'The Name-Hall is where every name in Utter is written down. The Namewright is asleep in her own chair by the fire, under a rug, snoring in a dignified way.',
      'It is a quarter past eleven. At midnight the Year-Name must be said at the Spring.'
    ],
    exit: {"next":"stair","w":{"5e2f3c12":"d00e4b6f"}}, tags: {"m1":["a83262ab"],"m2":["2d4fd0f9"],"m3":["ff9f8407"],"m4":["3e3ede54"],"m5":["2c919d96"],"q1":["d26d8627"],"q2":["93db2c41"],"q3":["f0fa83f6"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('h-file') || null;

  var REGISTER = '<h4>The Register: the first name</h4>' +
    '<p>The first thing named in Utter was the Spring, and its name was the first name ever cut. The founders built it to say everything the Spring can do, so that the Spring should never want for a name. Then they saw what they had made: called by that name, the Spring would do all of it, at once.</p>' +
    '<p>So it was cut on five tiles, and the tiles were shut in the case in this Hall, out of their order, each behind its own shutter; and only one shutter can be open at a time. No one has seen the name whole since, and no one says it.</p>' +
    '<p>Every Namewright must know what it asks, so that she never asks it again. A Year-Name may never use a root of the first name, nor any part that asks for all.</p>' +
    '<p><b>OMNI-</b>: all, every. <i>omnibus</i> (a carriage for all), <i>omnivore</i> (an animal that eats every kind of food).</p>' +
    '<p>Never lay the tiles out in order.</p>';
  var LEDGER = '<h4>The Ledger of Year-Names</h4>' +
    '<p>On every Year-Night the Namewright cuts a new name on a tile of baked earth, and says it at the Spring at midnight. Every one is written here. The last six:</p><table>' +
    '<tr><td>Year 411</td><td><b>RE&middot;CURR&middot;ENT</b> running again <span class="note">R.N.</span></td></tr>' +
    '<tr><td>Year 410</td><td><b>RE&middot;FUND&middot;ENT</b> pouring again <span class="note">R.N.</span></td></tr>' +
    '<tr><td>Year 409</td><td><b>RE&middot;VEN&middot;ENT</b> coming again <span class="note">R.N.</span></td></tr>' +
    '<tr><td>Year 408</td><td><b>RE&middot;NASC&middot;ENT</b> being born again <span class="note">A spring is born again every year, if you think about it. I did. R.N.</span></td></tr>' +
    '<tr><td>Year 407</td><td><b>RE&middot;SALI&middot;ENT</b> leaping again <span class="note">R.N.</span></td></tr>' +
    '<tr><td>Year 406</td><td><b>RE&middot;PLE&middot;ENT</b> filling again <span class="note">R.N.</span></td></tr></table>' +
    '<p>Every Year-Name has begun RE-, again, and ended -ENT, doing it. The Spring will not answer to a root that it has heard in the last six years.</p>';
  var TILES = [['FLU', 'flu'], ['OMNI', 'omni'], ['ENT', 'ent'], ['AQU', 'aqu'], ['EF', 'ef']];
  var WHERE = { flu: 'The Gate List has it, with fluid and fluent to prove it.', omni: 'The Register gives OMNI-, with omnibus and omnivore to prove it.',
    ent: 'It is an end, not a root: the Gate List and the Lamplighters&rsquo; Board both give it.', aqu: 'The Gate List has it, with aquatic to prove it.', ef: 'The Gate List has it: EX- is written EF- before F.' };
  var MEANS = [['flow', 'flow'], ['all', 'all, every'], ['doing', 'doing it, now'], ['water', 'water'], ['out', 'out'], ['earth', 'earth'], ['sea', 'the sea'],
    ['light', 'light'], ['sleep', 'sleep'], ['under', 'under'], ['rise', 'rise'], ['carry', 'carry']];
  var Q = [
    ['q1', 'It is the name of', [['spring', 'the Spring'], ['sea', 'the sea'], ['stair', 'the Water-Stair'], ['bridge', 'the Asking Bridge']]],
    ['q2', 'Called by it, the Spring would', [['year', 'give one more year of water, and no more'], ['every', 'give every drop of water under the hill, all at once'], ['sleep', 'go to sleep for a year'], ['carry', 'carry the city down into the sea']]]
  ];
  var QSAY = {
    'q1.sea': 'Read the parts again: OUT, and FLOW. Does water flow out of the sea, or into it?',
    'q1.stair': 'The Stair leads the water down. Is there a part for leading behind any shutter?',
    'q1.bridge': 'There is no carrying, and no asking, behind any shutter.',
    'q2.year': 'One more year, and no more? Look behind shutter II again.',
    'q2.sleep': 'There is no sleep in it. You have seen what a name with SOMN in it can do.',
    'q2.carry': 'There is no carrying in it. The city would go down the hill all right, but not because anything carried it.'
  };

  function said(k) { return ER.flag('h-' + k); }
  function ready() { return said('quintus') && said('register') && said('ledger'); }
  function hints() {
    if (nextFile) return ['go', ['Up the Water-Stair to the Spring. It is twenty minutes to midnight.']];
    if (ready()) return ['case', [
      'Open one shutter at a time and give each tile its meaning. The Gate List has four of them; the Register has the one that is new.',
      'EF is EX- before F. ENT is doing it. When you have all five meanings, ask: what does water flow OUT of? And what would ALL ask for?',
      'The Register forbids two things in a Year-Name: a root of the first name, and a part that asks for all. A front or an end is not a root. And look at the Ledger: how does every Year-Name end?'
    ]];
    return ['start', [
      'Talk to Mr Merridew behind the lectern, and read the Register open on it.',
      'Read the Ledger of Year-Names on the stand beside the lectern. Then go to the case on the plinth in the middle of the Hall.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#case').setAttribute('class', 'hot' + (ready() && !nextFile ? ' nudge' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips((ready() ? 1 : 0) + (nextFile ? 1 : 0), 2);
  }
  var snoreT = setInterval(function () { if (!ER.isOpen()) NM.sfx.snore(); }, 10000);
  function begin() {
    paint();
    if (nextFile) { ER.say('The Name-Hall. The case of the first name is shut, and all its shutters are down.'); return; }
    if (said('quintus')) { ER.say('The Name-Hall. The case of the first name stands on its plinth.'); return; }
    busy = true;
    ER.narrate([
      'A tall room lined with ledgers, a fire, a painting of four people in old robes holding chisels, and a window that looks up the hill to where the Water-Stair climbs into the dark.',
      'In the middle of the floor, on a stone plinth, is a case of iron and old glass, with five little shuttered windows along its front.',
      'Mr Merridew is already at the great lectern, with the Register open in front of him and a candle at his elbow. He does not look up.'
    ], function () { busy = false; });
  }
  function readDoc(id, html, cls, title, kind, words) {
    if (busy) return;
    ER.read({ html: html, cls: cls, clue: { id: 'h-' + id, title: title, kind: kind },
      done: function () { ER.flag('h-' + id, 1); if (words) NM.learn(words); paint(); } });
  }
  $('#register').addEventListener('click', function (e) { e.stopPropagation(); readDoc('register', REGISTER, 'register', 'The Register: the first name', 'The Register', ['first name', 'omnibus', 'omnivore']); });
  $('#ledger').addEventListener('click', function (e) { e.stopPropagation(); readDoc('ledger', LEDGER, 'register', 'The Ledger of Year-Names', 'The Ledger', ['Year-Name', 'ledger']); });
  $('#quintus').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (said('quintus')) { ER.say(nextFile ? '&ldquo;Twenty minutes,&rdquo; says Mr Merridew. &ldquo;I have written down that you will be in time.&rdquo;' : '&ldquo;The Register, the Ledger, the case,&rdquo; says Mr Merridew. &ldquo;In that order. I shall hold the candle and not look.&rdquo;'); return; }
    ER.talk({
      who: CAST.quintus.who, role: CAST.quintus.role, face: FACE('quintus'),
      lines: [
        { note: 'He puts his pen down. It is the first time you have seen him do it.', a: '&ldquo;She will sleep until sunrise. The Year-Name must be said at the Spring at midnight, by the Namewright or by her apprentice. I am a clerk. A clerk copies names; he does not build them, and the Spring would not answer me if I did.&rdquo;' },
        { q: 'So it has to be me.', a: '&ldquo;It has to be you. And before you build anything, you must know what the first name asks, so that you never ask it again. That is why the case is here. Read the Register first. I shall hold the candle, and not look. I am very good at not looking.&rdquo;' },
        { q: 'What happens if no Year-Name is said?', a: '&ldquo;The Spring sleeps for a year. The fountains stop at dawn, the Stair runs dry, and Utter drinks rain until the next Year-Night. It has never happened. It will not happen tonight. I have written that down.&rdquo;' },
        { q: 'Is there anything else I should read?', a: '&ldquo;The Ledger, on the stand beside me. Every Year-Name she has cut, and the rule about roots. You will need both before the night is out.&rdquo;' }
      ],
      clue: { id: 'quintus2', title: 'Mr Merridew, in the Name-Hall', kind: 'What he said' }, last: 'Thank you',
      done: function (ok) { if (ok) { ER.flag('h-quintus', 1); paint(); } }
    });
  });
  $('#romola').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    var n = NM.bump('h-rom');
    NM.sfx.snore();
    ER.say(n === 1 ? 'The Namewright stirs in her sleep and murmurs something. You lean closer. &ldquo;&hellip;it rises,&rdquo; she says. &ldquo;&hellip;always rises&hellip;&rdquo; Then she snores again.' : 'Mistress Nettleship is fast asleep, with the rug up to her chin. &ldquo;&hellip;rises&hellip;&rdquo; she murmurs.');
  });
  $('#peregrine').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.say('&ldquo;I shall not tell you a single word tonight,&rdquo; says Mr Mottram, holding his hands to the fire. &ldquo;Well. Perhaps a true one, if you ask. They are harder to find than you would think.&rdquo;');
  });
  NM.thing('#window', null, 'Through the window: the roofs of Utter, a few lights, and the Water-Stair climbing the top of the hill to a small dark arch. The basins catch a little starlight, but not much. There is not much water in them.', isBusy);
  NM.thing('#portrait', null, 'The founders of Utter, four of them, each holding a chisel and looking pleased with themselves. They have no names on the frame. Perhaps they thought that was safer.', isBusy);
  NM.thing('#shelves', null, 'Ledgers from floor to ceiling: every name ever cut in Utter, with its parts. Four hundred and eleven years of it.', isBusy);
  $('#case').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('The case of the first name, with all five shutters down. Mr Merridew has locked it, twice.'); return; }
    if (!said('quintus') || !said('register')) { ER.say('A case of iron and old glass with five shuttered windows. Talk to Mr Merridew, and read the Register, before you touch it.'); return; }
    if (!said('ledger')) { ER.say('Read the Ledger of Year-Names on the stand first. Mr Merridew says you will need it.'); return; }
    openCase();
  });

  /* ---------- the case ---------- */
  function openCase() {
    var box = ER.el('div', 'pz cs'), st = ER.flag('h-case') || { m: {}, q: {}, n: {} }, open = 0, s = '', done = false;
    s = '<h4>The case of the first name</h4><h5>Open one shutter at a time, and give the tile behind it its meaning. Then say what the name is, and what it would do. Never lay the tiles out in order.</h5><div class="cs-wins">';
    TILES.forEach(function (t, i) {
      s += '<div class="win" data-w="' + (i + 1) + '"><span class="nm">SHUTTER ' + ['I', 'II', 'III', 'IV', 'V'][i] + '</span><button type="button" class="sh" data-w="' + (i + 1) + '">SHUT</button><span class="mean"></span></div>';
    });
    s += '</div><div class="cs-chips"><span>THE OPEN TILE MEANS</span>';
    MEANS.forEach(function (m) { s += '<button type="button" data-m="' + m[0] + '">' + m[1] + '</button>'; });
    s += '</div>';
    Q.forEach(function (q) {
      s += '<div class="cs-q" data-q="' + q[0] + '"><b>' + q[1] + '</b><div>';
      q[2].forEach(function (o) { s += '<button type="button" data-q="' + q[0] + '" data-o="' + o[0] + '">' + o[1] + '</button>'; });
      s += '</div></div>';
    });
    s += '<div class="cs-q" data-q="q3"><b>A Year-Name must never use the part behind shutter</b><div>';
    ['I', 'II', 'III', 'IV', 'V'].forEach(function (r, i) { s += '<button type="button" data-n="' + (i + 1) + '">' + r + '</button>'; });
    s += '</div></div><div class="foot"><button type="button" class="lay" id="cs-lay">Lay the tiles out in order</button><button type="button" class="btn" id="cs-go">Seal the case</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function label(id) { var m = MEANS.filter(function (x) { return x[0] === id; })[0]; return m ? m[1] : ''; }
    function paintC() {
      ER.$$('.win', box).forEach(function (w) {
        var i = +w.getAttribute('data-w'), b = w.querySelector('.sh');
        b.classList.toggle('open', open === i); b.textContent = open === i ? TILES[i - 1][0] : 'SHUT';
        w.querySelector('.mean').textContent = st.m[i] ? label(st.m[i]) : '';
      });
      ER.$$('.cs-q button[data-o]', box).forEach(function (b) { b.classList.toggle('on', st.q[b.getAttribute('data-q')] === b.getAttribute('data-o')); });
      ER.$$('.cs-q button[data-n]', box).forEach(function (b) { b.classList.toggle('on', !!st.n[b.getAttribute('data-n')]); });
    }
    function clear() { ER.$$('.win, .cs-q', box).forEach(function (x) { x.classList.remove('bad'); }); }
    box.addEventListener('click', function (e) {
      if (done) return;
      var t = e.target.closest ? e.target : null; if (!t) return;
      var sh = t.closest('.sh'), mc = t.closest('.cs-chips button'), qb = t.closest('.cs-q button[data-o]'), nb = t.closest('.cs-q button[data-n]');
      if (sh) { var w = +sh.getAttribute('data-w'); open = open === w ? 0 : w; NM.sfx.tile(); clear(); paintC(); if (open) msg('Shutter ' + ['I', 'II', 'III', 'IV', 'V'][open - 1] + ' is open, and the others have dropped shut by themselves.'); return; }
      if (mc) { if (!open) { msg('Open a shutter first. The meaning goes to the tile behind the open shutter.'); return; } st.m[open] = mc.getAttribute('data-m'); NM.sfx.rub(); clear(); paintC(); ER.flag('h-case', st); return; }
      if (qb) { st.q[qb.getAttribute('data-q')] = qb.getAttribute('data-o'); NM.sfx.tile(); clear(); paintC(); ER.flag('h-case', st); return; }
      if (nb) { var n = nb.getAttribute('data-n'); if (st.n[n]) delete st.n[n]; else st.n[n] = 1; NM.sfx.tile(); clear(); paintC(); ER.flag('h-case', st); }
    });
    box.querySelector('#cs-lay').addEventListener('click', function () {
      if (done) return;
      NM.miss(); open = 0; paintC();
      msg('Mr Merridew&rsquo;s hand comes down flat on the lid, very fast for a clerk. &ldquo;No. Not in order. Not ever. You need what it <b>means</b>, not what it <b>says</b>.&rdquo; <i>He takes his hand away, slowly.</i>');
    });
    box.querySelector('#cs-go').addEventListener('click', function () {
      if (done) return;
      var i, w, never, file, bad;
      clear();
      for (i = 1; i <= 5; i++) if (!st.m[i]) { box.querySelector('.win[data-w="' + i + '"]').classList.add('bad'); msg('<b>Shutter ' + ['I', 'II', 'III', 'IV', 'V'][i - 1] + '</b> has no meaning given yet.'); return; }
      if (!st.q.q1 || !st.q.q2) { box.querySelector('.cs-q[data-q="' + (!st.q.q1 ? 'q1' : 'q2') + '"]').classList.add('bad'); msg('You have not said ' + (!st.q.q1 ? 'what it is the name of.' : 'what it would do.')); return; }
      never = Object.keys(st.n).sort().join('.');
      if (!never) { box.querySelector('.cs-q[data-q="q3"]').classList.add('bad'); msg('Which parts may a Year-Name never use? The Register says.'); return; }
      for (i = 1; i <= 5; i++) {
        if (!ER.check('m' + i, st.m[i])) {
          NM.miss(); w = TILES[i - 1]; box.querySelector('.win[data-w="' + i + '"]').classList.add('bad');
          msg('<b>Shutter ' + ['I', 'II', 'III', 'IV', 'V'][i - 1] + ':</b> the tile behind it does not mean &ldquo;' + label(st.m[i]) + '&rdquo;. ' + WHERE[w[1]] + ' <i>Open it again and look.</i>');
          return;
        }
      }
      for (i = 0; i < 2; i++) {
        if (!ER.check(Q[i][0], st.q[Q[i][0]])) { NM.miss(); box.querySelector('.cs-q[data-q="' + Q[i][0] + '"]').classList.add('bad'); msg(QSAY[Q[i][0] + '.' + st.q[Q[i][0]]] || 'Read the five meanings together, in your head.'); return; }
      }
      if (!ER.check('q3', never)) {
        NM.miss(); box.querySelector('.cs-q[data-q="q3"]').classList.add('bad');
        if (st.n[3]) bad = 'Behind shutter III is an end, not a root, and every Year-Name in the Ledger ends with it. The Spring answered every one.';
        else if (st.n[5]) bad = 'Behind shutter V is a front, not a root, and it does not ask for all. The Register forbids the roots of the first name, and any part that asks for all.';
        else if (!st.n[2]) bad = 'One of the five asks for all. The Register forbids it in so many words.';
        else bad = 'The Register forbids every root of the first name. Which of the five tiles are roots?';
        msg(bad); return;
      }
      file = ER.exit([[1, 2, 3, 4, 5].map(function (i) { return st.m[i]; }).join('.') + '-' + st.q.q1 + '-' + st.q.q2 + '-' + never], { wait: true });
      if (!file) { msg('The case does not seal. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('h-file', file); busy = true; open = 0; paintC();
      msg('All the water, flowing out, now: and you never once saw it whole.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2400);
    });
    paintC();
    msg('Five shutters. Only one opens at a time.');
    ER.open('ov-lock', box);
  }
  function solvedNow() {
    NM.sfx.stone(); paint();
    ER.narrate([
      'You give Mr Merridew the meanings, one at a time, out of their order, as the case gives them: flow; all; doing it, now; water; out. He writes each one down without looking at the case.',
      '&ldquo;Every drop of water under the hill,&rdquo; he says, &ldquo;out of it, all at once. Utter would go down to the harbour in one piece. Roughly.&rdquo; He locks the case, and then, after a moment, locks it again.',
      '&ldquo;So the Year-Name may not use FLU, nor AQU, nor OMNI. It may use a front or an end that the first name has: every Year-Name in the Ledger ends -ENT, and the Spring has answered every one.&rdquo;',
      'He takes a small book from the shelf behind the lectern and gives it to Mr Mottram to carry. &ldquo;Her own book of the Year-Night. Her rules. She would want you to have it.&rdquo; By the fire, the Namewright murmurs in her sleep, &ldquo;&hellip;rises&hellip;&rdquo;',
      '&ldquo;Twenty minutes to midnight,&rdquo; says Mr Merridew. &ldquo;The Water-Stair is behind the Hall. Go.&rdquo;'
    ], function () {
      NM.mine('n-hall', 'What the first name asks (never say it)', '<p>Behind the shutters, out of order: FLU (flow), OMNI (all), ENT (doing it), AQU (water), EF (out).</p><p>It is the name of the SPRING: water flows OUT of it.</p><p>Called, it would give every drop of water under the hill, all at once.</p><p>A Year-Name may NEVER use: FLU, OMNI, AQU. It may use a front or an end (all Year-Names end -ENT).</p><p>Not in the last six years: CURR, FUND, VEN, NASC, SALI, PLE.</p>');
      NM.learn(['shutter', 'omni-']);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) { clearInterval(snoreT); ER.leave(nextFile); } });
})();
</script>
</body>
</html>
