    ['cera', 'CERA', '<p><b>CERA.</b> Wax. CERUMEN: the wax in your ear. (The Builders thought this was funny, and so it is.)</p>'],

      'Nine tags, nine crates. TERR&middot;IER is the earth-dog that goes into burrows; TERRA&middot;COTTA is baked earth; TERR&middot;IFIC holds the other TERR, the TERR of terror. PARA&middot;SOL keeps off the sun, and SOLITAIRE holds SOLUS, alone. IN&middot;FLU&middot;ENZA, flowing in, is a cold; PORT&middot;MANTEAU carries a cloak; CURR&middot;ENCY runs from hand to hand. Crate two was the Namewright&rsquo;s: a tile of baked earth, to cut the Year-Name on.',

  var PLAQUE = '<h4>The Asking Bridge</h4><h5>cut on the post of the end-gate</h5>' +
    '<p>Ask me politely, and I will carry you. Say nothing untrue upon me. If anything untrue is said upon me, my end-gate stays shut until it is unsaid.</p>' +
    '<h5>The Builders&rsquo; Stones</h5>' +
    '<p>The Builders cut one word into each stone of this parapet, with its parts, as the Old Tongue made it. They are the oldest record of the Old Tongue in Utter: older than the Register, older than any guide.</p>' +
    '<p>Each stone tells you what a word is made of. It does not tell you what anybody says about it. When a story about a word and a stone disagree, believe the stone.</p>';
  var CLAIMS = [
    ['companion', '&ldquo;COMPANION. COM, with, and PANIS, bread. Your companion is the one you share your bread with. I have a sandwich in my pocket, so I qualify.&rdquo;', 'COMPANION: with + bread'],
    ['peregrine', '&ldquo;PEREGRINE: that&rsquo;s me. PER, through, and AGER, a field. One who goes through the fields: a traveller from far away. My mother had high hopes. I have been as far as the harbour.&rdquo;', 'PEREGRINE: through + field'],

      'At the far end there is a little iron end-gate between two posts. It stays shut. Mr Mottram pushes it. It stays shut. &ldquo;Ah,&rdquo; he says. &ldquo;Something has been said.&rdquo;'
    ], function () { busy = false; });
  }

    Object.keys(st.r).forEach(function (i) { var t = tray.querySelector('[data-r="' + st.r[i] + '"]'), sl = box.querySelector('.rslot[data-i="' + i + '"]'); if (t && sl) sl.appendChild(t); });
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintV() {
      ER.$$('.claim .v', box).forEach(function (b) { b.classList.toggle('on', st.v[b.getAttribute('data-i')] === b.getAttribute('data-v')); });
      ER.$$('.rslot', box).forEach(function (sl) { sl.classList.toggle('full', !!sl.querySelector('.rub')); });
    }
    function clear() { ER.$$('.claim', box).forEach(function (c) { c.classList.remove('bad'); }); }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.claim .v') : null; if (!b || done) return;
      st.v[b.getAttribute('data-i')] = b.getAttribute('data-v'); NM.sfx.tile(); clear(); paintV(); ER.flag('b-desk', st);
    });
    ER.dnd(box, { item: '.rub', slot: '.rslot', home: tray, lock: function () { return done; }, change: function () {
      st.r = {}; ER.$$('.rslot', box).forEach(function (sl) { var t = sl.querySelector('.rub'); if (t) st.r[sl.getAttribute('data-i')] = t.getAttribute('data-r'); });
      clear(); paintV(); ER.flag('b-desk', st);
    } });
    box.querySelector('#us-go').addEventListener('click', function () {
      if (done) return;
      var i, c, card, r, file;
      clear();
      for (i = 1; i <= 4; i++) {
        card = box.querySelector('.claim[data-i="' + i + '"]');
        if (!st.v[i]) { card.classList.add('bad'); msg('<b>' + CLAIMS[i - 1][0].toUpperCase() + ':</b> true, or untrue? You have not said.'); return; }
        if (!st.r[i]) { card.classList.add('bad'); msg('<b>' + CLAIMS[i - 1][0].toUpperCase() + ':</b> no rubbing pinned. The plaque says believe the stones, so a stone must show it.'); return; }
      }
      for (i = 1; i <= 4; i++) {
        c = CLAIMS[i - 1][0]; card = box.querySelector('.claim[data-i="' + i + '"]'); r = st.r[i];
        if (!ER.check('v' + i, st.v[i])) {
          NM.miss(); card.classList.add('bad');
          msg(st.v[i] === 'u'
            ? '<b>' + c.toUpperCase() + ', untrue?</b> The Gate List gives you the front of it. Read the stones again: is there one that gives you the rest, and does it agree with Mr Mottram? <i>The end-gate does not move.</i>'
            : '<b>' + c.toUpperCase() + ', true?</b> The end-gate is shut, so something said on the Bridge was untrue. Look hard at both halves of this one: which half has a stone for it, and which has a stone against it? <i>The end-gate does not move.</i>');
          return;
        }
      }
      for (i = 1; i <= 4; i++) {
        c = CLAIMS[i - 1][0]; card = box.querySelector('.claim[data-i="' + i + '"]'); r = st.r[i];
        if (!ER.check('r' + i, r)) {
          NM.miss(); card.classList.add('bad');
          msg('<b>' + c.toUpperCase() + '.</b> ' + RUBSAY[r] + ' ' + (r === 'cera'
            ? 'That is true, and Mr Mottram knew it: it proves the half of his story that is true, so it cannot show that the story is untrue.'
            : 'Does that show what you have marked about ' + c.toUpperCase() + '?') + ' <i>The end-gate does not move.</i>');
          return;
        }
      }
      file = ER.exit([[1, 2, 3, 4].map(function (i) { return st.v[i]; }).join('')], { wait: true });
      if (!file) { msg('The Bridge does not answer. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('b-file', file); busy = true;
      ER.$$('.claim', box).forEach(function (x) { x.classList.add('ok'); });
      msg('Three things true, with a stone for each; and one thing untrue, with a stone against it.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2400);
    });
    paintV();
    msg('Eight rubbings. Four things said.');
    ER.open('ov-lock', box);
  }
  function solvedNow() {
    ER.narrate([
      'You show Mr Mottram the rubbings. He reads the stone for SINE, and the stone for SINCERE, and then he reads them again, with his lips moving.',
      '&ldquo;Oh,&rdquo; he says. And then, to the Bridge, with his hat off: &ldquo;I take it back. SINCERE is one old word, and nobody knows its parts; and SINE is never put on the front of anything. There was never any wax. I am sorry.&rdquo; The end-gate swings open with a small, forgiving creak.',
      '&ldquo;Twenty years,&rdquo; he says. &ldquo;A good story is a very hard thing to give up. I shall tell them the true one. It is shorter, and I shall have to make up the difference with my face.&rdquo;',
      'Then he stops on the first step. &ldquo;But mark this. CERA really does mean wax. That was a true part, in an untrue story. A name can be built the same way, out of true-looking parts. Remember that at the Spring.&rdquo;'
    ], function () {
      paint();
      NM.mine('n-bridge', 'What was said on the Bridge', '<p>COM&middot;PANION: with + bread (PANTRY). TRUE.</p><p>PER&middot;EGRINE: through + field (AGRICULTURE). TRUE.</p><p>DIS&middot;ASTER: badly + star (ASTRONOMY). TRUE.</p><p>SINCERE ≠ &ldquo;sine cera&rdquo;. UNTRUE. SINE is never a prefix (without at the front = SE-, as in SECURE); sincerus is one old word, clean and whole.</p><p>A true part (CERA = wax) can sit in an untrue story.</p>');
      NM.learn(['companion', 'peregrine', 'disaster', 'sincere', 'secure', 'folk etymology']);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
