(function () {
  var $ = ER.$, sc = $('#scene'), busy = false, nextFile = null;

  (function () {
    var s = '', i, x, t;
    for (i = 0; i < 14; i++) { x = -360 + i * 170; s += '<path d="M' + x + ' 520V300a60 60 0 0 1 120 0V520z"/>'; }
    $('#arcade').innerHTML = s; s = '';
    for (i = 0; i < 17; i++) {
      t = i / 16; x = -200 + t * 2000;
      var y = (t <= 0.5) ? (120 + 140 * Math.sin(Math.PI * t * 2) * 0.55) : (120 + 140 * Math.sin(Math.PI * (t - 0.5) * 2) * 0.55);
      s += '<g class="bulb"><circle cx="' + x.toFixed(0) + '" cy="' + (y + 8).toFixed(0) + '" r="46" fill="url(#bulbG)"/><circle cx="' + x.toFixed(0) + '" cy="' + (y + 8).toFixed(0) + '" r="6" fill="' + ['#ffd27a', '#ff9a7a', '#a8e0a0'][i % 3] + '"/></g>';
    }
    $('#bulbs').innerHTML = s; s = '';
    for (i = 0; i < 9; i++) {
      var cx = 960 + (i % 3) * 124, cy = 520 + Math.floor(i / 3) * 100;
      s += '<g id="crate' + (i + 1) + '"><rect x="' + cx + '" y="' + cy + '" width="118" height="94" fill="url(#woodM)" stroke="#3a2410" stroke-width="3"/>' +
        '<path d="M' + cx + ' ' + (cy + 31) + 'h118M' + cx + ' ' + (cy + 62) + 'h118" stroke="#3a2410" stroke-width="2" opacity=".6"/>' +
        '<text x="' + (cx + 22) + '" y="' + (cy + 30) + '" class="st" font-size="22" fill="#f4e2bc">' + (i + 1) + '</text>' +
        '<circle cx="' + (cx + 100) + '" cy="' + (cy + 16) + '" r="5" fill="none" stroke="#2a1a0c" stroke-width="2"/></g>';
    }
    $('#crates').innerHTML = s;
  })();

  ER.init({
    theme: 'fantasy', story: 'names', storyTitle: 'A Name That Is True', id: 'market', no: 'III', title: 'The Market of Named Things',
    go: 'Into the market square',
    intro: [
      'Three lamps were safe to call: NOCT&middot;I&middot;LUC&middot;ENT, shining at night; LUMIN&middot;OUS, full of light; IL&middot;LUMIN&middot;ANT, putting light on (IL- here is IN-, not &ldquo;not&rdquo;). TRANS&middot;LUC&middot;ENT only lets light through, DORM&middot;ANT is asleep itself, and LUCR&middot;ATIVE brings in money: LUCR is not LUC. Lamp six, which Noll built himself, is SOMN&middot;I&middot;LUC&middot;ENT, shining sleep. Insomnia is IN-, not, and SOMN, sleep.',
      'The Market of Named Things stays open until the last lamp of the year goes out. In Utter nothing is unwrapped before it is named and paid for, so everything is sold in a shut crate with its name on a tag.',
      'The Namewright&rsquo;s order is waiting at stall nine. Or it was, until a gust of wind.'
    ],
    exit: {"next":"bridge","w":{"f95ffda7":"9c6fa69f"}}, tags: {"k1":["0b171bc7"],"k2":["d07acce0"],"k3":["881ac3ec"],"k4":["c3bac237"],"k5":["4009292c"],"k6":["65f25bae"],"k7":["67365359"],"k8":["3f7292be"],"k9":["fe873e73"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('m-file') || null;

  var PRIMER = '<span class="pg">PAGE 9</span><h4>THE SCRIBES&rsquo; PRIMER</h4><h3>Wholes and parts</h3>' +
    '<p><b>1.</b> The parts of a name tell you what it has to do with. The whole may mean more. EQUINOX is &ldquo;equal night&rdquo;, but it is the name of a day: the day in March or September when night and day are the same length. MEDITERRANEAN is &ldquo;in the middle of the land&rdquo;, and it is a sea.</p>' +
    '<p><b>2.</b> Two names can share a root and be things that have nothing to do with each other. A MARINE is a soldier who serves at sea; ULTRAMARINE, &ldquo;from beyond the sea&rdquo;, is a blue paint.</p>' +
    '<p><b>3.</b> Some names only look as if they hold a root. A MARIGOLD is Mary&rsquo;s gold, a flower: it has no sea in it. When a part seems wrong, try another root, or none.</p>' +
    '<p>So: read the parts, and then ask what the whole thing is.</p>';
  var TICKET = '<h4>An order ticket, in the Namewright&rsquo;s bag</h4><p>STALL NINE &middot; MRS P. NOCKLES</p><p>For the Namewright, for the Year-Night:</p><p>ONE SQUARE OF BAKED EARTH, to cut the Year-Name on.</p><p>Paid. P.N.</p>';
  var CRATES = [
    'Scratching, very fast. Something has dug through the bottom of its crate and into the earth below it. It barks once, pleased with itself.',
    'A clink. Flat, square things, red, baked as hard as stone.',
    'A fizz, a hiss, and a bang that makes the whole market jump. A smell of smoke.',
    'Something opens over your head like a flower, and throws a round shadow, as if the sun were out.',
    'The click of pegs on a board, and a small voice that says &ldquo;Your move,&rdquo; and then &ldquo;My move.&rdquo; It is playing on its own.',
    'Slop and splash. Through a knot-hole: water, weed, and small silver fish going round and round.',
    'A sneeze. Then Mrs Nockles sneezes, and then Mr Mottram.',
    'Heavy, made of leather, with two halves that open like a book. It smells of a long journey and somebody else&rsquo;s coat.',
    'Coins, running through your fingers like water, from one hand to the next.'
  ];
  var TAGS = [['terrier', 'TERRIER'], ['terracotta', 'TERRACOTTA'], ['terrific', 'TERRIFIC'], ['parasol', 'PARASOL'], ['solitaire', 'SOLITAIRE'], ['aquarium', 'AQUARIUM'],
    ['influenza', 'INFLUENZA'], ['portmanteau', 'PORTMANTEAU'], ['currency', 'CURRENCY'], ['solarium', 'SOLARIUM'], ['terrain', 'TERRAIN']];
  var SAYS = {
    terrier: 'TERR&middot;IER: the earth-dog, a small dog that goes down into the earth after rabbits. The crate scrabbles at its boards.',
    terracotta: 'TERRA&middot;COTTA: baked earth, the red stuff that pots and tiles are made of. The crate goes stiff, and red, and hard.',
    terrific: 'Not the TERR of the earth: the TERR of terror and terrify. TERR&middot;IFIC is making terror. (The outside world now uses it for anything very good, which tells you something about the outside world.) The crate gives a small bang.',
    parasol: 'PARA&middot;SOL: keeping off the sun. The crate tries to open over your head like a flower.',
    solitaire: 'Not SOL, the sun: SOLUS, alone. SOLITAIRE is a game that one person plays alone (or a jewel set on its own). The crate goes quiet, and plays with itself.',
    aquarium: 'AQU&middot;ARIUM: a place for water: a glass tank with fish in it. The crate begins to leak.',
    influenza: 'IN&middot;FLU&middot;ENZA: flowing in. People once believed that this illness flowed into them from the stars; now it is the name of a heavy cold with a fever. The crate sneezes.',
    portmanteau: 'PORT&middot;MANTEAU: carry and cloak. A big leather travelling bag that opens in two halves. The crate tries to fold itself in half.',
    currency: 'CURR&middot;ENCY: running. Money that runs from hand to hand. The crate jingles.',
    solarium: 'SOL&middot;ARIUM: a place for the sun, a glass room to sit in the sunshine. No crate could hold a room. (Mrs Nockles has none in.)',
    terrain: 'TERR&middot;AIN: land, a stretch of country as it lies. No crate could hold a stretch of country.'
  };

  function said(k) { return ER.flag('m-' + k); }
  function ready() { return said('prudence') && said('primer') && said('ticket'); }
  function hints() {
    if (nextFile) return ['go', ['You have the Namewright&rsquo;s tile. The Asking Bridge is across the square: follow Mr Mottram.']];
    if (ready()) return ['tags', [
      'Tap each crate to hear what is inside, then read each tag in its parts, with the Gate List. There are eleven tags for nine crates: two of them name things that no crate could hold.',
      'Three tags begin TERR, and they are three quite different things: a dog, a baked tile, and a firework that has nothing to do with earth. Two have SOL in them, and only one of those is the sun.',
      'An earth-dog digs; baked earth clinks; TERRIFIC holds the TERR of terror. PARA&middot;SOL keeps the sun off; SOLITAIRE holds SOLUS, alone. IN&middot;FLU&middot;ENZA, flowing in, is an illness; PORT&middot;MANTEAU carries a cloak; CURR&middot;ENCY runs from hand to hand.'
    ]];
    return ['start', [
      'Talk to Mrs Nockles behind the counter of stall nine.',
      'Look in the Namewright&rsquo;s bag on the counter: there is a page from a book, and an order ticket. Then go to the crates.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#crates').setAttribute('class', 'hot' + (ready() && !nextFile ? ' nudge' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips((ready() ? 1 : 0) + (nextFile ? 1 : 0), 2);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Stall nine, with every crate tagged. The Asking Bridge is across the square.'); return; }
    if (said('prudence')) { ER.say('The Market of Named Things. Stall nine, and its crates.'); return; }
    busy = true;
    ER.narrate([
      'A square with arcades all round it, strings of coloured lanterns, and stalls closing up for the night. In the middle, a fountain, very low. One thin trickle runs from its spout, and stops, and runs again.',
      'At stall nine, under a green and cream awning, a round woman with a cold is standing among nine shut crates, looking at a tag-board that is lying flat on its face. There are tags all over the ground.',
      'Mr Mottram has gone a little pink. He is holding an umbrella that has turned inside out.'
    ], function () { busy = false; });
  }
  function readDoc(id, html, cls, title, kind, words) {
    if (busy) return;
    ER.read({ html: html, cls: cls, clue: { id: 'm-' + id, title: title, kind: kind },
      done: function () { ER.flag('m-' + id, 1); if (words) NM.learn(words); paint(); } });
  }
  $('#bag').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (!said('primer')) { readDoc('primer', PRIMER, 'primer', 'The Primer: wholes and parts', 'A page torn from a book', ['equinox', 'Mediterranean', 'ultramarine', 'marigold']); return; }
    readDoc('ticket', TICKET, 'clerk', 'The order ticket from stall nine', 'An order ticket', ['order ticket']);
  });
  $('#prudence').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (said('prudence')) { ER.say(nextFile ? '&ldquo;Number two,&rdquo; says Mrs Nockles, &ldquo;was hers all along. Mind how you carry it.&rdquo; She sneezes.' : '&ldquo;Tap them and tag them,&rdquo; says Mrs Nockles. &ldquo;Eleven tags, nine crates. Two of those tags are for things I haven&rsquo;t got in.&rdquo;'); return; }
    ER.talk({
      who: CAST.prudence.who, role: CAST.prudence.role, face: FACE('prudence'),
      lines: [
        { note: 'She has a patterned headscarf, a knitted shawl, a red nose and a handkerchief tucked in at her neck.', a: '&ldquo;You&rsquo;ll be hers. The new one. Well. Your guide opened that umbrella under my awning, the wind got into it, and it swept my tag-board clean. Every tag I had, on the ground.&rdquo;' },
        { q: 'Can&rsquo;t you just open the crates and look?', a: '&ldquo;Open a crate before it&rsquo;s named? In Utter? Nothing&rsquo;s unwrapped before it&rsquo;s named and paid for, my love; that&rsquo;s the first rule of the market. And a crate with the wrong tag on it tries to be whatever the tag says, which the crate does not enjoy. Tap them. Each one will tell you something.&rdquo;' },
        { q: 'Which one is the Namewright&rsquo;s?', a: '&ldquo;I couldn&rsquo;t tell you, now the tags are off. She paid this afternoon. It&rsquo;s on her ticket, in her bag. There are eleven tags, and only nine crates: two of those tags are for things I haven&rsquo;t got in.&rdquo;' },
        { q: 'Is the fountain always so low?', a: '&ldquo;On the Year-Night? Always, from noon. The Spring gets lower and lower till the Namewright&rsquo;s been up there at midnight with the new name. Then it all comes back down the Stair. If she doesn&rsquo;t go&hellip;&rdquo; She sneezes. &ldquo;She always goes.&rdquo;' }
      ],
      clue: { id: 'prudence1', title: 'Mrs Nockles, at stall nine', kind: 'What she said' }, last: 'Thank you',
      done: function (ok) { if (ok) { ER.flag('m-prudence', 1); NM.learn(['crate', 'tag']); paint(); } }
    });
  });
  $('#peregrine').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.say(nextFile ? '&ldquo;The Bridge,&rdquo; says Mr Mottram. &ldquo;And on the way I shall tell you some words. I know a great many, and I can see you like them.&rdquo;' : '&ldquo;Entirely my fault,&rdquo; says Mr Mottram, trying to turn his umbrella the right way out. &ldquo;In my defence, it is a very large umbrella.&rdquo;');
  });
  NM.thing('#fountain', null, 'The fountain in the square: a basin of dark water, very low, and a spout that dribbles and stops and dribbles again.', isBusy);
  NM.thing('#sign', null, 'NOTHING IS OPENED BEFORE IT IS NAMED AND PAID FOR. The first rule of the market.', isBusy);
  NM.thing('#tagboard', null, 'Mrs Nockles&rsquo;s tag-board, flat on its face, and eleven paper tags on the wet stones round it.', isBusy);
  $('#crates').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('Nine crates, nine tags, and none of them trying to be anything it is not.'); return; }
    if (!said('prudence')) { ER.say('Nine shut crates, each with a number. The woman at the stall is looking at you, and at the crates, and at you.'); return; }
    if (!said('primer') || !said('ticket')) { ER.say('Before you tag anything, look in the Namewright&rsquo;s bag on the counter. There is a page and a ticket in it.'); return; }
    openCrates();
  });

  /* ---------- the crates ---------- */
  function openCrates() {
    var box = ER.el('div', 'pz mk'), st = ER.flag('m-crates') || { k: {}, h: {} }, s = '', done = false;
    s = '<h4>Stall nine: the crates</h4><h5>Tap a crate to hear what is inside. Then hang a tag on it: drag a tag, or click it and then the space under a crate.</h5><div class="mk-grid">';
    CRATES.forEach(function (c, i) {
      s += '<div class="crate" data-c="' + (i + 1) + '"><b>' + (i + 1) + '</b><span class="heard"></span><button type="button" class="tap" data-c="' + (i + 1) + '">Tap</button><span class="cslot" data-c="' + (i + 1) + '"></span></div>';
    });
    s += '</div><div class="mk-tray" id="mk-tray"></div><div class="foot"><button type="button" class="btn" id="mk-go">Hang the tags</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('#mk-tray'), msgEl = box.querySelector('.pmsg');
    TAGS.forEach(function (t) { var b = ER.el('button', 'tagt dnd-item', t[1]); b.type = 'button'; b.setAttribute('data-t', t[0]); tray.appendChild(b); });
    Object.keys(st.k).forEach(function (c) { var t = tray.querySelector('[data-t="' + st.k[c] + '"]'), sl = box.querySelector('.cslot[data-c="' + c + '"]'); if (t && sl) sl.appendChild(t); });
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintH() { ER.$$('.crate', box).forEach(function (c) { var n = c.getAttribute('data-c'); c.querySelector('.heard').innerHTML = st.h[n] ? ER.gloss(CRATES[n - 1]) : ''; }); }
    function clear() { ER.$$('.crate', box).forEach(function (c) { c.classList.remove('bad'); }); }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.tap') : null; if (!b || done) return;
      var n = b.getAttribute('data-c'); st.h[n] = 1; ER.flag('m-crates', st); paintH();
      if (n === '3') NM.sfx.stone(); else if (n === '6') NM.sfx.splash(); else if (n === '9') ER.sfx.chain(); else NM.sfx.tile();
    });
    ER.dnd(box, { item: '.tagt', slot: '.cslot', home: tray, lock: function () { return done; }, change: function () {
      st.k = {}; ER.$$('.cslot', box).forEach(function (sl) { var t = sl.querySelector('.tagt'); if (t) st.k[sl.getAttribute('data-c')] = t.getAttribute('data-t'); });
      clear(); ER.flag('m-crates', st);
    } });
    box.querySelector('#mk-go').addEventListener('click', function () {
      if (done) return;
      var i, n, t, crate, file;
      clear();
      for (i = 1; i <= 9; i++) {
        crate = box.querySelector('.crate[data-c="' + i + '"]');
        if (!st.h[i]) { crate.classList.add('bad'); msg('<b>Crate ' + i + '</b> has not been tapped. You cannot tag a thing before you know something about it.'); return; }
        if (!st.k[i]) { crate.classList.add('bad'); msg('<b>Crate ' + i + '</b> has no tag yet.'); return; }
      }
      for (i = 1; i <= 9; i++) {
        t = st.k[i]; crate = box.querySelector('.crate[data-c="' + i + '"]');
        if (!ER.check('k' + i, t)) {
          NM.miss(); crate.classList.add('bad');
          msg('<b>Crate ' + i + ', ' + t.toUpperCase() + '.</b> ' + SAYS[t] + ' <i>Is that what you heard in crate ' + i + '?</i>');
          return;
        }
      }
      file = ER.exit([[1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (c) { return st.k[c]; }).join('.')], { wait: true });
      if (!file) { msg('The tags will not stay on. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('m-file', file); busy = true;
      ER.$$('.crate', box).forEach(function (c) { c.classList.add('ok'); });
      msg('Nine crates, nine true names. Every crate settles down and stops trying to be anything else.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2400);
    });
    paintH();
    msg('Eleven tags, nine crates.');
    ER.open('ov-lock', box);
  }
  function solvedNow() {
    NM.sfx.tile(); paint();
    ER.narrate([
      'Mrs Nockles stands the tag-board up, wipes her nose, and opens crate two. Inside, in straw, is a square of red baked earth as big as your hand, smooth on one side, with the Namewright&rsquo;s mark scratched on the back.',
      '&ldquo;TERRACOTTA,&rdquo; she says. &ldquo;Baked earth, from this hill. She cuts the Year-Name on one every year, and every year she buys it from me.&rdquo; She puts it into your hands, and a small steel chisel with it. &ldquo;She&rsquo;ll want that too. Mind you don&rsquo;t drop either.&rdquo;',
      'Behind you, the fountain in the square gives a gurgle, and runs a little thinner. &ldquo;Midnight,&rdquo; says Mrs Nockles, to nobody in particular, and sneezes.'
    ], function () {
      NM.mine('n-market', 'Nine crates, and what their names say', '<p>TERR&middot;IER = earth-dog. TERRA&middot;COTTA = baked earth (the Year-Tile!). TERR&middot;IFIC = the OTHER terr: frighten.</p><p>PARA&middot;SOL = against the sun. SOLITAIRE = SOLUS, alone (not the sun).</p><p>AQU&middot;ARIUM = a place for water.</p><p>IN&middot;FLU&middot;ENZA = flowing in, and it means an illness: more than its parts.</p><p>PORT&middot;MANTEAU = carry + cloak: a travelling bag. CURR&middot;ENCY = running: money.</p>');
      NM.learn(['terrier', 'terracotta', 'terrific', 'parasol', 'solitaire', 'aquarium', 'influenza', 'portmanteau', 'currency', 'chisel']);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
