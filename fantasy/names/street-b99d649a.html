      'The drawbridge was called TRANS&middot;PORT&middot;ER, the one that carries across; the bar RE&middot;TRACT&middot;OR, the one that pulls back; the gate IN&middot;DUCT&middot;OR, the one that leads in. In the outside world those are a lorry, a surgeon&rsquo;s tool and a part in a wireless. In Utter each one did exactly what its parts said.',

  var BOARD = '<h4>The Lamplighters&rsquo; Board</h4><h5>painted on the wall of the street, for apprentices</h5>' +
    '<p><b>LUC, LUMIN</b>: light. <i>lucid, illuminate</i></p>' +
    '<p><b>LUCR</b>: gain, money. <i>lucre</i>. Not light! Two roots begin LUC. Do not mix them.</p>' +

    '<p><b>SOMN, DORM</b>: sleep. <i>insomnia, dormitory</i></p>' +
    '<p>Between two roots the Old Tongue often puts a joining letter, usually <b>I</b>.</p>' +
    '<p>The end of a lamp&rsquo;s name tells you what kind of thing the name is:</p>' +
    '<p>&nbsp;&nbsp;<b>-ENT, -ANT</b>: doing it, or being it, now.<br>&nbsp;&nbsp;<b>-OUS</b>: full of it.<br>&nbsp;&nbsp;<b>-IVE, -ATIVE</b>: bringing it about, tending to it.</p>' +
    '<p>Read the whole name before you call a lamp: what it will do, and to whom.</p>';
  var ACTS = [['A', 'gives light: call it'], ['B', 'lets light through, but gives none'], ['C', 'brings in money, and gives no light'],

  /* the parts of the Old Tongue that the Board and the Gate List know (a dictionary, not an answer) */
  var KNOWN = { noct: 'night', i: 'a joining letter', luc: 'light', lumin: 'light', ent: 'doing it, being it', ant: 'doing it, being it', trans: 'across', ous: 'full of',

  function hints() {

        { q: 'Is she ill?', a: '&ldquo;She is asleep. A lamp put her to sleep: one of these. A thing does what its name says, and one of these names says sleep. She will sleep until the sun is up, and not one minute less. I have tried a feather, a bell and a bucket. I shall not tell you about the bucket.&rdquo;' },
        { q: 'Why not carry her up to the Hall?', a: '&ldquo;The porters are waiting at the top with a chair. They will not bring a Namewright down these steps in the dark; nor would I. So the street must be lit. And not one lamp shall be called until we know which of them did this. Then we call the others.&rdquo;' },
        { q: 'Do you know which one it was?', a: '&ldquo;Number four. DORMANT. DORM is sleep: dormitory. Anybody can see it. I have written it down.&rdquo;' }
      ],
      clue: { id: 'quintus1', title: 'Mr Merridew, on the sleeping Namewright', kind: 'What he said' }, last: 'Thank you',
      done: function (ok) { if (ok) { ER.flag('s-quintus', 1); paint(); } }
    });
  });
  $('#romola').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    NM.sfx.snore();
    ER.say(ER.flag('s-rom') ? 'Mistress Nettleship snores, very politely, and does not wake.' : 'Mistress Romola Nettleship, Namewright of Utter: silver braids pinned up like a crown, a little silver chisel on a chain. Fast asleep, and very dignified about it.');
    ER.flag('s-rom', 1);
  });
  LAMPS.forEach(function (L) {
    $('#l' + L[0]).addEventListener('click', function (e) {
      if (busy) return;
      e.stopPropagation();
      ER.say('Lamp ' + L[0] + '. The plate under it says ' + L[3] + '. ' + (nextFile ? ([1, 3, 7].indexOf(L[0]) >= 0 ? 'It is lit.' : 'Nobody is going to call it tonight.') : 'You do not call it. Not yet.'));
    });
  });
  NM.thing('#cat', null, 'A black cat on the steps, watching the lamps. It does not look worried. It has never been called anything in its life, and does not intend to start.', isBusy);
  NM.thing('#moonG', null, 'The new moon, too thin to see the steps by.', isBusy);
  $('#slate').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('Noll&rsquo;s slate, with seven names cut into their parts in chalk.'); return; }
    if (!said('noll') || !said('quintus')) { ER.say('Noll&rsquo;s slate, with the seven names on it in chalk. Talk to Noll and to Mr Merridew first: one of them made the plates, and the other has a theory.'); return; }
    if (!said('board')) { ER.say('Before you cut any names up, read the Lamplighters&rsquo; Board, painted on the wall on the left.'); return; }
    openSlate();
  });

  /* ---------- the slate ---------- */
  function partsOf(name, cuts) {
    var out = [], last = 0;
    cuts.slice().sort(function (a, b) { return a - b; }).forEach(function (c) { out.push(name.slice(last, c)); last = c; });
    out.push(name.slice(last)); return out;
  }
  function openSlate() {
    var box = ER.el('div', 'pz sl'), st = ER.flag('s-slate') || { c: {}, a: {} }, s;
    s = '<h4>Noll&rsquo;s slate</h4><h5>Cut each name into its parts: click between two letters (click again to rub a cut out). Then mark what each lamp would do if it were called.</h5><div class="sl-key">';
    ACTS.forEach(function (a) { s += '<span><b>' + a[0] + '</b>' + a[1] + '</span>'; });
    s += '</div>';
    LAMPS.forEach(function (L) {
      var nm = L[3], j;
      s += '<div class="sl-row" data-n="' + L[0] + '"><span class="sl-no">' + L[0] + '</span><span class="sl-name">';
      for (j = 0; j < nm.length; j++) { if (j) s += '<button type="button" class="cut" data-n="' + L[0] + '" data-c="' + j + '" title="cut here"></button>'; s += '<i>' + nm.charAt(j) + '</i>'; }
      s += '</span><span class="sl-act">';
      ACTS.forEach(function (a) { s += '<button type="button" data-n="' + L[0] + '" data-a="' + a[0] + '">' + a[0] + '</button>'; });
      s += '</span></div>';
    });
    s += '<div class="foot"><button type="button" class="btn" id="sl-go">Light the street</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function cutsOf(n) { return (st.c[n] || []).slice().sort(function (a, b) { return a - b; }); }
    function paintS() {
      ER.$$('.cut', box).forEach(function (b) { b.classList.toggle('on', cutsOf(b.getAttribute('data-n')).indexOf(+b.getAttribute('data-c')) >= 0); });
      ER.$$('.sl-act button', box).forEach(function (b) { b.classList.toggle('on', st.a[b.getAttribute('data-n')] === b.getAttribute('data-a')); });
    }
    function clear() { ER.$$('.sl-row', box).forEach(function (r) { r.classList.remove('bad'); }); }
    box.addEventListener('click', function (e) {
      var c = e.target.closest ? e.target.closest('.cut') : null, a, n, i, list;
      if (c) {
        n = c.getAttribute('data-n'); i = +c.getAttribute('data-c'); list = st.c[n] || [];
        if (list.indexOf(i) >= 0) list.splice(list.indexOf(i), 1); else list.push(i);
        st.c[n] = list; NM.sfx.rub(); clear(); paintS(); ER.flag('s-slate', st); return;
      }
      a = e.target.closest ? e.target.closest('.sl-act button') : null;
      if (a) { st.a[a.getAttribute('data-n')] = a.getAttribute('data-a'); NM.sfx.tile(); clear(); paintS(); ER.flag('s-slate', st); }
    });
    box.querySelector('#sl-go').addEventListener('click', function () {
      var i, L, n, parts, unk, row, file;
      clear();
      for (i = 0; i < LAMPS.length; i++) {
        L = LAMPS[i]; n = String(L[0]); row = box.querySelector('.sl-row[data-n="' + n + '"]');
        if (!cutsOf(n).length) { row.classList.add('bad'); msg('<b>Lamp ' + n + ', ' + L[3] + ':</b> not cut yet. Every name on the slate is more than one part.'); return; }
        if (!st.a[n]) { row.classList.add('bad'); msg('<b>Lamp ' + n + ':</b> you have not marked what it would do.'); return; }
      }
      for (i = 0; i < LAMPS.length; i++) {
        L = LAMPS[i]; n = String(L[0]); row = box.querySelector('.sl-row[data-n="' + n + '"]');
        parts = partsOf(L[3], cutsOf(n));
        if (!ER.check('c' + n, cutsOf(n).join('.'))) {
          NM.miss(); row.classList.add('bad');
          unk = parts.filter(function (p) { return !KNOWN[p.toLowerCase()]; })[0];
          if (n === '5' && parts[0] === 'LUC') msg('<b>Lamp 5: ' + parts.join(' &middot; ') + '.</b> &ldquo;RATIVE&rdquo; is not a part of anything, and nor is a rat. Look at the Board again: two roots begin LUC.');
          else if (unk) msg('<b>Lamp ' + n + ': ' + parts.join(' &middot; ') + '.</b> &ldquo;' + unk + '&rdquo; is not a part that the Board or the Gate List knows. Cut it somewhere else.');
          else msg('<b>Lamp ' + n + ': ' + parts.join(' &middot; ') + '.</b> Every piece is a word you have seen, but these are not the parts this name was built from. Read it again, part by part, from the front.');
          return;
        }
      }
      for (i = 0; i < LAMPS.length; i++) {
        L = LAMPS[i]; n = String(L[0]); row = box.querySelector('.sl-row[data-n="' + n + '"]');
        if (!ER.check('a' + n, st.a[n])) {
          NM.miss(); row.classList.add('bad');
          parts = partsOf(L[3], cutsOf(n));
          msg('<b>Lamp ' + n + ': ' + parts.join(' &middot; ') + '</b> = ' + parts.map(function (p) { return KNOWN[p.toLowerCase()] || p; }).join(' + ') + '. ' + (WHY[n + st.a[n]] || 'Is that what you marked? Put the parts together and say what the lamp would do.'));
          return;
        }
      }
      file = ER.exit([LAMPS.map(function (L) { return st.a[L[0]]; }).join('')], { wait: true });
      if (!file) { msg('The chalk will not take. Something is wrong with this lock: tell your teacher.'); return; }
      nextFile = file; ER.flag('s-file', file); busy = true;
      ER.$$('.sl-row', box).forEach(function (r) { r.classList.add('ok'); });
      msg('Seven names read back into their parts. Three lamps to call, and one never to call again.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2400);
    });
    paintS();
    msg('Seven names, and one of them put the Namewright to sleep.');
    ER.open('ov-lock', box);
  }
  /* what a wrong mark sounds like, told from the parts */
  var WHY = {
    '1B': 'It does not let light through: it shines, at night.', '1D': 'There is no sleep in it.',
    '2A': 'TRANS is across, or through. A thing that light goes through is glass, not a flame. Called, it would go as clear as water.',
    '3B': 'Full of light is not the same as letting light through.',
    '4E': 'Mr Merridew&rsquo;s theory. But -ANT is doing it or being it: DORMANT is being asleep. Called, the lamp would sleep. Would it make anybody else sleep?',
    '4A': 'Sleep is not light.',
    '5A': 'Is LUCR light? Read the Board again.', '5B': 'Is LUCR light at all?',
    '6A': 'Noll says SOMN is night, because of insomnia. But IN- can mean not. What is insomnia, then: no night, or no sleep? And what does the Board say SOMN is?',
    '6D': 'DORMANT is being asleep. SOMN&middot;I&middot;LUC&middot;ENT is shining: shining what?',
    '7B': 'Noll reads IL- as not, like illegal. But the Gate List says IL- is also IN- before L: in, on, as in illuminate. Which makes sense for a lamp that is full of light?',
    '7D': 'Noll reads IL- as not, like illegal. But the Gate List says IL- is also IN- before L: in, on, as in illuminate.',
    '7E': 'There is no sleep in it.'
  };
  function solvedNow() {
    NM.sfx.lamp(); paint();
    ER.narrate([
      '&ldquo;NOCTILUCENT,&rdquo; you say, &ldquo;please.&rdquo; Lamp one lights with a warm gold flame. &ldquo;LUMINOUS, please.&rdquo; Lamp three. &ldquo;ILLUMINANT, please.&rdquo; Lamp seven lights the top of the street like a doorway. Three lamps are enough to see the steps by.',
      'Noll has gone pale under his soot. &ldquo;Insomnia,&rdquo; he says. &ldquo;In- is not. Not sleep. So SOMN is sleep, and I built a lamp that shines sleep on anybody standing under it, and she stood under it.&rdquo; Mr Merridew writes something down, crosses it out, and says, &ldquo;I withdraw my theory.&rdquo;',
      'Two porters come down the steps with a carrying-chair, lift the Namewright into it, still asleep and still dignified, and carry her up the street towards the Name-Hall.',
      '&ldquo;It is the Year-Night,&rdquo; says Mr Merridew. &ldquo;At midnight the Year-Name must be said at the Spring, by the Namewright or by her apprentice.&rdquo; He looks at you. He looks at you for some time. &ldquo;She went to the market this afternoon and ordered something for tonight. Go by stall nine. Then over the Asking Bridge to the Hall. Mr Mottram knows the way.&rdquo;',
      'Noll gives you the Namewright&rsquo;s bag. Inside it: a purse, an order ticket from stall nine, and a page torn out of a book.'
    ], function () {
      NM.mine('n-street', 'Seven lamps, read back', '<p>1 NOCT&middot;I&middot;LUC&middot;ENT: night + light + doing = shines at night. CALL.</p><p>2 TRANS&middot;LUC&middot;ENT: light goes through it. No light of its own.</p><p>3 LUMIN&middot;OUS: full of light. CALL.</p><p>4 DORM&middot;ANT: being asleep. Sleeps itself (Mr M. was wrong).</p><p>5 LUCR&middot;ATIVE: brings in money. LUCR is NOT LUC.</p><p>6 SOMN&middot;I&middot;LUC&middot;ENT: shining sleep. It did it. (insomnia = IN- not + SOMN sleep)</p><p>7 IL&middot;LUMIN&middot;ANT: putting light on. IL- = in, on (not &ldquo;not&rdquo;). CALL.</p>');
      NM.learn(['noctilucent', 'translucent', 'luminous', 'dormant', 'lucrative', 'illuminant', 'insomnia']);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) { clearInterval(snoreT); ER.leave(nextFile); } });
})();
</script>
