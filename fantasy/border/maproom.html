<style>

  .tc-room{font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700}
  #glowC{animation:gc 4.4s steps(4) infinite}
  @keyframes gc{50%{opacity:.45}}
  #lampA,#lampB{animation:flick 3.6s steps(3) infinite}#lampB{animation-delay:-1.7s}
  #swing{animation:sw 7s ease-in-out infinite;transform-origin:600px -640px}
  @keyframes sw{50%{transform:rotate(.6deg)}}
  #fireF{animation:ff .9s steps(3) infinite}
  @keyframes ff{33%{transform:translateY(-3px) scaleY(1.04)}66%{transform:translateY(2px)}}
  #ptLine{opacity:0;transition:opacity 1s}
  #scene.solved #ptLine{opacity:1}

  /* the Proving Table */
  .pt{display:grid;grid-template-columns:minmax(0,420px) minmax(0,500px);gap:18px;width:min(980px,96vw);align-items:start;color:#f1ead2;
    background:#2a2014 linear-gradient(160deg,#3b2c1a,#1f170e);border:8px solid #6a5426;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px rgba(233,196,106,.35)}
  .pt h4{color:#ffe7a8;grid-column:1/-1}
  .pt h5{grid-column:1/-1;margin:0 0 2px;color:#e6d6ae}
  .pt-map{background:#efe3c2;border:3px solid #8a6a36;border-radius:3px}
  .pt-map svg{display:block;width:100%;height:auto}
  .pt-text{font-family:'Almendra',serif;font-size:17.5px;line-height:2.02;color:#2e2112;background:#efe0bb radial-gradient(ellipse at 30% 10%,rgba(255,250,230,.75),rgba(150,105,45,.28));padding:8px 16px 10px;border:1px solid #a68650}
  .pt-text b{font-family:'Uncial Antiqua',serif;font-weight:normal;color:#7a2a1c}
  .pt-text .blot{display:inline-block;width:3em;height:.95em;vertical-align:-.12em;border-radius:40% 55% 45% 60%;background:radial-gradient(circle at 40% 40%,#4a3b2a,#2a2016 60%,rgba(42,32,22,.2))}
  .slot{display:inline-block;min-width:76px;height:28px;vertical-align:middle;margin:0 2px;border-bottom:2px dashed #8a6a3a;background:rgba(138,106,58,.12);border-radius:3px;text-align:center;line-height:24px}
  .slot.bad{background:rgba(190,50,30,.3);border-bottom-color:#b0301e}
  .slot.ok{border-bottom:2px solid #2f6a4a}
  .tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:76px;align-content:flex-start;padding:8px;background:rgba(0,0,0,.25);border:1px dashed rgba(233,196,106,.35);border-radius:3px}
  .tile{height:28px;padding:0 10px;border-radius:3px;border:1px solid #6a5426;background:linear-gradient(#f6e9c4,#d9c38a);color:#3a2a10;font-family:'Almendra',serif;font-weight:700;font-size:16px;line-height:26px;white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .slot .tile{height:24px;line-height:22px;font-size:15.5px;box-shadow:none;margin:1px 0}
  .tile:hover{border-color:#fff4cf}
  .pt .foot .btn{--accent:#ffe7a8}
  .pt .pmsg{min-height:84px;font-size:17.5px}
  #pt-pen{transition:opacity .3s}
  @media (max-width:980px){.pt{grid-template-columns:1fr}}
</style>

<script>
(function () {
  var $ = ER.$, sc = $('#scene'), busy = false, nextFile = null;

  (function () {
    var s = '', x, y, i, seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (x = -980; x < 2600; x += 180) s += '<rect x="' + x + '" y="110" width="150" height="420" rx="4"/>';
    $('#panels').innerHTML = s; s = '';
    for (x = -900; x < 2600; x += 170) s += '<path d="M' + x + ' 760L' + (800 + (x - 800) * 2.2).toFixed(0) + ' 1500"/>';
    $('#boards').innerHTML = s; s = '';
    for (i = 0; i < 40; i++) { x = 90 + rnd() * 190; y = 136 + rnd() * 260; s += '<circle class="tw" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + (0.8 + rnd() * 1.4).toFixed(1) + '"/>'; }
    $('#starsW').innerHTML = s;
  })();

  ER.init({
    theme: 'fantasy', story: 'border', storyTitle: 'A Nice Measure', id: 'maproom', no: 'I', title: 'The Map Room',
    go: 'Go into the Map Room',
    intro: [
      'The Guild of Mapmakers stands at the end of the bridge at Ninefold, between the kingdom of Querne and the kingdom of Selvan, and belongs to neither. It is ten o&rsquo;clock at night. You have been an apprentice here for nine days.',
      'Tomorrow at noon the Treaty of Ninefold will be read aloud over the Great Map, as it is every fifty years, and the Map will draw the border between the two kingdoms exactly as the words are read. This evening, at the practice reading, the words drew something that nobody expected.',
      'The Mapmaster has sent for you. Nobody has told you why.'
    ],
    exit: {"next":"archive","w":{"7ca45d62":"157cc3c6"}}, tags: {"b1":["0f096ea2"],"b2":["e0d0d32f"],"b3":["264c6265"],"b4":["14cded69"],"b5":["3992a0b1"],"b6":["160bba1f"],"b7":["e1dcaccf"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('m-file') || null;
  function SLIP(t) { return '<p><span class="slip">' + t + '</span></p>'; }

  var STYLE = '<span class="pg">PAGE 41</span><h4>THE GUILD STYLE BOOK</h4><h3>Small words of place and movement</h3>' +
    '<p>A bound is written as a journey. Each small word tells the pen exactly how to go, and a wrong one moves a border.</p>' +
    '<svg viewBox="0 0 600 92"><g fill="none" stroke="#5a7aa0" stroke-width="10"><path d="M8 40h84"/><path d="M150 4v70"/></g>' +
    '<g fill="#4a6a3a" opacity=".6"><circle cx="250" cy="40" r="26"/></g><path d="M330 66q40-60 80 0" fill="#c9b98a"/><circle cx="500" cy="40" r="7" fill="#7d6236"/><circle cx="560" cy="28" r="7" fill="#7d6236"/><circle cx="560" cy="58" r="7" fill="#7d6236"/>' +
    '<g fill="none" stroke="#a3271c" stroke-width="3" stroke-dasharray="7 5"><path d="M10 30h80"/><path d="M118 40h64"/><path d="M212 40h76"/><path d="M322 66q48-80 96 0"/><path d="M466 24h68"/><path d="M528 43h56"/></g>' +
    '<g font-family="Cinzel,serif" font-weight="700" font-size="13" fill="#2f4a3c" text-anchor="middle"><text x="50" y="86">ALONG</text><text x="150" y="86">ACROSS</text><text x="250" y="86">THROUGH</text><text x="370" y="86">OVER</text><text x="500" y="86">PAST</text><text x="560" y="86">BETWEEN</text></g></svg>' +
    '<dl><dt>along</dt><dd>following the length of something: along a river, a road, a wall.</dd>' +
    '<dt>across</dt><dd>from one side to the other of something flat, or long and thin: across a river, a field, a road.</dd>' +
    '<dt>through</dt><dd>in at one side and out at the other of something that has an inside: through a wood, a town, a gate.</dd>' +
    '<dt>over</dt><dd>up one side and down the other of something high: over a hill, a wall.</dd>' +
    '<dt>past</dt><dd>going by something without touching it. It stays on one side.</dd>' +
    '<dt>between</dt><dd>in the space that has one thing on each side.</dd>' +
    '<dt>beyond</dt><dd>on the far side of something.</dd>' +
    '<dt>upstream of</dt><dd>nearer to a river&rsquo;s source than something is.</dd>' +
    '<dt>within</dt><dd>inside, and not going out.</dd>' +
    '<dt>as far as</dt><dd>up to a place, and stopping there.</dd></dl>';
  var PLATSVG = '<svg viewBox="150 0 360 400"><rect x="150" y="0" width="360" height="400" fill="#f3ead2"/>' + mapLand(true) + '</svg>';
  var PLAT = '<h4>The Plat of the Bounds</h4><p style="text-align:center"><i>walked and set out by Wystan Orme, Mapmaker</i></p>' + PLATSVG +
    '<p>&#10005; marks a bound-stone. The bound passes every stone, and touches nothing that it is not written to touch.</p>' +
    '<p>Stone I at the Springs. II on the bank by the Weir. III in the heart of Mardle Wood. IV on the top of Raven Knoll. V between the Two Sisters. VI at the west end of the Bridge.</p>' +
    '<p>The Hermit&rsquo;s Well is Selvan&rsquo;s.</p><p><i>(The line itself has faded. The stones have not.)</i></p>';

  function talked() { return ER.flag('m-brack'); }
  function ready() { return talked() && ER.flag('m-plat'); }
  function hints() {
    if (nextFile) return ['go', ['The First Article is whole again, except for the blot. The Mapmaster wants you in the Archive.']];
    if (ready()) return ['table', [
      'Read the First Article as a journey, from the Springs to the Bridge, and keep Orme&rsquo;s plat beside it (it is in your notebook). The bound has to pass every one of his stones.',
      'Each place on the way asks for its own small word. A river can be followed, or crossed. A wood has an inside. A hill has a top. Two stones have a gap between them. A well can be passed without touching it.',
      'From the Springs the bound follows the river, and it stops at the Weir: one word for how it goes, and another for where it stops. Then it crosses the water; in at one side of the wood and out at the other; up and down the hill; through the gap between the stones; and by the well, which stays on Selvan&rsquo;s side.'
    ]];
    return ['start', [
      'Talk to the Mapmaster, by the fire. She cannot speak, but she can write.',
      'Read Orme&rsquo;s plat, in the frame on the right-hand wall, and the page of the Style Book on the lectern on the left.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    sc.classList.toggle('solved', !!nextFile);
    $('#ptable').setAttribute('class', 'hot' + (ready() && !nextFile ? ' nudge' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips((talked() ? 1 : 0) + (nextFile ? 1 : 0), 2);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The First Article is whole again, but for one blot. The Archive is upstairs.'); return; }
    if (talked()) { ER.say('The Map Room. The Proving Table is the round one with the brass rim.'); return; }
    busy = true;
    ER.narrate([
      'The Map Room is the oldest room in the Guild: green walls, two lamps on chains, and in the middle the Great Map, under a cloth, on a table as long as a boat. Something under the cloth is glowing very faintly, like a page that is waiting to be read.',
      'Mapmaster Brackenridge is by the fire in three scarves. She points at you, then at the round table with the brass rim, then at her own throat; and shakes her head.'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  $('#brack').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('The Mapmaster writes on a slip and holds it up: <i>Upstairs. The iron chest. Go.</i>'); return; }
    ER.talk({
      who: CAST.brack.who, role: CAST.brack.role, face: FACE('brack'),
      lines: [
        { note: 'She writes on slips of paper with a red pencil, very fast, and pushes each one across the little table to you.', a: SLIP('Good. You can read. Half this Guild can only draw.') },
        { q: 'What happened to your voice?', a: SLIP('I shouted at an envoy. Then at the other one, to be fair. Then the cold came in at the window.') },
        { q: 'What happens at noon?', a: SLIP('The Reading. The Treaty of Ninefold is read aloud over the Great Map, before both Crowns. The Map draws the border as the words are read, and both Crowns must keep to what it draws, for fifty years. Every word counts. The SMALL words count most.') },
        { q: 'What went wrong this evening?', a: SLIP('Sir Tristram, the envoy of Selvan, read our fair copy over the Proving Table for practice. The Table drew a border that I did not know. Mardle was cut in two. Wethercote went over to Selvan. The envoy of Querne said something that I shall not write down.') },
        { q: 'Why read a fair copy, and not the Treaty itself?', a: SLIP('Our own copy of the Treaty was in the cellar on the night of the Great Flood, twenty years ago. The water took half the small words out of the First Article. Old Master Moule made the fair copy the next spring, from what was left. He was honest. He was also guessing.') },
        { q: 'What do you want me to do?', a: SLIP('Our soaked copy is on the Proving Table. Put back the small words that the water took. The Table draws as you go, and it will not draw what cannot be. Orme&rsquo;s plat is on the wall. The bound passes every one of his stones.') },
        { note: 'She writes one more slip, underlines it twice, and goes back to her tea.', a: SLIP('Do NOT lift the cloth off the Great Map. Not before noon. Not for anybody.') }
      ],
      clue: { id: 'brack1', title: 'The Mapmaster, by the fire', kind: 'Her red pencil' }, last: 'Leave her',
      done: function (seen) {
        if (!seen) return;
        ER.flag('m-brack', 1); BDR.learn(['the Reading', 'fair copy', 'bound']); paint();
        ER.say(ER.flag('m-plat') ? 'The Proving Table is the round one with the brass rim.' : 'Orme&rsquo;s plat is in the frame on the right-hand wall.');
      }
    });
  });
  $('#sefton').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (ER.flag('m-sef')) {
      ER.say(nextFile ? '&ldquo;Upstairs,&rdquo; says Sefton. &ldquo;Mind the third stair. It never does what you expect.&rdquo;' : '&ldquo;Over is for a hill,&rdquo; says Sefton, walking his dividers along nothing. &ldquo;Across is for a river. Fussy. That&rsquo;s what a border is.&rdquo;');
      return;
    }
    ER.talk({
      who: CAST.sefton.who, role: CAST.sefton.role, face: FACE('sefton'),
      lines: [
        { note: 'He is sitting on the map press with a pair of dividers, walking them along nothing.', a: '&ldquo;You&rsquo;re the new one. Good. I&rsquo;ve been told to help you, and I&rsquo;ve been told not to do it for you. She can&rsquo;t speak tonight, but she can underline.&rdquo;' },
        { q: 'Where are you from?', a: '&ldquo;Wethercote: downstream, on the big bend of the Wimble. Twenty years ago the river came through the Neck in one night, and in the morning my mother&rsquo;s mill-wheel was turning the wrong way. Since then the river runs on the other side of the village. Sir Tristram thinks that makes us Selvan&rsquo;s. Sir Tristram thinks a lot of things, very charmingly.&rdquo;' },
        { q: 'And the envoy of Querne?', a: '&ldquo;Mistress Mundy. The Guild can&rsquo;t stand her. She corrects people&rsquo;s grammar at dinner, and twenty years ago she told the Guild that its fair copy was wrong. She&rsquo;s staying upstairs. Between you and me, I&rsquo;ve never heard her say a thing that wasn&rsquo;t true. That&rsquo;s what nobody can stand.&rdquo;' },
        { q: 'What do I do with the Table?', a: '&ldquo;Read the Style Book first: it&rsquo;s on the lectern, open at the page on small words. Over is for a hill or a wall. Across is for a river or a road. Sounds fussy. It is fussy. That&rsquo;s what a border is.&rdquo;' }
      ],
      clue: { id: 'sefton1', title: 'Sefton, on the map press', kind: 'What he said' }, last: 'Thanks',
      done: function (seen) { if (seen) { ER.flag('m-sef', 1); BDR.learn(['Wethercote', 'envoy']); } }
    });
  });
  $('#style').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: STYLE, cls: 'style', clue: { id: 'style1', title: 'Style Book: small words of place', kind: 'The Guild Style Book' },
      done: function () { ER.flag('m-style', 1); BDR.learn(['along', 'across', 'through', 'past', 'beyond', 'upstream of', 'within', 'as far as']); } });
  });
  $('#plat').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PLAT, cls: 'plat', clue: { id: 'plat', title: 'Orme’s plat of the bounds', kind: 'A map on the wall' },
      done: function () { ER.flag('m-plat', 1); BDR.learn(['plat', 'bound-stone', 'knoll', 'weir']); paint(); if (talked() && !nextFile) ER.say('The Proving Table is the round one with the brass rim.'); } });
  });
  $('#great').addEventListener('click', function () {
    if (busy) return;
    if (!ER.flag('m-cloth')) { ER.flag('m-cloth', 1); ER.say('A card is pinned to the cloth: NOT BEFORE NOON. Under the cloth something glows, very faintly. You put out a hand towards the corner.', 6000); return; }
    BDR.sfx.tap(); ER.say('Behind you a red pencil taps twice on a saucer. You take your hand back. Not before noon.');
  });
  BDR.thing('#window', null, 'Ninefold at night: the Bridge with its lamps, and the Wimble black and quiet under it. Somewhere downstream, on the big bend, is Wethercote.', isBusy);
  BDR.thing('#press', null, 'A map press: wide, shallow drawers, each one full of a county.', isBusy);
  BDR.thing('#fire', null, 'A good fire. The Mapmaster is sitting as close to it as a person can sit without being part of it.', isBusy);
  $('#ptable').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('The First Article is drawn on the Table in red, from the Springs to the blot. After the blot the pen has drawn two dotted lines, and waits.'); return; }
    if (!talked()) { ER.wordAt(e.clientX, e.clientY, 'Proving Table'); ER.say('The Proving Table: a round map of the Wimble with a brass rim, and a pen on a brass arm, standing over it like a heron. The Mapmaster is looking at you from the fire. She has something to say about it first.', 7000); return; }
    if (!ER.flag('m-plat')) { ER.wordAt(e.clientX, e.clientY, 'Proving Table'); ER.say('Before you put a word on this Table, look at Orme&rsquo;s plat on the right-hand wall. The bound passes every one of his stones.'); return; }
    openTable();
  });

  /* ---------- the map on the Table (and, without the lines, on the plat) ---------- */
  function mapLand(stones) {
    var s = '<g fill="none" stroke="#8aa0b8" stroke-width="1" opacity=".5"><path d="M150 450L480 450"/></g>';
    s += '<g fill="#d9c58f" opacity=".5"><path d="M440 0H600V460H440q-4-30 2-60t-8-70q-6-40 4-80t-8-70q-8-40 6-80t-6-100z"/></g>';           /* the left bank, east */
    s += '<path d="M440 18 Q428 44 444 66 T438 108 T440 132" stroke="#5a7aa0" stroke-width="4" fill="none"/>' +
      '<path d="M440 132 Q452 170 436 206 T444 280 T424 330 T426 360" stroke="#5a7aa0" stroke-width="9" fill="none"/>' +
      '<path d="M426 360 Q418 400 432 430 T428 470" stroke="#5a7aa0" stroke-width="11" fill="none"/>';
    s += '<path d="M426 128h30M426 136h30" stroke="#4a3a2a" stroke-width="2.500"/>';                                                                 /* the weir */
    s += '<g fill="#4a6a3a" opacity=".78">';
    [[300, 170], [322, 160], [346, 168], [360, 188], [338, 200], [312, 198], [290, 188], [330, 180], [352, 204], [308, 214], [288, 206]].forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="11"/>'; });
    s += '</g>';
    s += '<g fill="none" stroke="#8a6a3a" stroke-width="1.600"><ellipse cx="220" cy="250" rx="46" ry="32"/><ellipse cx="220" cy="250" rx="32" ry="22"/><ellipse cx="220" cy="250" rx="18" ry="12"/><ellipse cx="220" cy="250" rx="6" ry="4"/></g>';
    s += '<g fill="#7d6a52"><rect x="231" y="306" width="10" height="20" rx="3"/><rect x="263" y="314" width="10" height="20" rx="3"/></g>';                 /* the Two Sisters */
    s += '<g><circle cx="300" cy="338" r="6" fill="#5a7aa0" stroke="#4a3a2a" stroke-width="2"/><path d="M291 332l9-8 9 8" stroke="#4a3a2a" stroke-width="2" fill="none"/></g>';      /* the Hermit's Well */
    s += '<g fill="#a2673a" stroke="#4a3a2a" stroke-width="1">';
    [[314, 352], [330, 360], [348, 354], [322, 372], [342, 378]].forEach(function (p) { s += '<rect x="' + p[0] + '" y="' + p[1] + '" width="12" height="9"/>'; });
    s += '</g>';
    s += '<path d="M406 352h42v16h-42z" fill="#b9a98a" stroke="#4a3a2a" stroke-width="1.600"/><g stroke="#4a3a2a" stroke-width="1.200"><path d="M414 352v16M422 352v16M430 352v16M438 352v16"/></g>';   /* the Bridge */
    s += '<g fill="#8a6a4a" stroke="#4a3a2a" stroke-width="1"><rect x="452" y="336" width="12" height="10"/><rect x="468" y="350" width="14" height="10"/><rect x="456" y="368" width="12" height="10"/><rect x="474" y="372" width="10" height="9"/></g>';
    s += '<g font-family="IM Fell English,Georgia,serif" font-style="italic" font-size="12.5" fill="#3b2a14" text-anchor="middle">' +
      '<text x="430" y="16" text-anchor="end">Thrum Springs</text><text x="462" y="150" text-anchor="start">the Weir</text><text x="330" y="146">Mardle Wood</text><text x="220" y="296">Raven Knoll</text>' +
      '<text x="227" y="330" text-anchor="end" font-size="11">the Two Sisters</text><text x="372" y="396" text-anchor="start">Mardle</text><text x="290" y="364" text-anchor="end" font-size="11">the Hermit&#8217;s Well</text><text x="474" y="398">Ninefold</text></g>';
    s += '<g font-family="Cinzel,serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle"><text x="200" y="440" fill="#2f5a3a">SELVAN</text><text x="477" y="244" fill="#8a5a10" font-size="11" letter-spacing="1">QUERNE</text></g>';
    if (stones) {
      s += '<g stroke="#a3271c" stroke-width="3">';
      [[440, 30, 'I'], [422, 132, 'II'], [330, 180, 'III'], [220, 250, 'IV'], [252, 322, 'V'], [410, 360, 'VI']].forEach(function (p) {
        s += '<path d="M' + (p[0] - 6) + ' ' + (p[1] - 6) + 'l12 12M' + (p[0] + 6) + ' ' + (p[1] - 6) + 'l-12 12"/>';
      });
      s += '</g><g font-family="Cinzel,serif" font-weight="700" font-size="12" fill="#a3271c">';
      [[440, 30, 'I'], [422, 132, 'II'], [330, 180, 'III'], [220, 250, 'IV'], [252, 322, 'V'], [410, 360, 'VI']].forEach(function (p) { s += '<text x="' + (p[0] + 9) + '" y="' + (p[1] - 7) + '">' + p[2] + '</text>'; });
      s += '</g>';
    }
    return s;
  }

  /* each gap, and the line each small word would draw there (null = the pen lifts) */
  var R1 = 'M440 18 Q428 44 444 66 T438 108 T440 132', R2 = 'M440 132 Q452 170 436 206 T444 280 T424 330 T426 360';
  var SEG = {
    1: { along: 'R', across: 'M424 20 L458 20', upstream: 'M440 18 L440 -20' },
    2: { asfar: R1, beyond: R1 + ' ' + R2.replace('M440 132', ''), past: R1 + ' ' + R2.replace('M440 132', ''), upstream: 'M440 18 Q428 44 444 66 T436 100' },
    3: { across: 'M440 132 L422 132', along: R2 },
    4: { through: 'M422 132 Q380 150 330 180 Q292 204 268 222', past: 'M422 132 Q392 220 340 230 Q300 234 268 222', along: 'M422 132 Q380 132 330 140 Q282 150 268 222' },
    5: { over: 'M268 222 Q240 232 220 250 Q212 282 236 300', past: 'M268 222 Q276 262 258 290 Q248 298 236 300', across: 'M268 222 L236 300' },
    6: { between: 'M236 300 L252 322', past: 'M236 300 Q260 296 282 304', beyond: 'M236 300 Q232 344 262 346 Q280 344 286 334' },
    7: { past: 'M252 322 Q280 318 302 326', asfar: 'M252 322 Q280 328 296 334', beyond: 'M252 322 Q276 350 302 350 Q314 348 318 338' }
  };
  var LIFT = {
    along: 'The pen lifts, and waits. Along is for following the length of something: a river, a road, a wall.',
    across: 'The pen lifts, and waits. Across is for crossing something flat, or long and thin, from one side to the other.',
    through: 'The pen lifts, and waits. Through is for something with an inside: in at one side and out at the other.',
    over: 'The pen lifts, and waits. Over is up one side and down the other of something high. The Table does not fly.',
    past: 'The pen lifts, and waits. Past goes by a thing without touching it: there has to be a thing to go by.',
    beyond: 'The pen lifts, and waits. Beyond is on the far side of something. The far side of what?',
    between: 'The pen lifts, and waits. Between needs one thing on each side of the gap.',
    upstream: 'The pen lifts, and waits. Upstream of is for places on a river: nearer to its source.',
    within: 'The pen lifts, and waits. Within is inside, and staying there. A bound that stayed inside would never get anywhere.',
    asfar: 'The pen lifts, and waits. As far as says where a line stops, not how it goes.'
  };
  var WHY = {
    '1across': 'Across the little stream at the Springs in one step, and then nowhere. The bound never reaches the Weir.',
    '1upstream': 'Upstream of the Wimble? The pen runs north, uphill, looking for a source above the source, and goes off the edge of the map.',
    '2beyond': 'The pen runs on down the river beyond the Weir, and Stone II is left on the bank. The wood and the knoll would go to Selvan.',
    '2past': 'The pen runs on down the river past the Weir, and Stone II is left on the bank. The wood and the knoll would go to Selvan.',
    '2upstream': 'The pen stops short, upstream of the Weir. Stone II is out of its reach.',
    '3along': 'The line stays in the water and runs on down to the Bridge. Stone II, on the bank, is never touched.',
    '4past': 'The line goes past the wood and never touches it. Stone III is in the heart of the trees.',
    '4along': 'The line runs along the edge of the wood. Stone III is in the heart of the trees.',
    '5past': 'The line goes round the foot of the hill. Stone IV is on the top.',
    '5across': 'Across is for flat ground: the line crosses the foot of the hill and misses the top. Stone IV is on the top.',
    '6past': 'The line goes past both Sisters on the same side. Stone V stands between them.',
    '6beyond': 'The line goes round the far side of the Sisters. Stone V stands between them.',
    '7asfar': 'The line stops at the well, and never reaches the Bridge.',
    '7beyond': 'The line goes round the far side of the well, so the well falls on Querne&rsquo;s side. Orme says that the Hermit&rsquo;s Well is Selvan&rsquo;s.'
  };
  var TILES = [['along', 'along'], ['across', 'across'], ['through', 'through'], ['over', 'over'], ['past', 'past'], ['beyond', 'beyond'], ['between', 'between'], ['upstream', 'upstream of'], ['within', 'within'], ['asfar', 'as far as']];

  function openTable() {
    var box = ER.el('div', 'pz pt'), vals = ER.flag('m-slots') || {}, done = false, last = JSON.stringify(vals), s, i;
    var text = BDR.FIRST.replace(/\{(\d)\}/g, '<span class="slot" data-b="$1"></span>').replace('{B}', '<span class="blot" title="a blot"></span>');
    s = '<h4>The Proving Table</h4><h5>The Guild&rsquo;s own copy of the First Article, as the flood left it. Put a small word in each gap: drag it, or click it and then the gap. The pen draws as you go.</h5>' +
      '<div class="pt-map"><svg viewBox="150 0 360 400" id="pt-svg"><rect x="150" y="0" width="360" height="400" fill="#efe3c2"/>' + mapLand(false) +
      '<g id="pt-lines" fill="none" stroke="#b0301e" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"></g>' +
      '<g id="pt-blot" fill="none" stroke="#7d6a52" stroke-width="2" stroke-dasharray="4 5" opacity="0"><path d="M302 326 L410 360"/><path d="M302 326 Q330 374 362 366 T410 360"/></g></svg></div>' +
      '<div><div class="pt-text"><b>The First Article.</b> ' + text + '</div><div class="tray" id="pt-tray"></div>' +
      '<div class="foot"><button type="button" class="btn" id="pt-go">Read it aloud</button><p class="pmsg"></p></div></div>';
    box.innerHTML = s;
    var tray = box.querySelector('#pt-tray'), msgEl = box.querySelector('.pmsg'), lines = box.querySelector('#pt-lines');
    TILES.forEach(function (t) { var b = ER.el('button', 'tile dnd-item', t[1]); b.type = 'button'; b.setAttribute('data-t', t[0]); tray.appendChild(b); });
    for (i = 1; i <= 7; i++) if (vals[i]) { var tl = tray.querySelector('[data-t="' + vals[i] + '"]'); if (tl) box.querySelector('.slot[data-b="' + i + '"]').appendChild(tl); }
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function read() { var o = {}; ER.$$('.slot', box).forEach(function (sl) { var t = sl.querySelector('.tile'); if (t) o[sl.getAttribute('data-b')] = t.getAttribute('data-t'); }); return o; }
    function draw() {
      var d = '', b, v, p;
      for (b = 1; b <= 7; b++) {
        v = vals[b]; if (!v) continue;
        p = SEG[b][v];
        if (b === 1 && v === 'along') p = vals[2] && SEG[2][vals[2]] ? SEG[2][vals[2]] : R1;
        if (b === 2) continue;                                   /* the second gap only says where the first line stops */
        if (p) d += '<path d="' + p + '"' + (b === 1 && v === 'along' && !(vals[2] && SEG[2][vals[2]]) ? ' stroke-dasharray="5 6" opacity=".6"' : '') + '/>';
      }
      lines.innerHTML = d;
      box.querySelector('#pt-blot').setAttribute('opacity', vals[7] === 'past' ? '1' : '0');
    }
    function changed() {
      var now = read(), b, said = false;
      ER.$$('.slot', box).forEach(function (x) { x.classList.remove('bad'); });
      for (b = 1; b <= 7; b++) if (now[b] !== vals[b] && now[b]) {
        if (!SEG[b][now[b]] && !(b === 2 && now[b] === 'asfar')) { msg(LIFT[now[b]]); BDR.sfx.lift(); said = true; }
        else { BDR.sfx.pen(); msg('The pen moves on the Table, and draws.'); said = true; }
      }
      vals = now; ER.flag('m-slots', vals); draw();
      if (!said && JSON.stringify(now) !== last) msg('The pen waits over the Table.');
      last = JSON.stringify(now);
    }
    ER.dnd(box, { item: '.tile', slot: '.slot', home: tray, change: changed, lock: function () { return done; } });
    box.querySelector('#pt-go').addEventListener('click', function () {
      if (done) return;
      var b, k, file;
      for (b = 1; b <= 7; b++) if (!vals[b]) { msg('Seven gaps, and one of them is still empty. The pen will not read half a sentence.'); return; }
      for (b = 1; b <= 7; b++) if (!ER.check('b' + b, vals[b])) {
        BDR.blot(); box.querySelector('.slot[data-b="' + b + '"]').classList.add('bad');
        k = b + vals[b];
        msg('<b>Gap ' + b + '.</b> ' + (WHY[k] || LIFT[vals[b]]) + ' <i>The Mapmaster marks a blot on your copy.</i>');
        return;
      }
      file = ER.exit([[1, 2, 3, 4, 5, 6, 7].map(function (n) { return vals[n]; }).join('-')], { wait: true });
      if (!file) { msg('The pen will not move at all. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('m-file', file); busy = true;
      ER.$$('.slot', box).forEach(function (x) { x.classList.add('ok'); });
      msg('You read it aloud, from the Springs to the Bridge. The pen goes round once more, over every stone, and stops at the blot.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2600);
    });
    draw();
    msg(Object.keys(vals).length ? 'The pen waits over the Table.' : 'Ten small words in the tray, and seven gaps. Orme&rsquo;s plat is in your notebook.');
    ER.open('ov-lock', box);
  }
  function solvedNow() {
    BDR.sfx.pen();
    ER.narrate([
      'The First Article, read aloud: the bound runs ALONG the Wimble AS FAR AS the Weir; ACROSS the water; THROUGH Mardle Wood; OVER Raven Knoll; BETWEEN the Two Sisters; and so PAST the Hermit&rsquo;s Well. The red line touches all five stones on the way.',
      'Then it comes to the blot: &ldquo;&#9618; the north of Mardle&rdquo;. The pen hangs over the Table, and draws two dotted lines at once. One goes north of every house in Mardle. The other goes through the middle of the village.',
      'The Mapmaster has come over from the fire. She writes, and holds the slip under the lamp: <span class="slip" style="display:inline-block;padding:4px 10px;background:#fbf8ef;color:#a3271c;font-family:Caveat,cursive;font-weight:700;font-size:1.15em">Moule&rsquo;s fair copy says IN. Querne&rsquo;s copy says TO. This Guild has called Querne&rsquo;s copy false for twenty years: the seal is wrong, they say. It is upstairs, in the iron chest. Find out why it is wrong. Or why it is not.</span>',
      '&ldquo;Upstairs,&rdquo; says Sefton, getting off the map press. &ldquo;Mind the third stair. It never does what you expect.&rdquo;'
    ], function () {
      BDR.mine('n-map', 'The First Article', '<p>Springs: ALONG the Wimble, AS FAR AS the Weir.</p><p>ACROSS the water. THROUGH Mardle Wood. OVER Raven Knoll. BETWEEN the Two Sisters. PAST the Hermit&rsquo;s Well.</p><p>Still blotted: &ldquo;? the north of Mardle&rdquo;. Moule wrote IN. Querne&rsquo;s copy says TO.</p>');
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
