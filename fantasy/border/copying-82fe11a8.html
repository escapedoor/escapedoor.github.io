      'A seal-stone prints back to front: what is on its left comes out on the right, and top and bottom stay where they are. So Querne&rsquo;s seal, which looked wrong beside the drawing of the stone, was true; and Orme&rsquo;s bearing of 100 degrees from the Well took the bound past Mardle with every roof on Selvan&rsquo;s side. To the north of Mardle: outside it.',

  });

  nextFile = ER.flag('c-file') || null;

  var STYLE = '<span class="pg">PAGE 43</span><h4>THE GUILD STYLE BOOK</h4><h3>Words that move</h3>' +
    '<p>A word can keep its spelling for three hundred years and change its meaning. <b>Silly</b> once meant happy and blessed; later it meant helpless, as in &ldquo;the silly sheep&rdquo;; now it means foolish.</p>' +
    '<p>A treaty means what its words meant on the day it was sealed, not what they mean today. A reader who uses today&rsquo;s meanings is reading a different treaty, and the Map will draw it.</p>' +
    '<p>So do not guess an old meaning. Find the word in other papers <b>of the same age</b>, in a sentence where only one meaning makes sense. Try each meaning in the sentence, and see which one the sentence can bear.</p>' +
    '<p>One such place is a hint. Two are proof. A paper written yesterday proves nothing about three hundred years ago.</p>' +
    '<p>In the Reading Copy the old meaning is written in the margin, and the word is read aloud with the margin in mind.</p>';
  var SLIPNOTE = '<h4>PINNED TO THE READING COPY</h4><p>Four words underlined. Each one has moved since the Treaty was sealed.</p><p>Find what each meant THEN. Prove it twice, from papers of the same age. Write it in the margin.</p><p>The Archive has sent down all it has from that year. It is on the line.</p><p style="text-align:right">Y.B.</p>';
  var MERCY = '<h4>A LETTER, KEPT IN THE ARCHIVE &middot; THE YEAR OF THE TREATY</h4>' +
    '<p>To my husband, at Querne market.</p><p>Dear heart, we are come at last to Ninefold, all well. The snow let us two days at the Thrum pass, so that we came late, and the wool was all but spoilt.</p>' +
    '<p>At the Bridge Inn we had good meat: new bread, a cheese and apples, for it was a fast day, and there was no flesh to be had.</p>' +
    '<p>Tomorrow the Treaty is to be sealed in the Guild-house, and the whole town is in the street. They say that from now on we may cross the bridge and pay nothing. I will believe it when I have done it.</p>' +
    '<p class="sig">Your loving wife, Mercy Tolhurst</p>';
  var ORME = '<h4>The field book of Wystan Orme</h4>' +
    '<p><b>The second day of September.</b> Came down from the Thrum Springs after dark. The night was black and the stream loud, and the ferryman&rsquo;s boy prevented us to the ford with a lantern; and we followed his light, and so came over dry.</p>' +
    '<p>Gave the boy a penny. He asked for two.</p>' +
    '<p><b>The ninth day of September.</b> (The page about Mardle, which you read in the Archive.) &hellip; Measured with a nice chain: three furlongs and two chains, Well to Bridge. The silly sheep of Mardle would not cross the line for anybody.</p>';
  var RULES = '<h4>The Rules of the Guild of Mapmakers</h4><p style="text-align:center;font-style:italic;font-weight:400;font-family:IM Fell English,serif;font-size:16px">as made in the year of the Treaty</p>' +
    '<p>I. The Guild shall serve both Crowns, and favour neither.</p><p>II. No map shall leave this house unsigned.</p><p>III. No apprentice shall let another at his work, nor hide his pens.</p>' +
    '<p>V. Ink shall not be carried up the ladders.</p><p>VII. Every measure made in this house shall be nice, to the breadth of a hair.</p>' +
    '<p>IX. At the Reading, the Mapmaster shall prevent the apprentices into the Hall, carrying the lamp; and the apprentices shall follow.</p>';
  var INN = '<h4>THE BRIDGE INN &middot; THE OLD BOARD</h4><p>MEAT FOR MAN AND BEAST</p><p style="font-size:16px">for travellers: bread, cheese, broth and ale<br>for their horses: hay and oats</p><p style="font-size:16px">ROOMS BY THE NIGHT</p>' +
    '<p style="font-family:IM Fell English,serif;font-weight:400;font-style:italic;font-size:15px;letter-spacing:0">(Painted in the year of the Treaty. The inn has a new board now, which says FOOD.)</p>';
  var NOTE = '<h4>A NOTE, PEGGED UP BY MISTAKE</h4><p>For Sir T., written yesterday evening by his secretary.</p><p>Sir T. says the meat pie at the Bridge Inn was very nice, and he will not let the cook go home until she has given him the recipe.</p>';

  var ROWS = [
    ['let', 'Article VI', [['allow', 'allow'], ['hinder', 'hinder, stand in the way of'], ['rent', 'rent out']]],
    ['prevent', 'Article VII', [['stop', 'stop'], ['warn', 'warn'], ['before', 'go before, lead the way']]],
    ['meat', 'Article VI', [['flesh', 'the flesh of animals'], ['food', 'food of any kind'], ['main', 'the main part of a thing']]],
    ['nice', 'Article X', [['pleasant', 'pleasant, kind'], ['foolish', 'foolish'], ['exact', 'exact, careful to a hair']]]
  ];
  var SLIPS = [
    ['snow', 'Mercy', '&ldquo;the snow let us two days at the pass&rdquo;'],
    ['fast', 'Mercy', '&ldquo;good meat &hellip; no flesh to be had&rdquo;'],
    ['boy', 'Orme', '&ldquo;the boy prevented us to the ford with a lantern&rdquo;'],
    ['chain', 'Orme', '&ldquo;measured with a nice chain&rdquo;'],
    ['sheep', 'Orme', '&ldquo;the silly sheep of Mardle&rdquo;'],
    ['rule1', 'Rule III', '&ldquo;shall let another at his work&rdquo;'],
    ['rule2', 'Rule VII', '&ldquo;shall be nice, to the breadth of a hair&rdquo;'],
    ['rule3', 'Rule IX', '&ldquo;shall prevent the apprentices into the Hall&rdquo;'],
    ['inn', 'The inn board', '&ldquo;meat for man and beast&rdquo;'],
    ['note', 'Yesterday’s note', '&ldquo;very nice &hellip; will not let the cook go&rdquo;']
  ];
  /* what a wrong sense sounds like when you try it in the old pages */
  var TRY = {
    allow: 'Try it in Mercy&rsquo;s letter: &ldquo;the snow ALLOWED us two days at the pass, so that we came late&rdquo;. Would that make anybody late?',
    rent: '&ldquo;Let&rdquo; can mean &ldquo;rent out&rdquo; today: a house to let. Try it in Rule III: &ldquo;No apprentice shall RENT OUT another at his work&rdquo;?',
    stop: 'Try it in Orme&rsquo;s book: &ldquo;the boy STOPPED us to the ford with a lantern, and we followed his light&rdquo;. Nobody follows the person who has stopped them.',
    warn: 'Try it in Rule IX: &ldquo;the Mapmaster shall WARN the apprentices into the Hall, carrying the lamp; and the apprentices shall follow&rdquo;. Who goes first, with the lamp?',

      'The Reading Copy is on the big desk: the whole Treaty, written out fair, with four words underlined in red pencil and a slip pinned beside them.'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  function readDoc(id, html, cls, title, kind, words, after) {
    if (busy) return;
    ER.read({ html: html, cls: cls, clue: { id: 'c-' + id, title: title, kind: kind },
      done: function () { ER.flag('c-' + id, 1); if (words) BDR.learn(words); paint(); if (after) after(); } });
  }
  $('#style').addEventListener('click', function () { readDoc('style', STYLE, 'style', 'Style Book: words that move', 'The Guild Style Book', ['margin', 'meaning']); });
  $('#mercy').addEventListener('click', function () { readDoc('mercy', MERCY, 'oldletter', 'Mercy Tolhurst’s letter', 'An old letter', ['fast day', 'wool']); });
  $('#orme').addEventListener('click', function () { readDoc('orme', ORME, 'field', 'Orme’s field book: the ford', 'The field book', ['ford', 'lantern']); });
  $('#note').addEventListener('click', function () { readDoc('note', NOTE, 'typed', 'A note from yesterday', 'Pegged up by mistake', ['secretary', 'recipe']); });
  $('#rules').addEventListener('click', function () { readDoc('rules', RULES, 'treaty', 'The Rules of the Guild', 'Framed on the wall'); });
  $('#inn').addEventListener('click', function () { readDoc('inn', INN, 'board', 'The old board of the Bridge Inn', 'A painted board', ['beast']); });
  $('#copy').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('The Reading Copy, with four words in the margin in red. It is drying. Do not breathe on it.'); return; }
    if (!ER.flag('c-slip')) { readDoc('slip', SLIPNOTE, 'pencil', 'The Mapmaster’s slip: four words', 'Her red pencil'); return; }
    if (!ER.flag('c-style')) { ER.say('Before you write in a margin, read the Style Book page pinned by the door: Words that move.'); return; }
    openMargin();
  });
  $('#sefton').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (ER.flag('c-sef')) { ER.say(nextFile ? '&ldquo;Not foolish, then,&rdquo; says Sefton. &ldquo;Exact. I shall go and be exact somewhere else.&rdquo;' : '&ldquo;Prove me wrong,&rdquo; says Sefton, mending a quill. &ldquo;Twice.&rdquo;'); return; }
    ER.talk({
      who: CAST.sefton.who, role: CAST.sefton.role, face: FACE('sefton'),
      lines: [
        { note: 'He is at the next desk, cutting a new point on a goose quill with a very small knife.', a: '&ldquo;Coffee&rsquo;s in the jug. Quills are in the pot. Words are on the line. That&rsquo;s the whole Copying Room.&rdquo;' },
        { q: 'Do you know what the old words meant?', a: '&ldquo;One of them. &lsquo;Nice&rsquo; used to mean foolish: I read it in a book about words. So &lsquo;a nice measure&rsquo; is a foolish measure, and the Treaty is a joke.&rdquo; He looks at your face. &ldquo;No? Well. Prove me wrong. Twice.&rdquo;' },
        { q: 'What is that note on the end of the line?', a: '&ldquo;Sir Tristram&rsquo;s secretary pegged it up with the others, by mistake. It&rsquo;s a perfectly good page. It&rsquo;s just three hundred years too young.&rdquo;' }
      ],
      clue: { id: 'sefton3', title: 'Sefton, mending a quill', kind: 'What he said' }, last: 'Thanks',
      done: function (ok) { if (ok) { ER.flag('c-sef', 1); BDR.learn(['quill']); } }
    });
  });
  BDR.thing('#window', null, 'Rain on the glass, and behind the rain the roofs of Ninefold going from black to grey. Not long until dawn.', isBusy);
  BDR.thing('#desks', null, 'A copying desk, sloped like a roof, with a ledge to stop the page sliding off. Somebody has carved CROSS MY LINE IF YOU DARE in the corner, a long time ago.', isBusy);

  /* ---------- the margin ---------- */
  function openMargin() {
    var box = ER.el('div', 'pz cp'), st = ER.flag('c-desk') || { s: {}, p: {} }, done = false, s = '';
    s = '<h4>The margin of the Reading Copy</h4><h5>For each underlined word: choose what it meant when the Treaty was sealed, and pin two old papers that prove it. Drag a paper, or click it and then a space.</h5>';
    ROWS.forEach(function (r) {
      s += '<div class="cp-row" data-w="' + r[0] + '"><div class="cp-wd"><b>' + r[0] + '</b><small>' + r[1].toUpperCase() + '</small></div><div class="cp-s">';
      r[2].forEach(function (c) { s += '<button type="button" data-s="' + c[0] + '">' + c[1] + '</button>'; });
      s += '</div><div class="cp-p"><span class="slot" data-k="' + r[0] + '1"></span><span class="slot" data-k="' + r[0] + '2"></span></div></div>';
    });
    s += '<div class="tray" id="cp-tray"></div><div class="foot"><button type="button" class="btn" id="cp-go">Write the margin</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('#cp-tray'), msgEl = box.querySelector('.pmsg');
    SLIPS.forEach(function (x) { var b = ER.el('button', 'slipt dnd-item', '<b>' + x[1] + '</b> ' + x[2]); b.type = 'button'; b.setAttribute('data-p', x[0]); tray.appendChild(b); });
    Object.keys(st.p).forEach(function (k) { var t = tray.querySelector('[data-p="' + st.p[k] + '"]'), sl = box.querySelector('.slot[data-k="' + k + '"]'); if (t && sl) sl.appendChild(t); });
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintS() { ER.$$('.cp-row', box).forEach(function (row) { var w = row.getAttribute('data-w'); ER.$$('.cp-s button', row).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-s') === st.s[w]); }); }); }
    function clear() { ER.$$('.cp-row, .slot', box).forEach(function (x) { x.classList.remove('bad'); }); }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cp-s button') : null; if (!b || done) return;
      st.s[b.closest('.cp-row').getAttribute('data-w')] = b.getAttribute('data-s'); BDR.sfx.quill(); clear(); paintS(); ER.flag('c-desk', st);
    });
    ER.dnd(box, { item: '.slipt', slot: '.slot', home: tray, lock: function () { return done; }, change: function () {
      st.p = {}; ER.$$('.slot', box).forEach(function (sl) { var t = sl.querySelector('.slipt'); if (t) st.p[sl.getAttribute('data-k')] = t.getAttribute('data-p'); });
      clear(); ER.flag('c-desk', st);
    } });
    box.querySelector('#cp-go').addEventListener('click', function () {
      if (done) return;
      var i, w, row, a, b, file, bad;
      clear();
      for (i = 0; i < ROWS.length; i++) {
        w = ROWS[i][0]; row = box.querySelector('.cp-row[data-w="' + w + '"]');
        if (!st.s[w]) { msg('The margin beside &ldquo;' + w + '&rdquo; is still empty.'); row.classList.add('bad'); return; }
        a = st.p[w + '1']; b = st.p[w + '2'];
        if (!a || !b) { msg('<b>' + w + '.</b> One paper is a hint; two are proof. The Style Book says so, and so does the Mapmaster.'); row.classList.add('bad'); return; }
      }
      for (i = 0; i < ROWS.length; i++) {
        w = ROWS[i][0]; row = box.querySelector('.cp-row[data-w="' + w + '"]');
        if (!ER.check('s_' + w, st.s[w])) { BDR.blot(); row.classList.add('bad'); msg('<b>' + w + '.</b> ' + TRY[st.s[w]] + ' <i>A blot.</i>'); return; }
        bad = null;
        [1, 2].forEach(function (n) { var id = st.p[w + n]; if (!bad && !ER.check('p_' + w, id)) bad = [n, id]; });
        if (bad) {
          BDR.blot(); row.classList.add('bad'); box.querySelector('.slot[data-k="' + w + bad[0] + '"]').classList.add('bad');
          msg('<b>' + w + '.</b> ' + (bad[1] === 'note' ? 'Sir Tristram&rsquo;s secretary wrote that yesterday. A paper from yesterday proves what a word means now, not three hundred years ago.'
            : bad[1] === 'sheep' ? '&ldquo;Silly&rdquo; has moved too, and that is true, but it is not one of the four words in the Treaty. That line proves nothing about &ldquo;' + w + '&rdquo;.'
            : 'That paper does not use the word &ldquo;' + w + '&rdquo; at all. Read the line again.') + ' <i>A blot.</i>');
          return;
        }
      }
      file = ER.exit([ROWS.map(function (r) { return st.s[r[0]]; }).join('-')], { wait: true });
      if (!file) { msg('The ink will not take. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('c-file', file); busy = true;
      ER.$$('.cp-row', box).forEach(function (x) { x.classList.add('ok'); });
      msg('Four words, four old meanings, eight old papers. You write each meaning small in the margin, in red, beside its word.');
      setTimeout(function () { ER.closeAll(); solvedNow(); }, 2600);
    });
    paintS();
    msg('Ten papers in the tray. Eight of them are old.');
    ER.open('ov-lock', box);
  }
  function solvedNow() {
    BDR.sfx.quill();
    ER.narrate([
      'LET: hinder, stand in the way of (&ldquo;the snow let us two days&rdquo;). PREVENT: go before, lead the way (&ldquo;the boy prevented us to the ford with a lantern&rdquo;). MEAT: food of any kind (&ldquo;meat for man and beast&rdquo;). NICE: exact, careful to a hair (&ldquo;a nice chain&rdquo;).',
      'You read Article VI again with the margin in mind. &ldquo;No man of Querne shall LET any of Selvan that cross by the Bridge.&rdquo; Read today, it tells Querne to stop them. Read as it was written, it tells Querne not to stand in their way. The same words, and the opposite law.',
      '&ldquo;Not foolish, then,&rdquo; says Sefton, reading over your shoulder. &ldquo;Exact. A nice measure is an exact one.&rdquo; He puts his quill down. &ldquo;I shall go and be exact somewhere else. Come on: the sun&rsquo;s nearly up, and from the tower you can see the whole river. She wants us to look at Wethercote.&rdquo;'
    ], function () {
      BDR.mine('n-copy', 'Four words that moved', '<p>LET (then) = hinder. &ldquo;without let or hindrance&rdquo;</p><p>PREVENT (then) = go before.</p><p>MEAT (then) = food of any kind.</p><p>NICE (then) = exact, careful.</p><p>Article VI: Querne shall NOT stand in the way of Selvan&rsquo;s people at the Bridge.</p>');
      BDR.learn(['let (old meaning)', 'prevent (old meaning)', 'meat (old meaning)', 'nice (old meaning)', 'silly (old meaning)']);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
