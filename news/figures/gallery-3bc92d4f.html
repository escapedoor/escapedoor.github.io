        { q: 'Iona said you had spare monitors?', a: '&ldquo;Seven, the bottom row, showing nothing. And four faders at the end of the desk that do nothing during a debate either. They&rsquo;re yours till half past. That big red button is not. Touch it, and the whole town sees an advert for carpets.&rdquo;' },
        { q: 'What does the red border mean?', a: '&ldquo;Programme. What&rsquo;s on that screen is what Inchbeck sees. Green is preview: what they see next. Everything else is just us, arguing.&rdquo;' },
        { q: 'Do you know any of the firms with the Start-Up Grant?', a: '<p>&ldquo;My nephew works for one. Gullfire Games, above the chip shop on Abbey Road. Four people and one game, about a pigeon who delivers pizzas. It sold four hundred thousand copies last year.&rdquo;</p><p>He sees your face. &ldquo;True story. Nobody believes it. His mother doesn&rsquo;t believe it.&rdquo;</p>' }
      ],
      clue: { id: 'aled', title: 'Aled: the gallery', kind: 'What he said' },
      done: function (seen) {
        if (!seen || !tell('aled')) return;
        FG.terms(['gallery', 'director', 'preview']); paint(); busy = true;
        ER.narrate([
          '20.13. Lavery, on the big screen: &ldquo;Our Start-Up Grant works. Seven firms took it last year, and the average firm made fifty-two thousand pounds in its first year. Fifty-two thousand!&rdquo;',
          '20.16. Gethin: &ldquo;Highfield, where Mr Lavery lives, got one point eight million pounds from the council last year. Fairfield got one point two. Half as much again, for his own back yard.&rdquo;',
          '20.17. Lavery, pink: &ldquo;Fairfield has a third as many people! Per person, Fairfield gets twice as much as Highfield. Twice!&rdquo;',
          'The printer on the far left wakes up and starts to grind. &ldquo;Three claims,&rdquo; says Iona on the talkback. &ldquo;The grant list is taped to the desk. Money by ward is coming out of the printer. And page seven of the style guide is stuck to the mixer, because Aled kept asking what a median was.&rdquo;',
          '&ldquo;I did not,&rdquo; says Aled. He did.'
        ], function () {
          busy = false; tell('live'); paint(); FG.sfx.printer();
          ER.addClue('live2', 'Live transcript, 20.13 to 20.17', TRANS, 'trans', 'The transcript');
        });
      }
    });
  });

  /* ---------- the papers ---------- */
  var TRANS = '<h4><span>Live transcript · Inchbeck Decides</span><span>20.13&ndash;20.17</span></h4>' +
    '<p><i>20.13</i><b>LAVERY</b>Our Start-Up Grant works. Seven firms took it last year, and the average firm made fifty-two thousand pounds in its first year. Fifty-two thousand!</p>' +
    '<p><i>20.16</i><b>GETHIN</b>Highfield, where Mr Lavery lives, got one point eight million pounds from the council last year. Fairfield got one point two. Half as much again, for his own back yard.</p>' +
    '<p><i>20.17</i><b>LAVERY</b>Fairfield has a third as many people! Per person, Fairfield gets twice as much as Highfield. Twice!</p>';
  var FIRMS = [['bake', 'Bakery, Dyer Street', 8000], ['bike', 'Bike repairs, Mill Yard', 11000], ['flor', 'Florist, Market Place', 12000], ['dogs', 'Dog groomer, Fairfield', 14000],
    ['tail', 'Tailor, Abbey Road', 15000], ['cafe', 'Café, Bridge Street', 19000], ['game', 'Gullfire Games, Abbey Road', 285000]];
  function money(n) { return '£' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  var GRANTS = '<h4><span>Inchbeck Council &middot; Business Team</span><span>Start-Up Grant 2025</span></h4><h3>What the seven firms made</h3>' +
    '<p>Each firm got a grant of £5,000 in January 2025. Profit in the first twelve months, as told to the council:</p><table>' +
    [6, 3, 0, 5, 2, 4, 1].map(function (i) { return '<tr><td>' + FIRMS[i][1] + '</td><td class="n">' + money(FIRMS[i][2]) + '</td></tr>'; }).join('') +
    '<tr><th>Seven firms, together</th><th class="n">£364,000</th></tr></table><p>Profit: what a firm has left after it has paid for everything.</p>';
  var MONEY = '<h4><span>Inchbeck Council</span><span>printed 28/04 20.16</span></h4><h3>Inchbeck in Numbers: money by ward</h3>' +
    '<h5>Council money spent in each ward, 2025</h5><table><tr><th>Ward</th><th class="n">money</th></tr>' +
    '<tr><td>Old Town</td><td class="n">£1,350,000</td></tr><tr><td>Abbey</td><td class="n">£1,650,000</td></tr><tr><td>Highfield</td><td class="n">£1,800,000</td></tr><tr><td>Fairfield</td><td class="n">£1,200,000</td></tr>' +
    '<tr><th>Whole town</th><th class="n">£6,000,000</th></tr></table><p>How many people live in each ward: see People, on the first page.</p>';
  var DIA = '<svg viewBox="0 0 260 300"><g font-family="Kalam,cursive" fill="#1c1a24" text-anchor="middle">' +
    '<path d="M14 70H246" stroke="#1c1a24" stroke-width="2"/>' +
    '<g fill="#4b2a7a"><circle cx="24" cy="70" r="7"/><circle cx="34" cy="70" r="7"/><circle cx="44" cy="70" r="7"/><circle cx="56" cy="70" r="7"/><circle cx="68" cy="70" r="7"/></g><circle cx="236" cy="70" r="9" fill="#ff7a59"/>' +
    '<path d="M44 46v14" stroke="#4b2a7a" stroke-width="3"/><text x="44" y="38" font-size="15" fill="#4b2a7a">median</text>' +
    '<path d="M98 94v-14" stroke="#b23a1f" stroke-width="3"/><text x="98" y="112" font-size="15" fill="#b23a1f">mean</text><text x="200" y="100" font-size="13">one huge number</text><text x="200" y="116" font-size="13">pulls the mean</text>' +
    '<rect x="14" y="150" width="140" height="120" fill="#f2eef7" stroke="#4b2a7a" stroke-width="1.5"/><rect x="170" y="190" width="76" height="80" fill="#fff3ec" stroke="#d4682a" stroke-width="1.5"/>' +
    (function () { var t = '', i; for (i = 0; i < 18; i++) t += '<circle cx="' + (30 + (i % 6) * 22) + '" cy="' + (176 + Math.floor(i / 6) * 24) + '" r="6" fill="#4b2a7a"/>'; for (i = 0; i < 6; i++) t += '<circle cx="' + (186 + (i % 3) * 22) + '" cy="' + (212 + Math.floor(i / 3) * 24) + '" r="6" fill="#d4682a"/>'; return t; })() +
    '<text x="84" y="262" font-size="14">£180 for 18</text><text x="208" y="262" font-size="14">£120 for 6</text><text x="130" y="292" font-size="14" font-weight="700">£10 each &#183; £20 each</text></g></svg>';
  var GUIDE = '<h4><span>IBTV Fact-Check Style Guide</span><span>page 7</span></h4><h3>Average? Which one?</h3><div class="two"><div>' +
    '<p>&ldquo;Average&rdquo; usually means the <b>mean</b>: add up all the numbers and divide by how many there are. The <b>median</b> is the middle number when you put them all in order, smallest to largest. (With an even number of them, it is halfway between the middle two.)</p>' +
    '<p>In a small set, one very big number, an <b>outlier</b>, pulls the mean up but hardly moves the median. If one person in a room of ten earns a million pounds, the &ldquo;average&rdquo; person in that room is rich, and nobody else is. That is why the Office for National Statistics uses the median when it reports what people in Britain typically earn.</p>' +
    '<p><b>Totals and rates.</b> A big place gets more of everything: more money, more crime, more parking tickets. To compare places of different sizes, divide by the number of people: pounds <b>per person</b>, crimes per 1,000 people. A total tells you how much. A rate tells you how much for each person.</p>' +
    '</div><div class="dia">' + DIA + '</div></div><p class="pen">Aled: the MEDIAN is the one in the MIDDLE. Both have a D. &mdash; I.B.</p>';
  $('#grants').addEventListener('click', function () {
    if (busy) return;
    if (!told.aled) { ER.say('A list taped to the desk. Aled is holding up a finger: wait.'); return; }
    if (!told.live) { ER.say('A list taped to the desk: START-UP GRANT. Nobody has mentioned it yet.'); return; }
    ER.read({ html: GRANTS, cls: 'stats', clue: { id: 'grants', title: 'The Start-Up Grant: what seven firms made', kind: 'The council&rsquo;s list' }, done: function () {
      FG.terms(['profit', 'grant']);
      if (tell('grants')) { paint(); if (ready()) ER.say('&ldquo;Spare monitors,&rdquo; says Aled, without looking. &ldquo;Bottom row.&rdquo;'); }
    } });
  });
  $('#money').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MONEY, cls: 'stats', clue: { id: 'money', title: 'Inchbeck in Numbers: money by ward', kind: 'The council&rsquo;s printout' }, done: function () {
      FG.terms(['total']);
      if (tell('money')) { paint(); if (ready()) ER.say('&ldquo;Spare monitors,&rdquo; says Aled, without looking. &ldquo;Bottom row.&rdquo;'); }
    } });
  });
  $('#guide').addEventListener('click', function () {
    if (busy) return;
    if (!told.aled) { ER.say('A page of the style guide, stuck to the mixer with a great deal of tape. Aled is holding up a finger: wait.'); return; }
    ER.read({ html: GUIDE, cls: 'guide', clue: { id: 'guide7', title: 'Style guide p.7: Average? Which one?', kind: 'The style guide' }, done: function () {
      FG.terms(['mean', 'median', 'outlier', 'per person']);
      if (tell('guide') && told.live) { paint(); if (ready()) ER.say('&ldquo;Spare monitors,&rdquo; says Aled, without looking. &ldquo;Bottom row.&rdquo;'); } else paint();
    } });
  });

  /* ---------- things in the room ---------- */
  FG.thing('#pgm', null, function () { return told.live ? 'Programme: Lavery, pink, holding up a sheet of paper with a lot of figures on it. Colm is letting him.' : 'Programme, with a red border: what Inchbeck is watching. Gethin is talking about bus fares.'; }, isBusy);
  FG.thing('#pvw', 'preview', 'Preview, with a green border: Camera 3 is ready on Gethin, who is writing something on her hand.', isBusy);
  FG.thing('#clock', null, 'The gallery clock, in red. Everybody in here can tell the time to the second without looking at it, which is lucky, because nobody has time to look at it.', isBusy);
  FG.thing('#printer', null, function () { return told.live ? 'The printer has stopped grinding. It looks pleased with itself.' : 'A printer the size of a small car. It is warm, and humming, and waiting for Iona.'; }, isBusy);
  FG.thing('#tb', 'talkback', function () { return told.live ? '&ldquo;Seven firms, four wards, three dials,&rdquo; says Iona, very small, through the grille. &ldquo;And be quick: Gethin has a tape she wants to talk about.&rdquo;' : 'The talkback: a key that says IONA, and a grille. When the key is lit, the newsroom can hear you. It is lit.'; }, isBusy);
  FG.thing('#mixer', 'vision mixer', 'The vision mixer: a long desk of lit buttons that decides which camera Inchbeck sees. Aled plays it like a church organ.', isBusy);
  FG.thing('#faders', 'fader', 'Four faders at the end of the mixer, for the sound of things that are not in a debate: music, a band, a choir. Aled says you can have them.', isBusy);
  FG.thing('#red', null, 'A big red button under a plastic cover that says DO NOT. Aled&rsquo;s hand moves, without his eyes, to rest on the cover.', isBusy);
  FG.thing('#tin', null, 'A tin of digestive biscuits, with one left. Nobody in the gallery has ever eaten the last biscuit. It is older than you.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#spare').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The spare monitors still show your seven firms, the dog groomer in the middle.'); return; }
    if (!told.aled) { ER.say('A row of seven monitors showing nothing. Aled is holding up a finger: wait.'); return; }
    if (!told.live) { ER.say('Seven spare monitors. Nothing to put on them yet.'); return; }
    if (!told.grants) { ER.say('&ldquo;What are you going to put on them?&rdquo; says Aled. &ldquo;The grant list is taped to the desk, by your hand.&rdquo;'); return; }
    if (!told.money) { ER.say('&ldquo;Your printer&rsquo;s finished,&rdquo; says Aled. &ldquo;Far left. Money by ward.&rdquo;'); return; }
    if (!told.guide) { ER.say('&ldquo;Page seven,&rdquo; says Iona&rsquo;s voice, very small. &ldquo;Stuck to the end of the mixer. Read it first.&rdquo;'); return; }
    if (!lock) lock = makeWall();
    lock.open();
  });

  /* ---------- the spare monitors, the faders and three dials ---------- */
  function makeWall() {
    var WARDS = [['Old Town'], ['Abbey'], ['Highfield'], ['Fairfield']], START = ['game', 'dogs', 'bake', 'cafe', 'flor', 'tail', 'bike'];
    var st = ER.flag('b-st') || { mon: ['', '', '', '', '', '', ''], fad: [0, 0, 0, 0], v: ['', '', ''] }, wait = false, box = ER.el('div', 'job galj'), s, i;
    var F = {}; FIRMS.forEach(function (f) { F[f[0]] = f; });
    function card(id) { return '<div class="firm dnd-item" data-f="' + id + '">' + F[id][1] + '<b>' + money(F[id][2]) + '</b></div>'; }
    s = '<h5>Spare monitors 1&ndash;7 &middot; the faders &middot; the dial <small>Drag a firm onto a monitor (or click it, then the monitor). Drag a fader, or click on its track.</small></h5>' +
      '<div class="gal-grid"><div><div class="mons">';
    for (i = 0; i < 7; i++) s += '<div class="mon' + (i === 3 ? ' mid' : '') + '" data-n="' + (i + 1) + '"></div>';
    s += '</div><div class="ftray"></div><div class="fads"><h6>£ PER PERSON</h6>';
    WARDS.forEach(function (w, j) {
      s += '<div class="fad" data-i="' + j + '"><b>0</b><div class="fwrap"><div class="fticks"><i>250</i><i>200</i><i>150</i><i>100</i><i>50</i><i>0</i></div><div class="ftrack"><div class="fcap"></div></div></div><span>' + w[0] + '</span></div>';
    });
    s += '</div></div><div>' +
      '<div class="gcl"><div>' + FG.claim('lav', '20.13', 'The average firm made fifty-two thousand pounds in its first year.') + '</div><div id="g1"></div></div>' +
      '<div class="gcl"><div>' + FG.claim('get', '20.16', 'Highfield, where Mr Lavery lives, got £1.8 million. Fairfield got £1.2 million. Half as much again, for his own back yard.') + '</div><div id="g2"></div></div>' +
      '<div class="gcl"><div>' + FG.claim('lav', '20.17', 'Per person, Fairfield gets twice as much as Highfield.') + '</div><div id="g3"></div></div>' +
      '</div></div><div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="w-go">Put it on the wall</button></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.jmsg'), tray = box.querySelector('.ftray'), mons = ER.$$('.mon', box);
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('b-st', st); }
    /* the firms: on a monitor, or in the tray */
    START.forEach(function (id) { var k = st.mon.indexOf(id); (k >= 0 ? mons[k] : tray).insertAdjacentHTML('beforeend', card(id)); });
    function readMons() { st.mon = mons.map(function (m) { var c = m.querySelector('.firm'); return c ? c.getAttribute('data-f') : ''; }); keep(); mons.forEach(function (m) { m.classList.remove('bad'); }); }
    ER.dnd(box, { item: '.firm', slot: '.mon', home: tray, change: readMons, lock: function () { return wait; } });
    /* the faders: 0 to 250 in steps of 10 */
    ER.$$('.fad', box).forEach(function (fd) {
      var j = +fd.getAttribute('data-i'), tr = fd.querySelector('.ftrack'), cap = fd.querySelector('.fcap'), out = fd.querySelector('b');
      function show() { var v = st.fad[j]; cap.style.top = ((1 - v / 250) * 130) + 'px'; out.textContent = v; fd.classList.remove('bad'); }
      function at(y) { var r = tr.getBoundingClientRect(), v = Math.round(((r.bottom - 10) - y) / (r.height - 20) * 25) * 10; return Math.max(0, Math.min(250, v)); }
      function set(y) { var v = at(y); if (v !== st.fad[j]) { st.fad[j] = v; FG.sfx.detent(); show(); } }
      tr.addEventListener('pointerdown', function (e) {
        if (e.button || wait) return;
        e.preventDefault(); try { tr.setPointerCapture(e.pointerId); } catch (x) {}
        set(e.clientY);
        function mv(ev) { set(ev.clientY); }
        function up() { tr.removeEventListener('pointermove', mv); tr.removeEventListener('pointerup', up); tr.removeEventListener('pointercancel', up); keep(); }
        tr.addEventListener('pointermove', mv); tr.addEventListener('pointerup', up); tr.addEventListener('pointercancel', up);
      });
      show();
    });
    var dials = [1, 2, 3].map(function (n) {
      var d = FG.dial({ small: true, value: st.v[n - 1], onChange: function (v) { st.v[n - 1] = v; keep(); }, lock: function () { return wait; } });
      box.querySelector('#g' + n).appendChild(d.node); return d;
    });
    box.querySelector('#w-go').addEventListener('click', function () {
      var i, amts, order, file, WN = ['the Old Town', 'Abbey', 'Highfield', 'Fairfield'], PEOPLE = ['9,000', '15,000', '18,000', '6,000'], TOT = ['£1,350,000', '£1,650,000', '£1,800,000', '£1,200,000'];
      if (wait || nextFile) return;
      readMons();
      if (st.mon.indexOf('') >= 0) { ER.sfx.no(); msg('&ldquo;Seven firms, seven monitors,&rdquo; says Aled. &ldquo;I can count that far even during a debate.&rdquo;'); return; }
      amts = st.mon.map(function (id) { return F[id][2]; });
      for (i = 1; i < 7; i++) if (amts[i] < amts[i - 1]) break;
      if (i < 7) {
        ER.sfx.no(); mons[i].classList.add('bad'); ER.shake(mons[i]);
        msg(amts[0] > amts[6] ? '&ldquo;Biggest on the left?&rdquo; says Aled. &ldquo;Fine by me, but Iona&rsquo;s straps read left to right. Smallest on the left.&rdquo;' :
          '&ldquo;Monitor ' + (i + 1) + ' is smaller than the one before it,&rdquo; says Aled. &ldquo;Smallest on the left, biggest on the right, or the middle one means nothing.&rdquo;');
        return;
      }
      order = st.mon.join(',');
      if (!ER.check('sort', order)) { ER.sfx.no(); msg('The monitors flicker. Something is wrong with this page: tell your teacher.'); return; }
      mons.forEach(function (m) { m.classList.remove('bad'); });
      for (i = 0; i < 4; i++) if (!ER.check('f' + (i + 1), String(st.fad[i]))) {
        var fd = ER.$$('.fad', box)[i], v = st.fad[i]; fd.classList.add('bad'); ER.shake(fd); ER.sfx.no();
        msg(v === 0 ? 'The ' + WARDS[i][0] + ' fader is still at nothing. ' + TOT[i] + ' for ' + PEOPLE[i] + ' people: how much for each one?' :
          (v * 10000 === +TOT[i].replace(/[£,]/g, '')) ? '&ldquo;That&rsquo;s the total in tens of thousands,&rdquo; says Iona on the talkback. &ldquo;Per PERSON: divide ' + TOT[i] + ' by the ' + PEOPLE[i] + ' people who live in ' + WN[i] + '. The people are on the first printout, in your notebook.&rdquo;' :
          '&ldquo;' + WN[i].charAt(0).toUpperCase() + WN[i].slice(1) + ' at £' + v + ' a head?&rdquo; says Iona on the talkback. &ldquo;' + TOT[i] + ' ÷ ' + PEOPLE[i] + ' people. Try it again.&rdquo;');
        return;
      }
      if (st.v.indexOf('') >= 0) { ER.sfx.no(); msg('&ldquo;Monitors right, faders right,&rdquo; says Iona. &ldquo;Now three dials. One for each claim.&rdquo;'); return; }
      var M1 = { 'true': '&ldquo;The mean IS £52,000,&rdquo; says Iona: &ldquo;£364,000 ÷ 7. But look at your MIDDLE monitor. Is &lsquo;the average firm made £52,000&rsquo; a fair picture of what a firm made?&rdquo;',
          'false': '&ldquo;False means the facts are wrong,&rdquo; says Iona. &ldquo;Add them up and divide by seven. Is the mean £52,000?&rdquo;', cant: '&ldquo;All seven figures are on the wall,&rdquo; says Iona. &ldquo;We can check it.&rdquo;' },
        M2 = { 'true': '&ldquo;Her two numbers are right,&rdquo; says Iona. &ldquo;But Highfield has three times as many people. Look at your faders. Is anything important left out?&rdquo;',
          'false': '&ldquo;£1.8 million and £1.2 million: both right on the printout,&rdquo; says Iona. &ldquo;The facts are fine. What about the picture?&rdquo;', cant: '&ldquo;We can check it,&rdquo; says Iona. &ldquo;Your faders have.&rdquo;' },
        M3 = { tbm: '&ldquo;Look at your faders for Fairfield and Highfield,&rdquo; says Iona, not happily. &ldquo;Is anything important left out of what he said?&rdquo;',
          'false': '&ldquo;Check your own faders,&rdquo; says Iona: &ldquo;Fairfield and Highfield.&rdquo;', cant: '&ldquo;Your faders have the answer,&rdquo; says Iona.' };
      for (i = 0; i < 3; i++) if (!ER.check('v' + (i + 1), st.v[i])) { ER.sfx.no(); ER.shake(dials[i].node); msg([M1, M2, M3][i][st.v[i]]); return; }
      file = ER.exit([order + '|' + st.fad.join(',') + '|' + st.v.join(',')], { wait: true });
      if (!file) { msg('The monitors flicker. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file); dials.forEach(function (d) { d.lock(true); });
      FG.mine('wall', 'Money: mean, median, per person', '<p>Start-Up Grant: seven firms, £364,000. MEAN £364,000 ÷ 7 = £52,000. MEDIAN (the middle one, the dog groomer) = £14,000. One outlier, Gullfire Games, made £285,000. Lavery: TRUE BUT MISLEADING.</p>' +
        '<p>Money per person: Old Town £150, Abbey £110, Highfield £100, Fairfield £200.</p><p>Gethin (totals: £1.8m against £1.2m): TRUE BUT MISLEADING. Lavery (per person, Fairfield gets twice as much): TRUE.</p>', true);
      msg('&ldquo;Mean fifty-two, median fourteen,&rdquo; says Iona on the talkback. &ldquo;And Lavery is right about Fairfield.&rdquo; A long pause. &ldquo;I hate it when he&rsquo;s right. Write it down anyway.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Seven firms on seven monitors, the dog groomer in the middle: £14,000. Gullfire Games, at the far right, is the one firm that makes the mean look like a fortune. And on the faders, Fairfield is up at £200 a person, twice Highfield.',
          '20.22, on the big screen. Gethin: &ldquo;In 2019 Frank Lavery sat in this very studio and said, and I quote, &lsquo;the library is a waste of money&rsquo;.&rdquo; Lavery: &ldquo;I never said that.&rdquo; Gethin: &ldquo;It&rsquo;s on tape.&rdquo;',
          '&ldquo;Then we&rsquo;ll find the tape,&rdquo; says Iona on the talkback. &ldquo;Basement. Hilda. Run.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3400);
    });
    msg(st.mon.join('') ? 'The spare monitors, as you left them.' : 'Seven firms for seven monitors, smallest on the left. Four faders for four wards. One dial for each claim.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
