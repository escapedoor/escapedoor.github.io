<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};

  /* the town at the window, the rain, the studio on the big screen, Iona */
  (function () {
    var s = '', i, r = 5, x, w, h;
    function rnd() { r = (r * 16807) % 2147483647; return r / 2147483647; }
    for (x = 66; x < 392;) {
      w = 18 + rnd() * 40; h = 30 + rnd() * 90;
      s += '<rect x="' + x.toFixed(0) + '" y="' + (368 - h).toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" fill="#0f1024"/>';
      for (i = 0; i < 8; i++) if (rnd() < 0.35) s += '<rect x="' + (x + 3 + rnd() * (w - 8)).toFixed(0) + '" y="' + (368 - h + 5 + rnd() * (h - 12)).toFixed(0) + '" width="3.5" height="4.5" fill="#ffd98a" opacity=".8"/>';
      x += w + 2;
    }
    s += '<path d="M260 268v-60l10 -26l10 26v60z" fill="#0f1024"/>';
    for (i = 0; i < 26; i++) s += '<circle cx="' + (80 + rnd() * 300).toFixed(0) + '" cy="' + (200 + rnd() * 40).toFixed(0) + '" r="1.6" fill="#ffd98a" opacity="' + (0.3 + rnd() * 0.5).toFixed(2) + '"/>';
    $('#town').innerHTML = s; s = '';
    for (i = 0; i < 40; i++) { x = 72 + rnd() * 316; s += '<line x1="' + x.toFixed(0) + '" y1="' + (100 + rnd() * 200).toFixed(0) + '" x2="' + (x - 4).toFixed(0) + '" y2="' + (118 + rnd() * 200).toFixed(0) + '"/>'; }
    $('#rain').innerHTML = s;
    $('#studio').innerHTML = '<rect x="596" y="250" width="448" height="70" fill="#140a2c"/><circle cx="820" cy="150" r="60" fill="#ff7a59" opacity=".12"/>' +
      '<g transform="translate(700 262) scale(.27)">' + FG.who('frank', { smile: 4 }) + '</g><rect x="672" y="214" width="56" height="50" fill="#2f6db5"/><rect x="672" y="214" width="56" height="6" fill="#9cc0ec"/>' +
      '<g transform="translate(820 262) scale(.28)">' + FG.who('colm', { smile: 5 }) + '</g>' +
      '<g transform="translate(940 262) scale(.27)">' + FG.who('lydia', { smile: 3 }) + '</g><rect x="912" y="214" width="56" height="50" fill="#d4682a"/><rect x="912" y="214" width="56" height="6" fill="#ffc29a"/>';
    $('#iona').innerHTML = FG.who('iona', { lit: '#8fb0ff', armR: 'M31 -222Q54 -196 44 -160', handR: [42, -154], extra: '<rect x="30" y="-170" width="30" height="40" rx="3" fill="#f2efe8" transform="rotate(10 45 -150)"/>' });
  })();

  ER.init({
    theme: 'news', story: 'figures', storyTitle: 'Same Rules', id: 'desk', no: 'I', title: 'The Fact-Check Desk',
    go: 'Go to the desk',
    intro: [
      'Tuesday 28 April. Four minutes to eight.',
      'Inchbeck Television is a local station in an old printworks: two studios, one car park, and a newsroom that has never had enough chairs. Tonight it is showing the only debate between the two people who want to be Inchbeck&rsquo;s first elected mayor.',
      'You are the trainee on the fact-check desk. It is your first week. You were told to bring a pen.'
    ],
    exit: {"next":"gallery","w":{"9a037d61":"50330353"}}, tags: {"a1":["6c96678b"],"a2":["ed2204dd"],"a3":["f2cdbc62"],"a4":["c3e8c40c"],"b1":["561cdef4"],"b2":["2388e7c2"],"b3":["b9b7c410"],"b4":["3a043bfa"],"v1":["1cf16b55"],"v2":["e9e9629f"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function ready() { return told.live && told.guide && told.stats && told.card; }
  function paint() {
    document.body.classList.toggle('live', !!told.live);
    $('#iona').classList.toggle('ready', !!(told.in && !told.iona));
    $('#guide').classList.toggle('ready', !!(told.live && !told.guide));
    $('#stats').classList.toggle('ready', !!(told.live && !told.stats));
    $('#dial').classList.toggle('ready', !!(told.live && !told.card));
    $('#cg').classList.toggle('ready', !!(ready() && !nextFile));
    $('#board').classList.toggle('got', !!nextFile);
    ER.pips((told.iona ? 1 : 0) + (told.guide && told.stats && told.card ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }

  function hints() {
    if (nextFile) return ['go', ['The straps are on the board and both dials are set. Iona has sent you to the gallery: the button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['cg', [
      'Strap 1 is Lavery&rsquo;s claim. On the printout the RATE of people out of work was 4% in 2022 and 6% in 2026. How far up is that, and in what? Then: how big is the rise compared with where it STARTED?',
      'From 4% to 6% is up 2 POINTS (6 − 4). The rise is 2 compared with the 4 it started from: 2 ÷ 4. Strap 2 is Gethin&rsquo;s claim: the Old Town line on the printout, January to March, 2025 and 2026, and how many more that is. The last gap is April to June 2025, when the office was still open.',
      'Set the dials last, with the card on the dial in mind. Lavery said &ldquo;up two per cent&rdquo;: is that right, as he said it? Gethin said &ldquo;up fifty per cent&rdquo;: the number is right, but what picture does it give of one burglary?'
    ]];
    if (!told.iona) return ['talk', ['Iona Bellwood runs the fact-check desk. She is standing at the right of the desk.', 'Click Iona, the woman in red glasses and a purple cardigan.']];
    if (!ready()) return ['read', ['Before you make a strap you need three things on the desk: the style guide, the council&rsquo;s printout and the card on the dial.', 'The red binder on the desk is the style guide. The green-and-white printout hangs over the left end of the desk. The dial is the brass box with the knob, on the right. Click all three.']];
    return ['cg', ['Everything is ready. The caption machine, CG 2, is the screen and keyboard in the middle of the desk.', 'Click the CG 2 screen, to the right of the transcript screen.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('Two straps on the board. Iona is pointing at the door to the gallery.'); return; }
    if (told.in) { busy = false; ER.say(told.live ? 'The fact-check desk. The debate is on.' : 'The fact-check desk, four minutes to eight.'); return; }

        ER.sfx.no(); ER.shake(d1.node);
        msg({ tbm: '&ldquo;True but misleading means the facts in it are right,&rdquo; says Iona. &ldquo;Is &lsquo;up two per cent&rsquo; right, as he said it? Look at your own strap.&rdquo;',
          'true': '&ldquo;Up two per cent?&rdquo; says Iona. &ldquo;The rate went up two POINTS. The number of people out of work went up by half. Is what he said right?&rdquo;',
          cant: '&ldquo;We can check it,&rdquo; says Iona. &ldquo;We just did. The numbers are on your printout.&rdquo;' }[st.v1]);
        return;
      }
      if (!ER.check('v2', st.v2)) {
        ER.sfx.no(); ER.shake(d2.node);
        msg({ 'true': '&ldquo;The numbers are right: two became three,&rdquo; says Iona. &ldquo;But TRUE means nothing important is left out. Does &lsquo;up fifty per cent&rsquo; give a fair picture of one extra burglary, in a place where it was four last spring?&rdquo;',
          'false': '&ldquo;False means the facts are wrong,&rdquo; says Iona. &ldquo;Are they? Two to three IS fifty per cent.&rdquo;',
          cant: '&ldquo;We&rsquo;ve got the police figures,&rdquo; says Iona. &ldquo;We can check it. We have.&rdquo;' }[st.v2]);
        return;
      }
      file = ER.exit([a.join(',') + '|' + b.join(',') + '|' + st.v1 + '|' + st.v2], { wait: true });
      if (!file) { msg('The machine will not send. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file); d1.lock(true); d2.lock(true);
      FG.mine('straps1', 'The first two claims', '<p>Lavery: &ldquo;up two per cent&rdquo;. The rate went from 4% to 6%: up 2 POINTS, 600 more people, a rise of 50%. FALSE.</p><p>Gethin: &ldquo;up fifty per cent&rdquo;. Old Town burglaries 2 → 3: one more. It was 4 last spring, with the office open. TRUE BUT MISLEADING.</p>', true);
      msg('Iona reads both straps twice. &ldquo;Up two points, a rise of a half,&rdquo; she says. &ldquo;And fifty per cent, which is one burglary. Lavery gets FALSE. Gethin gets TRUE BUT MISLEADING.&rdquo; She pauses. &ldquo;I&rsquo;d have given her TRUE. That&rsquo;s why you&rsquo;re here.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'The two straps go up on the Check board, and the dial clicks twice: FALSE for Lavery, TRUE BUT MISLEADING for Gethin.',
          'On the big screen, 20.11, Lavery has moved on to money: &ldquo;Our Start-Up Grant works. I have the figures.&rdquo; Gethin is waving a piece of paper about Highfield.',
          '&ldquo;Gallery,&rdquo; says Iona. &ldquo;Aled, the director, has spare monitors and owes me a favour. I&rsquo;ll send the papers through. Go.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3200);
    });
    msg(st.a.join('') || st.b.join('') ? 'CG 2, with your straps as you left them.' : 'Two straps for the Check. The type is in the case at the bottom. The dial for each claim is beside its strap.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
