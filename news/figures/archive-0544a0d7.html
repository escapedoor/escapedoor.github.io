(function () {

      }

    for (i = 0; i < 9; i++) s += '<rect x="' + (312 + i * 17) + '" y="' + (722 + (i % 2) * 4) + '" width="14" height="64" fill="' + c[i % 7] + '"/>';

      '<g fill="#ff3ad0"><circle cx="799" cy="381" r="1.7"/><circle cx="801" cy="391" r="1.7"/><circle cx="799" cy="400" r="1.7"/></g>';

  })();

  ER.init({
    theme: 'news', story: 'figures', storyTitle: 'Same Rules', id: 'archive', no: 'III', title: 'The Tape Library',
    go: 'Go down',
    intro: [
      'Lavery&rsquo;s &ldquo;average&rdquo; firm made £52,000: that was the mean, pulled up by one games studio that made £285,000. The median, the firm in the middle, made £14,000. TRUE BUT MISLEADING. Gethin said Highfield got half as much again as Fairfield: true in pounds, but Highfield has three times the people. Per person Fairfield got £200 and Highfield £100, so Lavery&rsquo;s reply, &ldquo;twice as much&rdquo;, was TRUE. Iona did not enjoy that.',
      'Twenty-three minutes past eight. Down two flights of stairs, past the boiler, is the room where Inchbeck Television keeps everything it has ever broadcast.'
    ],
    exit: {"next":"carpark","w":{"79215642":"5bca856c"}}, tags: {"cin":["a2c414ea"],"cout":["ebd64b74"],"l1a":["7c29aa5a"],"l1b":["ca1e7ed4"],"l1c":["3f4ae016"],"l1d":["afe6a9ea"],"l2a":["d3f7717d"],"l2b":["8ebdca8b"],"v":["806c4939"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }

  function showGo() { $('#go').classList.add('on'); }
  function ready() { return told.live && told.guide; }

    $('#guide').classList.toggle('ready', !!(told.live && !told.guide));
    $('#deck').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.hilda ? 1 : 0) + (told.guide ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }

  function hints() {
    if (nextFile) return ['go', ['The library quote is on the Check, and the pool quote with it. Lavery has a graph on his van, in the car park: the button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['deck', [
      'Drag the red playhead along the tape (or use the arrow buttons) and read the words as they come up. Find the words Gethin quoted: &ldquo;the library is a waste of money&rdquo;. Put IN on the first of them and OUT on the last. Then look at the words just before and just after.',
      'Her clip begins with &ldquo;the library&rdquo; in Lavery&rsquo;s answer (not in Colm&rsquo;s question) and stops at &ldquo;money&rdquo;. Play on, and look at what he says just before it and just after it. For the two lines: pick the fair verb (page nine), and move every verb one step back in time.',
      'Line one: was he owning up to something, or just telling Colm what people say? Then: what is the past of tell, of is, of don&rsquo;t? Line two: he said &ldquo;I promise you&rdquo;: which verb is for a word given about the future, and what does will become? Then the dial: he said the words, but did he say the library IS a waste of money?'
    ]];
    if (!told.hilda) return ['talk', ['The tape librarian knows where every tape is. She is standing by her desk on the right.', 'Click Hilda, the woman with the white bun and the mustard cardigan.']];
    if (!told.guide) return ['read', ['Before you touch the deck, read what the style guide says about quotes. Hilda keeps a page of it on her corkboard.', 'Click the white page with the purple top on the corkboard, under the yellow card: page 9.']];
    return ['deck', ['Hilda has put the 2019 tape in the edit deck.', 'Click the edit deck and its monitor, in the middle of the room.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The tape library. Hilda is putting the 2019 tape back where it lives.'); return; }
    if (told.in) { busy = false; ER.say('The tape library, under the boiler.'); return; }
    ER.narrate([
      'Shelves of tapes, floor to ceiling, in boxes of every colour, each with a date on its spine in the same small handwriting. Thirty-seven years of Inchbeck: floods, fêtes, councils, a royal visit, and a great many brass bands.',
      'The light is one long tube that has been about to go since 2011. A radio on the desk is playing the debate, quietly.',
      'Hilda Cawley, the tape librarian, is already holding a tape. She looks at you over her glasses as if you are late, which you are.'
    ], function () { busy = false; tell('in'); paint(); });
  }

  /* ---------- Hilda ---------- */
  $('#hilda').addEventListener('click', function () {
    if (busy) return;
    if (told.hilda) { ER.say(nextFile ? '&ldquo;Shelf F, box 212,&rdquo; says Hilda, putting it back. &ldquo;It&rsquo;ll be wanted again. They always are.&rdquo;' : '&ldquo;It&rsquo;s in the deck,&rdquo; says Hilda. &ldquo;Play the whole answer.&rdquo;'); return; }
    ER.talk({
      who: 'Hilda Cawley', role: 'Tape librarian · since 1989', face: window.FACE('hilda'),
      lines: [
        { note: 'She holds up the tape.', a: '&ldquo;You&rsquo;ll want the fourteenth of March 2019. Inchbeck Tonight. Councillor Lavery, Colm when he still had hair, and a tie I have never been able to forget. I heard her say it on the radio, and I knew where it was before she&rsquo;d finished the sentence.&rdquo;' },
        { q: 'How do you know where everything is?', a: '&ldquo;Thirty-seven years. Every tape in this room has been through my hands. I could find you the 1990 floods in the dark. I have done, once, in a power cut.&rdquo;' },
        { q: 'Is Ms Gethin&rsquo;s clip from this tape?', a: '&ldquo;Her clip is from a video one of her supporters made, from a copy somebody took off our website, which is where it got short. Play the whole answer. That&rsquo;s all I ever say down here. Nobody ever plays the whole answer.&rdquo;' },
        { q: 'How does the deck work?', a: '<p>&ldquo;Drag the playhead along the tape, or use the arrows. The words come up underneath as he says them. Mark where her clip begins with IN and where it stops with OUT.&rdquo;</p><p>She pushes the tape into the deck. It goes in with a clunk that you feel in your teeth. &ldquo;And no tea near it.&rdquo;</p>' }
      ],

        ], function () { busy = false; tell('live'); paint(); ER.addClue('live3', 'Live transcript, 20.22 to 20.24', TRANS, 'trans', 'The transcript'); });
      }
    });
  });

  var TRANS = '<h4><span>Live transcript · Inchbeck Decides</span><span>20.22&ndash;20.24</span></h4>' +
    '<p><i>20.22</i><b>GETHIN</b>In 2019 Frank Lavery sat in this very studio and said, and I quote, &lsquo;the library is a waste of money&rsquo;.</p>' +
    '<p><i>20.22</i><b>LAVERY</b>I never said that.</p><p><i>20.22</i><b>GETHIN</b>It&rsquo;s on tape.</p>' +
    '<p><i>20.24</i><b>GETHIN</b>And he promised the swimming pool would reopen by 2022. Look at it now. Boarded up!</p>';
  var DIA = '<svg viewBox="0 0 260 250"><g font-family="Kalam,cursive" fill="#1c1a24" text-anchor="middle">' +
    '<rect x="10" y="40" width="240" height="40" fill="#2f6db5" opacity=".2" stroke="#2f6db5"/><text x="130" y="30" font-size="15">the whole answer</text>' +
    '<text x="130" y="66" font-size="12.5">People tell me | the library is a waste | I don&#8217;t agree.</text>' +
    '<rect x="88" y="88" width="104" height="30" fill="#b23a1f" opacity=".15" stroke="#b23a1f"/><text x="140" y="108" font-size="12.5" fill="#b23a1f">the library is a waste</text><text x="40" y="108" font-size="13" fill="#b23a1f">the clip:</text>' +
    '<text x="130" y="150" font-size="15" font-weight="700" fill="#4b2a7a">one step back</text>' +
    '<text x="70" y="176" font-size="14">tell</text><text x="130" y="176" font-size="14">→</text><text x="190" y="176" font-size="14">told</text>' +
    '<text x="70" y="198" font-size="14">is</text><text x="130" y="198" font-size="14">→</text><text x="190" y="198" font-size="14">was</text>' +
    '<text x="70" y="220" font-size="14">don&#8217;t</text><text x="130" y="220" font-size="14">→</text><text x="190" y="220" font-size="14">didn&#8217;t</text>' +

  var GUIDE = '<h4><span>IBTV Fact-Check Style Guide</span><span>page 9</span></h4><h3>Quotes: the whole sentence, the right verb</h3><div class="two"><div>' +
    '<p>A <b>quotation</b> is only true if it means what the speaker meant. Cut a sentence in the right place and you can make anybody say anything: that is a quote taken <b>out of context</b>. Before a quote goes on air, find the recording, play the whole answer, and check the words just before and just after.</p>' +
    '<p>The <b>reporting verb</b> tells the viewer what to think. SAID is plain. CLAIMED suggests we doubt it. ADMITTED suggests the speaker owned up to something bad. PROMISED means a word given about the future. Use SAID unless you can prove one of the others.</p>' +
    '<p>In <b>reported speech</b>, every verb moves one step back in time:</p>' +
    '<p class="ex">&ldquo;I don&rsquo;t agree.&rdquo; → He said (that) he didn&rsquo;t agree.<br>&ldquo;It is a waste.&rdquo; → He said (that) it was a waste.<br>&ldquo;The pool will open.&rdquo; → He promised (that) the pool would open.</p>' +
    '<p>And the people change: I, me and my become he, him and his.</p>' +
    '</div><div class="dia">' + DIA + '</div></div><p class="pen">Hilda says: play the WHOLE answer. Hilda is always right. &mdash; I.B.</p>';
  var CARD = '<h4>Pinned over Hilda&rsquo;s desk</h4><h3>Things nobody said</h3>' +
    '<p><b>No. 1</b> &ldquo;Elementary, my dear Watson.&rdquo; Not in any of Arthur Conan Doyle&rsquo;s sixty Sherlock Holmes stories. Holmes says &ldquo;Elementary&rdquo;, and he says &ldquo;my dear Watson&rdquo;, but never the two together.</p>' +
    '<p><b>No. 2</b> &ldquo;Play it again, Sam.&rdquo; Not in the film Casablanca (1942). Ilsa says &ldquo;Play it, Sam.&rdquo; Later Rick says &ldquo;You played it for her, you can play it for me,&rdquo; and &ldquo;Play it!&rdquo;</p>' +
    '<p class="pen">People remember the quote they wanted to hear. &mdash; H.C.</p>';
  $('#guide').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: GUIDE, cls: 'guide', clue: { id: 'guide9', title: 'Style guide p.9: Quotes', kind: 'The style guide' }, done: function () {
      FG.terms(['quotation', 'out of context', 'reporting verb', 'reported speech']);

  /* ---------- things in the room ---------- */
  FG.thing('#shelvesL', null, 'Box after box: FLOODS 1990, BRASS BAND CONTEST 1994, ROYAL VISIT 2002, FLOODS AGAIN 2007. The spines are all in Hilda&rsquo;s handwriting.', isBusy);
  FG.thing('#shelvesR', null, 'COUNCIL 2016, COUNCIL 2017, COUNCIL 2018. Hilda says the council tapes are the ones people ask for most and watch least.', isBusy);
  FG.thing('#t2022', null, 'A box with a white label: INCHBECK TONIGHT &middot; 9 JUL 2022 &middot; POOL REOPENS. Hilda sees you looking. &ldquo;Lovely day, that. Ribbon, scissors, the lot. Shame about the roof, after.&rdquo;', isBusy, function () { told.saw22 = 1; ER.flag('c-told', told); });
  FG.thing('#radio', null, function () { return told.live ? 'The radio, very low: Colm is asking Lavery about bins. Lavery is in favour of them.' : 'An old radio playing the debate very quietly. Hilda says she prefers it without the faces.'; }, isBusy);
  FG.thing('#kettle', null, '&ldquo;Not near the deck,&rdquo; says Hilda, without turning round. You were not going to. You were only looking.', isBusy);
  FG.thing('#trolley', null, 'A trolley of tapes waiting to go back on the shelves. The top one says CHRISTMAS LIGHTS 2009 (SWITCH-ON FAILED).', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#deck').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The deck is paused on Lavery&rsquo;s face, halfway through &ldquo;I don&rsquo;t agree&rdquo;.'); return; }

    if (!told.guide) { ER.say('&ldquo;Page nine first,&rdquo; says Hilda. &ldquo;On my corkboard. Iona&rsquo;s orders, and mine.&rdquo;'); return; }
    if (!lock) lock = makeDeck();
    lock.open();
  });

  /* ---------- the edit deck: find the cut, write the two quotes, set the dial ---------- */
  function makeDeck() {
    var W = [['C', 'Councillor,', 0], ['C', 'the', 0.8], ['C', 'library.', 1.0], ['C', 'People', 1.8], ['C', 'say', 2.2], ['C', 'it', 2.4], ['C', 'costs', 2.6], ['C', 'too', 3.0], ['C', 'much.', 3.2],
      ['L', 'Look.', 4.0], ['L', 'People', 4.8], ['L', 'tell', 5.2], ['L', 'me', 5.5], ['L', 'the', 5.8], ['L', 'library', 6.0], ['L', 'is', 6.6], ['L', 'a', 6.8], ['L', 'waste', 7.0], ['L', 'of', 7.4], ['L', 'money.', 7.6],
      ['L', 'I', 8.6], ['L', 'don’t', 8.8], ['L', 'agree.', 9.2], ['L', 'It’s', 10.0], ['L', 'the', 10.2], ['L', 'best', 10.4], ['L', 'thing', 10.8], ['L', 'this', 11.1], ['L', 'council', 11.4], ['L', 'pays', 11.9], ['L', 'for.', 12.2],
      ['C', 'And', 13.2], ['C', 'the', 13.4], ['C', 'swimming', 13.6], ['C', 'pool?', 14.1],
      ['L', 'I', 15.0], ['L', 'promise', 15.2], ['L', 'you', 15.7], ['L', 'the', 15.9], ['L', 'pool', 16.1], ['L', 'will', 16.5], ['L', 'be', 16.8], ['L', 'open', 17.0], ['L', 'again', 17.4], ['L', 'by', 17.8], ['L', 'the', 18.0], ['L', 'summer', 18.2], ['L', 'of', 18.7], ['L', '2022.', 18.9]];
    var END = 20, TILES = [['said', 'said'], ['claimed', 'claimed'], ['admitted', 'admitted'], ['promised', 'promised'], ['tell', 'tell'], ['told', 'told'], ['is', 'is'], ['was', 'was'],
      ['dont', 'don’t agree'], ['didnt', 'didn’t agree'], ['will', 'will'], ['would', 'would']];
    var st = ER.flag('c-st') || { at: -1, seen: -1, inn: -1, out: -1, l1: ['', '', '', ''], l2: ['', ''], v: '' }, wait = false, box = ER.el('div', 'job tapej'), s = '', i;
    function sl(k) { return '<span class="sl" data-k="' + k + '"></span>'; }
    s = '<h5>The edit deck &middot; Inchbeck Tonight, 14 March 2019 <small>Drag the playhead along the tape. Mark Gethin&rsquo;s clip with IN and OUT.</small></h5>' +
      '<div class="tp-top"><div class="tp-mon"><svg viewBox="648 296 304 190"><rect x="648" y="296" width="304" height="190" fill="#3a2a4a"/>' + $('#lav19').innerHTML + '<rect x="648" y="452" width="304" height="26" fill="#1a3a6a" opacity=".9"/><text x="656" y="470" font-family="Outfit,sans-serif" font-size="13" font-weight="600" fill="#fff">INCHBECK TONIGHT · 14.03.2019</text></svg></div>' +
      '<div class="tp-side"><div class="subs"></div><div class="tp-ctl"><button type="button" class="btn" id="t-back">&#9664; word</button><button type="button" class="btn" id="t-fwd">word &#9654;</button><span class="rd"></span>' +
      '<button type="button" class="btn" id="t-in">IN</button><button type="button" class="btn" id="t-out">OUT</button><span class="gq">Gethin&rsquo;s clip: &ldquo;the library is a waste of money&rdquo;</span></div></div></div>' +
      '<div class="strip"></div><div class="tcode"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span><span>00:20</span></div>' +
      '<div class="lines"><div><div class="rline">Mr Lavery ' + sl('a0') + ' that people ' + sl('a1') + ' him the library ' + sl('a2') + ' a waste of money, but that he ' + sl('a3') + '.</div>' +
      '<div class="rline">He ' + sl('b0') + ' that the pool ' + sl('b1') + ' be open again by the summer of 2022.</div>' +
      '<div class="tp-tray">' + TILES.map(function (t) { return '<span class="tl" data-v="' + t[0] + '">' + t[1] + '</span>'; }).join('') + '</div></div>' +
      '<div><div class="vlab">GETHIN: &ldquo;HE SAID THE LIBRARY IS A WASTE OF MONEY&rdquo;</div><div id="dv"></div></div></div>' +
      '<div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="t-go">Send to the Check</button></div>';
    box.innerHTML = s;
    var strip = box.querySelector('.strip'), subs = box.querySelector('.subs'), msgEl = box.querySelector('.jmsg'), segs = '', phd, mkIn, mkOut;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { st.l1 = FG.vals(box.querySelector('.rline'), '.sl'); st.l2 = FG.vals(ER.$$('.rline', box)[1], '.sl'); ER.flag('c-st', st); }
    W.forEach(function (w, k) {
      var t1 = k + 1 < W.length ? W[k + 1][2] : END;
      if (k + 1 < W.length && W[k + 1][0] !== w[0]) t1 = w[2] + 0.5;
      segs += '<div class="seg ' + (w[0] === 'C' ? 'c' : 'l') + '" data-i="' + k + '" style="left:' + (w[2] / END * 100).toFixed(2) + '%;width:' + ((t1 - w[2]) / END * 100).toFixed(2) + '%"></div>';
    });
    strip.innerHTML = segs + '<div class="mk in" style="display:none"></div><div class="mk out" style="display:none"></div><div class="phd"></div>';
    phd = strip.querySelector('.phd'); mkIn = strip.querySelector('.mk.in'); mkOut = strip.querySelector('.mk.out');
    function endOf(k) { var t1 = k + 1 < W.length ? W[k + 1][2] : END; if (k + 1 < W.length && W[k + 1][0] !== W[k][0]) t1 = W[k][2] + 0.5; return t1; }
    function draw() {
      var k = st.at, h = '', who = '';
      phd.style.left = (k < 0 ? 0 : W[k][2] / END * 100) + '%';
      W.forEach(function (w, j) {
        if (w[0] !== who) { who = w[0]; h += (j ? '<br>' : '') + '<span class="sp">' + (who === 'C' ? 'HADLEY' : 'LAVERY') + '</span>'; }
        var cls = j > st.seen ? 'hid' : '';
        if (st.inn >= 0 && st.out >= st.inn && j >= st.inn && j <= st.out) cls += ' cut';
        if (j === k) cls += ' now';
        h += '<span class="' + cls + '">' + w[1] + '</span> ';
      });
      subs.innerHTML = h;
      ER.$$('.seg', strip).forEach(function (sg) { sg.classList.toggle('h', +sg.getAttribute('data-i') > st.seen); });
      box.querySelector('.rd').textContent = k < 0 ? '00:00.0  (stopped)' : '00:' + ('0' + W[k][2].toFixed(1)).slice(-4) + '  ' + W[k][1];
      mkIn.style.display = st.inn >= 0 ? 'block' : 'none'; mkOut.style.display = st.out >= 0 ? 'block' : 'none';
      if (st.inn >= 0) mkIn.style.left = (W[st.inn][2] / END * 100) + '%';
      if (st.out >= 0) mkOut.style.left = (endOf(st.out) / END * 100) + '%';
    }
    function go(k) {
      k = Math.max(0, Math.min(W.length - 1, k));
      if (k !== st.at) { st.at = k; if (k > st.seen) st.seen = k; FG.sfx.detent(); draw(); }
    }
    function wordAt(x) {
      var r = strip.getBoundingClientRect(), t = (x - r.left) / r.width * END, k, best = 0;
      for (k = 0; k < W.length; k++) if (W[k][2] <= t + 0.001) best = k;
      return best;
    }
    strip.addEventListener('pointerdown', function (e) {
      if (e.button || wait) return;
      e.preventDefault(); try { strip.setPointerCapture(e.pointerId); } catch (x) {}
      FG.sfx.whirr(); go(wordAt(e.clientX));
      function mv(ev) { go(wordAt(ev.clientX)); }
      function up() { strip.removeEventListener('pointermove', mv); strip.removeEventListener('pointerup', up); strip.removeEventListener('pointercancel', up); ER.flag('c-st', st); }
      strip.addEventListener('pointermove', mv); strip.addEventListener('pointerup', up); strip.addEventListener('pointercancel', up);
    });
    box.querySelector('#t-back').addEventListener('click', function () { if (!wait) { go(st.at - 1); ER.flag('c-st', st); } });
    box.querySelector('#t-fwd').addEventListener('click', function () { if (!wait) { go(st.at + 1); ER.flag('c-st', st); } });
    box.querySelector('#t-in').addEventListener('click', function () {
      if (wait) return;
      if (st.at < 0) { ER.sfx.no(); msg('&ldquo;Play it first,&rdquo; says Hilda. &ldquo;You can&rsquo;t mark what you haven&rsquo;t heard.&rdquo;'); return; }
      st.inn = st.at; if (st.out >= 0 && st.out < st.inn) st.out = -1; FG.sfx.key(); ER.flag('c-st', st); draw(); msg('IN at &ldquo;' + W[st.inn][1] + '&rdquo;.');
    });
    box.querySelector('#t-out').addEventListener('click', function () {
      if (wait) return;
      if (st.at < 0) { ER.sfx.no(); msg('&ldquo;Play it first,&rdquo; says Hilda.'); return; }
      if (st.inn >= 0 && st.at < st.inn) { ER.sfx.no(); msg('OUT has to come after IN. A clip runs forwards, even on Hilda&rsquo;s deck.'); return; }
      st.out = st.at; FG.sfx.key(); ER.flag('c-st', st); draw(); msg('OUT after &ldquo;' + W[st.out][1] + '&rdquo;.');
    });
    FG.tiles(box, { tile: '.tl', slot: '.sl', lock: function () { return wait; }, change: keep });
    function tileFor(v) { return box.querySelector('.tl[data-v="' + v + '"]'); }
    ER.$$('.rline', box).forEach(function (ln, j) { ER.$$('.sl', ln).forEach(function (sl, k) { var v = (j ? st.l2 : st.l1)[k]; if (v) FG.put(sl, tileFor(v)); }); });
    var dv = FG.dial({ small: true, value: st.v, onChange: function (v) { st.v = v; ER.flag('c-st', st); }, lock: function () { return wait; } });
    box.querySelector('#dv').appendChild(dv.node);
    function bad(k, t) { var x = box.querySelector('.sl[data-k="' + k + '"]'); if (x) { x.classList.add('bad'); ER.shake(x); } ER.sfx.no(); msg(t); }
    box.querySelector('#t-go').addEventListener('click', function () {
      var file, a, b;
      if (wait || nextFile) return;
      keep(); a = st.l1; b = st.l2;
      ER.$$('.sl', box).forEach(function (x) { x.classList.remove('bad', 'ok'); });
      if (st.inn < 0 || st.out < 0) { ER.sfx.no(); msg('&ldquo;Mark her clip first,&rdquo; says Hilda. &ldquo;IN where it begins, OUT where it stops. Then we&rsquo;ll see what she left out.&rdquo;'); return; }
      if (!ER.check('cin', String(st.inn))) {
        ER.sfx.no();
        msg(st.inn <= 8 ? '&ldquo;That&rsquo;s Colm, asking the question,&rdquo; says Hilda. &ldquo;Her clip is Lavery talking.&rdquo;' :
          st.inn <= 12 ? '&ldquo;&lsquo;' + W[st.inn][1] + '&rsquo; isn&rsquo;t in her clip,&rdquo; says Hilda. &ldquo;Which is rather the point. But mark what she actually used: it starts later.&rdquo;' :
          st.inn === 14 ? '&ldquo;She said &lsquo;THE library&rsquo;,&rdquo; says Hilda. &ldquo;One word earlier.&rdquo;' :
          '&ldquo;Her clip starts with &lsquo;the library&rsquo;,&rdquo; says Hilda. &ldquo;Find where he says it.&rdquo;');
        return;
      }
      if (!ER.check('cout', String(st.out))) {
        ER.sfx.no();
        msg(st.out >= 20 && st.out <= 22 ? '&ldquo;&lsquo;I don&rsquo;t agree&rsquo; is not in her clip,&rdquo; says Hilda. &ldquo;That is exactly the bit that was cut. Where does HER clip stop?&rdquo;' :
          st.out < 19 ? '&ldquo;She went on to &lsquo;money&rsquo;,&rdquo; says Hilda. &ldquo;&lsquo;A waste of money.&rsquo;&rdquo;' :
          '&ldquo;Her clip stops at the end of &lsquo;a waste of money&rsquo;,&rdquo; says Hilda.');
        return;
      }
      if (st.seen < 22) { ER.sfx.no(); msg('&ldquo;Good. That&rsquo;s her clip,&rdquo; says Hilda. &ldquo;Now play on past it. What does he say next?&rdquo;'); return; }
      if (a.indexOf('') >= 0 || b.indexOf('') >= 0) { ER.sfx.no(); msg('&ldquo;That&rsquo;s the cut,&rdquo; says Hilda. &ldquo;&lsquo;People tell me&rsquo; before it, and &lsquo;I don&rsquo;t agree&rsquo; after it. Now write the two quotes for the Check: every gap.&rdquo;'); return; }
      if (!ER.check('l1a', a[0])) return bad('a0', { claimed: '&ldquo;Claimed tells the viewer we doubt it,&rdquo; says Hilda. &ldquo;We don&rsquo;t doubt he said it. The tape is right here.&rdquo;',
        admitted: '&ldquo;Admitted means he owned up to something,&rdquo; says Hilda. &ldquo;He didn&rsquo;t own up to anything. He was telling Colm what other people say.&rdquo;',
        promised: '&ldquo;Promised is for a word given about the future,&rdquo; says Hilda. &ldquo;That&rsquo;s the pool, not this.&rdquo;' }[a[0]] || '&ldquo;That gap wants a reporting verb,&rdquo; says Hilda. &ldquo;Page nine.&rdquo;');
      if (!ER.check('l1b', a[1])) return bad('a1', '&ldquo;Move it one step back,&rdquo; says Hilda. &ldquo;&lsquo;People TELL me&rsquo; becomes &lsquo;people ___ him&rsquo;.&rdquo;');
      if (!ER.check('l1c', a[2])) return bad('a2', '&ldquo;One step back,&rdquo; says Hilda. &ldquo;&lsquo;The library IS&rsquo; becomes &lsquo;the library ___&rsquo;.&rdquo;');
      if (!ER.check('l1d', a[3])) return bad('a3', '&ldquo;One step back,&rdquo; says Hilda. &ldquo;&lsquo;I DON&rsquo;T agree&rsquo; becomes &lsquo;he ___&rsquo;.&rdquo;');
      if (!ER.check('l2a', b[0])) return bad('b0', { said: '&ldquo;Said isn&rsquo;t wrong,&rdquo; says Hilda, &ldquo;but he said &lsquo;I promise you&rsquo;. When the tape proves the stronger verb, use it. Page nine.&rdquo;',
        claimed: '&ldquo;Claimed tells the viewer we doubt it,&rdquo; says Hilda. &ldquo;We heard him say it.&rdquo;', admitted: '&ldquo;Owned up?&rdquo; says Hilda. &ldquo;He was very pleased with himself. Listen to him.&rdquo;' }[b[0]] || '&ldquo;That gap wants a reporting verb,&rdquo; says Hilda.');
      if (!ER.check('l2b', b[1])) return bad('b1', '&ldquo;One step back,&rdquo; says Hilda. &ldquo;&lsquo;The pool WILL be open&rsquo; becomes &lsquo;the pool ___ be open&rsquo;.&rdquo;');
      ER.$$('.sl', box).forEach(function (x) { x.classList.add('ok'); });
      if (!st.v) { ER.sfx.no(); msg('&ldquo;Two good quotes,&rdquo; says Hilda. &ldquo;Now Iona&rsquo;s dial: Ms Gethin said he said the library is a waste of money.&rdquo;'); return; }
      if (!ER.check('v', st.v)) {
        ER.sfx.no(); ER.shake(dv.node);
        msg({ tbm: '&ldquo;He did say the words &lsquo;the library is a waste of money&rsquo;,&rdquo; says Hilda. &ldquo;That&rsquo;s true, and it&rsquo;s not the point. Did he say the library IS a waste of money, as she says he did? Are the facts in her claim right?&rdquo;',
          'true': '&ldquo;Listen to the whole answer,&rdquo; says Hilda. &ldquo;Did he think the library was a waste of money?&rdquo;',
          cant: '&ldquo;We can check it,&rdquo; says Hilda. &ldquo;We have the tape. You just did.&rdquo;' }[st.v]);
        return;
      }
      file = ER.exit([st.inn + '-' + st.out + '|' + a.join(',') + '|' + b.join(',') + '|' + st.v], { wait: true });
      if (!file) { msg('The deck jams. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file); dv.lock(true);
      FG.mine('tape', 'The 2019 tape', '<p>Gethin&rsquo;s clip: &ldquo;the library is a waste of money&rdquo;. The whole answer: &ldquo;People tell me the library is a waste of money. I don&rsquo;t agree.&rdquo;</p><p>Mr Lavery said that people told him the library was a waste of money, but that he didn&rsquo;t agree. Gethin: FALSE.</p><p>He promised that the pool would be open again by the summer of 2022.</p>', true);
      msg('Hilda reads your two lines over your shoulder. &ldquo;Said, told, was, didn&rsquo;t. Promised, would.&rdquo; She nods once. &ldquo;Somebody plays the whole answer at last. I&rsquo;ll tell Iona.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Hilda rings the desk and reads out your two lines. You can hear Iona say &ldquo;Oh,&rdquo; very quietly, and then: &ldquo;FALSE, then. For her. Fine.&rdquo;',
          '20.31, on the radio. Lavery: &ldquo;Crime in Inchbeck has gone down every single year since 2020. Every year! Look at the graph on the side of my van. It&rsquo;s parked outside.&rdquo;',
          '20.33. Gethin: &ldquo;And eight out of ten people in this town want the market hall made into a food market. We asked them.&rdquo;',
          'Hilda puts the phone down. &ldquo;Iona says: car park. His van, and her leaflets. And take a coat, she says. I say take an umbrella. It&rsquo;s been raining since 1989.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3400);
    });
    draw();
    msg(st.seen >= 0 ? 'The deck, where you left it.' : 'The tape is at the start. Drag the red playhead along the strip, or step through it a word at a time.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
