  #tube{animation:tube 7s steps(1,end) infinite}
  @keyframes tube{0%{opacity:.85}61%{opacity:.85}62%{opacity:.2}63%{opacity:.85}65%{opacity:.35}66%{opacity:.85}}
  #rollers circle{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{100%{transform:rotate(360deg)}}

  .jbj{width:min(1160px,97vw)}
  .jbwrap{display:grid;grid-template-columns:470px 1fr;gap:14px;align-items:start}
  .scr{background:#1a1e22;padding:10px;border-radius:6px;box-shadow:inset 0 0 0 3px #0a0c0e}
  .scr svg{display:block;width:100%;height:auto;background:#5a6268;cursor:none;touch-action:none}
  .scr p{margin:6px 2px 0;font-family:'DM Mono',monospace;font-size:11.5px;color:#9fc8bc;letter-spacing:.04em}
  .ticket{background:#c8a878;color:#2a1e12;padding:10px 14px 8px;border-radius:2px;box-shadow:inset 0 0 0 2px #a88a5a;font-family:'Special Elite',monospace;font-size:13.6px;line-height:1.35}
  .ticket h6{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between}
  .ticket h6 small{font-family:'DM Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.06em}
  .tline{background:#f4ead2;margin:0 0 6px;padding:5px 9px 6px;border-left:4px solid #7a1f1f}
  .tline > b{display:block;font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a1f1f;margin-bottom:3px}
  .tline.bad{background:#ffe2cc;border-left-color:#e07a1a}
  .pics{font-size:13px;min-height:18px}
  .samples{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .samp{background:#fff;border:1px solid #c8bca4;padding:3px 4px 5px;text-align:center}
  .samp svg{display:block;width:100%;height:50px}
  .samp i{display:block;font-style:normal;font-family:'Libre Franklin',sans-serif;font-size:10.5px;line-height:1.2;color:#4a3a2a;margin:2px 0 3px;min-height:25px}
  .samp .sl{min-width:0;width:100%;box-sizing:border-box;color:#2a1e12;border-color:#a8946a;font-size:12.5px;background:#f8f2e2}
  .samp .sl.full{border-color:#2f6a5a;background:#dff0e6}
  .ticket .tray{margin-top:5px}
  .ticket .tl{font-size:12.5px;padding:3px 8px}
  .opts{display:flex;flex-wrap:wrap;gap:5px}
  .opts button{display:flex;align-items:flex-end;gap:5px;padding:4px 8px;border:1.5px solid #a8946a;border-radius:2px;background:#fff;font-family:'DM Mono',monospace;font-size:11.5px;color:#2a1e12;cursor:pointer;text-align:left;line-height:1.25}
  .opts button.on{background:#2f6a5a;border-color:#2f6a5a;color:#fff}
  .opts button svg{flex:0 0 auto}
  .opts.made button{flex:1 1 100%;font-family:'Newsreader',serif;font-size:14px}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};

  /* letters drawn by hand, so that they are exactly the shapes the specimen sheet describes.
     kind: 'mk' Market Sans (one-storey a and g), 'rd' Raddle Sans (two-storey a and g), 'pb' Pressbook Serif (two storeys, serifs) */
  function aG(kind, x, y, s, col) {
    var w = kind === 'pb' ? 3.2 : 4.6, cap = kind === 'pb' ? 'butt' : 'round';
    var t = '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="' + cap + '">';
    if (kind === 'mk') t += '<circle cx="-1" cy="2" r="12"/><path d="M11 -11V14"/>';
    else t += '<path d="M11 14V-4Q11 -14 0 -14Q-8 -14 -11 -8"/><path d="M11 1Q-12 -1 -12 8Q-12 14 -3 14Q6 14 11 8"/>';
    if (kind === 'pb') t += '<path d="M6 14H17M-11 -8V-2" stroke-width="2.6"/>';
    t += '</g><g transform="translate(' + (x + 40 * s) + ' ' + y + ') scale(' + s + ')" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="' + cap + '">';
    if (kind === 'mk') t += '<circle cx="-1" cy="2" r="12"/><path d="M11 -11V24Q11 33 -1 33Q-9 33 -12 28"/>';
    else t += '<ellipse cx="-1" cy="-3" rx="9" ry="9"/><path d="M-5 5Q-10 9 -4 11"/><ellipse cx="0" cy="21" rx="13" ry="8"/><path d="M7 -9Q10 -14 15 -13"/>';
    if (kind === 'pb') t += '<circle cx="15" cy="-13" r="2.4" fill="' + col + '" stroke="none"/>';
    t += '</g>';
    return t;
  }
  var FACES = [['mk', 'Market Sans', 'Woolsack letterheads, printed here, 1974 to March 2026', 'no serifs · a: one storey · g: one storey'],
    ['rd', 'Raddle Sans', 'The otter. On council computers only, from 1 April 2026', 'no serifs · a: two storeys · g: two storeys'],
    ['pb', 'Pressbook Serif', 'Comes with Wordsmith Home, a program for home computers. It fills in for any face the computer has not got', 'serifs · a: two storeys · g: two storeys']];

  (function () {
    var s = '';
    FACES.forEach(function (f, i) { var y = 222 + i * 64; s += aG(f[0], 670, y, 0.9, '#1d1a16') + '<text x="740" y="' + (y + 4) + '" class="fO" font-size="12" fill="#1d1a16">' + f[1].split(' ')[0] + '</text><text x="740" y="' + (y + 18) + '" class="fO" font-size="10" fill="#6a5a3a">' + f[1].split(' ')[1] + '</text>'; });
    $('#specg').innerHTML = s;
    $('#box').querySelector('g').innerHTML = LK.woolsack(0, 0, 0.9, '#2f5a3a', '#c0392b');
    $('#queenie').innerHTML = LK.who('queenie', { lit: '#9ad0c0', armR: 'M31 -222Q60 -200 54 -168', handR: [52, -160] });
    $('#tariq').innerHTML = LK.who('tariq', { lit: '#9ad0ff' });
  })();

  ER.init({
    theme: 'news', story: 'leak', storyTitle: 'Letterhead', id: 'print', no: 'III', title: 'Sorrell’s',
    go: 'Go in under the sign',
    intro: [
      'The date line. The leak is dated Monday 16 March 2026, and only one thing in it fits: the application number, received in January. &ldquo;Thursday 13 March&rdquo; is wrong: 13 March 2026 was a Friday, and it was a Thursday in 2025, so whoever wrote it was looking at last year&rsquo;s calendar. And four things came from after 16 March: the otter letterhead (1 April), the June meeting (fixed on 28 April), the title of Chair (19 May) and the reference number of her real letter (4 June). Her own column of October 2025 says she will never &ldquo;reach out&rdquo; to anybody.',
      'Twenty to eleven. Tanner&rsquo;s Row, behind the square. Sorrell &amp; Daughter, Printers, who have printed the Record every Wednesday night since 1922.'
    ],
    exit: {"next":"council","w":{"5957e311":"91013571"}}, tags: {"pic":["78de5c78","d54e588d"],"t0":["cbf3caeb"],"t1":["baea30a8"],"t2":["6a05080c"],"paper":["560f4f99"],"made":["f3fc1532"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function readAll() { return told.card1 && told.card2 && told.spec && told.pre; }
  function ready() { return told.queenie && readAll(); }
  function paint() {
    $('#queenie').classList.toggle('ready', !!(told.in && !told.queenie));
    $('#card1').classList.toggle('ready', !!(told.queenie && !told.card1));
    $('#card2').classList.toggle('ready', !!(told.queenie && !told.card2));
    $('#spec').classList.toggle('ready', !!(told.queenie && !told.spec));
    $('#screen').classList.toggle('ready', !!(told.queenie && !told.pre));
    $('#bag').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.queenie ? 1 : 0) + (readAll() ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['The Corn Exchange is across the square. The button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['bag', [
      'Line 1: move the loupe over the page on Queenie&rsquo;s screen. Typed words stay sharp however big they get; a picture breaks into little squares. The preflight says there are two pictures. Click each one.',
      'Line 2: compare the enlarged a and g on each cut-out with the specimen: one storey or two, serifs or none. Line 3: the preflight gives the page size in millimetres; Queenie&rsquo;s card gives the sizes of the papers. Line 4: is the page a scan, or typed?',
      'The two pictures are the letterhead and the signature. The leak&rsquo;s own words have serifs; the otter&rsquo;s lettering and her real letter have none, and their a has two storeys. The page is 216 by 279 mm. And because the loupe found typed words, not a scan, the day the file was made is the day the words were typed.'
    ]];
    if (!told.queenie) return ['talk', ['Queenie Sorrell runs the print works. She is expecting you.', 'Click Queenie, the woman with white curls and a black apron, in front of her desk.']];
    if (!readAll()) return ['read', ['Four things to read: two cards Queenie has written, the specimen sheet, and the preflight report on her screen.', 'One card is pinned above the guillotine (with the red blade). The other is taped to the side of her screen. The specimen sheet is the white sheet on the wall above the type cases. The preflight is on her screen.']];
    return ['go2', ['Fill in the job bag on Queenie&rsquo;s desk.', 'Click the brown envelope marked JOB BAG on the desk, under the screen.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The job bag is filled in. Tariq is holding the door.'); return; }
    if (told.in) { busy = false; ER.say('Sorrell&rsquo;s print works, Tanner&rsquo;s Row.'); return; }
    ER.narrate([
      'Sorrell&rsquo;s is one long room that smells of ink and hot paper: a green press as big as a bus shelter, wooden cases of old metal type that nobody uses and nobody will throw away, and a strip light that cannot decide.',
      'At the far end, at a desk with a very large screen, sits Queenie Sorrell, seventy-two, who learned to set type before she learned to ride a bike. Tonight she will print four thousand two hundred copies of whatever you decide.'
    ], function () { busy = false; tell('in'); paint(); });
  }

  $('#queenie').addEventListener('click', function () {
    if (busy) return;
    if (told.queenie) { ER.say(nextFile ? '&ldquo;Pages by six,&rdquo; says Queenie. &ldquo;Or Thursday&rsquo;s paper comes out on Friday, and that&rsquo;s a leaflet.&rdquo;' : !readAll() ? '&ldquo;My two cards, the specimen sheet, and the preflight on the screen,&rdquo; says Queenie. &ldquo;Then the job bag.&rdquo;' : '&ldquo;Job bag,&rdquo; says Queenie, and taps it.'); return; }
    ER.talk({
      who: 'Queenie Sorrell', role: 'Printer · Sorrell &amp; Daughter, Tanner&rsquo;s Row', face: window.FACE('queenie'),
      lines: [
        { note: 'She wipes her hands on her apron before she shakes yours, which does not help.', a: '&ldquo;Rowena rang. Forgery, she says, or not. I&rsquo;ve printed the Record every Wednesday night since 1979, and my dad before me, and I printed that council&rsquo;s letterhead for fifty-two years, till they went and got an otter. If anybody in this town knows what a council letter is made of, it&rsquo;s me.&rdquo;' },
        { q: 'What did you print for the council?', a: '&ldquo;Their paper. The woolsack in green and red, two inks, two thousand sheets at a time, and they typed their letters onto it. Since April they print the whole lot themselves, otter and all, on the office machine, in that new face of theirs, Raddle Sans. Only their computers have got it. They sent me the last box of old paper to throw away. I didn&rsquo;t.&rdquo; She nods at a box by the guillotine.' },
        { q: 'Can you tell if it&rsquo;s a fake?', a: '&ldquo;I can tell you what it&rsquo;s made of. That&rsquo;s better. Fakes are made of something too.&rdquo; She taps the screen. &ldquo;Tariq sent me the PDF. I&rsquo;ve preflighted it, same as I do your pages every Wednesday. Read my cards first. Then we fill in a job bag, like a proper job.&rdquo;' },
        { q: 'What is a job bag?', a: '&ldquo;Every job in this building goes in a brown envelope with a ticket on the front: what it is, what paper, what type, when it came in. If it isn&rsquo;t on the ticket, it didn&rsquo;t happen. Yours is on the desk.&rdquo;' }
      ],
      clue: { id: 'queenie', title: 'Queenie: what a council letter is made of', kind: 'What she said' },
      done: function (seen) { if (seen && tell('queenie')) paint(); }
    });
  });

  var CARD1 = '<h4>Sorrell &amp; Daughter &middot; pinned above the guillotine</h4><h3>Type and paper</h3>' +
    '<p>A <b>typeface</b> is a family of letters drawn to one design. To tell faces apart, look at the small a and g. Some faces build them in two storeys, a little bowl with a roof or a loop above it; some in one, a round bowl and a stick. Some faces have <b>serifs</b>, the small feet at the ends of the strokes; faces without them are <b>sans serif</b> (sans is French for &ldquo;without&rdquo;).</p>' +
    '<p>A computer can only set type in a face it has got. If a file asks for one it hasn&rsquo;t got, it quietly puts in another: a <b>substitute</b>.</p>' +
    '<p>Paper has sizes. Britain and most of the world use <b>A4</b>: 210 &times; 297 mm. The United States and Canada use <b>Letter</b>: 8&frac12; &times; 11 inches, which is 216 &times; 279 mm, wider and shorter. Print a Letter page on A4 and it doesn&rsquo;t fill the sheet: you get a band of white at the foot. A5 is half of A4: 148 &times; 210 mm.</p>' +
    '<p class="pen">The three faces you&rsquo;ll meet in this town are on the specimen sheet. &mdash; Q.S.</p>';
  var CARD2 = '<h4>Sorrell &amp; Daughter &middot; taped to the screen</h4><h3>What a file remembers</h3>' +
    '<p>Typed words in a PDF are kept as type: blow them up as big as you like and they stay sharp. A picture pasted onto the page is made of tiny squares, <b>pixels</b>; blow it up and it breaks into steps. A scan of a paper letter is all picture, words and all.</p>' +
    '<p>A file also keeps notes about itself, called <b>metadata</b>: when it was made and changed, which program made it, and an author&rsquo;s name, which is usually just the name the computer was set up with. It can be wrong, and it can be changed. It tells you where to look, not who did it.</p>' +
    '<p>Before we print anything we <b>preflight</b> it: a program checks the page size, the type and the pictures, and reads out the notes.</p>' +
    '<p class="pen">My computer still thinks it belongs to my dad. &mdash; Q.S.</p>';
  var SPEC = '<h4>Sorrell &amp; Daughter &middot; on the wall</h4><h3>Specimens</h3><p>The small a and g, enlarged, of the three faces you see most in Raddlestone.</p>' +
    '<svg viewBox="0 0 640 250"><g font-family="Libre Franklin,sans-serif">' + FACES.map(function (f, i) {
      var y = 44 + i * 80; return aG(f[0], 50, y, 1.4, '#1d1a16') + '<text x="150" y="' + (y - 12) + '" font-size="19" font-weight="700" fill="#1d1a16">' + f[1] + '</text><text x="150" y="' + (y + 10) + '" font-size="13.5" fill="#5a4a32">' + f[2].replace(/&/g, '&amp;') + '</text><text x="150" y="' + (y + 30) + '" font-size="13" font-weight="700" fill="#7a1f1f">' + f[3] + '</text>';
    }).join('') + '</g></svg>';
  var PRE = '<h4><span>Preflight report</span><span>letter.pdf</span></h4><table>' +
    '<tr><td>Pages</td><td>1</td></tr>' +
    '<tr><td>Page size</td><td class="warn">215.9 &times; 279.4 mm (8.5 &times; 11 in). Not A4.</td></tr>' +
    '<tr><td>Created</td><td>03/11/2026 01:47</td></tr><tr><td>Last changed</td><td>03/11/2026 01:49</td></tr>' +
    '<tr><td>Program</td><td>Wordsmith Home 2024</td></tr><tr><td>Author</td><td>Thea Rushton</td></tr><tr><td>Title</td><td>letter</td></tr>' +
    '<tr><td>Spelling language</td><td>English (United States)</td></tr>' +
    '<tr><td>Typefaces</td><td>Pressbook Serif (all the words in the file)</td></tr>' +
    '<tr><td>Pictures</td><td class="warn">2, both low resolution. Where they are on the page is not shown in this report.</td></tr></table>' +
    '<p>Queenie has written on a sticky note on the screen: &ldquo;Use the loupe to find the two pictures. Job bag.&rdquo;</p>';
  function needQ() { ER.say('&ldquo;Say hello first,&rdquo; says Tariq. &ldquo;It&rsquo;s her building.&rdquo;'); }
  function after(k) { if (tell(k)) { paint(); if (ready()) ER.say('&ldquo;Right,&rdquo; says Queenie. &ldquo;Job bag.&rdquo;'); } }
  $('#card1').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; if (!told.queenie) return needQ();
    ER.read({ html: CARD1, cls: 'card', clue: { id: 'card1', title: 'Queenie&rsquo;s card: Type and paper', kind: 'Sorrell&rsquo;s' }, done: function () { LK.terms(['typeface', 'serif', 'sans serif', 'substitute', 'A4', 'Letter']); after('card1'); } }); });
  $('#card2').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; if (!told.queenie) return needQ();
    ER.read({ html: CARD2, cls: 'card', clue: { id: 'card2', title: 'Queenie&rsquo;s card: What a file remembers', kind: 'Sorrell&rsquo;s' }, done: function () { LK.terms(['pixel', 'metadata', 'preflight']); after('card2'); } }); });
  $('#spec').addEventListener('click', function () { if (busy) return; if (!told.queenie) return needQ();
    ER.read({ html: SPEC, cls: 'card', clue: { id: 'spec', title: 'The specimen sheet: three faces', kind: 'Sorrell&rsquo;s' }, done: function () { after('spec'); } }); });
  $('#screen').addEventListener('click', function () { if (busy) return; if (!told.queenie) return needQ();
    ER.read({ html: PRE, cls: 'pre', clue: { id: 'pre', title: 'Preflight report: letter.pdf', kind: 'Sorrell&rsquo;s' }, done: function () { after('pre'); } }); });

  LK.thing('#press', null, 'The Big Green, 1978, as big as a bus shelter. At seven tonight it will start, and it will not stop until there are four thousand two hundred Records on the floor.', isBusy);
  LK.thing('#cases', null, 'Cases of metal type, every letter in its own little box. Nobody has set a line of metal type here since 1991. Queenie dusts them on Sundays.', isBusy);
  LK.thing('#guill', null, 'The guillotine, for cutting paper. A notice on it says KEEP YOUR FINGERS, in Queenie&rsquo;s writing.', isBusy);
  LK.thing('#box', null, 'A box of the council&rsquo;s old paper: the woolsack crest in green and red, and RADDLESTONE DISTRICT COUNCIL in capitals of Market Sans. A letter really written in March 2026 would have been typed on a sheet like this.', isBusy);
  LK.thing('#radio', null, 'A radio, playing the shipping forecast to nobody. Queenie says it keeps the press calm.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#bag').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The job bag, ticket filled in, in Queenie&rsquo;s handwriting: LETTER.PDF. NOT WHAT IT SAYS.'); return; }
    if (!told.queenie) return needQ();
    if (!readAll()) { ER.say('&ldquo;Read my cards first,&rdquo; says Queenie, &ldquo;and the specimen sheet, and the preflight. A job bag filled in by guessing is worse than none.&rdquo;'); return; }
    if (!lock) lock = makeBag();
    lock.open();
  });

  /* ---------- the job bag: the loupe, the typefaces, the paper, and what the date of the file means ---------- */
  function mosaic(draw, w, h, cell, col) {
    var c = document.createElement('canvas'), x, y, s = '', d, run;
    c.width = w; c.height = h;
    var g = c.getContext('2d'); draw(g);
    try { d = g.getImageData(0, 0, w, h).data; } catch (e) { return ''; }
    for (y = 0; y < h; y++) {
      run = -1;
      for (x = 0; x <= w; x++) {
        var on = x < w && d[(y * w + x) * 4 + 3] > 110;
        if (on && run < 0) run = x;
        if (!on && run >= 0) { s += '<rect x="' + (run * cell).toFixed(2) + '" y="' + (y * cell).toFixed(2) + '" width="' + ((x - run) * cell + 0.05).toFixed(2) + '" height="' + (cell + 0.05).toFixed(2) + '"/>'; run = -1; }
      }
    }
    return '<g fill="' + col + '">' + s + '</g>';
  }
  function makeBag() {
    var st = ER.flag('c-st') || { pics: [], t: ['', '', ''], paper: '', made: '' }, wait = false, box = ER.el('div', 'job jbj');
    var LBL = { head: 'the letterhead', ref: 'the reference line', date: 'the date', addr: 'the address', body: 'the words of the letter', sig: 'the signature', name: 'her name and title' };
    var lines = [['addr', 'Mr P. Stallard', 136], ['addr', 'Stallard Homes Ltd', 152], ['addr', 'Station Road', 168], ['addr', 'Raddlestone', 184],
      ['body', 'Dear Patrick,', 212], ['body', 'Raddle Meadows (26/0042/FUL)', 230], ['body', 'Thank you for a most enjoyable lunch at the Plough on', 256], ['body', 'Thursday 13 March, and for your generous offer of help with', 272],
      ['body', 'my campaign next year.', 288], ['body', 'Rest assured, I will see that the Committee looks favorably', 312], ['body', 'on your application when it meets in June. I do not expect', 328],
      ['body', 'any difficulty from the other members.', 344], ['body', 'Please do not hesitate to reach out if there is anything', 368], ['body', 'further I can do.', 384], ['body', 'Yours sincerely,', 410],
      ['name', 'Councilor Sheila Pendry', 478], ['name', 'Chair, Planning Committee', 494]];
    var page = '<g id="pg"><rect x="30" y="16" width="400" height="517" fill="#fff"/>' +
      '<g data-reg="head" transform="translate(44 26)">' + mosaic(function (g) {
        g.save(); g.scale(0.62, 0.62); g.fillStyle = '#1f6f78'; g.fill(new Path2D('M2 22Q10 8 30 10Q44 11 52 4Q58 0 62 5Q63 10 56 13Q50 17 44 22Q36 28 22 28Q8 28 2 22Z'));
        g.strokeStyle = '#1f6f78'; g.lineWidth = 2.6; g.stroke(new Path2D('M0 33Q8 29 16 33T32 33T48 33T64 33')); g.stroke(new Path2D('M6 39Q14 35 22 39T38 39T54 39')); g.restore();
        g.fillStyle = '#1f6f78'; g.font = '700 11px "Libre Franklin", Arial, sans-serif'; g.fillText('Raddlestone District Council', 46, 14);
        g.font = '7px "Libre Franklin", Arial, sans-serif'; g.fillText('Corn Exchange · Market Square · Raddlestone', 46, 24); g.fillRect(0, 31, 238, 1.4);
      }, 240, 34, 1.55, '#1f6f78') + '</g>' +
      '<text data-reg="ref" x="44" y="94" font-family="EB Garamond,serif" font-size="11" fill="#333">Our ref: MS/PL/0917</text>' +
      '<text data-reg="date" x="416" y="114" text-anchor="end" font-family="EB Garamond,serif" font-size="12.5" fill="#222">16 March 2026</text>' +
      lines.map(function (l) { return '<text data-reg="' + l[0] + '" x="44" y="' + l[2] + '" font-family="EB Garamond,serif" font-size="12.6" fill="#1d2228"' + (l[1].indexOf('Raddle Meadows (') === 0 ? ' font-weight="700"' : '') + '>' + l[1] + '</text>'; }).join('') +
      '<g data-reg="sig" transform="translate(44 420)">' + mosaic(function (g) {
        g.strokeStyle = '#1d2a66'; g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.save(); g.scale(0.92, 0.92); g.translate(4, 2);
        g.stroke(new Path2D(LK.SIG)); g.lineWidth = 1.8; g.stroke(new Path2D('M20 36Q60 30 104 34')); g.restore();
      }, 110, 40, 1.15, '#1d2a66') + '</g></g>';
    box.innerHTML = '<h5>The job bag <small>Move the loupe over Queenie&rsquo;s screen and click what you find. Fill in every line of the ticket, then bag it.</small></h5>' +
      '<div class="jbwrap"><div class="scr"><svg id="lpsvg" viewBox="0 0 460 550"><defs><clipPath id="lpc"><circle id="lpcc" cx="230" cy="200" r="74"/></clipPath></defs>' + page +
      '<g id="marks"></g><g id="loupe"><g clip-path="url(#lpc)"><rect x="0" y="0" width="460" height="550" fill="#fff"/><use id="lpu" href="#pg"/></g><circle id="lpring" cx="230" cy="200" r="74" fill="none" stroke="#1d1d1d" stroke-width="8"/><circle id="lpring2" cx="230" cy="200" r="78" fill="none" stroke="#c8a24a" stroke-width="2"/></g></svg>' +
      '<p>letter.pdf &middot; enlarged 4 times under the loupe &middot; click to mark a picture</p></div>' +
      '<div class="ticket"><h6>Job bag <small>SORRELL &amp; DAUGHTER &middot; 4/11</small></h6>' +
      '<div class="tline" data-l="1"><b>1 &middot; Pictures pasted onto the page (2)</b><div class="pics" id="jb-pics"></div></div>' +
      '<div class="tline" data-l="2"><b>2 &middot; Typefaces</b><div class="samples">' +
        [['the otter letterhead&rsquo;s lettering', 'rd'], ['the leak&rsquo;s own words', 'pb'], ['her real June letter&rsquo;s words', 'rd']].map(function (s, i) {
          return '<div class="samp"><svg viewBox="0 0 120 60">' + aG(s[1], 34, 22, 1, '#1d1a16') + '</svg><i>' + s[0] + '</i><span class="sl" data-k="t' + i + '"></span></div>';
        }).join('') + '</div><div class="tray">' + FACES.map(function (f) { return '<span class="tl" data-v="' + ({ mk: 'market', rd: 'raddle', pb: 'press' })[f[0]] + '">' + f[1] + '</span>'; }).join('') + '</div></div>' +
      '<div class="tline" data-l="3"><b>3 &middot; Paper of the page in the file</b><div class="opts" id="jb-paper">' +
        [['a4', 'A4', 210, 297], ['a5', 'A5', 148, 210], ['letter', 'Letter', 216, 279], ['fools', 'Foolscap', 203, 330]].map(function (p) {
          return '<button type="button" data-v="' + p[0] + '"><svg width="' + (p[2] / 10).toFixed(0) + '" height="' + (p[3] / 10).toFixed(0) + '" viewBox="0 0 ' + p[2] + ' ' + p[3] + '"><rect width="' + p[2] + '" height="' + p[3] + '" fill="#fff" stroke="#2a1e12" stroke-width="8"/></svg>' + p[1] + '</button>';
        }).join('') + '</div></div>' +
      '<div class="tline" data-l="4"><b>4 &middot; The file was made on 3/11/2026 at 01:47. So:</b><div class="opts made" id="jb-made">' +
        '<button type="button" data-v="scan">a letter written in March could have been scanned in November: the date of the file tells us nothing</button>' +
        '<button type="button" data-v="typed">its words were typed on 3 November, the date &ldquo;16 March&rdquo; with them</button>' +
        '<button type="button" data-v="thea">it was written by Thea Rushton</button></div></div></div></div>' +
      '<div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="jb-go">Bag it</button></div>';
    var msgEl = box.querySelector('.jmsg'), svg = box.querySelector('#lpsvg'), REG = {};
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { st.t = LK.vals(box, '.samp .sl'); ER.flag('c-st', st); }
    function regs() {
      ['head', 'ref', 'date', 'addr', 'body', 'sig', 'name'].forEach(function (k) {
        var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        ER.$$('[data-reg="' + k + '"]', box.querySelector('#pg')).forEach(function (n) {
          var b = n.getBBox(), m = n.getAttribute('transform'), tx = 0, ty = 0;
          if (m) { var q = m.match(/translate\(([-\d.]+)[ ,]+([-\d.]+)/); if (q) { tx = +q[1]; ty = +q[2]; } }
          x0 = Math.min(x0, b.x + tx); y0 = Math.min(y0, b.y + ty); x1 = Math.max(x1, b.x + b.width + tx); y1 = Math.max(y1, b.y + b.height + ty);
        });
        REG[k] = [x0 - 3, y0 - 3, x1 + 3, y1 + 3];
      });
    }
    function drawMarks() {
      box.querySelector('#marks').innerHTML = st.pics.map(function (k) { var r = REG[k]; return r ? '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + (r[2] - r[0]) + '" height="' + (r[3] - r[1]) + '" fill="#ff5a9a" fill-opacity=".12" stroke="#ff2a7a" stroke-width="2" stroke-dasharray="6 4"/>' : ''; }).join('');
      box.querySelector('#jb-pics').innerHTML = st.pics.length ? st.pics.map(function (k) { return LBL[k]; }).join(' &middot; ') : '(none marked yet)';
    }
    function loupe(x, y) {
      ['lpcc', 'lpring', 'lpring2'].forEach(function (id) { var n = box.querySelector('#' + id); n.setAttribute('cx', x); n.setAttribute('cy', y); });
      box.querySelector('#lpu').setAttribute('transform', 'translate(' + x + ' ' + y + ') scale(4) translate(' + (-x) + ' ' + (-y) + ')');
    }
    svg.addEventListener('pointermove', function (e) { var p = ER.pt(svg, e); loupe(p.x, p.y); });
    svg.addEventListener('click', function (e) {
      if (wait) return;
      if (!REG.head) regs();
      var p = ER.pt(svg, e), hit = null;
      Object.keys(REG).forEach(function (k) { var r = REG[k]; if (!hit && p.x >= r[0] && p.x <= r[2] && p.y >= r[1] && p.y <= r[3]) hit = k; });
      if (!hit) return;
      var i = st.pics.indexOf(hit); if (i >= 0) st.pics.splice(i, 1); else st.pics.push(hit);
      box.querySelector('.tline[data-l="1"]').classList.remove('bad'); LK.sfx.pen(); keep(); drawMarks();
    });
    LK.tiles(box, { tile: '.tl', slot: '.samp .sl', lock: function () { return wait; }, change: function () { box.querySelector('.tline[data-l="2"]').classList.remove('bad'); keep(); } });
    ER.$$('.samp .sl', box).forEach(function (s, i) { if (st.t[i]) LK.put(s, box.querySelector('.tl[data-v="' + st.t[i] + '"]')); });
    function opts(id, key, line) {
      var o = box.querySelector(id);
      function show() { ER.$$('button', o).forEach(function (b) { b.classList.toggle('on', st[key] === b.getAttribute('data-v')); }); }
      o.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (!b || wait) return; st[key] = b.getAttribute('data-v'); box.querySelector('.tline[data-l="' + line + '"]').classList.remove('bad'); LK.sfx.stamp(); keep(); show(); });
      show();
    }
    opts('#jb-paper', 'paper', 3); opts('#jb-made', 'made', 4);
    function bad(l, t) { var n = box.querySelector('.tline[data-l="' + l + '"]'); n.classList.add('bad'); ER.shake(n); ER.sfx.no(); msg(t); }
    var TNO = { market: 'Market Sans has an a in one storey: a round bowl and a stick. Look at the enlarged a on that cut-out again.', raddle: 'Raddle Sans has no serifs. Look at the feet on the enlarged a of that cut-out.', press: 'Pressbook Serif has serifs, little feet. Has that cut-out got any?' };
    box.querySelector('#jb-go').addEventListener('click', function () {
      var i, file;
      if (wait || nextFile) return;
      keep();
      ER.$$('.tline', box).forEach(function (n) { n.classList.remove('bad'); });
      if (st.pics.length !== 2) return bad(1, st.pics.length < 2 ? '&ldquo;The preflight says two pictures,&rdquo; says Queenie. &ldquo;Move the loupe over everything. Type stays sharp; a picture goes to steps.&rdquo;' : '&ldquo;Two pictures, the preflight says,&rdquo; says Queenie. &ldquo;You&rsquo;ve marked ' + st.pics.length + '. Look closer: type stays sharp however big you make it.&rdquo;');
      for (i = 0; i < 2; i++) if (!ER.check('pic', st.pics[i])) return bad(1, '&ldquo;Look at ' + LBL[st.pics[i]] + ' under the loupe,&rdquo; says Queenie. &ldquo;Sharp edges, every curve smooth? That&rsquo;s type. Type was typed. Pictures break into squares.&rdquo;');
      if (st.t.indexOf('') >= 0) return bad(2, '&ldquo;A face for all three cut-outs,&rdquo; says Queenie.');
      for (i = 0; i < 3; i++) if (!ER.check('t' + i, st.t[i])) return bad(2, TNO[st.t[i]]);
      if (!st.paper) return bad(3, '&ldquo;What paper is the page in the file?&rdquo; says Queenie. &ldquo;The preflight gives you its size.&rdquo;');
      if (!ER.check('paper', st.paper)) return bad(3, st.paper === 'a4' ? '&ldquo;A4 is 210 by 297,&rdquo; says Queenie. &ldquo;The preflight says 215.9 by 279.4: wider and shorter. That&rsquo;s why Tariq&rsquo;s printout had a white band at the foot.&rdquo;' : '&ldquo;Measure it against my card,&rdquo; says Queenie. &ldquo;215.9 by 279.4 millimetres. Which paper is that?&rdquo;');
      if (!st.made) return bad(4, '&ldquo;And the date the file was made,&rdquo; says Queenie. &ldquo;What does it tell us?&rdquo;');
      if (!ER.check('made', st.made)) return bad(4, st.made === 'scan' ? '&ldquo;It would tell us nothing if it were a scan,&rdquo; says Queenie. &ldquo;A scan is all picture, words and all. What did your loupe find the words were?&rdquo;' :
        '&ldquo;The author is the name the computer was set up with,&rdquo; says Queenie. &ldquo;It tells you whose computer, not whose fingers. Hold on to it. Don&rsquo;t hang anybody with it.&rdquo;');
      file = ER.exit([st.pics.slice().sort().join(',') + '|' + st.t.join(',') + '|' + st.paper + '|' + st.made], { wait: true });
      if (!file) { msg('The bag will not close. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      LK.mine('jobbag', 'The job bag: what the leak is made of', '<p>Two pictures pasted on: the letterhead and the signature, cut from her real letter of 4 June.</p><p>Every word typed, in Pressbook Serif: not on a council computer (they set Raddle Sans).</p><p>US Letter paper, 216 &times; 279 mm, and US spelling: a computer set up the American way. Letter on A4 = Tariq&rsquo;s white band.</p><p>Typed on Tuesday 3 November at 01.47. Author: &ldquo;Thea Rushton&rdquo;: whose computer, not whose fingers.</p>', true);
      msg('Queenie writes the ticket out in capitals, licks the envelope, and writes on the front: NOT WHAT IT SAYS.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Queenie reads the ticket back, the way she reads a job back to a customer. &ldquo;Two pictures stuck on a page: the top off one of Sheila&rsquo;s real letters, and her signature off the same. Everything else typed, in Pressbook Serif, on a home computer that hadn&rsquo;t got Raddle Sans. On American paper, with American spelling. On the third of November, at thirteen minutes to two in the morning.&rdquo;',
          '&ldquo;So it&rsquo;s a forgery,&rdquo; you say. &ldquo;It&rsquo;s a page somebody made on Monday night out of bits of a real letter from June,&rdquo; says Queenie. &ldquo;What you call it is Rowena&rsquo;s business. I just print things.&rdquo;',
          'Tariq is reading the preflight again. &ldquo;Author: Thea Rushton,&rdquo; he says quietly. &ldquo;Thea?&rdquo; &ldquo;That&rsquo;s the name the computer was set up with,&rdquo; says Queenie. &ldquo;Not the name of the fingers. Remember my dad.&rdquo;',
          '&ldquo;The Corn Exchange,&rdquo; says Tariq. &ldquo;We have to put it to Sheila before we print a word, and ask her office about that reference number. And Ralph Stringer has been telling people he saw this letter on her desk in March.&rdquo; &ldquo;In March,&rdquo; says Queenie, &ldquo;it hadn&rsquo;t been made.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2600);
    });
    loupe(230, 200); drawMarks();
    setTimeout(function () { regs(); drawMarks(); }, 60);
    msg(st.pics.length || st.paper ? 'The job bag, as you left it.' : 'Queenie has put the PDF up on her screen, with her loupe. The ticket is on the right.');
    return { open: function () { ER.open('ov-lock', box); setTimeout(function () { regs(); drawMarks(); }, 60); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
