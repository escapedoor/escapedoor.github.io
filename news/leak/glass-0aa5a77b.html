<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};

  (function () {
    $('#rowena').innerHTML = LK.who('rowena', { lit: '#ffd890', armR: 'M31 -222Q58 -200 54 -166', handR: [52, -160], extra: '<rect x="46" y="-176" width="4" height="26" fill="#7a1f1f" transform="rotate(20 48 -163)"/>' });
    $('#tariq').innerHTML = LK.who('tariq', { lit: '#ffd890' });
    $('#tariqd').innerHTML = '';
  })();

  ER.init({
    theme: 'news', story: 'leak', storyTitle: 'Letterhead', id: 'glass', no: 'VI', title: 'The Glass Box',
    go: 'Go into the box',
    intro: [
      'The snug table. Who gains (Ralph Stringer would get the chair; the Record would sell papers) and Ralph&rsquo;s untrue story were only reasons to look harder: a motive is not proof. The tests were things a person could fail: having the June letter (anybody could: it had been shared two hundred times), using Thea&rsquo;s laptop (only Thea and Seb), being awake at 01.47 (not Thea, who is in bed by half past nine) and writing American with &ldquo;reach out&rdquo; (Seb, back from a year in Ohio). Asked quietly, Seb Rushton said yes. He made the letter on Monday night, to make people &ldquo;look properly&rdquo;.',
      'A quarter past three. The editor&rsquo;s glass box, in the corner of the newsroom. Pages go at six.'
    ],
    exit: {"next":"press","w":{"e249fd8a":"3200d994"}}, tags: {"b1":["d56c1d20"],"b2":["247ceabc"],"b3":["1a58e00b"],"b4":["08fec485"],"b5":["393555b1"],"b6":["91dda9c9"],"b7":["13794cb3"],"h":["f2cf4847"],"i":["eed6565a"],"spike":["35e1bf79"],"lead":["8b626b3a"],"second":["21fc0788"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('f-file') || null; told = ER.flag('f-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('f-told', told); return true; }
  function isBusy() { return busy; }
  function readAll() { return told.reply && told.law && told.style && told.draft; }
  function ready() { return told.rowena && readAll(); }
  function paint() {
    $('#rowena').classList.toggle('ready', !!(told.in && !told.rowena));
    $('#reply').classList.toggle('ready', !!(told.rowena && !told.reply));
    $('#law').classList.toggle('ready', !!(told.rowena && !told.law));
    $('#style').classList.toggle('ready', !!(told.rowena && !told.style));
    $('#draft').classList.toggle('ready', !!(told.rowena && !told.draft));
    $('#stone').classList.toggle('ready', !!(ready() && !nextFile));
    $('#hh').setAttribute('d', nextFile ? 'M800 150L821 162' : 'M800 150L822 140');
    $('#mh').setAttribute('d', nextFile ? 'M800 150L781 120' : 'M800 150L807 116');
    ER.pips((told.rowena ? 1 : 0) + (readAll() ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['The pages have gone. Sorrell&rsquo;s press is about to start. The button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return [lock.stage() === 1 ? 'pf1' : 'pf2', lock.stage() === 1 ? [
      'For each sentence ask: can we prove it (then no hedge at all)? Did somebody say it on the record (said)? Did somebody tell us without their name (is understood)? Is it in a record (according to)? And is it true?',
      'Page 35 and the lawyer&rsquo;s page: putting &ldquo;alleged&rdquo; or quotation marks round an accusation does not make it safe to print. Ralph&rsquo;s March story is untrue: do not repeat it in any form. The line about the police comes from the part of Sheila&rsquo;s note that was not for printing with her name.',
      'Only one sentence needs &ldquo;is understood&rdquo;: the police. One needs &ldquo;according to&rdquo;: the register. The forgery, the admission and the copy sent to Ralph are things we know, said plainly. Sheila and Stallard Homes simply &ldquo;said&rdquo;.'
    ] : [
      'Most readers read the headline and the first paragraph and stop. So those two must say the most important thing that we can prove. What is the most important thing we can prove today?',
      'Do not lead with the accusation, even to deny it, and do not ask the town to guess who made the letter. Any detail that points to the maker (his age, his street) names him without his name.',
      'The forgery leads, and the flood wall that Sluice Lane is frightened about comes second; the bonfire goes at the foot. A story about her lunch with the builder is true, but on page one it would say something false about her: it goes on the spike.'
    ]];
    if (!told.rowena) return ['talk', ['Rowena is at the desk with the proof of page one.', 'Click Rowena, in the middle of the glass box.']];
    if (!readAll()) return ['read', ['Four things to read: Sheila&rsquo;s reply, the lawyer&rsquo;s page, page 35 of the style book, and Tariq&rsquo;s draft.', 'Sheila&rsquo;s reply is the note on the left of the desk (14.52). The lawyer&rsquo;s page is the white sheet taped to the glass, top left. The style book is the red book on the desk. Tariq&rsquo;s draft is the paper at the right of the desk.']];
    return ['stone', ['Everything is ready. The proof is on the stone, the sloping table on the right.', 'Click the big sloping table with the page of the Record on it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The pages have gone. Eight minutes to spare.'); return; }
    if (told.in) { busy = false; ER.say('The glass box. The clock says a quarter past three.'); return; }
    ER.narrate([
      'The glass box is Rowena&rsquo;s office: four glass walls in the corner of the newsroom, so that she can see everybody and everybody can see her. The low sun comes straight through all four.',
      'Sheila Pendry&rsquo;s answers came at eight minutes to three, as she promised. They are on the desk, beside the proof of tomorrow&rsquo;s page one, which is on the stone, the big sloping table where pages are put together.',
      '&ldquo;Sit,&rdquo; says Rowena. &ldquo;We know what happened. Now we decide what we may say. That is a different job, and it is the one that sinks papers.&rdquo;'
    ], function () { busy = false; tell('in'); paint(); });
  }

  $('#rowena').addEventListener('click', function () {
    if (busy) return;
    if (told.rowena) { ER.say(nextFile ? '&ldquo;Luxury,&rdquo; says Rowena, looking at the clock.' : !readAll() ? '&ldquo;Sheila&rsquo;s answers, Simon&rsquo;s page, page 35, and Tariq&rsquo;s draft,&rdquo; says Rowena. &ldquo;Then the stone.&rdquo;' : '&ldquo;The stone,&rdquo; says Rowena. &ldquo;Red pen.&rdquo;'); return; }
    ER.talk({
      who: 'Rowena Prosser', role: 'Editor · the glass box, quarter past three', face: window.FACE('rowena'),
      lines: [
        { note: 'She has a red pen behind each ear.', a: '&ldquo;So. It&rsquo;s a forgery, a boy made it, she paid for her lunch, and Ralph Stringer is a fool, which isn&rsquo;t news. Now the hard part. What do we print?&rdquo;' },
        { q: 'Why print anything?', a: '&ldquo;Because Ralph has told the whole town to watch the Record, and the letter is on half the phones in the Corn Exchange. If we say nothing, people will go on believing it. It&rsquo;s false, we can prove it&rsquo;s false, and a forged letter about a planning decision is the town&rsquo;s business. That&rsquo;s the public interest.&rdquo;' },
        { q: 'Are we allowed to?', a: '&ldquo;Read Simon&rsquo;s page on the glass. Simon Rees is our lawyer; that page is what&rsquo;s left of 1998. Can we prove it? Yes. Have we asked her? Yes: her answer is on the desk. Is it fair to her? That&rsquo;s what you are going to make sure of.&rdquo;' },
        { q: 'What about Seb?', a: '&ldquo;He&rsquo;s a private person, he&rsquo;s nineteen, he has told her he&rsquo;s sorry, and the story doesn&rsquo;t need his name. The town needs to know the letter is false. It doesn&rsquo;t need to know whose grandson made it.&rdquo; She caps her pen. &ldquo;If anybody works out who it was, it won&rsquo;t be from us.&rdquo;' },
        { q: 'What do I do?', a: '&ldquo;Tariq&rsquo;s draft is on the proof. Seven sentences, and some of them are wrong in ways that could cost us this building. Fix them. Then the headline, the first paragraph, and what goes where on the page. Most people read the headline and the first paragraph and nothing else. Make those two true.&rdquo;' }
      ],
      clue: { id: 'rowena2', title: 'Rowena: what may we print?', kind: 'What she said' },
      done: function (seen) { if (seen && tell('rowena')) { LK.terms(['public interest']); paint(); } }
    });
  });
  $('#tariq').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;I wrote that lunch story yesterday,&rdquo; says Tariq, looking at the spike. &ldquo;Before you came.&rdquo;' : '&ldquo;I wrote the draft in a hurry,&rdquo; says Tariq. &ldquo;Be cruel.&rdquo;');
  });

  var REPLY = '<h4>Email from Cllr Sheila Pendry to Rowena Prosser &middot; Wednesday 4 November, 14.52</h4>' +
    '<p>You asked me four questions. Here are four answers, and you may print every word.</p>' +
    '<p>1. I did not write the letter dated 16 March. In March I was not the chair of anything except the Riverside Allotment Society, and the council&rsquo;s otter did not exist. I still miss the woolsack.</p>' +
    '<p>2. I had lunch at the Plough on Friday 13 March, after the site walk. I paid for it myself, &pound;27.40, and the offer is in the register.</p>' +
    '<p>3. I sign every letter in ink. Ask Pauline.</p><p>4. I have never in my life reached out to anybody.</p>' +
    '<p>I think the letter is a nasty piece of fiction. I would rather you printed something true about the flood wall.</p><p>S.P.</p>' +
    '<div class="aside">Not for printing, and not with my name on it: Thea and the boy rang me at one. He said sorry, properly. I am not going to the police. He is nineteen and frightened, and so is she.</div>';
  var LAW = '<h4><span>Pinned to the glass</span><span>notes for the Record by Simon Rees, solicitor</span></h4><h3>Libel on one page</h3>' +
    '<p><b>Defamation</b> is publishing something about a person that seriously harms their reputation. In print it is <b>libel</b>. A council cannot sue for libel; a councillor can.</p>' +
    '<p>Your main defences, in England and Wales: <b>Truth</b>: you can prove that what you said is substantially true. <b>Honest opinion</b>: it is plainly an opinion, an honest person could hold it, and you show what it is based on. <b>Public interest</b>: it is about a matter of public interest, and you reasonably believed that publishing it was in the public interest. That means doing the work: checking, and asking the person before you print (the <b>right of reply</b>).</p>' +
    '<p>Repeating somebody else&rsquo;s accusation is publishing it yourself. Quotation marks, &ldquo;alleged&rdquo; and &ldquo;claimed&rdquo; do not make it safe. A true fact set out so that it suggests something false can be libel too.</p>' +
    '<p>A judge asks what an ordinary reader would understand from the whole article. An ordinary reader starts with the <b>headline</b> and the first paragraph, and many stop there.</p>' +
