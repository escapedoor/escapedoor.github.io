<style>
  body{--bg:#d8d0bc;--accent:#8ad8cc;--font-display:'UnifrakturCook',serif;--font-ui:'Libre Franklin',sans-serif;--font-body:'Newsreader',serif;
    --tc-bg:rgba(30,40,38,.97);--tc-ink:#f2efe6;--cap-bg:rgba(26,36,34,.95);--panel:#24302e;--face-bg:#d9cdb4;--q-ink:#9fd8d0;--fade:#0a0e0e;--hud-bg:rgba(26,36,34,.86)}
  #rad path{animation:heat 3s ease-in-out infinite}
  @keyframes heat{50%{opacity:.2;transform:translateY(-8px)}}
  #flag2{animation:flap 3.5s ease-in-out infinite;transform-origin:1440px 220px}
  @keyframes flap{50%{transform:skewY(4deg)}}

  /* Tariq's notebook: four questions and who can answer them */
  .nbj{width:min(1140px,97vw)}
  .pad{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#fbfaf2;color:#1d2a66;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;padding-top:16px}
  .pad:before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,#9aa0a8 0 6px,transparent 6px 22px);opacity:.8}
  .qq{padding:6px 14px 8px 18px;border-right:1px solid #e0d8c8;border-bottom:1px solid #e0d8c8;background-image:linear-gradient(#cfd8e6 1px,transparent 1px);background-size:100% 26px}
  .qq:nth-child(2n){border-right:0}
  .qq h6{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;line-height:1.2;letter-spacing:.04em;color:#7a1f1f}
  .qq h6 i{font-style:normal;display:inline-block;width:20px;height:20px;border-radius:50%;background:#7a1f1f;color:#fff;text-align:center;line-height:20px;margin-right:6px;font-size:12px}
  .src{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;margin:0 0 4px;padding:2px 4px;border-radius:3px}
  .src svg{width:34px;height:40px;border-radius:2px}
  .src .t{font-family:'Newsreader',serif;font-size:13.6px;line-height:1.22;color:#1d2228}
  .src .t b{font-family:'Libre Franklin',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#1d2a66;display:block}
  .src .t small{font-family:'DM Mono',monospace;font-size:10px;color:#7a6a56}
  .src.no .t{text-decoration:line-through;text-decoration-color:#c0392b;opacity:.6}
  .src.bad{background:#ffe2cc}
  .tb{display:flex;gap:3px}
  .tb button{width:30px;height:26px;border:1.5px solid #9aa0a8;border-radius:3px;background:#fff;font-family:'Kalam',cursive;font-size:17px;line-height:20px;color:#9aa0a8;cursor:pointer}
  .tb button.on[data-v="y"]{background:#2e6b4f;border-color:#2e6b4f;color:#fff}
  .tb button.on[data-v="n"]{background:#c0392b;border-color:#c0392b;color:#fff}
  .vd{display:flex;align-items:center;gap:5px;margin-top:4px;font-family:'Caveat',cursive;font-size:20px;color:#1d2a66}
  .vd button{padding:1px 9px;border:1.5px solid #1d2a66;border-radius:12px;background:transparent;font-family:'Kalam',cursive;font-size:14px;color:#1d2a66;cursor:pointer}
  .vd button.on{background:#1d2a66;color:#fff}
  .vd.bad button{border-color:#e07a1a}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};

  (function () {
    $('#otterg').innerHTML = LK.otter(0, 0, 1, '#1f6f78');
    $('#pauline').innerHTML = LK.who('pauline', { shadow: 0 });
    $('#pendry').innerHTML = LK.who('pendry');
    $('#stringer').innerHTML = LK.who('stringer', { smile: 5, armL: 'M-31 -222Q-60 -210 -66 -250', handL: [-66, -256] });
    $('#tariq').innerHTML = LK.who('tariq', { sit: 1, smile: 1 });
  })();

  ER.init({
    theme: 'news', story: 'leak', storyTitle: 'Letterhead', id: 'council', no: 'IV', title: 'The Corn Exchange',
    go: 'Go up the steps',
    intro: [
      'The job bag. Under Queenie&rsquo;s loupe, two things on the page broke into squares: the letterhead and the signature, pictures cut from Sheila Pendry&rsquo;s real letter of 4 June. Every word was typed, in Pressbook Serif, the face a home computer puts in when it has not got the council&rsquo;s Raddle Sans. The page was American Letter size (which is why Tariq&rsquo;s A4 printout had a white band at the foot), and the spelling was set to American English. Because the words were typed and not scanned, the date of the file is the day they were written: Tuesday 3 November, 01.47. The file&rsquo;s author, &ldquo;Thea Rushton&rdquo;, is only the name the computer was set up with.',
      'Twenty to twelve. The Corn Exchange, across the square: the corridor where the councillors have their rooms.'
    ],
    exit: {"next":"plough","w":{"da14a4cb":"a9bdb4ec"}}, tags: {"m10":["f5513f0f"],"m11":["f8c95e54"],"m12":["28d3e02a"],"m13":["360db2a5"],"m20":["311a4432"],"m21":["adf34a3e"],"m22":["5508057f"],"m23":["4bc3c441"],"m30":["241b2f8a"],"m31":["e74c28bb"],"m32":["e40f312b"],"m33":["0c86da36"],"m40":["911a30ec"],"m41":["cb233cbe"],"m42":["523d9edd"],"v1":["0303cc9e"],"v2":["3a9aad32"],"v3":["ddd91ea6"],"v4":["535e5f5d"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function talked() { return told.pendry && told.pauline && told.stringer; }
  function readAll() { return told.reg && told.day && told.style; }
  function ready() { return talked() && readAll(); }
  function paint() {
    $('#pendry').classList.toggle('ready', !!(told.in && !told.pendry));
    $('#pauline').classList.toggle('ready', !!(told.pendry && !told.pauline));
    $('#stringer').classList.toggle('ready', !!(told.pendry && !told.stringer));
    $('#register').classList.toggle('ready', !!(told.in && !told.reg));
    $('#daybook').classList.toggle('ready', !!(told.pauline && !told.day));
    $('#style').classList.toggle('ready', !!(told.in && !told.style));
    $('#nbook').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((talked() ? 1 : 0) + (readAll() ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['Tariq wants lunch at the Plough. The button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['nb', [
      'One question at a time. For each source ask: were they there, or do they hold the record? Could they know it, from where they were? Have they a reason to lie, and does anything else agree with them?',
      'Page 33: a document cannot vouch for itself, so the leak cannot be a source for anything it says. Off the record means it may send you to look, but it cannot stand in your answer. Two people with the same email are one source.',
      'Three people were at the lunch, and the register was written at the time: they answer questions 1 and 2. For question 3 the day book and Pauline, on the record, agree with Sheila. Stringer could not see in March a letter that was made on 3 November, and his white strip is the band you get when you print the PDF on A4.'
    ]];
    if (!told.pendry) return ['talk', ['You came to put the letter to Sheila Pendry before anything is printed.', 'Click Sheila Pendry, at her door in the middle of the corridor (CHAIR OF PLANNING).']];
    if (!talked()) return ['talk2', ['Two more people to talk to: Pauline at the hatch, and Councillor Stringer.', 'Pauline Stacey is behind the hatch marked MEMBERS&rsquo; SERVICES, on the left. Ralph Stringer is the man in the red tie, by the noticeboard on the right.']];
    if (!readAll()) return ['read', ['Three things to read: the register of gifts, the day book, and page 33 of the style book.', 'The register is the blue binder on the wooden stand on the right. The day book is the green book on the ledge of the hatch. The style book is on the bench on the left.']];
    return ['open', ['Everything is ready. Tariq&rsquo;s notebook is on the bench.', 'Click the small white notebook on the bench, on the left.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The notebook is done. Tariq is putting his coat on.'); return; }
    if (told.in) { busy = false; ER.say('The Members&rsquo; corridor of the Corn Exchange.'); return; }
    ER.narrate([
      'The Corn Exchange was built to sell wheat in, and still smells faintly of it: green tiles to shoulder height, cream paint above, aldermen in oils, and a radiator that bangs.',
      'From the tall window at the end you can see the Record&rsquo;s own window across the square, its gold letters the right way round from here.',
      'Tariq puts his notebook down on the bench. &ldquo;Rule one,&rdquo; he says. &ldquo;Before we print a word about anybody, we ask them. Properly, with time to answer. Sheila&rsquo;s room is the one in the middle.&rdquo;'
    ], function () { busy = false; tell('in'); paint(); });
  }

  /* ---------- people ---------- */
  $('#pendry').addEventListener('click', function () {
    if (busy) return;
    if (told.pendry) { ER.say(nextFile ? '&ldquo;Three o&rsquo;clock,&rdquo; says Sheila Pendry, and shuts her door.' : '&ldquo;Questions in writing, with Pauline,&rdquo; says Sheila Pendry. &ldquo;Answers by three.&rdquo;'); return; }
    ER.talk({
      who: 'Cllr Sheila Pendry', role: 'Chair of the planning committee · on the record', face: window.FACE('pendry'),
      lines: [
        { note: 'She does not ask you to sit down, and then she does.', a: '&ldquo;Tariq rang me at eight. A letter from me to Patrick Stallard, promising him the Meadows. I did not write it. I have never written to Patrick Stallard in my life except through the planning office, and I have never once called him Patrick to his face.&rdquo;' },
        { q: 'Will you answer our questions?', a: '&ldquo;Every one. In writing, so that you can print my exact words and I can&rsquo;t wriggle. Put them on paper and leave them with Pauline, and I&rsquo;ll answer by three. That&rsquo;s your right of reply, isn&rsquo;t it? Well, it&rsquo;s mine too.&rdquo;' },
        { q: 'Did you have lunch with him at the Plough?', a: '&ldquo;On Friday the thirteenth of March, after the site walk, with six other people. He offered to pay. I said no, and paid for my own: twenty-seven pounds forty. And I put the offer in the register, because that is the rule here: anything worth twenty-five pounds or more goes in, taken or not.&rdquo;' },
        { q: 'Who would do this?', a: '&ldquo;Somebody who thinks I sold the Meadows. Half of Sluice Lane thinks so, and I don&rsquo;t blame them: they&rsquo;ve had the river in their kitchens. Ralph would like my chair. Patrick would like a quiet life.&rdquo; She takes off her glasses. &ldquo;I&rsquo;d like you to find out. And I&rsquo;d like you to be fair while you do it. Those are different jobs.&rdquo;' }
      ],
      clue: { id: 'pendry', title: 'Sheila Pendry, on the record', kind: 'What she said' },
      done: function (seen) {
        if (!seen || !tell('pendry')) return;
        LK.terms(['on the record', 'right of reply', 'register']); paint();
        ER.say('Tariq writes four questions on a sheet of paper and leaves it with Pauline. 11.58: answers promised by three.');
      }
    });
  });
  $('#pauline').addEventListener('click', function () {
    if (busy) return;
    if (!told.pendry) { ER.say('Pauline looks over her glasses. &ldquo;If it&rsquo;s about Mrs Pendry, you&rsquo;ll ask Mrs Pendry first.&rdquo;'); return; }
    if (told.pauline) { ER.say('&ldquo;One number, one letter,&rdquo; says Pauline. &ldquo;And everyone signs in ink.&rdquo;'); return; }
    ER.talk({
      who: 'Pauline Stacey', role: 'Members&rsquo; Services Officer · twenty-nine years at the hatch', face: window.FACE('pauline'),
      lines: [
        { note: 'She takes Tariq&rsquo;s questions, reads them, and puts them face down.', a: '&ldquo;Every letter a councillor sends through this office gets the next number in my day book. One number, one letter. MS for Members&rsquo; Services, PL for planning. You can look; I&rsquo;ll cover the residents&rsquo; names, they&rsquo;re nobody&rsquo;s business.&rdquo;' },
        { q: 'What number would a letter of 16 March have?', a: '&ldquo;Something in the seven hundreds. We were at 0731 that day. 0917 was the fourth of June: Mrs Pendry to a lady in Sluice Lane, about the Meadows. And nothing, ever, from any member to Stallard Homes. Members don&rsquo;t write to people with applications in. It goes through the planning office.&rdquo;' },
        { q: 'How do councillors sign their letters?', a: '&ldquo;In ink, at this hatch, every one. We don&rsquo;t do stamps or pasted signatures for members. Mrs Pendry won&rsquo;t even let me use a stamp on her Christmas cards.&rdquo;' },
        { q: 'Is there anything else we should know?', a: '<p>She looks up and down the corridor. &ldquo;Off the record?&rdquo;</p><p>Tariq puts his pen down. &ldquo;Off the record: we don&rsquo;t print it, and we don&rsquo;t say who said it.&rdquo;</p><p>&ldquo;Councillor Stringer was in here at nine yesterday morning, printing something off his email on my machine. Then he took it round half the building. My machine prints on A4.&rdquo;</p>' }
      ],
      clue: { id: 'pauline', title: 'Pauline Stacey: the day book, and one thing off the record', kind: 'What she said' },
      done: function (seen) { if (seen && tell('pauline')) { LK.terms(['off the record', 'not for attribution']); paint(); } }
    });
  });
  $('#stringer').addEventListener('click', function () {
    if (busy) return;
    if (!told.pendry) { ER.say('Councillor Stringer waves at you and points at Sheila Pendry&rsquo;s door. &ldquo;Ask her! Go on!&rdquo;'); return; }
    if (told.stringer) { ER.say(nextFile ? 'Councillor Stringer is studying the noticeboard very hard.' : '&ldquo;Saw it with my own eyes,&rdquo; says Councillor Stringer. &ldquo;March.&rdquo;'); return; }
    ER.talk({
      who: 'Cllr Ralph Stringer', role: 'Vice-chair of the planning committee · on the record', face: window.FACE('stringer'),
      lines: [
        { note: 'He shakes your hand as if he were trying to win it.', a: '&ldquo;The Record! Good. About time. I saw that letter, you know. With my own eyes. On her desk, in March, plain as day.&rdquo;' },

  /* ---------- the papers ---------- */

    '<p>Every letter in this book was signed in ink at the hatch. P.S.</p>';
  var STYLE = '<h4><span>The Record Style Book</span><span>page 33</span></h4><h3>Who says so, and how could they know?</h3>' +

    '<ol><li><b>First-hand</b> sources were there, did it, or keep the record. <b>Second-hand</b> sources were told. A record made at the time, by somebody with nothing to gain, is often the best witness of all. A document cannot vouch for itself.</li>' +

    '<p class="pen">A source is a person, not a vending machine. Thank them. &mdash; R.P.</p>';
  function after(k) { if (tell(k)) { paint(); if (ready()) ER.say('&ldquo;Notebook,&rdquo; says Tariq, and holds it out.'); } }
  $('#register').addEventListener('click', function () { if (busy) return;

  /* ---------- the notebook: for each question, which sources count, and the answer ---------- */
  function makeNotes() {

    var Q = [
      ['Did Sheila Pendry have lunch with Patrick Stallard at the Plough on Friday 13 March?', [
        [DOCM('#1f6f78', 'REG'), 'The register', 'lunch, the Plough, 13/03/26, offered by Stallard Homes', 'a council record, made at the time'],
        [FACEM('pendry'), 'Sheila Pendry', '&ldquo;On Friday the thirteenth of March, after the site walk.&rdquo;', 'on the record'],
        [FACEM('stringer'), 'Ralph Stringer', '&ldquo;Course I was. Fell in a ditch first.&rdquo;', 'on the record'],
        [DOCM('#7a1f1f', 'PDF'), 'The leak', '&ldquo;lunch at the Plough on Thursday 13 March&rdquo;', 'the letter we are testing']]],
      ['Did Stallard Homes pay for her lunch?', [
        [DOCM('#1f6f78', 'REG'), 'The register', 'Pendry: &ldquo;REFUSED: paid for her own&rdquo;', 'a council record, made at the time'],
        [FACEM('pendry'), 'Sheila Pendry', '&ldquo;I said no, and paid for my own.&rdquo;', 'on the record'],
        [FACEM('stringer'), 'Ralph Stringer', '&ldquo;Sheila paid for her own. She always does.&rdquo;', 'on the record'],
        [DOCM('#7a1f1f', 'PDF'), 'The leak', '&ldquo;Thank you for a most enjoyable lunch&rdquo;', 'the letter we are testing']]],
      ['Did she write the letter dated 16 March?', [
        [FACEM('pendry'), 'Sheila Pendry', '&ldquo;I did not write it.&rdquo;', 'on the record; she would deny it either way'],
        [DOCM('#2f523e', 'DAY'), 'The day book', '16 March was MS/PL/0731; 0917 was 4 June, to Sluice Lane', 'a council record, made at the time'],
        [FACEM('pauline'), 'Pauline Stacey', '&ldquo;In ink, at this hatch, every one.&rdquo;', 'on the record'],
        [FACEM('stringer'), 'Ralph Stringer', '&ldquo;On her desk, in March, plain as day.&rdquo;', 'on the record; wanted her chair']]],
      ['Did Ralph Stringer see this letter on her desk in March?', [
        [FACEM('stringer'), 'Ralph Stringer', '&ldquo;A great white strip all along the bottom.&rdquo;', 'on the record; wanted her chair'],
        [FACEM('pauline'), 'Pauline Stacey', 'he printed something from his email on her A4 machine on Tuesday', 'off the record'],
        [DOCM('#7a1f1f', 'BAG'), 'Your date line and job bag', 'the otter: from 1 April; the file: typed on 3 November', 'records, checked by you']]]
    ];
    var st = ER.flag('d-st') || { m: {}, v: {} }, wait = false, box = ER.el('div', 'job nbj');
    box.innerHTML = '<h5>Tariq&rsquo;s notebook <small>For every source: does it count towards the answer (&#10003;) or not (&#10007;)? Then write the answer.</small></h5><div class="pad">' +
      Q.map(function (q, i) {
        return '<div class="qq" data-q="' + (i + 1) + '"><h6><i>' + (i + 1) + '</i>' + q[0] + '</h6>' + q[1].map(function (s, j) {
          return '<div class="src" data-k="' + (i + 1) + '-' + j + '">' + s[0] + '<div class="t"><b>' + s[1] + '</b>' + s[2] + ' <small>' + s[3] + '</small></div><div class="tb"><button type="button" data-v="y">&#10003;</button><button type="button" data-v="n">&#10007;</button></div></div>';
        }).join('') + '<div class="vd" data-q="' + (i + 1) + '">So: <button type="button" data-v="yes">yes</button><button type="button" data-v="no">no</button><button type="button" data-v="cant">can&rsquo;t say</button></div></div>';
      }).join('') + '</div><div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="nb-go">Read it to Tariq</button></div>';
    var msgEl = box.querySelector('.jmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() {
      ER.$$('.src', box).forEach(function (r) { var k = r.getAttribute('data-k'); r.classList.toggle('no', st.m[k] === 'n'); ER.$$('.tb button', r).forEach(function (b) { b.classList.toggle('on', st.m[k] === b.getAttribute('data-v')); }); });
      ER.$$('.vd', box).forEach(function (r) { var q = r.getAttribute('data-q'); ER.$$('button', r).forEach(function (b) { b.classList.toggle('on', st.v[q] === b.getAttribute('data-v')); }); });
    }
    box.addEventListener('click', function (e) {
      if (wait) return;
      var b = e.target.closest ? e.target.closest('.tb button') : null;
      if (b) { var r = b.closest('.src'); st.m[r.getAttribute('data-k')] = b.getAttribute('data-v'); r.classList.remove('bad'); LK.sfx.pen(); ER.flag('d-st', st); show(); return; }
      b = e.target.closest ? e.target.closest('.vd button') : null;
      if (b) { var v = b.closest('.vd'); st.v[v.getAttribute('data-q')] = b.getAttribute('data-v'); v.classList.remove('bad'); LK.sfx.pen(); ER.flag('d-st', st); show(); }
    });
    var NO = {
      '1-0': 'The register was written at the time by the council, and the lunch is in it. That counts.', '1-1': 'She was there, and she says so on the record. That counts, and it agrees with the register.', '1-2': 'He was there too: he fell in the ditch on the way. First-hand, on the record. That counts.',
      '1-3': '&ldquo;A document cannot vouch for itself,&rdquo; says Tariq. &ldquo;The leak is what we are testing. It can&rsquo;t be a witness for its own lunch, and it has the wrong day anyway.&rdquo;',
      '2-0': 'The register says she refused and paid her own. A record made at the time: it counts.', '2-1': 'First-hand, on the record, and the register agrees with her. It counts.', '2-2': 'He wanted her chair, and he still says she paid her own way. When somebody says something against their own wishes, it counts.',
      '2-3': '&ldquo;The leak can&rsquo;t vouch for itself,&rdquo; says Tariq. &ldquo;We are testing it, not asking it.&rdquo;',
      '3-0': '&ldquo;She has a reason to deny it,&rdquo; says Tariq, &ldquo;so we check harder. We did, and every record agrees with her. Her word counts; it just isn&rsquo;t enough by itself.&rdquo;',
      '3-1': 'The day book is the council&rsquo;s own record, made at the time: 0731 on 16 March, 0917 on 4 June. It counts.', '3-2': 'Pauline is first-hand: the letters are signed at her hatch. On the record. It counts.',
      '3-3': '&ldquo;Could he know?&rdquo; says Tariq. &ldquo;In March the otter didn&rsquo;t exist and the file hadn&rsquo;t been typed. He can&rsquo;t have seen this letter then.&rdquo;',
      '4-0': '&ldquo;His white strip,&rdquo; says Tariq. &ldquo;That&rsquo;s what you get when you print the PDF on A4. He saw a printout of the email, like us. And he wants the chair. He doesn&rsquo;t count.&rdquo;',
      '4-1': '&ldquo;Off the record,&rdquo; says Tariq. &ldquo;It tells us where to look. It can&rsquo;t stand in the answer, and we can&rsquo;t print it.&rdquo;',
      '4-2': 'Your own date line and job bag are records you checked: the otter from 1 April, the file typed on 3 November. They count.'
    };
    var VNO = { 1: 'Three people who were there and a record made at the time all agree. What is the answer?', 2: 'The register, Sheila, and even Ralph say she paid her own way. Did Stallard Homes pay?', 3: 'Her word, the day book and Pauline, on the record, all point one way. Did she write it?', 4: 'Could he have seen in March a page that was typed on 3 November?' };
    box.querySelector('#nb-go').addEventListener('click', function () {
      var i, j, k, parts = [], file;
      if (wait || nextFile) return;
      ER.$$('.src,.vd', box).forEach(function (n) { n.classList.remove('bad'); });
      for (i = 0; i < Q.length; i++) {
        for (j = 0; j < Q[i][1].length; j++) { k = (i + 1) + '-' + j; if (!st.m[k]) { ER.sfx.no(); msg('&ldquo;Every source gets a tick or a cross,&rdquo; says Tariq. &ldquo;Question ' + (i + 1) + ' isn&rsquo;t finished.&rdquo;'); return; } }
        if (!st.v[i + 1]) { ER.sfx.no(); msg('&ldquo;And an answer for question ' + (i + 1) + ',&rdquo; says Tariq.'); return; }
      }
      for (i = 0; i < Q.length; i++) {
        var row = '';
        for (j = 0; j < Q[i][1].length; j++) {
          k = (i + 1) + '-' + j; row += st.m[k];
          if (!ER.check('m' + (i + 1) + j, st.m[k])) { var n = box.querySelector('.src[data-k="' + k + '"]'); n.classList.add('bad'); ER.shake(n); ER.sfx.no(); msg(NO[k]); return; }
        }
        if (!ER.check('v' + (i + 1), st.v[i + 1])) { var v = box.querySelector('.vd[data-q="' + (i + 1) + '"]'); v.classList.add('bad'); ER.shake(v); ER.sfx.no(); msg(VNO[i + 1]); return; }
        parts.push(row + ':' + st.v[i + 1]);

      LK.mine('sources', 'Who says so', '<p>1. Lunch at the Plough on Friday 13 March: YES (register, Sheila, Ralph).</p><p>2. Stallard paid for hers: NO. She refused and paid &pound;27.40 (register, Sheila, Ralph).</p><p>3. She wrote the 16 March letter: NO (day book, Pauline, Sheila; 16 March was 0731).</p><p>4. Ralph saw it in March: NO. His white strip = a printout of the PDF. Pauline&rsquo;s tip is off the record: never printed, never named.</p>', true);
      msg('Tariq reads your four answers, nods, and walks across the corridor to the noticeboard.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Councillor,&rdquo; says Tariq, quite gently. &ldquo;The white strip at the bottom. You only get that when you print the email on A4. In March, that page hadn&rsquo;t been made. Did somebody send it to you?&rdquo;',
          'Ralph Stringer goes the colour of his tie. &ldquo;All right. It came on Tuesday, in an email. Ten to two in the morning, no name. Same as you, I expect.&rdquo; A pause. &ldquo;But I was sure I&rsquo;d seen something like it.&rdquo; &ldquo;Something like it,&rdquo; says Tariq, &ldquo;with an otter on it, in March.&rdquo;',
          'Councillor Stringer remembers a meeting he has to be at, and is at it very quickly.',

    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
