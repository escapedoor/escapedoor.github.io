<script>
(function () {
  var $ = ER.$, busy = true, told = {}, pad = null, nextFile = null;

  $('#pcroz').innerHTML = CR.person(980, 854, 1.08, { coat: '#4a3a52', skin: '#e4c2a2', hair: '#cfcac0', hat: 'bun', specs: 1, legs: '#2e2838' });

  ER.init({
    theme: 'adventure', story: 'crown', storyTitle: 'Before the Doors Open', id: 'bay', no: 'I', title: 'The Loading Bay',
    go: 'Into the museum',
    intro: [
      'Twenty to one in the morning, at the back of the Caldmere Museum, in the rain. Three weeks ago you were taken on as the night conservator&rsquo;s assistant: the one who holds the lamp steady, labels the trays, and does not drop things. Tonight the curator herself telephoned you at midnight and asked you to come, and to tell nobody.',
      'The Caldmere Crown &mdash; the silver-gilt circlet a child pulled out of the mere nearly two hundred years ago, the one thing in this town that everybody has stood in front of &mdash; has not been in its case for a week. No alarm went off. No window was broken. Nobody outside these walls knows it is gone.',
      'At nine o&rsquo;clock an inspector comes to count the collection, object by object. Between now and then the crown has to be back under its glass, quietly, with no fuss and nobody blamed. Dr Crozier is waiting by the wicket door with a torch and a face you cannot read.'
    ],
    exit: {"next":"office","w":{"a1357347":"b74343ed"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b-told') || {}; nextFile = ER.flag('b-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    var b = $('#go');
    b.classList.toggle('on', !!(told.croz || nextFile));
    b.textContent = nextFile ? 'Into the museum' : 'Try the keypad';
    ER.pips((told.croz ? 1 : 0) + (told.memo && told.leaflet ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['The door is open. Step inside; Dr Crozier will follow with the torch.']];
    if (!told.croz) return ['croz', ['The curator is by the wicket door on the right. Hear her out: she will not move until you have understood what tonight is.']];
    if (!(told.memo && told.leaflet)) return ['read', ['She has given you two things: her own typed memo, and the museum&rsquo;s leaflet about the crown. Read both. The code is hidden in them.']];
    return ['pad', [
      'The keypad is on the wicket door. The memo says the Director always sets the code to the same number: the number of years the crown lay in the mud.',
      'The leaflet gives two years. One is when the crown was made; the other is when it was found in the mere.',
      'Take the earlier year away from the later one. The code is that difference, and nothing else on the leaflet.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The wicket door stands open. Dr Crozier is holding it for you.'); return; }
    if (told.intro) { busy = false; ER.say('The loading bay. Dr Crozier is waiting, and the keypad is still shut.'); return; }
    ER.narrate([
      'The loading bay smells of rain and cold brick. The great roller shutter is down. One bulb swings a little on its wire, and throws your shadow up the wall and down again.',
      'Dr Crozier does not say good evening. She says, &ldquo;Thank you for coming, and for not asking questions on the telephone. You may ask them now, and I shall answer the ones I can.&rdquo;',
      'Behind her, set into the wall, is a small steel door with a keypad. It is the only quiet way in.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the curator ---------- */
  $('#crozier').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Good,&rdquo; says Dr Crozier. &ldquo;Inside, and softly. We have until the small hours to be clever, and not a minute after.&rdquo;'); return; }
    ER.talk({
      who: 'Dr Adela Crozier', role: 'Curator · the Caldmere Museum', face: window.FACE('crozier'),
      lines: [
        { note: 'She keeps the torch pointed at the floor between you, so that neither face is lit.', a: '&ldquo;Adela Crozier. I have had this museum for twenty-two years. A week ago I came in and the crown was not in its case, and the glass had not been touched, and the alarm had slept all night like a baby. I have spent the week finding out how, and who, and why. Tonight I know all three, and tonight it goes back.&rdquo;' },
        { q: 'Who took it?', a: 'Somebody with a key and a reason. I will tell you the reason when you have earned it, which is to say when you have worked out the rest for yourself. It is not a thief. Nobody is going to prison. But at nine o&rsquo;clock an inspector counts every object in this building, and if the crown is not under its glass by then, a great many kind and foolish people are ruined, and the crown becomes a story in the papers instead of a thing a child can stand in front of.' },
        { q: 'Then why creep about? You are the curator.', a: 'Because the night guards are not mine. They are Dovecourt&rsquo;s, a firm, and their rules say that any case opened at night is reported by morning, with names. I can walk where I like in my own museum. I cannot open that case without it being written down. So we must be quick, and quiet, and out of the cameras, and we must put it back exactly as it was, so that the record shows a crown that never moved.</p><p class="note">She almost smiles.</p><p>You are good with your hands and you miss nothing. That is why I telephoned you, and not somebody wiser.' },
        { q: 'Where do we start?', a: 'With this door, and then the security office, which will tell us where the guards are and when. Amory walks the ground floor and comes past this bay at one o&rsquo;clock. It is twenty to. We have twenty minutes to be inside and gone from here. The code is where it always is &mdash; read my memo, and read the leaflet. I never could keep a number in my head.' }
      ],
      clue: { id: 'croz1', title: 'Dr Crozier, in the loading bay', kind: 'What she said' },
      done: function (seen) {
        if (!seen) return;
        CR.words(['curator', 'conservator', 'collection']);
        if (tell('croz')) { paint(); ER.say('&ldquo;The memo, and the leaflet,&rdquo; she says, and holds them out. &ldquo;The code is two dates and a subtraction.&rdquo;'); }
      }
    });
  });

  /* ---------- papers ---------- */
  var MEMO = '<h4>THE CALDMERE MUSEUM<small>FROM THE CURATOR</small></h4><p>Note to self, and to whoever I drag into this.</p>' +
    '<p>The wicket code is the one the Director set in 1990 and never changed, being a man who thought a code nobody could guess was a code nobody could forget. It is the number of YEARS THE CROWN LAY IN THE MERE before it was found: the later date, less the earlier one. No prefix. No nought in front.</p>' +
    '<p>It is NOT the accession number, which is one, the crown being the first thing this museum ever owned. It is NOT the gallery number. It is NOT the hour we open.</p>' +
    '<p>Read the leaflet for the two dates. Subtract. Three figures.</p><p class="sig">A. C.</p>';
  var LEAF = '<h4><small>THE CALDMERE MUSEUM &middot; GALLERY 4</small>The Caldmere Crown</h4>' +
    '<p>A circlet of silver-gilt, made for a small northern court and <b>struck in 1503</b>. For three hundred years it was thought lost.</p>' +
    '<p>In <b>1840</b> a boy cutting peat pulled it from the black mud of Caldmere, where the cold wet ground had kept it bright. It became the first object of this museum, <i>accession number 1</i>, and it has stood in Gallery 4 ever since.</p>' +
    '<p>We open to the public at <i>9 a.m.</i> Admission is free, because the crown was found by a child and belongs to the town.</p>';
  $('#rota').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MEMO, cls: 'memo', clue: { id: 'memo', title: 'Dr Crozier&rsquo;s memo', kind: 'From the curator' }, done: function () {
      CR.words(['accession', 'grant']);
      if (tell('memo')) { paint(); ER.say('A difference between two dates. Not the accession number, not the gallery, not the hour.'); }
    } });
  });
  function openLeaflet() {
    ER.read({ html: LEAF, cls: 'label', clue: { id: 'leaflet', title: 'Leaflet: the Caldmere Crown', kind: 'Museum leaflet' }, done: function () {
      CR.words(['circlet', 'silver-gilt', 'mere']);
      if (tell('leaflet')) { paint(); ER.say('Struck in 1503; found in 1840. Two dates, as she said.'); }
    } });
  }
  CR.thing('#crates', null, 'Crates stencilled CALDMERE and FRAGILE, waiting to go up to the studio. The leaflet about the crown is tucked under the top one&rsquo;s lid.', isBusy);
  $('#crates').addEventListener('click', function () { if (!busy) openLeaflet(); });

  /* ---------- the keypad ---------- */
  CR.thing('#shutter', 'roller shutter', 'The roller shutter, bolted to the floor. It makes a noise like thunder; nobody opens it at night. The small wicket door is the only quiet way in.', isBusy);
  CR.thing('#cam', null, 'A camera on the corner bracket. Its red light is dead: Dr Crozier says the bay camera has been broken since the spring, and Dovecourt have never mended it. One small mercy.', isBusy);
  CR.thing('#van', null, 'The museum&rsquo;s own van, CALDMERE down the side, cold and locked. It brought a case of Roman coins up from the county store this afternoon, and nothing else.', isBusy);

  $('#door').addEventListener('click', function () { openPad(); });
  $('#go').addEventListener('click', function () {
    if (nextFile) { ER.leave(nextFile); return; }
    openPad();
  });
  function openPad() {
    if (nextFile) { ER.leave(nextFile); return; }
    if (busy) return;
    if (!told.croz) { ER.say('Dr Crozier touches your arm. &ldquo;Hear me out first.&rdquo;'); return; }
    if (!pad) pad = makePad();
    pad.open();
  }

  function makePad() {
    var box = ER.el('div', 'bx pad'), val = '', wait = false, svg, disp, msgEl;
    var KEYS = [['7', 90], ['8', 220], ['9', 350], ['4', 90], ['5', 220], ['6', 350], ['1', 90], ['2', 220], ['3', 350], ['C', 90], ['0', 220], ['OK', 350]];
    var s = '<rect width="560" height="420" fill="#20272e"/><rect x="150" y="26" width="260" height="60" rx="6" fill="#0c130f" stroke="#2a3a2e" stroke-width="3"/>' +
      '<text x="280" y="70" id="disp" class="se" font-size="34" fill="#7bd88a" letter-spacing="10">_ _ _</text>' +
      '<text x="280" y="108" class="sj" font-size="12" letter-spacing="3" fill="#6a7682">WICKET DOOR &middot; ENTER CODE</text>';
    KEYS.forEach(function (k, i) {
      var row = Math.floor(i / 3), x = k[1], y = 150 + row * 64, cls = k[0] === 'OK' ? ' ok' : k[0] === 'C' ? ' clr' : '';
      s += '<g class="key' + cls + '" data-k="' + k[0] + '"><rect class="kc" x="' + (x - 55) + '" y="' + (y - 26) + '" width="110" height="52" rx="8"/>' +
        '<text x="' + x + '" y="' + (y + 9) + '" class="sj" font-size="' + (k[0].length > 1 ? 19 : 24) + '" fill="#eef2f6">' + k[0] + '</text></g>';
    });
    box.innerHTML = '<div class="frame"><svg viewBox="0 0 560 420">' + s + '</svg></div><div class="bx-foot"><p class="pmsg"></p></div>';
    svg = box.querySelector('svg'); disp = svg.querySelector('#disp'); msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() { var t = (val.length < 3 ? (val + '___').slice(0, 3) : val); disp.textContent = t.split('').join(' '); }
    svg.addEventListener('click', function (e) {
      if (wait) return;
      var g = e.target.closest ? e.target.closest('.key') : null; if (!g) return;
      var k = g.getAttribute('data-k');
      if (k === 'C') { val = ''; CR.sfx.keypad(); show(); msg(''); return; }
      if (k === 'OK') { submit(); return; }
      if (val.length >= 4) return;
      val += k; CR.sfx.keypad(); show();
    });
    function submit() {
      CR.sfx.beep();
      if (val === '') { msg('Nothing entered yet. Tap the figures, then OK.'); return; }
      if (val === '337') {
        wait = true; CR.sfx.latch();
        var file = ER.exit(['337'], { wait: true });
        if (!file) { msg('The lock stays shut.'); wait = false; return; }
        nextFile = file; ER.flag('b-file', file);
        msg('The bolt draws back with a soft knock. <b>1840 take away 1503 is 337.</b> The door is open.');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            'The wicket swings in on a cold draught that smells of floor-wax and old stone: the museum, asleep.',
            'Dr Crozier comes in after you and pulls the door to, but does not lock it. &ldquo;We may need to leave in a hurry,&rdquo; she says, &ldquo;and I should rather not do sums on the way out.&rdquo;',
            'Somewhere ahead a clock you cannot see ticks in the dark. It is a quarter to one.'
          ], function () { busy = false; });
        }, 2400);
        return;
      }
      ER.sfx.no();
      msg(val === '1840' ? '&ldquo;That is the year it was found,&rdquo; says Dr Crozier, &ldquo;not the years it waited. A difference, not a date.&rdquo;' :
        val === '1503' ? '&ldquo;The year it was struck. Now take it from the other one.&rdquo;' :
        val === '1' ? 'That is its place in the catalogue &mdash; number one. The code is much older than that.' :
        (val === '4' || val === '9' || val === '900' || val === '0900') ? 'That is the gallery, or the hour we open. The memo says it is neither.' :
        val === '2200' || val === '200' ? 'Two hundred years is near, but not exact. Use the dates themselves: 1840 and 1503.' :
        'The lock stays shut. &ldquo;Two dates, and a subtraction,&rdquo; says Dr Crozier. &ldquo;How long did it lie in the mud?&rdquo;');
      val = ''; show();
    }
    show(); msg('The years the crown lay in the mere. Read the leaflet and the memo again if you need them (they are in your notebook).');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
