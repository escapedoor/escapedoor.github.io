<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Conservation Studio · Before the Doors Open</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-adventure.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="crown.css">
<style>
  body{--bg:#182420;--accent:#8fd0b0;--font-display:'Limelight',serif;--font-ui:'Josefin Sans',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(14,22,20,.95);--tc-ink:#e6f2ec;--cap-bg:rgba(14,22,20,.93);--panel:#14201c;--face-bg:#20302a;--q-ink:#9fe6c8;--fade:#060c0a;--hud-bg:rgba(14,22,20,.82)}
  .drip{animation:dp 3.2s ease-in infinite}
  @keyframes dp{0%,70%{opacity:0;transform:translateY(0)}72%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
  .moon2{animation:mo 20s linear infinite alternate}
  @keyframes mo{to{transform:translateX(30px)}}
  /* the studio plan lock */
  .bx.studio{width:min(1020px,97vw)}
  .sgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px;align-items:start}
  .slip{background:#eef0ea;color:#222a3a;font-family:'Caveat',cursive;font-size:21px;line-height:1.24;padding:14px 18px;border-left:6px solid #3a5a44;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .slip h5{margin:0 0 6px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#3a5a44}
  .bx.studio .frame{background:#101c18}
  .crate{cursor:pointer}
  .crate rect.c{fill:#6a5636;stroke:#2a2014;stroke-width:3}
  .crate:hover rect.c{fill:#8a7046}
  .crate.on rect.c{fill:#2f7d5a;stroke:#9fe6c8;stroke-width:3}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="wallS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20302a"/><stop offset="1" stop-color="#101a16"/></linearGradient>
  <radialGradient id="moonS" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#cfe4f0" stop-opacity=".5"/><stop offset="1" stop-color="#cfe4f0" stop-opacity="0"/></radialGradient>
  <radialGradient id="vigS" cx="50%" cy="48%" r="78%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
</defs>
<rect x="-1000" y="-400" width="3600" height="1720" fill="url(#wallS)"/>
<rect x="-1000" y="700" width="3600" height="620" fill="#141e1a"/>
<path d="M-1000 700H2600" stroke="#2a3a32" stroke-width="4"/>
<!-- a tall window with a moon -->
<g id="window" class="hot"><rect x="1240" y="120" width="260" height="440" fill="#0a1420" stroke="#2a3a32" stroke-width="8"/><path d="M1370 120v440M1240 340h260" stroke="#2a3a32" stroke-width="6"/>
  <g class="moon2"><circle cx="1320" cy="220" r="80" fill="url(#moonS)"/><circle cx="1320" cy="220" r="30" fill="#e6eef4"/></g></g>
<!-- the kiln -->
<g id="kiln" class="hot"><rect x="120" y="360" width="200" height="300" rx="8" fill="#3a3a3e" stroke="#15181a" stroke-width="5"/><rect x="150" y="420" width="140" height="120" rx="6" fill="#1a1c1e" stroke="#0a0c0e" stroke-width="4"/><circle cx="220" cy="480" r="24" fill="#5a2a1a"/><rect x="150" y="390" width="140" height="16" fill="#c9a24a"/></g>
<!-- the north bench, along the top -->
<g id="bench" class="hot"><rect x="360" y="300" width="900" height="30" fill="#5a4630"/><rect x="380" y="330" width="30" height="120" fill="#3a2c1c"/><rect x="1200" y="330" width="30" height="120" fill="#3a2c1c"/>
  <g fill="#8a7a5a"><rect x="470" y="268" width="70" height="32" rx="3"/><rect x="620" y="276" width="56" height="24" rx="3"/></g></g>
<!-- shelving on the left, opposite the window -->
<g id="shelf" class="hot"><rect x="360" y="470" width="300" height="230" fill="#3a2c1c" stroke="#15100a" stroke-width="4"/><g stroke="#15100a" stroke-width="3"><path d="M360 540h300M360 610h300"/></g>
  <g fill="#6a5636" stroke="#2a2014" stroke-width="2"><rect x="376" y="488" width="120" height="44"/><rect x="520" y="488" width="120" height="44"/><rect x="376" y="556" width="120" height="44"/><rect x="520" y="560" width="110" height="40"/></g></g>
<!-- a trolley, with a crate -->
<g id="trolley" class="hot"><rect x="760" y="560" width="190" height="20" fill="#4a4a50"/><rect x="800" y="500" width="120" height="60" fill="#6a5636" stroke="#2a2014" stroke-width="3"/><circle cx="790" cy="596" r="20" fill="#1a1c1e"/><circle cx="920" cy="596" r="20" fill="#1a1c1e"/></g>
<!-- a sink, dripping -->
<g id="sink" class="hot"><rect x="1000" y="560" width="160" height="120" rx="6" fill="#49565e"/><rect x="1016" y="580" width="128" height="86" rx="4" fill="#2a343a"/><path d="M1080 540v24" stroke="#8a94a0" stroke-width="6"/><circle class="drip" cx="1080" cy="572" r="4" fill="#9fd0e0"/></g>
<!-- a dust-sheet over something -->
<g id="sheet" class="hot"><path d="M1230 700q20 -120 110 -120t110 120z" fill="#d8d6ca" opacity=".9"/><path d="M1250 700q14 -90 90 -92" stroke="#b8b6aa" stroke-width="2" fill="none"/></g>
<!-- the daybook, open on the bench -->
<g id="daybook" class="hot"><rect x="900" y="276" width="110" height="26" fill="#f3ead6" stroke="#2a2014" stroke-width="2"/><path d="M955 276v26" stroke="#2a2014" stroke-width="2"/><g stroke="#9a8a6a" stroke-width="1.5"><path d="M910 284h40M910 292h36M966 284h40M966 292h30"/></g></g>
<!-- the curator -->
<g id="crozier" class="hot"><ellipse cx="700" cy="868" rx="66" ry="13" fill="#000" opacity=".3"/><g id="pcroz"></g></g>
<rect x="-1000" y="-400" width="3600" height="1720" fill="url(#vigS)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">Which crate?</button>

<script src="words.js"></script>
<script src="cast.js"></script>
<script src="../../assets/engine.js"></script>
<script src="crown.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, stu = null, nextFile = null;

  $('#pcroz').innerHTML = CR.person(700, 860, 1.05, { coat: '#4a3a52', skin: '#e4c2a2', hair: '#cfcac0', hat: 'bun', specs: 1, legs: '#2e2838' });

  ER.init({
    theme: 'adventure', story: 'crown', storyTitle: 'Before the Doors Open', id: 'studio', no: 'IV', title: 'The Conservation Studio',
    go: 'Which crate?',
    intro: [
      'The three accounts came straight at last: Ebden honestly mistaken, his watch twelve minutes fast; Carmody covering for the boy; Amory telling it as it was. Nothing left the building. The crown was upstairs.',
      'The conservation studio is where the museum mends its treasures: a long north bench, a kiln still warm, a sink that drips, shelves of crates, and a tall window with the moon in it. Dominic helps here on Saturdays, and Dominic has a key.',
      'Somewhere among all these crates is the crown. Dr Crozier does not know which; but Dominic, who could never leave anything untidy, left a note to himself, and the note is a set of directions.'
    ],
    exit: {"next":"gallery","w":{"289fcd33":"67842a0a"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('s-told') || {}; nextFile = ER.flag('s-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('s-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    var b = $('#go');
    b.classList.toggle('on', !!(told.croz || nextFile));
    b.textContent = nextFile ? 'Carry it down' : 'Which crate?';
    ER.pips((told.croz ? 1 : 0) + (told.slip ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['The crown is in your hands, in its padded box. Down the service stair, the way the plan showed.']];
    if (!told.croz) return ['croz', ['Dr Crozier is by the shelves. She will tell you about Dominic and his tidy habits.']];
    if (!told.slip) return ['slip', ['Dominic&rsquo;s note is in the daybook, open on the north bench. It reads like directions. Read it into your notebook.']];
    return ['stu', [
      'Follow the note one phrase at a time: from the door, ALONG the north bench, and PAST the kiln &mdash; so not a crate before the kiln.',
      'Then &ldquo;the wall OPPOSITE the window&rdquo; &mdash; the window is on one side, so the shelves on the far side are meant, not the crate beside the window.',
      'On that shelf unit, &ldquo;the SECOND shelf up&rdquo; &mdash; not the first, not the third. And not the one under the bench, nor the one on the trolley.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The studio. The crown is in its padded box, ready to carry down.'); return; }
    if (told.intro) { busy = false; ER.say('Read Dominic&rsquo;s note in the daybook, then open the crate it points to.'); return; }
    ER.narrate([
      'Upstairs is colder, and smells of paste and warm clay. The kiln ticks as it cools. The moon lies across the floor in two long squares.',
      'Dr Crozier runs a finger along the shelves. &ldquo;He keeps a key because he mends things for me on a Saturday. He is good at it. He is better at it than he is at keeping a secret.&rdquo;',
      'On the bench, the studio daybook lies open, and in the margin of the last page is a note in a round, careful hand.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the curator ---------- */
  $('#crozier').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Hold it level,&rdquo; says Dr Crozier, &ldquo;and mind the second-to-last stair; it is loud.&rdquo;'); return; }
    ER.talk({
      who: 'Dr Adela Crozier', role: 'Curator · in the studio', face: window.FACE('crozier'),
      lines: [
        { note: 'She touches the warm side of the kiln, out of habit.', a: '&ldquo;Dominic is my grandson. Seventeen, and kinder than is good for him. He has a key to this room because he is the best pair of hands I have, and he cannot bear to see a thing broken.&rdquo;' },
        { q: 'Did he tell you he took it?', a: 'He told me nothing. He went very pale for a week and could not look at me. I found the rest out the way you have been finding it out. When you open the right crate there will be a note. Read it, and you will understand why a good boy did a foolish thing. But first find the crate, because I cannot: he hid it too well, even from me.' },
        { q: 'How do I find it?', a: 'The daybook. He writes everything down &mdash; it is the one thing I taught him that stuck. His note is directions, in his careful way. Read every word of it. &ldquo;Past&rdquo; is not &ldquo;before&rdquo;, and &ldquo;opposite&rdquo; is not &ldquo;beside&rdquo;, and &ldquo;the second shelf&rdquo; is not the first. He chose his words. So must you.' }
      ],
      clue: { id: 'croz4', title: 'Dr Crozier, on her grandson', kind: 'What she said' },
      done: function (seen) {
        if (!seen) return;
        CR.words(['conservation', 'kiln', 'bench', 'crate']);
        if (tell('croz')) { paint(); ER.say('Read Dominic&rsquo;s note in the daybook, then open the crate it points to.'); }
      }
    });
  });

  /* ---------- the note ---------- */
  var SLIP = '<h4>In the studio daybook, a note in Dominic&rsquo;s hand</h4>' +
    '<p>If anyone has to find it, I am sorry.</p>' +
    '<p>From the door, go <b>along</b> the north bench and <b>past</b> the kiln, to the shelves on the wall <b>opposite</b> the window.</p>' +
    '<p>It is in the crate on the <b>second shelf up</b>. Wrapped soft.</p>' +
    '<p><b>Not</b> the crate under the bench. <b>Not</b> the one on the trolley. The second shelf, opposite the window.</p>';
  function readSlip() {
    ER.read({ html: SLIP, cls: 'hand', clue: { id: 'slip', title: 'Dominic&rsquo;s directions', kind: 'In the daybook' }, done: function () {
      CR.words(['along', 'past', 'through', 'opposite']);
      if (tell('slip')) { paint(); ER.say('Along the bench, past the kiln, opposite the window, second shelf up.'); }
    } });
  }
  $('#daybook').addEventListener('click', function () { if (!busy) readSlip(); });

  CR.thing('#window', null, 'A tall studio window. The moon is in the bottom pane. The window is on the east wall; the shelves are on the wall opposite it.', isBusy);
  CR.thing('#kiln', 'kiln', 'The kiln, still warm, ticking as it cools. You go past it to reach the far shelves.', isBusy);
  CR.thing('#sink', null, 'A deep conservator&rsquo;s sink with a slow drip. Somebody has left a brush standing in a jar, as if they meant to come back.', isBusy);
  CR.thing('#sheet', null, 'A dust-sheet over a half-mended chair. Not crown-shaped, and not where the note points.', isBusy);
  CR.thing('#trolley', null, 'A trolley with a crate on it, in the middle of the room. The note says plainly: not the one on the trolley.', isBusy);

  $('#go').addEventListener('click', function () {
    if (nextFile) { ER.leave(nextFile); return; }
    if (busy) return;
    if (!told.slip) { ER.say('Read Dominic&rsquo;s note in the daybook first.'); return; }
    if (!stu) stu = makeStu();
    stu.open();
  });

  /* ---------- the studio plan: pick the crate ---------- */
  function makeStu() {
    var box = ER.el('div', 'bx studio'), svg, msgEl, pick = null, wait = false;
    /* the door is in the south-east corner; the north bench runs west from above it, with the kiln part way along;
       the window is in the east wall and the shelves stand against the west wall, opposite it */
    var CR8 = {
      a: [720, 150, 'north bench, at the door end'], b: [540, 150, 'north bench, before the kiln'],
      c: [300, 416, 'under the south bench'], d: [480, 300, 'on the trolley'],
      e: [120, 360, 'shelf 1 (bottom)'], g: [120, 270, 'shelf 2 (middle)'], f: [120, 180, 'shelf 3 (top)'],
      h: [796, 250, 'beside the window']
    };
    var s = '<rect width="900" height="520" fill="#101c18"/><rect x="40" y="40" width="820" height="440" fill="none" stroke="#2f5a46" stroke-width="3"/>' +
      '<text x="450" y="28" class="sz" font-size="15" letter-spacing="3" fill="#8fd0b0">THE STUDIO FROM ABOVE</text>';
    /* walls, door, window, kiln, benches, shelf unit, trolley */
    s += '<rect x="700" y="470" width="90" height="14" fill="#3a2c1c"/><text x="745" y="462" class="sj" font-size="12" fill="#8fb0a0">DOOR</text>';
    s += '<rect x="846" y="190" width="14" height="140" fill="#2a3a40"/><text x="812" y="180" class="sj" font-size="11" fill="#7fa0c0">WINDOW</text>';
    s += '<rect x="160" y="96" width="640" height="22" fill="#5a4630"/><text x="640" y="86" class="sj" font-size="11" fill="#9a8a6a">NORTH BENCH</text>';
    s += '<rect x="330" y="68" width="70" height="60" rx="5" fill="#3a3a3e" stroke="#15181a" stroke-width="3"/><text x="365" y="150" class="sj" font-size="10" fill="#b08a6a">KILN</text>';
    s += '<rect x="60" y="150" width="30" height="220" fill="#3a2c1c"/><text x="75" y="420" class="sj" font-size="10" fill="#9a8a6a" transform="rotate(-90 75 420)">SHELVES</text>';
    s += '<rect x="200" y="436" width="220" height="16" fill="#5a4630"/><text x="310" y="470" class="sj" font-size="10" fill="#9a8a6a">SOUTH BENCH</text>';
    s += '<rect x="420" y="320" width="120" height="12" fill="#4a4a50"/>';
    /* the crates */
    Object.keys(CR8).forEach(function (k) {
      var p = CR8[k];
      s += '<g class="crate" data-c="' + k + '"><rect class="c" x="' + (p[0] - 26) + '" y="' + (p[1] - 20) + '" width="52" height="40" rx="3"/>' +
        '<text x="' + p[0] + '" y="' + (p[1] + 7) + '" class="sj" font-size="17" fill="#f3ead6">' + k.toUpperCase() + '</text></g>';
    });
    s += '<text x="450" y="508" class="sc" font-size="18" fill="#8fd0b0">Click the crate the note points to.</text>';
    box.innerHTML = '<div class="sgrid"><div class="slip"><h5>Dominic&rsquo;s note</h5>From the door, <b>along</b> the north bench and <b>past</b> the kiln, to the shelves <b>opposite</b> the window. The crate on the <b>second shelf up</b>. Not under the bench; not on the trolley.</div>' +
      '<div class="frame"><svg viewBox="0 0 900 520">' + s + '</svg></div></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="open">Open this crate</button></div>';
    svg = box.querySelector('svg'); msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    svg.addEventListener('click', function (e) {
      if (wait) return; var n = e.target.closest ? e.target.closest('.crate') : null; if (!n) return;
      pick = n.getAttribute('data-c'); CR.tick();
      ER.$$('.crate', svg).forEach(function (o) { o.classList.toggle('on', o === n); });
      msg('Crate <b>' + pick.toUpperCase() + '</b>: ' + CR8[pick][2] + '.');
    });
    box.querySelector('#open').addEventListener('click', function () {
      if (wait) return;
      if (!pick) { ER.sfx.no(); msg('Choose a crate first.'); return; }
      if (pick !== 'g') {
        ER.sfx.no();
        msg(pick === 'a' || pick === 'b' ? 'That crate is <b>before</b> the kiln. The note says <b>past</b> it.' :
          pick === 'c' ? 'That is the crate <b>under the bench</b>. The note says not that one.' :
          pick === 'd' ? 'That is the crate <b>on the trolley</b>. The note says not that one.' :
          pick === 'h' ? 'That is <b>beside</b> the window. The note says the shelves <b>opposite</b> it.' :
          pick === 'e' ? 'That is the <b>first</b> shelf. The note says the <b>second</b> shelf up.' :
          'That is the <b>third</b> shelf. The note says the <b>second</b> shelf up.');
        return;
      }
      wait = true; CR.sfx.latch();
      var file = ER.exit(['g'], { wait: true });
      if (!file) { msg('The crate will not open.'); wait = false; return; }
      nextFile = file; ER.flag('s-file', file);
      msg('The lid lifts. Inside, wrapped soft in a conservator&rsquo;s cloth, is the Caldmere Crown &mdash; and a folded note.');
      setTimeout(function () {
        ER.closeAll();
        ER.read({ html: NOTE, cls: 'hand', clue: { id: 'dnote', title: 'Dominic&rsquo;s note, in the crate', kind: 'Why he did it' }, done: function () {
          CR.words(['grant', 'trustee', 'make a scene']);
          busy = true; paint();
          ER.narrate([
            'You lift the crown out. It is lighter than it looks, and warmer, having sat a week by the kiln. The silver-gilt catches the moon.',
            'Dr Crozier reads the note twice, the way she read the label in the loading bay. Her face does not change, but she has to take her glasses off.',
            '&ldquo;He heard the trustees talk of selling it,&rdquo; she says, &ldquo;to mend the roof, and he could not bear it, so he hid the thing he loved to keep it safe. He did not know the grant came through the next morning. There is nothing to be saved from any more. Now we put it where it belongs, before anyone has to know a boy was ever frightened. Carry it down.&rdquo;'
          ], function () { busy = false; ER.flag('s-have', 1); });
        } });
      }, 1800);
    });
    msg('Read the note one phrase at a time. Along; past; opposite; the second shelf up.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  var NOTE = '<h4>The note folded in the crate</h4>' +
    '<p>I heard Mr Belding and the trustees say they would sell the crown to a man called Ellory, to pay for the roof, and that the town would never know until it was gone.</p>' +
    '<p>I could not make a scene. I am seventeen and nobody listens. So I took it and hid it, to stop the sale, and I meant to say where it was once it was too late to sell.</p>' +
    '<p>It belongs to everybody who found it &mdash; to the boy in the mere, nearly two hundred years ago. Please put it back. I am sorry, Gran.</p>';
})();
</script>
</body>
</html>
