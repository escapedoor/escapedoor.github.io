  #scene.open #safedoor{transform:scaleX(-.25)}
  #inside{display:none}
  #scene.open #inside{display:block}

  /* page 9 on the left, the baptisms on the right */
  .bp{width:min(1210px,96vw);display:flex;gap:12px;align-items:flex-start}
  .bp-page{flex:0 0 640px;background:#efe6cf;color:#2a2218;padding:8px 10px 6px;border:1px solid #9c8a64}
  .bp-page h6{margin:0 0 4px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.08em;display:flex;justify-content:space-between}
  .bp-page h6 span{font-family:'EB Garamond',serif;font-weight:normal;font-size:12.5px}
  .ln{display:grid;grid-template-columns:134px 196px 1fr;align-items:center;gap:6px;min-height:31px;border-bottom:1px solid rgba(122,106,76,.35)}
  .ln.end2{border-bottom:2px solid #7a6a4c}
  .ln .nm{font-family:'Homemade Apple',cursive;font-size:11.5px;color:#22305a;white-space:nowrap}
  .ln .rl{font-family:'Homemade Apple',cursive;font-size:10.5px;color:#22305a;white-space:nowrap;overflow:hidden}
  .ln .slot{min-height:27px;border:1.5px dashed #a8967a;border-radius:3px;background:rgba(255,255,255,.35)}
  .bp-book{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
  .stack,.tray{background:#f1e8d2;border:1px solid #9c8a64;padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
  .stack{min-height:250px}
  .tray{min-height:74px;background:#2a3a2e;border-color:#5a6a5e}
  .stack h6,.tray h6{flex:0 0 100%;margin:0 0 2px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5a4a2a}
  .tray h6{color:#cfe0c8}
  .slip{display:inline-block;padding:4px 8px 3px;background:#fbf6e6;color:#2c2440;font-family:'Outfit',sans-serif;font-size:12px;line-height:1.25;border:1px solid #b8a882;border-left:4px solid #6a5a8a;
    box-shadow:0 2px 4px rgba(0,0,0,.25);white-space:nowrap;cursor:grab}
  .slip b{font-weight:600}
  .slip.held{outline:3px solid #2f7a4a}
  .ln .slot .slip{display:block;box-shadow:none;margin:1px}
  .bp .pmsg{color:#f3ecd9;font-size:17px;min-height:70px}
</style>

      'Start with the children. Each baptism gives the parents&rsquo; names, and an age on census night gives the year of birth: nine in April 1881 means born in 1871 or 1872.',
      'Read the Where Born column on page 9. Somebody born at Ulgarth was baptised at Ulgarth, not here: leave the line empty. Mrs Varey was born about 1820, before this book begins in 1836: leave her line empty too.',
      'Two Thomases, two Samuels and two Tabithas. Tabitha Wray, the wife, was born a Thackray: the marriage register shows her wedding in 1867. Three baptisms belong to nobody on page 9: put them on the tray at the bottom.'
    ]];
    if (!told.card || !told.marr) return ['read', [
      'Read the card taped inside the safe door: it says what each register records, and what it does not.',
      'The thin red book on the table, on the left, is the marriage register. A woman&rsquo;s name before her wedding is in it.'
    ]];
    return ['open', ['Click the big book of baptisms on the table to open it beside page 9.']];
  }

  function begin() {
    $('#stella').innerHTML = CS.stella({});
    CS.clicker(told.tick ? 14 : 13);
    if (told.open) $('#scene').classList.add('open');
    paint();
    if (nextFile) { busy = false; ER.say('The vestry. Three baptisms on the tray: a girl, a baby boy, and a baby girl.'); return; }
    if (told.open) { busy = false; ER.say('The vestry. The safe is open, and the book of baptisms is on the table.'); return; }
    ER.narrate([
      'Cassocks on pegs, a kettle, a list of vicars in gold paint, and a green iron safe as tall as you are. Miss Tunstall turns the key and swings the door open.'
    ], function () {
      CS.sfx.key(); CS.sfx.door(); $('#scene').classList.add('open');
      setTimeout(function () {
        CS.clicker(14, true); tell('tick');
        ER.narrate([
          'She takes out the book of baptisms and stops. It is lying open. &ldquo;I locked this shut on Saturday,&rdquo; she says, &ldquo;and nobody else has the key.&rdquo; It is open at December 1868.',
          'In her pocket the tally counter gives a small click, all by itself. Miss Tunstall takes it out and looks at it. Fourteen.',
          '&ldquo;Cheap counter,&rdquo; she says, and puts it back. &ldquo;Now. Page 9.&rdquo;'
        ], function () { tell('open'); busy = false; paint(); });
      }, 1100);
    });
  }

  function talkStella() {
    ER.talk({
      who: 'Miss Stella Tunstall', role: 'Churchwarden', face: window.FACE('stella'),
      lines: [
        { a: '&ldquo;Everybody on page 9 who was born in this parish was baptised in this church, and the baptism is in that book. Every baptism of a Thackray or a Wray is in it, from 1836.&rdquo;' },
        { a: '&ldquo;So put each baptism with its person on page 9. Where somebody was born somewhere else, their line stays empty. And if a baptism belongs to nobody on the page, it goes on the tray.&rdquo;' },
        { q: 'And then?', a: '&ldquo;Then whatever is left on the tray is a Thackray or a Wray who was born here and is not on page 9. Some of them will be dead before 1881, and some will be away. And one of them, perhaps, is our missing woman.&rdquo;' },
        { a: '&ldquo;Careful with the names. These families used the same five names over and over, as if they cost money. Read the card in the safe door, and look at the marriages first.&rdquo;' }
      ],
      clue: { id: 'stella2', title: 'Miss Tunstall: a beginning for every name', kind: 'What she said' },
      done: function (seen) { if (!seen) return; tell('stella'); paint(); }
    });
  }
  function openLock() { if (!lock) lock = makeLock(); lock.open(); paint(); }
  $('#stella').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Out to the churchyard,&rdquo; says Miss Tunstall. &ldquo;I want to see Tabitha&rsquo;s stone. And my great-grandmother&rsquo;s.&rdquo;'); return; }
    if (!told.stella) talkStella(); else openLock();
  });
  $('#safe').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'card', clue: { id: 'regcard', title: 'The registers: notes for visitors', kind: 'From the vestry' }, done: function () { tell('card'); CS.terms(['baptism', 'burial', 'of full age', 'minor', 'spinster', 'bachelor', 'of this parish', 'margin']); paint(); } });
  });
  $('#marr').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MARR, cls: 'reg', clue: { id: 'marr', title: 'The marriage register: 1862 and 1867', kind: 'From the vestry' }, done: function () {
      tell('marr'); CS.terms(['his mark', 'vicar']); paint();
      ER.say('&ldquo;Thomas Thackray made his mark,&rdquo; says Miss Tunstall. &ldquo;Twice. He never learnt to write his name.&rdquo;');
    } });
  });
  $('#book').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.read({ html: bapPage(), cls: 'reg', clue: { id: 'bap', title: 'The baptisms of the Thackrays and the Wrays', kind: 'From the vestry' } }); return; }
    if (!told.stella) { ER.say('The book of baptisms, open at December 1868. &ldquo;Wait,&rdquo; says Miss Tunstall. &ldquo;Let me tell you what we are looking for.&rdquo;'); return; }
    openLock();
  });
  CS.thing('#vicars', 'vicar', 'The vicars of Sattersby in gold paint, from 1715. Silvanus Yorke, 1831. Stephen Vavasour, 1866. The last line says &ldquo;1994 (with four parishes)&rdquo;, as if the vicar were a bus.', isBusy);
  CS.thing('#cass', 'cassock', 'Cassocks for the choir: red ones for the singers, a black one for whoever reads the lesson. The black one has a mint in the pocket from about 1990.', isBusy);
  CS.thing('#kettle', null, 'The kettle, and its notice: PLEASE DO NOT BOIL THE KETTLE DURING THE SERMON.', isBusy);
  CS.thing('#win', null, 'A narrow window, black now. Through it, the churchyard, and the dark shapes of the stones.', isBusy);
  CS.thing('#door', null, 'The door to the chancel. Beyond it the church is dark and smells of cold stone and furniture polish.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- page 9 and the book of baptisms ---------- */
  function makeLock() {
    var placed = ER.flag('v-placed') || {}, wait = false, LINES = CS.PAGES[9].rows;
    var box = ER.el('div', 'bp'), page = ER.el('div', 'bp-page'), book = ER.el('div', 'bp-book');
    var s = '<h6>Page 9 &middot; Church Lane <span>a slip on every line that has a baptism here</span></h6>';
    LINES.forEach(function (r, k) {
      s += '<div class="ln' + (r.e === 2 ? ' end2' : '') + '" data-l="' + (k + 1) + '"><span class="nm">' + r.n + '</span><span class="rl">' + r.r + ' &middot; ' + (r.m || r.f) + ' &middot; ' + r.b + '</span><div class="slot" data-l="' + (k + 1) + '"></div></div>';
    });
    page.innerHTML = s;
    book.innerHTML = '<div class="stack"><h6>The book of baptisms, 1836 onwards</h6></div><div class="tray" data-l="tray"><h6>No line on page 9</h6></div>' +
      '<div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="v-go">Show Miss Tunstall</button></div>';
    box.appendChild(page); box.appendChild(book);
    var stack = book.querySelector('.stack'), tray = book.querySelector('.tray');
    BAP.forEach(function (b) {
      var el = ER.el('span', 'slip dnd-item', '<b>' + b[2] + '</b> &middot; ' + b[3] + ' &middot; ' + b[4].replace('William', 'Wm.').replace('Thomas', 'Thos.').replace('Samuel', 'Saml.') + ' ' + b[5] + (b[9] ? ' <i>(' + b[9] + ')</i>' : ''));
      el.setAttribute('data-s', b[0]); el.title = 'No. ' + b[1] + ', ' + b[6] + ', ' + b[7];
      var where = placed[b[0]];
      (where ? (where === 'tray' ? tray : page.querySelector('.slot[data-l="' + where + '"]')) : stack).appendChild(el);
    });
    function msg(t) { book.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function read() {
      placed = {};
      ER.$$('.slip', box).forEach(function (el) { var sl = el.parentNode; if (sl === tray || sl.classList.contains('slot')) placed[el.getAttribute('data-s')] = sl.getAttribute('data-l'); });
      ER.flag('v-placed', placed);
      box.setAttribute('data-placed', line().join('-'));
    }
    function line() {
      var out = [], i, sl, el;
      for (i = 1; i <= LINES.length; i++) { sl = page.querySelector('.slot[data-l="' + i + '"]'); el = sl.querySelector('.slip'); out.push(el ? el.getAttribute('data-s') : 'x'); }
      return out;
    }
    /* a line on page 9 takes one slip (the one already there goes to the tray); the tray takes any number.
       The slips start in the book, and do not go back into it. */
    ER.dnd(box, { item: '.slip', slot: '.ln .slot', home: tray, lock: function () { return wait || !!nextFile; }, change: function () { read(); CS.sfx.slip(); msg(''); } });
    var WHY = {
      1: 'Samuel Wray, the head, was born at Ulgarth: his baptism is in Ulgarth&rsquo;s book, not this one.',
      2: 'Tabitha Wray, the wife, thirty-four: born about 1846. What was her surname before she married? The marriage register will tell you.',
      3: 'Timothy, the Wrays&rsquo; son, twelve: born in 1868 or 1869.',
      4: 'Sarah, the Wrays&rsquo; daughter, nine: born in 1871 or 1872. Whose daughter?',
      5: 'Sydney, the Wrays&rsquo; son, five: born in 1875 or 1876.',
      6: 'Mrs Varey was sixty-one, so born about 1820: before the first page of this book. Her baptism is in the older book, at the record office.',
      7: 'Thomas Thackray, the head, says forty-three: born about 1837. A census age is what a person said, and it can be a year or two out. There are two Thomas Thackrays in the book, a generation apart.',
      8: 'Sarah Thackray, the wife, was born at Ulgarth.',
      9: 'William, the Thackrays&rsquo; son, seventeen: born in 1863 or 1864.',
      10: 'The younger Thomas, nine: born in 1871 or 1872. Whose son?',
      11: 'Sybil Thackray, six: born in 1874 or 1875.',
      12: 'Samuel Thackray, three, the son of Thomas and Sarah. There is another Samuel in the book: whose son was he?',
      13: 'Susan, three months on census night: born in December 1880 or January 1881.',
      14: 'William Swales, the grandfather, was born at Ulgarth.',
      15: 'The grandson William Swales: &ldquo;do. do.&rdquo; under &ldquo;Yorkshire Ulgarth&rdquo; means he was born at Ulgarth too.'
    };
    book.querySelector('#v-go').addEventListener('click', function () {
      var left = stack.querySelectorAll('.slip').length, got = line(), i, file;
      if (wait || nextFile) return;
      read();
      if (left) { msg('&ldquo;' + (left === 1 ? 'One baptism is' : left + ' baptisms are') + ' still in the book,&rdquo; says Miss Tunstall. &ldquo;Every one goes somewhere: on a line, or on the tray.&rdquo;'); return; }
      for (i = 1; i <= LINES.length; i++) {
        if (!ER.check('l' + i, got[i - 1])) {
          ER.sfx.no(); CS.flash(page.querySelector('.ln[data-l="' + i + '"]'));
          msg('Miss Tunstall puts her finger on one line. &ldquo;' + WHY[i] + '&rdquo;'); return;
        }
      }
      file = ER.exit([got.join('-')], { wait: true });
      if (!file) { msg('Something is wrong with this page. Tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('v-file', file);
      msg('Every person on page 9 who was born here has a baptism. Three baptisms are left on the tray.');
      CS.mine('left', 'Page 9: three baptisms with no line', '<p>Every person on page 9 born in Sattersby has a baptism. Samuel Wray, Sarah Thackray and the two William Swaleses were born at Ulgarth; Mrs Varey before 1836.</p>' +
        '<p>Tabitha Wray, the wife, is the Tabitha Thackray baptised in 1846: she married Samuel Wray in 1867. Thomas the head is the Thomas of 1836 (his census age, 43, is a year out).</p>' +
        '<p><b>On the tray:</b> Tabitha Thackray, baptised 13 December 1868, daughter of Thomas and Sarah; Samuel Wray, baptised 4 May 1873; Violet Wray, baptised 24 April 1881.</p>' +
        '<p>The burials: Samuel, buried 1 August 1873, aged 3 months: dead long before census night. <b>Tabitha Thackray, buried 23 April 1881, aged 12: alive on census night, and not on page 9.</b> Violet: baptised three weeks after census night. Born when?</p>');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'Three slips on the tray. Miss Tunstall takes the book of burials out of the safe and turns the pages back, a finger on each name.',
          '&ldquo;Samuel Wray, the baby. Buried the first of August 1873, aged three months. Dead eight years before the census. He is rightly not there.&rdquo;',
          '&ldquo;Tabitha Thackray. Baptised December 1868; buried&hellip;&rdquo; She finds it. &ldquo;Buried the twenty-third of April 1881. Aged twelve. Three weeks after census night.&rdquo; She is quiet for a moment. &ldquo;So on census night she was alive, and twelve, and nowhere on page 9.&rdquo;',
          '&ldquo;And Violet.&rdquo; Her voice changes. &ldquo;Violet Wray. That&rsquo;s my great-grandmother. She lived to ninety-seven, and every birthday she told me the same thing: <i>I was born on census night, and the census missed me.</i>&rdquo;',
          'She holds the book under the light and reads the vicar&rsquo;s note in the margin. &ldquo;<i>Born April</i>&hellip; first. The first of April. Before census night. Then she should be on page 9 too, and she isn&rsquo;t.&rdquo;',
          '&ldquo;Two of them,&rdquo; she says. &ldquo;A girl of twelve and a new baby, and only one missing woman. I know which I&rsquo;d put my money on. But I would, wouldn&rsquo;t I? Let&rsquo;s see their stones.&rdquo;'
        ], function () {
          busy = false; ER.addClue('bur1', 'Burials, 1870 to 1881', BUR, 'reg', 'From the vestry'); CS.terms(['legend']); paint();
          CS.mine('violet', 'Violet Wray: the family story', '<p>Miss Tunstall&rsquo;s great-grandmother, Violet Wray, always said: &ldquo;I was born on census night, and the census missed me.&rdquo;</p><p>The vicar&rsquo;s note in the margin of her baptism: <i>born April</i> ' + CS.glyph('4f') + '<i>th</i>. Miss Tunstall reads it as the first of April. If she was born before midnight on 3 April, she should have been written in.</p>', true);
        });
      }, 2400);
    });
    read();
    msg(Object.keys(placed).length ? 'Page 9 and the baptisms, as far as you have got.' : 'Drag each baptism to the person on page 9 it belongs to, or click it and then the line. A baptism that belongs to nobody on the page goes on the tray.');
    return { open: function () { ER.open('ov-lock', box, function () { ER.addClue('bap', 'The baptisms of the Thackrays and the Wrays', bapPage(), 'reg', 'From the vestry'); paint(); }); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
