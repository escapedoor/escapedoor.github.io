(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null;

  var CARD = '<h4>Inside the cupboard door</h4>' +
    '<p><b>The log book.</b> By the Code of the Education Department, the head teacher had to write in the log book at least once a week: the shortest entry that would record the ordinary progress of the school, or any other fact about the school or its teachers worth remembering later. And: <i>no reflections or opinions of a general character are to be entered in the log book.</i></p>' +
    '<p>So a log book says what happened, and only that. Whatever a head teacher felt, he wrote somewhere else.</p>' +
    '<p><b>The registers.</b> Each class had its own. A child went on the roll on the day of admission, and was struck off, with a line through the name and the date, on the day of leaving. Every morning each name on the roll was marked: a stroke | for present, a nought o for absent. A child who was not on the roll had no line to be marked on.</p>' +
    '<p class="sm"><i>S. Tunstall: a teacher in this room 1977&ndash;1984, head teacher of the new school 1989&ndash;2015. I kept a log book too. On a computer, which is worse.</i></p>';
  var DAYS = [['28', 'Mon', 'Mar'], ['29', 'Tue', 'Mar'], ['30', 'Wed', 'Mar'], ['31', 'Thu', 'Mar'], ['1', 'Fri', 'Apr'], ['4', 'Mon', 'Apr'], ['5', 'Tue', 'Apr'], ['6', 'Wed', 'Apr'], ['7', 'Thu', 'Apr'], ['8', 'Fri', 'Apr']];
  /* the Upper Standards (IV to VI) on the roll, and their marks for the ten mornings: | present, o absent */
  var ROLL = [
    ['Thomas Spence', '||o|||||||'], ['Victoria Spence', '||||||||oo'], ['Zachary Tasker', '||||||||||'], ['Stephen Ulyett', '||||||||||'],
    ['Wilhelmina Ulyett', '|o||||||||'], ['William Swales', '||||||||||'], ['Timothy Wray', '|||||o||||'], ['Tabitha Thackray', '', 'left 18th Mar.']
  ];
  var LOG = '<h4>Sattersby School &middot; Log Book</h4>' +

    '<p><span class="d">Mar. 25th</span>Lady Day. Ordinary progress. Copybooks examined.</p>' +
    '<p class="sel"><span class="d">Mar. 28th</span>The Master absent this fortnight upon the Census, by leave of the Managers. School taken by Mrs Tasker. Upper Standards present 7.</p>' +
    '<p class="sel"><span class="d">Mar. 29th</span>The Vicar&rsquo;s niece, from York, sat with the Upper Standards this morning. Present 7.</p>' +
    '<p class="sel"><span class="d">Mar. 30th</span>Upper Standards present 6.</p>' +
    '<p class="sel"><span class="d">Mar. 31st</span>Upper Standards present 8.</p>' +
    '<p class="sel"><span class="d">Apr. 1st</span>Upper Standards present 8. Needlework.</p>' +
    '<p class="sel"><span class="d">Apr. 4th</span>Timothy Wray absent: a sister born in the night. Upper Standards present 7.</p>' +
    '<p class="sel"><span class="d">Apr. 5th</span>Upper Standards present 8.</p>' +
    '<p class="sel"><span class="d">Apr. 6th</span>A wet day. Upper Standards present 7.</p>' +
    '<p class="sel"><span class="d">Apr. 7th</span>Upper Standards present 7.</p>' +
    '<p class="sel"><span class="d">Apr. 8th</span>Upper Standards present 7.</p>' +
    '<p><span class="d">Apr. 11th</span>Resumed charge of the school. S. Tasker.</p>' +
    '<p><span class="d">Apr. 14th</span>Broke up for the Easter holiday.</p>' +
    '<p><span class="d">Apr. 25th</span>The school closed for three weeks by order of the Medical Officer. Notice pasted below.</p>';
  var NOTICE = '<h4>Pasted into the log book</h4><p><b>NOTICE.</b> Scarlet fever being present in the village of Sattersby, <b>the said School</b> is to be closed for three weeks from Monday the 25th <b>inst.</b>, by order of the Medical Officer of Health.</p><p>Dated the 22nd day of April, 1881.</p>' +
    '<p class="sm"><i>&ldquo;The said School&rdquo;: the school just named. &ldquo;Inst.&rdquo;: of this month. Official English of the time. &mdash; S.T.</i></p>';

  ER.init({
    theme: 'ghost', story: 'census', storyTitle: 'Not a Soul Missed', id: 'schoolroom', no: 'IV', title: 'The Schoolroom',
    go: 'Put the lights on',
    intro: [
      'Every name on the stones went with its funeral in the burial books, and nine of the ten agreed. The tenth did not: the stone says Tabitha Thackray died on March 19th 1881, but the vicar buried her on April 23rd. The stone was put up after her father died in 1902, twenty-one years later; the book was written that week. The book is right. Tabitha was alive on census night.',

    ER.talk({
      who: 'Miss Stella Tunstall', role: 'Head teacher of Sattersby School, 1989 to 2015', face: window.FACE('stella'),
      lines: [
        { a: '&ldquo;If Tabitha went into service, Mr Tasker wrote down the day she left, in the log book. He wrote down everything that happened in this room for thirty-one years, and nothing that he felt about it. That was the rule.&rdquo;' },
        { a: '&ldquo;If she went to a place at Ulgarth before census night, then Ulgarth counted her, and she is on some other page, and she is not our woman. And then it is Great-gran, and the family story is true, and I shall never hear the end of it from my cousins.&rdquo;' },

  function openLock() { if (!lock) lock = makeLock(); lock.open(); }
  $('#stella').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;His diary,&rdquo; says Miss Tunstall. &ldquo;I bought it at the school sale in 1984, with the honours board and a box of chalk. I always thought it was the dullest book in Yorkshire.&rdquo;'); return; }
    if (!told.stella) talkStella(); else if (!told.card) $('#cupboard').dispatchEvent(new MouseEvent('click')); else openLock();
  });
  $('#cupboard').addEventListener('click', function () {
    if (busy) return;
    if (!told.stella) { ER.say('The school cupboard, locked. Miss Tunstall has the key on a ring with about forty others.'); return; }
    if (!told.card) { ER.read({ html: CARD, cls: 'card', clue: { id: 'logcard', title: 'The log book and the registers', kind: 'From the schoolroom' }, done: function () { tell('card'); CS.terms(['log book', 'roll', 'struck off', 'attendance', 'Standard']); paint(); } }); return; }
    openLock();
  });
  $('#honours').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'honours board');
    ER.say('NEVER ABSENT, NEVER LATE. For 1880, two names: Tabitha Thackray and Timothy Wray. For 1881, a dash: nobody.');
    if (!told.hon) { tell('hon'); CS.mine('honours', 'The honours board', '<p>Sattersby School: NEVER ABSENT, NEVER LATE. 1880: <b>Tabitha Thackray</b> and Timothy Wray. 1881: nobody.</p>', true); }
  });
  CS.thing('#stove', null, 'The stove: cold, black, and as big as a pony. In winter the children nearest it roasted and the ones at the back wore their coats.', isBusy);
  CS.thing('#map', null, 'A map of the North Riding of Yorkshire, brown with age. Sattersby is a pencil dot at the head of a dale. Ulgarth is another, five miles over the moor.', isBusy);
  CS.thing('#urn', null, 'The tea urn of the village hall, and a notice from the W.I.: CHAIR YOGA, TUESDAYS, 7 PM. BRING A CHAIR. (CHAIRS PROVIDED.)', isBusy);
  CS.thing('#chairs', null, 'Stacked blue plastic chairs. The village hall has more chairs than the village has people.', isBusy);
  CS.thing('#mdesk', null, 'The master&rsquo;s desk, high on its step, where he could see every child in the room. Miss Tunstall taught from it for seven years. He taught from it for thirty-one.', isBusy);
  CS.thing('#wins', null, 'Rain on the tall windows. They were made high so that the children could not look out of them.', isBusy);
  CS.thing('#lid', null, 'The desk in the back row. Its lid is down, and it stays down now.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the log and the register: the mornings with one child too many ---------- */
  function makeLock() {
    var marked = ER.flag('s-days') || {}, wait = false;
    var box = ER.el('div', 'sr'), side = ER.el('div', 'sr-side');
    var log = ER.el('div', 'doc log', ER.gloss(LOG));
    var s = '<div class="reg"><h6>Upper Standards (IV to VI) &middot; Register <span>March 28th to April 8th, 1881</span></h6><table><tr><th class="nm">Name</th>';
    DAYS.forEach(function (d) { s += '<th><button type="button" data-d="' + d[0] + '">' + d[1] + '<br>' + d[0] + '</button></th>'; });
    s += '</tr>';
    ROLL.forEach(function (r) {
      s += '<tr' + (r[2] ? ' class="off"' : '') + '><td class="nm">' + r[0] + (r[2] ? '<i>' + r[2] + '</i>' : '') + '</td>';
      DAYS.forEach(function (d, k) { s += '<td>' + (r[1] ? (r[1].charAt(k) === 'o' ? 'o' : '|') : '') + '</td>'; });
      s += '</tr>';
    });
    s += '</table><p class="key">| present &middot; o absent. Click the day at the top of a column to mark a morning when somebody was in the room who was not on the roll.</p>' +
      '<p class="pencil">T.T. &mdash; told S. 10th &mdash; S.T.</p></div>' +
      '<div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="s-go">Show Miss Tunstall</button></div>';
    side.innerHTML = s;
    box.appendChild(log); box.appendChild(side);
    function msg(t) { side.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function paintDays() {
      ER.$$('.reg th button', side).forEach(function (b) { b.classList.toggle('on', !!marked[b.getAttribute('data-d')]); });
      box.setAttribute('data-days', chosen().join('-'));
    }
    function chosen() { return DAYS.filter(function (d) { return marked[d[0]]; }).map(function (d) { return d[0]; }); }
    ER.$$('.reg th button', side).forEach(function (b) {
      b.addEventListener('click', function () {
        if (wait || nextFile) return;
        var d = b.getAttribute('data-d'); if (marked[d]) delete marked[d]; else marked[d] = 1;
        ER.flag('s-days', marked); CS.sfx.chalk(); paintDays(); msg('');
      });
    });
    var WHY = {
      '28': 'Monday the 28th: seven on the roll and no noughts, and seven in the log. They agree.',
      '29': 'Tuesday the 29th: the log has one more than the register, yes. Read the log for that morning: who sat with the Upper Standards?',
      '30': 'Wednesday the 30th: one nought on the register, so six present. The log says six. They agree.',
      '31': 'Thursday the 31st: count the strokes on the register, and read the log for that morning.',
      '1': 'Friday the 1st: count the strokes on the register, and read the log for that morning.',
      '4': 'Monday the 4th: Timothy Wray was absent. How many strokes does that leave on the register, and what does the log say?',
      '5': 'Tuesday the 5th: count the strokes on the register, and read the log for that morning.',
      '6': 'Wednesday the 6th: count the strokes again. The log says seven.',
      '7': 'Thursday the 7th: Victoria Spence was absent. How many strokes, and what does the log say?',
      '8': 'Friday the 8th: Victoria Spence was absent again. How many strokes, and what does the log say?'
    };
    side.querySelector('#s-go').addEventListener('click', function () {
      var i, d, file, ch = chosen();
      if (wait || nextFile) return;
      if (!ch.length) { msg('&ldquo;No mornings marked,&rdquo; says Miss Tunstall. &ldquo;Count each day: the strokes on the register, and the number in the log.&rdquo;'); return; }
      for (i = 0; i < DAYS.length; i++) {
        d = DAYS[i][0];
        if (!!marked[d] !== ER.check('day', d)) { ER.sfx.no(); CS.flash(side.querySelector('.reg th button[data-d="' + d + '"]')); msg('Miss Tunstall puts her finger on one column. &ldquo;' + WHY[d] + '&rdquo;'); return; }
      }
      file = ER.exit([ch.join('-')], { wait: true });
      if (!file) { msg('Something is wrong with this page. Tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('s-file', file);
      msg('Six mornings with one child more in the room than on the roll: <b>Thursday 31 March, Friday 1 April, Monday 4 April, Tuesday 5, Thursday 7 and Friday 8</b>. Not the 29th: that was the Vicar&rsquo;s niece.');
      CS.mine('school', 'The school: one child too many', '<p>Mrs Tasker kept the school while her husband was out counting. Her log gives the Upper Standards in the room each morning; the register has a mark for each child on the roll.</p>' +
        '<p>On <b>Thursday 31 March, Friday 1 April, Monday 4 April, Tuesday 5, Thursday 7 and Friday 8 April</b> the log has one more child than the register. (On the 29th the extra one was the Vicar&rsquo;s niece; on the wet 6th, nobody extra.)</p>' +
        '<p>Tabitha Thackray was struck off the roll on 18 March, &ldquo;to go to service at Ulgarth Farm from Lady Day&rdquo;. The pencil note at the foot: <i>T.T. &mdash; told S. 10th &mdash; S.T.</i> (Selina Tasker.)</p>' +
        '<p>So a child not on the roll was in this room on <b>Friday 1 April and Monday 4 April</b>, either side of census night. Tabitha had not gone to Ulgarth. She slept in Sattersby on Sunday 3 April.</p>');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'Miss Tunstall reads the pencil note at the foot of the register twice. <i>T.T. &mdash; told S. 10th &mdash; S.T.</i>',
          '&ldquo;T.T. Tabitha Thackray. Struck off on the eighteenth, gone to her place at Ulgarth. And here she is, back in this room on the thirty-first, and on Friday the first, and on Monday the fourth, and all that week but the wet Wednesday. Not on the roll, so nobody marked her. But Selina counted her, because Selina counted heads.&rdquo;',
          '&ldquo;Friday before census night, and Monday after. Ulgarth is five miles over the moor. She was not at Ulgarth on Sunday night. She was in her own bed on Church Lane, and her name is not on page 9.&rdquo;',
          '&ldquo;S.T. is Selina Tasker. The same initials as mine: I used to think that was a sign. <i>Told S. 10th.</i> Selina told her husband something on the tenth of April, the day after he took his book to the Registrar.&rdquo;',
          '&ldquo;He kept a diary. It is on my kitchen table. Come next door.&rdquo;'
        ], function () { busy = false; ER.addClue('notice', 'The Medical Officer&rsquo;s notice, April 1881', NOTICE, 'card', 'From the schoolroom'); CS.terms(['the said', 'inst.', 'Medical Officer', 'scarlet fever']); paint(); });
      }, 2600);
    });
    paintDays();
    msg(chosen().length ? 'The mornings you have marked so far.' : 'For each morning, compare the number in the log with the strokes on the register. Mark the mornings when somebody was in the room who was not on the roll.');
    return { open: function () { ER.open('ov-lock', box, function () { ER.addClue('log', 'The log book, March and April 1881', LOG, 'log', 'From the schoolroom'); ER.addClue('reg', 'The register of the Upper Standards', side.querySelector('.reg').outerHTML, 'card', 'From the schoolroom'); paint(); }); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>

</html>
