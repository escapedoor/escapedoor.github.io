  var SLIP = '<h4>The renters &middot; a note for operators: making up a damaged reel</h4>' +
    '<p>When the titles of a reel have come apart, the story itself will tell you their order. There are two kinds of title.</p>' +
    '<p><b>A spoken title</b> (in inverted commas) comes straight after a picture of the person who says it.</p>' +

    '<p><b>Tenses.</b> &ldquo;Had&rdquo; with a past participle reaches back before the moment of the title: &ldquo;She had gone&rdquo; happened first.</p>' +

  var CCARD = '<h4>Changing over</h4><svg class="fig" viewBox="0 0 210 190"><rect x="10" y="10" width="190" height="104" fill="#5a6a7a"/><circle cx="182" cy="26" r="8" fill="#f4f1e6"/><text x="105" y="70" font-family="Oswald" font-size="13" text-anchor="middle" fill="#e9ecef">the picture</text><path d="M170 40l-26 22" stroke="#1c2028" stroke-width="2"/><text x="132" y="78" font-family="Architects Daughter" font-size="12" fill="#1c2028">dot</text>' +
    '<path d="M10 150h190" stroke="#1c2028" stroke-width="3"/><circle cx="60" cy="150" r="7" fill="#1c2028"/><circle cx="178" cy="150" r="7" fill="#1c2028"/><path d="M200 140v20" stroke="#9c2a2a" stroke-width="4"/>' +
    '<text x="60" y="176" font-family="Architects Daughter" font-size="12" text-anchor="middle" fill="#1c2028">1st: motor</text><text x="160" y="176" font-family="Architects Daughter" font-size="12" text-anchor="middle" fill="#1c2028">2nd: change</text><text x="200" y="134" font-family="Oswald" font-size="11" text-anchor="end" fill="#9c2a2a">end</text></svg>' +
    '<p>A picture comes in reels of up to a thousand feet: ten minutes or more each. So there are two machines. While one shows a reel, the other stands ready with the next.</p>' +

  function stripHtml(id) {
    var p = PIECE[id];
    if (p[0] === 'p') return '<div class="fs dnd-item" data-k="' + id + '">' + pic(p[1]) + '</div>';
    if (p[0] === 'card') return '<div class="fs dnd-item card" data-k="' + id + '"><div class="t">' + p[1] + '</div></div>';
    return '<div class="fs dnd-item" data-k="' + id + '"><div class="t' + (p[2] ? ' capt' : '') + '">' + p[1] + '</div></div>';
  }
  function pic(which) {
    var s = '<svg viewBox="0 0 220 64" preserveAspectRatio="xMidYMid meet"><rect width="220" height="64" fill="#2a2620"/>';
    if (which === 'young') s += '<rect x="20" y="8" width="70" height="50" fill="#4a5058"/><path d="M55 8v50M20 33h70" stroke="#2a2620" stroke-width="3"/><rect x="100" y="38" width="10" height="16" fill="#8a7a5a"/><circle cx="105" cy="34" r="5" fill="#5a5048"/>' +
      '<rect x="128" y="30" width="34" height="34" fill="#5a4a3a"/><circle cx="145" cy="20" r="11" fill="#d9c4a4"/><path d="M134 18q11 -14 22 0" fill="#2a1a10"/><text x="196" y="14" font-family="Oswald" font-size="9" text-anchor="end" fill="#8a8070">PICTURE</text>';
    else if (which === 'old') s += '<rect x="20" y="8" width="70" height="50" fill="#4a5058"/><path d="M55 8v50M20 33h70" stroke="#2a2620" stroke-width="3"/>' +
      '<rect x="128" y="30" width="34" height="34" fill="#4a4a4a"/><circle cx="145" cy="20" r="11" fill="#d9c4a4"/><path d="M134 16q11 -10 22 0" fill="#e9e6e0"/><path d="M136 24q9 18 18 0" fill="#e9e6e0"/><rect x="104" y="34" width="12" height="18" fill="#c9a24a"/><circle cx="110" cy="32" r="6" fill="#ffe08a"/><text x="196" y="14" font-family="Oswald" font-size="9" text-anchor="end" fill="#8a8070">PICTURE</text>';
    else if (which === 'bess') s += '<rect x="0" y="0" width="120" height="64" fill="#3a444c"/><path d="M0 46q30 -10 60 0t60 0V64H0Z" fill="#5a6a74"/><rect x="120" y="0" width="100" height="64" fill="#4a3a2a"/><rect x="138" y="6" width="64" height="58" fill="#1e1a16"/>' +
      '<path d="M150 64V30q20 -26 40 0V64Z" fill="#6a6a6a"/><circle cx="170" cy="24" r="9" fill="#d9c4a4"/><path d="M158 26q12 -22 24 0v10q-12 -6 -24 0z" fill="#8a7a6a"/>';
    else s += '<path d="M0 50q30 -14 60 0t60 0 60 0 60 0V64H0Z" fill="#4a5a64"/><path d="M80 52l20 -30 24 30z" fill="#3a3a3a"/><rect x="96" y="16" width="10" height="14" fill="#ffe08a"/><circle cx="101" cy="14" r="8" fill="#ffe08a" opacity=".35"/>' +
      '<rect x="112" y="30" width="8" height="18" fill="#5a4a3a"/><circle cx="116" cy="26" r="5" fill="#d9c4a4"/><path d="M40 40q20 -24 40 4" stroke="#efe8d4" stroke-width="3" fill="none"/><path d="M150 46q14 -20 34 2" stroke="#efe8d4" stroke-width="3" fill="none"/><text x="196" y="14" font-family="Oswald" font-size="9" text-anchor="end" fill="#8a8070">PICTURE</text>';
    return s + '</svg>';
  }
  function makeLock() {
    var order = ER.flag('r-order') || START.slice(), wait = false;
    var box = ER.el('div', 'lb'), s = '<div class="lb-grid">', n;
    s += '<div class="cell"><div class="fs fixed"><div class="t">' + pic('bess') + '<span>ALL THAT NIGHT THE STORM BLEW, AND THE LIGHT ON THE ROCK WAS DARK.</span></div></div></div>';
    for (n = 1; n <= 13; n++) s += '<div class="cell slot" data-i="' + n + '"><i>' + n + '</i></div>';
    s += '<div class="cell"><div class="fs fixed"><div class="t"><span style="font-size:15px">THE END</span></div></div></div></div>';
    s += '<div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="r-go">Show Della</button></div><div class="home" style="display:none"></div>';
    box.innerHTML = s;
    var home = box.querySelector('.home');
    order.forEach(function (id, k) { box.querySelector('.slot[data-i="' + (k + 1) + '"]').insertAdjacentHTML('beforeend', ER.gloss(stripHtml(id))); });
    function msg(t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function read() {
      order = [];
      for (var k = 1; k <= 13; k++) { var f = box.querySelector('.slot[data-i="' + k + '"] .fs'); order.push(f ? f.getAttribute('data-k') : ''); }
      ER.flag('r-order', order); box.setAttribute('data-order', order.join('-'));
    }
    /* a strip put on a place that is taken changes places with the one that was there */
    function settle() {
      var loose = home.querySelector('.fs'), k, sl;
      if (!loose) return;
      for (k = 1; k <= 13; k++) { sl = box.querySelector('.slot[data-i="' + k + '"]'); if (!sl.querySelector('.fs')) { sl.appendChild(loose); return; } }
    }
    ER.dnd(box, { item: '.fs.dnd-item', slot: '.slot', home: home, lock: function () { return wait || solved(); }, change: function () { settle(); read(); PH.sfx.strip(); msg(''); } });
    box.querySelector('#r-go').addEventListener('click', tryIt);
    read();
    msg('Thirteen pieces between the head of the reel and THE END. Drag a piece on to another to make them change places, or click one and then the other. Read the light box like a page: left to right, row by row.');
    function tryIt() {
      var full = ['head'].concat(order), k, file;
      if (wait || solved()) return;
      read();
      for (k = 1; k < full.length; k++) {
        if (!ER.check('adj', full[k - 1] + '>' + full[k])) {
          ER.sfx.no(); PH.flash(box.querySelector('.slot[data-i="' + k + '"]'));
          msg('Della reads along the glass and stops at piece ' + k + '. &ldquo;' + AFTER[full[k]] + '&rdquo;'); return;
        }
      }
      file = ER.exit([order.join('-')], { wait: true });
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('r-file', file); ER.flag('r-solved', 1);
      msg('Della reads the whole reel along the glass, from the storm to THE END, moving her lips. At Ernie&rsquo;s card she stops moving them.');
      ER.addClue('reel6', 'Reel 6, made up in order', reelHtml(), 'slip', 'From the rewind room');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'The flashback in its place: <i>Thirty years before</i>, the young keeper at the window, the lamp he was too proud to light. Then <i>Meanwhile</i>, and the storm again, and an old man who is not too proud twice.',
          'And at the end, after the old man&rsquo;s question, eight feet of film in Ernie&rsquo;s own lettering: <i>EFFIE &mdash; WILL YOU MARRY ME? IF YOU WILL, PLAY OUR TUNE. ERNIE.</i>',
          'Della joins the pieces at the splicer, one by one, without a word. Then she winds reel 6 on to a spool by hand, slowly, and puts it in your gloved hands.',
          '&ldquo;Before we run it,&rdquo; she says, &ldquo;read his card. Changing over. Reel 5 has to finish on one machine and reel 6 start on the other, and he&rsquo;d want it done his way.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 2600);
    }
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  function reelHtml() {
    var s = '<h4>Reel 6 of Bess of the Light, in order</h4><p>ALL THAT NIGHT THE STORM BLEW, AND THE LIGHT ON THE ROCK WAS DARK. <i>(Picture: Bess at the door.)</i></p>';
    (ER.flag('r-order') || []).forEach(function (id) {
      var p = PIECE[id];
      s += '<p>' + (p[0] === 'p' ? '<i>(Picture: ' + { young: 'a young man with dark hair at a window, beside a lamp nobody has lit', old: 'old Elias, with a white beard, at the same window, a lamp in his hands', rock: 'Davy on the Rock, the sea breaking over him' }[p[1]] + '.)</i>' : p[0] === 'card' ? '<b>' + p[1].replace(/<br>/g, ' ') + '</b>' : p[1]) + '</p>';
    });
    return s + '<p>THE END</p>';
  }
})();
</script>
