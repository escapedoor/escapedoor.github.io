(function () {

  var ERNIE = '<h4>Operator&rsquo;s notes &middot; E. Bardsley &middot; the Bijou</h4><p><i>Films, footage, faults. And a few things that are none of the Management&rsquo;s business.</i></p>' +
    '<span class="d">THURSDAY 6 OCTOBER 1927</span><p>New pianist tonight, a Miss Dorrell, seventeen. She played the comedy faster than I was running it, so I ran it faster. She played faster still. Coggins says I am to stop that.</p>' +
    '<span class="d">THURSDAY 27 SEPTEMBER 1928</span><p>She used to eat her sandwiches in the back row while I threaded up for the first house. This week she has started sitting in F7. F7 is on the gangway, and it is the one seat in the stalls that I can see from my window without leaning. I have not told her that. I think she knows.</p>' +
    '<span class="pin">Mr E. &mdash; Mr Eade is watching, so I can&rsquo;t come up. F7 at six, if you can get away for a sandwich. I will play ours at the kiss. Yours till the lights go up, E.</span>' +
    '<span class="d">SATURDAY 10 AUGUST 1929</span><p>Mr Eade had us all photographed on the front steps. Coggins and Dolly stood arm in arm, and nobody said a word, because nobody ever does. I stood at the end of the back row. I was not looking at the camera.</p>' +
    '<span class="d">MONDAY 18 NOVEMBER 1929</span><p>It is settled: the Bijou goes over to sound on Monday 2 December. Mr Eade told her this afternoon that she will not be wanted after Saturday. She played the whole evening without one wrong note, and went home without speaking to anybody.</p>' +
    '<span class="d">MONDAY 25 NOVEMBER 1929</span><p>Last week of silent pictures: <i>Bess of the Light</i>, six reels. On Saturday Mr Eade wants the sound engineers to play gramophone records for the last reel, so that the public can hear what is coming. So she is to stop at the end of reel 5, and go home.</p>' +
    '<p>She is not going home. I have bought her a ticket for the second house, F7, so that she can sit and watch the last reel like anybody else. I tore it in two. Half for her, and half for me: she is to give me hers when she has seen the end. I have had a card made. It goes in at the end of reel 6.</p>' +
    '<span class="stub">THE BIJOU &middot; STALLS &middot; 1/3<br>No. <b>2417</b></span>' +
    '<span class="d">SATURDAY 30 NOVEMBER 1929</span><p class="shaky">Reel 5 stuck in the gate a minute before the end. By the time I had the shutters down, the film in the gate was already alight. I had put it out before Coggins got up the ladder. Mr Eade sent the house home. Reel 6 was never shown. Dolly says that when the lights came up, she was standing by F7 with her half of the ticket in her hand.</p>' +
    '<span class="d">THURSDAY 5 DECEMBER 1929</span><p class="shaky">Hands still in bandages. She went on the Monday morning train, to a band at the seaside. I was at the hospital, having my hands dressed. She left no address with anybody.</p>' +
    '<span class="d">SATURDAY 20 SEPTEMBER 1969</span><p>She is back. F7. Second house. I knew her by the back of her head.</p>' +
    '<span class="d">SATURDAY 4 OCTOBER 1969</span><p>Bought an ice at the kiosk at the interval, which I have not done since the war. Young Fay asked me if I was feeling quite well.</p>' +
    '<span class="d">SATURDAY 1 NOVEMBER 1969</span><p>I have kept the card for forty years, and the old machines. I shall show her the end: Saturday the 29th, after the last house. Forty years, less one day. Gave young Fay a note for her.</p>' +
    '<span class="d">WEDNESDAY 26 NOVEMBER 1969</span><p>Reel 6 is in pieces on the bench in the rewind room. The old joins had gone brittle, and I have taken every title out to make them good. Tomorrow night I shall put them all back in order, and the card with them.</p>' +
    '<p><i>There are no more entries.</i></p>';
  var LETTER = '<div class="env">Mr E. Bardsley &middot; The Bijou, Castle Street &middot; By hand</div><h4>Tuesday 11th November 1969</h4><p>Dear Mr Bardsley,</p>' +
    '<p>Young Fay gave me your note, and pretended that she had not read it.</p><p>Yes. I will come on the 29th, after the last house, and sit where you say. You did not need to tell me which seat.</p>' +
    '<p>I am sending you something that I have kept for forty years, first in my music case and then in my handbag. I was to give it to you when I had seen the end, and I never did see the end. I always wondered how that picture finished.</p>' +
    '<p>I waited at the station on the Monday. I know now why you did not come.</p><p class="sig">Yours till the lights go up,<br>E. A.</p>' +

  var CUE = '<h4>Music cue sheet &middot; Bess of the Light</h4><h5>Six reels. Supplied by the renters with every copy of the picture. Running times are for the speed at which the picture was made to be shown: do not run it faster.</h5>' +

    '<p class="foot">Total running time: 77 minutes.</p>';
  var RULES = '<h5>Conditions of licence under the</h5><h4>Cinematograph Act, 1909</h4>' +
    '<p>Cinematograph film is made of cellulose nitrate. It catches fire very easily and burns fiercely. Once alight it makes its own oxygen, so it cannot be put out by smothering it, and it gives off poisonous smoke. Therefore:</p>' +
    '<ol><li>Films shall be shown only from an operating box built of fireproof materials, outside the auditorium.</li>' +

    '<li>Every machine shall have a fire trap where the film leaves the top spool box and another where it enters the bottom one, so that a fire in the gate cannot reach the reels.</li>' +

  function paint() {
    $('#tin').classList.toggle('ready', !told.tin);
    $('#della').classList.toggle('ready', !!(told.notes && told.letter && !told.della));
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.notes && told.letter ? 1 : 0) + (told.cue ? 1 : 0) + (told.della ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The box is up the ladder. Click the button at the bottom of the screen.']];
    if (!told.tin) return ['tin', ['Mr Bardsley&rsquo;s things went into the safe in 1969. Click the open safe on the left: the red tin is inside.']];
    if (lock && lock.isOpen()) return ['board', [
      'Each row wants one thing from 1929 and the same thing again in 1969. Start with the seat: where did she start sitting in 1928? Where did Mrs A. sit in 1969?',
      'A ticket torn in two leaves two halves with the same number. One half is pinned in Ernie&rsquo;s notes. Where did the other half turn up?',
      'The tune: the pianist&rsquo;s pencil on the cue sheet, and what Mrs A. hummed at the kiosk. The hand: how Effie signed her note in 1928, and how Mrs Ashton signed her letter. Three cards prove nothing about who she was: the sweethearts, the programme&rsquo;s thanks and the brown tie.'
    ]];
    if (!(told.notes && told.letter)) return ['read', ['Read what was in the tin: Mr Bardsley&rsquo;s notes and the letter. Click the tin again to choose.', 'The filing cabinet on the right has the music for Bess of the Light. The frame on the wall has the rules of the box.']];
    if (!told.della) return ['della', ['Della has been reading over your shoulder. Click her: she has something to say about it.']];
    return ['open', ['Click the desk, or Della, to put the cards out on the blotter again.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The manager&rsquo;s office. Four rows of cards on the blotter, and one story.'); return; }
    if (told.in) { busy = false; ER.say('The manager&rsquo;s office. The rain is running down the window, behind the back of the sign.'); return; }
    tell('in');
    ER.narrate([
      'A small square office under the roof. Through the window, in the rain, you can see the back of the great sign over the canopy: five tall letters in glass tubes, back to front. U O J I B.',
      'Della goes straight to the safe and pulls the door wide. Inside, on the top shelf, there is a red biscuit tin with a label stuck on the lid.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the tin and its papers ---------- */
  function readNotes() {
    ER.read({ html: ERNIE, cls: 'ernie', clue: { id: 'notes', title: 'Ernie Bardsley&rsquo;s notes, 1927 to 1969', kind: 'From the tin' }, done: function () {
      PH.terms(['gate', 'reel', 'rewind room', 'title card']);
      if (tell('notes')) { paint(); ER.say('&ldquo;He never once writes her name after the first page,&rdquo; says Della. &ldquo;Not once. Forty years of &lsquo;she&rsquo;.&rdquo;'); }
    } });
  }
  function readLetter() {
    ER.read({ html: LETTER, cls: 'effie', clue: { id: 'letter', title: 'A letter to Mr Bardsley, 11 November 1969', kind: 'From the tin' }, done: function () {
      if (tell('letter')) { paint(); ER.say('&ldquo;E. A.,&rdquo; says Della. &ldquo;Mrs A. Gran&rsquo;s Mrs A.&rdquo;'); }
    } });
  }
  function openTin() {
    var box = ER.el('div', 'doc slip', '<h4>In the tin</h4><p>A black notebook with squared pages, held shut by a rubber band. A letter in a small envelope, opened. A pair of reading glasses, folded.</p>' +
      '<p><button type="button" class="btn" id="t-notes">Read the notebook</button> <button type="button" class="btn" id="t-letter">Read the letter</button></p>');
    box.querySelector('#t-notes').addEventListener('click', function () { ER.close(); setTimeout(readNotes, 60); });
    box.querySelector('#t-letter').addEventListener('click', function () { ER.close(); setTimeout(readLetter, 60); });
    ER.open('ov-read', box);
  }
  $('#tin').addEventListener('click', function () { if (busy) return; if (tell('tin')) paint(); PH.sfx.key(); openTin(); });
  $('#safe').addEventListener('click', function (e) { if (busy) return; if (e.target.closest && e.target.closest('#tin')) return; ER.wordAt(e.clientX, e.clientY, 'safe'); ER.say('A green fire-resisting safe, older than anybody in Delverton. The tin is on the top shelf. The bottom shelf holds the takings books from 1961 to 2019.'); });
  $('#cabinet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CUE, cls: 'cue', clue: { id: 'cue', title: 'The music cue sheet for Bess of the Light', kind: 'From the filing cabinet' }, done: function () {
      PH.terms(['cue sheet']);
      if (tell('cue')) { paint(); ER.say('The top drawer, 1925 to 1935: a folder marked BESS OF THE LIGHT, MUSIC. &ldquo;Mr Eade kept everything,&rdquo; says Della. &ldquo;Including, apparently, her pencil.&rdquo;'); }
    } });
  });
  $('#rules').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RULES, cls: 'rules', clue: { id: 'rules', title: 'The rules of the box (Cinematograph Act, 1909)', kind: 'From the office wall' }, done: function () {
      PH.terms(['fire trap', 'film safe', 'cellulose nitrate']);
      if (tell('rules')) ER.say('&ldquo;Moving film is safe; standing film is not,&rdquo; says Della. &ldquo;We had that on the wall of the box too, when I trained. On real film, the last few years before it all went digital.&rdquo;');
    } });
  });
  PH.thing('#cal', null, 'A calendar from September 2019. The last Sunday is crossed out: the last day the Bijou was open.', isBusy);
  PH.thing('#window', 'sign', 'The back of the BIJOU sign, five letters in glass tubes. From in here it reads U O J I B. It has not been lit since 2019.', isBusy);
  $('#desk').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four rows of cards on the blotter. Della has not moved one of them.'); return; }
    if (!told.della) { ER.say('The manager&rsquo;s desk, with its green blotter. Della is watching you read, and waiting to say something.'); return; }
    openLock();
  });

  /* ---------- Della: two love stories, or one? ---------- */
  function talkDella() {
    ER.talk({
      who: 'Della Fraser', role: 'The last manager of the Bijou', face: window.FACE('della'),
      lines: [
        { note: 'Della has the black notebook open on the desk, at the last page.', a: '&ldquo;Right. I&rsquo;ll say what I see. 1929: a young operator and the pianist. A ticket, a card, a fire. She goes away. 1969: an old operator and a widow, Mrs A., new in town, from somewhere else. He dies. Two love stories, forty years apart. He was unlucky twice.&rdquo;' },
        { q: 'Or once.', a: '&ldquo;Or once, you&rsquo;re going to say. That Mrs A. was Effie Dorrell, come back. Gran never said so. Gran knew everything about everybody in this town, and she never said so.&rdquo;' },
        { a: '&ldquo;Then prove it. Four things would do it for me: the same seat, the same ticket, the same tune, the same hand. Show me each one in 1929, and the same thing again in 1969. Not who you think. Who you can show.&rdquo;' }
      ],
      clue: { id: 'della3', title: 'Della: two love stories, or one?', kind: 'What she said' },
      done: function (seen) { if (!seen) return; tell('della'); paint(); openLock(); }
    });
  }
  function openLock() { if (!lock) lock = makeLock(); lock.open(); }
  $('#della').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;The box,&rdquo; says Della. &ldquo;Mind the ladder. He didn&rsquo;t, for forty-three years.&rdquo;'); return; }
    if (!told.tin) { ER.say('&ldquo;The tin,&rdquo; says Della. &ldquo;Go on. He won&rsquo;t mind now.&rdquo;'); return; }
    if (!(told.notes && told.letter)) { ER.say('&ldquo;Read it all first,&rdquo; says Della. &ldquo;The notebook and the letter. Then I&rsquo;ll tell you what I think.&rdquo;'); return; }
    if (!told.della) talkDella(); else openLock();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  function oneHtml() {
    return '<p>Four things, in 1929 and again in 1969:</p><p><b>Seat:</b> she started sitting in F7 in 1928; Mrs A. sat in F7 in 1969.</p><p><b>Ticket:</b> two halves of one pink ticket, No. 2417: his in his notes, hers sent back with her letter.</p>' +
      '<p><b>Tune:</b> she played <i>If You Ask Me</i> at the kiss in 1929; Mrs A. hummed it at the kiosk in 1969.</p><p><b>Hand:</b> &ldquo;Yours till the lights go up, E.&rdquo; in 1928, and &ldquo;Yours till the lights go up, E. A.&rdquo; in 1969.</p>' +
      '<p>So Mrs A. (Mrs Ashton) was Effie Dorrell. One love story, not two. Twice she never saw the end of reel 6: in 1929 the film caught fire a minute before it; in 1969 he died two days before.</p>';
  }

  /* ---------- the blotter: four rows, a 1929 card and a 1969 card in each ---------- */
  function makeLock() {
    var placed = ER.flag('o-placed') || {}, wait = false, SLOTS = [];
    var box = ER.el('div', 'pr'), s = '<div class="pr-head"><span></span><span>1929</span><span>1969</span></div>';
    ROWSP.forEach(function (r) { s += '<div class="pr-row"><i>' + r[1] + '</i><div class="pslot" data-s="' + r[0] + '29"></div><div class="pslot" data-s="' + r[0] + '69"></div></div>'; SLOTS.push(r[0] + '29', r[0] + '69'); });
    s += '<div class="pr-tray"></div><div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="o-go">Show Della</button></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.pr-tray');
    ['c2', 'd3', 'c5', 'd1', 'c4', 'd5', 'c1', 'd4', 'c6', 'c3', 'd2'].forEach(function (k) {
      var c = ER.el('div', 'pc dnd-item y' + CARDS[k][0].slice(2), '<small>' + CARDS[k][0] + '</small>' + ER.gloss(CARDS[k][1])), at = null;
      c.setAttribute('data-c', k);
      SLOTS.forEach(function (sl) { if (placed[sl] === k) at = sl; });
      (at ? box.querySelector('.pslot[data-s="' + at + '"]') : tray).appendChild(c);
    });
    function msg(t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function read() {
      placed = {};
      SLOTS.forEach(function (sl) { var c = box.querySelector('.pslot[data-s="' + sl + '"] .pc'); if (c) placed[sl] = c.getAttribute('data-c'); });
      ER.flag('o-placed', placed);
      box.setAttribute('data-placed', SLOTS.map(function (sl) { return placed[sl] || 'none'; }).join('-'));
    }
    ER.dnd(box, { item: '.pc', slot: '.pslot', home: tray, lock: function () { return wait || !!nextFile; }, change: function () { read(); PH.sfx.card(); msg(''); } });
    box.querySelector('#o-go').addEventListener('click', tryIt);
    read();
    msg(Object.keys(placed).length ? 'The blotter, as far as you have got with it.' : 'Four rows: the same seat, the same ticket, the same tune, the same hand. In each row, a card from 1929 and a card from 1969. Drag a card to its place, or click it and then the place.');
    var DECOY = {
      c5: '&ldquo;The sweethearts? You showed me yourself that&rsquo;s Mr Coggins and Dolly Ferris.&rdquo;',
      c6: '&ldquo;That proves they sacked her. It doesn&rsquo;t prove she ever came back.&rdquo;',
      d5: '&ldquo;A brown tie proves he was trying. It proves nothing at all about her.&rdquo;'
    };
    var ROWWHY = {
      seat: '&ldquo;The same seat. In 1928, where does he say she started sitting? In 1969, where does your own plan put Mrs A.?&rdquo;',
      tick: '&ldquo;The same ticket. A ticket torn in two leaves two halves with one number. Where is each half?&rdquo;',
      tune: '&ldquo;The same tune. Who wrote its name in pencil in 1929, and who hummed it in 1969?&rdquo;',
      hand: '&ldquo;The same hand. Look at how two letters end, forty years apart.&rdquo;'
    };
    function tryIt() {
      var empty = SLOTS.filter(function (sl) { return !placed[sl]; }).length, i, sl, c, file;
      if (wait || nextFile) return;
      read();
      if (empty) { msg('&ldquo;' + (empty === 1 ? 'One place is' : empty + ' places are') + ' still empty,&rdquo; says Della. &ldquo;Four rows. Both years. I said I wanted all of it.&rdquo;'); return; }
      for (i = 0; i < SLOTS.length; i++) {
        sl = SLOTS[i]; c = placed[sl];
        if (DECOY[c]) { ER.sfx.no(); PH.flash(box.querySelector('.pslot[data-s="' + sl + '"]')); msg('Della picks one card up and puts it down again. ' + DECOY[c]); return; }
      }
      for (i = 0; i < SLOTS.length; i++) {
        sl = SLOTS[i];
        if (!ER.check(sl, placed[sl])) { ER.sfx.no(); PH.flash(box.querySelector('.pslot[data-s="' + sl + '"]')); msg('Della runs her finger along one row and stops. ' + ROWWHY[sl.slice(0, 4)]); return; }
      }
      file = ER.exit([ROWSP.map(function (r) { return placed[r[0] + '29'] + '-' + placed[r[0] + '69']; }).join('|')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('o-file', file);
      msg('Della reads the four rows twice. Then she sits down in the manager&rsquo;s chair, which she has not done since 2019.');
      PH.mine('one', 'One story, not two', oneHtml());
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          '&ldquo;Mrs A. was Effie Dorrell,&rdquo; says Della. &ldquo;Mrs Ashton, by then. Forty years, and she came back, and sat in the same seat, and hummed the same tune at my gran, and Gran never once guessed. Not two love stories. One.&rdquo;',
          '&ldquo;He bought her a ticket so that she could watch the last reel like anybody else. He had a card made, for the end of reel 6. And twice she never saw it. In 1929 the film caught fire a minute before. In 1969 he died two days before.&rdquo;',
          'She picks up the letter again. &ldquo;<i>I always wondered how that picture finished.</i>&rdquo; She puts it down. &ldquo;And every night at twenty to ten, just when reel 5 would have been ending in the second house, something tries to show it: much too fast, and in the wrong order. And every morning she&rsquo;s in F7, waiting.&rdquo;',
          '&ldquo;Well. I&rsquo;m not having that on my last night.&rdquo; She stands up. &ldquo;Reel 6 is in pieces in the rewind room, he says. But the box first. If we are going to show this, we&rsquo;ll show it properly.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 2400);
    }
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
