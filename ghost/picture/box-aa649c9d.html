<style>
  body{--bg:#0e1412;--accent:#cfe08a;--font-display:'Stardos Stencil',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(12,18,16,.96);--tc-ink:#e6eee2;--cap-bg:rgba(12,18,16,.95);--panel:#141c18;--face-bg:#3a1418;--q-ink:#cfe08a;--fade:#040605;--hud-bg:rgba(12,18,16,.82)}
  .tc-room{font-size:clamp(52px,7.6vw,104px);font-weight:700;letter-spacing:.06em}
  #bulb{animation:bulb 3.1s steps(1,end) infinite}
  @keyframes bulb{0%{opacity:1}12%{opacity:.55}14%{opacity:1}57%{opacity:.85}59%{opacity:1}}
  #scene.ran #spinB{animation:spin .5s linear infinite}
  @keyframes spin{100%{transform:rotate(360deg)}}

  /* machine B, opened up for threading, and its speed dial */
  .tb{width:min(1080px,97vw);display:flex;gap:16px;align-items:flex-start;-webkit-user-select:none;user-select:none}
  .tb-mach{flex:0 0 auto;width:min(470px,46vw);background:#1c2420 linear-gradient(160deg,#26302a,#121814);border:1px solid #4a5a4e;padding:6px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .tb-mach svg{display:block;width:100%;height:auto;max-height:calc(100vh - 170px)}
  .tb-mach .pt{cursor:pointer}
  .tb-mach .pt:hover .hl{stroke:#cfe08a;stroke-width:3}
  .tb-mach .hl.bad{stroke:#d2452f;stroke-width:5;outline:0}
  .tb-side{flex:1 1 0;display:flex;flex-direction:column;gap:10px}
  .tb-card{background:#e9ecef;color:#1c2028;padding:12px 18px 10px;border:2px solid #4a5260;font-family:'Architects Daughter',cursive;font-size:16px;line-height:1.45}
  .tb-card h5{margin:0 0 4px;font-family:'Stardos Stencil',serif;font-size:18px;letter-spacing:.06em}
  .tb-card ol{margin:2px 0 0;padding-left:22px;min-height:40px;columns:2;column-gap:22px;font-size:15px}
  .dial{display:none;align-items:center;gap:14px;background:#1c2420;border:1px solid #4a5a4e;padding:10px 14px}
  .tb.st2 .dial{display:flex}
  .dial svg{width:150px;height:150px}
  .dial .btns{display:flex;flex-direction:column;gap:8px}
  .dial .btn{min-width:150px}
  .dial .rd{font-family:'Stardos Stencil',serif;font-size:40px;color:#cfe08a;line-height:1}
  .dial .rd small{display:block;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.22em;color:#a8b89a}
  .tb .pmsg{font-size:17.5px;min-height:120px}
</style>

    tell('in');
    ER.narrate([
      'A long narrow room with green walls, a band of white tiles and one bare bulb, which Della has wired to a battery. Five small windows in the front wall: two for the newer machines, two for the old pair, and one to look through.',
      'Machines No. 1 and No. 2, from the 1960s, stand at their windows like two grey cows. In the corner, by the two smaller windows, stand the old pair: A and B, black, tall, older than anything in Delverton but the church.',
      '&ldquo;He wouldn&rsquo;t let them scrap these,&rdquo; says Della. &ldquo;The new ones only do twenty-four pictures a second: sound speed. A silent picture wants a machine that can go slower.&rdquo; She is already opening up A. &ldquo;I&rsquo;ll thread A. You thread B, with the white leader, not the nitrate. And then tell me what speed. I&rsquo;ll check your work. He would have.&rdquo;'
    ], function () { busy = false; PH.terms(['projector', 'leader']); paint(); });
  }

  PH.thing('#sign', null, 'MOVING FILM IS SAFE. STANDING FILM IS NOT. Painted on a board in red and black, and screwed to the wall.', isBusy);
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'manual', clue: { id: 'manual', title: 'The handbook: how the machine makes a picture move', kind: 'From the box' }, done: function () {
      PH.terms(['frame', 'sprocket', 'intermittent', 'loop', 'shutter', 'spool box']);
      if (tell('manual')) { paint(); ER.say('&ldquo;Sixteen frames to the foot,&rdquo; says Della, without looking round. &ldquo;Some things never changed.&rdquo;'); }
    } });
  });
  $('#fsafe').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CANS, cls: 'slip', clue: { id: 'cans', title: 'The film safe: the cans of reels 5 and 6', kind: 'From the box' }, done: function () {
      PH.terms(['can']);
      if (tell('cans')) { paint(); ER.say('Reel 5 in its can, and reel 6&rsquo;s can empty. &ldquo;Your Archive is getting two reels of nitrate,&rdquo; says Della, &ldquo;and a story.&rdquo;'); }
    } });
  });
  PH.thing('#buckets', null, 'Two red buckets: FIRE, and SAND. Sand, not water. &ldquo;Nitrate makes its own oxygen,&rdquo; says Della. &ldquo;You can&rsquo;t smother it. You cut it off and let it burn out in a bucket.&rdquo;', isBusy);
  PH.thing('#ports', 'porthole', function () {
    return 'Through the little window between the two old machines: the stalls, far below, in the light of the lamp Della left down there. One seat is lit more than the others. F7, down.';
  }, isBusy);
  PH.thing('#newer', null, 'Machines No. 1 and No. 2, the 1960s pair. Their motors run at one speed only: twenty-four pictures a second, for sound. They cannot go any slower.', isBusy);
  PH.thing('#oldA', null, function () { return nextFile ? 'Machine A, threaded by Della, its dial set to match B&rsquo;s: twenty.' : 'Machine A. Della has its gate open and is threading it, fast, without looking at the book.'; }, isBusy);
  $('#oldB').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Machine B: threaded with white leader, the loops holding their shape, the dial at twenty.'); return; }
    if (!lock) lock = makeLock();
    tell('opened'); paint(); lock.open();
  });
  $('#della').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Rewind room,&rdquo; says Della. &ldquo;Reel 6 is waiting. It&rsquo;s been waiting since 1969.&rdquo;'); return; }
    ER.say(ER.flag('b-threaded') ? '&ldquo;Now the speed,&rdquo; says Della. &ldquo;Work it out. Don&rsquo;t guess. He never guessed.&rdquo;' : '&ldquo;Thread B,&rdquo; says Della. &ldquo;The handbook is on the shelf. I&rsquo;m not going to tell you; I&rsquo;m going to watch.&rdquo;');
  });
  $('#rdoor').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.leave(nextFile); return; }
    ER.say('&ldquo;Machine first,&rdquo; says Della. &ldquo;His rule: you never bring nitrate to a machine that isn&rsquo;t ready.&rdquo;');
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- machine B: thread it, then set its speed ---------- */
  function makeLock() {
    var done = ER.flag('b-threaded') ? 10 : 0, path = [], fps = ER.flag('b-fps') || 16, wait = false;
    var box = ER.el('div', 'tb' + (done === 10 ? ' st2' : '')), mach = ER.el('div', 'tb-mach'), side = ER.el('div', 'tb-side');
    mach.innerHTML = machSvg();
    side.innerHTML = '<div class="tb-card"><h5>MACHINE B &middot; THREADING</h5><ol id="b-steps"></ol></div>' +
      '<div class="dial"><svg viewBox="0 0 150 150" id="b-dial"></svg><div class="rd"><span id="b-rd"></span><small>PICTURES A SECOND</small></div><div class="btns"><button type="button" class="btn" id="b-up">Faster</button><button type="button" class="btn" id="b-down">Slower</button><button type="button" class="btn" id="b-run">Run the leader</button></div></div>' +
      '<div class="pfoot"><p class="pmsg"></p></div>';
    box.appendChild(mach); box.appendChild(side);
    var PARTS = ['g', 'k2', 's2', 'l1', 'f1', 'i', 's1', 'l2', 'f2', 'k1'];
    function msg(t) { side.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    /* which part comes at step n? asked of the tags, one part at a time */
    function expect(n) { for (var i = 0; i < PARTS.length; i++) if (ER.check('th', n + ':' + PARTS[i])) return PARTS[i]; return null; }
    function drawPath() {
      var d = '', i, a, b;
      for (i = 1; i < path.length; i++) {
        a = P[path[i - 1]]; b = P[path[i]];
        if (path[i] === 'l1' || path[i] === 'l2') d += 'M' + a[0] + ' ' + a[1] + 'Q' + (b[0] + 40) + ' ' + b[1] + ' ' + b[0] + ' ' + b[1];
        else if (path[i - 1] === 'l1' || path[i - 1] === 'l2') d += 'M' + a[0] + ' ' + a[1] + 'Q' + (a[0] + 30) + ' ' + (b[1] - 10) + ' ' + b[0] + ' ' + b[1];
        else d += 'M' + a[0] + ' ' + a[1] + 'L' + b[0] + ' ' + b[1];
      }
      mach.querySelector('#filmpath').setAttribute('d', d);
      side.querySelector('#b-steps').innerHTML = path.map(function (p) { return '<li>' + P[p][2] + '</li>'; }).join('');
      box.setAttribute('data-path', path.join('-'));
    }
    if (done === 10) path = String(ER.flag('b-path') || '').split('-').filter(Boolean);
    drawPath();
    ER.$$('.pt', mach).forEach(function (n) {
      n.addEventListener('click', function () {
        var p = n.getAttribute('data-p'), want;
        if (wait || nextFile || path.length === 10) return;
        if (NEVER[p]) { ER.sfx.no(); msg(NEVER[p]); return; }
        if (ER.check('th', (path.length + 1) + ':' + p)) {
          path.push(p); PH.sfx.strip(); drawPath(); msg('');
          if (path.length === 10) {
            ER.flag('b-threaded', 1); ER.flag('b-path', path.join('-')); PH.solved(true); paint();
            msg('The leader runs from the top box to the bottom one, with a loop above the gate and a loop below it. Della leans over and looks. &ldquo;Good. Now the speed.&rdquo;');
            box.classList.add('st2'); paintDial(); PH.mine('thread', 'How machine B is threaded', '<p>' + path.map(function (q) { return P[q][2]; }).join(', ') + '.</p><p>The top and bottom sprockets turn steadily; the one just under the gate jerks the film down one frame at a time. The loops are slack between them, so that the film does not tear. The fire traps keep a fire in the gate away from the reels.</p>');
          }
          return;
        }
        want = expect(path.length + 1);
        ER.sfx.no(); PH.flash(n.querySelector('.hl') || n);
        msg((NEXT[want] || 'Not there.') + (path.length ? ' The leader comes out: start again from the top.' : ''));
        path = []; drawPath();
      });
    });
    function paintDial() {
      var a = -135 + (fps - 12) / 16 * 270, s = '<circle cx="75" cy="75" r="68" fill="#e9e2cc" stroke="#3a3e42" stroke-width="6"/>', v, b;
      for (v = 12; v <= 28; v++) { b = (-135 + (v - 12) / 16 * 270 - 90) * Math.PI / 180; s += '<path d="M' + PH.num(75 + Math.cos(b) * 56) + ' ' + PH.num(75 + Math.sin(b) * 56) + 'L' + PH.num(75 + Math.cos(b) * (v % 4 ? 62 : 66)) + ' ' + PH.num(75 + Math.sin(b) * (v % 4 ? 62 : 66)) + '" stroke="#1a1c1e" stroke-width="2"/>'; if (v % 4 === 0) s += '<text x="' + PH.num(75 + Math.cos(b) * 44) + '" y="' + PH.num(79 + Math.sin(b) * 44) + '" font-family="Oswald" font-size="12" text-anchor="middle" fill="#1a1c1e">' + v + '</text>'; }
      s += '<path d="M75 75L75 20" stroke="#9c2a2a" stroke-width="4" stroke-linecap="round" transform="rotate(' + PH.num(a) + ' 75 75)"/><circle cx="75" cy="75" r="7" fill="#1a1c1e"/>';
      side.querySelector('#b-dial').innerHTML = s; side.querySelector('#b-rd').textContent = fps; box.setAttribute('data-fps', fps);
    }
    paintDial();
    side.querySelector('#b-up').addEventListener('click', function () { if (wait || nextFile || fps >= 28) return; fps++; ER.flag('b-fps', fps); PH.sfx.dial(); paintDial(); msg(''); });
    side.querySelector('#b-down').addEventListener('click', function () { if (wait || nextFile || fps <= 12) return; fps--; ER.flag('b-fps', fps); PH.sfx.dial(); paintDial(); msg(''); });
    side.querySelector('#b-run').addEventListener('click', function () {
      var file, mins;
      if (wait || nextFile) return;
      wait = true; PH.sfx.run(2.2, fps); msg('The motor starts. The white leader runs through the gate with a noise like a sewing machine in a hurry&hellip;');
      setTimeout(function () {
        wait = false;
        if (!ER.check('fps', String(fps))) {
          ER.sfx.no(); mins = 900 * 16 / (fps * 60);
          msg(fps === 24 ? 'Della stops the motor. &ldquo;Twenty-four. That&rsquo;s sound speed, and true for every talkie ever made. This one isn&rsquo;t a talkie. At twenty-four, reel 6 would be over in ten minutes. How long does its own cue sheet say it takes?&rdquo;' :
            'Della stops the motor. &ldquo;At ' + fps + ' a second, reel 6 would last ' + PH.num(mins) + ' minutes. Its cue sheet says how long it should take. Work it out from that.&rdquo;');
          return;
        }
        file = ER.exit([path.join('-') + '>' + fps], { wait: true });
        if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('b-file', file);
        msg('Della watches the take-up spool turn for a long moment. Then she stops the motor, and sets A&rsquo;s dial to match.');
        PH.mine('speed', 'The speed for reel 6', '<p>Reel 6 is 900 feet long (the label on its can). A foot of film holds 16 frames (the handbook). So reel 6 is 900 × 16 = 14,400 pictures.</p>' +
          '<p>The cue sheet says reel 6 runs for 12 minutes: 720 seconds. 14,400 ÷ 720 = <b>' + fps + ' pictures a second</b>.</p><p>Not 24: that is the speed for sound pictures. At 24, reel 6 would be over in 10 minutes, and everything on it would move too fast, like the screen at twenty to ten.</p>');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            '&ldquo;Twenty,&rdquo; says Della. &ldquo;Nine hundred feet in twelve minutes. Not twenty-four.&rdquo; She looks at the newer machines. &ldquo;Whatever runs that screen at twenty to ten, it runs at sound speed and in the wrong order. No wonder nobody can read it.&rdquo;',
            '&ldquo;You&rsquo;d have got a job here. Ernie wouldn&rsquo;t have said so. He&rsquo;d have said nothing, which was how you knew.&rdquo;',
            '&ldquo;Reel 5 is in the safe and it can stay there till we need it. Reel 6 is in the rewind room, in pieces. Come on.&rdquo;'
          ], function () { busy = false; paint(); });
        }, 2600);
      }, 2300);
    });
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }

  /* machine B with its door open: every part the film might pass, and three that it never does */
  function machSvg() {
    var s = '<svg viewBox="0 0 470 740" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="0" y="0" width="470" height="740" fill="#161c18"/>';
    function hit(p, inner) { return '<g class="pt" data-p="' + p + '">' + inner + '</g>'; }
    s += hit('s1', '<circle class="hl" cx="250" cy="92" r="78" fill="#2a2e30" stroke="#4a5054" stroke-width="2"/><circle cx="250" cy="92" r="52" fill="#e9e2cc" opacity=".25"/><circle cx="250" cy="92" r="12" fill="#5a5e62"/><rect x="232" y="166" width="36" height="8" fill="#4a5054"/>');
    s += hit('f1', '<rect class="hl" x="214" y="174" width="72" height="26" fill="#1a1e20" stroke="#4a5054" stroke-width="2"/><circle cx="240" cy="187" r="8" fill="#8a9298"/><circle cx="260" cy="187" r="8" fill="#8a9298"/>');
    s += hit('k1', '<circle class="hl" cx="272" cy="236" r="24" fill="#3a3e42" stroke="#4a5054" stroke-width="2"/>' + teeth(272, 236, 24) + '<circle cx="272" cy="236" r="6" fill="#1a1e20"/>');
    s += hit('l1', '<rect class="hl" x="300" y="262" width="80" height="56" rx="10" fill="#1a201c" stroke="#3a4a3e" stroke-width="2" stroke-dasharray="5 4"/>');
    s += hit('lamp', '<rect class="hl" x="40" y="300" width="150" height="104" fill="#2a2420" stroke="#4a4038" stroke-width="2"/><circle cx="110" cy="352" r="22" fill="#5a4a30"/><path d="M60 316h110M60 388h110" stroke="#3a3028" stroke-width="5"/><rect x="190" y="342" width="40" height="20" fill="#3a3028"/>');
    s += hit('g', '<rect class="hl" x="232" y="314" width="40" height="76" fill="#3a3e42" stroke="#4a5054" stroke-width="2"/><rect x="242" y="338" width="20" height="28" fill="#0a0c0c"/>');
    s += hit('lens', '<rect class="hl" x="286" y="336" width="90" height="32" rx="6" fill="#2a2e30" stroke="#4a5054" stroke-width="2"/><circle cx="376" cy="352" r="16" fill="#5a7a8a" opacity=".6"/>');
    s += hit('shut', '<g class="hl" fill="none" stroke="#4a5054" stroke-width="2"><circle cx="430" cy="352" r="34"/></g><path d="M430 352L430 318A34 34 0 0 1 459 369Z" fill="#3a3e42"/><path d="M430 352L430 386A34 34 0 0 1 401 335Z" fill="#3a3e42"/>');
    s += hit('i', '<circle class="hl" cx="262" cy="420" r="20" fill="#4a3a2a" stroke="#4a5054" stroke-width="2"/>' + teeth(262, 420, 20) + '<path d="M262 420l10 -10" stroke="#1a1e20" stroke-width="4"/>');
    s += hit('l2', '<rect class="hl" x="300" y="446" width="80" height="56" rx="10" fill="#1a201c" stroke="#3a4a3e" stroke-width="2" stroke-dasharray="5 4"/>');
    s += hit('k2', '<circle class="hl" cx="272" cy="530" r="24" fill="#3a3e42" stroke="#4a5054" stroke-width="2"/>' + teeth(272, 530, 24) + '<circle cx="272" cy="530" r="6" fill="#1a1e20"/>');
    s += hit('f2', '<rect class="hl" x="214" y="572" width="72" height="26" fill="#1a1e20" stroke="#4a5054" stroke-width="2"/><circle cx="240" cy="585" r="8" fill="#8a9298"/><circle cx="260" cy="585" r="8" fill="#8a9298"/>');
    s += hit('s2', '<circle class="hl" cx="250" cy="670" r="64" fill="#2a2e30" stroke="#4a5054" stroke-width="2"/><circle cx="250" cy="670" r="12" fill="#5a5e62"/><rect x="232" y="600" width="36" height="8" fill="#4a5054"/>');
    s += '<path id="filmpath" d="" fill="none" stroke="#f2ead6" stroke-width="6" stroke-linecap="round" pointer-events="none"/>';
    s += '<text x="20" y="728" font-family="Oswald" font-size="13" letter-spacing="3" fill="#8a9a8e">DELTA No. 4 &middot; MACHINE B</text>';
    return s + '</svg>';
  }
  function teeth(cx, cy, r) {
    var s = '', k, a;
    for (k = 0; k < 12; k++) { a = k * Math.PI / 6; s += '<rect x="' + PH.num(cx + Math.cos(a) * r - 3) + '" y="' + PH.num(cy + Math.sin(a) * r - 3) + '" width="6" height="6" fill="#8a9298"/>'; }
    return s;
  }
})();
</script>
</body>
</html>
