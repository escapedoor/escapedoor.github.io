  .tc-room{font-size:clamp(48px,7vw,96px)}
  .rain{animation:rain .6s linear infinite}
  .rain.r2{animation-duration:.75s;animation-delay:-.3s}
  @keyframes rain{0%{transform:translate(0,-60px)}100%{transform:translate(-14px,120px)}}

  /* the photograph on the table, and the Archive's tags */
  .ph{width:min(1220px,97vw);display:flex;gap:16px;align-items:flex-start;-webkit-user-select:none;user-select:none}
  .ph-pic{position:relative;flex:1 1 0;background:#d9c7a4;padding:16px 16px 12px;box-shadow:0 22px 60px rgba(0,0,0,.7);transform:rotate(-.4deg)}
  .ph-pic svg{display:block;width:100%;height:auto}
  .ph-pic .back{position:absolute;left:16px;right:16px;top:16px;bottom:12px;display:none;overflow:auto}
  .ph-pic.flip .back{display:block}
  .ph-pic .back .doc{width:auto;margin:0;min-height:100%;box-sizing:border-box}
  .ph-slot{position:absolute;width:13.5%;min-height:40px;border:1.5px dashed rgba(60,40,20,.55);background:rgba(255,250,235,.35);border-radius:2px}
  .ph-pic.flip .ph-slot{visibility:hidden}
  .ph-side{flex:0 0 330px}
  .ph-tray{display:flex;flex-direction:column;gap:6px;min-height:290px;padding:10px;background:#2a1014 linear-gradient(160deg,#3a161c,#1e0a0e);border:1px solid #8a6a3a;border-radius:3px}
  .ph-tray h5{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.24em;color:#d9c08a}
  .ph-tag{display:block;padding:7px 10px 5px 26px;background:#fff;color:#1f2530;font-family:'Outfit',sans-serif;font-weight:500;font-size:14.5px;line-height:1.15;border-left:6px solid #c9302c;
    box-shadow:0 3px 6px rgba(0,0,0,.35);position:relative;cursor:grab}
  .ph-tag:before{content:'';position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:2px solid #9aa0aa}
  .ph-tag.held{outline:3px solid #e8c26a}
  .ph-slot .ph-tag{font-size:13px;padding:5px 6px 4px 20px}
  .ph-slot .ph-tag:before{left:5px}
  .ph .pmsg{font-size:17.5px;min-height:110px}
  .ph .flipb{margin-top:8px;width:100%;background:rgba(0,0,0,.4)}
</style>

    '<p>From Monday 2nd December the Bijou will show the new TALKING PICTURES, with the finest sound equipment.</p>' +
    '<p>You will have read of <i>The Jazz Singer</i> (1927), the American picture in which audiences heard Mr Al Jolson sing, and even speak, from the screen. Its sound came from large gramophone records, played in step with the film. Newer pictures carry their sound on the film itself.</p>' +

    theme: 'ghost', story: 'picture', storyTitle: 'Till the Lights Go Up', id: 'foyer', no: 'I', title: 'The Foyer',
    go: 'Go in out of the rain',
    intro: [
      'The Bijou Picture House, Castle Street, Delverton. Opened 1913. Closed 2019. To be pulled down at eight o&rsquo;clock tomorrow morning.',
      'You are from the County Film Archive, with a van, a list and a pair of cotton gloves. Somebody has told the Archive that there are old film cans in the projection box: nitrate film, which nobody may move but people like you.',
      'The last manager is waiting for you under the canopy, with a bunch of keys and a work lamp. She has something else to tell you, she says, and she would rather say it inside.'
    ],
    exit: {"next":"stalls","w":{"5714c969":"3b1244e7"}}, tags: {"b1":["3294ac4f"],"b2":["d015e1e7"],"b3":["b0ae64fd"],"f1":["1000bbf1"],"f2":["d5912a3c"],"f3":["68189016"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('f-file') || null; told = ER.flag('f-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('f-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#della').classList.toggle('ready', !told.della);
    $('#photo').classList.toggle('ready', !!(told.della && !nextFile && !told.opened));
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.della ? 1 : 0) + (told.prog && told.cut ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['Della is waiting at the doors of the stalls. It is nearly twenty to ten. Click the button at the bottom of the screen.']];
    if (!told.della) return ['della', ['Della has something to tell you before anything else. Click her: she is standing in the middle of the foyer with a work lamp.']];
    if (lock && lock.isOpen()) return ['tags', [
      'Start with what each person is holding. The programme in the frame says who lights you to your seat with a torch, who comes round with a tray, and who is at the piano.',
      'Turn the photograph over: Mr Eade wrote on the back. He says which of them wore a hat, and what the two operators had on.',
      'Two white coats, two operators. The newspaper says that Mr Coggins has been at the Bijou since 1913, so he is the older one, and that he is going to marry Miss Ferris. Which white coat is she holding on to?'
    ]];
    return ['photo', [
      'Della told you where to start: the staff photograph on the wall, to the right of the doors.',
      'Before you label it, read the three papers on the walls: the poster, the programme in the small gold frame, and the newspaper cutting under it. Between them they name everybody in the photograph.'
    ]];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('Six people on the front steps in 1929, with their names under them at last.'); return; }
    if (told.in) { busy = false; ER.say('The foyer of the Bijou, by the light of two work lamps. The rain is still coming down outside.'); return; }
    tell('in');
    ER.narrate([
      'The foyer smells of dust, damp carpet and, very faintly, of ninety years of popcorn. The electricity was cut off in 2019. Somebody has brought two work lamps.',
      '&ldquo;Della Fraser,&rdquo; says the somebody. &ldquo;I ran this place for eight years, and my gran ran it for twenty before me. I&rsquo;ll show you your cans. But first you had better know why the demolition men won&rsquo;t come in here after dark.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  function talkDella() {
    ER.talk({
      who: 'Della Fraser', role: 'The last manager of the Bijou', face: window.FACE('della'),
      lines: [
        { note: 'She puts her lamp down on the floor, so that it lights the ceiling.', a: '&ldquo;Every night at twenty to ten, the screen in there lights up. Ten seconds, perhaps. Writing on it, going far too fast to read. Then nothing. People see the light in the box window from the street.&rdquo;' },
        { q: 'Children with a torch? Bad wiring?', a: '&ldquo;The building has had no electricity for seven years. I have checked for children. I have checked for wiring. I have checked for students with phones. I am not a person who believes in ghosts. I would like that written down somewhere.&rdquo;' },
        { a: '&ldquo;And every morning one seat in the stalls is down. Always the same one. The cleaners used to put it up every night, and every morning it was down again. In the end Gran told them to leave it.&rdquo;' },
        { q: 'Which seat?', a: '&ldquo;You&rsquo;ll see. Gran&rsquo;s rule in this building was: you look before you&rsquo;re told. I&rsquo;m keeping to it.&rdquo;' },
        { a: '&ldquo;Tomorrow it all goes in a skip. Your Archive wants the cans. I want one thing before the skip: to know who it is. Start with the photograph by the doors. Gran always called them the Bijou sweethearts: our pianist and the young operator. Your Archive won&rsquo;t take a photograph without names on it, I suppose.&rdquo;' }
      ],
      clue: { id: 'della', title: 'Della: twenty to ten, and the seat that is down', kind: 'What she said' },
      done: function (seen) { if (!seen) return; tell('della'); paint(); ER.say('The staff photograph hangs to the right of the doors of the stalls. The programme and the cutting are in the frames beside it.'); }
    });
  }
  $('#della').addEventListener('click', function () {
    if (busy) return;
    if (!told.della) { talkDella(); return; }
    if (nextFile) { ER.say('&ldquo;Twenty to ten,&rdquo; says Della. &ldquo;Come on. I&rsquo;m not missing it for you.&rdquo;'); return; }
    ER.say('&ldquo;Names,&rdquo; says Della. &ldquo;Gran never wrote a name on anything if she could help it. It drove me mad.&rdquo;');
  });

  /* ---------- papers on the walls ---------- */
  $('#poster').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: POSTER, cls: 'prog', clue: { id: 'poster', title: 'The poster: Bess of the Light', kind: 'From the foyer' },
      done: function () { if (tell('poster')) ER.say('The last silent picture at the Bijou. &ldquo;Six reels,&rdquo; says Della. &ldquo;Somebody kept two of them. Your cans.&rdquo;'); } });
  });
  $('#prog').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PROG, cls: 'prog', clue: { id: 'prog', title: 'The programme: The Bijou Talks!', kind: 'From the foyer' },
      done: function () {
        PH.terms(['talkie', 'silent picture', 'operator', 'usherette']);
        if (tell('prog')) { paint(); ER.say('&ldquo;They thanked her,&rdquo; says Della, &ldquo;and then they put a gramophone in her place.&rdquo;'); }
      } });
  });
  $('#cutting').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CUT, cls: 'cutting', clue: { id: 'cutting', title: 'The Delverton Advertiser: film fire at the Bijou', kind: 'From the foyer' },
      done: function () {
        PH.terms(['nitrate', 'operating box', 'shutter']);
        if (tell('cut')) { paint(); ER.say('&ldquo;A slight technical hitch,&rdquo; says Della. &ldquo;Every manager in the country has said that. I&rsquo;ve said it.&rdquo;'); }
      } });
  });
  $('#photo').addEventListener('click', function () {
    if (busy) return;
    if (!told.della) { ER.say('Della is watching you. She wants to say something first.'); return; }
    if (nextFile) { ER.read({ html: labelHtml(), cls: 'label' }); return; }
    if (!lock) lock = makeLock();
    tell('opened'); paint(); lock.open();
  });
  PH.thing('#notice', 'demolition', 'A yellow notice on the glass: DEMOLITION. SITE CLOSED FROM 08.00, SAT 28 NOV. Somebody has added in pencil: &ldquo;and good riddance to the damp&rdquo;.', isBusy);
  PH.thing('#boxoff', 'box office', 'The box office: a brass grille, a ticket machine with five rolls of tickets in five colours, and the prices from the last year that anybody changed them. STALLS 1/3. CIRCLE 1/9.', isBusy);
  PH.thing('#kiosk', 'kiosk', function () {
    return told.kiosk ? 'The kiosk. Della has the red exercise book in her coat pocket now.' : 'The kiosk: a glass counter, empty sweet jars, a sign that says ICES. In the drawer, a school exercise book with a red cover. Della takes it before you can. &ldquo;Gran&rsquo;s,&rdquo; she says. &ldquo;Later. In the stalls.&rdquo;';
  }, isBusy, function () { tell('kiosk'); });
  PH.thing('#entrance', null, 'The rain is coming down on Castle Street. Across the road, a man at a bus stop is looking at the Bijou the way people look at a building that will not be there tomorrow.', isBusy);
  $('#doors').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.leave(nextFile); return; }
    ER.say('&ldquo;Not yet,&rdquo; says Della. &ldquo;Photograph first. We have till twenty to ten.&rdquo;');
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  function labelHtml() {
    return '<h4>County Film Archive &middot; item label</h4><p><b>Staff of the Bijou, Delverton, on the front steps, 10 August 1929.</b></p>' +
      '<p>Back row, left to right: Mr Basil Eade (manager, in a bowler hat); Miss Cissie Daly (kiosk, with her tray of ices); Mr Ernest Bardsley (second operator, in a white coat, looking away from the camera).</p>' +
      '<p>Front row, left to right: Miss Dolly Ferris (usherette, with her torch); Mr Albert Coggins (chief operator, in a white coat, with a moustache); Miss Effie Dorrell (pianist, with a roll of music).</p>' +
      '<p>Note: the label &ldquo;The Bijou sweethearts&rdquo;, added in 1969, points at Miss Ferris and Mr Coggins, who married in 1930.</p>';
  }

  /* ---------- the photograph: six tags for six people ---------- */
  function makeLock() {
    var placed = ER.flag('f-placed') || {}, wait = false;
    var box = ER.el('div', 'ph'), pic = ER.el('div', 'ph-pic'), side = ER.el('div', 'ph-side');
    /* where the tag goes, under each person (left and top, as a share of the picture) */
    var AT = { b1: [9, 46], b2: [38, 46], b3: [67, 46], f1: [5, 87], f2: [20, 87], f3: [73, 87] };
    pic.innerHTML = photoSvg() + '<div class="back"><div class="doc eade">' + BACK + '</div></div>';
    POS.forEach(function (p) { var d = ER.el('div', 'ph-slot'); d.setAttribute('data-p', p); d.style.left = AT[p][0] + '%'; d.style.top = AT[p][1] + '%'; pic.appendChild(d); });
    side.innerHTML = '<div class="ph-tray"><h5>COUNTY FILM ARCHIVE &middot; NAME TAGS</h5></div>' +
      '<button type="button" class="btn flipb" id="p-flip">Turn the photograph over</button><div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="p-go">Show Della</button></div>';
    box.appendChild(pic); box.appendChild(side);
    var tray = side.querySelector('.ph-tray');
    Object.keys(NAMES).forEach(function (k) {
      var t = ER.el('span', 'ph-tag dnd-item', NAMES[k]); t.setAttribute('data-n', k);
      var at = null; POS.forEach(function (p) { if (placed[p] === k) at = p; });
      (at ? pic.querySelector('.ph-slot[data-p="' + at + '"]') : tray).appendChild(t);
    });
    function msg(t) { side.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function read() {
      placed = {};
      POS.forEach(function (p) { var t = pic.querySelector('.ph-slot[data-p="' + p + '"] .ph-tag'); if (t) placed[p] = t.getAttribute('data-n'); });
      ER.flag('f-placed', placed);
      box.setAttribute('data-placed', POS.map(function (p) { return placed[p] || 'none'; }).join('-'));
    }
    ER.dnd(box, { item: '.ph-tag', slot: '.ph-slot', home: tray, lock: function () { return wait || !!nextFile; }, change: function () { read(); PH.sfx.card(); msg(''); } });
    side.querySelector('#p-flip').addEventListener('click', function () {
      pic.classList.toggle('flip'); ER.sfx.paper();
      this.textContent = pic.classList.contains('flip') ? 'Turn it back' : 'Turn the photograph over';
      if (pic.classList.contains('flip')) ER.addClue('back', 'The back of the photograph', BACK, 'eade', 'From the foyer');
    });
    side.querySelector('#p-go').addEventListener('click', tryIt);
    read();
    msg(Object.keys(placed).length ? 'The tags, as far as you have got with them.' : 'Six people on the front steps, and six tags from the Archive. Drag each tag to the place under a person, or click a tag and then the place.');
    /* what Della says about the first tag that is wrong: the things in their hands first, the two white coats last */
    var WHY = {
      f3: 'That young woman on the right is holding a roll of music. Who does the programme put &lsquo;at the piano&rsquo;?',
      f1: 'The girl on the left has a torch in her hand, not music. Gran got that wrong too. What does the programme say about torches? And the paper gives her name.',
      b2: 'The one at the back with a tray on a strap. Who comes round with a tray at every interval?',
      b1: 'Read the back of the photograph. Mr Eade says what he had on his head.',
      f2: 'Two white coats: the two operators. One is twenty-one. The other has been here since 1913, and he is going to marry the girl who has hold of his arm.',
      b3: 'Two white coats: the two operators. One is twenty-one. The other has been here since 1913, and he is going to marry the girl who has hold of his arm.'
    };
    function why() {
      var order = ['f3', 'f1', 'b2', 'b1', 'f2', 'b3'], i;
      for (i = 0; i < order.length; i++) if (!ER.check(order[i], placed[order[i]] || '')) return WHY[order[i]];
      return '';
    }
    function tryIt() {
      var left = tray.querySelectorAll('.ph-tag').length, file, w;
      if (wait || nextFile) return;
      read();
      if (left) { msg('&ldquo;' + (left === 1 ? 'One tag is' : left + ' tags are') + ' still in your hand,&rdquo; says Della. &ldquo;Your Archive doesn&rsquo;t take half a photograph, I&rsquo;m sure.&rdquo;'); return; }
      w = why();
      if (w) {
        ER.sfx.no(); POS.forEach(function (p) { if (!ER.check(p, placed[p] || '')) PH.flash(pic.querySelector('.ph-slot[data-p="' + p + '"]')); });
        msg('Della reads your tags, and taps one. &ldquo;' + (w || 'Not yet.') + '&rdquo;'); return;
      }
      file = ER.exit([POS.map(function (p) { return placed[p]; }).join('-')], { wait: true });
      if (!file) { msg('The doors will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('f-file', file);
      msg('Della reads the six tags, left to right, back row and front. Then she reads them again.');
      ER.addClue('photo', 'The staff photograph, with names', labelHtml(), 'label', 'From the foyer');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          '&ldquo;So Gran&rsquo;s sweethearts are Mr Coggins and Miss Ferris,&rdquo; says Della. &ldquo;Married in the spring of 1930, if the paper&rsquo;s right. She had the wrong pair for fifty years and never once asked.&rdquo;',
          'She holds the lamp up to the glass. &ldquo;And the pianist and the young operator are at opposite ends. Not even standing together.&rdquo; A pause. &ldquo;He isn&rsquo;t looking at the camera, is he? He&rsquo;s looking at her.&rdquo;',
          '&ldquo;Effie Dorrell. &lsquo;The Management thanks Miss Dorrell.&rsquo; They thanked her, and put a gramophone in her place.&rdquo; She looks at her watch. &ldquo;Twenty-five to ten. If you want to see the screen, it&rsquo;s now.&rdquo;'
        ], function () { busy = false; PH.terms(['projectionist', 'second house']); paint(); });
      }, 2400);
    }
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }

    }
    /* back row, on the top step */
    s += man(140, 230, { coat: '#3a2c20', hem: 60, extra: '<path d="M106 128h68v-8q0 -30 -34 -30t-34 30z" fill="#1e1610"/><path d="M98 130h84" stroke="#1e1610" stroke-width="7" stroke-linecap="round"/><path d="M128 200q12 10 24 0" stroke="#d9c29a" stroke-width="3" fill="none"/><path d="M116 214l48 -4" stroke="#1e1610" stroke-width="10" stroke-linecap="round"/>' });
    s += man(400, 236, { coat: '#5a4632', hem: 40, hair: '#6a4a2a', legs: '#5a4632', extra: '<path d="M376 134q24 -12 48 0v-8h-48z" fill="#2a1e14"/><path d="M362 192L400 232L438 192" stroke="#2a1e14" stroke-width="4" fill="none"/><rect x="360" y="226" width="80" height="16" rx="3" fill="#2a1e14"/><rect x="366" y="214" width="14" height="14" rx="3" fill="#e2cfa8"/><rect x="386" y="214" width="14" height="14" rx="3" fill="#e2cfa8"/><rect x="406" y="214" width="14" height="14" rx="3" fill="#e2cfa8"/><rect x="424" y="214" width="12" height="14" rx="3" fill="#e2cfa8"/>' });
    s += man(660, 218, { coat: '#f2ead6', hem: 70, turn: 7, hair: '#3a2a1c', extra: '<path d="M642 112q22 -20 50 -4l2 8h-54z" fill="#3a2a1c"/><path d="M636 116h66" stroke="#3a2a1c" stroke-width="5" stroke-linecap="round"/><path d="M660 170v116" stroke="#c9b48a" stroke-width="3"/><circle cx="660" cy="200" r="3" fill="#8a7a5a"/><circle cx="660" cy="232" r="3" fill="#8a7a5a"/>' });
    /* front row, on the pavement */
    s += man(110, 384, { coat: '#2a2018', hem: 70, hair: '#3a2416', legs: '#d9c29a', extra: '<rect x="94" y="268" width="32" height="14" rx="4" fill="#1e1610"/><path d="M60 342l-26 16" stroke="#2a2018" stroke-width="14" stroke-linecap="round"/><rect x="18" y="352" width="34" height="14" rx="3" fill="#1e1610"/><circle cx="18" cy="359" r="6" fill="#f2ead6"/><path d="M146 344q30 10 46 0" stroke="#2a2018" stroke-width="14" stroke-linecap="round"/>' });

  }
})();
