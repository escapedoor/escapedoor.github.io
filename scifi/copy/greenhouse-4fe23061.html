<style>
  body{--bg:#1a0c22;--accent:#ff7ae0;--font-display:'Rajdhani',sans-serif;--font-ui:'Rajdhani',sans-serif;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(26,10,32,.95);--tc-ink:#fbeefa;--cap-bg:rgba(26,10,32,.92);--cap-ink:#fff0fc;--panel:#22122a;--face-bg:#2c4a2a;--q-ink:#ffc8f2;--fade:#060208;--hud-bg:rgba(26,10,32,.84)}
  .tc-room{font-size:62px;font-weight:700;letter-spacing:.04em}
  .hbtn,.chip,.ov-x,.btn,.toast{font-size:15px;font-weight:600}
  .tk-name{font-family:'Rajdhani',sans-serif;font-size:28px}
  .glow{animation:glow 4s steps(2) infinite}
  @keyframes glow{50%{opacity:.86}}
  .sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  .sway:nth-child(2n){animation-delay:-2.2s}
  @keyframes sway{50%{transform:rotate(2.5deg)}}
  .drip{animation:drip 3.2s linear infinite}
  @keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:.8}80%{transform:translateY(60px);opacity:.8}100%{transform:translateY(70px);opacity:0}}
  #line.next .strips,#hand.next rect:first-child{animation:cnudge 1.7s ease-in-out infinite}

  /* the four pegs and the line */
  .pg{width:min(1180px,97vw);padding:12px 14px 12px;background:#2a1a30;border:1px solid #5a3a66;border-radius:8px;box-shadow:0 26px 70px rgba(0,0,0,.6);color:#fbeefa}
  .pg-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .pg-col{background:#1e1024;border:1px solid #4a2e56;border-radius:6px;padding:6px 6px 4px}
  .pg-col h6{margin:0 0 5px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;color:#ffb8f0;text-align:center}
  .pg-col h6 small{display:block;font-family:'Outfit',sans-serif;font-weight:300;font-size:12px;letter-spacing:0;color:#c8a8d0}
  .slot{min-height:54px;margin:0 0 5px;border:2px dashed rgba(255,170,240,.3);border-radius:4px}
  .slot.full{border-style:solid;border-color:rgba(255,170,240,.6)}
  .slot.bad{border-color:#ff6a5a;background:rgba(255,106,90,.12)}
  .pg-line{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-height:64px;margin-top:10px;padding:16px 8px 6px;border-top:3px solid #d8c8b0;border-radius:2px}
  .pg-line:before{content:'THE LINE';position:absolute;left:8px;top:-12px;padding:0 6px;background:#2a1a30;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.16em;color:#c8a8d0}
  .strip{position:relative;display:block;padding:7px 9px 6px;background:#fbf9f2;color:#22202a;border-radius:2px;font-family:'Outfit',sans-serif;font-weight:300;font-size:13px;line-height:1.3;
    cursor:grab;box-shadow:0 2px 0 rgba(0,0,0,.35);-webkit-user-select:none;user-select:none}
  .strip:before{content:'';position:absolute;left:50%;top:-9px;width:12px;height:16px;margin-left:-6px;background:#c8a060;border-radius:2px}
  .slot .strip{font-size:11.6px;line-height:1.25;padding:4px 6px 3px}
  .slot .strip:before{display:none}
  .strip.held{outline:3px solid #ff7ae0}
  .strip.fly{position:fixed;z-index:99;pointer-events:none;opacity:.92}
  .strip .to{display:none;margin:0 0 3px;padding:1px 4px;background:#e4e7ea;font-family:'Share Tech Mono',monospace;font-size:9.5px;line-height:1.2;color:#4a525c}
  .pg.shown .pg-line{display:none}
  .pg.shown .strip .to{display:block}
  .pg.shown .strip.odd{outline:3px solid #ffcf4a}
  .pg-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
  .pg-foot .pmsg{flex:1;color:#fbeefa;font-size:15.5px}
  .pg-foot .btn{--accent:#ff9ae8}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null;

  ER.init({
    theme: 'scifi', story: 'copy', storyTitle: 'Whilst You Were Out', id: 'greenhouse', no: 'III', title: 'The Greenhouse',
    go: 'Walk into the pink light',
    intro: [
      'In the galley you counted Liv&rsquo;s habits in six messages that are certainly hers. Whilst three times, while never; perhaps three times, maybe never; British spelling five times out of five; no short forms at all, because Grandpa&rsquo;s church is not a short form; three times with a dot, none with a colon; no exclamation marks; splendid twice; and 260 words in 26 sentences, ten words a sentence.',
      'Keiko has printed the messages in doubt. Before you count anything in them, she says, you need to know one more thing about Liv.',
      'It is a quarter past eight. The greenhouse is the brightest room on Mars.'
    ],
    exit: {"next":"suits","w":{"2ef4b032":"eb3d4692"}}, tags: {"a":["5fbcb789"],"b":["95d28ddf"],"c":["3f8e6aa6"],"d":["78521cd1"],"e":["8998ccd0"],"f":["71ec94d6"],"g":["073f0895"],"h":["fdbb3906"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('h-file') || null;
  var S = ER.flag('h-st') || { at: {} };
  function keep() { ER.flag('h-st', S); }

  var PEGS = [['kaja', 'Liv to Kaja', 'her daughter, on Earth'], ['friend', 'Liv to a friend', 'Keiko, for example'], ['boss', 'Liv to the Commander', 'her boss'], ['log', 'Liv&rsquo;s log', 'for whoever reads it in fifty years']];
  var HAND = '<h4>JUNIPER CREW HANDBOOK &middot; 7.2 &middot; WHO ARE YOU WRITING TO?</h4>' +
    '<p>Everyone writes differently to different readers. This is called <b>register</b>. Choose it for your reader, and keep to it.</p>' +
    '<p class="r"><b>THE LOG</b><span>is for whoever reads it in fifty years. No greeting and no name. What happened, when, how much. No feelings.</span></p>' +
    '<p class="r"><b>YOUR COMMANDER</b><span>Greet by rank. Facts first, then what you need. Full sentences. Your full name at the end.</span></p>' +
    '<p class="r"><b>EACH OTHER</b><span>As you like. Short is fine; so are jokes.</span></p>' +
    '<p class="r"><b>HOME</b><span>As you like. But remember that a message to Earth cannot be called back, and that the answer will take a long time.</span></p>' +
    '<h5>ONE EVENT IN THREE REGISTERS &middot; L. GUNDERSEN &middot; SOL 206</h5><div class="ex">' +
    CP.slip('SCIENCE LOG &middot; 14:35', 'Dust devil crossed the base at 14.20, moving from south-west to north-east. Width about 40 metres. Array output rose from 61% to 70% in four minutes. No damage. The panels are cleaner than after our brushing on Sol 205.') +
    CP.slip('TO: DR K. ISHIDA &middot; 14:40', 'Keiko, Did you see it? It went straight over your greenhouse. Your lettuces are now the cleanest lettuces on Mars. I want one of those at home. L.') +
    CP.slip('TO: COMMANDER J. KIRWAN &middot; 14:50', 'Commander, A dust devil crossed the base at 14.20. There is no damage. It cleaned the solar panels, and the array output has risen from 61% to 70%. I suggest we cancel the brushing planned for Sol 208. Liv Gundersen') +
    '</div>';
  var SIGN = '<h4>NO MARS SOIL IN HERE</h4><p>Mars soil contains perchlorates: salts that are harmful to people.</p>' +
    '<small>They were found by the Phoenix lander, near the north pole of Mars, in 2008. Our plants grow in water, or in soil that has been washed. Wash your hands after you come in from outside, and before you touch anything green.</small>';

  function hints() {
    if (nextFile) return ['go', ['Hugh is in the suit room with the messages he says prove that Liv is fine. Click the button at the bottom of the screen.']];
    if (!ER.flag('h-talk')) return ['talk', [
      'Keiko is behind her bench. Click on her and listen to the end.',
      'She will explain why the printer has done you a favour, and what to do with the strips on the line.'
    ]];
    if (!ER.flag('h-hand')) return ['hand', [
      'The green handbook binder is on Keiko&rsquo;s bench, next to the printer. Read it before the line.',
      'It shows how Liv wrote about one dust devil to three readers: the log, Keiko, the Commander. Look at how each one starts, how it ends, and what comes first.'
    ]];
    return ['line', [
      'Hang each strip on the peg for the voice it is written in, not for the name inside it. Liv&rsquo;s messages to Kaja are on the fridge in the galley and in your notebook; the other three voices are in the handbook.',
      'Look at the start and the end of each strip: Hei and a kiss, a name and a comma and L., Commander and her full name, or nothing at all. Then look at what comes first: news, a joke, facts and a request, or numbers and times.',
      'Four strips are in the voice Liv uses for Kaja, even though some have other names in them. One is in her voice for a friend, one in her voice for the Commander, and two have no greeting and no name, only numbers and times, like her log.'
    ]];
  }
  function paint() {
    $('#hand').setAttribute('class', 'hot' + (ER.flag('h-talk') && !ER.flag('h-hand') ? ' next' : ''));
    $('#line').setAttribute('class', 'hot' + (!nextFile && ER.flag('h-talk') && ER.flag('h-hand') ? ' next' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function isBusy() { return busy; }
  function begin() {
    paint();
    if (nextFile) { ER.say('The greenhouse. The strips are on their pegs, with their headers beside them.'); return; }
    if (ER.flag('h-seen')) { ER.say('The greenhouse: Keiko, her bench with the handbook, the jammed printer, and the strips on the line.'); return; }
    busy = true; ER.flag('h-seen', 1);
    ER.narrate([
      'Rows of lettuces, tomatoes and beans glow under pink-purple lamps. The air is warm and wet, and smells of earth that was never on Earth.',
      'Across the room, from rack to rack, runs a washing line. On it, held by clothes pegs, hang eight strips of paper: messages from Liv&rsquo;s account, with nothing at the top to say who they were sent to.'
    ], function () { busy = false; paint(); });
  }

  $('#keikoG').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Right style, wrong reader,&rdquo; says Keiko. &ldquo;Now go and see Hugh. Gently.&rdquo;'); return; }
    if (ER.flag('h-talk')) { ER.say('&ldquo;Hang each strip by its voice,&rdquo; says Keiko, &ldquo;not by the name in it.&rdquo;'); return; }
    ER.talk({
      who: CAST.keiko.who, role: CAST.keiko.role, face: FACE('keiko'),
      lines: [
        { note: 'Keiko pushes her glasses up with a wet thumb.',
          a: '&ldquo;The printer cut every message off at the top, so we do not know who each one was sent to. Good. For once, that helps.&rdquo;' },
        { q: 'Why does that help?',
          a: '&ldquo;Because Liv has four voices: one for Kaja, one for friends, one for the Commander, one for the log. The handbook page on my bench shows three of them, about one dust devil, and you have seen the fourth on the fridge. Hang each strip on the peg for the voice it is written in. Not the name in it. The voice.&rdquo;' },
        { q: 'And then?',
          a: '&ldquo;Then I lay the headers next to them. The printer kept those, of course. And we see who each message was really sent to.&rdquo;' },
        { q: 'Why is the light pink?',
          a: '&ldquo;Plants use mostly red and blue light, and very little green, so we give them red and blue. Together they look pink. It is not romantic. It is efficient.&rdquo;' }
      ],
      clue: { id: 'keiko2', title: 'Keiko, in the greenhouse', kind: 'What she said' }, last: 'Look at the line',
      done: function (seen) { if (!seen) return; ER.flag('h-talk', 1); CP.learn(['register', 'voice', 'grow light']); paint(); ER.say('The green handbook is on the bench, next to the printer.'); }
    });
  });
  $('#hand').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: HAND, cls: 'hbk', clue: { id: 'hand', title: 'Who are you writing to?', kind: 'Crew handbook' }, done: function () { ER.flag('h-hand', 1); CP.learn(['register', 'greeting', 'sign-off', 'rank']); paint(); } });
  });
  $('#sign').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SIGN, cls: 'sign', clue: { id: 'soil', title: 'No Mars soil in here', kind: 'Sign' }, done: function () { CP.learn(['perchlorate']); } });
  });
  CP.thing('#lemon', 'lemon tree', 'A small lemon tree in a pot, with exactly three lemons. A label in Keiko&rsquo;s writing: DO NOT WATER. THIS MEANS YOU, HUGH.', isBusy);
  CP.thing('#tank', 'tank', 'Water tanks, with roots trailing in them like pale hair. The water goes round and round: on Mars, nothing is thrown away.', isBusy);
  CP.thing('#printer', null, 'The greenhouse printer, still jammed. The torn-off headers are lying in its tray in a neat pile: TO, SOL, TIME, eight times over.', isBusy);

  /* ---------- the line ---------- */
  var HELPER = { a: 1, d: 1, h: 1 };
  function why(id, peg) {
    var s = CP.STRIPS.filter(function (x) { return x.id === id; })[0];
    if (id === 'e') return 'Hei Kaja at the top and Mum x at the bottom: there is only one person Liv writes to like that.';
    if (id === 'c') return 'Commander at the top, facts first, then what she would like, then her full name. Which voice is that?';
    if (id === 'g') return 'A name and a comma, a dry joke, and L. at the end. Look at the dust devil note to Keiko in the handbook.';
    if (id === 'b' || id === 'f') return peg === 'boss' ? 'Facts and numbers, yes. But where is &lsquo;Commander&rsquo;, and where is her full name? Which of her voices has no greeting and no name at all?' : 'No greeting, no name, just numbers and times with a dot. Which voice is that?';
    if (HELPER[id]) return peg === 'boss' ? 'Is that Liv&rsquo;s voice for the Commander? Commander at the top, facts first, her full name at the end. Who does she say Hei to, and who gets a kiss?' :
      peg === 'friend' ? 'Hei, and a kiss at the end: is that how Liv writes to Keiko? Look at her note about the dust devil.' : 'Look at how it starts and how it ends. Which of Liv&rsquo;s voices is it written in?';
    return s ? 'Read that one again: how does it start, and how does it end?' : '';
  }
  function openLine() {
    var box = ER.el('div', 'pg'), done = false;
    box.innerHTML = '<div class="pg-cols">' + PEGS.map(function (p) {
      var s = '<div class="pg-col" data-peg="' + p[0] + '"><h6>' + p[1] + '<small>' + p[2] + '</small></h6>', i;
      for (i = 0; i < 4; i++) s += '<div class="slot" data-s="' + p[0] + i + '"></div>';
      return s + '</div>';
    }).join('') + '</div><div class="pg-line"></div>' +
      '<div class="pg-foot"><p class="pmsg"></p><button type="button" class="btn" id="h-check">Show Keiko</button></div>';
    var tray = box.querySelector('.pg-line'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    CP.STRIPS.forEach(function (s) {
      var n = ER.el('div', 'strip dnd-item', '<div class="to">' + s.to + '</div>' + s.text); n.setAttribute('data-id', s.id);
      var at = null, k; for (k in S.at) if (S.at[k] === s.id) at = k;
      (at ? box.querySelector('.slot[data-s="' + at + '"]') : tray).appendChild(n);
    });
    function read() {
      var o = {}, where = {};
      ER.$$('.slot', box).forEach(function (sl) { var t = sl.querySelector('.strip'); sl.classList.toggle('full', !!t); sl.classList.remove('bad'); if (t) { o[sl.getAttribute('data-s')] = t.getAttribute('data-id'); where[t.getAttribute('data-id')] = sl.getAttribute('data-s').replace(/\d$/, ''); } });
      return { at: o, peg: where };
    }
    ER.dnd(box, { item: '.strip', slot: '.slot', home: tray, change: function () { S.at = read().at; keep(); CP.sfx.peg(); }, lock: function () { return done; } });
    read();
    box.querySelector('#h-check').addEventListener('click', function () {
      if (done) return;
      var r = read(), ids = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'], i, bad = null;
      if (!Object.keys(r.peg).length) { msg('&ldquo;On the pegs first,&rdquo; says Keiko. &ldquo;Drag a strip, or click it and then a space.&rdquo;'); return; }
      if (Object.keys(r.peg).length < 8) { msg('&ldquo;All eight,&rdquo; says Keiko. &ldquo;Every strip has a voice.&rdquo;'); ER.shake(tray); return; }
      for (i = 0; i < ids.length; i++) if (!ER.check(ids[i], r.peg[ids[i]])) { bad = ids[i]; break; }
      if (bad) {
        CP.bump('miss'); CP.sfx.hm();
        var n = box.querySelector('.strip[data-id="' + bad + '"]'); n.parentNode.classList.add('bad');
        msg(why(bad, r.peg[bad])); return;
      }
      var file = ER.exitOk([ids.map(function (k) { return r.peg[k]; }).join('|')]);
      if (!file) { msg('&ldquo;Hm,&rdquo; says Keiko. &ldquo;Look again.&rdquo;'); return; }
      done = true; nextFile = file; ER.flag('h-file', file); CP.done('greenhouse'); busy = true;
      ER.$$('.strip', box).forEach(function (n) {
        var to = n.querySelector('.to').textContent, peg = r.peg[n.getAttribute('data-id')];
        var odd = (/COMMANDER/.test(to) && peg !== 'boss') || (/ISHIDA/.test(to) && peg !== 'friend') || (/KAJA/.test(to) && peg !== 'kaja');
        n.classList.toggle('odd', odd);
      });
      box.classList.add('shown');
      CP.mine('voices', 'Four voices, eight strips', '<p>To Kaja: Hei Kaja, news, Mum x (sols to go). To a friend: a name and a comma, a joke, L. To the Commander: Commander, facts first, then a request, Liv Gundersen. The log: no greeting, no name, numbers, times with a dot.</p>' +
        '<p>Three strips are in her voice for Kaja but were sent to the Commander (Sol 211, 22:33 and Sol 213, 16:58) and to Keiko (Sol 212, 10:31): right style, wrong reader.</p>' +
        '<p>The two short ones (Sol 212, 03:14 and Sol 213, 21:41) are in her log voice, sent to all crew: Liv in a hurry, not a holding note.</p>', true);
      msg('Keiko lays the torn-off headers beside the strips, one by one.');
      ER.sfx.paper();
      setTimeout(function () { ER.closeAll(); CP.solved(); paint(); after(); }, 4200);
    });
    msg(Object.keys(S.at).length ? 'The strips are where you left them.' : 'Hang each strip by the voice it is written in. Drag it, or click it and then a space.');
    ER.open('ov-lock', box);
  }
  $('#line').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The strips, on their pegs. Three in Liv&rsquo;s voice for Kaja were sent to the Commander and to Keiko.'); return; }
    if (!ER.flag('h-talk')) { ER.say('Eight strips of paper on a washing line. Talk to Keiko first.'); return; }
    if (!ER.flag('h-hand')) { ER.say('&ldquo;Read the handbook first,&rdquo; says Keiko. &ldquo;It is on the bench.&rdquo;'); return; }
    openLine();
  });
  function after() {
    ER.narrate([
      'Two of the strips in Liv&rsquo;s voice for Kaja were sent to the Commander. A third went to Keiko herself. &ldquo;Hei Joss,&rdquo; Keiko reads. &ldquo;Liv has never once called the Commander Joss in a message. And she has never sent me a kiss in her life.&rdquo;',
      '&ldquo;Right style, wrong reader,&rdquo; she says. &ldquo;That is how Liv writes to a thirteen-year-old. Whatever wrote these learnt Liv from her letters to Kaja, because that is most of what Liv writes. It knows one voice, and it uses it for everybody.&rdquo;',
      'The two short strips went to all crew. &ldquo;No greeting, no name, numbers and times with a dot. That is not a holding note. A holding note says <i>she will reply soon</i>. That is her log voice. That is Liv in a hurry.&rdquo;',
      '&ldquo;It is not proof,&rdquo; she adds. &ldquo;Hugh will say she was tired, or cold, or joking. He is in the suit room, and he has pinned up the messages he says prove she is fine. Let us look at what they say, not how they say it.&rdquo;'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
