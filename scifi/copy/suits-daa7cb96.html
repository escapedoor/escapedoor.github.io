<style>
  body{--bg:#3a3e44;--accent:#ff8a2a;--font-display:'Saira Stencil One',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(28,30,34,.96);--tc-ink:#f4f2ec;--cap-bg:rgba(28,30,34,.93);--cap-ink:#f8f6f0;--panel:#24272c;--face-bg:#4a2e1c;--q-ink:#ffc890;--fade:#050506;--hud-bg:rgba(28,30,34,.84)}
  .tc-room{font-size:58px;font-weight:400;letter-spacing:.06em}
  .tk-name{font-family:'Saira Stencil One',sans-serif;font-weight:400;font-size:25px}
  .flick{animation:flick 7s steps(1) infinite}
  @keyframes flick{0%,92%,96%{opacity:1}94%,98%{opacity:.4}}
  .dust{animation:dust 9s linear infinite}
  @keyframes dust{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
  #pins.next .papers,#acard.next rect:first-child{animation:cnudge 1.7s ease-in-out infinite}

  /* Hugh's corkboard */
  .cb{width:min(1100px,97vw);padding:16px 18px 12px;background:#b5844e;border:10px solid #7a5430;border-radius:4px;box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .cb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .pp{position:relative;padding:10px 14px 10px;background:#fbfbf7;color:#1e232b;box-shadow:0 3px 0 rgba(0,0,0,.3);font-family:'Outfit',sans-serif;font-weight:300;font-size:15px;line-height:1.3}
  .pp:before{content:'';position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a6a,#b42c1a)}
  .pp:nth-child(1){transform:rotate(-.8deg)}.pp:nth-child(2){transform:rotate(.7deg)}.pp:nth-child(3){transform:rotate(.5deg)}.pp:nth-child(4){transform:rotate(-.6deg)}
  .pp h6{margin:0 0 5px;padding:2px 6px;background:#e4e7ea;font-family:'Share Tech Mono',monospace;font-weight:normal;font-size:11px;letter-spacing:.04em;color:#59616c}
  .pp.note{background:#fff8b0}
  .pp.note .ln{font-family:'Caveat',cursive;font-weight:700;font-size:21px;line-height:1.1}
  .ln{display:block;width:100%;margin:0;padding:3px 6px;border:0;border-radius:3px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;position:relative}
  .ln:hover{background:rgba(255,138,42,.16)}
  .ln.x{text-decoration:line-through;text-decoration-color:#d8281a;text-decoration-thickness:3px;background:rgba(216,40,26,.08)}
  .pp.bad{outline:3px solid #d8281a}
  .cb-foot{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 12px;background:rgba(30,20,10,.55);border-radius:4px}
  .cb-foot .pmsg{flex:1;color:#fff4e4;font-size:15.5px}
  .cb-foot .btn{--accent:#ffcf8a}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null;

  ER.init({
    theme: 'scifi', story: 'copy', storyTitle: 'Whilst You Were Out', id: 'suits', no: 'IV', title: 'The Suit Room',
    go: 'Go through to the airlock',
    intro: [
      'In the greenhouse you hung eight strips by the voice they were written in, not by the name in them. Liv has four voices: for Kaja (Hei Kaja, Mum x), for a friend (a name, a joke, L.), for the Commander (Commander, facts first, her full name) and for the log (no greeting, numbers). Three cheerful strips were in her voice for Kaja, but were sent to the Commander and to Keiko: right style, wrong reader. The two short strips were in her log voice: Liv in a hurry.',
      'That is suspicious, Keiko said, but it is not proof. Hugh Lattimer, the engineer, says the cheerful messages prove that Liv is fine. He has pinned them up.',
      'It is twenty past ten. The suit room smells of rubber and of dust.'
    ],
    exit: {"next":"power","w":{"f76cf7e7":"89aba4c5"}}, tags: {"p1":["7d5fb434"],"p2":["3989f9b2"],"p3":["07801da5"],"p4":["a38a7e1d"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('s-file') || null;
  var S = ER.flag('s-st') || { x: {} };
  function keep() { ER.flag('s-st', S); }

  var PAPERS = [
    { id: 'p1', head: 'TO: COMMANDER J. KIRWAN &middot; ARRIVED SOL 211, 22:33', lines: ['Hei Joss!', 'Don&rsquo;t worry about me &mdash; I&rsquo;m absolutely fine.', 'The link&rsquo;s probably just a loose cable; I&rsquo;ll have a look in the morning.', 'The wind was howling so hard last night that it nearly blew the Igloo over!', 'Splendid evening otherwise. Liv x'] },
    { id: 'p2', head: 'TO: DR K. ISHIDA &middot; ARRIVED SOL 212, 10:31', lines: ['Hei Keiko!', 'Toasty warm, thanks &mdash; the heater&rsquo;s purring away.', 'I had a lovely long video call with Kaja this morning, and she sounds so grown up!', 'Maybe I&rsquo;ll stay out here a little longer; it&rsquo;s so peaceful.', 'Splendid! Liv x'] },
    { id: 'p3', head: 'HOMEWARD &middot; TO KAJA GUNDERSEN &middot; SENT SOL 213 &middot; FORWARDED BY KAJA', lines: ['Hei Kaja,', 'The storm is still far away, and the sky is the colour of milky tea.', 'Perhaps it will pass us by.', 'Whilst I wait, I am reading Grandpa&rsquo;s old detective books again.', 'Mum x (288 sols to go)'] },
    { id: 'p4', head: 'HUGH&rsquo;S NOTE FOR THE COMMANDER &middot; SOL 214', note: 1, lines: ['Joss &mdash;', 'At 09.55 I asked Mission Control whether Liv&rsquo;s helper is set to family only.', 'Their answer came back at 10.00: family only, short holding notes.', 'So the short scraps are the helper, and the long messages are Liv&rsquo;s.', 'H.'] }
  ];
  var WHY = {
    p1: { 1: 'A greeting cannot be untrue. It can only be in the wrong voice.', 2: 'Perhaps she felt fine at 22.33. You cannot prove that line false from here.', 3: 'A guess about a cable. Wrong, perhaps, but not impossible.', 5: 'Splendid evening: a matter of taste.' },
    p2: { 1: 'A greeting cannot be untrue. It can only be in the wrong voice.', 2: 'She might be warm: the heater was on low. Not impossible.', 4: 'Maybe and I&rsquo;ll are not Liv&rsquo;s habits, true. But Hugh will say she was tired. Strike what cannot be <i>true</i>, whoever wrote it.', 5: 'Splendid and a kiss: the wrong voice for Keiko, but not an untruth.' },
    p3: { 1: 'A greeting cannot be untrue.', 2: 'On Sol 213 the storm was still far away, and dust does make the sky look like milky tea. Not impossible.', 3: 'A hope cannot be false.', 4: 'She may well have the books with her. You cannot know that she has not.' },
    p4: { 1: 'That is only his greeting.', 2: 'He may well have asked. Asking is possible.', 4: 'That is his conclusion. It may be wrong, but it is not impossible in itself. What does he say happened that cannot happen?', 5: 'That is only his initial.' }
  };
  var AIR = '<h4>BEFORE THE OUTER DOOR</h4>' +
    '<p>Outside, the air is about <b>95% carbon dioxide</b>, with a little nitrogen and argon and almost no oxygen. Its pressure is about <b>0.6% of the air pressure on Earth</b>: far too thin to breathe, and too thin to keep you warm. Nobody goes out without a suit. Ever.</p>' +
    '<svg viewBox="0 0 600 64" aria-hidden="true"><text x="0" y="20" font-family="Share Tech Mono" font-size="13" fill="#f2f0e6">EARTH</text><rect x="70" y="8" width="430" height="16" fill="#3a8ad8"/><text x="508" y="21" font-family="Share Tech Mono" font-size="13" fill="#f2f0e6">101 kPa</text>' +
    '<text x="0" y="52" font-family="Share Tech Mono" font-size="13" fill="#f2f0e6">MARS</text><rect x="70" y="40" width="3" height="16" fill="#f2c230"/><text x="82" y="53" font-family="Share Tech Mono" font-size="13" fill="#f2c230">0.6 kPa</text></svg>' +
    '<p>Because the air is so thin, wind has very little push. A <b>100 km/h wind on Mars pushes about as hard as a 12 km/h breeze on Earth</b>. It will not knock over a person, a rover or a hut. The danger in a storm is the dust: it gets into seals, joints and power units, and it hides the Sun from the solar panels.</p>' +
    '<p>It is cold. On an average day the air is about −60 °C, and much colder at night.</p>' +
    '<p><b>Close the inner door. Check your partner&rsquo;s seals. Then, and only then, open the outer door.</b></p>';

  function hints() {
    if (nextFile) return ['go', ['Hugh has gone to the power room, too fast. Keiko says follow him, gently. Click the button at the bottom of the screen.']];
    if (!ER.flag('s-talk')) return ['talk', [
      'Hugh is standing between his corkboard and the airlock door. Click on him and listen to the end.',
      'He thinks the cheerful messages prove that Liv is fine. Listen to what he says about Mission Control, and about the wrist pads.'
    ]];
    if (!ER.flag('s-air')) return ['air', [
      'Read the black and yellow card beside the airlock door before you look at Hugh&rsquo;s papers.',
      'It is about the air outside: what it is made of, how thin it is, and what that means for the wind.'
    ]];
    return ['pins', [
      'In each of the four papers on the corkboard, strike the one line that cannot be true, whoever wrote it. Not the line that sounds least like Liv. Your notebook has what you need: the light-time card, the airlock card, the clock card from the galley.',
      'Paper 1: what can wind on Mars do, and what can it not? Paper 2: what does the light-time card say about talking to Earth? Paper 3: work out how many sols were left to go on Sol 213. Paper 4: how long must an answer from Earth take?',
      'Thin air pushes very gently, so no Mars wind blows a hut over. Nobody can have a live call with Earth. On Sol 213 the countdown should say 499 − 213. And an answer from Mission Control needs at least 25 minutes after the question.'
    ]];
  }
  function paint() {
    $('#acard').setAttribute('class', 'hot' + (ER.flag('s-talk') && !ER.flag('s-air') ? ' next' : ''));
    $('#pins').setAttribute('class', 'hot' + (!nextFile && ER.flag('s-talk') && ER.flag('s-air') ? ' next' : ''));
    $('#hughG').style.display = nextFile ? 'none' : '';
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function isBusy() { return busy; }
  function begin() {
    paint();
    if (nextFile) { ER.say('The suit room. Four red lines on Hugh&rsquo;s corkboard. Hugh has gone.'); return; }
    if (ER.flag('s-seen')) { ER.say('The suit room: Hugh, his corkboard, the airlock door and its card, the suits, the wrist pad on the bench.'); return; }
    busy = true; ER.flag('s-seen', 1);
    ER.narrate([
      'The spare suits hang on the wall like tired astronauts, and one hook is empty. Through the round window in the airlock door the sky is pink-butterscotch, and the brown wall in the south is a little taller than it was at breakfast.',
      'Hugh Lattimer, the base engineer, is checking the seals on two of the suits, just in case. On the corkboard behind him he has pinned up four papers.'
    ], function () { busy = false; paint(); CP.sfx.hiss(1.2); });
  }

  $('#hughG').addEventListener('click', function () {
    if (busy) return;
    if (ER.flag('s-talk')) { ER.say('&ldquo;Read them,&rdquo; says Hugh, not looking up. &ldquo;Perfectly normal. Liv&rsquo;s fine.&rdquo;'); return; }
    ER.talk({
      who: CAST.hugh.who, role: CAST.hugh.role, face: FACE('hugh'),
      lines: [
        { note: 'Thirty-odd, a ginger beard, a head torch pushed up on his forehead, and orange overalls with more pockets than anybody needs. He talks fast when he is uneasy, and he is talking fast.',
          a: '&ldquo;Look, I&rsquo;ve known Liv two hundred sols. Those long messages are Liv. Splendid every other line! The short scraps are Homeward&rsquo;s holding notes. I set it up for short holding notes for Kaja, like she asked.&rdquo;' },
        { q: 'Kaja says some answers came too fast.',
          a: '&ldquo;So the helper sends Kaja a few quick notes. That&rsquo;s its job. Doesn&rsquo;t mean it writes to us. I checked with Mission Control this morning, too. It&rsquo;s on the board.&rdquo;' },
        { q: 'What are these papers?',
          a: '&ldquo;Proof. Two of Liv&rsquo;s messages to us, perfectly normal. One Kaja forwarded this morning: even she says it sounds just like her mum. And my note for Joss. Read them.&rdquo;' },
        { q: 'Why are the suits ready?',
          a: '&ldquo;Joss&rsquo;s orders. In case.&rdquo; He doesn&rsquo;t look up. &ldquo;And mind the wrist pads. They&rsquo;re American: they change every <i>metres</i> to <i>meters</i>, and you can&rsquo;t switch it off. Liv hates hers.&rdquo;' }
      ],
      clue: { id: 'hugh1', title: 'Hugh, in the suit room', kind: 'What he said' }, last: 'Read the papers',
      done: function (seen) { if (!seen) return; ER.flag('s-talk', 1); CP.learn(['seal', 'wrist pad', 'airlock']); paint(); ER.say('The card about the air is beside the airlock door. The papers are on the corkboard.'); }
    });
  });
  $('#acard').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: AIR, cls: 'air', clue: { id: 'air', title: 'Before the outer door', kind: 'Airlock card' }, done: function () { ER.flag('s-air', 1); CP.learn(['carbon dioxide', 'pressure', 'airlock', 'breeze']); paint(); } });
  });
  $('#pad').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'wrist pad'); ER.flag('s-pad', 1);
    CP.mine('pad', 'The suit wrist pads', '<p>A sticker on the pad: KEYBOARD: US ENGLISH. SPELLING CHECKER: ON.</p><p>It changes metres to meters and kilometres to kilometers, and it cannot be switched off. Liv hates hers.</p><p>So a message typed on a suit can have American spelling, whoever typed it.</p>');
    ER.say('A suit wrist pad, with a tiny keyboard for gloved fingers. The sticker says: KEYBOARD: US ENGLISH. SPELLING CHECKER: ON. Underneath, in Liv&rsquo;s neat writing: <i>It is metres.</i>');
  });
  CP.thing('#eva', null, 'EVA CONDITIONS &middot; SOL 214. DUST: RISING. SUN: DIMMER EVERY HOUR. TRACK SOUTH: OPEN UNTIL ABOUT 19.00. AFTER THAT, NOBODY DRIVES.', isBusy);
  CP.thing('#gauge', 'pressure', 'The outside pressure gauge: 0.6 kPa. Under it, somebody has written in pencil: EARTH 101.', isBusy);
  CP.thing('#door', 'airlock', 'Through the round window: rocks the colour of rust, a pink-butterscotch sky, and in the south a brown wall that is a little taller than at breakfast.', isBusy);
  CP.thing('#hook', null, 'An empty hook with a label: L.G. Liv&rsquo;s suit is at the Igloo, with Liv.', isBusy);
  CP.thing('#brush', null, 'The dust brushes. Everyone brushes their suit before they come in, and the dust comes in anyway. It is finer than flour and gets into everything.', isBusy);

  /* ---------- the corkboard ---------- */
  function openPins() {
    var box = ER.el('div', 'cb'), done = false;
    box.innerHTML = '<div class="cb-grid">' + PAPERS.map(function (p) {
      return '<div class="pp' + (p.note ? ' note' : '') + '" data-p="' + p.id + '"><h6>' + p.head + '</h6>' + p.lines.map(function (l, i) {
        return '<button type="button" class="ln" data-l="' + (i + 1) + '">' + l + '</button>';
      }).join('') + '</div>';
    }).join('') + '</div><div class="cb-foot"><p class="pmsg"></p><button type="button" class="btn" id="s-show">Show Hugh</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() {
      ER.$$('.pp', box).forEach(function (pp) { var x = S.x[pp.getAttribute('data-p')]; ER.$$('.ln', pp).forEach(function (b) { b.classList.toggle('x', +b.getAttribute('data-l') === x); }); });
    }
    ER.$$('.ln', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (done) return;
        var p = b.closest('.pp').getAttribute('data-p'), l = +b.getAttribute('data-l');
        S.x[p] = S.x[p] === l ? 0 : l; CP.sfx.pen(); keep(); ER.$$('.pp', box).forEach(function (o) { o.classList.remove('bad'); }); show();
      });
    });
    box.querySelector('#s-show').addEventListener('click', function () {
      if (done) return;
      ER.$$('.pp', box).forEach(function (o) { o.classList.remove('bad'); });
      var ids = ['p1', 'p2', 'p3', 'p4'], i;
      if (ids.every(function (k) { return !S.x[k]; })) { msg('&ldquo;Go on, then,&rdquo; says Hugh. &ldquo;Show me one line that can&rsquo;t be true.&rdquo;'); return; }
      for (i = 0; i < ids.length; i++) if (!S.x[ids[i]]) { msg('&ldquo;All four,&rdquo; says Hugh. &ldquo;If you&rsquo;re going to call me wrong, do it properly.&rdquo;'); ER.shake(box.querySelector('.pp[data-p="' + ids[i] + '"]')); return; }
      for (i = 0; i < ids.length; i++) if (!ER.check(ids[i], String(S.x[ids[i]]))) {
        CP.bump('miss'); CP.sfx.hm();
        box.querySelector('.pp[data-p="' + ids[i] + '"]').classList.add('bad');
        msg('Paper ' + (i + 1) + ': ' + ((WHY[ids[i]] || {})[S.x[ids[i]]] || 'Could that line be true? Then it is not the one.')); return;
      }
      var file = ER.exitOk([ids.map(function (k) { return S.x[k]; }).join('|')]);
      if (!file) { msg('&ldquo;Hm,&rdquo; says Hugh.'); return; }
      done = true; nextFile = file; ER.flag('s-file', file); CP.done('suits'); busy = true;
      CP.mine('lines', 'Four lines that cannot be true', '<p>1. &ldquo;The wind nearly blew the Igloo over&rdquo;: Mars air is too thin; even a strong wind pushes gently.</p><p>2. &ldquo;A lovely long video call with Kaja&rdquo;: there is no live talk with Earth.</p>' +
        '<p>3. &ldquo;288 sols to go&rdquo; on Sol 213: it should be 499 − 213 = 286. 288 was right on Sol 211. It copied the number and forgot to count.</p><p>4. Hugh&rsquo;s &ldquo;answer at 10.00&rdquo; to a question at 09.55: an answer from Earth needs at least 25 minutes. It was the automatic receipt from our own mail server.</p>' +
        '<p>Paper 3 is perfect Liv in style, and wrong in fact.</p>', true);
      msg('Hugh reads the four red lines, one after another.');
      setTimeout(function () { ER.closeAll(); CP.solved(); paint(); after(); }, 2200);
    });
    show();
    msg(Object.keys(S.x).some(function (k) { return S.x[k]; }) ? 'Your red lines are where you left them.' : 'In each paper, strike the one line that cannot be true, whoever wrote it.');
    ER.open('ov-lock', box);
  }
  $('#pins').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Hugh&rsquo;s corkboard, with four red lines on it.'); return; }
    if (!ER.flag('s-talk')) { ER.say('A corkboard with four papers on it. Hugh is standing in front of it. Talk to him first.'); return; }
    if (!ER.flag('s-air')) { ER.say('Read the card beside the airlock door first. It is about the air outside.'); return; }
    openPins();
  });
  function after() {
    $('#hughG').style.display = '';
    ER.narrate([
      '&ldquo;The wind,&rdquo; says Hugh slowly. &ldquo;Fine. Liv knows the air out there better than anyone. She&rsquo;d never write that. And the video call: no. You can&rsquo;t. Nobody can.&rdquo;',
      'He stops at Kaja&rsquo;s. &ldquo;Two hundred and eighty-eight sols to go, on Sol 213.&rdquo; He works it out on his fingers: 499 take away 213. &ldquo;Two hundred and eighty-six. That&rsquo;s the number from Sol 211. It copied the number and forgot to count. And it&rsquo;s the best copy of all: whilst, perhaps, colour, the lot.&rdquo;',
      'Last, his own note. He goes red to the ears. &ldquo;The answer at 10.00 was the automatic receipt from our own mail server. <i>Request received.</i> I read it as yes.&rdquo; He looks at the floor. &ldquo;Mission Control&rsquo;s real answer can&rsquo;t be here before 10.20. Can it.&rdquo;',
      '&ldquo;I need to check something in the power room,&rdquo; he says, and goes, much too fast. Keiko, in the doorway, watches him leave. &ldquo;Follow him,&rdquo; she says. &ldquo;Gently.&rdquo;'
    ], function () { busy = false; $('#hughG').style.display = 'none'; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
