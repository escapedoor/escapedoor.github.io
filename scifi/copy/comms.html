<style>
  body{--bg:#0a111d;--accent:#5fe3d2;--font-display:'Orbitron',sans-serif;--font-ui:'Share Tech Mono',monospace;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(8,14,24,.96);--tc-ink:#e4f2f4;--cap-bg:rgba(8,14,24,.93);--cap-ink:#eaf6f6;--panel:#101a26;--face-bg:#22304a;--q-ink:#9ff2e4;--fade:#020408;--hud-bg:rgba(8,14,24,.84)}
  .tc-room{font-size:52px}
  .blink{animation:blink 1.6s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}
  .steam{animation:steam 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .steam:nth-child(2){animation-delay:-2.5s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.4}100%{opacity:0;transform:translateY(-40px)}}
  .scan{animation:scan 6s linear infinite}
  .hiss{animation:hiss .5s steps(2) infinite}
  @keyframes hiss{50%{transform:translateY(2px);opacity:.5}}
  @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(200px)}}
  #printer.next .paper,#inbox.next .scr,#card.next rect:first-child{animation:cnudge 1.7s ease-in-out infinite}
  #jossG{display:none}#jossG.on{display:inline}

  /* the reply checker */
  .lt{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;width:min(1120px,96vw);align-items:start}
  .lt-con{padding:16px 18px 14px;background:#0e1822;border:1px solid #2c4656;border-radius:6px;color:#d8f2f0;box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .lt-con h6{margin:0 0 6px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.18em;color:#5fe3d2}
  .lt-con .rg{font-family:'Share Tech Mono',monospace;font-size:14px;line-height:1.5;color:#a8c8cc}
  .lt-con .rg b{color:#fff;font-weight:normal;font-size:17px}
  .dials{display:flex;gap:10px;margin:10px 0 6px}
  .dial{flex:1;text-align:center;background:#060c12;border:1px solid #2c4656;border-radius:6px;padding:6px 4px 8px}
  .dial output{display:block;font-family:'Share Tech Mono',monospace;font-size:38px;line-height:1.1;color:#ffcf6a;text-shadow:0 0 12px rgba(255,190,80,.5)}
  .dial small{display:block;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;color:#7aa0a8;margin-bottom:4px}
  .dial button{width:38px;height:30px;margin:0 2px;border:1px solid #3a5a68;border-radius:4px;background:#13222c;color:#d8f2f0;font-family:'Share Tech Mono',monospace;font-size:16px}
  .dial button:hover{background:#1f3a48}
  .stamps{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px}
  .stp{padding:8px 10px;border:3px solid currentColor;border-radius:4px;background:transparent;font-family:'Saira Stencil One',sans-serif;font-size:15px;letter-spacing:.06em;text-align:center;transform:rotate(-1.5deg)}
  .stp.ok{color:#5ad08a}.stp.fast{color:#ff6a5a}
  .stp.held{background:currentColor}.stp.ok.held{color:#5ad08a}.stp.held span{color:#0e1822}
  .lt-con .pmsg{min-height:96px;margin:8px 0;color:#eaf6f6;font-size:15.5px}
  .lt-con .btn{width:100%}
  .lt .chat{max-height:calc(100vh - 120px);overflow:auto;padding:14px 18px 16px;border-radius:4px;box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .lt .chat .k{margin-right:120px}
  .lt .chat .m{padding-right:150px;cursor:pointer;border:2px solid transparent}
  .lt .chat .m:hover{border-color:#e0b860}
  .chat .m .mk{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-4deg);width:136px;padding:3px 4px;border:3px solid currentColor;border-radius:4px;
    font-family:'Saira Stencil One',sans-serif;font-size:12px;line-height:1.1;letter-spacing:.04em;text-align:center;opacity:.92;background:rgba(255,255,255,.6)}
  .chat .m .mk.ok{color:#2a9a5a}.chat .m .mk.fast{color:#d8382a}
  .chat .m.bad{border-color:#d8382a;background:#ffe2dc}
  @media (max-width:900px){.lt{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null;
  (function () { var s = '', i, seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (i = 0; i < 46; i++) s += '<circle cx="' + Math.round(512 + rnd() * 336) + '" cy="' + Math.round(122 + rnd() * 150) + '" r="' + (0.5 + rnd() * 1.3).toFixed(1) + '" opacity="' + (0.25 + rnd() * 0.7).toFixed(2) + '"/>';
    $('#wstars').innerHTML = s; })();

  ER.init({
    theme: 'scifi', story: 'copy', storyTitle: 'Whilst You Were Out', id: 'comms', no: 'I', title: 'The Comms Desk',
    go: 'Take the early watch',
    intro: [
      'Juniper Base stands on the floor of Gale Crater, on Mars: five people, a greenhouse, two rovers and a great deal of dust. You are the youngest of the five, the comms officer, and you are on the early watch.',
      'Thirty-eight kilometres to the south, at the foot of Mount Sharp, Dr Liv Gundersen is alone in the Igloo, the base&rsquo;s field hut, drilling rock cores. Her main radio went dead on the night of Sol 211. From the south, a dust storm is coming.',
      'It is Sol 214, ten past six in the morning, and the printer has just woken up.'
    ],
    exit: {"next":"galley","w":{"2a4690c3":"f7606cb9"}}, tags: {"lt":["839fb1b7"],"fast":["138324ba","b8f3ce07","2677eb2e"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null;
  var S = ER.flag('c-st') || { m: 0, s: 0, st: {} };
  function keep() { ER.flag('c-st', S); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function chatHtml(withMarks) {
    var h = '';
    CP.CHAT.forEach(function (c) {
      if (c.day) h += '<div class="day">' + c.day + '</div>';
      else if (c.k) h += '<div class="k"><b>' + c.k + ' KAJA</b><span>' + c.t + '</span></div>';
      else h += '<div class="m" data-m="' + c.m + '"><b>' + c.at + ' MUM</b><span>' + c.t + '</span>' + (withMarks ? '<i class="mk" hidden></i>' : '') + '</div>';
    });
    return h;
  }
  var LETTER = '<h4>FROM: <b>Kaja Gundersen</b> (Earth) &nbsp;&middot;&nbsp; TO: <b>Juniper Base, all crew</b><br>ARRIVED: <b>Sol 214, 05:52</b> &nbsp;&middot;&nbsp; SUBJECT: <b>Is it really Mum?</b></h4>' +
    '<p>Dear crew,</p>' +
    '<p>I&rsquo;m Kaja, Liv Gundersen&rsquo;s daughter. I&rsquo;m thirteen and I live in Edinburgh with my dad. Please don&rsquo;t think I&rsquo;m being silly.</p>' +
    '<p>I think someone else is writing Mum&rsquo;s messages. The day before yesterday she answered me in ONE minute, and Mum always says a message takes ages to get to Mars. Then she wrote &lsquo;color&rsquo; without a u. Mum would sooner eat a sock. Yesterday I asked her the ferry question, which only the real Mum can answer, and she didn&rsquo;t answer it.</p>' +
    '<p>I&rsquo;ve printed our chat underneath, with my times. Please find out if she&rsquo;s all right.</p>' +
    '<p>Kaja</p>' +
    '<div class="chat" style="max-height:none;box-shadow:none;padding:8px 0 0;margin-top:10px;border-top:1px solid #d0d4da"><h6>OUR CHAT &middot; MY TIMES, IN EDINBURGH</h6>' + chatHtml(false) + '</div>';
  var CARD = '<h4>LIGHT TIME</h4>' +
    '<p>Radio is light that our eyes cannot see. It travels about <b>300 000 kilometres every second</b>: from Juniper to the Igloo in about a ten-thousandth of a second, from Mars to Earth in minutes.</p>' +
    '<svg viewBox="0 0 600 170" aria-hidden="true"><circle cx="300" cy="85" r="15" fill="#ffc94a"/><circle cx="300" cy="85" r="46" fill="none" stroke="#7a9aa6" stroke-dasharray="4 5"/><circle cx="300" cy="85" r="74" fill="none" stroke="#7a9aa6" stroke-dasharray="4 5"/>' +
    '<circle cx="346" cy="85" r="6" fill="#3a8ad8"/><circle cx="374" cy="85" r="6" fill="#d8643a"/><path d="M352 70h16" stroke="#0f5a66" stroke-width="2"/><text x="360" y="62" text-anchor="middle" font-family="Share Tech Mono" font-size="12" fill="#0f5a66">closest</text>' +
    '<circle cx="254" cy="85" r="6" fill="#3a8ad8"/><path d="M254 100Q300 160 374 100" stroke="#b03a2a" stroke-width="2" fill="none" stroke-dasharray="5 4"/><text x="300" y="164" text-anchor="middle" font-family="Share Tech Mono" font-size="12" fill="#b03a2a">farthest: the Sun in between</text>' +
    '<text x="470" y="60" font-family="Share Tech Mono" font-size="13" fill="#0f5a66">about 55 million km</text><text x="470" y="78" font-family="Share Tech Mono" font-size="13" fill="#0f5a66">about 3 minutes</text>' +
    '<text x="20" y="60" font-family="Share Tech Mono" font-size="13" fill="#b03a2a">about 400 million km</text><text x="20" y="78" font-family="Share Tech Mono" font-size="13" fill="#b03a2a">about 22 minutes</text>' +
    '<text x="346" y="112" text-anchor="middle" font-family="Share Tech Mono" font-size="11" fill="#3a8ad8">Earth</text><text x="390" y="112" text-anchor="middle" font-family="Share Tech Mono" font-size="11" fill="#d8643a">Mars</text></svg>' +
    '<p>Earth and Mars go round the Sun at different speeds, so the distance between them keeps changing. One way, a message takes from about 3 to about 22 minutes. So:</p>' +
    '<ul><li>There is <b>no live talk with Earth</b>. You cannot ring, chat or interrupt.</li>' +
    '<li>An answer needs the light time <b>twice</b>, there and back, plus the time to write it.</li>' +
    '<li>Two messages can <b>cross</b> on the way. A message that answers nothing can arrive at any time.</li></ul>' +
    '<p class="ft">TODAY&rsquo;S LIGHT TIME: distance ÷ 300 000 = seconds. Sixty seconds make a minute.</p>';
  var BOARD = '<h4>Relay passes</h4>' +
    '<p class="sm">Without the Halfway Mast, a suit radio cannot reach over the horizon. The Igloo can send to us only while the orbiter is overhead, about ten minutes at a time, and the orbiter passes the message on. Times are base time.</p>' +
    '<table><tr><td>Sol 211</td><td>03.02&ndash;03.12</td><td>09.31&ndash;09.41</td><td>15.05&ndash;15.15</td><td>21.20&ndash;21.30</td></tr>' +
    '<tr><td>Sol 212</td><td>03.10&ndash;03.20</td><td>09.40&ndash;09.50</td><td>15.14&ndash;15.24</td><td>21.29&ndash;21.39</td></tr>' +
    '<tr><td>Sol 213</td><td>03.18&ndash;03.28</td><td>09.48&ndash;09.58</td><td>15.23&ndash;15.33</td><td>21.37&ndash;21.47</td></tr>' +
    '<tr><td>Sol 214</td><td>03.26&ndash;03.36</td><td>09.57&ndash;10.07</td><td>15.31&ndash;15.41</td><td>21.45&ndash;21.55</td></tr></table>' +
    '<p>Rovers on Mars send most of what they have to say this way, through an orbiter passing over. &nbsp;J.K.</p>';

  function hints() {
    if (nextFile) return ['go', ['Keiko Ishida knows Liv&rsquo;s writing better than anyone, and she is in the galley. Click the button at the bottom of the screen.']];
    if (!ER.flag('c-letter')) return ['letter', [
      'Something has come out of the printer on the right of the desk. Click it, and read it to the end.',
      'It is a letter from Earth, from Liv&rsquo;s daughter, with her chat printed underneath.'
    ]];
    if (!ER.flag('c-talk')) return ['talk', [
      'The Commander has come in. Click on her and listen to the end.',
      'She will tell you what has happened to Liv, and what she wants from you before noon.'
    ]];
    if (!ER.flag('c-card')) return ['card', [
      'Before you check Kaja&rsquo;s times, read the laminated card leaning on the big screen on the left.',
      'It explains light time: how long a message takes between Earth and Mars, and how to work it out for today.'
    ]];
    return ['check', [
      'The mail screen on the right opens Kaja&rsquo;s chat. First set today&rsquo;s light time on the dials. The big screen gives the range to Earth, and the card says: distance ÷ 300 000 = seconds.',
      'For each of Mum&rsquo;s messages, find the message from Kaja it answers, and count the minutes between them. An answer must travel there and back: twice the light time, plus time to write. One of Mum&rsquo;s messages is not an answer to anything.',
      '225 000 000 ÷ 300 000 gives a number of seconds between 700 and 800; turn it into minutes and seconds. Double it: that is the shortest time an answer can take. Anything quicker is too fast for Mars. Read Mum&rsquo;s 19:33 message: does it answer Kaja&rsquo;s goodnight, or did they cross?'
    ]];
  }
  function paint() {
    $('#printer').setAttribute('class', 'hot' + (!ER.flag('c-letter') ? ' next' : ''));
    $('#card').setAttribute('class', 'hot' + (ER.flag('c-talk') && !ER.flag('c-card') ? ' next' : ''));
    $('#inbox').setAttribute('class', 'hot' + (!nextFile && ER.flag('c-talk') && ER.flag('c-card') ? ' next' : ''));
    $('#jossG').setAttribute('class', 'hot' + (ER.flag('c-letter') ? ' on' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function isBusy() { return busy; }
  function begin() {
    paint();
    if (nextFile) { ER.say('The comms desk. Kaja&rsquo;s chat is still on the screen, with three red stamps on it.'); return; }
    if (ER.flag('c-seen')) { ER.say('The comms desk: the printer, the big screen with the range to Earth, the card, the mail screen and the board.'); return; }
    busy = true; ER.flag('c-seen', 1);
    ER.narrate([
      'The comms desk, before dawn. Three screens, a printer, a mug of tea going cold, and through the window the mast, black against a sky that is only beginning to turn grey.',
      'At 05:52 a message arrived from Earth for the whole crew. The printer has printed it, with something long underneath.'
    ], function () { busy = false; paint(); CP.sfx.print(); });
  }

  $('#printer').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LETTER, cls: 'kmail', clue: { id: 'kaja', title: 'Is it really Mum?', kind: 'Letter from Earth' }, done: function () {
      var first = !ER.flag('c-letter');
      ER.flag('c-letter', 1); CP.learn(['light time']);
      if (first) {
        busy = true;
        ER.narrate(['The door hisses open. Commander Joss Kirwan comes in with a mug in one hand and the weather forecast in the other, and stops when she sees your face.'], function () { busy = false; paint(); });
        paint();
      } else paint();
    } });
  });
  $('#jossG').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Keiko is in the galley,&rdquo; says the Commander. &ldquo;Noon. Go.&rdquo;'); return; }
    if (ER.flag('c-talk')) { ER.say('&ldquo;Check Kaja&rsquo;s times,&rdquo; says the Commander. &ldquo;Work out today&rsquo;s light time from the range first. The card on the desk tells you how.&rdquo;'); return; }
    ER.talk({
      who: CAST.joss.who, role: CAST.joss.role, face: FACE('joss'),
      lines: [
        { note: 'Fifty-four, cropped grey hair, sleeves pushed up. She has not slept much, and she reads the letter over your shoulder without asking.',
          a: '&ldquo;She&rsquo;s thirteen, she&rsquo;s frightened, and she may be right. I&rsquo;d like to know before I frighten her any more.&rdquo;' },
        { q: 'What has happened to Liv?',
          a: '&ldquo;Liv is at the Igloo, drilling cores. At 21.10 on Sol 211 her main radio went dead. Since then she can only reach us through the orbiter, when it passes over her: four times a sol, about ten minutes each time. The passes are on the board.&rdquo;' },
        { q: 'Has she written to us?',
          a: '&ldquo;Plenty. Long, cheerful messages: she&rsquo;s fine, plenty of power, no need to fetch her. They sound exactly like Liv. And now and then a short scrap that doesn&rsquo;t sound like her at all.&rdquo;' },
        { q: 'What are the short scraps?',
          a: '&ldquo;Hugh says they come from Homeward, the family-mail service on Earth. It has a helper that answers for you while you&rsquo;re away. Liv asked Hugh to switch it on for Kaja if her radio went quiet, and he did, that night. Short holding notes, he says, mangled by the relay.&rdquo;' },
        { q: 'Why does it matter today?',
          a: 'She nods at the window. &ldquo;The storm. From about 19.00 tonight the track to the Igloo will be under thick dust for a week or more. If Ibex goes, it leaves by 14.00. I decide at noon. Yesterday I asked Liv whether we should fetch her. She said no.&rdquo;' },
        { q: 'What do you want me to do?',
          a: '&ldquo;Check Kaja&rsquo;s times. The light-time display has been dead since Hugh&rsquo;s last update, so work it out from the range: the card on the desk tells you how. Then stamp every one of &lsquo;Mum&rsquo;s&rsquo; messages: could it have come from Mars, or is it too fast?&rdquo;' }
      ],
      clue: { id: 'joss1', title: 'The Commander, at 06.15', kind: 'What she said' }, last: 'Get to work',
      done: function (seen) { if (!seen) return; ER.flag('c-talk', 1); CP.learn(['orbiter', 'relay pass', 'helper']); paint(); ER.say('The card is leaning on the big screen. Kaja&rsquo;s chat opens on the mail screen.'); }
    });
  });
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'lam', clue: { id: 'card', title: 'Light time', kind: 'Card on the desk' }, done: function () { ER.flag('c-card', 1); CP.learn(['light time', 'distance', 'cross']); paint(); } });
  });
  $('#board').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOARD, cls: 'wb', clue: { id: 'passes', title: 'Relay passes', kind: 'The comms board' }, done: function () { ER.flag('c-board', 1); CP.learn(['relay pass', 'orbiter', 'horizon']); } });
  });
  CP.thing('#range', null, 'RANGE TO EARTH: 225 000 000 km. LIGHT TIME, ONE WAY: <i>--:--</i>. Across it, a strip of yellow tape in Hugh&rsquo;s writing: BROKEN SINCE THE UPDATE. WORK IT OUT!', isBusy);
  CP.thing('#win', 'mast', 'The mast, black against a sky just turning grey in the east. The last stars. Low in the south there is a long brown smudge with no stars in it at all: the storm.', isBusy);
  CP.thing('#clock', null, 'SOL 214 &middot; 06:10. The base counts sols, Mars days, from the day you landed.', isBusy);
  CP.thing('#mug', null, 'Your tea, going cold. Liv&rsquo;s sticky note on the mail screen says what to do about that.', isBusy);
  CP.thing('#note', 'sticky note', 'A yellow sticky note in Liv&rsquo;s neat, slanting handwriting: <i>Whilst you wait for Earth, make tea. L.</i> She stuck it there on your first day.', isBusy);
  CP.thing('#headset', 'headset', 'The headset for the Halfway Mast link, which used to reach the Igloo. Since 21.10 on Sol 211, nothing but hiss.', isBusy);

  /* ---------- the reply checker ---------- */
  var WHY = {
    a: { fast: 'Mum&rsquo;s 18:21 answers Kaja&rsquo;s 17:05. That is 76 minutes: plenty of time for light to go there and back, and for Liv to write.' },
    d: { fast: 'Read Mum&rsquo;s 19:33 again. Does it answer anything Kaja said? Two messages can cross in space. Only an answer has to wait for the question.' },
    e: { fast: 'Mum&rsquo;s 16:41 answers Kaja&rsquo;s 16:15: 26 minutes. Light there and back, and a minute to type three lines. Fast, but possible. Light cannot tell you any more than that.' },
    b: { ok: 'Mum&rsquo;s 17:41 answers Kaja&rsquo;s 17:40. One minute. The light needs far longer than that just to reach Mars.' },
    c: { ok: 'Mum&rsquo;s 18:10 answers Kaja&rsquo;s 17:52: 18 minutes. The question could reach Mars in that time. Could the answer come back as well?' },
    f: { ok: 'Mum&rsquo;s 16:52 answers Kaja&rsquo;s 16:50. Two minutes.' }
  };
  function openCheck() {
    var box = ER.el('div', 'lt'), done = false, held = null;
    box.innerHTML = '<div class="lt-con"><h6>TODAY&rsquo;S LIGHT TIME</h6>' +
      '<div class="rg">RANGE TO EARTH <b>225 000 000 km</b><br>RADIO <b>300 000 km</b> every second</div>' +
      '<div class="dials"><div class="dial"><small>MINUTES</small><output id="d-m">0</output><button type="button" data-d="m" data-v="-1">&minus;</button><button type="button" data-d="m" data-v="1">+</button></div>' +
      '<div class="dial"><small>SECONDS</small><output id="d-s">00</output><button type="button" data-d="s" data-v="-10">&minus;</button><button type="button" data-d="s" data-v="10">+</button></div></div>' +
      '<div class="stamps"><button type="button" class="stp ok" data-k="ok"><span>COULD COME FROM MARS</span></button><button type="button" class="stp fast" data-k="fast"><span>TOO FAST FOR MARS</span></button></div>' +
      '<p class="pmsg"></p><button type="button" class="btn" id="c-show">Show the Commander</button></div>' +
      '<div class="chat"><h6>KAJA&rsquo;S CHAT WITH &lsquo;MUM&rsquo; &middot; HER TIMES, IN EDINBURGH</h6>' + chatHtml(true) + '</div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() {
      box.querySelector('#d-m').textContent = S.m; box.querySelector('#d-s').textContent = pad(S.s);
      ER.$$('.chat .m', box).forEach(function (n) {
        var k = S.st[n.getAttribute('data-m')], mk = n.querySelector('.mk');
        mk.hidden = !k; mk.className = 'mk' + (k ? ' ' + k : ''); mk.textContent = k === 'ok' ? 'COULD COME FROM MARS' : k === 'fast' ? 'TOO FAST FOR MARS' : '';
      });
      ER.$$('.stp', box).forEach(function (b) { b.classList.toggle('held', b.getAttribute('data-k') === held); });
    }
    ER.$$('.dial button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (done) return;
        var d = b.getAttribute('data-d'), v = +b.getAttribute('data-v');
        if (d === 'm') S.m = Math.max(0, Math.min(30, S.m + v)); else S.s = (S.s + v + 60) % 60;
        CP.sfx.dial(); keep(); show();
      });
    });
    ER.$$('.stp', box).forEach(function (b) {
      b.addEventListener('click', function () { if (done) return; held = b.getAttribute('data-k'); show();
        if (held) msg('Now click one of Mum&rsquo;s messages to stamp it.'); });
    });
    ER.$$('.chat .m', box).forEach(function (n) {
      n.addEventListener('click', function () {
        if (done) return;
        if (!held) { msg('Pick a stamp first: COULD COME FROM MARS, or TOO FAST FOR MARS.'); return; }
        S.st[n.getAttribute('data-m')] = held; CP.sfx.stamp(); keep(); ER.$$('.chat .m', box).forEach(function (o) { o.classList.remove('bad'); }); show();
      });
    });
    box.querySelector('#c-show').addEventListener('click', function () {
      if (done) return;
      ER.$$('.chat .m', box).forEach(function (o) { o.classList.remove('bad'); });
      var secs = S.m * 60 + S.s, lt = S.m + ':' + pad(S.s);
      if (!secs) { msg('&ldquo;The light time first,&rdquo; says the Commander. &ldquo;Everything else follows from it.&rdquo;'); ER.shake(box.querySelector('.dials')); return; }
      if (!ER.check('lt', lt)) {
        CP.bump('miss'); CP.sfx.hm(); ER.shake(box.querySelector('.dials'));
        if (S.m === 7 && S.s === 50) msg('&ldquo;Seven fifty? 750 seconds is not 7 minutes 50 seconds. A minute has sixty seconds, not a hundred.&rdquo;');
        else if (S.m === 12 && S.s === 50) msg('&ldquo;Twelve and a half minutes is not 12 minutes 50 seconds. Half a minute is thirty seconds.&rdquo;');
        else if (secs < 600) msg('&ldquo;Too short,&rdquo; says the Commander. &ldquo;Mind the zeros: 225 000 000 km ÷ 300 000 km a second. That gives seconds. Then sixty seconds to a minute.&rdquo;');
        else msg('&ldquo;Not quite. 225 000 000 ÷ 300 000 gives seconds. How many whole minutes is that, and how many seconds are left over?&rdquo;');
        return;
      }
      var ids = ['a', 'd', 'b', 'c', 'e', 'f'], i, bad = null;
      for (i = 0; i < ids.length; i++) if (!S.st[ids[i]]) { msg('&ldquo;Stamp all six of Mum&rsquo;s messages,&rdquo; says the Commander. &ldquo;Then show me.&rdquo;'); return; }
      for (i = 0; i < ids.length; i++) {
        var isFast = ER.check('fast', ids[i]);
        if ((S.st[ids[i]] === 'fast') !== isFast) { bad = ids[i]; break; }
      }
      if (bad) {
        CP.bump('miss'); CP.sfx.hm();
        box.querySelector('.chat .m[data-m="' + bad + '"]').classList.add('bad');
        msg((WHY[bad] || {})[S.st[bad]] || 'Look at that one again: which of Kaja&rsquo;s messages does it answer?');
        return;
      }
      var fast = ids.filter(function (k) { return S.st[k] === 'fast'; }).sort().join('');
      var file = ER.exitOk([lt + '|' + fast]);
      if (!file) { msg('&ldquo;Hm,&rdquo; says the Commander. &ldquo;Show me again.&rdquo;'); return; }
      done = true; nextFile = file; ER.flag('c-file', file); CP.done('comms'); busy = true;
      CP.mine('light', 'Kaja&rsquo;s times', '<p>Light time today: 225 000 000 km ÷ 300 000 km/s = 750 s = 12 min 30 s. An answer needs at least 25 minutes.</p>' +
        '<p>Too fast for Mars: 17:41 (1 min), 18:10 (18 min), 16:52 (2 min).</p><p>Could come from Mars: 18:21 (76 min), 16:41 (26 min, just), and 19:33, which answers nothing: it crossed Kaja&rsquo;s goodnight.</p>' +
        '<p>So something on Earth is writing as Liv. Light only tells you what is impossible.</p>', true);
      msg('The Commander reads the stamps, slowly, twice.');
      setTimeout(function () { ER.closeAll(); CP.solved(); paint(); after(); }, 2200);
    });
    show();
    msg(Object.keys(S.st).length ? 'Your stamps are where you left them.' : 'Set the light time. Then pick a stamp and click one of Mum&rsquo;s messages with it.');
    ER.open('ov-lock', box);
  }
  $('#inbox').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Kaja&rsquo;s chat, with your stamps on it: three of &lsquo;Mum&rsquo;s&rsquo; answers came back faster than light allows.'); return; }
    if (!ER.flag('c-letter')) { ER.say('The mail screen: one new message, at 05:52. The printer has already printed it.'); return; }
    if (!ER.flag('c-talk')) { ER.say('Talk to the Commander first.'); return; }
    if (!ER.flag('c-card')) { ER.say('&ldquo;Read the card first,&rdquo; says the Commander. &ldquo;It is leaning on the big screen.&rdquo;'); return; }
    openCheck();
  });
  function after() {
    ER.narrate([
      'Three of Mum&rsquo;s answers came back faster than light can make the journey: one in a minute, one in two, one in eighteen. Whatever wrote them was not on Mars. It was on Earth.',
      '&ldquo;Homeward is on Earth,&rdquo; says the Commander quietly. &ldquo;So the helper isn&rsquo;t sending Kaja short holding notes. It&rsquo;s writing as Liv. In her voice. With her name.&rdquo;',
      '&ldquo;Then the question is the one I&rsquo;ve been avoiding. Which of the messages to <i>us</i> are Liv&rsquo;s?&rdquo; She looks at the clock: 06:40. &ldquo;Keiko knows Liv&rsquo;s writing better than anybody. She&rsquo;s in the galley. You have until noon.&rdquo;',
      'At the door she turns. &ldquo;And remember: &lsquo;could come from Mars&rsquo; isn&rsquo;t &lsquo;did come from Liv&rsquo;. Light only tells you what is impossible.&rdquo;'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
