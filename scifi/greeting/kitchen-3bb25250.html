      'Nadia rang the director, and he is driving up from the city. Since then the needle has sent its counting again, and then something new: rows of dots with little square symbols between them.',

    ],
    exit: {"next":"archive","w":{"15ada64d":"e97196a5"}}, tags: {"gf":["5857c52b"],"gb":["f1f237f1"],"gd":["07f3aa29"],"gh":["4534c50c"],"r8":["bafa41ed"]},
    hints: hints, onBegin: begin

  nextFile = ER.flag('k-file') || null;
  var S = ER.flag('k-st') || { at: {} };

    '<p class="r"><b>1</b><span>Do not stop. Read to the end of the sentence.</span></p>' +

    '<p class="r"><b>3</b><span>Look at the words round it. <span class="ex">&ldquo;The ___ hissed and boiled over.&rdquo;</span> It is a thing that boils: a kettle? a pan?</span></p>' +
    '<p class="r"><b>4</b><span>Read the next sentences. A second example tells you more than the first. Look for <i>like</i>, <i>such as</i>, <i>unlike</i>, <i>because</i>, <i>but</i>.</span></p>' +
    '<p class="r"><b>5</b><span>Put a plain word in its place. If every sentence still makes sense, you have it.</span></p>' +
    '<p>This is how I learnt English, from astronomy papers. It works on anything. &nbsp;Y.N.</p>';
  var CUT = '<h4>The mystery signals were lunch</h4><h5>Cut from a newspaper &middot; 2015</h5>' +
    '<p>For seventeen years, the great radio telescope at Parkes in Australia picked up perytons. They were bright and sudden, they lasted a fraction of a second, and they swept from high frequencies down to low ones, like a falling whistle.</p>' +
    '<p>Some astronomers hoped they came from deep space. But unlike the bursts that really do come from far away, perytons appeared whatever the dish was pointing at, and nearly always in working hours.</p>' +
    '<p>In 2015 a young astronomer found the culprit in the staff kitchen. If somebody opened the door of the microwave oven before the timer had finished, the oven gave out a short burst of radio waves as it stopped, and the telescope heard it. The perytons were lunch.</p>';

  var KEYS = [['fork', 'gf'], ['bars', 'gb'], ['diam', 'gd'], ['hook', 'gh']];

      'Every symbol on the board is a word you do not know. Use Yusuf&rsquo;s card: what kind of word stands between two numbers? Try a meaning in every row where that symbol appears, not just the first.',

      ],
      clue: { id: 'yusuf1', title: 'Yusuf, at five to one', kind: 'What he said' }, last: 'Look round the kitchen',
      done: function (seen) { if (!seen) return; ER.flag('k-talk', 1); GR.learn(['symbol', 'whiteboard', 'noodles']); paint(); ER.say('Yusuf&rsquo;s card is on the fridge door. The cutting is on the corkboard beside it.'); }
    });
  });
  $('#idx').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: IDX, cls: 'idx', clue: { id: 'idx', title: 'How I read a word I do not know', kind: 'On the fridge' }, done: function () { ER.flag('k-idx', 1); GR.learn(['context', 'meaning']); paint(); } });
  });
  $('#cut').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CUT, cls: 'cut', clue: { id: 'cut', title: 'The mystery signals were lunch', kind: 'Newspaper cutting' }, done: function () {
      ER.flag('k-cut', 1); GR.learn(['cutting', 'culprit']); paint();
      ER.say('There is a word in that cutting that nobody explains. Yusuf&rsquo;s card says what to do about that.'); } });
  });
  $('#phone').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The telephone: only the motorway now. Professor Stroud has gone very quiet.'); return; }
    ER.talk({
      who: CAST.stroud.who, role: 'On the speakerphone, from a motorway somewhere', face: FACE('stroud'),
      lines: [
        { note: 'Only a voice: the director of the observatory, driving through the night. He sounds as if he is smiling with his whole face.',
          a: '&ldquo;Is that our prize-winner? Splendid. Splendid! You picked a good night. Are you writing everything down? Write everything down.&rdquo;' },
        { q: 'What do you think row 8 is?',
          a: '&ldquo;A second voice! Don&rsquo;t you see? The counting is one transmitter, and row 8 is another one, answering it. A falling tone, quite different. Two of them, talking to each other. I have waited thirty years for a night like this.&rdquo;' },
        { q: 'Are you sure?',
          a: '&ldquo;I am always sure. It saves a great deal of time.&rdquo; A lorry roars past him. &ldquo;Put it on the board as a second voice. I&rsquo;ll be there by two.&rdquo;' }
      ],
      clue: { id: 'stroud1', title: 'Professor Stroud, on the telephone', kind: 'What he said' }, last: 'Hang up politely',
      done: function (seen) { if (seen) { ER.flag('k-phone', 1); GR.learn(['speakerphone', 'motorway']); } }
    });
  });
  GR.thing('#micro', 'microwave', function () {
    ER.flag('k-micro', 1);
    return 'The microwave. Its little screen still says <i>0:07</i>, blinking: somebody opened the door seven seconds before the timer finished. Inside, a pot of noodles is going cold. &ldquo;I put them in at 00:49:38, for three minutes,&rdquo; says Yusuf. &ldquo;I was hungry.&rdquo;';
  }, isBusy);
  GR.thing('#laptop', null, 'Yusuf&rsquo;s laptop shows the live feed. At 00:52:31 there is a red streak right across it, from the top of the receiver&rsquo;s range to the bottom, a third of a second long. Then the counting again, as if nothing had happened.', isBusy);
  GR.thing('#clock', null, 'The kitchen clock says five to one. Under it, in pencil on the wall, somebody has written: NOBODY HERE HAS GONE TO BED ON TIME SINCE 1974.', isBusy);
  GR.thing('#cat', null, 'The observatory cat, Parsec, named after a distance astronomers use: about three and a quarter light years. She is asleep with one ear turned towards the dish.', isBusy);
  GR.thing('#kettle', 'kettle', 'The kettle has just boiled. Nadia says the observatory runs on two things: liquid helium and tea.', isBusy);
  GR.thing('#win', 'moor', 'Through the window: the black moor, the stars, and the dish, white under one lamp, still turned to the south and listening.', isBusy);
  GR.thing('#fridge', null, 'The fridge is covered in magnets from other observatories. One says: I CAME, I SAW, I CALIBRATED.', isBusy);

  /* ---------- the whiteboard ---------- */
  function rowsHtml() {
    var h = '<div class="wb-row"><b>1&ndash;5</b>' + GR.MSG.p1.map(function (r) { return GR.line(r, 24); }).join(' ') + '</div>';
    GR.MSG.p2.forEach(function (r, i) { h += '<div class="wb-row"><b>' + (i + 1) + '</b>' + GR.line(r, 26) + '</div>'; });
    h += '<div class="wb-row red"><b>8</b><svg width="160" height="30" viewBox="0 0 160 30"><path d="M4 4L150 26" stroke="#c0302a" stroke-width="5"/></svg><span>00:52:31 &middot; one quick sweep, high to low</span></div>';
    return h;
  }
  function openBoard() {
    var box = ER.el('div', 'wb'), done = false;
    box.innerHTML = '<div class="wb-board"><h6>The neighbours &middot; PART ONE and PART TWO &middot; copied by Y.N.</h6>' + rowsHtml() +
      '<div class="wb-keys">' + KEYS.map(function (k) { return '<div class="wb-key">' + GR.glyph(k[0], 34) + '<i>' + k[0] + '</i><div class="slot" data-s="' + k[1] + '"></div></div>'; }).join('') +
      '<div class="wb-key"><svg width="44" height="34" viewBox="0 0 44 34"><path d="M4 6L40 28" stroke="#c0302a" stroke-width="5"/></svg><i>row 8</i><div class="slot" data-s="r8"></div></div></div></div>' +
      '<div class="wb-side"><div class="wb-tray"></div><p class="pmsg"></p><button type="button" class="btn" id="k-read">Read it to the professor</button></div>';
    var tray = box.querySelector('.wb-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    ORDER.forEach(function (k) {
      var n = ER.el('div', 'mag dnd-item', MAGS[k]); n.setAttribute('data-m', k);
      var at = null, s; for (s in S.at) if (S.at[s] === k) at = s;
      (at ? box.querySelector('.slot[data-s="' + at + '"]') : tray).appendChild(n);
    });
    function read() {
      var o = {}; ER.$$('.slot', box).forEach(function (s) { var t = s.querySelector('.mag'); o[s.getAttribute('data-s')] = t ? t.getAttribute('data-m') : ''; s.classList.toggle('full', !!t); s.classList.remove('bad'); });
      return o;
    }
    ER.dnd(box, { item: '.mag', slot: '.slot', home: tray, change: function () { S.at = read(); keep(); }, lock: function () { return done; } });
    read();
    var WHY = {
      gf: { minus: 'Row 1 would say: one take away one is two. Row 2: two take away one is three.', eq: 'Row 1 would say: one equals one equals two.', more: 'Row 1: one is bigger than one ... two? That isn&rsquo;t even a sentence.',
        not: 'Row 1 would be: one, not, one, two. Every row with a fork would be a mistake.', ask: 'Then row 1 asks a question and answers it in the same breath. Look at where the real answer to a question comes.' },
      gb: { more: 'Row 3: three is bigger than three? Not even on a good day.', plus: 'Row 3 would say three plus three, and stop there.', minus: 'Row 3: three take away three, and nothing after it.',
        not: 'Row 3 would say three, not, three. But three is three.', ask: 'Then row 3 asks &ldquo;three, what, three?&rdquo; and never gets an answer.' },
      gd: { ask: 'Is row 4 asking a question? Then where is its answer? The hook in row 5 gets one: row 6.', minus: 'Row 4: two plus two equals five, take away? And it stops.', more: 'Row 7 would say: four equals three is bigger than. That is just noise.',
        plus: 'Row 4: two plus two equals five plus ... nothing.', eq: 'The diamond comes only at the end of two rows. What is the same about row 4 and row 7?' },
      gh: { not: 'Then row 5 says three plus one equals not, and row 6, a four all on its own, is there for no reason. What gets an answer?', minus: 'Row 5: three plus one equals take away?', more: 'Row 5: three plus one equals is bigger than?',
        eq: 'Row 5 already has the bars in it.', plus: 'Row 5 already has the fork in it.' },
      r8: { second: '&ldquo;A second voice that sweeps through every frequency in a third of a second, at 00:52:31?&rdquo; says Nadia. &ldquo;Look at the microwave. Then read the cutting again.&rdquo;' }
    };
    box.querySelector('#k-read').addEventListener('click', function () {
      if (done) return;
      var L = read(), keys = ['gf', 'gb', 'gd', 'gh', 'r8'], bad = null, i;
      if (keys.every(function (k) { return !L[k]; })) { msg('&ldquo;Words under the symbols first,&rdquo; says Yusuf. &ldquo;Drag them, or click one and then a space.&rdquo;'); return; }
      if (keys.some(function (k) { return !L[k]; })) { msg('&ldquo;Five spaces: four symbols and row 8. Three words will be left over.&rdquo;'); ER.shake(box.querySelector('.wb-keys')); return; }
      for (i = 0; i < keys.length; i++) if (!ER.check(keys[i], L[keys[i]])) { bad = keys[i]; break; }
      if (bad) {
        GR.bump('miss'); GR.sfx.hm();
        box.querySelector('.slot[data-s="' + bad + '"]').classList.add('bad');
        var t = (WHY[bad] || {})[L[bad]];
        if (!t && bad === 'r8') t = 'Row 8 is not made of dots and symbols at all. What happened in this kitchen at 00:52:31?';
        if (!t && (L[bad] === 'peryton' || L[bad] === 'second')) t = 'That word is about row 8, not about a symbol.';
        msg(t || 'Try that word in every row where the symbol comes. One of them stops making sense.'); return;
      }
      var file = ER.exitOk([L.gf + '|' + L.gb + '|' + L.gd + '|' + L.gh + '|' + L.r8]);
      if (!file) { msg('&ldquo;Hm,&rdquo; says Yusuf. &ldquo;Read it to me again.&rdquo;'); return; }
      done = true; nextFile = file; ER.flag('k-file', file); GR.done('kitchen'); busy = true;
      GR.mine('words1', 'Their first four words', '<p>' + GR.glyph('fork', 22) + ' plus &nbsp; ' + GR.glyph('bars', 22) + ' equals &nbsp; ' + GR.glyph('diam', 22) + ' not (wrong) &nbsp; ' + GR.glyph('hook', 22) + ' what? (a question)</p><p>Row 8 was a peryton: Yusuf&rsquo;s microwave, opened 7 seconds early.</p><p>They teach a word by putting it between things we already know.</p>', true);
      msg('Yusuf reads the board aloud, one row at a time, into the telephone.');
      setTimeout(function () { ER.closeAll(); GR.solved(); paint(); after(); }, 2400);
    });
    msg(Object.keys(S.at).some(function (k) { return S.at[k]; }) ? 'The magnets are where you left them.' : 'Put a word under each symbol, and one under row 8. Drag a magnet, or click it and then a space.');
    ER.open('ov-lock', box);
  }
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The whiteboard. Under the fork: plus. Under the bars: equals. Under the diamond: not. Under the hook: what? Row 8 has a red line through it, and the word PERYTON.'); return; }
    if (!ER.flag('k-talk')) { ER.say('The whiteboard, covered in dots and little squares. Yusuf is guarding it with a fork. Talk to him first.'); return; }
    if (!ER.flag('k-idx') || !ER.flag('k-cut')) { ER.say('&ldquo;Read my card on the fridge first,&rdquo; says Yusuf, &ldquo;and the cutting next to it.&rdquo;'); return; }
    openBoard();
  });
  function after() {
    ER.narrate([
      '&ldquo;One and one make two,&rdquo; Yusuf reads. &ldquo;Two and one make three. Three is three. Two and two make five: NOT. Three and one make what? Four. Four is three: NOT.&rdquo; He puts the pen down. &ldquo;They are teaching us. Like a teacher with a small child.&rdquo;',
      '&ldquo;And row 8,&rdquo; says Nadia, &ldquo;was a peryton. It was your noodles, Yusuf.&rdquo; On the speakerphone there is a long silence, full of motorway. &ldquo;Ah,&rdquo; says the professor at last. &ldquo;A second voice from a microwave. Well. Nobody need ever know.&rdquo;',
      'On the laptop, the neighbours have moved on. PART THREE is counting again, but differently: two, three, five, seven, eleven ... And after it comes PART FOUR: a long, long run of pulses and gaps with no break at all. Yusuf&rsquo;s program cannot make sense of it.',
      '&ldquo;Mr Ward,&rdquo; says Nadia suddenly. &ldquo;He looked after the archive for forty years. He kept notes about the message that was sent from Arecibo in 1974. They&rsquo;re downstairs, and so is the old light table. Bring the printout.&rdquo;'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
