<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PC Inskip&rsquo;s Notebook · Still Here</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">

<style>
  body{--bg:#2a3440;--accent:#9ec8f0;--font-display:'Special Elite',monospace;--font-ui:'Space Mono',monospace;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(24,30,38,.95);--tc-ink:#eef2f6;--cap-bg:rgba(24,30,38,.93);--panel:#1e2630;--face-bg:#2e3a48;--q-ink:#c4e0fa;--fade:#0c1014;--hud-bg:rgba(24,30,38,.84)}
  .drop{animation:dp 2.6s linear infinite}
  .drop.b{animation-duration:3.3s;animation-delay:-1.2s}
  .drop.c{animation-duration:2.1s;animation-delay:-.5s}
  @keyframes dp{0%{transform:translateY(-60px);opacity:0}10%{opacity:.8}100%{transform:translateY(420px);opacity:0}}
  .nm{display:grid;grid-template-columns:minmax(0,1fr) 240px;background:#1e2630}
  .nm-notes{padding:12px 14px;max-height:min(520px,64vh);overflow:auto;background:#f4f0e2 repeating-linear-gradient(transparent 0 27px,rgba(80,110,170,.25) 27px 28px)}
  .nm-n{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:6px 0 8px;border-bottom:1px dashed #9aa4b8}
  .nm-n p{margin:0;font-family:'Kalam',cursive;font-size:16px;line-height:1.25;color:#1d2448}
  .nm-n p b{font-family:'Space Mono',monospace;font-size:12px;color:#2a2a2a}
  .nm-slot{min-height:46px;border:2px dashed #6a7a9a;border-radius:3px;display:flex;align-items:center;justify-content:center;background:#fffdf4}
  .nm-tray{display:flex;flex-direction:column;gap:8px;padding:14px 12px;background:#2e3a48}
  .nm-tray h6{margin:0 0 2px;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c4e0fa}
  .nt{padding:7px 10px 6px;background:#f6f1e2;color:#1f1d18;font-family:'Special Elite',monospace;font-size:14px;line-height:1.2;border-left:5px solid #8a3a1a;cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none}
  .nt.held{outline:3px solid #9ec8f0}
  .nt.fly{position:fixed;z-index:90;pointer-events:none}
  .nm-slot .nt{width:100%}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9aac"/><stop offset="1" stop-color="#b8c4ce"/></linearGradient>
  <radialGradient id="vigN" cx="50%" cy="50%" r="78%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#4a5664"/>
<!-- the big bay window of the search room, with the town in the rain -->
<g id="bay" class="hot"><rect x="200" y="40" width="1200" height="440" fill="url(#sky)"/>
  <g fill="#7a8696"><path d="M200 380l80 -60 60 40 90 -90 120 70 80 -40 140 80 110 -50 140 60 160 -70 120 40V480H200Z"/></g>
  <g fill="#6a7686"><rect x="840" y="200" width="30" height="130"/><path d="M830 200l25 -60 25 60z"/></g>
  <g fill="#cfd8e0" class="drop"><circle cx="320" cy="60" r="3"/><circle cx="760" cy="90" r="3"/><circle cx="1180" cy="70" r="3"/></g><g fill="#cfd8e0" class="drop b"><circle cx="520" cy="50" r="3"/><circle cx="980" cy="70" r="3"/></g><g fill="#cfd8e0" class="drop c"><circle cx="660" cy="40" r="3"/><circle cx="1300" cy="60" r="3"/></g>
  <path d="M600 40V480M1000 40V480M200 260H1400" stroke="#e8ecee" stroke-width="12"/><rect x="200" y="40" width="1200" height="440" fill="none" stroke="#e8ecee" stroke-width="20"/></g>
<!-- the window seat, with its cushion -->
<rect x="-1000" y="480" width="3600" height="60" fill="#d8d0c0"/><rect x="-1000" y="540" width="3600" height="1200" fill="#3a4a5a"/>
<rect x="120" y="500" width="1360" height="70" rx="20" fill="#5a6a8a"/><g stroke="#4a5a7a" stroke-width="3"><path d="M300 506v58M600 506v58M900 506v58M1200 506v58"/></g>
<!-- the notebook, open -->
<g id="nbook" class="hot"><rect x="640" y="590" width="340" height="230" rx="6" fill="#1d1d22"/><rect x="652" y="600" width="156" height="210" fill="#f4f0e2"/><rect x="812" y="600" width="156" height="210" fill="#f4f0e2"/>
  <g stroke="#9aa4c8" stroke-width="1.5"><path d="M660 630h140M660 650h140M660 670h140M660 690h140M660 710h140M660 730h140M660 750h140M660 770h140M820 630h140M820 650h140M820 670h140M820 690h140M820 710h140M820 730h140"/></g>
  <g stroke="#1d2448" stroke-width="2.5"><path d="M664 626h90M664 646h120M664 666h70M664 686h110M824 626h110M824 646h80M824 666h120M824 686h60"/></g>
  <path d="M960 590v230" stroke="#2a2a32" stroke-width="10"/><text x="730" y="800" class="sk" font-size="13" fill="#5a5a7a">PC A. Inskip</text></g>
<!-- the typed list -->
<g id="list" class="hot" transform="rotate(5 1150 700)"><rect x="1040" y="600" width="230" height="200" fill="#f6f1e2"/><g stroke="#2a2a2a" stroke-width="2"><path d="M1056 626h150M1056 650h190M1056 670h170M1056 690h180M1056 710h196M1056 730h176M1056 750h184"/></g><path d="M1056 776q40 -10 80 4" stroke="#4a5a7a" stroke-width="2" fill="none"/></g>
<!-- the photograph, face down, and the envelope still sealed -->
<g id="env" class="hot" transform="rotate(-6 460 690)"><rect x="360" y="610" width="220" height="150" fill="#c8a868" stroke="#7a5a28" stroke-width="2"/><path d="M360 610l110 70 110 -70" stroke="#7a5a28" stroke-width="2" fill="none"/><text x="470" y="740" class="sm" font-size="13" fill="#3a2a10">STATEMENTS</text></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#vigN)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">Open the envelope</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="arch.js"></script>
<script src="files.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, nm = null;

  ER.init({
    theme: 'duo', story: 'archive-b', storyTitle: 'Still Here', id: 'notebook', no: 'III', title: 'PC Inskip’s Notebook',
    go: 'Sit in the window',
    intro: [
      'The Blue Kite hung on the east wall, between the first fireplace and the front window. June Kitto took her photograph in the big mirror, which still hangs on the west wall of the café, opposite the fireplace: so in the photograph left and right are the wrong way round. Your partner, meanwhile, found where the old wall stood, 6.8 metres from the front, with its door at the west end.',
      'Now you have taken the next things out of the box to the window seat, where the light is better: a policeman&rsquo;s pocket book, and a list of names typed the next morning.',
      'PC Inskip wrote down what everybody said, and what everybody looked like. He did not write down who they were.'
    ],
    exit: {"next":"statements","w":{"36773dda":"e924955f"}}, tags: {"n1":["5afe4c41"],"n2":["b05b7a29"],"n3":["109f32a4"],"n4":["d76115cc"],"n5":["98c2486a"],"n6":["df650cd8"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b3-told') || {}; nextFile = ER.flag('b3-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b3-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.notes ? 1 : 0) + (told.list ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) AR.card([['Tell your partner', ['&ldquo;Mr Gorringe told the policeman he was at the front window the whole time.&rdquo;']], ['Ask your partner', ['&ldquo;Where did Carys find his pipe?&rdquo;']]]);
    else AR.card([['Ask your partner', ['&ldquo;Who is in the visitors&rsquo; book? Is anybody bald? Who wears glasses?&rdquo;', '&ldquo;What does the drawing of &hellip; look like?&rdquo;']], ['Tell your partner', ['&ldquo;Note one: a bald man with a short beard and a bow tie. He had a flat parcel, and he&rsquo;d lost a glove.&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['Every note has its name. Under the notebook is an envelope of statements.']];
    if (!told.notes) return ['read', [
      'PC Inskip&rsquo;s pocket book is on the window seat. Read it: six notes, each one about a person, and not one name.',
      'The typed list has the six names, but no descriptions. Your partner can see a drawing of each guest in the visitors&rsquo; book, with the name beside it.'
    ]];
    return ['names', [
      'Read one description at a time to your partner, and ask which drawing it matches. Ask closed questions to check: &ldquo;Is anybody bald? Has anybody got a beard?&rdquo;',
      'Some notes are easy: a bow tie, a camera, a bun. The youth who came up from the cellar was the gallery&rsquo;s assistant. Ask your partner whose drawing has long hair.',
      'Two notes talk about a pipe. Note 6 is the man with the pipe in his pocket: ask your partner whose drawing is thin, with a moustache. Note 3 is the lady who smelt the pipe smoke, with a hat and round glasses.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('Six notes, six names, written in pencil in the margin.'); return; }
    if (told.intro) { busy = false; ER.say('The window seat: the notebook, the list, and an envelope you have not opened yet.'); return; }
    ER.narrate([
      'The window seat looks out over the roofs of Chalkbourne in the rain. You can see the top of a church tower from here, and not much else.',
      'PC Inskip&rsquo;s pocket book is black, with an elastic band round it. Inside, his handwriting gets faster and faster down the page, the way handwriting does when the writer is cold and everybody is talking at once.',
      'Pinned to it, the typed list. At the bottom somebody has added in pencil: PC Inskip, please put the names to your notes. And under that: Will do. And under that, in a third hand: He never did.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  $('#nbook').addEventListener('click', function () {
    if (busy) return;
    if (tell('notes')) paint();
    if (nextFile) { ER.read({ html: FL.notebook(), cls: 'pnb' }); return; }
    ER.read({ html: FL.notebook(), cls: 'pnb', clue: { id: 'pocketbook', title: 'PC Inskip&rsquo;s pocket book', kind: 'Notebook' }, done: function () { if (told.list && !nm) ER.say('Now put a name to each note. Your partner has the faces.'); } });
  });
  $('#list').addEventListener('click', function () {
    if (busy) return;
    if (tell('list')) paint();
    ER.read({ html: FL.NAMELIST, cls: 'typed2', clue: { id: 'names', title: 'Persons present, 24.11.79', kind: 'Typed list' }, done: function () { if (!nextFile) openNames(); } });
  });
  function openNames() { if (busy || nextFile) return; if (!nm) nm = makeNames(); nm.open(); }

  /* ---------- the lock: a name for every note ---------- */
  function makeNames() {
    var box = ER.el('div', 'bx'), s = '<div class="nm"><div class="nm-notes">';
    FL.NOTES.forEach(function (n, i) { s += '<div class="nm-n"><p><b>' + (i + 1) + '. ' + n.time + '.</b> ' + n.text + '</p><div class="nm-slot" data-n="' + n.id + '"></div></div>'; });
    s += '</div><div class="nm-tray"><h6>The typed list</h6>' + FL.NAMES.map(function (n) { return '<span class="nt dnd-item" data-p="' + n.id + '">' + n.name.split(',')[0] + '</span>'; }).join('') + '</div></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="write">Write the names in</button></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.nm-tray'), msg = function (t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); };
    function placed() { return FL.NOTES.map(function (n) { var t = box.querySelector('.nm-slot[data-n="' + n.id + '"] .nt'); return t ? t.getAttribute('data-p') : ''; }); }
    ER.dnd(box, { item: '.nt', slot: '.nm-slot', home: tray, change: function () { msg(''); AR.tell('iii-names', placed().filter(Boolean)); } });
    box.querySelector('#write').addEventListener('click', function () {
      var ids = placed();
      if (ids.some(function (x) { return !x; })) { msg('Every note needs a name. Drag a name onto it, or click a name and then a note.'); return; }
      var file = ER.exit([ids.join('-')], { wait: true });
      if (!file) {
        ER.sfx.no();
        var right = ids.filter(function (x, i) { return ER.check('n' + (i + 1), x); }).length;
        msg('Mr Furnival reads over your shoulder, which he says he never does. &ldquo;' + ['None', 'One', 'Two', 'Three', 'Four', 'Five'][right] + ' of those ' + (right === 1 ? 'is' : 'are') + ' right,&rdquo; he says. &ldquo;I shall not say which. I am an archivist, not a fortune teller.&rdquo;');
        return;
      }
      nextFile = file; ER.flag('b3-file', file);
      AR.tell('iii-named');
      box.querySelector('#write').disabled = true;
      msg('You write the names in the margin, in pencil, forty-seven years late.');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'Now the notebook makes sense. Note 6: Mr Gorringe, tall and thin, with a grey moustache and a pipe in his top pocket. &ldquo;I was at the front window the whole time.&rdquo;',
          'Note 3: Mrs Applegarth, standing by the big mirror. &ldquo;A man went past me in the dark, towards the back. He smelt of pipe smoke.&rdquo;',
          'Note 1, at the bus stop, with his parcel and one glove: Mr Lightfoot, the bank manager. Note 2, coming up from the cellar with the empty frame in his hands: Lewis Daintree, nineteen. You can see why the town decided what it decided.',
          'Under the notebook is a brown envelope: STATEMENTS. Six of them, typed and signed on the Sunday and the Monday.'
        ], function () { busy = false; paint(); });
      }, 2400);
    });
    msg('Six notes, six names. Put a name on every note: drag it, or click a name and then a note.');
    return { open: function () { ER.open('ov-lock', box); } };
  }
  AR.thing('#bay', null, 'The town in the rain. Over the roofs, the top of a church tower, St Aidan&rsquo;s, and its weathercock, pointing nowhere in particular.', isBusy);
  $('#env').addEventListener('click', function () { if (busy) return; if (nextFile) { ER.say('The envelope of statements. Open it when you are ready.'); return; } if (told.notes && told.list) openNames(); else ER.say('An envelope of statements, still sealed. First the notebook, and the list of names.'); });

  AR.live('iii-shelf', function () { ER.say('Your partner has put a name on every lost thing. Somewhere across town, Carys reads a label twice.'); }, 'My partner has named every lost thing');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
