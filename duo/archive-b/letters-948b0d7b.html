<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Letters from Spain · Still Here</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-duo.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="records.css">
<style>
  body{--bg:#3a3020;--accent:#f0b850;--font-display:'Special Elite',monospace;--font-ui:'Space Mono',monospace;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(34,28,18,.95);--tc-ink:#f6eedc;--cap-bg:rgba(34,28,18,.93);--panel:#2a2216;--face-bg:#4a3a26;--q-ink:#ffdc9a;--fade:#100c06;--hud-bg:rgba(34,28,18,.84)}
  #kite{opacity:0}
  body.fly #kite{animation:fly 7s ease-in-out 1 forwards}
  @keyframes fly{0%{opacity:0;transform:translate(-200px,120px) rotate(-10deg)}12%{opacity:1}50%{transform:translate(380px,-30px) rotate(8deg)}88%{opacity:1}100%{opacity:0;transform:translate(900px,60px) rotate(-6deg)}}
  .lt{display:grid;grid-template-columns:250px minmax(0,1fr);background:#2a2216;min-height:400px}
  .lt-list{display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:#3a3020}
  .lt-list button{padding:8px 12px 7px;text-align:left;background:#fbf8f0;color:#22222a;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.3;border-left:6px solid #6a8ab0}
  .lt-list button b{display:block;font-family:'Kalam',cursive;font-weight:700;font-size:16px}
  .lt-list button.on{outline:3px solid #f0b850}
  .lt-view{padding:16px}
  .lt-view .doc{width:100%;max-height:none;box-shadow:none}
  .kk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;background:#2a2216}
  .kk-c{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:#f2efe6;color:#1d1a14}
  .kk-c h6{margin:0;font-family:'Space Mono',monospace;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-align:center}
  .kk-c svg{display:block;width:100%;height:auto;border:4px solid #fff}
  .kk-c p{margin:0;font-family:'EB Garamond',serif;font-size:15.5px;line-height:1.25;text-align:center;flex:1}
  .kk-c .btn{--accent:#8a3a1a;font-size:12px;padding:7px 10px}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8d4dc"/><stop offset="1" stop-color="#e2e6e4"/></linearGradient>
  <radialGradient id="vigL" cx="50%" cy="50%" r="78%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#8a7a5a"/>
<g fill="#7a6a4c" opacity=".7" id="stripes"></g>
<!-- the tall window onto the street: the rain has stopped -->
<g id="win" class="hot"><rect x="500" y="60" width="600" height="440" fill="url(#street)"/><g fill="#a8b0b4"><rect x="520" y="300" width="140" height="200"/><rect x="680" y="250" width="120" height="250"/><rect x="940" y="280" width="150" height="220"/></g>
  <g id="kite"><path d="M760 200l40 -30 22 44 -42 24z" fill="#2f6fc0" stroke="#1a3a7a" stroke-width="2"/><path d="M780 238q-16 30 0 60t-10 50" stroke="#3a3a3a" stroke-width="2" fill="none"/><g fill="#fbfbf6"><path d="M772 262l8 4 -8 4zM788 262l-8 4 8 4z"/><path d="M776 290l8 4 -8 4zM792 290l-8 4 8 4z"/></g></g>
  <path d="M800 60V500M500 280H1100" stroke="#efe8d8" stroke-width="12"/><rect x="500" y="60" width="600" height="440" fill="none" stroke="#efe8d8" stroke-width="20"/></g>
<!-- the trolley, with the last envelope -->
<g id="trolley" class="hot"><rect x="1180" y="400" width="300" height="20" fill="#6a6a70"/><rect x="1180" y="600" width="300" height="16" fill="#6a6a70"/><path d="M1190 420v220M1470 420v220" stroke="#4a4a50" stroke-width="10"/><circle cx="1200" cy="660" r="16" fill="#2a2a2a"/><circle cx="1460" cy="660" r="16" fill="#2a2a2a"/>
  <rect x="1210" y="330" width="230" height="70" fill="#8a8a84" stroke="#4a4a46" stroke-width="3"/><text x="1325" y="372" class="sm" font-size="14" fill="#2a2a2a">P/79/114</text><rect x="1220" y="560" width="200" height="40" fill="#c8a868"/></g>
<!-- the desk: the letters, and the folder of photographs -->
<rect x="-1000" y="560" width="3600" height="1200" fill="#5a3e24"/><path d="M-1000 560H2600" stroke="#7a5a38" stroke-width="10"/>
<g id="letters" class="hot"><g transform="rotate(-6 760 690)"><rect x="660" y="620" width="190" height="140" fill="#fbf8f0"/><g stroke="#4a5a8a" stroke-width="2"><path d="M676 646h150M676 664h120M676 682h156M676 700h100"/></g></g>
  <g transform="rotate(4 820 700)"><rect x="740" y="640" width="190" height="140" fill="#f4eedc"/><rect x="740" y="640" width="190" height="22" fill="#c4372b" opacity=".7"/><g stroke="#3a3a3a" stroke-width="2"><path d="M756 684h150M756 702h120M756 720h156M756 738h100"/></g></g>
  <g transform="rotate(-2 900 720)"><rect x="830" y="660" width="170" height="130" fill="#fffaf0"/><path d="M846 690q40 -10 80 6t60 -4" stroke="#2a2a6a" stroke-width="2.5" fill="none"/><g stroke="#2a2a6a" stroke-width="2"><path d="M846 712h120M846 728h100M846 744h130"/></g><rect x="950" y="668" width="40" height="30" fill="#e8c860" stroke="#a8862a"/></g></g>
<g id="folder" class="hot"><rect x="1080" y="660" width="260" height="170" fill="#3a5a7a" stroke="#1d2e40" stroke-width="3" transform="rotate(3 1210 745)"/><text x="1210" y="752" class="sm" font-size="14" fill="#e6eef6" transform="rotate(3 1210 745)">PHOTOGRAPHS</text></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#vigL)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">Ring the caf&#233;</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="arch.js"></script>
<script src="files.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, lt = null, kk = null;
  (function () { var s = '', x; for (x = -1000; x < 2600; x += 90) s += '<rect x="' + x + '" y="-700" width="40" height="1260"/>'; $('#stripes').innerHTML = s; })();

  ER.init({
    theme: 'duo', story: 'archive-b', storyTitle: 'Still Here', id: 'letters', no: 'V', title: 'Letters from Spain',
    go: 'Open the last envelope',
    intro: [
      'Mr Gorringe&rsquo;s statement was the one that could not be true. He said that at twenty to nine he was at the front window, looking at St Aidan&rsquo;s clock. Your partner looked: from the front window you can see the lime tree and the Assembly Rooms, and no church at all. The clock can be seen only from the back window, beside the main switch. (Miss Dancy&rsquo;s street lamp is hidden by the tree today, but in 1979 the tree was two years old.)',
      'So he put the lights out himself, and threw the empty frame down the cellar steps after Lewis. But where did the painting go?',
      'Mr Furnival has wheeled the box back to your desk by the street window. The rain has stopped. The last envelope says LETTERS, and there is a folder with it: PHOTOGRAPHS.'
    ],
    exit: {"next":"found","w":{"96466e67":"0ea2934d"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b5-told') || {}; nextFile = ER.flag('b5-file') || null;
  var found = !!ER.flag('b5-found');
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b5-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.letters ? 1 : 0) + (told.photos ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) AR.card([['Tell your partner', ['&ldquo;It&rsquo;s the real one. It&rsquo;s the painting in the insurer&rsquo;s photograph of 1979.&rdquo;']]]);
    else if (told.letters) AR.card([['Tell your partner', ['&ldquo;In 1980 he asked the bank for his portrait. Ivy painted it in 1960. And two weeks before the party he had its frame made deeper, to 6 centimetres.&rdquo;', '&ldquo;In June&rsquo;s photo his scar is on the left, but the photo is in a mirror, so &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;How many bows are there on the kite&rsquo;s tail? Is there a dog? A bird?&rdquo;']]]);
    else AR.card([['Ask your partner', ['&ldquo;What is on the wall of strangers? Describe each portrait.&rdquo;']], ['Tell your partner', ['&ldquo;There are five letters in the last envelope. One is from Mr Gorringe, in Spain.&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The painting is The Blue Kite. Ring the café.']];
    if (!told.letters) return ['letters', [
      'Read the letters in the envelope, in the order of their dates. One of them is from Mr Gorringe himself, in 1980, asking for something he left behind.',
      'He asks for his portrait, painted in 1960, which hung in his office. The framer&rsquo;s bill says what was done to that portrait two weeks before the party. Tell your partner both.'
    ]];
    return ['kite', [
      'Your partner may find a painting. The folder has three photographs of a girl with a kite, and only one of them is The Blue Kite that was stolen. Ask your partner to describe what they find, in detail.',
      'Ask closed questions, one at a time: how big is it? How many bows are on the tail? Is there a bird? A dog? Which side is the church?',
      'The study of 1951 is smaller, 41 by 30. The copy sold in London in 1985 is the right size, but look at what it has and has not got. Only one photograph has everything your partner can see.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The insurer&rsquo;s photograph of 1979 is on your desk, with a small pencil tick on it.'); return; }
    if (told.intro) { busy = false; ER.say('The letters, the folder of photographs, and the street window.'); return; }
    ER.narrate([
      'Outside the window the street is shining, and people are folding their umbrellas.',
      'The envelope is thin. Five letters, held together with a rusty pin, and in the folder three photographs of a girl flying a kite, each a little different from the others.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the letters ---------- */
  function makeLetters() {
    var box = ER.el('div', 'bx'), s = '<div class="lt"><div class="lt-list">';
    FL.LETTERS.forEach(function (l) { s += '<button type="button" data-l="' + l.id + '"><b>' + l.title + '</b>' + l.date + '</button>'; });
    box.innerHTML = s + '</div><div class="lt-view"><p style="font-family:EB Garamond,serif;font-size:18px;color:#f3ead8;margin:40px 10px">Five letters, in the order of their dates. Choose one to read.</p></div></div>';
    var view = box.querySelector('.lt-view');
    box.querySelector('.lt-list').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      var l = FL.LETTERS.filter(function (x) { return x.id === b.getAttribute('data-l'); })[0];
      ER.$$('.lt-list button', box).forEach(function (o) { o.classList.toggle('on', o === b); });
      ER.sfx.paper();
      var html = '<h4>' + l.date + '</h4>' + l.html;
      view.innerHTML = ''; view.appendChild(ER.el('div', 'doc letter2', ER.gloss(html)));
      ER.addClue('l-' + l.id, l.title.replace(/&rsquo;/g, '’') + ', ' + l.date, html, 'letter2', 'Letter', true);
      if (l.id === 'spain' && tell('letters')) paint();
    });
    return { open: function () { ER.open('ov-read', box); } };
  }
  $('#letters').addEventListener('click', function () { if (busy) return; if (!lt) lt = makeLetters(); lt.open(); });

  /* ---------- the photographs: which one is the painting your partner has found? ---------- */
  function makeKites() {
    var box = ER.el('div', 'bx'), s = '<div class="kk">';
    FL.KITES.forEach(function (k) { s += '<div class="kk-c"><h6>' + k.title + '</h6>' + FL.kite(k.o) + '<p>' + k.cap + '</p><button type="button" class="btn" data-k="' + k.id + '">This is the one</button></div>'; });
    box.innerHTML = s + '</div><div class="bx-foot"><p class="pmsg"></p></div>';
    var msg = function (t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); };
    ER.$$('.kk-c .btn', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-k');
        if (!found) { msg('Not yet. You can only say which one it is when your partner has found a painting and described it to you.'); return; }
        var file = ER.exit([id], { wait: true });
        if (!file) {
          ER.sfx.no();
          msg(id === 'k51' ? 'Mr Furnival reads the caption. &ldquo;Forty-one by thirty. Did your partner measure what they found?&rdquo;' : 'Mr Furnival looks at the photograph for a long time. &ldquo;The right size,&rdquo; he says. &ldquo;Has it got everything your partner can see? Ask about the small things.&rdquo;');
          return;
        }
        nextFile = file; ER.flag('b5-file', file);
        AR.tell('v-match');
        ER.$$('.kk-c .btn', box).forEach(function (o) { o.disabled = true; });
        msg('You put a small pencil tick in the corner of the insurer&rsquo;s photograph.');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            'It is the one. Seven bows on the tail, the gull, the dog, St Aidan&rsquo;s spire on the right. The Blue Kite, by Ivy Dancy, 1952, oil on canvas, 61 by 46 centimetres. Insured on Friday 2 November 1979 for &pound;15,000.',
            'On Saturday 10 November its owner collected his own portrait from the framer, with a deeper frame and a back on hinges. On Saturday 24 November, in four minutes of darkness, he put one painting inside the other. In June 1980, from Spain, he asked the bank to send him his portrait. It is worth nothing, he wrote, to anybody but me.',
            'Mr Furnival takes off his glasses, cleans them, and puts them on again. &ldquo;I have been an archivist for thirty-one years,&rdquo; he says, &ldquo;and that is the first time a box has solved anything while I was watching.&rdquo;'
          ], function () { busy = false; paint(); });
        }, 2400);
      });
    });
    msg(found ? 'Your partner has found a painting. Which of these three is it?' : 'Three photographs of a girl with a kite. Only one of them is The Blue Kite that was stolen.');
    return { open: function () { msg(found ? 'Your partner has found a painting. Which of these three is it?' : 'Three photographs of a girl with a kite. Only one of them is The Blue Kite that was stolen.'); ER.open('ov-lock', box); } };
  }
  $('#folder').addEventListener('click', function () { if (busy) return; if (tell('photos')) paint(); if (!kk) kk = makeKites(); kk.open(); });
  AR.thing('#trolley', 'trolley', 'Mr Furnival&rsquo;s trolley, and box P/79/114 on it, nearly empty now.', isBusy);
  AR.thing('#win', null, 'The street outside the Record Office, shining after the rain. A bus goes past. A man with a newspaper over his head has not noticed that the rain has stopped.', isBusy);

  /* ---------- the partner's screen: a painting has been found ---------- */
  AR.live('v-found', function () {
    found = true; ER.flag('b5-found', 1);
    document.body.classList.remove('fly'); void document.body.offsetWidth; document.body.classList.add('fly');
    ER.say('Outside the window, for a moment, a blue kite goes past over the roofs, high and steady, with white bows on its tail. Nobody in the street looks up. Your partner has found something.');
  }, 'My partner has found a painting');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
