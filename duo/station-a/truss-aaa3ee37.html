<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Truss · Read It Back</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-duo.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="suit.css">
<style>
  body{--bg:#020409;--accent:#ffc65a;--font-display:'Oswald',sans-serif;--font-ui:'Outfit',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(2,6,14,.95);--tc-ink:#f2f4f1;--cap-bg:rgba(4,8,18,.93);--panel:#121821;--face-bg:#1d2a36;--q-ink:#ffd8a0;--fade:#000;--hud-bg:rgba(4,8,18,.84)}
  .hr{cursor:pointer}
  .hr:hover .bar{stroke:#fff3b0}
  .hr.here .ringme{display:inline}
  .ringme{display:none}
  .drift{animation:drift 90s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
  .glint{animation:glint 5s steps(2,end) infinite}
  @keyframes glint{50%{opacity:.55}}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="earthT" cx="50%" cy="0%" r="60%"><stop offset="0" stop-color="#5db0ea"/><stop offset=".5" stop-color="#2468a8"/><stop offset="1" stop-color="#0c2a52"/></radialGradient>
  <radialGradient id="sunT" cx="26%" cy="28%" r="40%"><stop offset="0" stop-color="#fff9e0" stop-opacity=".55"/><stop offset=".08" stop-color="#fff2c0" stop-opacity=".12"/><stop offset="1" stop-color="#fff2c0" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c06a"/><stop offset=".5" stop-color="#b8862a"/><stop offset="1" stop-color="#f0d28a"/></linearGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#020409"/>
<g id="farstars"></g>
<!-- the Earth below -->
<g id="earth" class="hot"><circle cx="800" cy="2700" r="2000" fill="url(#earthT)"/><g class="drift" fill="#f2f6fa" opacity=".85"><ellipse cx="300" cy="760" rx="160" ry="22"/><ellipse cx="760" cy="740" rx="220" ry="26"/><ellipse cx="1250" cy="770" rx="180" ry="20"/><ellipse cx="1700" cy="750" rx="200" ry="24"/><ellipse cx="2100" cy="770" rx="160" ry="20"/><ellipse cx="560" cy="830" rx="260" ry="30"/><ellipse cx="1500" cy="850" rx="240" ry="28"/></g>
  <path d="M-1000 772Q800 640 2600 772" stroke="#a8dcff" stroke-width="8" fill="none" opacity=".7"/></g>
<!-- a solar wing behind the truss -->
<g id="wing" class="hot"><path d="M640 330V250" stroke="#9aa29c" stroke-width="10"/><rect x="380" y="40" width="560" height="210" fill="#122c5a" stroke="#c9ccc6" stroke-width="5"/><g stroke="#2d4e8a" stroke-width="2" id="wgrid"></g><rect x="380" y="40" width="560" height="210" fill="#fff" fill-opacity=".08" class="glint"/></g>
<!-- the airlock module, with its hatch open -->
<g id="module"><path d="M-400 280h560q40 0 40 40v300q0 40 -40 40h-560z" fill="#e9ebe5" stroke="#b8bdb5" stroke-width="4"/><g stroke="#c9cdc5" stroke-width="3"><path d="M-400 340h580M-400 560h580M40 280v380M120 280v380"/></g>
  <ellipse cx="196" cy="470" rx="22" ry="86" fill="#04070c" stroke="#9aa29c" stroke-width="6"/><circle cx="196" cy="420" r="6" fill="#3a4046"/></g>
<!-- the truss: a long box girder, seen from the side -->
<path d="M210 300H1300L1320 330H230Z" fill="#c4c8c2" stroke="#8a9089" stroke-width="3"/>
<rect x="230" y="330" width="1090" height="290" fill="#d9dcd6" stroke="#8a9089" stroke-width="4"/>
<g stroke="#a3a9a2" stroke-width="5" fill="none" id="lattice"></g>
<!-- the camera boom, crossing the top of the truss just after handrail 15 -->
<g id="camera" class="hot"><path d="M752 300V180" stroke="#8a9089" stroke-width="12"/><path d="M700 300h104" stroke="#8a9089" stroke-width="16"/><rect x="712" y="134" width="84" height="56" rx="6" fill="#3a4046" stroke="#1e2226" stroke-width="3"/><circle cx="796" cy="162" r="18" fill="#10161c" stroke="#5c6267" stroke-width="4"/><circle cx="796" cy="162" r="7" fill="#4a7ab8"/></g>
<!-- the radiator: a big white panel on the front of the truss -->
<g id="radiator" class="hot"><rect x="740" y="372" width="372" height="196" fill="#f6f7f3" stroke="#a9afa7" stroke-width="4"/><g stroke="#dadfd8" stroke-width="3"><path d="M772 380v180M804 380v180M836 380v180M868 380v180M900 380v180M932 380v180M964 380v180M996 380v180M1028 380v180M1060 380v180M1092 380v180"/></g>
  <text x="926" y="404" class="st" font-size="20" fill="#c4372b" letter-spacing="3">DO NOT TOUCH</text></g>
<!-- the cooling pipe along the bottom edge, near the airlock -->
<g id="pipe" class="hot"><path d="M210 640H580" stroke="#7d858c" stroke-width="18"/><path d="M210 634H580" stroke="#c9d1d6" stroke-width="5"/><path d="M580 640q30 0 30 -30V600" stroke="#7d858c" stroke-width="18" fill="none"/></g>
<!-- the mast and the dish -->
<g id="mast" class="hot"><rect x="1320" y="60" width="60" height="580" fill="#cfd3cd" stroke="#8a9089" stroke-width="4"/><g stroke="#a3a9a2" stroke-width="4" id="mlat"></g>
  <path d="M1350 60l60 -20" stroke="#8a9089" stroke-width="10"/><ellipse cx="1470" cy="20" rx="70" ry="140" fill="#eef0ec" stroke="#a9afa7" stroke-width="5" transform="rotate(-20 1470 20)"/><path d="M1410 40l110 -40" stroke="#8a9089" stroke-width="5"/>
  <rect x="1300" y="600" width="100" height="70" rx="6" fill="url(#gold)" stroke="#7a5a1a" stroke-width="3"/><text x="1350" y="642" class="st" font-size="15" fill="#3a2a08">FOOT</text></g>
<!-- the safety tether, from the hatch to your hands -->
<path id="tether" d="M200 440L300 312" stroke="#f0e8c8" stroke-width="2.5" fill="none" stroke-dasharray="2 5" pointer-events="none"/>
<g id="rails"></g>
<!-- the bag on your hip, with the spare box in it -->
<g id="bag" class="hot"><path d="M1400 1000q-30 -190 40 -230h220v230z" fill="#eceee8" stroke="#b8bdb5" stroke-width="5"/><path d="M1470 780v-40q0 -20 30 -20h80" stroke="#3a4046" stroke-width="8" fill="none"/><rect x="1430" y="800" width="120" height="70" rx="4" fill="#fbfbf7" stroke="#e8562a" stroke-width="4" transform="rotate(-8 1490 835)"/>
  <g stroke="#3a4046" stroke-width="3" transform="rotate(-8 1490 835)"><path d="M1444 820h90M1444 836h70M1444 852h80"/></g></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#sunT)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">To the foot of the mast</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="suit.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, st = {}, holdUntil = 0;
  var X = [300, 480, 660, 840, 1020, 1200], ROW = { t: 312, f: 470, b: 632 };
  var NUM = { t: [13, 14, 15, 16, 17, 18], f: [31, 32, 33, 34, 35, 36], b: [50, 51, 52, 53, 54, 55] };
  var FADED = { t2: 1, t4: 1, t5: 1, t6: 1, f1: 1, f2: 1, f4: 1, f5: 1, f6: 1, b4: 1, b5: 1 };
  var CAP = { t3: 'blue', b1: 'blue', t5: 'green' };
  function pos(n) { if (n === 'h') return [196, 470]; if (n === 'm') return [1350, 610]; return [X[+n.charAt(1) - 1], ROW[n.charAt(0)]]; }

  (function draw() {
    var s = '', i, k, r, x, y;
    for (i = 230; i < 1320; i += 109) s += '<path d="M' + i + ' 330L' + (i + 109) + ' 620M' + (i + 109) + ' 330L' + i + ' 620"/>';
    $('#lattice').innerHTML = s; s = '';
    for (i = 60; i < 640; i += 58) s += '<path d="M1320 ' + i + 'L1380 ' + (i + 58) + 'M1380 ' + i + 'L1320 ' + (i + 58) + '"/>';
    $('#mlat').innerHTML = s; s = '';
    for (i = 1; i < 8; i++) s += '<path d="M' + (380 + i * 70) + ' 40v210"/>';
    for (i = 1; i < 3; i++) s += '<path d="M380 ' + (40 + i * 70) + 'h560"/>';
    $('#wgrid').innerHTML = s; s = '';
    ['t', 'f', 'b'].forEach(function (rw) {
      for (k = 0; k < 6; k++) {
        r = rw + (k + 1); x = X[k]; y = ROW[rw];
        s += '<g class="hr" data-n="' + r + '"><rect x="' + (x - 56) + '" y="' + (y - 34) + '" width="112" height="62" fill="#000" fill-opacity="0"/>';
        s += '<circle class="ringme" cx="' + x + '" cy="' + y + '" r="46" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 6"/>';
        if (rw === 't') s += '<path d="M' + (x - 34) + ' ' + (y + 10) + 'v-14h68v14" stroke="#7a5a12" stroke-width="5" fill="none"/>';
        else if (rw === 'b') s += '<path d="M' + (x - 34) + ' ' + (y - 10) + 'v14h68v-14" stroke="#7a5a12" stroke-width="5" fill="none"/>';
        s += '<path class="bar" d="M' + (x - 36) + ' ' + (y + (rw === 't' ? -4 : rw === 'b' ? 4 : 0)) + 'h72" stroke="#e8c33a" stroke-width="13" stroke-linecap="round"/>';
        if (CAP[r]) s += '<rect x="' + (x - 46) + '" y="' + (y + (rw === 't' ? -13 : rw === 'b' ? -5 : -9)) + '" width="14" height="18" rx="3" fill="' + (CAP[r] === 'blue' ? '#2f62d0' : '#2f9a4a') + '"/>';
        s += '<text x="' + x + '" y="' + (y + (rw === 't' ? 1 : rw === 'b' ? 9 : 5)) + '" class="st" font-size="12" fill="#2a2208"' + (FADED[r] ? ' opacity=".18"' : '') + '>' + (FADED[r] ? '· ·' : NUM[rw][k]) + '</text></g>';
      }
    });
    $('#rails').innerHTML = s;
    $('#farstars').innerHTML = SU.stars(30, 5, -1000, -700, 3600, 1300, '#cfd8ff');
  })();

  ER.init({
    theme: 'duo', story: 'station-a', storyTitle: 'Read It Back', id: 'truss', no: 'II', title: 'The Truss',
    go: 'Look along the truss',
    intro: [
      'Control found the step that was in the wrong place: the hatch was on Rev F before the depress valve, and your sticker said it would not open until the gauge read zero. So: the suit check (two nine point six, nine one, five zero: all GO), then the striped T-handle until zero, then the hatch, then the safety tether on the D-shaped ring with the yellow tag, and out.',
      'It is two minutes to two, GMT. The sun came up over the edge of the Earth at fourteen minutes to two. It will go down again at eighteen minutes to three.'
    ],
    exit: {"next":"mast","w":{"c4879434":"b23ce86c"}}, tags: {"path":["32cf393d","56d2a651","04839732","470d53d6","a3b08932","812044c3","7549188b","61e65aef"]},
    hints: hints, onBegin: begin
  });

  st = ER.flag('a2') || {};
  st.path = st.path || [];
  function save() { ER.flag('a2', st); }
  function isBusy() { return busy; }
  function cur() { return st.path.length ? st.path[st.path.length - 1] : 'h'; }
  function held() { if (Date.now() < holdUntil) { ER.say('Flight is still holding. Wait for the go.'); return true; } return false; }
  function paint() {
    var c = cur(), p = pos(c);
    ER.$$('.hr').forEach(function (n) { n.classList.toggle('here', n.getAttribute('data-n') === c); });
    $('#tether').setAttribute('d', 'M200 440Q' + ((200 + p[0]) / 2).toFixed(0) + ' ' + (Math.min(440, p[1]) - 60) + ' ' + p[0] + ' ' + p[1]);
    $('#go').classList.toggle('on', !!st.file);
    ER.pips(Math.min(st.path.length, 9) + (st.tag ? 1 : 0), 10);
    if (st.file) SU.card([['Tell your partner', ['&ldquo;Control, EV One. I&rsquo;m at the foot of the mast. The safety tether is with me.&rdquo;']]]);
    else if (!st.tag) SU.card([['Tell your partner', ['&ldquo;Control, EV One. The tag on the spare box says &hellip; . Spelling: Mike &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;Which manual is it? What is the path to the mast?&rdquo;']]]);
    else SU.card([['Ask your partner', ['&ldquo;Read me the next step, please.&rdquo;', '&ldquo;Did you say one five or five zero?&rdquo;']], ['Tell your partner', ['&ldquo;I&rsquo;m on handrail &hellip; . I can see a blue cap on &hellip;&rdquo;']]]);
  }
  function hints() {
    if (st.file) return ['go', ['You are at the foot of the mast. The button at the bottom of the screen takes you there.']];
    if (!st.tag) return ['tag', [
      'Control has a whole shelf of manuals and needs to know which one to open. What you need is on the tag of the white bag on your hip (bottom right).',
      'Read the tag to Control. Spell the mast type with the spelling alphabet, and say the panel issue and the serial number digit by digit.'
    ]];
    return ['route', [
      'Ask Control to read you the translation path from the manual, one step at a time. Read each step back before you move. Click a handrail to move your hands to it.',
      'Each handrail has a number, but the sun has faded most of them. Tell Control what you can see: caps and their colours, the camera boom, the white radiator, the silver pipe. Two handrails have blue caps. Did Control say one five or five zero?',
      'You can only reach the next handrail along, or the one just above or below. If Flight stops you, you go back to your last tether point: the hatch, or handrail 15 once you have clipped on there.'
    ]];
  }
  function begin() {
    paint();
    if (st.file) { busy = false; ER.say('The foot of the mast. The dish is above you, pointing at nothing.'); return; }
    if (st.intro) { busy = false; ER.say('The truss. Handrails, the camera boom, the radiator, and the mast at the far end.'); return; }
    ER.narrate([
      'Outside. The station is bigger than it looked in the pictures, and brighter: white and gold and silver in a sunlight that nothing softens, because out here there is no air to soften it.',
      'From the hatch, the truss runs away from you like a long steel bridge with nothing under it, out to the antenna mast at the far end. On top of the mast the big dish is pointing at empty black sky.',
      'Your safety tether reels out behind you from its ring in the hatch. On your hip, in a white bag, is the spare pointing box: the box that turns the dish. The ground thinks the old one has failed. You are carrying the new one out to the mast.',
      'Eighteen yellow handrails, a camera, a radiator, a pipe. Somewhere on the ground there is a page that says which handrails to use, and in what order.'
    ], function () { busy = false; st.intro = 1; save(); paint(); });
  }

  /* ---------- the tag on the bag ---------- */
  var TAG = '<h4>Tag on the bag</h4><p>VESPER STATION · SPARE<br>POINTING BOX for ANTENNA MAST<br><br>MAST TYPE: &nbsp;M3-B<br>PANEL: &nbsp;ISSUE 2<br>SERIAL: &nbsp;0516<br>TESTED: &nbsp;02.10.26 &nbsp;GOOD</p><p>Underneath, in pencil: <em>heavy. clip it on.</em></p>';
  $('#bag').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TAG, cls: 'tag', clue: { id: 'tag', title: 'The tag on the spare box', kind: 'On your hip' }, done: function () { if (!st.tag) { st.tag = 1; save(); paint(); } } });
    ER.addWord('pointing box', 'the box of electronics and motors that turns the dish to point it');
  });

  /* ---------- moving hand over hand ---------- */
  function near(a, b) {
    if (a === 'h') return b === 't1' || b === 'f1' || b === 'b1';
    if (b === 'm') return a === 't6' || a === 'f6' || a === 'b6';
    if (b === 'h' || a === 'm') return false;
    var r1 = 'tfb'.indexOf(a.charAt(0)), r2 = 'tfb'.indexOf(b.charAt(0)), c1 = +a.charAt(1), c2 = +b.charAt(1);
    return (r1 === r2 && Math.abs(c1 - c2) === 1) || (c1 === c2 && Math.abs(r1 - r2) === 1);
  }
  function stop(why) {
    ER.sfx.no();
    var back = st.clip ? st.path.slice(0, st.path.indexOf('t3') + 1) : [];
    st.path = back; save(); paint();
    holdUntil = Date.now() + 8000;
    ER.say(why + ' Flight calls an all-stop, and you go back, hand over hand, to your last tether point: ' + (st.clip ? 'handrail 15' : 'the hatch') + '.', 7000);
  }
  function move(n) {
    if (busy || held() || st.file) return;
    var c = cur();
    if (n === c) { ER.say(c === 'm' ? 'The foot of the mast.' : 'Your hands are on this one.'); return; }
    if (!near(c, n)) { ER.say('Hand over hand: you can only reach the next handrail along, or the one just above or below the one you are holding.'); return; }
    if (c === 't3' && !st.clip) { ER.sfx.no(); ER.say('You reach over the edge of the truss, and stop. A blue cap means a tether point, and you have not clipped on here. Going over an edge unclipped is the one thing everybody told you never to do.', 6500); return; }
    if (/^t[456]$/.test(n)) { stop('The camera boom crosses the top of the truss right in front of your visor. To get past it you would have to climb over the camera, and Control would have to explain the boot print to everybody.'); return; }
    if (n === 'f4' || n === 'f5') { stop('That handrail is on the radiator, and the radiator says DO NOT TOUCH in red letters a hand high. Its thin fins bend if you look at them hard.'); return; }
    if (n === 'b1' || n === 'b2') { stop('A silver pipe runs along that handrail and is clipped to it: the cooling pipe. A glove on that handrail is a glove on the pipe.'); return; }
    var next = st.path.concat(n === 'm' ? [] : [n]);
    if (n === 'm') {
      var file = ER.exit([st.path.join('-') + '-m'], { wait: true });
      if (!file) { stop('You reach for the foot of the mast, but you came by a way Control never cleared.'); return; }
      st.file = file; save(); busy = true; SU.sfx.clip(); paint();
      ER.narrate([
        'You pull yourself the last metre and take hold of the foot of the mast. Twenty-two metres of safety tether lie behind you along the truss, like a line of thread across a carpet.',
        'Above you the mast goes up into the sun, and the dish at the top of it stares at nothing. At its foot, right in front of your visor, is a square grey panel with six bolts in it.',
        'You are hanging upside down. Or the mast is. Out here it is very hard to say which.'
      ], function () { busy = false; paint(); });
      return;
    }
    if (!ER.check('path', next.join('-'))) { stop('Control has not cleared that handrail.'); return; }
    st.path = next; save(); SU.sfx.clip(); paint();
    if (n === 't3' && !st.clip) clipOn();
  }
  function clipOn() {
    SU.look({
      kicker: 'Handrail 15 · a blue cap', title: 'A tether point',
      pic: '<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="300" fill="#05080d"/><path d="M60 170h260" stroke="#e8c33a" stroke-width="40" stroke-linecap="round"/><rect x="30" y="140" width="44" height="60" rx="8" fill="#2f62d0"/><text x="200" y="182" font-family="Stardos Stencil,serif" font-weight="700" font-size="34" fill="#2a2208" text-anchor="middle">15</text><path d="M260 120q30 -50 70 -30" stroke="#3a4046" stroke-width="10" fill="none"/></svg>',
      text: '<p>A yellow handrail with a blue cap on its end, and the number 15. A blue cap means a tether point: a strong handrail, where you clip on before you do anything difficult, like going over the edge of the truss.</p><p>Your waist tether is still clipped to the handrail by the hatch.</p>',
      acts: [{ id: 'clipnew', label: 'Clip your waist tether on here', fn: function (api) {
        SU.sfx.clip(); st.clip = 1; save();
        api.msg('Click. You clip the hook on handrail 15 first, and only then let the other end go from the handrail by the hatch. For a moment you were clipped on twice. That is exactly how it is meant to be.');
        api.acts([]);
        ER.addWord('tether point', 'a strong place on the outside of a station where a tether can be clipped');
      } }, { id: 'unclip', label: 'Unclip it from the hatch first', fn: function (api) {
        ER.sfx.no(); api.msg('Your hand stops on the clip. Never let go of anything that is not clipped to something: not tools, and not you. Clip on to the new handrail first; then let go of the old one.');
      } }]
    });
  }
  $('#rails').addEventListener('click', function (e) { var g = e.target.closest ? e.target.closest('.hr') : null; if (g) move(g.getAttribute('data-n')); });
  $('#mast').addEventListener('click', function () { if (cur() === 'b6' || cur() === 't6' || cur() === 'f6') move('m'); else if (!busy) ER.say('The antenna mast, at the far end of the truss, with the dish on top. Its foot is where you are going.'); });

  /* ---------- other things ---------- */
  SU.thing('#camera', 'camera boom', 'The camera boom: a pole with a camera on top, crossing the top of the truss. Somebody on the ground is probably watching you through it, though without the dish the pictures cannot get down.', isBusy);
  SU.thing('#radiator', 'radiator', 'The radiator: a big white panel of thin fins that lets the station&rsquo;s heat out into space. It says DO NOT TOUCH. The fins are as thin as paper.', isBusy);
  SU.thing('#pipe', null, 'A silver pipe along the bottom edge of the truss, carrying cooling liquid to the radiator. It is clipped to the first two handrails on the bottom edge.', isBusy);
  SU.thing('#wing', 'solar panel', 'A solar wing: dark blue panels that turn sunlight into electricity. In thirty-six minutes of every ninety-two the station is in the Earth&rsquo;s shadow, and the batteries take over.', isBusy);
  SU.thing('#earth', null, 'The Earth: blue, white and enormous, sliding past below you at nearly eight kilometres a second. From up here it looks as if it is hardly moving at all.', isBusy);
  SU.thing('#module', null, 'The airlock, and its open hatch. Your safety tether runs back to the ring inside it.', isBusy);
  $('#go').addEventListener('click', function () { if (st.file && !busy) ER.leave(st.file); });
})();
</script>
</body>
</html>
