<style>
  body{--bg:#6c747c;--accent:#ff8a6a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(20,26,34,.95);--tc-ink:#f2f4f6;--cap-bg:rgba(20,26,34,.93);--panel:#101a26;--face-bg:#162231;--q-ink:#ffc0a8;--fade:#06080a;--hud-bg:rgba(20,26,34,.84)}
  .wb{font-family:'Caveat',cursive;font-weight:700}
  #sunhand{transform-origin:1230px 300px;animation:sunh 30s linear infinite}
  @keyframes sunh{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .rep{padding:16px 20px 4px;font-family:'Space Mono',monospace;color:#e8f0f6}
  .rep h5{margin:0 0 4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.16em;color:#ffc0a8}
  .rep p{margin:10px 0 6px;font-family:'EB Garamond',serif;font-size:18px}
  .rep .row{display:flex;flex-wrap:wrap;gap:8px}
  .rep button{padding:7px 14px;border:1px solid #4a6a88;color:#c9d8e4;font-family:'Space Mono',monospace;font-weight:700;font-size:15px}
  .rep button.on{background:#c2421b;border-color:#ff8a6a;color:#fff}
  .rep .finds button{display:block;width:100%;text-align:left;font-family:'EB Garamond',serif;font-weight:400;font-size:17px;margin:0 0 5px}
</style>

    <text x="160" y="406" font-size="30">16:57 - 17:03  low, 6 min (too short)</text><text x="160" y="446" font-size="30">next: 03:10 tomorrow</text>
    <text x="160" y="508" font-size="26" fill="#2f62b0">PLAN: hatch 13:55 · mast 14:15 · panel 14:30 · new box before sunset · test 15:20</text></g>
  
  <path d="M392 382q100 14 196 -4" stroke="#b3261c" stroke-width="3" fill="none"/>

    <circle r="40" fill="#2f62b0"/><text y="-160" class="wb" font-size="24" fill="#1b2a4a" text-anchor="middle">day 56</text><text y="190" class="wb" font-size="24" fill="#1b2a4a" text-anchor="middle">night 36</text>

  <rect x="430" y="720" width="140" height="110" fill="none" stroke="#2a3644" stroke-width="3"/><g fill="none" stroke="#2a3644" stroke-width="2"><circle cx="455" cy="740" r="8"/><circle cx="500" cy="740" r="8"/><rect x="537" y="732" width="16" height="16"/><rect x="447" y="802" width="16" height="16"/><circle cx="500" cy="810" r="8"/><circle cx="545" cy="810" r="8"/></g>
  <g stroke="#5a6470" stroke-width="2"><path d="M630 730h150M630 750h130M630 770h146M630 790h110"/></g><text x="500" y="712" font-family="Space Mono,monospace" font-weight="700" font-size="12" fill="#1d6aa8" text-anchor="middle">3-18</text></g>

  <g stroke="#2f4a66" stroke-width="2"><path d="M934 752h192M934 776h192M934 800h150M934 824h170"/></g></g>

  <path d="M1440 760q-40 -100 -40 -170" stroke="#3b4250" stroke-width="30" fill="none" stroke-linecap="round"/><rect x="1388" y="560" width="14" height="44" rx="4" fill="#b3261c" transform="rotate(-20 1395 582)"/></g>

</div>
<button type="button" class="gobtn" id="go">Into the dark</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="ops.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null;

  ER.init({
    theme: 'duo', story: 'station-b', storyTitle: 'Read It Back', id: 'whiteboard', no: 'III', title: 'The Whiteboard',
    go: 'Turn to the board',
    intro: [
      'EV One reached the foot of the mast by the path on page 3-12: up to 13, along the top to 15 (one five, with the blue cap, not five zero), clipped on there, down the front to 33, on down to 52, along the bottom edge to 55, and up to the mast. The tag on the spare box said mast type M3-B, panel issue 2: so the binder was Rev D, the only one written for panel issue 2.',
      'It is twelve minutes past two, GMT. Up there, the sun sets at 14:42.'
    ],
    exit: {"next":"backroom","w":{"5bfe57da":"2ba8d379"}}, tags: {"bolt":["6a939fb5"],"find":["a579daf4"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b3-told') || {}; nextFile = ER.flag('b3-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b3-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.board ? 1 : 0) + (told.panel ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) OP.card([['Tell your partner', ['&ldquo;EV One, Control. Copy: the box is fine and the bracket is torn off. Sunset in &hellip; minutes. Helmet lights on.&rdquo;']]]);
    else if (told.panel) OP.card([['Tell your partner', ['&ldquo;Undo four bolts and leave two. The two that stay are &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;Which bolt has the broken stripe? Where is it on your panel?&rdquo;', '&ldquo;Which way up are you? Where does the UP on your panel point?&rdquo;', '&ldquo;What can you see behind the panel?&rdquo;']]]);
    else OP.card([['Ask your partner', ['&ldquo;EV One, Control. Please describe the six bolts on the panel: shape and position.&rdquo;']], ['Tell your partner', ['&ldquo;Sunset is at one four four two. That is in &hellip; minutes.&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The report is filed. Up there the sun is setting. When EV One is ready, go on: the button at the bottom of the screen.']];
    if (!told.panel) return ['panel', [
      'The manual on the desk is open at page 3-18: the drawing of Panel 4. Read it, then tell EV One which four bolts to undo and which two must stay, by their shapes and by where they are.',
      'The bolts have numbers only on your drawing. EV One sees shapes: hexagonal, square, a washer, a notch. Describe them that way.'
    ]];
    return ['report', [
      'Flight needs an anomaly report (the screen on the desk): the number of the bolt with the broken stripe, from your drawing, and what EV One finds behind the panel. If EV One says the panel does not look like your drawing, ask which way up EV One is.',
      'Look at the word UP on the drawing, and ask EV One where the word UP on the real panel is, and which way its arrow points. If it points the other way, EV One is upside down compared with your drawing.',
      'Upside down, the drawing&rsquo;s top left is EV One&rsquo;s bottom right, and the two hinge bolts on the drawing&rsquo;s right are on EV One&rsquo;s left. Turn the broken stripe round the same way to find its number.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The report is filed. The board says sunset at 14:42.'); return; }
    if (told.intro) { busy = false; ER.say('The whiteboard, the manual at page 3-18, the report, the clock.'); return; }
    ER.narrate([
      'On the side wall of the Ops Room, the whiteboard is covered from edge to edge in Flight&rsquo;s red and blue handwriting: today&rsquo;s sunrises and sunsets, the passes over Yarnside, and the plan.',
      '&ldquo;Panel 4 next,&rdquo; says Flight. &ldquo;The drawing is on page 3-18. Six bolts: four come out, two stay in. Get them the wrong way round and EV One will be holding a panel that wants to go for a walk on its own.&rdquo;',
      'The clock says 14:12. Up there, the sun sets at 14:42.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  $('#board').addEventListener('click', function () { if (!busy) OP.board(function () { if (tell('board')) paint(); }); });
  $('#man').addEventListener('click', function () { if (!busy) OP.panel(function () { if (tell('panel')) paint(); }); });

  /* ---------- the anomaly report: the lock ---------- */
  var FIND = [
    ['burnt', 'The pointing box is burnt: black marks on it.'],
    ['bracket', 'The cable bracket is torn off its posts, and the plugs are out.'],
    ['cut', 'One of the cables is cut through.'],
    ['nothing', 'Nothing is wrong behind the panel.']
  ];
  var bolt = ER.flag('b3-bolt') || '', find = ER.flag('b3-find') || '';
  $('#report').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The anomaly report is filed.'); return; }
    var api = OP.work({
      cls: 'rpt',
      html: '<div class="rep"><h5>ANOMALY REPORT · PANEL 4</h5><p>The bolt with a broken torque stripe (its number on the drawing, page 3-18):</p><div class="row bolts">' +
        ['B1', 'B2', 'B3', 'B4', 'B5', 'B6'].map(function (b) { return '<button type="button" data-b="' + b + '">' + b + '</button>'; }).join('') + '</div>' +
        '<p>What EV One found behind the panel:</p><div class="finds">' + FIND.map(function (f) { return '<button type="button" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div></div>',
      btn: [{ id: 'file', label: 'File the report', fn: file }],
      msg: 'Flight will read it, and so will everybody who ever opens Panel 4 again.'
    });
    var box = api.box;
    function draw() {
      ER.$$('.bolts button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-b') === bolt); });
      ER.$$('.finds button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-f') === find); });
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      if (b.getAttribute('data-b')) { bolt = b.getAttribute('data-b'); ER.flag('b3-bolt', bolt); }
      else if (b.getAttribute('data-f')) { find = b.getAttribute('data-f'); ER.flag('b3-find', find); }
      else return;
      OP.sfx.keys(); draw();
    });
    function file(a) {
      if (!bolt || !find) { ER.sfx.no(); a.msg('Both, please: the bolt, and what EV One found.'); return; }
      var f = ER.exit([bolt + '|' + find], { wait: true });
      if (f) {
        nextFile = f; ER.flag('b3-file', f);
        a.msg('Flight reads it and taps the screen with her marker. &ldquo;So the box was never broken. The dish turned too far and pulled its own plugs out. Three days of meetings about a box that was fine.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            'Flight goes to the whiteboard, crosses out &ldquo;new box before sunset&rdquo;, and writes underneath, in red: PLUGS BACK IN. IN THE DARK.',
            '&ldquo;Four plugs, four sockets,&rdquo; she says. &ldquo;Page 3-21 has the bracket. EV One will have helmet lights and you will have the page. Between you, that is everything.&rdquo;',
            'On the big screen, the white dot that is Vesper slides towards the edge of the night.'
          ], function () { busy = false; paint(); });
        }, 3000);
        return;
      }
      ER.sfx.no();
      if (!ER.check('bolt', bolt)) a.msg('&ldquo;' + bolt + '?&rdquo; says Flight. &ldquo;Find that bolt on the drawing, and then ask EV One what is in that place on the real panel. Which way up is EV One?&rdquo;');
      else a.msg('&ldquo;The bolt is right,&rdquo; says Flight. &ldquo;Now, is that really what EV One found? Ask again, slowly: what exactly is behind the panel?&rdquo;');
    }
    draw();
  });

  /* ---------- Flight ---------- */
  $('#thandi').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Thandi Wolde', role: 'Flight Director · at the whiteboard', face: OP.FACE.thandi,
      lines: [
        { note: 'Flight is drawing a circle on the board, with one side coloured in.', a: '&ldquo;One orbit: ninety-two minutes. About fifty-six of them in sunlight and thirty-six in the Earth&rsquo;s shadow. At 14:42 EV One goes into the shadow, and up there it goes dark like a light switch.&rdquo;' },
        { q: 'Is the dark dangerous?', a: '&ldquo;No. It is dark, that is all. Metal in the sun up there gets hotter than boiling water, and in the shadow colder than anywhere on Earth, but the suit keeps EV One comfortable either way. There are helmet lights. We have done whole walks in the dark.&rdquo;' },
        { q: 'Why does the Yarnside pass matter?', a: '&ldquo;Yarnside is our big ground dish. The station passes over it from 15:20 to 15:28, and that is when we test the repair. Miss it, and the next pass is low and short, and after that there is nothing until three in the morning. Nobody is in danger. But I would like to go home tonight.&rdquo;' },
        { q: 'What is a torque stripe?', a: '&ldquo;Paint. When a bolt has been done up properly, somebody paints a line across it and on to the panel. If the bolt ever turns, the line breaks. It is a very cheap way of asking a bolt whether it has moved.&rdquo;' }
      ],
      clue: { id: 'thandi3', title: 'Flight, at the whiteboard', kind: 'What she said' }
    });
  });
  OP.thing('#clock', null, '14:12 GMT. Up there, the sun sets at 14:42: thirty minutes from now.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
