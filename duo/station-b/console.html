    --tc-bg:rgba(8,16,26,.95);--tc-ink:#eaf2f8;--cap-bg:rgba(8,18,30,.93);--panel:#101a26;--face-bg:#162231;--q-ink:#9fdcff;--fade:#03070c;--hud-bg:rgba(8,18,30,.84)}
  .scan{animation:scan 4s steps(4,end) infinite}
  @keyframes scan{0%{opacity:.85}50%{opacity:1}100%{opacity:.85}}
  #dot{animation:dot 1.6s steps(2,end) infinite}
  @keyframes dot{50%{opacity:.3}}
  .eg{padding:16px 20px 4px;font-family:'Space Mono',monospace}
  .eg h5{margin:0 0 2px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.16em;color:#9fdcff}
  .eg .sub{margin:0 0 10px;font-family:'EB Garamond',serif;font-size:17px;color:#c9d8e4}
  .suitline{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:14px}
  .suitline button{padding:6px 14px;border:1px solid #4a6a88;color:#c9d8e4;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.12em}
  .suitline button.on[data-g=go]{background:#1f8a4a;border-color:#3fd07a;color:#fff}
  .suitline button.on[data-g=nogo]{background:#a3271c;border-color:#ff6a5a;color:#fff}
  .cards{list-style:none;margin:0;padding:0;counter-reset:c}
  .cards li{counter-increment:c;display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:7px 10px;background:#17263a;border:1px solid #2f4a66;font-size:14px;line-height:1.35}
  .cards li:before{content:counter(c);flex:0 0 26px;height:26px;display:grid;place-items:center;background:#2f8fd8;color:#fff;font-weight:700;border-radius:50%}
  .cards li span{flex:1}
  .cards li b{color:#ffd27a;font-weight:700}
  .cards button{width:30px;height:28px;border:1px solid #4a6a88;color:#9fdcff;font-size:13px}
  .cards button:hover{background:#2f4a66}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null;

  ER.init({
    theme: 'duo', story: 'station-b', storyTitle: 'Read It Back', id: 'console', no: 'I', title: 'The Console',
    go: 'Put on the headset',
    intro: [
      '<b class="two">This is a story for two. Your partner plays THE ASTRONAUT (part A) on another screen. Do not show each other your screens: talk. Your partner can see the station; you have the manuals and the checklists. Everything one of you can see, the other one needs.</b>',
      'Vesper Station, four hundred kilometres above the Earth, going round it once every ninety-two minutes. For three days its big dish antenna has been stuck, pointing at nothing. The station is full of pictures and measurements that cannot get home.',
      'Today an astronaut is going outside to fix it: EV One, on a first spacewalk. You are the one who talks to EV One. It is your first day at this console, in the Ops Room of Vesper Flight Control, beside the Flight Director, with every checklist in the building on your desk.',
      'Up there, in the airlock, is somebody you have never met, who can see everything you cannot. You can read everything they cannot. You are about to trust each other with everything.'
    ],
    exit: {"next":"shelf","w":{"e0d88f8d":"f775619e"}}, tags: {"suit":["1151a9bd"],"p1":["bf8b2307"],"p2":["4c1ecf13"],"p3":["9d54e93f"],"p4":["cd6bf1c9"],"p5":["c3ca5e1b"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b1-told') || {}; nextFile = ER.flag('b1-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b1-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.egress ? 1 : 0) + (told.hatch ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) OP.card([['Tell your partner', ['&ldquo;EV One, Control. You are GO for egress. Step one &hellip;&rdquo;', '&ldquo;The depress valve is the &hellip; at the &hellip; of the panel.&rdquo;']], ['Ask your partner', ['&ldquo;Read that back to me, please.&rdquo;']]]);
    else OP.card([['Ask your partner', ['&ldquo;EV One, Control. How do you hear me? Please read me your three suit numbers, digit by digit.&rdquo;', '&ldquo;What is written on the hatch? Read me every word.&rdquo;']], ['Tell your partner', ['&ldquo;The knobs have names on my drawing. The depress valve is the &hellip;&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', [
      'Flight has said GO. Now talk EV One through the steps one at a time, in your new order, and ask for a read-back each time. Describe each knob and ring from the drawing: EV One cannot see their names.',
      'When EV One says they are outside, follow them: the button at the bottom of the screen.'
    ]];
    if (!told.egress || !told.hatch) return ['read', [
      'Two papers on your desk matter now: the egress checklist on the clipboard (bottom left) and the airlock manual, open at the hatch panel (in the middle). Read both before you send anything to Flight.',
      'The checklist says what EV One must do, and in what order. The drawing says which knob and which ring is which. The real panel has no labels, so EV One needs you to describe them: shape, colour, where.'
    ]];
    return ['send', [
      'Flight wants two things on the middle screen: is the suit GO or NO GO, and the five steps in the right order. Ask EV One for the three suit numbers and check them against the limits at the bottom of the checklist. &ldquo;At least 50&rdquo; means 50 or more.',
      'One step on Rev F is in the wrong place. Ask EV One to read you everything that is written on the hatch itself. One sentence there decides where one of the steps has to go.',
      'The hatch opens inwards, and the air in the airlock presses it shut. Which step makes the gauge read zero? That step must come before the step that needs a zero.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('Flight has said GO. Talk EV One through it, one step at a time.'); return; }
    if (told.intro) { busy = false; ER.say('The console. The checklist, the manual, the radio, and Flight beside you.'); return; }
    ER.narrate([
      'The Ops Room of Vesper Flight Control is long, dark and quiet, the way a library would be if all its books were screens. At the front, on the big screen, a white dot is crawling across a map of the world. That dot is Vesper Station.',
      'You have the console next to the Flight Director, Thandi Wolde, who has a pencil behind one ear and a mug of tea in her hand, and who has been in this room for twenty-two years.',
      'Your screen for the suit says NO DATA. With the big dish broken, the only way to reach the station is the little backup radio: voice only. You will know what is happening up there when EV One tells you, and only then.',
      'You put on the headset. In the airlock, four hundred kilometres up, somebody you have never met is waiting to hear you.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- papers ---------- */
  $('#clip').addEventListener('click', function () { if (!busy) OP.egress(function () { if (tell('egress')) paint(); }); });
  $('#man').addEventListener('click', function () { if (!busy) OP.hatch(function () { if (tell('hatch')) paint(); }); });
  $('#rules').addEventListener('click', function () { if (!busy) OP.rules(); });

  /* ---------- Flight ---------- */
  $('#thandi').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Thandi Wolde', role: 'Flight Director · twenty-two years in this room', face: OP.FACE.thandi,
      lines: [
        { note: 'She takes the pencil from behind her ear and points it at you, kindly.', a: '&ldquo;Welcome to the Ops Room. You talk to the crew; I decide. If you are not sure of something, ask. If you are sure, ask anyway, and make them read it back.&rdquo;' },
        { q: 'Why can&rsquo;t I see the suit numbers?', a: '&ldquo;Because the big dish is broken, which is the whole reason we are here. No dish, no data. Today we have voice only, on the backup radio. So EV One reads the numbers to you, and you check them against the limits. Just like the old days.&rdquo;' },
        { q: 'What do I do first?', a: '&ldquo;The egress checklist, Rev F. Put the steps on the middle screen in the right order and send them to me, with GO or NO GO for the suit, before I say GO. And read it properly. Checklists are written by people, and people put things in the wrong order.&rdquo;' },
        { q: 'Who went out to the mast last time?', a: '&ldquo;Marit Solberg, two and a half years ago, with Nils Overgaard. The best spacewalker we ever had. She retired in the summer. She grows potatoes somewhere cold, and she does not answer her phone in the daytime.&rdquo;' },
        { q: 'Is there any coffee?', a: '&ldquo;The coffee machine in the back room has been out of order since 2019. I drink tea. It is quicker than arguing with a machine.&rdquo;' }
      ],
      clue: { id: 'thandi1', title: 'Flight, before the walk', kind: 'What she said' }
    });
  });

  /* ---------- the middle screen: the lock ---------- */
  var CARDS = {
    s: '<b>SUIT CHECK.</b> EV One reads the three suit numbers. Control says GO.',
    h: '<b>HATCH.</b> EV One turns the handle and opens the outer hatch.',
    d: '<b>DEPRESS.</b> EV One opens the depress valve until the gauge reads zero.',
    t: '<b>SAFETY TETHER.</b> EV One hooks the safety tether to the tether ring.',
    w: '<b>GO OUT.</b> EV One unclips the waist tether and goes out.'
  };
  var order = ER.flag('b1-order') || ['s', 'h', 'd', 't', 'w'], suit = ER.flag('b1-suit') || '';
  function openSend() {
    if (busy) return;
    if (nextFile) { ER.say('Flight has the list, and has said GO.'); return; }
    var api = OP.work({
      cls: 'send',
      html: '<div class="eg"><h5>EGRESS · REV F · SEND TO FLIGHT</h5><p class="sub">Set the suit check, and put the five steps in the order EV One must do them. Flight will not say GO until both are right.</p>' +
        '<div class="suitline">SUIT CHECK: <button type="button" data-g="go">GO</button><button type="button" data-g="nogo">NO GO</button></div><ol class="cards" id="cards"></ol></div>',
      btn: [{ id: 'send', label: 'Send to Flight', fn: send }],
      msg: 'The steps are in the order of the printed checklist, Rev F. Use the arrows to move a step up or down.'
    });
    var box = api.box;
    function draw() {
      ER.$$('.suitline button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-g') === suit); });
      box.querySelector('#cards').innerHTML = order.map(function (k, i) {
        return '<li data-k="' + k + '"><span>' + CARDS[k] + '</span><button type="button" class="up" data-i="' + i + '" title="up">&#9650;</button><button type="button" class="dn" data-i="' + i + '" title="down">&#9660;</button></li>';
      }).join('');
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      if (b.getAttribute('data-g')) { suit = b.getAttribute('data-g'); ER.flag('b1-suit', suit); ER.sfx.click(); draw(); return; }
      var i = +b.getAttribute('data-i'), j = b.classList.contains('up') ? i - 1 : b.classList.contains('dn') ? i + 1 : -1;
      if (isNaN(i) || j < 0 || j >= order.length) return;
      var t = order[i]; order[i] = order[j]; order[j] = t; ER.flag('b1-order', order); OP.sfx.keys(); draw();
    });
    function send(a) {
      if (!suit) { ER.sfx.no(); a.msg('&ldquo;Is the suit GO or NO GO?&rdquo; says Flight. &ldquo;You have not told me.&rdquo;'); return; }
      var file = ER.exit([suit + '|' + order.join('-')], { wait: true });
      if (file) {
        nextFile = file; ER.flag('b1-file', file);
        a.msg('Flight reads your list from top to bottom, twice, with her pencil. Then she nods.');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            'Flight presses her own button. &ldquo;All stations, this is Flight. We are GO for egress.&rdquo; Round the room, people sit up a little.',
            '&ldquo;You fixed Rev F,&rdquo; she says to you, quietly. &ldquo;It came back from the printers last week, and three people read it before you. Somebody will now have to print it again. Probably me.&rdquo;',
            'On the backup radio, a long hiss of static, and then EV One again. Four hundred kilometres up, an airlock is emptying. Talk EV One through it, one step at a time.'
          ], function () { busy = false; paint(); });
        }, 2400);
        return;
      }
      ER.sfx.no();
      if (!ER.check('suit', suit)) { a.msg('&ldquo;NO GO?&rdquo; Flight looks at the limits, and then at you. &ldquo;Which number is outside its limit? Ask EV One again, digit by digit. Fifteen and fifty sound very alike in a helmet. And &lsquo;at least&rsquo; means what it says.&rdquo;'); return; }
      for (var i = 0; i < order.length; i++) if (!ER.check('p' + (i + 1), order[i])) break;
      a.msg('Flight runs her pencil down the list and stops at step ' + (i + 1) + '. &ldquo;Can EV One really do this step here, before the ones under it? Ask EV One what is written on the hatch, on the gauge, on everything. Things up there have opinions.&rdquo;');
    }
    draw();
  }
  $('#egmon').addEventListener('click', openSend);

  /* ---------- other things ---------- */
  OP.thing('#big', 'ground track', 'The big screen: a map of the world, with the path of the station drawn across it like a wave. The white dot is Vesper. It goes round the whole world every ninety-two minutes, so the wave never ends. The red dot is the big ground dish at Yarnside.', isBusy);
  OP.thing('#suitmon', null, 'NO DATA. The suit sends its numbers down through the big dish, and the big dish is the thing that is broken. Today you have only the backup radio, and EV One&rsquo;s voice.', isBusy);
  OP.thing('#clockmon', 'GMT', 'The Ops Room clock: 13:50 GMT. Space stations keep Greenwich time, so that everybody on the ground, everywhere, means the same thing by &ldquo;ten to two&rdquo;.', isBusy);
  OP.thing('#mug', null, 'Flight&rsquo;s mug. It says, in faded letters, WORLD&rsquo;S OKAYEST FLIGHT DIRECTOR. It is full of tea.', isBusy);
  OP.thing('#headset', 'headset', 'Your headset. Press the button to talk to EV One; let go to listen. Your partner is the voice in it.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
