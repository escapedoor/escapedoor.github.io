<!doctype html>

<head>

<title>The Back Room · Read It Back</title>

<style>
  body{--bg:#3c4638;--accent:#b8f08a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(16,22,14,.95);--tc-ink:#eef4e6;--cap-bg:rgba(18,24,16,.93);--panel:#141c12;--face-bg:#162231;--q-ink:#d2f5b0;--fade:#050704;--hud-bg:rgba(18,24,16,.84)}
  .tube{animation:tube 6s steps(1,end) infinite}
  @keyframes tube{0%,90%{opacity:1}91%{opacity:.4}92%{opacity:1}95%{opacity:.6}96%{opacity:1}}
  .crt{animation:crt 3s steps(3,end) infinite}
  @keyframes crt{50%{opacity:.82}}
  .term{padding:18px 22px 6px;background:#071208;color:#8ff0a8;font-family:'Space Mono',monospace}
  .term h5{margin:0 0 6px;font-size:16px;letter-spacing:.14em;font-weight:700}
  .term p{margin:0 0 12px;font-size:14px;line-height:1.5;color:#b8f5c4}
  .dials{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .dial{display:flex;flex-direction:column;align-items:center;gap:4px}
  .dial small{font-size:12px;letter-spacing:.16em;color:#6ad08a}
  .dial b{display:block;min-width:84px;text-align:center;font-size:30px;line-height:40px;background:#0c1f10;border:1px solid #2a6a3a;color:#c8ffd4}
  .dial button{width:84px;height:26px;border:1px solid #2a6a3a;color:#8ff0a8;font-size:12px}
  .dial button:hover{background:#12301a}
  .chg{padding:16px 20px 4px;background:#f4ecc8;color:#2a2410;font-family:'Space Mono',monospace}
  .chg h5{margin:0 0 4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.16em;color:#8a5a08}
  .chg p{margin:6px 0 8px;font-family:'EB Garamond',serif;font-size:18px}
  .chg button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 12px;border:1px solid #a89a60;color:#2a2410;font-family:'EB Garamond',serif;font-size:18px}
  .chg button.on{background:#2a2410;color:#f4ecc8}
  .bx.chgbox .bx-foot{background:#f4ecc8;color:#2a2410}
  .bx.chgbox .pmsg b{color:#8a5a08}
  .bx.chgbox .btn{--accent:#8a5a08;color:#8a5a08;border-color:#8a5a08}
</style>
</head>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="ops.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null;
  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  ER.init({
    theme: 'duo', story: 'station-b', storyTitle: 'Read It Back', id: 'backroom', no: 'IV', title: 'The Back Room',
    go: 'Go into the back room',
    intro: [
      'You filed the report: B1 had the broken stripe. EV One saw it as the plain bolt at the bottom right, and EV One is upside down compared with the drawing, so EV One&rsquo;s bottom right is the drawing&rsquo;s top left: B1. The bolts that came out were B1, B2, B4 and B5, and the hinge bolts B3 and B6 stayed in. Behind the panel the box was fine, and the cable bracket was torn off its posts.',
      'It is eighteen minutes to three, GMT. Up there, the sun has just gone down.'
    ],
    exit: {"next":"screen","w":{"8eb77d5e":"4bc92a0f"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b4-told') || {}; nextFile = ER.flag('b4-file') || null;
  var seen = ER.flag('b4-seen') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b4-told', told); return true; }
  function isBusy() { return busy; }
  function anyReport() { return Object.keys(seen).length > 0; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.bracket ? 1 : 0) + (anyReport() ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) OP.card([['Tell your partner', ['&ldquo;Turn the rings and test. Tell me how many lights come on.&rdquo;']], ['Ask your partner', ['&ldquo;Read back all four plugs, please.&rdquo;']]]);
    else if (anyReport()) OP.card([['Tell your partner', ['&ldquo;The black cable with the white stripe goes into J3. On your side, J3 is at your &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;Read back all four, please: which plug, which socket?&rdquo;']]]);
    else OP.card([['Ask your partner', ['&ldquo;EV One, Control. Describe every cable, please: thick or thin, colour, stripes.&rdquo;', '&ldquo;Is anything written on any of them? Read it to me exactly.&rdquo;']], ['Tell your partner', ['&ldquo;My page says J3 is the grey cable with a notch. Can you see it?&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The change is filed. Tell EV One where each plug goes, remembering that EV One is upside down, and ask for a read-back. When EV One has four green lights, go back to the big screen for the pass.']];
    if (!told.bracket) return ['page', [
      'Page 3-21 of the manual, open on the table, shows the cable bracket: which cable goes in which socket. Read it, and ask EV One to describe all five cables. Something will not match.',
      'EV One is still upside down, as at the panel: your drawing&rsquo;s top left is EV One&rsquo;s bottom right.'
    ]];
    if (!anyReport()) return ['find', [
      'EV One can see a tag on one of the cables, with initials and a date on it. Ask EV One to read it to you exactly: the letters spelt out, the numbers digit by digit.',
      'The records terminal finds walk reports by the date of the walk. The date on the tag is written the British way: day, then month, then year.',
      'One four, three, two four: the fourteenth day of the third month of 2024. If you heard &ldquo;four&rdquo; instead of &ldquo;one four&rdquo;, you will find a different walk.'
    ]];
    return ['change', [
      'Flight wants page 3-21 corrected before anything else goes on: the yellow change note on the table. Which cable does the report say goes into J3 now?',
      'Then tell EV One where each plug goes. J1, top left on your drawing, is EV One&rsquo;s bottom right. Work out the other three the same way, and ask for a read-back.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('Page 3-21 is corrected, in pen. Up there, EV One has the plugs.'); return; }
    if (told.intro) { busy = false; ER.say('The back room: the terminal, the manual at page 3-21, the change note, the coffee machine.'); return; }
    ER.narrate([
      'Behind the Ops Room is the back room: a sink, a kettle, grey boxes of old walk reports, a records terminal, and the coffee machine, which wears a sign saying OUT OF ORDER and has worn it since 2019.',
      '&ldquo;Page 3-21,&rdquo; says Flight, and puts the manual down on the table. &ldquo;The bracket. Four plugs. It should be the easy part.&rdquo; She does not sound as if she believes it.',
      'Up there it is dark. EV One has two helmet lights, five cables, four sockets, and you.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  $('#man').addEventListener('click', function () { if (!busy) OP.bracket(function () { if (tell('bracket')) paint(); }); });

  /* ---------- the records terminal: reports found by date ---------- */
  var d = ER.flag('b4-date') || { day: 1, mon: 0, year: 2026 };
  $('#terminal').addEventListener('click', function () {
    if (busy) return;
    var api = OP.work({
      cls: 'termbox',
      html: '<div class="term"><h5>RECORDS · VESPER WALK REPORTS</h5><p>Search by the date of the walk. Set the day, the month and the year, then press SEARCH.</p><div class="dials">' +
        '<div class="dial"><small>DAY</small><button type="button" data-k="day" data-d="1">&#9650;</button><b id="dd"></b><button type="button" data-k="day" data-d="-1">&#9660;</button></div>' +
        '<div class="dial"><small>MONTH</small><button type="button" data-k="mon" data-d="1">&#9650;</button><b id="dm"></b><button type="button" data-k="mon" data-d="-1">&#9660;</button></div>' +
        '<div class="dial"><small>YEAR</small><button type="button" data-k="year" data-d="1">&#9650;</button><b id="dy"></b><button type="button" data-k="year" data-d="-1">&#9660;</button></div></div></div>',
      btn: [{ id: 'search', label: 'Search', fn: search }],
      msg: 'The terminal hums. It was new in 2016.'
    });
    var box = api.box;
    function show() { box.querySelector('#dd').textContent = d.day; box.querySelector('#dm').textContent = MON[d.mon]; box.querySelector('#dy').textContent = d.year; }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-k]') : null; if (!b) return;
      var k = b.getAttribute('data-k'), s = +b.getAttribute('data-d');
      if (k === 'day') d.day = ((d.day - 1 + s + 31) % 31) + 1;
      if (k === 'mon') d.mon = (d.mon + s + 12) % 12;
      if (k === 'year') d.year = Math.min(2026, Math.max(2016, d.year + s));
      ER.flag('b4-date', d); OP.sfx.keys(); show();
    });
    function search(a) {
      var key = d.year + '-' + ('0' + (d.mon + 1)).slice(-2) + '-' + ('0' + d.day).slice(-2), rep = OP.REPORTS[key];
      OP.sfx.keys();
      if (!rep) { ER.sfx.no(); a.msg('NO WALK ON ' + d.day + ' ' + MON[d.mon] + ' ' + d.year + '. The terminal beeps, sadly, as if it were its fault.'); return; }
      seen[key] = 1; ER.flag('b4-seen', seen); paint();
      ER.read({ html: rep, cls: 'rep', clue: { id: 'rep' + key, title: 'Walk report, ' + d.day + ' ' + MON[d.mon] + ' ' + d.year, kind: 'From the records' } });
    }
    show();
  });

  /* ---------- the change note: the lock ---------- */
  var OPTS = [['grey', 'the grey cable, with a notch in its plug'], ['black', 'the black cable, with one white stripe'], ['white', 'the thin white cable'], ['blue', 'the thin cable with two blue stripes']];
  var pick = ER.flag('b4-pick') || '';
  $('#change').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The change note is filed, and page 3-21 is corrected in pen.'); return; }
    if (!anyReport()) { ER.say('A blank manual change note. To change a page, you need to know what has changed, and where it says so. The tag on the cable is the place to start.', 6000); return; }
    var api = OP.work({
      cls: 'chgbox',
      html: '<div class="chg"><h5>MANUAL CHANGE NOTE · MAST M3-B · PAGE 3-21</h5><p>Socket J3 (MOTOR) now takes:</p>' + OPTS.map(function (o) { return '<button type="button" data-o="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>',
      btn: [{ id: 'filechg', label: 'File the change', fn: fileIt }],
      msg: 'Flight is waiting with a pen, to write it on the page itself.'
    });
    var box = api.box;
    function draw() { ER.$$('.chg button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-o') === pick); }); }
    box.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-o]') : null; if (!b) return; pick = b.getAttribute('data-o'); ER.flag('b4-pick', pick); OP.sfx.pen(); draw(); });
    function fileIt(a) {
      if (!pick) { ER.sfx.no(); a.msg('Choose one first.'); return; }
      var f = ER.exit([pick], { wait: true });
      if (f) {
        nextFile = f; ER.flag('b4-file', f);
        a.msg('Flight writes on page 3-21 in blue pen: J3 · BLACK cable, one white stripe (since 14 March 2024). Then she signs it, and dates it, and underlines it twice.');
        setTimeout(function () {
          ER.closeAll(); busy = true; paint();
          ER.narrate([
            '&ldquo;There,&rdquo; says Flight. &ldquo;Changed. Two and a half years late, in biro. Marit will be very pleased with me, when she gets out of her field.&rdquo;',
            '&ldquo;Now tell EV One where all four go. Remember which way up EV One is. And ask for the read-back: I want to hear every plug before anybody turns a ring.&rdquo;'
          ], function () { busy = false; paint(); });
        }, 2600);
        return;
      }
      ER.sfx.no();
      a.msg(pick === 'grey' ? '&ldquo;The grey one?&rdquo; says Flight. &ldquo;That is what the page says already. Is it what EV One can see? What does the newest report say?&rdquo;'
        : pick === 'white' ? '&ldquo;The thin white cable is the heater, and page 3-21 already says where the heater goes,&rdquo; says Flight. &ldquo;Read the report again.&rdquo;'
        : '&ldquo;Two blue stripes is the data cable,&rdquo; says Flight. &ldquo;Nobody has changed that one. Read the report again.&rdquo;');
    }
    draw();
  });

  /* ---------- Flight ---------- */
  $('#thandi').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Thandi Wolde', role: 'Flight Director · in the back room', face: OP.FACE.thandi,
      lines: [
        { note: 'Flight fills the kettle, because the coffee machine is not an option.', a: '&ldquo;We keep every walk report since the station was built. If anything up there has changed since the manual was printed, it is in one of those.&rdquo;' },
        { q: 'Why can I only search by date?', a: '&ldquo;Because that is how the records system was built, in 2016, by somebody who has since left. You give it the date of a walk, and it gives you the report. Nothing else works. I have tried shouting.&rdquo;' },
        { q: 'Can we ask Marit Solberg?', a: '&ldquo;I rang her. She is in a potato field with no signal. Of course she is.&rdquo;' },
        { q: 'What if a plug goes into the wrong socket?', a: '&ldquo;Nothing breaks: everything up there is made so that it cannot be hurt that way. The dish just will not wake up. But we have one good pass over Yarnside, and I would like it to wake up for that.&rdquo;' }
      ],
      clue: { id: 'thandi4', title: 'Flight, in the back room', kind: 'What she said' }
    });
  });
  OP.thing('#coffee', null, 'The Mudlark 4000. OUT OF ORDER since 2019. Do not kick. Somebody has kicked it, at least twice, at about the height of Flight&rsquo;s shoe.', isBusy);
  OP.thing('#boxes', null, 'Grey boxes of paper walk reports. The terminal is quicker, Flight says, as long as you know the date.', isBusy);
  OP.thing('#kettle', null, 'The kettle. It works, which in this room makes it the most important machine in the building.', isBusy);
  OP.thing('#window', null, 'Through the window, the big screen: the white dot of Vesper is in the night half of the map now.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
