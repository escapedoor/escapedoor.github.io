<title>The Watch Room · Show a Light</title>

<style>
  body{--bg:#1a120a;--accent:#ffcf6a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(24,16,8,.95);--tc-ink:#f8eedb;--cap-bg:rgba(28,19,10,.93);--panel:#241a10;--face-bg:#3a2c1c;--q-ink:#ffd98f;--fade:#0a0704;--hud-bg:rgba(28,19,10,.84)}
  .flame{animation:fl 1.7s steps(3,end) infinite alternate;transform-origin:250px 512px}
  @keyframes fl{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
  .rain{animation:rain .6s linear infinite}
  @keyframes rain{from{transform:translate(0,-50px)}to{transform:translate(-14px,50px)}}
  #flick{opacity:0;transition:opacity .08s}
  #flick.lit{opacity:1}
  #tube.shrill .whis{animation:shr .9s ease-out}
  @keyframes shr{0%,100%{transform:translateY(0)}20%,60%{transform:translateY(-14px)}40%,80%{transform:translateY(-8px)}}
  #cat .tail{animation:tail 5s ease-in-out infinite alternate;transform-origin:1238px 640px}
  @keyframes tail{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
  .slog{width:min(860px,95vw)}
  .slog-in{padding:18px 24px 8px;background:#f7f1de repeating-linear-gradient(#f7f1de 0 33px,#d8cdb0 33px 34px);color:#2a2214;font-family:'Special Elite',monospace;font-size:16px;line-height:34px}
  .slog-in h5{margin:0;font-family:'Cinzel',serif;font-weight:700;font-size:19px;letter-spacing:.06em;color:#2f4a3a;line-height:34px}
  .slog-in p{margin:0}
  .slog-in .hand{font-family:'Kalam',cursive;font-size:19px;color:#2a3a8a}
  .slog-in .ctr{margin:0 3px}
</style>

</div>
<button type="button" class="gobtn" id="go">The lamp is answered</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="watch.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, logBox = null;

  ER.init({
    theme: 'duo', story: 'lighthouse-b', storyTitle: 'Show a Light', id: 'watch', no: 'I', title: 'The Watch Room',
    go: 'Sit down at the desk',
    intro: [
      '<b class="two">This is a story for two. Your partner plays THE LAMP KEEPER (part A) on another screen. Do not show each other your screens: talk. Everything one of you can see, the other one needs. You can also link your two screens with the tag in the bottom left corner: then what one of you does can show on the other screen. The clues will not go across. You still have to say them.</b>',
      'Siller Ness lighthouse, Saturday 17 October, a little after nine at night. The last open day of the year ended at four. Then the wind went round to the south-west, and the storm came early.',
      'You are a volunteer with the Friends of Siller Ness Light. You look after the papers: the old log books, the code book, the List of Lights, the charts, the Instructions to Keepers. You have read every one of them. At four minutes past nine the power went off all over the island, and the electric light up on the gallery went out with it.',
      'Your partner, the other volunteer who stayed to lock up, is at the top of the tower in the lantern, 132 steps above you, where they can see the sea. Between you there is a brass speaking tube. You met this morning.'
    ],
    exit: {"next":"book","w":{"919ebb07":"8f8598c4"}}, tags: {"call":["fdc3b91d"],"sig":["06901a4c"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b1-told') || {}; nextFile = ER.flag('b1-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b1-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.code ? 1 : 0) + (nextFile ? 1 : 0), 2);
    if (nextFile) WR.card([['Tell your partner', ['&ldquo;The ship is saying: &hellip; I&rsquo;m going to call the coastguard.&rdquo;']]]);
    else if (told.code) WR.card([['Tell your partner', ['&ldquo;That&rsquo;s the general call. It means &hellip; Answer it with &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;Is it still calling? What is it sending now? Read it to me, flash by flash.&rdquo;']]]);
    else WR.card([['Ask your partner', ['&ldquo;Lantern, this is the watch room. What can you see? Is the light flashing short or long?&rdquo;']], ['Tell your partner', ['&ldquo;Wait. I&rsquo;m opening the code book.&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The signal log is written. Tell your partner what the ship means, if you have not.']];
    if (!told.code) return ['code', [
      'The code book is the blue book on the desk, on the right. Open it: you will need it, and so will your partner.',
      'Your partner can see the sea, and you cannot. Ask what the light out there is doing: short flashes, long flashes, and where the gaps are.'
    ]];
    return ['log', [
      'Match what your partner reads you, group by group, with the Morse code in section 1 of the code book. A short flash is a dot (&bull;), a long one a dash (&mdash;).',
      'Section 2 says what a call looks like, and what the answer to a call is. Your partner has the signal lamp, and you do not: tell them what to send, and how.',
      'When the ship has seen the answer it will send something new. Ask for it, find it in section 1, and look it up in section 3. Then write the call and the new signal in the signal log, open on the desk.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The signal log is written. Now for the coastguard.'); return; }
    if (told.intro) { busy = false; ER.say('The watch room. The paraffin lamp, the log, and the code book on the desk.'); return; }
    ER.narrate([
      'The watch room is round, because the tower is round: thick white walls, a desk under the window, a shelf of old books, and the iron stair that winds up into the dark, 132 steps to the lantern. You have never been to the top. You do not like heights, and nobody has ever asked you to.',
      'When the power went, you lit the paraffin lamp on the desk, the way the keepers used to. The telephone still works. The radio runs on its own battery. The cat, Prism, has not moved at all.',
      'The brass speaking tube on the wall goes all the way up to the lantern. Up there, your partner can see the sea. Down here, you have everything else.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- papers ---------- */
  $('#codebook').addEventListener('click', function () { if (!busy) WR.code(function () { if (tell('code')) { paint(); ER.say('Morse code, signals by lamp, signals of one letter, and Mr Sween&rsquo;s pencil in the margins.'); } }); });
  $('#shelf').addEventListener('click', function () { if (!busy) WR.list(); });

  /* ---------- the signal log ---------- */
  function makeLog() {
    var box = ER.el('div', 'bx slog'), L = ['?'].concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
    var c1 = WR.counter(L, '?', { id: 'c-1' }), c2 = WR.counter(L, '?', { id: 'c-2' }), c3 = WR.counter(L, '?', { id: 'c-3' });
    box.innerHTML = '<div class="slog-in"><h5>Signal log · Siller Ness · Saturday 17 October 2026</h5>' +
      '<p class="hand">21.04 &nbsp;Power off. Electric light out (battery flat).</p>' +
      '<p class="hand">21.12 &nbsp;A lamp seen at sea to the south-west, from the lantern.</p>' +
      '<p>The vessel calls: <span id="s-1"></span><span id="s-2"></span> &nbsp;again and again.</p>' +
      '<p>Answered from the lantern. Then the vessel sends: <span id="s-3"></span></p></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="write">Write it in the log</button></div>';
    box.querySelector('#s-1').appendChild(c1.el); box.querySelector('#s-2').appendChild(c2.el); box.querySelector('#s-3').appendChild(c3.el);
    var msg = function (t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); };
    box.querySelector('#write').addEventListener('click', function () {
      var call = (c1.value() + c2.value()).toLowerCase(), sig = c3.value().toLowerCase();
      var file = ER.exit([call + '-' + sig], { wait: true });
      if (!file) {
        ER.sfx.no();
        var s = [];
        if (!ER.check('call', call)) s.push('The call: is that exactly what your partner described? Ask them to read it again, group by group, and find each group in the code book.');
        if (sig === '?') s.push('And nothing yet after the answer? Then the line is not finished. Once the ship has been answered, it will send something.');
        else if (!ER.check('sig', sig)) s.push('The signal after the answer: check it flash by flash. One short flash more or less is a different letter.');
        msg(s.join(' '));
        return;
      }
      nextFile = file; ER.flag('b1-file', file);
      ER.addClue('log1', 'The signal log', '<h4>Signal log</h4><p>21.12 A lamp at sea. The vessel calls: ' + call.toUpperCase() + ', again and again.</p><p>Answered from the lantern. The vessel sends: ' + sig.toUpperCase() + '.</p>', 'pad', 'Your own writing', true);
      msg('You write it in, in capitals, the way the keepers did. Section 3 of the code book has the letter on its own line.');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'You read the line again. A ship that cannot steer properly, out there in the dark, in this. And no light on the shore to tell her where the shore is.',
          'You reach for the radio. Mallack Coastguard should hear about this, and the coastguard will know what ship she is.'
        ], function () { busy = false; paint(); });
      }, 2400);
    });
    msg('The signal log is open on the desk. Set the letters with the arrows. Only your partner can tell you what the ship&rsquo;s lamp is doing.');
    return { open: function () { ER.open('ov-lock', box); } };
  }
  $('#log').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The line is written. The next one will be about the coastguard.'); return; }
    if (!logBox) logBox = makeLog();
    logBox.open();
  });

  /* ---------- other things ---------- */
  WR.tube('#tube', isBusy);
  WR.flicker('#flick');
  WR.thing('#radio', 'radio', 'The radio, on channel 16, the calling channel, running on its own battery. Hiss, and far away a voice saying &ldquo;all stations&rdquo; about the power cut.', isBusy);
  WR.thing('#phone', null, 'The telephone. It does not need the power, so it still works. Nobody has rung.', isBusy);
  WR.thing('#clock', 'clock', 'Nearly a quarter past nine.', isBusy);
  WR.thing('#baro', 'barometer', 'The barometer. The needle is past STORMY, and still going down.', isBusy);
  WR.thing('#win', null, 'The window on the yard. Rain, the dark shapes of the keepers&rsquo; cottages, and low cloud racing over the top of the tower.', isBusy);
  WR.thing('#cat', null, 'Prism, the museum cat, asleep on the chair. She was named by a visitor who did not know what else to call a cat in a lighthouse.', isBusy);
  WR.thing('#plamp', 'paraffin lamp', 'The paraffin lamp. It smells of the nineteen-fifties.', isBusy);
  WR.thing('#stair', null, 'The iron stair, going up into the dark. A hundred and thirty-two steps. You have counted them from the bottom, and never once from the top.', isBusy);
  if (window.Link) Link.follow($('#go'), 'lantern');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
