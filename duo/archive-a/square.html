<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null;
  (function () {
    var s = '', x, y;
    for (y = 800; y < 900; y += 26) for (x = -1000 + (y % 52 ? 0 : 30); x < 2600; x += 60) s += '<path d="M' + x + ' ' + y + 'h52"/>';
    $('#cobbles').innerHTML = s; s = '';
    for (var i = 0; i < 90; i++) { x = Math.round(-200 + Math.random() * 2000); y = Math.round(-100 + Math.random() * 1000); s += '<path d="M' + x + ' ' + y + 'l-6 26"/>'; }
    $('#drizzle').innerHTML = s;
  })();

  ER.init({
    theme: 'duo', story: 'archive-a', storyTitle: 'Still Here', id: 'square', no: 'I', title: 'The Square',
    go: 'Stand in the square',
    intro: [
      '<b class="two">This is a story for two. Your partner plays THE ARCHIVIST (part B) on another screen. Do not show each other your screens: talk. You can link the two screens with the tag in the bottom left corner. Then some of the things your partner does will show on your screen, as they happen.</b>',
      'Chalkbourne, a small market town, on a wet Tuesday morning in November. Forty-seven years ago, on a Saturday night, a painting disappeared from a gallery on the town square, in four minutes of darkness. Nobody was ever charged. A young man was blamed anyway.',
      'You are an investigator for the Missing Pictures Register in London. The young man&rsquo;s daughter wrote to you. Today you are standing in the square where it happened, with your phone, a tape measure and a great many questions.',
      'Your partner is at the Record Office on the other side of town, with the old police files, if they can find the right one. You have never met. You will be on the phone all morning.'
    ],
    exit: {"next":"table","w":{"9ebcac47":"9b14fc70"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('a1-told') || {}; nextFile = ER.flag('a1-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a1-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.looked ? 1 : 0) + (told.corner ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) AR.card([['Tell your partner', ['&ldquo;I&rsquo;m inside. It&rsquo;s a café now: one long room. The owner is called Carys.&rdquo;']], ['Ask your partner', ['&ldquo;Did you find the file? What&rsquo;s in the box?&rdquo;']]]);
    else AR.card([['Tell your partner', ['&ldquo;I&rsquo;m in the square. On the north side there are three old buildings, side by side: number 7, number 9 and number 11.&rdquo;', '&ldquo;Number 7 is an estate agent&rsquo;s. It has &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;What does the gallery look like in your photo? What can you see upstairs, and at the very top?&rdquo;', '&ldquo;Which things in the photo could not have changed since 1979?&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['You are in the right building. Look round the café, and tell your partner what it is like now.']];
    return ['which', [
      'Your partner has a photograph of the gallery, from 1979. You have the square, today. Describe the three buildings to each other, one at a time, starting at the top: the roof, the windows upstairs, the stone.',
      'In forty-seven years a shop can change its name, move its door, and grow a tree in front of it. Stone, upstairs windows and the shape of a roof hardly ever change. Trust the things that cannot move.',
      'Your partner also needs the name the square had in 1979, and the number of the building. Look high up on the corner of the end building, on the far left. The numbers are on the doors.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('You are inside number 9. The bell over the door is still swinging.'); return; }
    if (told.intro) { busy = false; ER.say('The square, in the rain. Three old buildings on the north side, and one of them was a gallery.'); return; }
    ER.narrate([
      'The square is wet and nearly empty: a man with a dog, some pigeons, a bus that does not stop. On the north side stand three tall old buildings, side by side, with shops on the ground floor.',
      'One of them was Gorringe&rsquo;s Gallery in 1979. None of them says so now.',
      'Your phone buzzes. It is the archivist at the Record Office, who has had the same letter as you, and who would like to know where you are standing.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the three buildings ---------- */
  var B = {
    b7: { kick: 'On the left', title: 'Number 7: Lavender &amp; Co', pic: 7,
      text: '<p>An estate agent&rsquo;s, with photographs of houses in both windows. Downstairs there are two bay windows that stick out, and the door is in the middle, between them.</p><p>Upstairs: two windows. At the very top, in the point of the roof, a little round window.</p>',
      no: 'A young man in a tie looks up from his screen. &ldquo;A gallery? No. We&rsquo;ve been here since 1962. My grandfather started it.&rdquo; He gives you a card with a picture of a house on it, just in case.' },
    b9: { kick: 'In the middle', title: 'Number 9: The Long Table', pic: 9,
      text: '<p>A café. Downstairs there is one long window, with a long wooden table behind it, and the door is at the right-hand end. Under the window, fixed to the pavement, an old iron boot scraper.</p><p>Upstairs: three tall windows. Over the middle one, a woman&rsquo;s face carved in stone, with leaves in her hair. At the very top, in the point of the roof, a little round window, and under it a stone with a date: 1891.</p>' },
    b11: { kick: 'On the right', title: 'Number 11: the building society', pic: 11,
      text: '<p>A building society, which is a kind of bank. Downstairs there is a window on each side and the door in the middle. In front, a young tree in a wooden guard, just to the left of the door.</p><p>Upstairs: three tall windows, with a stone shield over the middle one. At the very top, in the point of the roof, a little square window.</p>',
      no: '&ldquo;The building society has been here since 1958,&rdquo; says the cashier, very politely. &ldquo;A gallery? Before my time, I&rsquo;m afraid. Most things are.&rdquo;' }
  };
  function bldg(id) {
    if (busy) return;
    if (nextFile) { ER.say('You have found it: number 9. The others can keep their secrets.'); return; }
    var b = B[id];
    tell('looked'); paint();
    ER.$$('.bldg').forEach(function (g) { g.classList.toggle('picked', g.getAttribute('data-b') === id); });
    AR.look({ kicker: b.kick, title: b.title, pic: SC.front(b.pic), text: b.text,
      acts: [{ id: 'goin', label: 'Go in and ask', fn: function (api) { goIn(id, api); } }] });
  }
  function goIn(id, api) {
    var file = ER.exit([id], { wait: true });
    if (!file) { ER.sfx.no(); api.msg(B[id].no + ' Check the photograph again with your partner: the things that could not have changed.'); return; }
    nextFile = file; ER.flag('a1-file', file);
    AR.sfx.bell(); AR.tell('i-in');
    api.msg('A bell rings over the door as you push it. Warm air, coffee, and somebody calling &ldquo;Sit anywhere!&rdquo;');
    api.acts([]);
    setTimeout(function () {
      ER.closeAll(); busy = true; paint();
      ER.narrate([
        'Inside, The Long Table is one long room, warm, and full of the smell of toast. A long oak table runs down the middle of it. The walls are covered with old things: a big mirror, pictures, a glass case.',
        'The owner comes out from behind the counter, wiping her hands. She is about forty-five, with short grey hair and paint on one sleeve. &ldquo;Carys,&rdquo; she says. &ldquo;Carys Elkin. You&rsquo;re the one from London. Bethan said you might come.&rdquo;',
        '&ldquo;This was Gorringe&rsquo;s Gallery,&rdquo; she says. &ldquo;Then a shoe shop for thirty-five years. Then me. The walls have moved about a bit since 1979. The pictures haven&rsquo;t.&rdquo;'
      ], function () { busy = false; paint(); });
    }, 2400);
  }
  ER.$$('.bldg').forEach(function (g) { g.addEventListener('click', function () { bldg(g.getAttribute('data-b')); }); });

  /* ---------- other things ---------- */
  $('#corner').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.wordAt(e.clientX, e.clientY, 'corner stone');
    if (tell('corner')) paint();
    ER.say('High up on the corner of the end building, two names for the square. Carved deep in the stone: CORN MARKET. Screwed on underneath it, newer and blue: MARKET SQUARE.');
  });
  $('#lime').addEventListener('click', function () {
    if (busy) return;
    AR.look({ kicker: 'In front of number 9', title: 'A lime tree', pic: SC.plate(), lock: false,
      text: '<p>A lime tree, taller than the buildings, with gold November leaves. Its branches hide one side of the café.</p><p>On a post at its foot there is a small brass plate: PLANTED ON 7 JUNE 1977 FOR THE SILVER JUBILEE OF QUEEN ELIZABETH II.</p>' });
    ER.addWord('lime tree', 'a tall tree with heart-shaped leaves, often planted in towns');
  });
  AR.thing('#young', 'tree guard', 'A young tree, about as tall as you, in a wooden guard. A label on the guard says: PLANTED BY CLASS 4, CHALKBOURNE PRIMARY SCHOOL, MARCH 2020.', isBusy);
  AR.thing('#bench', null, 'A wet bench. A small metal plate on it says: FOR DORIS, WHO SAT HERE EVERY DAY. Today, nobody does.', isBusy);
  AR.thing('#pigeons', null, 'Two pigeons, looking at you as if you owed them money.', isBusy);
  $('#scraper').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.wordAt(e.clientX, e.clientY, 'boot scraper');
    ER.say('An iron boot scraper, very old, for the mud on your shoes before you go into a house. It is fixed to the pavement under the café&rsquo;s long window. Nobody could use it there: there is no door.');
  });
  $('#phone').addEventListener('click', function () { if (!busy) SC.letter(); });
  AR.live('i-box', function () {
    document.body.classList.remove('buzz'); void document.body.offsetWidth; document.body.classList.add('buzz'); AR.sfx.buzz();
    ER.say('Your phone buzzes. A message from the archivist: the box from 1979 has come up from the strongroom.');
  }, 'My partner has the box from 1979');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
