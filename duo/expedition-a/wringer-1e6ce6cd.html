<body>

  <radialGradient id="lampR" cx="52%" cy="55%" r="60%"><stop offset="0" stop-color="#fff0c8" stop-opacity=".3"/><stop offset=".55" stop-color="#ffd890" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="vigR" cx="50%" cy="52%" r="72%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7046"/><stop offset="1" stop-color="#5a4628"/></linearGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#120d07"/>

<path d="M-1000 -700H2600V260Q800 160 -1000 300Z" fill="#2c2318"/>
<path d="M-1000 300Q800 160 2600 260V520Q800 420 -1000 560Z" fill="#3a2e20"/>
<g stroke="#1e170f" stroke-width="3" fill="none" opacity=".75"><path d="M-300 330q500 -70 1100 -60t1100 30M-100 440q600 -40 1300 -30"/><path d="M200 300q30 80 -10 190M1420 250q-20 100 20 200"/></g>
<!-- soot writing on the wall -->
<g id="soot" class="hot"><text x="930" y="330" font-family="Caveat,cursive" font-weight="700" font-size="40" fill="#0d0a06" transform="rotate(-4 930 330)">M.R. 14.4.68</text><rect x="900" y="290" width="200" height="60" fill="#000" fill-opacity="0"/></g>
<!-- the sand floor, with old boot prints -->
<path d="M-1000 560Q800 420 2600 520V1700H-1000Z" fill="url(#sand)"/>
<g fill="#4a3a20" opacity=".55"><ellipse cx="700" cy="640" rx="16" ry="34" transform="rotate(-20 700 640)"/><ellipse cx="760" cy="600" rx="14" ry="30" transform="rotate(-20 760 600)"/><ellipse cx="640" cy="690" rx="18" ry="38" transform="rotate(-20 640 690)"/></g>

<!-- ahead and a little to the left: a low crawl -->
<g id="crawl" class="hot"><ellipse cx="560" cy="470" rx="130" ry="40" fill="#060403"/><path d="M430 470q130 -70 260 0" stroke="#5a4a32" stroke-width="10" fill="none"/><path d="M432 474q128 40 256 0" stroke="#6a5638" stroke-width="6" fill="none"/></g>
<!-- on the right: a big passage going up -->
<g id="big" class="hot"><path d="M1160 560L1180 250Q1270 200 1360 240L1420 540Z" fill="#070504"/><path d="M1160 560L1180 250Q1270 200 1360 240L1420 540" stroke="#5a4a32" stroke-width="10" fill="none"/>
  <path d="M1200 520L1240 380L1330 360L1390 520" fill="#1c150d"/></g>

<g id="slope" class="hot"><path d="M-200 620Q100 560 260 600L320 760Q100 820 -200 840Z" fill="#070504"/><path d="M-200 620Q100 560 260 600L320 760" stroke="#5a4a32" stroke-width="10" fill="none"/>
  <text x="40" y="700" font-family="Caveat,cursive" font-weight="700" font-size="26" fill="#6a5a40" opacity=".8">&#8595;</text></g>
<g fill="#cdb98e" opacity=".45"><circle class="dust" cx="600" cy="460" r="2"/><circle class="dust b" cx="640" cy="480" r="1.6"/><circle class="dust" cx="1260" cy="380" r="2"/><circle class="dust b" cx="1300" cy="420" r="1.7"/></g>
<!-- your pack, on the sand in front of you -->
<g id="pack" class="hot"><path d="M760 820q-12 -70 26 -90h86q34 18 24 90z" fill="#c4611f" stroke="#5a2a0c" stroke-width="4"/><path d="M780 740q40 -26 92 0" stroke="#5a2a0c" stroke-width="6" fill="none"/>
  <g id="handset"><rect x="798" y="762" width="60" height="30" rx="6" fill="#2a2a26"/><circle cx="846" cy="777" r="7" fill="#c0391b"/></g></g>
<path d="M760 800q-200 30 -330 -90" stroke="#e3c13a" stroke-width="4" fill="none" stroke-dasharray="12 6"/>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#lampR)" pointer-events="none"/>

</svg>
</div>
<button type="button" class="gobtn" id="go">Along the crawl</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="exp.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null;

  ER.init({
    theme: 'duo', story: 'expedition-a', storyTitle: 'Meet Me Halfway', id: 'wringer', no: 'II', title: 'The Wringer',
    go: 'Sit up',
    intro: [
      'The Way Over started on the true right of the Washhouse. True left and true right are named looking downstream, and you were facing upstream, towards the duck: so the true right was on your LEFT, and Mavis&rsquo;s cairn was on the ledge on that side. The rope on the other side was fixed in 1979 by people who trusted the survey. It went nowhere.',
      'From the cairn you crawled north-east along a dry, sandy tube, the Airing Cupboard, with the telephone wire paying out behind you. Your watch says eighteen minutes past three.'
    ],
    exit: {"next":"rift","w":{"b1fff375":"81b9607b"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('a2-told') || {}; nextFile = ER.flag('a2-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a2-told', told); return true; }
  function isBusy() { return busy; }
  var ring = XP.phone({ mine: 'ringA', theirs: 'ringB', buzz: function () { var h = $('#handset'); h.classList.remove('buzz'); void h.getBoundingClientRect(); h.classList.add('buzz'); XP.sfx.buzz(); if (!busy && !ER.isOpen()) ER.say('The telephone in your pack buzzes: your partner wants you.'); } });
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.compass ? 1 : 0) + (told.flame ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) XP.card([['Tell your partner', ['&ldquo;I&rsquo;m in the crawl, and the air is blowing in my face. It goes!&rdquo;']]]);
    else XP.card([['Tell your partner', ['&ldquo;I&rsquo;m at a junction. Behind me is the crawl I came along. I can see three ways on: ahead and a bit to my left there&rsquo;s &hellip;&rdquo;', '&ldquo;My compass says I&rsquo;m facing &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;Which one is the Way Over? Tell me left or right, not north or south!&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The crawl goes on. Follow it.']];
    return ['which', [
      'Your partner has the survey, drawn with north at the top, and Mavis&rsquo;s note about this junction. They do not know which way you are facing. Look at the compass in your pack, and tell them.',
      'Tell your partner about every way on: where it is (ahead, on your left, behind you on the left), its shape, whether it goes up or down, what you can hear, and whether the flame of your lighter leans when you hold it there.',
      'Two of the ways draught. Mavis&rsquo;s notebook says which of those two goes and which one chokes. Your partner can turn the survey round until it faces the way you face, and then say left or right.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The crawl ahead of you breathes cool air into your face.'); return; }
    if (told.intro) { busy = false; ER.say('The Wringer: three ways on, and a draught that cannot make up its mind.'); return; }
    ER.narrate([
      'The Airing Cupboard opens into a low sandy room where three passages meet. You can sit up, which after the crawl feels like a holiday.',
      'On the wall, written in candle soot, small and neat: M.R. 14.4.68. Somebody sat here before you, on another wet weekend, fifty-eight years ago.',
      'Three ways on. Air moves past your face, and you cannot tell where it is going.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the three ways ---------- */
  var WAYS = {
    crawl: { kicker: 'Ahead of you, a little to the left', title: 'A low crawl', go: 'Crawl in',
      text: '<p>A low, flat opening at floor level, about as high as a shoebox is long. Sand inside. You would have to lie down and go on your elbows.</p><p>It is level: it goes neither up nor down.</p>',
      flame: 'You hold the lighter at the mouth of the crawl. The flame leans hard, and flutters. Air is moving here, a lot of it.',
      pic: '<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="300" fill="#3a2e20"/><ellipse cx="190" cy="170" rx="150" ry="46" fill="#060403"/><path d="M40 170q150 -80 300 0" stroke="#5a4a32" stroke-width="10" fill="none"/><rect y="200" width="380" height="100" fill="#7a6240"/></svg>',
      no: 'You stop at the mouth of the crawl, and come back to think again.' },
    big: { kicker: 'On your right', title: 'A big passage, going up', go: 'Go up it',
      text: '<p>A tall, wide passage, going up at a gentle slope. You could walk along it upright, which is the best thing anybody has offered you all day.</p>',
      flame: 'You hold the lighter at the mouth of the big passage. The flame leans, steadily. Air is moving here too.',
      pic: '<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="300" fill="#3a2e20"/><path d="M80 300L110 40Q190 0 270 30L320 300Z" fill="#070504"/><path d="M130 280L160 150L240 140L290 280" fill="#1c150d"/></svg>',
      no: 'You walk up the big passage: wide, easy, rising, with air hissing past you. After twenty metres it ends in a heap of boulders the size of armchairs, with the draught whistling between them. You can see blackness through the gaps, and you cannot get even an arm through any of them. A choke. You walk back down, and the passage seems a lot less friendly than it did.' },
    slope: { kicker: 'On your left, and a little behind you', title: 'A slope going down', go: 'Go down it',
      text: '<p>A steep slope of sand and pebbles going down into the dark. From the bottom comes the noise of fast water.</p>',
      flame: 'You hold the lighter at the top of the slope. The flame stands straight up and does not move.',
      pic: '<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="300" fill="#3a2e20"/><path d="M0 120Q190 90 380 120L380 300H0Z" fill="#070504"/><path d="M60 300q120 -120 260 0" fill="#1c150d"/></svg>',
      no: 'The slope drops into a round pot. At the bottom, six metres down, the stream roars past, brown and white. Without a rope, this is the quickest way to get very wet. You climb back up on your hands.' }
  };
  function way(k) {
    if (busy) return;
    if (nextFile) { ER.say('The crawl is the way on.'); return; }
    var w = WAYS[k];
    XP.look({ kicker: w.kicker, title: w.title, pic: w.pic, text: w.text,
      acts: [{ id: 'flame', label: 'Hold your lighter there', fn: function (api) { api.msg(w.flame); ER.addWord('draught', 'air moving through a cave'); if (tell('flame')) paint(); } },
        { id: 'go-in', label: w.go, fn: function (api) { tryWay(k, api); } }] });
  }
  function tryWay(k, api) {
    XP.set('a2-go', k + ':' + Date.now());
    XP.sfx.scrape();
    var file = ER.exit([k], { wait: true });
    if (!file) { setTimeout(function () { ER.sfx.no(); api.msg(WAYS[k].no); }, 700); return; }
    nextFile = file; ER.flag('a2-file', file);
    api.acts([]); api.msg('You lie down on the sand and push your head into the crawl. Cool air streams past your ears.');
    setTimeout(function () {
      ER.closeAll(); busy = true; paint();
      ER.narrate([
        'You go on your elbows, pushing the reel ahead of you. Sand gets into everything you own.',
        'The draught never stops. It blows into your face the whole way, steady as a fan, and somewhere ahead of it there must be a lot of cave.',
        'After nine metres the roof lifts, and you can kneel, then stand. The passage turns north-north-east and climbs.'
      ], function () { busy = false; paint(); });
    }, 2000);
  }
  ['crawl', 'big', 'slope'].forEach(function (k) { $('#' + k).addEventListener('click', function () { way(k); }); });

  /* ---------- other things ---------- */
  $('#pack').addEventListener('click', function () {
    if (busy) return;
    XP.pack({ face: 45, time: [15, 19], bars: 3, ring: ring });
    ER.$$('#p-compass').forEach(function (b) { b.addEventListener('click', function () { if (tell('compass')) paint(); }); });
  });
  XP.thing('#soot', null, 'Written in candle soot, small and neat: M.R. 14.4.68. Mavis Rowcliffe, the fourteenth of April 1968. She came this way, alone, in a flood.', isBusy);
  XP.thing('#candle', 'candle', 'The stub of a candle, standing in the sand. Cavers used to carry them for light, and for watching the draught.', isBusy);
  if (window.Link) Link.follow($('#go'), 'plan');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
