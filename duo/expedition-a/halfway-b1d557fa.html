<script>
(function () {
  var $ = ER.$, busy = true, gave = false;

  ER.init({
    theme: 'duo', story: 'expedition-a', storyTitle: 'Meet Me Halfway', id: 'halfway', no: 'VII', title: 'Halfway',
    go: 'Climb down',
    intro: [
      'The ladder had to reach from the anchor to the floor: the drop, 7.6 metres by your tape, plus the 1.2 metres from the thread back to the edge, so 8.8 metres, and the shortest ladder in the bag that is long enough was the ten-metre one. Mavis belayed her ladder round the thread on the UPSTREAM side of the Window. The stream in the Laundry flows from north to south, and you were facing east, out of the Window: so upstream, north, was on your LEFT. Murray&rsquo;s peg, on the downstream side, moved when you hit it.',
      'Twenty-five to five. Your partner has the lifeline.'
    ],
    exit: {"last":true,"rooms":7,"stars":5}, tags: {},
    hints: function () { return ER.flag('a7-done') ? null : ['end', ['Nothing to solve here. Climb down, and listen to the end of the story.']]; },
    onBegin: begin
  });

  function isBusy() { return busy; }
  function begin() {
    if (ER.flag('a7-done')) { busy = false; document.body.classList.add('met'); finish(true); return; }
    ER.narrate([
      'Half way down the ladder you stop for a moment, because your arms would like you to, and look down. Your partner is leaning back on the lifeline, looking up at you with a face that is trying very hard to look calm.',
      'You climb on. The light comes up round you, rung after rung, and smells of tea.'
    ], function () {
      document.body.classList.add('met');
      ER.narrate([
        'The last rung. Sand. Your partner lets go of the lifeline and, after a moment in which neither of you knows what to do, shakes your hand, very formally, as if you had just been introduced. Then they give you a sandwich. It has your name on it, in their careful capitals. They made it for you this morning, in case.',
        'At five o&rsquo;clock the radio hisses, and Reza&rsquo;s voice comes through the rock. &ldquo;Laundry, this is the hut. Tell me some good news.&rdquo; You tell him. There is a pause. Then another voice, older and very clear: &ldquo;This is Mavis Rowcliffe. Is my cairn still there?&rdquo;',
        '&ldquo;Three stones,&rdquo; you say. &ldquo;On the ledge, on the true right.&rdquo; &ldquo;And my arrows?&rdquo; &ldquo;Pointing out.&rdquo; &ldquo;Good,&rdquo; says Mavis. &ldquo;Then you came round the way I did. I sat up there in the dark for an hour in 1968, waiting for Murray&rsquo;s stove. You were quicker. There were two of you.&rdquo;',
        'Reza says the committee will have to redraw the survey. &ldquo;Tell them to do it in metres this time,&rdquo; says Mavis, &ldquo;and to ask somebody who has been there. Two somebodies, preferably. One to look, and one to read.&rdquo;',
        'The water will go down in the night; cave water always does, in the end. In the morning the two of you will walk out the way you came in, under the Low Duck, together. For now there is tea, and a dry ledge, and a great deal to talk about.'
      ], function () { busy = false; ER.flag('a7-done', 1); finish(false); });
    });
  }
  function finish(quick) {
    XP.ending({
      kicker: 'Meet Me Halfway &middot; the explorer&rsquo;s part', head: 'You came round.',
      other: 'Your partner&rsquo;s screen shows the same ending, from the foot of the ladder.',
      taskLabel: 'Write the route', taskKicker: 'For the Wolfstone Caving Club', taskHead: 'The Way Over, for the next party',
      taskText: '<p>Next month the club wants to send another party round the Way Over. Write them a route description from the Washhouse to the Window, in 70 to 110 words, the way you would say it on the telephone. Use at least six of these: on your left, on your right, true right, upstream, downstream, north-east, metres, the second hole, a T, the thread.</p>' +
        '<p><b>B</b> Or, with your partner: tell the story of today out loud, taking turns. One of you tells what the cave looked like, the other what the papers said, one sentence each, until it is all told.</p>'
    });
    XP.card([['Ask your partner', ['&ldquo;What was it like, waiting at the camp? What did you think when the dye came out?&rdquo;', '&ldquo;Who was right: the notebook or the survey?&rdquo;']]]);
    if (quick) ER.say('The Laundry. Tea, a dry ledge, and your partner.');
    else try { if (ER.track && ER.music()) ER.track.play(['duet', { root: 53, bpm: 84, scale: [0, 2, 4, 5, 7, 9, 11], drop: ['mel'], level: 1.0 }]); } catch (e) {}
  }
  XP.watchKey('kettle', function () { document.body.classList.add('kettle'); if (!busy) ER.say('Your partner has put the kettle on. Steam curls up into the lamplight.'); });
  $('#stove').addEventListener('click', function () { if (!busy) { document.body.classList.add('kettle'); ER.say('The stove, and the kettle. Mavis made tea on this ledge in 1968. Some things do not change.'); } });
  $('#hey').addEventListener('click', function () { if (!busy) ER.say('The HeyPhone. Next call: tomorrow morning, to say you are coming out.'); });
  $('#partner').addEventListener('click', function () {
    if (busy) return;
    if (!gave) { gave = true; XP.set('gift', true); ER.say('You give your partner the second sachet of dye, the one you did not use. &ldquo;For next time,&rdquo; you say. They look at it, and at you, and put it carefully in their pocket.'); }
    else ER.say('Your partner: the voice on the telephone, with a face at last. Ask them something. They have been here all afternoon, reading.');
  });
})();
</script>
