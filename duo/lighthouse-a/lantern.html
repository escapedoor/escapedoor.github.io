<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Lantern · Show a Light</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-duo.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="keeper.css">
<style>
  body{--bg:#05080f;--accent:#ffd27a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(5,8,15,.95);--tc-ink:#eef0f4;--cap-bg:rgba(8,12,22,.93);--panel:#121a26;--face-bg:#1c2636;--q-ink:#ffe2a8;--fade:#020306;--hud-bg:rgba(8,12,22,.84)}
  .rain{animation:rain .55s linear infinite}
  .rain.b{animation-duration:.72s}
  @keyframes rain{from{transform:translate(0,-80px)}to{transform:translate(-30px,80px)}}
  .shl{opacity:.06;transition:opacity .05s}
  .shl.lit{opacity:1}
  #shipglow{opacity:0}
  #shipglow.lit{opacity:.75}
  .cloud{animation:cl 18s ease-in-out infinite alternate}
  @keyframes cl{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
  #tube.shrill .whis{animation:shr .9s ease-out}
  @keyframes shr{0%,100%{transform:translateY(0)}20%,60%{transform:translateY(-14px)}40%,80%{transform:translateY(-8px)}}
  .beam{opacity:0}
  .beam.lit{opacity:1}
  .key-box{width:min(940px,95vw)}
  .bino{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr)}
  .bino-view{background:#000;display:grid;place-items:center}
  .bino-view svg{display:block;width:100%;height:auto}
  .bino .doc.pad{width:auto;max-height:none;box-shadow:none;margin:0}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050b"/><stop offset=".7" stop-color="#0d1422"/><stop offset="1" stop-color="#141c2a"/></linearGradient>
  <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#02040a"/></linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig1" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".66" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  <linearGradient id="curt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9ae94"/><stop offset=".5" stop-color="#d9cfb4"/><stop offset="1" stop-color="#9c927a"/></linearGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#sky1)"/>
<g class="cloud" fill="#1a2332" opacity=".8"><ellipse cx="300" cy="150" rx="420" ry="70"/><ellipse cx="1100" cy="90" rx="520" ry="80"/><ellipse cx="800" cy="260" rx="600" ry="50" fill="#141c2a"/></g>
<rect x="-1000" y="470" width="3600" height="1300" fill="url(#sea1)"/>
<g stroke="#2a3a52" stroke-width="2" fill="none" opacity=".7"><path d="M-1000 520q80-8 160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0t160 0"/>
  <path d="M-900 590q90-10 180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0t180 0"/></g>
<g stroke="#c9d6e8" stroke-width="2.4" opacity=".55" fill="none"><path d="M120 640q30-10 60 0M420 610q24-8 48 0M1240 630q36-12 72 0M900 700q40-12 80 0M300 760q50-14 100 0"/></g>
<!-- the ship's lamp, far off to the south-west -->
<g id="ship" class="hot"><circle cx="560" cy="505" r="60" fill="#000" fill-opacity="0"/><circle id="shipglow" cx="560" cy="505" r="34" fill="url(#glow1)"/>
  <circle id="shiplamp" class="shl" cx="560" cy="505" r="6" fill="#fffbe6"/><path d="M540 520h40l-6 6h-28z" fill="#0a0f18"/></g>
<!-- the dead electric light, outside on the gallery rail -->
<g id="elec" class="hot"><path d="M150 660v-120" stroke="#3a4250" stroke-width="10"/><rect x="104" y="470" width="92" height="76" rx="10" fill="#26303e" stroke="#4a5568" stroke-width="4"/>
  <rect x="116" y="484" width="68" height="46" rx="6" fill="#0c1018"/><path d="M196 506h40q20 0 20 30v120" stroke="#1d242e" stroke-width="5" fill="none"/></g>
<!-- the gallery rail outside, and the lantern's parapet -->
<g stroke="#2a313c" stroke-width="7"><path d="M-1000 600H2600"/><path d="M-1000 640H2600" stroke-width="4"/></g>
<g stroke="#2a313c" stroke-width="5"><path d="M-400 600v120M-200 600v120M0 600v120M300 600v120M600 600v120M900 600v120M1200 600v120M1500 600v120M1800 600v120"/></g>
<!-- rain on the glass -->
<g stroke="#9fb4d0" stroke-width="1.6" opacity=".35"><g class="rain"><path d="M100 0l-10 30M300 120l-10 30M520 40l-10 30M760 200l-10 30M980 60l-10 30M1180 180l-10 30M1400 20l-10 30M200 340l-10 30M640 380l-10 30M1060 320l-10 30M1300 420l-10 30M420 260l-10 30"/></g>
  <g class="rain b"><path d="M60 200l-10 30M380 20l-10 30M700 120l-10 30M860 320l-10 30M1120 60l-10 30M1480 240l-10 30M260 460l-10 30M560 300l-10 30M1000 440l-10 30M1360 140l-10 30"/></g></g>
<!-- the glazing bars of the lantern, running on the slant -->
<g stroke="#1a1f27" stroke-width="16"><path d="M-300 -100L500 760M300 -100L1100 760M900 -100L1700 760M-300 760L500 -100M300 760L1100 -100M900 760L1700 -100"/></g>
<rect x="-1000" y="-700" width="3600" height="640" fill="#0a0d12"/><path d="M-1000 -60H2600" stroke="#5a4a2a" stroke-width="10"/>
<rect x="-1000" y="740" width="3600" height="1200" fill="#1b2029"/><path d="M-1000 740H2600" stroke="#3a4250" stroke-width="10"/>
<g fill="#4a5262"><circle cx="560" cy="800" r="5"/><circle cx="700" cy="800" r="5"/><circle cx="840" cy="800" r="5"/><circle cx="980" cy="800" r="5"/><circle cx="1120" cy="800" r="5"/><circle cx="1260" cy="800" r="5"/><circle cx="1400" cy="800" r="5"/></g>
<!-- the old lens, behind its curtains -->
<g id="lens" class="hot"><rect x="1150" y="150" width="330" height="560" fill="url(#curt)"/><g stroke="#8a806a" stroke-width="3" opacity=".7"><path d="M1190 150v560M1235 150v560M1285 150v560M1335 150v560M1385 150v560M1430 150v560"/></g>
  <path d="M1140 140h350" stroke="#5a4a2a" stroke-width="10"/><path d="M1150 710q165 26 330 0" stroke="#9c927a" stroke-width="6" fill="none"/><rect x="1180" y="710" width="270" height="34" fill="#3a3324"/></g>
<!-- the signal lamp on its bracket -->
<g id="aldis" class="hot"><path d="M770 740v-70" stroke="#2a2a2a" stroke-width="8"/><rect x="720" y="600" width="130" height="74" rx="14" fill="#2c3440" stroke="#5a6676" stroke-width="4"/>
  <circle cx="850" cy="637" r="34" fill="#1a2028" stroke="#8a96a6" stroke-width="5"/><circle cx="850" cy="637" r="22" fill="#38404c"/><path d="M730 600l-10-24h40l-6 24" fill="#2c3440"/>
  <path d="M736 674l-6 28" stroke="#c4372b" stroke-width="8" stroke-linecap="round"/></g>
<!-- the speaking tube -->
<g id="tube" class="hot"><path d="M1040 900V700q0-30 30-30h30" stroke="#b0832e" stroke-width="22" fill="none"/><path d="M1040 900V700q0-30 30-30h30" stroke="#e2bc6a" stroke-width="6" fill="none" opacity=".5"/>
  <ellipse cx="1104" cy="670" rx="12" ry="24" fill="#b0832e"/><g class="whis"><rect x="1106" y="660" width="26" height="20" rx="4" fill="#d9b86a"/><circle cx="1134" cy="670" r="5" fill="#8a6420"/></g></g>
<!-- the hatch to the stairs -->
<g id="hatch" class="hot"><path d="M620 830h240l40 50H580z" fill="#0d1016" stroke="#4a5262" stroke-width="5"/><path d="M640 846h200M630 862h220" stroke="#2a313c" stroke-width="4"/></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#vig1)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">To the lens</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="lamp.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, lamp = null, keyApi = null;
  var CALL = 'AA AA AA', NEXT = 'F';

  ER.init({
    theme: 'duo', story: 'lighthouse-a', storyTitle: 'Show a Light', id: 'lantern', no: 'I', title: 'The Lantern',
    go: 'Look out to sea',
    intro: [
      '<b class="two">This is a story for two. Your partner plays THE WATCH KEEPER (part B) on another screen. Do not show each other your screens: talk. Everything one of you can see, the other one needs. You can also link your two screens with the tag in the bottom left corner: then what one of you does can show on the other screen. The clues will not go across. You still have to say them.</b>',
      'Siller Ness lighthouse, Saturday 17 October, a little after nine at night. The last open day of the year ended at four. Then the wind went round to the south-west, and the storm came early.',
      'You are a volunteer with the Friends of Siller Ness Light. Today was your first open day: you climbed the 132 steps eleven times with visitors, and you know the lantern better than the papers. At four minutes past nine the power went off all over the island, and the electric light on the gallery went out with it.',
      'Your partner, the other volunteer who stayed to lock up, is at the foot of the tower in the old watch room, with the log, the code book, the charts, the radio and the telephone. Between you there are 132 steps and a brass speaking tube. You met this morning.'
    ],
    exit: {"next":"lens","w":{"f85f25f1":"c8980e04"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('a1-told') || {}; nextFile = ER.flag('a1-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a1-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.looked ? 1 : 0) + (nextFile ? 1 : 0), 2);
    if (nextFile) KP.card([['Tell your partner', ['&ldquo;The ship has stopped calling. Now it is sending one signal, again and again: short, short, &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;What does that one mean?&rdquo;']]]);
    else if (told.looked) KP.card([['Tell your partner', ['&ldquo;The ship&rsquo;s lamp goes: short, long &hellip; gap &hellip;&rdquo;']], ['Ask your partner', ['&ldquo;What does it mean? What should I answer with the signal lamp? Long flashes or short ones?&rdquo;']]]);
    else KP.card([['Tell your partner', ['&ldquo;Watch room, this is the lantern. The electric light is out. And there&rsquo;s a light out at sea, flashing.&rdquo;']], ['Ask your partner', ['&ldquo;Can you hear me? Have you got the code book?&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', [
      'The ship has stopped calling. It has started a new signal: one group of flashes, again and again. Look through the binoculars again and read it to your partner, flash by flash. Your partner will write it in the log.'
    ]];
    if (!told.looked) return ['look', [
      'Out at sea, to the south-west, a small light is flashing. Click on it to look at it through the binoculars.',
      'You have no code book, and your partner has no window on the sea. Tell your partner exactly what the light does: short flashes, long flashes, and where the gaps are.'
    ]];
    return ['answer', [
      'Read your notes to your partner group by group: &ldquo;short, long; short, long; gap&rdquo;. Ask what the signal means, and how a lighthouse should answer it.',
      'The answer is sent with the signal lamp on its bracket, in front of you. Press for a short flash; hold the button down for a long one; let go for a second between flashes, so that they do not run into each other.',
      'Your partner&rsquo;s code book says what an answer to a call looks like. Send exactly that, then press the button that says it is the signal, and watch the ship.'
    ]];
  }
  function begin() {
    paint();
    lamp = KP.ship({ node: $('#shiplamp'), glow: $('#shipglow'), text: nextFile ? NEXT : CALL });
    if (nextFile) { busy = false; ER.say('The ship has stopped calling. Its lamp is sending one signal, over and over.'); return; }
    if (told.intro) { busy = false; ER.say('The lantern. Rain on the glass, and a lamp out at sea, calling.'); return; }
    ER.narrate([
      'The lantern is dark and loud. Rain hits the glass in handfuls, and the whole tower hums in the wind, like a bottle somebody is blowing across.',
      'In the middle of the lantern stands the old lens, taller than you, behind its canvas curtains: a museum piece, lit once a year for the visitors. Outside on the gallery, the small electric light that has done the real work since 1987 is dead.',
      'And out at sea, to the south-west, where there should be nothing at all, a small white light is flashing. Over and over, the same few flashes. Somebody out there is calling.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the binoculars ---------- */
  function binoSvg() {
    return '<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="300" fill="#000"/><clipPath id="bc"><circle cx="140" cy="150" r="120"/><circle cx="280" cy="150" r="120"/></clipPath>' +
      '<g clip-path="url(#bc)"><rect width="420" height="300" fill="#0b1220"/><rect y="160" width="420" height="140" fill="#050a14"/><path d="M0 200q40-8 80 0t80 0t80 0t80 0t80 0t80 0" stroke="#2a3a52" stroke-width="3" fill="none"/>' +
      '<path d="M150 176l40-50 6 50z" fill="#1a2230"/><path d="M196 126v54M214 136v44" stroke="#1a2230" stroke-width="4"/><path d="M140 178h120l-14 14H156z" fill="#1a2230"/>' +
      '<circle id="bglow" cx="226" cy="150" r="46" fill="url(#bgl)"/><circle id="blamp" class="shl" cx="226" cy="150" r="13" fill="#fffbe6"/></g>' +
      '<radialGradient id="bgl"><stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient></svg>';
  }
  var bLamp = null;
  function notes() {
    var s = '<h4>Your notes · what the ship&rsquo;s lamp does</h4><p>Short and long flashes, written as you see them. A box for each little group; a red mark where the dark is longer.</p>' +
      '<p class="seen">' + KP.seen(CALL) + '</p><p>(again and again, the same)</p>';
    if (nextFile) s += '<p>After your answer, a new signal, again and again:</p><p class="seen">' + KP.seen(NEXT) + '</p>';
    return s;
  }
  function bino() {
    if (busy) return;
    var box = ER.el('div', 'bx bino');
    box.innerHTML = '<div class="bino-view">' + binoSvg() + '</div><div class="doc pad">' + ER.gloss(notes()) + '</div>';
    ER.open('ov-look', box, function () {
      if (bLamp) bLamp.stop(); bLamp = null;
      if (nextFile) ER.addClue('notes1b', 'Notes: the ship&rsquo;s call, and the signal after it', notes(), 'pad', 'Your own notes');
      else ER.addClue('notes1', 'Notes: the ship&rsquo;s call', notes(), 'pad', 'Your own notes');
    });
    bLamp = KP.ship({ node: box.querySelector('#blamp'), glow: box.querySelector('#bglow'), text: lamp ? lamp.text() : CALL });
    ER.addWord('binoculars', 'two small telescopes side by side, to see far things with both eyes');
    if (tell('looked')) paint();
  }
  $('#ship').addEventListener('click', bino);

  /* ---------- the signal lamp ---------- */
  var ALDIS = '<svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg"><rect width="330" height="300" fill="#06090e"/>' +
    '<polygon class="beam" points="250,120 330,40 330,240" fill="#fffbe6" opacity=".9"/>' +
    '<rect x="70" y="90" width="170" height="70" rx="16" fill="#2c3440" stroke="#5a6676" stroke-width="4"/><circle cx="240" cy="125" r="44" fill="#1a2028" stroke="#8a96a6" stroke-width="6"/>' +
    '<circle class="beam" cx="240" cy="125" r="30" fill="#fffbe6"/><path d="M84 160l-14 70" stroke="#2a2a2a" stroke-width="12" stroke-linecap="round"/>' +
    '<g class="trig"><path d="M110 160q10 40-8 70" stroke="#c4372b" stroke-width="14" fill="none" stroke-linecap="round"/><rect x="60" y="150" width="90" height="100" fill="#000" fill-opacity="0"/></g>' +
    '<path d="M90 90l-14-34h70l-10 34" fill="#2c3440"/><text x="165" y="282" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#8a96a6" text-anchor="middle">THE SIGNAL LAMP</text></svg>';
  function openKey() {
    if (busy) return;
    if (nextFile) { ER.say('The ship has stopped calling. Watch what it is sending now: look through the binoculars.'); return; }
    if (!keyApi) keyApi = KP.key({
      title: 'The signal lamp',
      how: 'Press the button (or the red trigger) for a short flash. Hold it down for a long one. Let go for a second between flashes. When you have sent what you want to send, say so, and watch the ship.',
      pic: ALDIS, sendLabel: 'That is my signal', onSend: sent
    });
    keyApi.open();
    keyApi.msg(told.tried ? 'The ship&rsquo;s lamp is still calling.' : 'The shutter clacks as you press. Out in the rain, the ship should see every flash.');
  }
  function sent(letters, raw) {
    tell('tried');
    if (/^T{4,}$/.test(letters)) {
      var file = ER.exit(['tttt'], { wait: true });
      if (!file) return;
      nextFile = file; ER.flag('a1-file', file);
      keyApi.msg('A row of long flashes. Out at sea, the ship&rsquo;s lamp stops in the middle of a call &hellip;');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        if (lamp) lamp.set(NEXT);
        ER.narrate([
          'The ship&rsquo;s lamp stops calling. For a long moment there is only rain.',
          'Then it begins again, but not the same. One group of flashes, sent slowly and carefully, and then again, and again: short, short, long, short.',
          'Somebody out there has seen you. Whatever it is, they want the lighthouse to know it.'
        ], function () { busy = false; paint(); });
      }, 2200);
      return;
    }
    ER.sfx.no();
    if (letters.indexOf('#') >= 0) keyApi.msg('You sent: ' + raw.join('  ') + '. Some of your flashes ran together into one long blur. Let go for a moment between them, so that the ship can tell where one ends and the next begins.');
    else if (/^E+$/.test(letters)) keyApi.msg('You sent a row of short flashes. Out at sea the ship&rsquo;s lamp stops, then starts its call again from the beginning, as if you had said something had gone wrong. Tell your partner what you sent, and ask.');
    else if (/^T{1,3}$/.test(letters)) keyApi.msg('The ship goes on calling. Your long flashes may have been lost in the rain between two of its calls. Check with your partner how many an answer needs.');
    else keyApi.msg('You sent: ' + raw.join('  ') + '. The ship goes on calling, exactly as before. Whatever that was, it was not an answer the ship knows. Ask your partner what the code book says.');
  }
  $('#aldis').addEventListener('click', openKey);

  /* ---------- other things ---------- */
  KP.tube('#tube', isBusy);
  KP.thing('#lens', 'lens', function () { return 'The old lens, behind its canvas curtains. By day the curtains stop the sun from shining through the glass and setting fire to something. Tonight it may be needed.'; }, isBusy);
  KP.thing('#elec', null, 'The electric light, outside on the gallery rail. It needs the power from the mainland, and its battery should have taken over when the power went. It did not. Its lens is dark.', isBusy);
  KP.thing('#hatch', 'hatch', 'The hatch to the stairs. A hundred and thirty-two steps down to the watch room, and you have done them twenty-two times today.', isBusy);
  if (window.Link) Link.follow($('#go'), 'watch');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
