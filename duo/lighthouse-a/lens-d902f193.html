  body.lit #scene .glowL{opacity:1}
  #tube.shrill .whis{animation:shr .9s ease-out}

  .app{width:min(1040px,96vw)}
  .app svg .part{cursor:pointer}
  .app svg .part:hover{filter:brightness(1.3)}
  .app .curt{transition:transform 1.1s}
  .app svg.open .curtL{transform:translateX(-108px) scaleX(.25)}
  .app svg.open .curtR{transform:translateX(108px) scaleX(.25)}
  .app .curtL{transform-origin:392px 0}
  .app .curtR{transform-origin:648px 0}
  .app .flameS{opacity:0}
  .app svg.burning .flameS{opacity:1;animation:fs .4s steps(2,end) infinite alternate}
  @keyframes fs{from{transform:scaleY(.8)}to{transform:scaleY(1.1)}}
  .app .flameS{transform-origin:520px 344px}
  .app .mant{fill:#e8e2d0}
  .app svg.lit .mant{fill:#fffbe6;filter:drop-shadow(0 0 10px #fff3c0)}
  .app .halo{opacity:0;transition:opacity 1s}
  .app svg.lit .halo{opacity:.3}
  .app svg.turning .band{animation:band 2.4s linear infinite}
  @keyframes band{from{transform:translateX(0)}to{transform:translateX(-86px)}}
  .app #needle{transition:transform .35s}
  .app #wptr{transition:transform 1.2s}
  .app #brakeH{transition:transform .3s}
  .app svg.off #brakeH{transform:rotate(-50deg)}
  .app .chip{opacity:0}
  .app svg.face1 .chip{opacity:1}
  .app .bx-foot .gov{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:#ffc35a}

<script>
(function () {

    intro: [
      'The ship was making the general call: &ldquo;Is anybody there?&rdquo; You answered it from the signal lamp with a row of long flashes: &ldquo;I can see you. Go on.&rdquo; Then the ship stopped calling, and began to send one short signal, again and again: short, short, long, short. Your partner found it in the code book. The ship is disabled.',
      'Up the speaking tube your partner tells you the rest. The coastguard knows her: the Whimbrel, a sail training ship, with young trainees on board. A wave filled her chart house: radio, GPS, radar, all dead. She is under sail in the dark with a compass and a hand lamp, and she cannot tell Siller Ness from Mallack Head.',
      'The only light in the tower that does not need the mains is the old lamp. It burns paraffin, and its lens is turned by clockwork. The Friends light it once a year, in the summer, and you have never seen it lit. The instructions are in a book at the bottom of the tower, in your partner&rsquo;s hands.'
    ],
    exit: {"next":"gallery","w":{"97cd3f88":"5eac663c"}}, tags: {"seq":["015d2d89","f0ccfba0","00957953","50289887","99b8eb05","119994d6"]},

  told = ER.flag('a2-told') || {}; nextFile = ER.flag('a2-file') || null;

  function paint() {

  function hints() {
    if (nextFile) return ['go', ['The lamp is lit and turning. Go out onto the gallery: the ship should be able to see it now.']];

      'Your partner has the book that says how to light the old lamp, and you have the lamp. Click on the lens to get close to it.',
      'The book has more than one page about lighting up. Describe the burner to your partner, so that they read you the right page: how many white mantles are there inside the lens?'
    ]];
    var st = app ? app.stage() : 0;
    if (st < 5) return ['light', [
      'Do nothing until your partner has read you the whole list. Then do the steps in that order, one at a time, and say each one back.',
      'Nothing in front of you has a label. Describe the parts to your partner and ask them to describe the part they mean: &ldquo;a long handle beside the tank&rdquo;, &ldquo;a little brass cup under the mantles&rdquo;.',
      'The gauge must show exactly the pressure in the book: each stroke of the pump adds ten. And the oil must never reach a cold burner: something has to heat it first.'
    ]];
    return ['speed', [
      'The governor is the brass dial on the clock case. It is marked in seconds for one turn of the lens. Set it before you take the brake off.',
      'Your partner&rsquo;s book has a rule for the speed. It needs a number from their List of Lights, and a number that only you can find: walk round the lens and count its faces.',
      'The enamel plate on the clock case is from 1911. Ask your partner which is newer, the plate or the List of Lights, and which one the ships carry.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The lamp is lit. The lens turns, and the beam goes round.'); return; }
    if (told.intro) { busy = false; ER.say('The old lens, the clock case, the oil tank. Nothing has a label.'); return; }
    ER.narrate([
      'Close to, the lens is a great lantern of glass, taller than you, rings and rings of prisms round a middle band of bull&rsquo;s-eyes. Somebody polished every one of them for the open day.',
      'Under it, the clock case: brass wheels behind a little door, a handle, a lever, a dial. On the floor, the oil tank, with a gauge and a pump. Not one of them has a label. In 1911 everybody knew what they were.',
      'Far below you, in the watch room, your partner has the book.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the lamp ---------- */

    s += '<g id="needle" style="transform-origin:135px 260px;transform:rotate(-120deg)"><path d="M135 266V212" stroke="#c4372b" stroke-width="4" stroke-linecap="round"/></g><circle cx="135" cy="260" r="6" fill="#2a2010"/></g>';

    s += '<g class="part" data-p="valve"><circle cx="360" cy="430" r="22" fill="none" stroke="#c4372b" stroke-width="7"/><path d="M338 430h44M360 408v44" stroke="#c4372b" stroke-width="4"/><circle cx="360" cy="430" r="40" fill="#000" fill-opacity="0"/></g>';

    for (i = 0; i < 6; i++) s += '<circle cx="' + (440 + i * 86) + '" cy="250" r="34"/>';
    s += '</g></g></g><circle class="halo" cx="520" cy="290" r="120" fill="#fff3c0" opacity=".0"/>';
    s += '<path class="chip" d="M398 330l18 4-10 12z" fill="#0d0a06"/>';
    s += '<g class="mants"><rect class="mant" x="490" y="270" width="16" height="30" rx="7"/><rect class="mant" x="512" y="262" width="16" height="34" rx="7"/><rect class="mant" x="534" y="270" width="16" height="30" rx="7"/></g>';
    s += '<path d="M520 300v40" stroke="#8a7a5a" stroke-width="8"/><path d="M470 400h50v-60" stroke="#7a6a4a" stroke-width="6" fill="none"/>';
    s += '<g class="part" data-p="spirit"><path d="M500 344h40l-6 16h-28z" fill="#c9a94e" stroke="#6a5520" stroke-width="3"/><path class="flameS" d="M520 344q-14-22 0-44q14 22 0 44z" fill="#6aa0ff"/><rect x="480" y="320" width="80" height="50" fill="#000" fill-opacity="0"/></g>';
    s += '<g class="curt curtL part" data-p="curtains"><rect x="380" y="34" width="140" height="456" fill="#d9cfb4"/><g stroke="#9c927a" stroke-width="3"><path d="M400 34v456M430 34v456M460 34v456M490 34v456"/></g></g>';
    s += '<g class="curt curtR part" data-p="curtains"><rect x="520" y="34" width="140" height="456" fill="#cfc5aa"/><g stroke="#9c927a" stroke-width="3"><path d="M550 34v456M580 34v456M610 34v456M640 34v456"/></g></g>';
    s += '<path d="M380 30h280" stroke="#5a4a2a" stroke-width="10"/></g>';
    s += '<rect x="640" y="470" width="30" height="50" rx="6" fill="#6a3a8a"/><rect x="646" y="462" width="18" height="12" fill="#3a2a4a"/>';
    /* the clock case */
    s += '<rect x="700" y="230" width="300" height="290" fill="#2a3a2e" stroke="#0e1410" stroke-width="6"/>';
    s += '<g fill="#b0832e"><circle cx="760" cy="440" r="30"/><circle cx="806" cy="410" r="16"/></g>';
    s += '<g><rect x="716" y="250" width="30" height="170" fill="#0e1410" stroke="#b0832e" stroke-width="2"/><text x="731" y="244" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="12" fill="#e2c46e" text-anchor="middle">FULL</text>' +

  function makeApp() {
    var box = ER.el('div', 'bx app'), seq = [], pressure = 0, warm = 0, lit = false, wound = false, face = 1, turning = false;
    box.innerHTML = appSvg() + '<div class="bx-foot"><p class="pmsg"></p><span class="gov">Governor</span><span id="gov-c"></span><button type="button" class="btn" id="walk">Walk round the lens</button></div>';
    var svg = box.querySelector('svg');
    var gc = (function () {
      var i = 0, el = ER.el('span', 'ctr', '<button type="button" data-d="-1">&#9660;</button><b></b><button type="button" data-d="1">&#9650;</button>');
      function show() { el.querySelector('b').textContent = GOV[i]; svg.querySelector('#gptr').style.transform = 'rotate(' + (-135 + i * 45) + 'deg)'; }
      el.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (!b) return; if (turning) { msg('The brake is off and the lens is turning. Put the brake on before you change the speed.'); return; } i = (i + parseInt(b.getAttribute('data-d'), 10) + GOV.length) % GOV.length; show(); ER.sfx.tick(0.6); });
      el.id = 'gov'; show();
      return { el: el, value: function () { return GOV[i]; } };
    })();
    box.querySelector('#gov-c').appendChild(gc.el);
    function msg(t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); }
    function needle() { svg.querySelector('#needle').style.transform = 'rotate(' + (-120 + pressure * 2.4) + 'deg)'; }
    function seqOk(list) { return ER.check('seq', list.join('-')); }
    function candidate(id) { var l = seq.slice(); if (pressure && !seq.some(function (x) { return x.charAt(0) === 'p'; })) l.push('p' + pressure); l.push(id); return l; }
    function stage() { return seq.length; }
    function resetTo(n, vent) {
      seq = seq.slice(0, n);
      if (vent) { pressure = 0; needle(); }
      if (n < 3) { warm = 0; svg.classList.remove('burning'); }
    }
    function step(id, act) {
      if (!svg.classList.contains('open') && id !== 'c') { msg('The curtains are still drawn round the lens. You cannot get at anything inside them, and nothing outside them is any use yet.'); return; }
      var c = candidate(id);
      if (seqOk(c)) { seq = c; act(); tell('s' + seq.length); paint(); return; }
      ER.sfx.no();
      var g = 0; while (g < c.length && seqOk(c.slice(0, g + 1))) g++;
      var bad = c[g];
      if (bad.charAt(0) === 'p') { msg('The gauge says ' + pressure + ' lb. Is that the number in the book? You open the little vent, and the needle drops back to nothing. Ask your partner to read the line again, and say it back. Then pump again.'); resetTo(g, true); return; }
      if (bad === 's') { msg('The spirit flares blue in the little cup and burns away for nothing: there is no pressure in the tank to send any oil up. Something else comes before the spirit. Ask your partner for the order again.'); resetTo(g, false); return; }
      if (bad === 'v') { msg('Cold oil spits out of the burner and drips down the glass: a smoky yellow flame, and a smell like a garage. You shut the valve quickly and wipe it. The oil must never reach a cold burner. Start again from the tank: the pressure has gone.'); resetTo(1, true); return; }
      if (bad === 'w') { msg('You wind the handle three turns, and stop. The book has an order, and there is nothing to turn a lens for yet. Ask your partner what comes before the clock.'); return; }
      if (bad === 'b') { msg(wound ? 'You take off the brake. The lens does not move: the lamp is not lit, and the book has a reason for its order.' : 'You take off the brake. Nothing moves: the weight is at the bottom of its tube, and there is nothing to turn the lens. You put the brake back on.'); return; }
      msg('That is not the next step in the book. Ask your partner to read the list again.');
    }
    box.querySelector('svg').addEventListener('click', function (e) {
      var g = e.target.closest ? e.target.closest('.part') : null; if (!g) return;
      var p = g.getAttribute('data-p');
      if (lit && turning) { msg('The lamp is lit and the lens is turning. Leave it be.'); return; }
      if (p === 'curtains') {
        if (svg.classList.contains('open')) { msg('The curtains are open, pushed back to the sides of the lens.'); return; }
        step('c', function () { svg.classList.add('open'); ER.sfx.paper(); msg('You pull the curtains back. Behind them, the lens, and inside the lens the burner: three white mantles, like little socks, over a brass cup.'); ER.addWord('mantle', 'a little cover of fine net that glows white when it is hot'); tell('opened'); });
      } else if (p === 'pump') {
        if (!svg.classList.contains('open')) { msg('The curtains are still drawn round the lens. The book will have an order: ask your partner what comes first.'); return; }
        if (seq.some(function (x) { return x.charAt(0) === 'p'; })) { msg('The tank is pumped already: the gauge says ' + pressure + ' lb.'); return; }
        pressure = Math.min(100, pressure + 10); needle(); KP.sfx.crank();
        if (pressure >= 100) { KP.sfx.hiss(); pressure = 90; needle(); msg('A hiss: the safety valve has opened. Far too much. The needle sinks back to 90.'); return; }
        msg('One stroke of the pump. The needle on the gauge creeps round: ' + pressure + ' lb.');
      } else if (p === 'spirit') {
        if (warm) { msg(warm === 1 ? 'The spirit is burning. Wait for it.' : 'The spirit has nearly burnt out. The burner above it is hot.'); return; }
        step('s', function () {
          warm = 1; svg.classList.add('burning'); ER.addWord('methylated spirit', 'a purple spirit that burns with a clean blue flame');
          msg('You fill the little brass cup from the purple bottle and light it. A blue flame climbs round the burner. Wait for it &hellip;');
          setTimeout(function () { if (warm === 1) { warm = 2; msg('The blue flame is dying down. The spirit has nearly burnt out, and the burner is hot.'); } }, 3000);
        });
      } else if (p === 'valve') {
        if (warm === 1 && seq[seq.length - 1] === 's') { msg('Not yet: the spirit is still burning, and the burner is still warming.'); return; }
        if (lit) { msg('The oil is on. The mantles are glowing.'); return; }
        step('v', function () { lit = true; svg.classList.remove('burning'); svg.classList.add('lit'); KP.sfx.whump(); paint(); if (window.Link) Link.set('lit', 1);
          msg('You turn the little wheel. A soft roar: the oil comes up hot, turns to vapour, catches from the last of the spirit, and the three mantles go white, then whiter, until you cannot look at them.'); });
      } else if (p === 'wind') {
        if (wound) { msg('The weight is at the top. The pointer says FULL.'); return; }
        step('w', function () { wound = true; svg.querySelector('#wptr').style.transform = 'translateY(0)'; for (var k = 0; k < 5; k++) setTimeout(KP.sfx.crank, k * 220);
          msg('You turn the handle, and turn it, and turn it. Somewhere down the middle of the tower a weight rises up its tube. The pointer climbs to FULL.'); });
      } else if (p === 'brake') {
        brake();
      } else if (p === 'plate') {
        msg('A small enamel plate, screwed to the clock case: SILLER NESS. GP. FL. (3) EVERY 30 SECS. LIT 1911.');
        ER.addClue('plate', 'The enamel plate on the clock case', '<h4>Siller Ness</h4><p>GP. FL. (3) EVERY 30 SECS</p><p>LIT 1911</p>', 'brass', 'On the clock case', true);
      }
    });
    function brake() {
      var c = candidate('b');
      if (!seqOk(c)) { step('b', function () {}); return; }
      var file = ER.exit([c.join('-') + '-' + gc.value()], { wait: true });
      turning = true; svg.classList.add('off', 'turning'); ER.sfx.clunk(); if (window.Link) Link.set('turning', 1);
      if (!file) {
        var per = (parseInt(gc.value(), 10) / 4);
        msg('You take off the brake. The lens begins to turn, and the beams go round the lantern. You count against your watch: three flashes, dark; three flashes, dark: a group every ' + (per % 1 ? per.toFixed(2).replace(/0$/, '') : per) + ' seconds. Is that what the ships will be looking for? You put the brake back on to change the speed.');
        setTimeout(function () { turning = false; svg.classList.remove('off', 'turning'); }, 2600);
        return;
      }
      seq = c; nextFile = file; ER.flag('a2-file', file);
      msg('You take off the brake. The lens begins to turn, slowly and silently, and the beams go round the lantern. Three flashes, dark; three flashes, dark. A group every fifteen seconds, exactly as the List of Lights says.');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'For the first time since 1987, the old light of Siller Ness goes round for a ship. Three long arms of light swing out over the sea, and then the dark, and then three more.',
          'Out to the south-west, the ship&rsquo;s lamp flashes once, long. Somebody out there has counted three, and three, and three, and knows where they are.',
          'Behind you, the weight in the middle of the tower begins its long slow fall. It will not last all night. Nothing in a lighthouse does.'
        ], function () { busy = false; paint(); });
      }, 3000);
    }
    box.querySelector('#walk').addEventListener('click', function () {
      if (!svg.classList.contains('open')) { msg('The curtains are round the lens. You can only walk round canvas.'); return; }
      face = face % 4 + 1; svg.classList.toggle('face1', face === 1); ER.sfx.paper();
      msg(face === 1 ? 'You walk on round the lens, and here is the little chip in the corner of the glass again: you are back where you started.' : 'You walk round to the next face of the lens: three bull&rsquo;s-eyes in a row, like the last. No chip in the corner of this one.');
      ER.addWord('bull’s-eye', 'a round thick piece of glass in a lens, that makes one strong beam');
    });
    msg('Inside the curtains: the lamp. Outside them: a tank with a gauge and a pump, a little wheel on a pipe, a clock case with a handle, a dial and a red lever. Click on things to work them. Nothing has a label.');
    return { open: function () { ER.open('ov-lock', box); tell('app'); }, isLit: function () { return lit; }, stage: stage };
  }
  function openApp() {
    if (busy) return;
    if (nextFile) { ER.say('The lens is turning. Leave it be.'); return; }
    if (!app) app = makeApp();
    app.open();
  }
  $('#lens').addEventListener('click', openApp);
  $('#tank').addEventListener('click', openApp);
  $('#plate').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: '<h4>Siller Ness</h4><p>GP. FL. (3) EVERY 30 SECS</p><p>LIT 1911</p>', cls: 'brass', clue: { id: 'plate', title: 'The enamel plate on the clock case', kind: 'On the clock case' } });
  });

  /* ---------- the other screen ---------- */
  KP.tube('#tube', isBusy);
  KP.state('phone', function () { ER.say('Far below, the telephone in the watch room rings, and stops. Your partner has answered it.'); });
  if (window.Link) Link.follow($('#go'), 'book');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
