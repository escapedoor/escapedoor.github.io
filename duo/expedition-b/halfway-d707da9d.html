<script>
(function () {
  var $ = ER.$, busy = true, kettle = false;

  ER.init({
    theme: 'duo', story: 'expedition-b', storyTitle: 'Meet Me Halfway', id: 'halfway', no: 'VII', title: 'Halfway',
    go: 'Hold on',
    intro: [
      'The club card says a ladder must reach from the anchor to the floor: the drop, plus the distance from the anchor back to the edge. Your partner&rsquo;s tape said 7.6 metres to the floor (the survey&rsquo;s &ldquo;25&rdquo; was feet again: 25 feet is 7.6 metres), and the thread was 1.2 metres back from the edge: 8.8 metres, so the ten-metre ladder, the shortest one long enough. Mavis used the thread on the UPSTREAM side. Your stream flows from north to south, and your partner was facing east: so the thread on their left.',
      'Twenty-five to five. You have the lifeline.'
    ],
    exit: {"last":true,"rooms":7,"stars":5}, tags: {},
    hints: function () { return ER.flag('b7-done') ? null : ['end', ['Nothing to solve here. Hold the lifeline, and listen to the end of the story.']]; },
    onBegin: begin
  });

  function isBusy() { return busy; }
  function begin() {
    if (ER.flag('b7-done')) { busy = false; document.body.classList.add('met'); finish(true); return; }
    document.body.classList.add('met');
    ER.narrate([
      'The ladder creaks. Your partner comes down out of the dark into your light, a rung at a time, slowly at first and then not slowly at all.',
      'Half way down they stop and look at you, and you look back, and it is the first time since this morning that you have seen each other&rsquo;s faces. All afternoon you have known exactly what their voice sounds like when they are worried. It turns out their face does the same thing.'
    ], function () {
      ER.narrate([
        'The last rung, and sand. You let go of the lifeline. Neither of you knows what to say, so you shake hands, very formally, as if you had just been introduced. Then you give them the sandwich you labelled for them this morning, in case.',
        'At five o&rsquo;clock the radio hisses, and Reza&rsquo;s voice comes through the rock. &ldquo;Laundry, this is the hut. Tell me some good news.&rdquo; You tell him. There is a pause. Then another voice, older and very clear: &ldquo;This is Mavis Rowcliffe. Is my cairn still there?&rdquo;',
        'Your partner tells her: three stones, on the ledge, on the true right; and the arrows, pointing out. &ldquo;Good,&rdquo; says Mavis. &ldquo;Then you came round the way I did. I sat up there in the dark for an hour in 1968, waiting for Murray&rsquo;s stove. You were quicker. There were two of you.&rdquo;',
        'You tell her about the feet and the metres, and the true right that Mostyn Teasdale drew on the left. &ldquo;Poor Mostyn,&rdquo; says Mavis. &ldquo;He was right about everything he could measure at a kitchen table. I was right about everything I could see. It took two of you to put us together.&rdquo;',
        'The water will go down in the night; cave water always does, in the end. In the morning the two of you will walk out the way you came in, under the Low Duck, together. For now there is tea, and a dry ledge, and a great deal to talk about.'
      ], function () { busy = false; ER.flag('b7-done', 1); finish(false); });
    });
  }
  function finish(quick) {
    XP.ending({
      kicker: 'Meet Me Halfway &middot; the navigator&rsquo;s part', head: 'Your partner came round.',
      other: 'Your partner&rsquo;s screen shows the same ending, from the ladder.',
      taskLabel: 'Write the correction', taskKicker: 'For the Wolfstone Caving Club Journal', taskHead: 'A correction to the 1975 survey',
      taskText: '<p>Write a short correction for the club journal, in 70 to 110 words: what the 1975 survey got wrong, how the two of you found out, and what the new numbers are. Be fair to Mostyn Teasdale. Use at least five of these: I think, because, so, if, must have, had been, true right, feet, metres.</p>' +
        '<p><b>B</b> Or, with your partner: one of you argues that the survey was right, the other that the notebook was right. Then find one answer that you both agree with.</p>'
    });
    XP.card([['Ask your partner', ['&ldquo;What did it look like, the cave you came through?&rdquo;', '&ldquo;What did you think, sitting in the dark in the Drying Room?&rdquo;']]]);
    if (quick) ER.say('The Laundry. Tea, a dry ledge, and your partner.');
    else try { if (ER.track && ER.music()) ER.track.play(['duet', { root: 53, bpm: 84, scale: [0, 2, 4, 5, 7, 9, 11], drop: ['mel'], level: 1.0 }]); } catch (e) {}
  }
  XP.watchKey('gift', function () { document.body.classList.add('gift'); if (!busy) ER.say('Your partner gives you their second sachet of dye, the one they did not use. &ldquo;For next time.&rdquo;'); });
  $('#kettle').addEventListener('click', function () { if (busy) return; if (!kettle) { kettle = true; XP.set('kettle', true); } ER.say('You put the kettle on. Mavis made tea on this ledge in 1968. Some things do not change.'); });
  $('#hey').addEventListener('click', function () { if (!busy) ER.say('The HeyPhone. Next call: tomorrow morning, to say you are both coming out.'); });
  $('#climber').addEventListener('click', function () { if (!busy) ER.say('Your partner: the voice on the telephone, with a face at last, and a great deal of sand on it. Ask them something.'); });
})();
</script>
