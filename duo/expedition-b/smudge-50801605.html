<style>
  body{--bg:#141218;--accent:#e86a5a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(18,16,22,.95);--tc-ink:#f2ecf4;--cap-bg:rgba(20,18,24,.93);--panel:#221e2a;--face-bg:#332c3e;--q-ink:#ffc4bc;--fade:#060508;--hud-bg:rgba(20,18,24,.84)}
  .dig{display:flex;gap:6px;align-items:center}
  .dig .col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .dig .col span{font-family:'Caveat',cursive;font-weight:700;font-size:34px;line-height:1;width:1.1em;text-align:center;background:#f4efdf;border:1px solid #b3a58a;color:#2b2b3a}
  .dig .col .btn{padding:2px 8px;font-size:12px}
  .dig b{font-family:'Caveat',cursive;font-size:30px}
  #lampU{animation:glim 4s steps(3,end) infinite alternate}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="lampU" cx="46%" cy="52%" r="48%"><stop offset="0" stop-color="#fff6e8" stop-opacity=".46"/><stop offset=".6" stop-color="#ffe2c0" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="vigU" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></radialGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#100e12"/>
<!-- under the tarp: blue plastic above, sand below -->
<path d="M-1000 -700H2600V180Q800 60 -1000 180Z" fill="#1f3e58"/><path d="M-1000 180Q800 60 2600 180" stroke="#132a3e" stroke-width="8" fill="none"/>
<g stroke="#2a4c68" stroke-width="3" opacity=".7"><path d="M-200 -100L300 160M600 -100L780 110M1300 -100L1100 130"/></g>
<path d="M-1000 180Q800 60 2600 180V1700H-1000Z" fill="#5a4a36"/>
<!-- the notebook, open, very close -->
<g id="nbopen" class="hot" transform="rotate(-2 740 470)"><rect x="300" y="200" width="460" height="560" fill="#f4efdf"/><rect x="760" y="200" width="460" height="560" fill="#efe9d8"/><path d="M760 200v560" stroke="#8a7a62" stroke-width="4"/>
  <g stroke="#9db8cf" stroke-width="1" opacity=".6"><path d="M300 240H1220M300 280H1220M300 320H1220M300 360H1220M300 400H1220M300 440H1220M300 480H1220M300 520H1220M300 560H1220M300 600H1220M300 640H1220M300 680H1220M300 720H1220"/></g>
  <text x="330" y="270" font-family="Caveat,cursive" font-weight="700" font-size="30" fill="#2b2b3a">Sunday, later</text>
  <text x="330" y="350" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">Hamper: 30 ft along the ledge</text>
  <text x="330" y="390" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">DOWNSTREAM, the 2nd hole on the TR.</text>
  <text x="330" y="470" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">Flatiron: flat out, NW,</text>
  <ellipse cx="600" cy="462" rx="74" ry="40" fill="#a8865a" opacity=".85"/><ellipse cx="640" cy="480" rx="120" ry="70" fill="#8a6a3a" opacity=".35"/>
  <text x="680" y="470" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">ft to a T.</text>
  <text x="330" y="550" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">LEFT at the T: up a sand slope</text>
  <text x="330" y="590" font-family="Caveat,cursive" font-size="27" fill="#2b2b3a">into a big dry chamber ...</text>
  <text x="790" y="270" font-family="Caveat,cursive" font-weight="700" font-size="30" fill="#2b2b3a">Legs, Way Over (feet)</text>
  <text x="790" y="330" font-family="Caveat,cursive" font-size="26" fill="#2b2b3a">21-22   30   225   0</text>
  <text x="790" y="370" font-family="Caveat,cursive" font-size="26" fill="#2b2b3a">22-23</text><ellipse cx="900" cy="362" rx="44" ry="26" fill="#a8865a" opacity=".85"/><text x="960" y="370" font-family="Caveat,cursive" font-size="26" fill="#2b2b3a">315   0</text>
  <text x="790" y="410" font-family="Caveat,cursive" font-size="26" fill="#2b2b3a">23-24   28   225   +25</text></g>
<g id="survey" class="hot" transform="rotate(4 1360 760)"><rect x="1240" y="640" width="260" height="190" fill="#f6f2e6" stroke="#bcb29a" stroke-width="3"/><path d="M1300 800L1460 680" stroke="#1f2a36" stroke-width="14"/><path d="M1300 800L1460 680" stroke="#f1e3c2" stroke-width="8"/><text x="1370" y="720" font-family="EB Garamond,serif" font-weight="700" font-size="22" fill="#1f2a36">Flatiron 40</text></g>
<g id="pencil" class="hot"><path d="M140 640l170 -40l8 18l-170 40z" fill="#c0391b"/><path d="M140 640l-20 10l28 8z" fill="#e8c88a"/></g>
<g id="phone" class="hot"><rect x="100" y="420" width="120" height="84" rx="6" fill="#3e5a32" stroke="#22341c" stroke-width="4"/><circle cx="200" cy="462" r="14" fill="#22341c"/><path d="M200 462l26 -16" stroke="#c8c8c0" stroke-width="5"/><rect x="116" y="432" width="58" height="26" rx="5" fill="#1d1d1a"/><circle cx="164" cy="445" r="6" fill="#c0391b"/></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#lampU)" pointer-events="none"/>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#vigU)" pointer-events="none"/>
</svg>
</div>
<button type="button" class="gobtn" id="go">Back to the camp</button>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="../../assets/link.js"></script>
<script src="exp.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, d = [0, 0, 0], cross = null, partnerAt = false, box = null;
  var A = XP.T(22), B = XP.T(23), LEN = 40;

  ER.init({
    theme: 'duo', story: 'expedition-b', storyTitle: 'Meet Me Halfway', id: 'smudge', no: 'IV', title: 'The Smudge',
    go: 'Open the notebook',
    intro: [
      'Your partner poured the dye at 15:33, and the waterfall went green at 15:44: eleven minutes. So the stream in the rift flows south-west, to the Laundry, and downstream was on your partner&rsquo;s left. Mavis&rsquo;s Hamper was thirty feet (about nine metres) along the ledge downstream, the second hole in the true right wall: the far wall from where your partner stood.',
      'Your partner has gone into the Hamper with a tape. Ten to four. You sit under the tarp with the notebook, because the next line in it is the one you have been dreading.'
    ],
    exit: {"next":"floodlight","w":{"5b31ac57":"a3e4fe96","9a9b4e3c":"2ac62ff7","193e79e1":"6b5caa83"}}, tags: {"num":["e509456b"],"pos":["304cc324","84c03dfe","eb332296"],"trust":["6de40db0","a1a1fdc9"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b4-told') || {}; nextFile = ER.flag('b4-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b4-told', told); return true; }
  function isBusy() { return busy; }
  var ring = XP.phone({ mine: 'ringB', theirs: 'ringA', buzz: function () { var h = $('#phone'); h.classList.remove('buzz'); void h.getBoundingClientRect(); h.classList.add('buzz'); XP.sfx.buzz(); if (!busy && !ER.isOpen()) ER.say('The field telephone buzzes: your partner is calling.'); } });
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.board ? 1 : 0) + (cross != null ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) XP.card([['Tell your partner', ['&ldquo;Yes, that&rsquo;s the T! Mavis says: LEFT at the T, up a sand slope into a big dry chamber.&rdquo;', '&ldquo;Not straight on: that&rsquo;s the Mangle. Murray got stuck in it.&rdquo;']]]);
    else XP.card([['Ask your partner', ['&ldquo;How long is the crawl? What does your tape say, exactly?&rdquo;', '&ldquo;What can you see at the end of it?&rdquo;']], ['Tell your partner', ['&ldquo;The survey says the T is forty metres along. But if Mavis wrote it in feet &hellip;&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['Tell your partner which way to turn at the T. Mavis&rsquo;s line is under the smudge: LEFT, RIGHT and straight on are all there.']];
    return ['fix', [
      'Ask your partner how long the crawl really is: they are measuring it with a tape. And ask what they can see at the end of it.',
      'The survey says 40, and the survey is in metres. Mavis wrote all her lengths in feet (the first page of her notebook), and the key of the survey says 1 ft = 0.3048 m. If your partner&rsquo;s tape is right, what number did Mavis write under the smudge?',
      'Put the red cross on the survey where your partner really is (the scale bar is ten metres long), then fill in Mavis&rsquo;s number, in feet, and write the correction.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The correction is written in red. Your partner is going up the sand.'); return; }
    if (told.intro) { busy = false; ER.say('The smudge. Whatever Mavis wrote is under there.'); return; }
    ER.narrate([
      'The Flatiron. On the survey it is a long straight crawl, forty metres to a T. In the notebook it is a line of Mavis&rsquo;s handwriting with a brown stain in the middle of it, where the number was.',
      'Fifty-seven years in a damp box will do that. Whatever Mavis wrote is under there, and it is not coming out, and the same stain is on the table of legs on the next page.',
      'Your partner is in the Flatiron now, flat out, with a tape.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- the board ---------- */
  function along(p) {               /* metres along the drawn Flatiron, from the Hamper, as the survey draws it */
    var vx = B[0] - A[0], vy = B[1] - A[1], t = ((p[0] - A[0]) * vx + (p[1] - A[1]) * vy) / (vx * vx + vy * vy);
    return Math.round(Math.max(0, Math.min(1, t)) * LEN);
  }
  function at(m) { var t = m / LEN; return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]; }
  function extra() {
    var s = '<path id="flhit" d="M' + (A[0] * 10) + ' ' + (-A[1] * 10) + 'L' + (B[0] * 10) + ' ' + (-B[1] * 10) + '" stroke="rgba(0,0,0,.001)" stroke-width="40" fill="none" style="cursor:crosshair"/>';
    if (cross != null) { var c = at(cross); s += '<g stroke="#c0391b" stroke-width="5"><path d="M' + (c[0] * 10 - 12) + ' ' + (-c[1] * 10 - 12) + 'l24 24M' + (c[0] * 10 + 12) + ' ' + (-c[1] * 10 - 12) + 'l-24 24"/></g>'; }
    return s;
  }
  function draw() {
    if (!box) return;
    var dt = partnerAt ? at(12.2) : null;
    box.querySelector('.bd-main').innerHTML = XP.survey({ box: [-30, -4, 15, 36], fix: { wash: true }, dot: dt ? { x: dt[0], y: dt[1] } : null, extra: extra() });
    box.querySelector('#flhit').addEventListener('click', function (e) {
      if (nextFile) return;
      var p = ER.pt(box.querySelector('svg'), e); cross = along([p.x / 10, -p.y / 10]); XP.sfx.click(); paint(); draw();
    });
    for (var i = 0; i < 3; i++) box.querySelector('#d' + i).textContent = d[i];
    box.querySelector('#x-at').innerHTML = cross == null ? 'No cross yet: click on the Flatiron where your partner really is.' : 'Your red cross: ' + cross + ' m along the Flatiron, as the survey draws it.';
  }
  function msg(t) { if (box) box.querySelector('.pmsg').innerHTML = ER.gloss(t); }
  function openBoard() {
    if (busy) return;
    tell('board'); paint();
    box = ER.el('div', 'bd');
    box.innerHTML = '<div class="bd-main"></div><div class="bd-side"><h5>The Flatiron &middot; legs 22&ndash;23</h5>' +
      '<p>The survey: Flatiron 40 (metres). Mavis: <span style="background:#a8865a;color:transparent;border-radius:40%;padding:0 8px">00</span> ft.</p>' +
      '<p>1. Click on the Flatiron where your partner really is.</p><p id="x-at"></p>' +
      '<p>2. What did Mavis write under the smudge?</p><div class="dig">' +
      [0, 1, 2].map(function (i) { return '<div class="col"><button type="button" class="btn" data-up="' + i + '">+</button><span id="d' + i + '">0</span><button type="button" class="btn" data-dn="' + i + '">&minus;</button></div>'; }).join('') + '<b>ft</b></div>' +
      '<div class="row"><button type="button" class="btn" id="w-fix">Write the correction</button><button type="button" class="btn" id="w-nb">Mavis&rsquo;s notebook</button><button type="button" class="btn" id="w-key">The key</button></div><p class="pmsg"></p></div>';
    ER.$$('[data-up]', box).forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-up'); d[i] = (d[i] + 1) % 10; XP.sfx.click(); draw(); }; });
    ER.$$('[data-dn]', box).forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-dn'); d[i] = (d[i] + 9) % 10; XP.sfx.click(); draw(); }; });
    box.querySelector('#w-fix').onclick = fix;
    box.querySelector('#w-nb').onclick = function () { ER.close(); XP.notebook('sun2'); };
    box.querySelector('#w-key').onclick = function () { ER.close(); XP.legend(); };
    ER.open('ov-lock', box, function () { box = null; });
    draw();
    if (nextFile) msg('The correction is written.');
  }
  function fix() {
    if (nextFile) return;
    if (cross == null) { msg('First put the red cross where your partner really is.'); return; }
    var n = String(d[0] * 100 + d[1] * 10 + d[2]), file = ER.exit([n + '|' + cross], { wait: true });
    if (!file) {
      ER.sfx.no();
      var numOk = ER.check('num', n), posOk = ER.check('pos', String(cross));
      if (ER.check('trust', n)) msg('That is forty metres turned into feet: you have believed the survey. Does your partner&rsquo;s tape say forty metres? Ask what it says.');
      else if (!posOk && !numOk) msg('Neither fits. Ask your partner exactly what the tape says, then think in feet: one foot is 0.3048 metres.');
      else if (!posOk) msg('Mavis&rsquo;s number may be right, but the cross is not where your partner is. Use the scale bar: how many metres along the Flatiron is your partner?');
      else msg('The cross is in the right place. Now: how many feet is that? One foot is 0.3048 metres, so one metre is about 3.3 feet.');
      return;
    }
    nextFile = file; ER.flag('b4-file', file); ER.flag('flatfix', n + ' ft = 12.2 m'); XP.set('b4-fixed', true);
    msg('In red pencil, across the survey: ' + n + ' ft = 12.2 m. The T is where your partner is lying.');
    draw();
    setTimeout(function () {
      ER.closeAll(); busy = true; paint();
      ER.narrate([
        'Teasdale copied Mavis&rsquo;s number from the notebook, and forgot that she counted in feet. One forgotten word, and the end of the Way Over moved twenty-eight metres north-west, into solid rock, where nobody could ever find it.',
        'You move it back. Everything after the Flatiron moves with it: the T, the sand slope, and the big dry chamber Mavis called the Drying Room. You draw it again in red where it really is, and stare at it.',
        'The Drying Room is not twenty-eight metres away in the rock. It is almost exactly over your head.'
      ], function () { busy = false; paint(); });
    }, 2600);
  }
  XP.when('a4-at', function () {
    partnerAt = true; draw();
    var t = 'On the survey, the yellow dot of your partner&rsquo;s lamp has stopped in the Flatiron, about a third of the way along it, as the survey draws it.';
    if (box) msg(t); else if (!busy) ER.say(t);
  });
  $('#nbopen').addEventListener('click', openBoard);
  $('#survey').addEventListener('click', openBoard);
  $('#pencil').addEventListener('click', openBoard);
  $('#phone').addEventListener('click', function () { if (!busy) { ring(); ER.say('You turn the handle. In your partner&rsquo;s pack, the telephone buzzes.'); } });
  if (window.Link) Link.follow($('#go'), 'flatiron');
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
