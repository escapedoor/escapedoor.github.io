<script>
(function () {
  var $ = ER.$, R = null, lt = null;

  (function () {

  })();

  ER.init({
    theme: 'forensic', story: 'cold', storyTitle: 'Under Seal', id: 'profiles', no: 'IV', title: 'The DNA Laboratory',

      'In the microscope room you compared each fibre with the known ones, side by side: wool with its scales, cotton&rsquo;s twisted ribbon, nylon&rsquo;s smooth rod, with or without specks. From the lower part of the door glass, by the latch: nylon consistent with the glove, a denim thread that proves little, and a nylon like nothing in the room. From the upper part: red wool, consistent with Joel&rsquo;s jumper, which fits his own story of knocking on the glass.',
      'The glove and the jumper carried each other&rsquo;s fibres, and their labels said why: they were opened side by side on bench 3 at 09.30 on 10 November 2006. Fibres like that prove nothing about who wore what.',
      'A quarter past midnight. The DNA laboratory is the newest room in the building, and the brightest.'
    ],
    exit: {"next":"records","w":{"1ccff9c5":"80e03c7b"}}, tags: {"a":["340e9908"],"b":["e30dc5cf"],"c":["dad051ae"],"d":["8b87e116"]},
    hints: hints, onBegin: begin
  });

  R = CO.room({ id: 'd', need: ['hamza', 'manual', 'note', 'printout'], lock: '#table' });

  var HINTS = {
    a: ['For each column, look for one of FH/7&rsquo;s numbers in Irene&rsquo;s pair and the other one in Glyn&rsquo;s.',
      'At D8, FH/7 has 13 twice: a 13 from each parent is fine. If every column works, there is nothing to mark.'],
    b: ['Compare the two rows column by column. A column differs if the two pairs are not exactly the same.',
      'The four places that were read in 2006 are the same. Look hard at the other six.'],
    c: ['There are two traps: a number that neither parent has, and a pair whose two numbers could only come from the same parent.',
      'Look very closely at D16 and at D18.'],
    d: ['How many groups of 3,000 people are there in 60,000 people?', '60,000 ÷ 3,000.']
  };
  function hints() {
    if (R.next) return ['go', ['The four checks are signed. Down to the records office: the button at the bottom.']];
    if (lt && lt.isOpen()) return [lt.step(), HINTS[lt.step()]];
    if (!R.ready()) return ['look', [
      'A person to hear and three things to read (the pips count them).',
      'Dr Jalloh behind the glass wall; the manual page on the wall above the bench; the envelope on the bench; the printer at the left end of the bench.'

  }

  function begin() {
    R.paint();
    if (R.next) { R.busy = false; R.go(); ER.say('Not Joel. Not his brother. And twenty people in Gatherley.'); return; }
    if (R.told('in')) { R.busy = false; ER.say('The DNA laboratory. The analyser hums behind the glass.'); return; }
    R.tell('in');
    ER.narrate([
      'The DNA laboratory is white and humming. Half of it is behind a glass wall: the clean room, where nobody goes without a suit, a mask and two pairs of gloves. On a screen in there, coloured peaks rise and fall like a city seen from far away.',
      'In the outer room there is a light table, a printer still warm from printing, and a whiteboard covered in numbers. Dr Hamza Jalloh waves at you through the glass with a blue glove.'
    ], function () { R.busy = false; R.paint(); });
  }

  function seen(k) { return function (ok) { if (ok) R.tell(k); }; }
  $('#hamza').addEventListener('click', function () {
    if (R.busy) return;
    if (R.next) { ER.say('&ldquo;I&rsquo;d have lost my money,&rdquo; says Dr Jalloh. &ldquo;This is why I don&rsquo;t bet. Also, I have no money.&rdquo;'); return; }
    ER.talk({ who: 'Dr Hamza Jalloh', role: 'DNA unit, the Laboratory', face: FACE('hamza'), clue: { id: 'hamza4', title: 'Dr Jalloh: one number at every place', kind: 'Statement' }, done: seen('hamza'), lines: [
      'Come in, come in. No, don&rsquo;t come in. Stay that side of the glass; I&rsquo;ll come out.',
      { note: 'He comes out through the double door, pulling his mask down. His suit rustles like a crisp packet.' },
      'Last week the Commission asked me to look at the glove again. In 2006 we got four places out of ten. Last Thursday I got all ten, and more. The kits are far more sensitive now. They need far fewer cells.',
      { q: 'Is it Joel&rsquo;s glove?', a: 'Read it yourself, column by column. I&rsquo;ll only say this: the glove shares a number with Joel at every single place. All ten.' },
      { q: 'What does that mean?', a: 'Family, I thought. Joel has a younger brother, Gavin, who lives in Spain and does not answer emails. So I asked the parents. Irene and Glyn came in on Monday, both of them, before I&rsquo;d finished asking.' },
      { q: 'Why the parents?', a: 'Because a child gets one number at each place from the mother and one from the father. If the glove could be their child, it could be Gavin&rsquo;s. If it couldn&rsquo;t, it is nobody&rsquo;s in that family.' },
      'I think it&rsquo;s the brother. I&rsquo;d put money on the brother. Don&rsquo;t let me put money on anything. Check it.'
    ] });
  });
  CO.thing('#gillian', null, function () { return R.next ? '&ldquo;One in three thousand,&rdquo; says Dr Hesketh quietly. &ldquo;It was true. It just wasn&rsquo;t the question.&rdquo;' : '&ldquo;In 2006 we wanted a stain the size of a thumbnail,&rdquo; says Dr Hesketh. &ldquo;Now Dr Jalloh asks for a sneeze.&rdquo;'; }, R.isBusy);
  CO.thing('#judith', null, function () { return R.next ? '&ldquo;Twenty,&rdquo; says Mrs Grayling. &ldquo;I keep saying it to myself. Twenty.&rdquo;' : '&ldquo;Read Irene&rsquo;s note,&rdquo; says Mrs Grayling. &ldquo;She wrote it at our front desk, standing up.&rdquo;'; }, R.isBusy);

  var LOCI = ['D3', 'vWA', 'D16', 'D2', 'D8', 'D21', 'D18', 'D19', 'TH01', 'FGA'];
  var ROWS = [['Irene Garside (mother), swab of 2.11.26', [[15, 17], [16, 18], [11, 12], [19, 23], [13, 14], [29, 30], [13, 15], [13, 14], [6, 9], [21, 24]]],
    ['Glyn Garside (father), swab of 2.11.26', [[16, 16], [17, 19], [9, 13], [17, 20], [10, 13], [28, 31], [14, 17], [14, 15], [7, 8], [20, 22]]],
    ['FH/7 Joel Garside, swab of 2006', [[15, 16], [16, 17], [11, 13], [20, 23], [13, 13], [29, 31], [15, 17], [13, 14], [6, 7], [22, 24]]],
    ['FH/5 glove, as read in 2006', [[15, 16], [16, 17], null, null, [13, 13], null, null, null, [6, 7], null]],
    ['FH/5 glove, as read 29.10.26', [[15, 16], [16, 17], [11, 12], [17, 23], [13, 13], [30, 31], [17, 19], [14, 14], [6, 7], [20, 24]]]];
  var PRINT = '<h4>DNA unit &middot; Case G06/1187 &middot; profiles &middot; printed 4.11.26</h4><table><tr><th>Sample</th>' + LOCI.map(function (l) { return '<th>' + l + '</th>'; }).join('') + '</tr>' +
    ROWS.map(function (r) { return '<tr><td>' + r[0] + '</td>' + r[1].map(function (p) { return '<td>' + (p ? p[0] + ', ' + p[1] : '&ndash;') + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>' +
    '<p>Loci in full: D3S1358, vWA, D16S539, D2S1338, D8S1179, D21S11, D18S51, D19S433, TH01, FGA.</p>' +
    '<p>2006: the glove gave numbers at four loci only (too little DNA for more). Reported then: about 1 in 3,000 unrelated people would have the same numbers at those four. 2026: all loci read.</p>' +
    '<p>Note, H.J.: Gatherley in 2006 had about 60,000 people (council figures).</p>';
  $('#printer').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: PRINT, cls: 'printout', clue: { id: 'printout', title: 'The profiles, G06/1187', kind: 'DNA printout, 4 November 2026' }, done: function () {
      if (R.tell('printout')) ER.say('&ldquo;The light table has the same numbers, bigger,&rdquo; says Dr Jalloh. &ldquo;For people with eyes like mine.&rdquo;');
    } });
  });
  var NOTE = '<h4>For Dr Jalloh, by hand</h4><p>Dear Dr Jalloh,</p><p>Here are our swabs, as you asked, and anything else you need. Gavin was fourteen that November and in bed with chickenpox, if that is what you are wondering.</p>' +
    '<p>Joel was home by half past eleven that night, white as a sheet, and he told us the same story then that he has told ever since.</p><p>Thank you for looking.</p><p>Irene Garside</p>';
  $('#note').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: NOTE, cls: 'note', clue: { id: 'irene', title: 'Irene Garside&rsquo;s note', kind: 'Note, 2 November 2026' }, done: function () {
      if (R.tell('note')) ER.say('&ldquo;A mother&rsquo;s word,&rdquo; says Dr Hesketh. &ldquo;Which is worth exactly what it is worth. The numbers will tell us more.&rdquo;');
    } });
  });
  var DIAG = '<svg viewBox="0 0 270 250"><rect width="270" height="250" fill="#fff"/>' +
    '<text x="14" y="22" font-family="Barlow Condensed,sans-serif" font-size="13" fill="#3a3a3a">ONE LOCUS, ONE FAMILY</text>' +
    '<rect x="20" y="34" width="96" height="34" rx="4" fill="#fde2dc"/><text x="68" y="57" font-family="IBM Plex Mono,monospace" font-size="17" fill="#a8261c" text-anchor="middle">15, 17</text><text x="68" y="84" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#3a3a3a" text-anchor="middle">MOTHER</text>' +
    '<rect x="154" y="34" width="96" height="34" rx="4" fill="#dceafd"/><text x="202" y="57" font-family="IBM Plex Mono,monospace" font-size="17" fill="#1f4a8a" text-anchor="middle">16, 16</text><text x="202" y="84" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#3a3a3a" text-anchor="middle">FATHER</text>' +
    '<path d="M60 70l40 60M210 70l-40 60" stroke="#6a7a86" stroke-width="2"/>' +
    '<rect x="78" y="132" width="114" height="34" rx="4" fill="#e2f2ea"/><text x="135" y="155" font-family="IBM Plex Mono,monospace" font-size="17" fill="#1f6b5a" text-anchor="middle"><tspan fill="#a8261c">15</tspan>, <tspan fill="#1f4a8a">16</tspan></text><text x="135" y="182" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#3a3a3a" text-anchor="middle">CAN BE THEIR CHILD</text>' +
    '<rect x="78" y="196" width="114" height="34" rx="4" fill="#f2f2f2"/><text x="135" y="219" font-family="IBM Plex Mono,monospace" font-size="17" fill="#3a3a3a" text-anchor="middle"><tspan fill="#a8261c">15, 17</tspan> ✗</text><text x="135" y="245" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#3a3a3a" text-anchor="middle">CANNOT: NOTHING FROM THE FATHER</text></svg>';
  var MANUAL = '<h4>Laboratory Manual &middot; Section 8: DNA</h4><h3>DNA profiles in a family</h3><div class="two"><div>' +
    '<p>At certain places on our DNA, called <b>loci</b> (one <b>locus</b>), a short piece of code repeats again and again, like a word typed over and over. The number of repeats differs from person to person. At each locus you have two numbers, one from each parent, sometimes the same number twice. A <b>DNA profile</b> is the list of these pairs; a <b>reference sample</b> is one taken from a known person.</p>' +
    '<p><b>Can X be the child of A and B?</b> Go column by column: one of X&rsquo;s numbers must be in A&rsquo;s pair and the other in B&rsquo;s. Watch for a number that neither parent has, and for a pair whose two numbers both come from one parent. Very rarely a number changes by one between parent and child, so one failed column means &ldquo;look again&rdquo;; two mean &ldquo;not their child&rdquo;.</p></div>' + DIAG + '</div>' +
    '<p class="rule"><b>Match probability:</b> &ldquo;1 in 3,000&rdquo; means that about one unrelated person in 3,000 would share those numbers by chance, not the chance that somebody is innocent. Relatives match far more often.</p><p class="pg">8.3</p>';
  $('#manual').addEventListener('click', function () {

    } });
  });
  CO.thing('#analyser', null, 'The analyser measures how long each repeated piece of DNA is, and draws each length as a coloured peak. Every peak is a number in a profile.', R.isBusy);
  CO.thing('#board', null, 'The whiteboard, in Dr Jalloh&rsquo;s writing: 2006: 10 places, lots of cells. NOW: more places, a few cells. Underneath, in Mrs Grayling&rsquo;s writing: WHO HAS MY GOOD PEN?', R.isBusy);

  $('#table').addEventListener('click', function () {
    if (R.busy) return;
    if (R.next) { ER.say('Four checks, signed. Not Joel. Not a child of Irene and Glyn.'); return; }
    if (!R.ready()) {
      var miss = R.missing()[0];
      ER.say(({ hamza: '&ldquo;Talk to me first,&rdquo; says Dr Jalloh through the glass. &ldquo;I&rsquo;ve got a theory.&rdquo;', manual: '&ldquo;Read the manual page above the bench,&rdquo; says Dr Hesketh. &ldquo;Before the numbers.&rdquo;', note: '&ldquo;There&rsquo;s a note from Mrs Garside on the bench,&rdquo; says Mrs Grayling. &ldquo;Read it.&rdquo;', printout: '&ldquo;Take the printout off the printer first,&rdquo; says Dr Jalloh. &ldquo;It has the notes on it.&rdquo;' })[miss]);

    }
    if (!lt) lt = makeTable();

  });

  /* ---------- the light table: four checks, column by column ---------- */
  function canChild(c, m, f) { return (m.indexOf(c[0]) >= 0 && f.indexOf(c[1]) >= 0) || (m.indexOf(c[1]) >= 0 && f.indexOf(c[0]) >= 0); }
  function samePair(a, b) { return (a[0] === b[0] && a[1] === b[1]) || (a[0] === b[1] && a[1] === b[0]); }
  function makeTable() {
    var STEPS = ['a', 'b', 'c', 'd'], st = ER.flag('d-st') || { step: 0, mk: { a: [], b: [], c: [] }, n: 0 }, wait = false, X0 = 210, CW = 77;
    var TASK = {
      a: ['CHECK 1 OF 4', 'Can FH/7, the swab taken from Joel in 2006, be the child of Irene and Glyn? Mark every column where it cannot. If none fails, mark nothing.', [0, 1, 2]],
      b: ['CHECK 2 OF 4', 'In 2006 the glove matched FH/7 at four places. Now compare the glove as read in 2026 with FH/7: mark every column where the two pairs are not the same.', [2, 4]],
      c: ['CHECK 3 OF 4', 'Dr Jalloh thinks the glove could be Joel&rsquo;s brother&rsquo;s. Can the glove, as read in 2026, be the child of Irene and Glyn? Mark every column where it cannot.', [0, 1, 4]],
      d: ['CHECK 4 OF 4', 'In 2006 the court heard that about one unrelated person in 3,000 would match at those four places. Gatherley had about 60,000 people. How many people in Gatherley would you expect to match?', [3]]
    };
    var box = ER.el('div', 'bn lt', '<svg viewBox="0 0 1000 600"><g id="body"></g></svg><div class="bn-foot"><p class="bmsg"></p><button type="button" class="btn" id="p-go">Sign this check</button></div>');
    var svg = box.querySelector('svg'), msgEl = box.querySelector('.bmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('d-st', st); }
    function cur() { return STEPS[st.step]; }
    function wrapText(t, n) { var w = t.replace(/&rsquo;/g, '’').split(' '), out = [''], i; for (i = 0; i < w.length; i++) { if ((out[out.length - 1] + ' ' + w[i]).trim().length > n) out.push(''); out[out.length - 1] = (out[out.length - 1] + ' ' + w[i]).trim(); } return out; }
    function draw() {
      var s = '<rect width="1000" height="600" fill="#eef6fa"/><rect x="12" y="12" width="976" height="336" rx="6" fill="#ffffff" stroke="#9aa8b2"/>', k = cur(), T = TASK[k];
      s += '<text x="26" y="40" class="tB" font-size="15" fill="#1f6b5a" letter-spacing="3">LIGHT TABLE</text>';
      LOCI.forEach(function (l, i) { s += '<text x="' + (X0 + i * CW + CW / 2) + '" y="40" class="tM" font-size="14" fill="#1a2630" text-anchor="middle">' + l + '</text>'; });
      ROWS.forEach(function (r, j) {
        var y = 52 + j * 46, on = T[2].indexOf(j) >= 0;
        s += '<g opacity="' + (on ? 1 : 0.32) + '"><rect x="20" y="' + y + '" width="960" height="40" rx="3" fill="' + (on ? '#f4fbf8' : '#f6f8fa') + '"/><text x="28" y="' + (y + 25) + '" class="tB" font-size="14" fill="#1a2630">' + r[0] + '</text>';
        r[1].forEach(function (p, i) { s += '<text x="' + (X0 + i * CW + CW / 2) + '" y="' + (y + 26) + '" class="tM" font-size="17" fill="#1a2630" text-anchor="middle">' + (p ? p[0] + ', ' + p[1] : '–') + '</text>'; });
        s += '</g>';
      });
      s += '<path d="M' + X0 + ' 48V286" stroke="#cfd8de"/>';
      LOCI.forEach(function (l, i) { s += '<path d="M' + (X0 + (i + 1) * CW) + ' 48V286" stroke="#e2e8ec"/>'; });
      /* the pencil marks */
      if (k !== 'd') {
        s += '<text x="28" y="320" class="tB" font-size="14" fill="#a8261c" letter-spacing="2">YOUR MARKS</text>';
        LOCI.forEach(function (l, i) { var on = st.mk[k].indexOf(i) >= 0; s += '<g class="cm tg' + (on ? ' on' : '') + '" data-c="' + i + '"><rect x="' + (X0 + i * CW + 8) + '" y="298" width="' + (CW - 16) + '" height="38" rx="4"/><text x="' + (X0 + i * CW + CW / 2) + '" y="325" class="tK" font-size="22" fill="#a8261c" text-anchor="middle">' + (on ? '✗' : '') + '</text></g>'; });
      }
      /* the task */
      s += '<rect x="12" y="360" width="976" height="228" rx="6" fill="#1a2630"/><text x="30" y="390" class="tB" font-size="15" fill="#7fd3c0" letter-spacing="3">' + T[0] + '</text>';
      STEPS.forEach(function (q, i) { s += '<circle cx="' + (860 + i * 30) + '" cy="384" r="9" fill="' + (i < st.step ? '#7fd3c0' : i === st.step ? '#f4fbff' : '#3a4a56') + '"/>'; });
      wrapText(T[1], 92).forEach(function (l, i) { s += '<text x="30" y="' + (424 + i * 28) + '" class="tG" font-size="21" fill="#f4fbff">' + l + '</text>'; });
      if (k === 'd') {
        [['-10', 520], ['-1', 580]].forEach(function (b) { s += '<g class="bt tg" data-b="' + b[0] + '"><rect x="' + b[1] + '" y="510" width="50" height="40" rx="4"/><text x="' + (b[1] + 25) + '" y="537" class="tB" font-size="18" fill="#1a2630" text-anchor="middle">' + b[0].replace('-', '−') + '</text></g>'; });
        s += '<rect x="640" y="506" width="90" height="48" rx="4" fill="#ffffff"/><text x="685" y="540" class="tM" font-size="26" fill="#1a2630" text-anchor="middle">' + st.n + '</text>';
        [['+1', 740], ['+10', 800]].forEach(function (b) { s += '<g class="bt tg" data-b="' + b[0] + '"><rect x="' + b[1] + '" y="510" width="50" height="40" rx="4"/><text x="' + (b[1] + 25) + '" y="537" class="tB" font-size="18" fill="#1a2630" text-anchor="middle">' + b[0] + '</text></g>'; });
        s += '<text x="30" y="537" class="tG" font-size="19" fill="#c9d8e0">People in Gatherley expected to match:</text>';
      }
      svg.querySelector('#body').innerHTML = s;
    }
    svg.addEventListener('click', function (e) {
      if (wait || R.next) return;
      var c = e.target.closest('.cm'), b = e.target.closest('.bt'), k = cur();
      if (c && k !== 'd') { var i = +c.getAttribute('data-c'), a = st.mk[k], at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i); CO.sfx.pen(); keep(); draw(); msg(at >= 0 ? LOCI[i] + ': mark rubbed out.' : LOCI[i] + ': marked.'); return; }
      if (b && k === 'd') { st.n = CO.clamp(st.n + parseInt(b.getAttribute('data-b'), 10), 0, 999); CO.sfx.click(); keep(); draw(); }
    });
    function cand(k) { var a = st.mk[k].slice().sort(function (p, q) { return p - q; }); return a.length ? a.join('') : 'none'; }
    function why(k) {
      var a = st.mk[k], i, M = ROWS[0][1], F = ROWS[1][1], C = ROWS[k === 'a' ? 2 : 4][1], who = k === 'a' ? 'FH/7' : 'the glove';
      if (k === 'b') {
        for (i = 0; i < 10; i++) if (a.indexOf(i) >= 0 && samePair(ROWS[2][1][i], ROWS[4][1][i])) return 'At ' + LOCI[i] + ' the two pairs are the same: ' + ROWS[2][1][i].join(', ') + '. Rub that mark out.';
        return 'Some columns where the pairs are not the same are still unmarked. Compare every column, both numbers.';
      }
      for (i = 0; i < 10; i++) if (a.indexOf(i) >= 0 && canChild(C[i], M[i], F[i])) {
        var c = C[i], m = M[i].indexOf(c[0]) >= 0 && F[i].indexOf(c[1]) >= 0 ? [c[0], c[1]] : [c[1], c[0]];
        return 'At ' + LOCI[i] + ', ' + who + ' has ' + c[0] + ' and ' + c[1] + '. ' + m[0] + ' is in Irene&rsquo;s pair and ' + m[1] + ' is in Glyn&rsquo;s: one from each. That column is fine.';
      }
      return 'A column that fails is still unmarked. Look for a number that neither parent has, and for a pair whose two numbers could only come from the same parent.';
    }
    box.querySelector('#p-go').addEventListener('click', function () {
      if (wait || R.next) return;
      var k = cur();
      if (k !== 'd') {
        if (!ER.check(k, cand(k))) { ER.sfx.no(); msg(why(k)); return; }
        st.step++; keep(); CO.sfx.stamp(); draw();
        msg({ a: '<b>Check 1 signed.</b> FH/7 can be the child of Irene and Glyn at every locus: the 2006 swab is the Garsides&rsquo; son&rsquo;s, as its label says.', b: '<b>Check 2 signed.</b> The same at the four places read in 2006; different at six of the ten. The glove is not Joel&rsquo;s.', c: '<b>Check 3 signed.</b> Two columns fail. The glove cannot be a child of Irene and Glyn, so it cannot be Gavin&rsquo;s.' }[k]);
        return;
      }
      if (!ER.check('d', String(st.n))) { ER.sfx.no(); msg(st.n === 1 ? '&ldquo;One in 3,000 doesn&rsquo;t mean one person,&rdquo; says Dr Jalloh. &ldquo;It means one in every 3,000. How many lots of 3,000 are there in Gatherley?&rdquo;' : '&ldquo;Sixty thousand people,&rdquo; says Mrs Grayling, &ldquo;and about one in every three thousand would match by chance. Count them.&rdquo;'); return; }
      var file = ER.exitOk(['none-' + cand('b') + '-' + cand('c') + '-' + st.n]);
      if (!file) { ER.sfx.no(); msg('Dr Jalloh reads the sheet twice and does not sign it.'); return; }
      wait = true; R.solve(file); CO.sfx.stamp();
      msg('<b>Not Joel. Not his brother. Twenty people.</b> Dr Jalloh signs the last check.');
      CO.mine('dna', 'What the DNA says', '<p>FH/7 (Joel&rsquo;s swab of 2006) can be the child of Irene and Glyn at every locus.</p><p>The glove matched Joel at the four loci read in 2006, but as read in 2026 it differs from him at six of the ten: it is not his glove.</p><p>It cannot be a child of Irene and Glyn: at D16 both its numbers (11, 12) could only come from Irene; at D18 it has a 19 that neither parent has. So it is not his brother Gavin&rsquo;s.</p><p>1 in 3,000, in a town of 60,000: about 20 people would match at those four places.</p>');
      setTimeout(function () {
        ER.closeAll(); CO.solved(); R.busy = true;
        ER.narrate([
          '&ldquo;Not Joel,&rdquo; says Dr Jalloh. &ldquo;Six places out of ten say so. And not a child of Irene and Glyn. At D16 both of the glove&rsquo;s numbers could only have come from Irene, and at D18 it has a 19 that neither of them has. Two columns. Not the brother.&rdquo; He looks almost sorry. &ldquo;I&rsquo;d have lost my money.&rdquo;',
          '&ldquo;Twenty,&rdquo; says Mrs Grayling. &ldquo;Twenty people in Gatherley in 2006 could have matched those four places. The jury heard one in three thousand and thought it meant one.&rdquo;',
          'Dr Hesketh has been very still. &ldquo;I said one in three thousand,&rdquo; she says. &ldquo;I never said it was him.&rdquo; &ldquo;No,&rdquo; says Mrs Grayling, gently. &ldquo;And nobody stood up and said what it did mean.&rdquo;',
          '&ldquo;With the Commission&rsquo;s agreement, the full profile can be searched against the national database,&rdquo; says Dr Jalloh. &ldquo;But a profile doesn&rsquo;t say when a glove was in a yard. Glass might.&rdquo;',
          '&ldquo;Then we need the 2006 file,&rdquo; says Mrs Grayling, &ldquo;all of it, and Dr Hesketh&rsquo;s report. The records office. Bring your coat: the heating went off at midnight.&rdquo;'
        ], function () { R.busy = false; R.go(); });
      }, 2400);
    });
    draw();
    msg('Five rows of numbers, ten loci. Click a column&rsquo;s box to mark it; click again to rub the mark out.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; }, step: cur };
  }
})();
</script>

</html>
