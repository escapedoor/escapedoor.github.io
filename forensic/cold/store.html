<style>
  body{--bg:#101410;--accent:#e8c26a;--font-display:'Stardos Stencil',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(22,26,22,.96);--tc-ink:#ece6d4;--cap-bg:rgba(20,24,20,.94);--panel:#1d221d;--face-bg:#3a2e24;--q-ink:#e8c26a;--fade:#060806;--hud-bg:rgba(20,24,20,.86)}
  .tc-room{font-family:'Stardos Stencil',serif;font-weight:700;letter-spacing:.06em;font-size:clamp(36px,5vw,66px)}
  .tk-name{font-family:'Stardos Stencil',serif;font-weight:700;letter-spacing:.04em}
  .tube{animation:tube 7s steps(1,end) infinite}
  @keyframes tube{0%{opacity:1}61%{opacity:1}62%{opacity:.25}63%{opacity:1}65%{opacity:.4}66%{opacity:1}}
  .burst{opacity:0}
  .burst.on{animation:burst 2.2s steps(6,end) forwards}
  @keyframes burst{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
  .flash{opacity:0}
  .flash.on{animation:flash 1.6s steps(4,end) forwards}
  @keyframes flash{0%{opacity:0}20%{opacity:.16}100%{opacity:0}}

  /* the signing-out desk */
  .cu{width:min(1080px,96vw)}
  .cu-desk{display:grid;grid-template-columns:230px 1fr;gap:14px;background:#5a4632 linear-gradient(160deg,#6a5238,#3e2f20);padding:14px;border-radius:4px;box-shadow:0 26px 70px rgba(0,0,0,.7);
    max-height:calc(100vh - 220px);overflow:auto}
  .cu-bags{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
  .cubag{position:relative;padding:4px 4px 6px;border:2px solid transparent;border-radius:4px;background:rgba(0,0,0,.18);cursor:pointer;color:#f2e6c4;font-family:'Barlow Condensed',sans-serif}
  .cubag svg{display:block;width:100%;height:auto}
  .cubag.on{border-color:#e8c26a;background:rgba(232,194,106,.16)}
  .cubag .st{display:block;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;min-height:16px}
  .cubag .st.c{color:#9fe0b2}.cubag .st.q{color:#ffb09a}
  .cu-label{min-height:300px}
  .cu-label .tag-rows tr.row{cursor:pointer}
  .cu-label .tag-rows tr.row:hover td{background:rgba(255,255,255,.22)}
  .cu-label .tag-rows tr.q td{background:rgba(179,38,42,.18)}
  .cu-label .tag-rows tr.q td.n:before{content:'?';position:absolute;margin-left:-16px;font-family:'Permanent Marker',cursive;font-size:20px;color:#a8261c;line-height:16px}
  .cu-tools{display:flex;gap:10px;align-items:center;margin-top:10px}
  .cu-tools .btn{--accent:#f2e6c4;color:#2a2010;background:#f2e6c4;font-size:15px;padding:6px 14px}
  .cu-tools .btn:hover{background:#e8c26a;color:#2a2010}
  .cu-tools span{font-family:'Patrick Hand',cursive;font-size:17px;color:#f2e6c4}
</style>
</head>

<script>
(function () {
  var $ = ER.$, R = null, desk = null;

  /* ---------- drawing ---------- */
  (function () {
    var s = '', i, j, r = CO.rnd(41);
    for (i = 0; i < 12; i++) s += '<path d="M-1000 ' + (60 + i * 34) + 'H2600"/>';
    $('#bricks').innerHTML = s;
    /* five rack units, four shelves each, boxes with labels */
    s = '';
    for (i = 0; i < 4; i++) {
      var x = 450 + i * 220;
      s += '<rect x="' + x + '" y="150" width="200" height="520" fill="#3a403a" opacity=".25"/>';
      for (j = 0; j < 4; j++) {
        var y = 250 + j * 112, bx = x + 6, n = 0;
        while (bx < x + 190 && n < 5) {
          var w = 30 + Math.round(r() * 22); if (bx + w > x + 194) break;
          var h = 64 + Math.round(r() * 30), c = ['#9a7448', '#8a6a42', '#a07c50', '#7e6040'][Math.floor(r() * 4)];
          s += '<rect x="' + bx + '" y="' + (y - h) + '" width="' + (w - 3) + '" height="' + h + '" fill="' + c + '"/><rect x="' + (bx + 5) + '" y="' + (y - h + 12) + '" width="' + (w - 13) + '" height="12" fill="#efe8d4"/>';
          bx += w; n++;
        }
        s += '<rect x="' + x + '" y="' + y + '" width="200" height="8" fill="#7a8278"/>';
      }
      s += '<path d="M' + (x + 3) + ' 150V680M' + (x + 197) + ' 150V680" stroke="#6a7068" stroke-width="7"/>';
      s += '<rect x="' + (x + 70) + '" y="156" width="60" height="22" fill="#2a2e2a"/><text x="' + (x + 100) + '" y="172" class="tB" font-size="15" fill="#e9e4d0" text-anchor="middle" letter-spacing="2">BAY ' + (i + 1) + '</text>';
    }
    $('#racks').innerHTML = s;
    s = ''; for (i = 0; i < 26; i++) s += '<path d="M' + (1390 + i * 16) + ' 150l-200 520M' + (1390 + i * 16 - 200) + ' 150l200 520"/>';
    $('#mesh').innerHTML = '<clipPath id="cageC"><rect x="1390" y="150" width="200" height="520"/></clipPath><g clip-path="url(#cageC)">' + s + '</g>';
    s = ''; for (i = 0; i < 6; i++) s += '<g transform="translate(' + (782 + i * 36) + ' 548)"><path d="M0 40V4l6 -6h18l6 6v36z" fill="' + ['#c9a46a', '#bf9a60', '#c4a066'][i % 3] + '"/><rect x="4" y="12" width="22" height="9" fill="#efe8d4"/><rect x="12" y="-2" width="6" height="8" fill="#b3262a"/></g>';
    $('#bagrow').innerHTML = s;
    $('#judith').innerHTML = CO.fig('judith');
  })();

  ER.init({
    theme: 'forensic', story: 'cold', storyTitle: 'Under Seal', id: 'store', no: 'I', title: 'The Exhibit Store',
    go: 'Down the stairs',
    intro: [
      'Wednesday 4 November 2026, twenty to ten at night. Somewhere above the Laboratory, the town of Gatherley is letting off its fireworks a day early.',
      'You are the newest person at the Laboratory: three weeks in, a pass that still opens the wrong doors, and a lab coat with the creases from the packet. At six o&rsquo;clock Mrs Grayling, who runs the exhibit store in the basement, asked whether you would stay late. &ldquo;A case from 2006,&rdquo; she said. &ldquo;Somebody wants to know if we got it wrong.&rdquo;',
      'The store is under the street. It is cold all year round, which is good for evidence and bad for people.'
    ],
    exit: {"next":"bench","w":{"188ad9d0":"8165ab8b"}}, tags: {"b2":["4df753ce"],"b3":["3c14e153"],"b4":["b7c7fbad"],"b5":["55a3c43f"],"b6":["deccc2a8"],"b7":["1aa70991"]},
    hints: hints, onBegin: begin
  });

  R = CO.room({ id: 'a', need: ['judith', 'letter', 'file', 'list', 'manual'], lock: '#bags' });

  function hints() {
    if (R.next) return ['go', ['The bags are signed. Up to the glass bench: the button at the bottom.']];
    if (desk && desk.isOpen()) return ['desk', [
      'Click a bag to read its label. Each line must begin with the person who received it on the line before. Then stamp the label CLEAR, or click the one line where the chain breaks.',
      'Some things look odd and are allowed: a time crossed out once and initialled by the person who wrote it; twenty years in the store (the store had it all along); a torn corner taped and signed across the tape. Look for a line where nobody handed the bag over, and a seal on the bag that the label never mentions.',
      'Five labels are clear. One bag came back from Photographic on 9 November 2006 with an empty &ldquo;Handed over by&rdquo; box, and it carries a seal that is not on its label. Pencil that line; stamp the other five CLEAR.'
    ]];
    if (!R.ready()) return ['look', [
      'Five things before the bags: one person and four papers (the pips count them).',
      'Mrs Grayling by the filing cabinet. The letter on the desk. The old box on the trolley (the case file). PC Holroyd&rsquo;s list, on the clipboard hanging from the trolley. The manual page pinned to the pillar by the cage.'
    ]];
    return ['bags', ['Everything is read. Click the tray of bags on the desk.']];
  }

  var fwT = 0;
  function fireworks() {
    clearTimeout(fwT);
    fwT = setTimeout(function () {
      if (!R.busy && !ER.isOpen()) {
        var c = ['#ff5a4a', '#7aff8a', '#ffd34a', '#7ab4ff', '#ff8ae0'][Math.floor(Math.random() * 5)], x = 160 + Math.random() * 220, y = 92 + Math.random() * 30, s = '', i;
        for (i = 0; i < 12; i++) { var a = i * Math.PI / 6; s += '<path d="M' + x + ' ' + y + 'l' + (Math.cos(a) * 26).toFixed(1) + ' ' + (Math.sin(a) * 26).toFixed(1) + '" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/>'; }
        $('#sky').innerHTML = '<g class="burst" style="transform-origin:' + x.toFixed(0) + 'px ' + y.toFixed(0) + 'px">' + s + '</g>';
        var b = $('#sky .burst'); void b.getBoundingClientRect(); b.classList.add('on');
        var f = $('#flash'); f.setAttribute('fill', c); f.classList.remove('on'); void f.getBoundingClientRect(); f.classList.add('on');
        CO.sfx.bang();
      }
      fireworks();
    }, 9000 + Math.random() * 9000);
  }

  function begin() {
    R.paint(); fireworks();
    if (R.next) { R.busy = false; R.go(); ER.say('The six bags are signed for. FH/4 has a question on line 6.'); return; }
    if (R.told('in')) { R.busy = false; ER.say('The store. The tube light blinks.'); return; }
    R.tell('in');
    ER.narrate([
      'The store runs the length of the building: grey racks, brown boxes, white labels, twenty thousand of them, and a wire cage at the end for things that must be locked up. A tube light buzzes and blinks. Through the grating at street level the sky goes red, then green, then dark.',
      'On the desk there is a tray of six paper evidence bags. On the trolley beside it stands an old brown box: G06/1187, R v GARSIDE.',
      'Mrs Grayling is filling the kettle. &ldquo;Twenty years ago tonight,&rdquo; she says, without turning round. &ldquo;Give or take a firework.&rdquo;'
    ], function () { R.busy = false; R.paint(); });
  }

  /* ---------- the person ---------- */
  function seen(k) { return function (ok) { if (ok) R.tell(k); }; }
  $('#judith').addEventListener('click', function () {
    if (R.busy) return;
    if (R.next) { ER.say('&ldquo;Line 6,&rdquo; says Mrs Grayling. &ldquo;My signature, and nobody else&rsquo;s. Go on up. I&rsquo;ll bring the bag.&rdquo;'); return; }
    ER.talk({ who: 'Mrs Judith Grayling', role: 'Store Manager, the Laboratory', face: FACE('judith'), clue: { id: 'judith1', title: 'Mrs Grayling: twenty years ago tonight', kind: 'Statement' }, done: seen('judith'), lines: [
      'Twenty years ago tonight, give or take a firework. I was a clerk down here then. Thirty-two, and in a hurry about everything.',
      { q: 'What does the Commission want?', a: 'Six bags from case G06/1187, checked, and a statement of where each one has been since 2006. Their courier comes at seven in the morning. They are not people you keep waiting.' },
      { q: 'What is the Commission?', a: 'The Criminal Cases Review Commission. They look again at cases where somebody may have been wrongly convicted. If they think a court should look again too, they can send the case back to the Court of Appeal.' },
      { q: 'Who was convicted?', a: 'A boy called Joel Garside. Nineteen. A burglary at a jeweller&rsquo;s on Fore Street. He went to prison saying he hadn&rsquo;t done it, and he came out saying the same thing.' },
      { q: 'Where are the bags?', a: 'In the tray on the desk, where I put them at six. Nothing has been opened. Nothing gets opened until the labels have been read.' },
      { note: 'She nods at the cactus on the filing cabinet. It has an exhibit label tied round its pot.' },
      'Read a label the way you read a bus timetable, love. Every stop, and who got on.',
      { q: 'Is anybody else coming?', a: 'I rang Dr Hesketh. She did the glass and the fibres in 2006. She is seventy-four, she lives ten minutes away, and she would never have forgiven me if I hadn&rsquo;t.' }
    ] });
  });

  /* ---------- papers ---------- */
  var LETTER = '<h4>Criminal Cases Review Commission</h4><p class="addr">To the Store Manager, the Laboratory, Gatherley &middot; Monday 2 November 2026 &middot; Our reference 26/0418</p>' +
    '<p>Dear Mrs Grayling,</p><p><b>Joel Garside: convicted of burglary, May 2007</b></p>' +
    '<p>The Commission is looking again at this conviction. Please find exhibits FH/2 to FH/7 of your case G06/1187, check each one and its continuity, and give them to our courier, who will call at 7.00 a.m. on Thursday 5 November.</p>' +
    '<p>Please send Dr Jalloh&rsquo;s new DNA results for FH/5 and FH/7 with them, and a short statement of anything you find. If any of the 2006 findings can no longer be relied on, we would rather know now than later.</p>' +
    '<p>Yours sincerely,</p><p class="sig">G. Inglis</p><p>Gregor Inglis, Case Review Manager</p>';
  $('#letter').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: LETTER, cls: 'official', clue: { id: 'letter', title: 'The Commission&rsquo;s letter', kind: 'Letter, 2 November 2026' }, done: function () {
      if (R.tell('letter')) ER.say('&ldquo;Seven o&rsquo;clock,&rdquo; says Mrs Grayling. &ldquo;I&rsquo;ve put the kettle on for a long night.&rdquo;');
    } });
  });
  var FILE = '<h4>R v Joel Garside &middot; Laboratory case G06/1187</h4>' +
    '<p>BURGLARY. Iveson&rsquo;s, jewellers, 14 Fore Street, Gatherley. Night of Saturday 4 November 2006.</p>' +
    '<p>Watches and rings worth about £19,000 taken from the back room. Entry from the yard by the rear door, whose glass panel was broken.</p>' +
    '<p>At about 11.20 p.m. Mrs G. Jessop of 16 Fore Street heard glass break and saw a young man in a red jumper run out of the yard. She knew him: Joel Garside, aged 19.</p>' +
    '<p>Mr Garside said the glass was already broken when he got there. He said he knocked on it and shouted, and ran because somebody was inside with a torch.</p>' +
    '<p>Laboratory findings (Dr G. Hesketh; DNA, Dr J. Hirst): the panel was broken by a single blow from the yard side. Red wool fibres on the glass, and on a glove found in the yard, matched his jumper. A partial DNA profile from the glove matched him.</p>' +
    '<p>Verdict: guilty. Crown Court, Friday 18 May 2007.</p><p class="stampb">FILE CLOSED</p>';
  $('#box').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: FILE, cls: 'file', clue: { id: 'file', title: 'R v Garside: the case in short', kind: 'From the 2006 file' }, done: function () {
      if (R.tell('file')) ER.say('&ldquo;A single blow,&rdquo; says Mrs Grayling. &ldquo;That was the whole case, really. One blow, one boy, one jumper.&rdquo;');
    } });
  });
  var LIST = '<h4>Gatherley Police &middot; Exhibits &middot; PC 2271 F. Holroyd</h4><p>Iveson&rsquo;s, 14 Fore Street: rear yard and rear door. Sunday 5 November 2006.</p><table>' +
    '<tr><th>Ref.</th><th>What</th><th>Time</th></tr>' +
    '<tr><td>FH/1</td><td>Photographs of the scene, taken by the scenes of crime officer (negatives to the Laboratory)</td><td>00.50</td></tr>' +
    '<tr><td>FH/2</td><td>Tape lifts from the door glass, lower part, by the latch (both faces)</td><td>01.10</td></tr>' +
    '<tr><td>FH/3</td><td>Tape lifts from the door glass, upper part (both faces)</td><td>01.20</td></tr>' +
    '<tr><td>FH/4</td><td>Glass panel of the rear door, removed whole. 38 × 52 cm. Sticker on the yard side: NO CASH KEPT ON THESE PREMISES. Yard side marked S1</td><td>01.40</td></tr>' +
    '<tr><td>FH/5</td><td>Glove, black, knitted, left hand. By the bins in the yard</td><td>01.50</td></tr>' +
    '<tr><td>FH/6</td><td>Jumper, red wool. From Joel Garside, 21 Harcourt Road</td><td>14.20</td></tr>' +
    '<tr><td>FH/7</td><td>Mouth swab, Joel Garside, with his consent, at the police station</td><td>15.05</td></tr></table>' +
    '<p class="hw">Panel measured while still in the door, then taped so it would not fall apart, then taken out. F.H.</p>';
  $('#list').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: LIST, cls: 'ledger', clue: { id: 'list', title: 'PC Holroyd&rsquo;s list of exhibits', kind: 'Police list, 5 November 2006' }, done: function () {
      if (R.tell('list')) ER.say('&ldquo;Faith Holroyd,&rdquo; says Mrs Grayling. &ldquo;She measured everything twice and wrote it down three times. Lovely handwriting.&rdquo;');
    } });
  });
  var DIAG = '<svg viewBox="0 0 270 250"><rect width="270" height="250" fill="#fff"/>' +
    '<rect x="16" y="14" width="238" height="222" rx="8" fill="#e4cf9a"/><circle cx="34" cy="34" r="7" fill="#2a2010"/>' +
    '<text x="56" y="40" font-family="Stardos Stencil,serif" font-weight="700" font-size="17" fill="#2a2010">EXHIBIT XY/1</text>' +
    [['Person 1', 'Person 2', 72], ['Person 2', 'Person 3', 122], ['Person 3', 'Person 4', 172]].map(function (r) {
      return '<text x="30" y="' + r[2] + '" font-family="Caveat,cursive" font-size="20" fill="#1d2a66">' + r[0] + '</text><text x="40" y="' + (r[2] + 18) + '" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#5a4a2a">HANDED OVER BY</text>' +
        '<text x="150" y="' + r[2] + '" font-family="Caveat,cursive" font-size="20" fill="#1d2a66">' + r[1] + '</text><text x="152" y="' + (r[2] + 18) + '" font-family="Barlow Condensed,sans-serif" font-size="12" fill="#5a4a2a">RECEIVED BY</text>';
    }).join('') +
    '<path d="M196 78q34 10 -110 30" stroke="#a8261c" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M196 128q34 10 -110 30" stroke="#a8261c" stroke-width="2" fill="none" marker-end="url(#ah)"/>' +
    '<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8261c"/></marker></defs>' +
    '<rect x="30" y="206" width="56" height="16" fill="#b3262a"/><text x="58" y="218" font-family="IBM Plex Mono,monospace" font-size="11" fill="#fff" text-anchor="middle">01234</text>' +
    '<text x="96" y="219" font-family="Barlow Condensed,sans-serif" font-size="13" fill="#2a2010">every seal on the label</text></svg>';
  var MANUAL = '<h4>Laboratory Manual &middot; Section 2: Exhibits</h4><h3>Continuity: the chain of custody</h3><div class="two"><div>' +
    '<p>An <b>exhibit</b> is anything kept as evidence. Its <b>continuity</b> label travels with it, and everyone who has it signs: who handed it over, who received it, when, and why. Together the lines make the <b>chain of custody</b>.</p>' +
    '<p>Read a label line by line. Each line must begin with the person who received it on the line before. A long time in the store is not a gap; a missing signature is. A correction is allowed if it is crossed out once and initialled.</p></div>' + DIAG + '</div>' +
    '<p>Every bag is closed with a numbered <b>seal</b>, which tears if the bag is opened. To open a bag, cut it somewhere else, keep the old seal, close the cut with a new one and write its number on the label: every seal on the bag must be on the label.</p>' +
    '<p class="rule">A <b>gap</b> does not prove that anything went wrong. It means nobody can say what happened, and a court may give the exhibit less weight, or none.</p><p class="pg">2.4</p>';
  $('#manual').addEventListener('click', function () {
    if (R.busy) return;
    ER.read({ html: MANUAL, cls: 'manual', clue: { id: 'manual24', title: 'Continuity: the chain of custody', kind: 'Laboratory Manual, 2.4' }, done: function () {
      CO.terms(['exhibit', 'continuity', 'chain of custody', 'seal', 'gap']);
      if (R.tell('manual')) ER.say('&ldquo;I wrote half of that page,&rdquo; says Mrs Grayling. &ldquo;After 2006, as it happens.&rdquo;');
    } });
  });
  CO.thing('#window', null, 'Through the grating: feet going past, and a rocket that bursts green over the roofs. Bonfire Night is tomorrow. Gatherley never waits.', R.isBusy);
  CO.thing('#clock', null, function () { return R.next ? 'Twenty past ten. The courier comes at seven.' : 'Twenty to ten. The courier comes at seven.'; }, R.isBusy);
  CO.thing('#cactus', null, 'A cactus in a pot, with an exhibit label tied round it: GR/1. CACTUS, ONE. PRICKLY. RECEIVED 1999. Mrs Grayling waters it on the first of every month, and signs for it.', R.isBusy);
  CO.thing('#cage', null, 'The cage: wire mesh, a padlock, AUTHORISED STAFF ONLY. Inside, a long parcel that might be a painting, and a shoebox marked JEWELLERY, RETURNED 2011.', R.isBusy);
  CO.thing('#racks', null, 'Rack after rack: 2004, 2005, 2006. The oldest boxes are at the far end, in Bay Eleven, where the lights have not worked since 2019.', R.isBusy);

  /* ---------- the signing-out desk ---------- */
  $('#bags').addEventListener('click', function () {
    if (R.busy) return;
    if (R.next) { ER.say('Five labels stamped CLEAR, and a pencilled question on line 6 of FH/4.'); return; }
    if (!R.ready()) {
      var miss = R.missing()[0];
      ER.say('&ldquo;Not yet,&rdquo; says Mrs Grayling. &ldquo;' + ({ judith: 'Talk to me first. I was down here in 2006, and the boxes can&rsquo;t talk.', letter: 'Read the letter on the desk. It says what they want.', file: 'Read the file on the trolley. You need to know what the case was.', list: 'PC Holroyd&rsquo;s list, on the clipboard on the trolley. What was taken, and when.', manual: 'Read the manual page on the pillar. Then you&rsquo;ll know what a gap is.' })[miss] + '&rdquo;');
      return;
    }
    if (!desk) desk = makeDesk();
    desk.open();
  });

  function bagSVG(ref, seals) {
    var s = '<svg viewBox="0 0 100 92"><path d="M10 88V14l8 -8h64l8 8v74z" fill="#c9a46a"/><path d="M10 14h80" stroke="#a8844a" stroke-width="2"/>' +
      '<rect x="18" y="22" width="64" height="26" fill="#efe8d4"/><text x="50" y="41" text-anchor="middle" font-family="Stardos Stencil,serif" font-weight="700" font-size="17" fill="#2a2010">' + ref + '</text>';
    seals.forEach(function (n, i) { var wd = n.length > 5 ? 72 : 34; s += '<rect x="' + (14 + (i % 2) * 38) + '" y="' + (56 + Math.floor(i / 2) * 15) + '" width="' + wd + '" height="11" fill="#b3262a"/><text x="' + (14 + (i % 2) * 38 + wd / 2) + '" y="' + (65 + Math.floor(i / 2) * 15) + '" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#fff">' + n + '</text>'; });
    return s + '</svg>';
  }
  function makeDesk() {
    var st = ER.flag('a-st') || { sel: 'FH/2', m: {} }, wait = false, ORD = CO.LABEL_ORDER;
    var box = ER.el('div', 'bn cu', '<div class="cu-desk"><div class="cu-bags"></div><div><div class="cu-label tagcard"></div><div class="cu-tools"><button type="button" class="btn" id="u-clear">Stamp CLEAR</button><span>or click the one line where the chain breaks</span></div></div></div>' +
      '<div class="bn-foot"><p class="bmsg"></p><button type="button" class="btn" id="u-go">Sign the continuity sheet</button></div>');
    var bagsEl = box.querySelector('.cu-bags'), lab = box.querySelector('.cu-label'), msgEl = box.querySelector('.bmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('a-st', st); }
    function fileLabel(ref) {                         /* every label read goes into the notebook, for later rooms */
      var isNew = ER.addClue('label-' + ref, 'Continuity label ' + ref, CO.label(ref), 'tag', 'Continuity label', true);
      if (isNew && !ER.flag('a-told-labels')) { ER.flag('a-told-labels', 1); ER.toast('Each label you read goes into your notebook'); }
    }
    function stText(v) { return v === 'c' ? '<span class="st c">clear</span>' : v ? '<span class="st q">? line ' + v + '</span>' : '<span class="st">not read</span>'; }
    function draw() {
      bagsEl.innerHTML = ORD.map(function (ref) { return '<div class="cubag' + (st.sel === ref ? ' on' : '') + '" data-ref="' + ref + '">' + bagSVG(ref, CO.LABELS[ref].bag) + stText(st.m[ref]) + '</div>'; }).join('');
      var v = st.m[st.sel];
      lab.innerHTML = ER.gloss(CO.label(st.sel, { mark: typeof v === 'number' ? v : 0, clear: v === 'c' }));
    }
    bagsEl.addEventListener('click', function (e) {
      var b = e.target.closest('.cubag'); if (!b || wait) return;
      st.sel = b.getAttribute('data-ref'); keep(); CO.sfx.rustle(); draw(); fileLabel(st.sel);
      msg('<b>' + st.sel + '.</b> ' + CO.LABELS[st.sel].what.replace(/<[^>]+>/g, '') + '. Read every line.');
    });
    lab.addEventListener('click', function (e) {
      var tr = e.target.closest('tr.row'); if (!tr || wait || e.target.closest('.w')) return;
      var r = +tr.getAttribute('data-r');
      st.m[st.sel] = st.m[st.sel] === r ? 0 : r; keep(); CO.sfx.pen(); draw();
      msg(st.m[st.sel] ? 'A pencilled question on line ' + r + ' of ' + st.sel + '.' : 'Rubbed out.');
    });
    box.querySelector('#u-clear').addEventListener('click', function () {
      if (wait) return;
      st.m[st.sel] = st.m[st.sel] === 'c' ? 0 : 'c'; keep(); if (st.m[st.sel]) CO.sfx.stamp(); draw();
      msg(st.m[st.sel] ? st.sel + ' is stamped CLEAR.' : 'The stamp is crossed out.');
    });
    function whyWrong(ref, v) {
      var L = CO.LABELS[ref];
      if (v === 'c') return '&ldquo;' + ref + ',&rdquo; says Mrs Grayling, and puts her finger on it. &ldquo;Read it again, line by line. Who received it on each line, and who handed it on in the next? And look at the seals on the bag.&rdquo;';
      var row = L.rows[v - 1], prev = L.rows[v - 2];
      if (row[5] === 'corr') return '&ldquo;Line ' + v + ' of ' + ref + ' has a time crossed out once and initialled by the person who wrote it,&rdquo; says Mrs Grayling. &ldquo;That&rsquo;s allowed. That&rsquo;s honest, in fact.&rdquo;';
      if (row[5] === 'long') return '&ldquo;Twenty years is a long time,&rdquo; says Mrs Grayling, &ldquo;but it isn&rsquo;t a gap. The store had it all along, and line ' + v + ' of ' + ref + ' begins with the store.&rdquo;';
      if (row[5] === 'tape') return '&ldquo;A torn corner, taped and signed across the tape,&rdquo; says Mrs Grayling. &ldquo;That&rsquo;s a mended label, not a broken chain.&rdquo;';
      if (!prev) return '&ldquo;Line 1 is where the chain begins,&rdquo; says Mrs Grayling. &ldquo;Somebody picked it up and signed. Look further down.&rdquo;';
      return '&ldquo;Line ' + v + ' of ' + ref + ',&rdquo; says Mrs Grayling. &ldquo;' + row[2] + ' handed it to ' + row[3] + ', and ' + row[2] + ' had received it on the line before. Nothing is missing there.&rdquo;';
    }
    box.querySelector('#u-go').addEventListener('click', function () {
      if (wait || R.next) return;
      var left = ORD.filter(function (ref) { return !st.m[ref]; }).length, bad = [];
      if (left) { ER.sfx.no(); msg(left + (left === 1 ? ' bag still has' : ' bags still have') + ' neither a CLEAR stamp nor a question. Every label must be read.'); return; }
      ORD.forEach(function (ref) { if (!ER.check('b' + ref.slice(3), String(st.m[ref]))) bad.push(ref); });
      if (bad.length) { ER.sfx.no(); st.sel = bad[0]; keep(); draw(); msg((bad.length > 1 ? '<b>' + bad.length + ' labels are not right yet.</b> ' : '') + whyWrong(bad[0], st.m[bad[0]])); return; }
      var file = ER.exitOk([ORD.map(function (ref) { return String(st.m[ref]); }).join('')]);
      if (!file) { ER.sfx.no(); msg('Mrs Grayling reads the sheet twice and does not sign it.'); return; }
      wait = true; R.solve(file); CO.sfx.stamp();
      msg('<b>Five clear, one question.</b> Mrs Grayling signs the continuity sheet under your name.');
      CO.mine('gap', 'The question on FH/4', '<p>FH/4, the glass panel. Line 5: to Photographic (G. Ingham), 8 November 2006, 14.10. Line 6: received back in the store, 9 November 2006, 09.05, with nobody&rsquo;s name in &ldquo;Handed over by&rdquo;.</p><p>The bag carries seal 04417, which is not on its label. The label lists only 03912 (at the scene) and 04502 (Dr Hesketh&rsquo;s).</p><p>All six labels are in the notebook.</p>');
      setTimeout(function () {
        ER.closeAll(); CO.solved(); R.busy = true;
        ER.narrate([
          'Mrs Grayling reads line 6 of FH/4 twice. Then she takes her glasses off and lets them hang on their chain.',
          '&ldquo;Received from Photographic, five past nine on the ninth. That&rsquo;s my signature. And nobody handed it to me. Mr Ingham was at the dentist; the bags were on his trolley with a note. I signed them in off the trolley.&rdquo;',
          '&ldquo;And seal 04417 isn&rsquo;t on the label at all. A seal nobody wrote down, on the morning nobody signed.&rdquo;',
          '&ldquo;A gap isn&rsquo;t a crime,&rdquo; she says. &ldquo;It&rsquo;s a question. Let&rsquo;s take the question to the glass bench.&rdquo; Upstairs a door bangs, and a voice calls down the stairs: &ldquo;Judith? I&rsquo;ve brought my own lens.&rdquo;'
        ], function () { R.busy = false; R.go(); });
      }, 2400);
    });
    draw(); fileLabel(st.sel);
    msg('Six bags, six labels. Click a bag to read its label, and decide: CLEAR, or a question on one line.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
