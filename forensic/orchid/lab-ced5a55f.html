<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};
  var BAGS = null;
  function bagOf(s) { for (var k in BAGS) if (BAGS[k] === s) return k; return '?'; }

  (function () {
    var s = '', i;
    for (i = -10; i < 30; i++) s += 'M' + (i * 120) + ' 70V640';
    $('#panels').setAttribute('d', s);
    s = ''; for (i = 0; i < 9; i++) s += '<rect x="' + (162 + i * 31) + '" y="' + (190 + (i % 3) * 6) + '" width="26" height="' + (80 - (i % 3) * 6) + '" fill="' + ['#5a6a3a', '#2a4a6a', '#7a5a2a', '#6a2a2a'][i % 4] + '"/><rect x="' + (166 + i * 31) + '" y="' + (210 + (i % 3) * 6) + '" width="18" height="10" fill="#fffdf4"/>';
    $('#spines').innerHTML = s;
    s = ''; OR.GRAINS.forEach(function (g, j) { s += OR.grain(g, 675 + (j % 2) * 70, 215 + Math.floor(j / 2) * 52, 15, j * 20); });
    $('#wallg').innerHTML = s;
    s = ''; [1040, 1130, 1420, 1500].forEach(function (x, j) { s += '<g transform="translate(' + x + ' 466)"><path d="M-16 0h32l4 -30h-40z" fill="#b5642e"/><rect x="-22" y="-34" width="44" height="6" fill="#c9773e"/><g transform="translate(0 -34) scale(.32)">' + OR.plant({ top: 1, seed: 20 + j }) + '</g></g>'; });
    $('#sill').innerHTML = s;
    s = ''; for (i = -10; i < 30; i++) s += '<rect x="' + (i * 100) + '" y="' + (660 + (i % 2) * 90) + '" width="96" height="86"/>';
    $('#tiles').innerHTML = s;
    ['ada', 'blakely', 'kamal'].forEach(function (w) { $('#' + w).innerHTML = OR.fig(w); });
  })();

  ER.init({
    theme: 'forensic', story: 'orchid', storyTitle: 'Lane Seven', id: 'lab', no: 'IV', title: 'The Port Lab',
    go: 'Along the quay',
    intro: [
      'On the car deck you bagged what answers Dr Kinsella&rsquo;s four questions: the outer crust of the wheel-arch mud (the newest place), the layer under it against the metal (an older place), the soles of Mr Blakely&rsquo;s boots (where he walked), and the leaf from the door runner (the only thing that can say where the plants were), in the one paper bag, because damp leaves rot in plastic. Road dust and floor dust answer nothing, and a single scoop of the whole arch mixes two places.',
      'Every bag was sealed, labelled and signed, and the custody log has a line for each. The Eider sailed at five past one without Mr Blakely, who has &ldquo;offered to help&rdquo;.',
      'The port&rsquo;s laboratory is a portakabin at the end of the quay, with a microscope, a fridge that hums in B flat, and a window on the harbour.'
    ],
    exit: {"next":"control","w":{"beafbf96":"70aac8c4"}}, tags: {"crate":["57db4302"],"benny":["6484216c"],"outer":["87b60693"],"boots":["88255f60"]},
    hints: hints, onBegin: begin
  });

  BAGS = ER.flag('c-bags') || { E4: 'outer', E5: 'inner', E6: 'boots', E7: 'leaf' };
  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  var NEED = ['blakely', 'kamal', 'manual', 'calendar', 'folders', 'wall'];
  function ready() { return NEED.every(function (k) { return told[k]; }); }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#scope').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips(NEED.filter(function (k) { return told[k]; }).length + (nextFile ? 1 : 0), 7);
  }
  function hints() {
    if (nextFile) return ['go', ['The leaves are in the sequencer. Go up to the control room: the button at the bottom.']];
    if (bench && bench.isOpen()) return [bench.step(), bench.step() === 'read' ? [
      'Drag the view until the grains are in the middle of the circle, and slide the focus knob up and down until they are sharp. Then click a shape on the key, and click a grain of that shape.',
      'Two air sacs: pine. Stuck together in a group: heather. Round with one pore: grass. Three furrows: ivy. A rounded triangle with three pores: hazel. Spiky, with windows: dandelion. Every kind on a slide must be named once.',
      'Read all four slides. The crate base, Mr Blakely&rsquo;s arch crust and his boots are full of heather and pine in white sand; Mr Gault&rsquo;s tyre has grass, ivy and hazel in orange sand.'
    ] : [
      'Click a sample tag, then the place on the map where it was picked up. Compare the soil first, then which plants are there, not only the numbers.',
      'Look at the dates on the cards. The heath was sampled in May, when pine flowers and heather does not. Now it is October, and heather has just been flowering.',
      'White quartz sand and black peat, with heather and pine: Burnet Heath. Orange and green grains, with hazel, ivy and grass: Kilnford. A few bits of shell come from the port lanes, where every van drives.'
    ]];
    if (!ready()) return ['look', [
      'Two people to hear and four things to read before the microscope (look at the pips).',
      'People: Officer Lakhani in the back-room door, Mr Blakely by the fridge. To read: the manual open on the bench, the small card by the microscope, the reference folders on the shelf, and the pollen card on the wall.'
    ]];
    return ['scope', ['Everything is read. Click the microscope.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The crate stood on Burnet Heath. So did Mr Blakely&rsquo;s wheel and his boots.'); return; }
    if (told.in) { busy = false; ER.say('The port lab. The fridge hums.'); return; }
    tell('in');
    ER.narrate([
      'Twenty past one. The lab smells of disinfectant and tomato soup. Through the long window the harbour is black, the lighthouse turns, and the lights of the Eider are already small.',
      'In the back room Officer Lakhani is writing numbers on the lids of tiny tubes for the DNA machine, with his tongue between his teeth. Dr Kinsella has made four slides from the mud samples, each stained pink so that the pollen shows.',
      'Mr Blakely sits on a stool by the fridge with a mug of tea, as if he worked here. &ldquo;I&rsquo;m told I&rsquo;m helping,&rdquo; he says to you, pleasantly.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- people ---------- */
  function done(k) { return function (seen) { if (seen && tell(k)) paint(); }; }
  $('#blakely').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mr Hector Blakely', role: 'Blakely&rsquo;s Orchids, Kilnford', face: FACE('blakely'), clue: { id: 'blakely4', title: 'Mr Blakely: pollen blows', kind: 'Statement' }, done: done('blakely'), lines: [
      'They&rsquo;ve given me tea. I&rsquo;m told I&rsquo;m helping.',
      { q: 'What did you do on Burnet Heath?', a: 'Walked. Looked at the last of the heather. Sat on a bench and ate a pork pie, if you need the details for your report.' },
      { q: 'Did you put anything down on the ground?', a: 'My pork pie, on its paper. Nothing else.' },
      { q: 'What will the pollen show, do you think?', a: 'Heather on my boots, I should think. I&rsquo;ve told you I was there. But you&rsquo;ll find heather pollen on anything in October, my dear. Pollen blows for miles. I read once that it crosses oceans.' }
    ] });
  });
  $('#back').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Officer Kamal Lakhani', role: 'Customs, in the back room', face: FACE('kamal'), clue: { id: 'kamal4', title: 'Officer Lakhani: two leaves, two tubes', kind: 'Statement' }, done: done('kamal'), lines: [
      'Two leaves, two tubes: E1, the leaf from Mr Gault&rsquo;s van, and E7, the leaf from Mr Blakely&rsquo;s door runner. Dr Kinsella did the crate plant and Mr Blakely&rsquo;s legal plant earlier.',
      { q: 'How do you keep them apart?', a: 'One bag out of the locker at a time. I sign it out, cut a scrap of leaf into a tube, and sign the bag back in. By the book.' },
      { note: 'He holds up a tiny tube. There is a number on the lid in black marker.' },
      'I numbered all the lids before I started. Saves time.',
      { q: 'How long will the machine take?', a: 'Forty minutes, once it starts. Dr Kinsella says that used to take a week.' }
    ] });
  });
  $('#kamal').addEventListener('click', function () { $('#back').dispatchEvent(new MouseEvent('click')); });
  $('#ada').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Heath, heath, heath,&rdquo; says Dr Kinsella, &ldquo;and Kilnford. It sounds like a nursery rhyme.&rdquo;' :
      '&ldquo;A grain of pollen is a passport,&rdquo; says Dr Kinsella, &ldquo;with the plant&rsquo;s photograph in it. You only have to learn the faces.&rdquo;');
  });

  /* ---------- papers ---------- */
  var DIAG = '<svg viewBox="0 0 250 240"><rect width="250" height="240" fill="#fffdf4"/>' + OR.GRAINS.map(function (g, j) {
    var x = 62 + (j % 2) * 120, y = 40 + Math.floor(j / 2) * 74;
    return OR.grain(g, x, y, 20, 0) + '<text x="' + x + '" y="' + (y + 34) + '" font-family="Patrick Hand,cursive" font-size="14" fill="#221f1a" text-anchor="middle">' + g + '</text>';
  }).join('') + '</svg>';
  var MANUAL = '<h4>Field manual &middot; Place</h4><h3>Pollen and soil: evidence of place</h3><div class="two"><div>' +
    '<p><b>Pollen</b> grains are tiny, from about a hundredth to a tenth of a millimetre across, and every kind of plant makes its own shape. Pine has two air sacs. Heather grains stick together in a group of four. Grass is round, with a single pore.</p>' +
    '<p>Every place has its own mix of plants, so a pinch of its soil holds its own mix of pollen. Add the soil itself: its colour, its <b>texture</b> (sand is gritty, clay is sticky) and the grains in it: white <b>quartz</b>, broken shell, orange sand stained by iron. Together they make a fingerprint of the place.</p></div>' + DIAG + '</div>' +
    '<p><b>Seasons matter.</b> The top of the soil keeps old pollen for years, but fresh pollen comes from whatever is in flower now, so the same place gives a different mix in May and in October. Compare which plants are there, and the soil, not just the numbers.</p>' +
    '<p class="rule">A sample tells you where something has been, and also where it has not.</p><p class="pg">88</p>';
  $('#manual').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MANUAL, cls: 'manual', clue: { id: 'manual88', title: 'Pollen and soil: evidence of place', kind: 'Field manual, page 88' }, done: function () {
      OR.terms(['pollen', 'texture', 'quartz']);
      if (tell('manual')) { paint(); ER.say('&ldquo;And where it has not,&rdquo; says Dr Kinsella. &ldquo;That line has got more people out of trouble than into it.&rdquo;'); }
    } });
  });
  var CAL = '<h4>In flower, round here</h4><table>' +
    '<tr><td>hazel</td><td>January to March</td></tr><tr><td>dandelion</td><td>March to May</td></tr><tr><td>pine</td><td>May and June</td></tr>' +
    '<tr><td>grass</td><td>May to August</td></tr><tr><td>heather</td><td>August to October</td></tr><tr><td>ivy</td><td>September to November</td></tr></table>' +
    '<p class="foot">Taped to the microscope. Months are rough: a warm spring starts everything early.</p>';
  $('#calendar').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CAL, cls: 'form', clue: { id: 'calendar', title: 'In flower, round here', kind: 'Card on the microscope' }, done: function () {
      if (tell('calendar')) { paint(); ER.say('&ldquo;It&rsquo;s the first of October,&rdquo; says Dr Kinsella. &ldquo;What&rsquo;s in flower?&rdquo;'); }
    } });
  });
  var REF = '<h4>County reference collection &middot; soil and pollen</h4><h3>Four places near Elsmouth</h3><table>' +
    '<tr><th>Place</th><th>Collected</th><th>Soil</th><th>Pollen (out of 100 grains)</th></tr>' +
    '<tr><td><b>Elsmouth</b>: the dunes and the port verges</td><td>14 Sept</td><td>pale yellow sand with broken shell</td><td>grass 55, ivy 20, pine 15, dandelion 10</td></tr>' +
    '<tr><td><b>Burnet Heath</b></td><td>12 May</td><td>white quartz sand, black crumbs of peat</td><td>pine 60, grass 20, heather 10, dandelion 10</td></tr>' +
    '<tr><td><b>Kilnford</b>: the greensand</td><td>9 Sept</td><td>orange-brown sand with tiny green grains</td><td>grass 45, ivy 30, hazel 15, dandelion 10</td></tr>' +
    '<tr><td><b>Iddon Vale</b>: farmland</td><td>20 Sept</td><td>grey-brown sticky clay, no sand</td><td>grass 50, ivy 25, hazel 25</td></tr></table>';
  $('#folders').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: REF, cls: 'ref', clue: { id: 'ref', title: 'Four places near Elsmouth', kind: 'Reference folder' }, done: function () {
      if (tell('folders')) { paint(); ER.say('&ldquo;Look at the dates,&rdquo; says Dr Kinsella. &ldquo;I collected the heath in May. I&rsquo;ve been meaning to go back.&rdquo;'); }
    } });
  });
  var WALL = '<h4>On the wall by the microscope</h4><h3>POLLEN</h3><p>The outer wall of a pollen grain is one of the toughest natural materials known. Acids hardly touch it. In the right soil, at the bottom of a lake or in a peat bog, it can last for thousands of years.</p><p class="rule">That is why a grain on a boot is still a grain under the microscope next week.</p>';
  $('#wall').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: WALL, cls: 'poster', clue: { id: 'wall', title: 'Pollen: the toughest wall', kind: 'Card on the wall' }, done: function () {
      if (tell('wall')) { paint(); ER.say('&ldquo;Tougher than my boots,&rdquo; says Dr Kinsella.'); }
    } });
  });
  OR.thing('#window', null, 'The harbour at night. The lighthouse turns. The lights of the Eider grow smaller every time you look.', isBusy);
  OR.thing('#fridge', null, 'The fridge: SAMPLES, and below that, in smaller writing, NOT SOUP.', isBusy);
  OR.thing('#radio', null, 'The radio is turned down to a murmur: the shipping forecast. Wind southwest, five or six. Rain later.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#scope').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four slides, four places, and one of them not a heath.'); return; }
    if (!ready()) {
      var miss = NEED.filter(function (k) { return !told[k]; })[0];
      ER.say('&ldquo;Not yet,&rdquo; says Dr Kinsella. &ldquo;' + ({ blakely: 'Mr Blakely has views on pollen. Hear them.', kamal: 'Ask Officer Lakhani how the leaves are getting on.', manual: 'Page 88 of the manual, on the bench.', calendar: 'Read the card by the microscope: what flowers when.', folders: 'The reference folders, on the shelf.', wall: 'The card on the wall.' })[miss] + '&rdquo;');

      for (var i = 0; i < ORDER.length; i++) { k = ORDER[i]; if (!ER.check(k, { port: 'p', heath: 'h', kiln: 'k', iddon: 'i' }[st.at[k]])) { ER.sfx.no(); msg(wrongFor(k, st.at[k])); return; } }
      file = ER.exitOk([ORDER.map(function (q) { return { port: 'p', heath: 'h', kiln: 'k', iddon: 'i' }[st.at[q]]; }).join('')]);
      if (!file) { ER.sfx.no(); msg('Dr Kinsella reads the report twice and does not sign.'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.lab = 1; ER.persist(true);
      OR.sfx.stamp(); msg('<b>Heath, Kilnford, heath, heath.</b> Dr Kinsella signs the report.');
      OR.mine('places', 'Where the samples have been', '<p>E3, the base of the crate: Burnet Heath (white quartz, peat, heather and pine).</p><p>' + SL.outer.bag + ', Mr Blakely&rsquo;s wheel arch, outer crust (the newest layer): Burnet Heath. ' + SL.boots.bag + ', his boots: Burnet Heath.</p><p>E2, Mr Gault&rsquo;s tyre: Kilnford (orange and green grains, hazel), with a little port shell. No heather, no pine, no white sand: his van has not been on the heath.</p><p>The heath card was collected in May, when pine flowers. Heather flowers August to October.</p>');
      setTimeout(function () {
        ER.closeAll(); OR.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;The crate stood on Burnet Heath,&rdquo; says Dr Kinsella. &ldquo;So did Mr Blakely&rsquo;s front wheel, last thing before the port, and so did his boots. And under the crust, against the metal, there&rsquo;s an older layer of orange greensand: Kilnford, his own yard.&rdquo;',
          '&ldquo;And Mr Gault&rsquo;s van has been to Kilnford, as his delivery note says, and through the port lanes like everybody&rsquo;s. Never on a heath. Not one grain of heather, not one of pine.&rdquo;',
          'Mr Blakely puts his mug down. &ldquo;Pollen blows for miles, Dr Kinsella. You&rsquo;ll find heather on anything in October.&rdquo;',
          '&ldquo;A few grains blow,&rdquo; says Dr Kinsella. &ldquo;Half a slide of heather, in white heath sand, on the bottom of a crate, doesn&rsquo;t blow. Somebody stood that crate on Burnet Heath this afternoon.&rdquo; &ldquo;Lots of people walk on Burnet Heath.&rdquo; &ldquo;They do. Not many of them parked in lane seven.&rdquo;',
          'Officer Lakhani puts his head round the door. &ldquo;Sequencer&rsquo;s finished,&rdquo; he says. &ldquo;It&rsquo;s upstairs in the control room, beside the custody locker, and the duty officer wants to hear the results there.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2600);
    });
    function draw() { if (st.map) drawMap(); else { drawScope(); placeScope(); wireScope(); } }
    draw();
    if (st.map) { box.querySelector('#m-go').textContent = 'Sign the report'; msg('Four samples, four places. Click a tag, then the place on the map.'); }
    else { if (allRead()) box.querySelector('#m-go').textContent = 'To the map'; report(); }
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      step: step
    };
  }
})();
</script>
