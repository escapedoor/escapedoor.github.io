<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  /* the shed's ribs, trusses, lights, rain and floor lines; the people */
  (function () {
    var s = '', i;
    for (i = -40; i < 110; i++) s += '<path d="M' + (i * 24) + ' 0V640"/>';
    $('#ribs').innerHTML = s;
    s = ''; for (i = -4; i < 10; i++) s += '<path d="M' + (i * 260) + ' 120L' + (i * 260 + 130) + ' 10L' + (i * 260 + 260) + ' 120M' + (i * 260 + 130) + ' 10V120"/>';
    $('#truss').innerHTML = s;
    s = ''; [[150, ''], [560, ''], [1000, ' tube2'], [1420, '']].forEach(function (t) {
      s += '<g class="' + t[1] + '"><rect x="' + (t[0] - 90) + '" y="66" width="180" height="10" rx="5" fill="#f4ffff"/><path d="M' + (t[0] - 110) + ' 76h220l140 560h-500z" fill="url(#tubeG)" pointer-events="none"/></g><path d="M' + (t[0] - 80) + ' 10V66M' + (t[0] + 80) + ' 10V66" stroke="#1a1f1e" stroke-width="2"/>';
    });
    $('#tubes').innerHTML = s;
    s = ''; for (i = 0; i < 26; i++) s += 'M' + (40 + (i * 53) % 290) + ' ' + (170 + (i * 97) % 450) + 'l-8 46';
    $('#rainp').setAttribute('d', s);
    s = '<g stroke="#e6c84a" stroke-width="10" opacity=".8"><path d="M560 1300L700 660M1100 1300L960 660"/></g><path d="M-1000 760H2600" stroke="#e6c84a" stroke-width="6" opacity=".5"/>' +
      '<text x="830" y="830" class="sX" font-size="44" fill="#e6c84a" opacity=".55" letter-spacing="10">INSPECTION</text>';
    s += '<path d="M-200 700h300l-20 10h-300z" fill="#000" opacity=".2"/><path d="M60 650q60 20 160 6q40 -6 90 4" stroke="#7a8a92" stroke-width="10" fill="none" opacity=".25"/>';
    $('#floor').innerHTML = s;
    s = ''; for (i = 0; i < 9; i++) s += '<path d="M' + (742 + i * 21) + ' 532q' + (-10 + (i % 3) * 10) + ' -40 ' + (-24 + (i % 4) * 14) + ' -58" stroke="' + (i % 2 ? '#4f7d36' : '#6f9a4a') + '" stroke-width="9" fill="none" stroke-linecap="round"/>';
    $('#crateLeaves').innerHTML = s;
    $('#pflower').innerHTML = OR.flower();
    $('#kamal').innerHTML = OR.fig('kamal'); $('#ada').innerHTML = OR.fig('ada'); $('#blakely').innerHTML = OR.fig('blakely');
    var b = {}; for (var k in CAST.benny) b[k] = CAST.benny[k]; b.pose = 'cup'; b.cupc = '#f2efe6';
    $('#bennyIn').innerHTML = OR.person(b, true);
  })();

  ER.init({
    theme: 'forensic', story: 'orchid', storyTitle: 'Lane Seven', id: 'shed', no: 'I', title: 'The Customs Shed',
    go: 'Into the shed',
    intro: [
      'You are a trainee from the county forensic laboratory, on a month&rsquo;s placement at Elsmouth ferry port with Dr Ada Kinsella, who inspects every plant that crosses the water here. Tonight you are on the late shift.',
      'At twenty to eleven a lane marshal found a crate of rare orchids hidden in the export lanes, beside a courier&rsquo;s van. The courier, Benny Gault, has a record. Customs are holding him.',
      'Before anybody says &ldquo;case closed&rdquo;, Dr Kinsella wants three things: what the plants are, where they have been, and who brought them. The motto on her office wall is the laboratory&rsquo;s own: <i>Every contact leaves a trace.</i>'
    ],
    exit: {"next":"bay","w":{"95d9dbf3":"67ccc807"}}, tags: {"p1":["ce2d802e"],"p2":["f3ebc815"],"p3":["2c1a9416"],"p4":["de3dde15"],"p5":["e35da074"],"p6":["b3ef6930"],"p7":["551abd04"],"p8":["283b4bbf"],"p9":["e16dd81b"],"p10":["c8c688c8"],"p11":["42768a23"],"p12":["e0d13c2c"],"st":["6d60cd7b"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function heard() { return told.kamal && told.benny && told.blakely; }
  function readAll() { return told.poster && told.card && told.note && told.record; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#crate').classList.toggle('ready', !!(heard() && readAll() && !nextFile));
    ER.pips(['kamal', 'benny', 'blakely', 'poster', 'card', 'note', 'record'].filter(function (k) { return told[k]; }).length + (nextFile ? 1 : 0), 8);
  }
  function hints() {
    if (nextFile) return ['go', ['The tyre print is the next thing. Go to the inspection bay: the button at the bottom of the screen.']];
    if (bench && bench.isOpen()) return [bench.step(), bench.step() === 'sort' ? [
      'Click a plant to lift it out under the lamp, and read what it shows. Then count its signs on Dr Kinsella&rsquo;s card (it is in your notebook).',
      'Three signs or more: wild. One or none: grown. A pot and bark chips are not signs at all: look at what is inside the pot, and at the roots themselves.',
      'Plants 4 and 7 came in pots and plant 10 has whole roots, but count their signs anyway. Plant 2 has a bite and nothing else; plant 9 lost its pot and nothing else.'
    ] : [
      'Each tray needs a stamp on its label. Read the poster again: what may happen to wild-collected plants of an Appendix I species?',
      'Wild-collected plants of Appendix I may not be traded for profit with any paper at all. Nursery-grown ones may travel, but only with a certificate, and this crate has none.'
    ]];
    if (!heard() || !readAll()) return ['look', [
      'Three people to hear and four papers to read before the crate. Look at the pips beside the room&rsquo;s name.',
      'People: Officer Lakhani by the roller door, Benny Gault in the glass office, Mr Blakely by the drinks machine. Papers: the poster on the wall; on the bench, Dr Kinsella&rsquo;s card, Benny&rsquo;s delivery note in its plastic wallet, and her inspection record on the clipboard.'
    ]];
    return ['crate', ['Everything is heard and read. Click the crate on the bench.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('Eight wild, four grown, and no papers for any of them.'); return; }
    if (told.in) { busy = false; ER.say('The customs shed. Rain on the roof.'); return; }
    tell('in');
    ER.narrate([
      'Elsmouth ferry port, Thursday, twenty-five to midnight. The customs shed is a steel barn beside the export lanes, lit like an operating theatre and about as warm. Rain drums on the roof.',
      'On the inspection bench stands a wooden flower crate, fifty centimetres by forty, with its lid off. Inside, wrapped in damp newspaper, are twelve plants with leaves like green straps. &ldquo;Slipper orchids,&rdquo; says Dr Kinsella, before anybody asks.',
      'In the glass office at the back, a man in a grey hoodie sits with his hands round a paper cup. Officer Lakhani of customs stands by the roller door with a folder. By the drinks machine an older man in a tweed cap is waiting for his boat.',
      '&ldquo;The night boat sails at a quarter to one,&rdquo; says Dr Kinsella. &ldquo;Mr Gault won&rsquo;t be on it. I&rsquo;d like to know if that&rsquo;s right.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- people ---------- */
  function done(k) { return function (seen) { if (seen && tell(k)) paint(); }; }
  $('#kamal').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Officer Kamal Lakhani', role: 'Customs, Elsmouth', face: FACE('kamal'), clue: { id: 'kamal', title: 'Officer Lakhani: why Benny Gault', kind: 'Statement' }, done: done('kamal'), lines: [
      'The lane marshal found the crate at twenty to eleven, behind the grit bin in lane seven, space four. Right beside Mr Gault&rsquo;s van.',
      { q: 'What was in it?', a: 'Twelve slipper orchids in newspaper. No paperwork, no name on the crate. Nobody has come forward to say they&rsquo;re his.' },
      { q: 'Why Mr Gault?', a: 'Three reasons. There&rsquo;s a tyre print in the mud by the crate, and it has the same tread pattern as his van: I checked it with a torch. There was an orchid leaf on the floor of his load space, which I bagged: that&rsquo;s E1. And he has a record. 2017, cigarettes, twelve thousand of them under some garden chairs.' },
      { q: 'Is that enough?', a: 'To hold him until morning, yes. For a court I want the laboratory to say so. That&rsquo;s you, I&rsquo;m told.' },
      { note: 'He straightens a pen that was already straight.' },
      'I&rsquo;ve done it all by the book. One bag for each sample, a label on every bag, every bag in the custody log. Dr Kinsella scraped the bottom of the crate herself: that&rsquo;s E3.'
    ] });
  });
  $('#office').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Benny Gault', role: 'Courier · held by customs', face: FACE('benny'), clue: { id: 'benny', title: 'Benny Gault: his day', kind: 'Statement' }, done: done('benny'), lines: [
      'Benny Gault. Gault Couriers, which is me and the van.',
      { q: 'Where have you been today?', a: 'Picked up bark at the builders&rsquo; merchants here in Elsmouth this morning. Took it to the orchid place at Kilnford, Blakely&rsquo;s, for two o&rsquo;clock. They gave me their empty plant trays to bring back. Home for my tea, then here for the night boat: garden furniture for a shop over the water.' },
      { q: 'And the crate?', a: 'Never seen it. I checked in at twelve minutes past ten, the lady with the torch put me in lane seven, and I put my seat back and shut my eyes. Next thing I know there&rsquo;s a torch in my face and a crate on the ground.' },
      { q: 'Officer Lakhani says you have a record.', a: '2017. Cigarettes. I was stupid, I paid the fine, and I&rsquo;ve been honest for nine years. Nobody ever says that bit first.' },
      { q: 'Anything else?', a: 'My daughter&rsquo;s nine on Saturday. I was going to be back on Friday night. Write that down, if it helps.' }
    ] });
  });
  $('#blakely').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mr Hector Blakely', role: 'Blakely&rsquo;s Orchids, Kilnford', face: FACE('blakely'), clue: { id: 'blakely', title: 'Mr Blakely: his evening', kind: 'Statement' }, done: done('blakely'), lines: [
      'Hector Blakely, of Blakely&rsquo;s Orchids at Kilnford. Forty years of slipper orchids, and I&rsquo;ve never seen the inside of this shed so late.',
      { q: 'Why are you here tonight?', a: 'Forty plants for a garden centre over the water. Every one grown from seed in my own glasshouses, every paper in order. Dr Kinsella went through the lot an hour ago.' },
      { q: 'What did you do this evening?', a: 'Left the nursery at half past three and came straight down the motorway, apart from supper at the services. Checked in at half past nine. The marshal put me in lane seven while the plant lane was full, and then moved me over to lane two. Space four, I think it was.' },
      { q: 'Have you seen the crate?', a: 'Through the door. Wild plants, I&rsquo;d say, poor things, dug out of some hillside. Rothschild&rsquo;s, very likely, by the leaves. But don&rsquo;t quote me on a slipper orchid without a flower.' },
      { q: 'Do you know Mr Gault?', a: 'The courier? He brought my bark this afternoon. A pleasant man. I&rsquo;d hate to think it of him.' }
    ] });
  });
  $('#ada').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Now the print,&rdquo; says Dr Kinsella. &ldquo;Tread patterns are like surnames. Lots of people share one.&rdquo;' :
      !told.card ? '&ldquo;Read my card before you touch a root,&rdquo; says Dr Kinsella. &ldquo;It&rsquo;s on the bench, under the lamp.&rdquo;' :
      '&ldquo;Wild or grown,&rdquo; says Dr Kinsella. &ldquo;It matters more than anything else tonight. One is a missing form. The other is a crime.&rdquo;');
  });

  /* ---------- papers ---------- */

    '<p>In 1973, in Washington, countries agreed to control the trade in wild plants and animals that are in danger. The agreement is called <b>CITES</b>, the Convention on International Trade in Endangered Species. It came into force in 1975. Today it covers more than 40,000 species, most of them plants, and every kind of orchid is on its lists.</p>' +

    draw();
    msg(step() === 'sort' ? 'Click a plant in the crate to lift it out under the lamp. Read what it shows, count the signs on Dr Kinsella&rsquo;s card, and click the WILD or the GROWN tray to put it there.' : 'All twelve are in trays. A stamp on each label, then sign.');
    if (st.lamp >= 0) msg('<b>Plant ' + (st.lamp + 1) + '.</b> ' + PL[st.lamp].t);
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      step: step
    };
  }
})();
</script>
