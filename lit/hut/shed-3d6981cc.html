<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  HT.put('#mar', 'martin', { h: 360, armL: 'front', armR: 'front' });
  HT.put('#ph', 'phoebe', { h: 320, armL: 'front' });

  ER.init({
    theme: 'lit', story: 'hut', storyTitle: 'The Fourth Draft', id: 'shed', no: 'II', title: 'The Shed',
    go: 'Into the shed',
    intro: [
      'You put Gran&rsquo;s three pages in order by what they say about each other. The exercise book came first: its margin says START with the pencils, cut the weather, change the names. The typed carbon came second, because it does all three, and its own margin says Roles only. The loose pencil page came last: it has no names at all. The typed page is the neatest, but the typewriter&rsquo;s ribbon ran out in August, so neat is not the same as new.',
      'Martin Gosling&rsquo;s shed is halfway up the garden. It is where he goes to be alone, which is why the door is always open. It has started to rain.'
    ],
    exit: {"next":"glass","w":{"a974bdab":"eb47aff9"}}, tags: {"cut":["e88cd758","4fd78392"],"pl":["ab167403"],"s7at":["13fd912a"]},
    hints: hints, onBegin: begin
  });

  told = HT.told('b-told'); nextFile = ER.flag('b-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('mar') && told.has('letter'); }
  function paint() {
    $('#mar').classList.toggle('ready', !told.has('mar'));
    $('#letter').classList.toggle('ready', told.has('mar') && !told.has('letter'));
    $('#bench').classList.toggle('ready', ready() && !nextFile);
    ER.pips((told.has('mar') ? 1 : 0) + (told.has('letter') ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['The page is planed. The button at the bottom of the screen takes you across to Alison&rsquo;s greenhouse.', 'If you cannot see the button, close whatever is open (the Escape key) and look at the bottom of the screen.']];
    if (lock && document.body.contains(lock)) return ['bench', [
      'There are four orders to carry out, from Bernice&rsquo;s letter, from Gran&rsquo;s margin and from Gran&rsquo;s card: a life story to cut, a joke that is explained, a &ldquo;suddenly&rdquo; that has brought &ldquo;very&rdquo; with it, and the green fingers to bring back. Everything else stays.',
      'The SAW cuts a line. STET brings back a line that is crossed out or sawn off. The PLANE offers sharper words for a line. The HAND picks a line up; then click a gap to put it down. The green fingers need STET first, and then a better place: somewhere &ldquo;her&rdquo; makes sense.',
      '&ldquo;Suddenly I felt very cold&rdquo; wants one exact word, with no &ldquo;suddenly&rdquo; and no &ldquo;very&rdquo;. &ldquo;Her school&rdquo; needs a girl just before it: put it straight after the line that ends &ldquo;the girl would be saying nothing&rdquo;. Keep the mug and the biscuits: never cut a clue you cannot explain yet.'
    ]];
    if (!ready()) return ['look', [
      'Martin is behind his workbench, in the middle: talk to him.',
      'Bernice&rsquo;s letter is lying on the bench, under a mug. Read it. Then click the vice on the left, where the page is clamped.'
    ]];
    return ['vice', ['Everything is read. Click the vice on the left of the workbench, where the loose page is clamped.', 'Or click the front edge of the workbench: it glows.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The planed page is in Martin&rsquo;s vice, and Martin is admiring it.'); return; }
    if (told.has('in')) { busy = false; ER.say('Martin&rsquo;s shed. Rain on the roof.'); return; }
    told.set('in');
    ER.narrate([
      'Inside: a workbench with a vice, a wall of tools hanging on hooks with their outlines painted round them, a radio, a kettle, a dusty armchair, and a smell of sawdust and creosote. Rain drums on the felt roof.',
      'Martin Gosling is fifty, large, kind and covered in sawdust. He makes kitchen cupboards for a living, and he built the hut for his mother last year. He takes the loose page from you, looks at it closely, and clamps it in his vice so that it cannot get away.',
      '&ldquo;Ah. The first reader,&rdquo; he says. &ldquo;Good. Mum&rsquo;s editor wants this page by Monday, Mum&rsquo;s left notes all over it, and I&rsquo;ve been staring at my spare copy for an hour. Revision is joinery, you see. You cut, you move, you plane it till it fits.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  var LETTER = '<div class="lh">SALTMARSH BOOKS<small>Twelve Twists for Winter</small></div><p class="date">Wednesday 7 October 2026</p>' +
    '<p>Dear Marjorie,</p>' +
    '<p>Your photocopied pages came on Monday, in pencil. Has the typewriter died? (The top copy of draft two, which you sent me in June, is still on my desk, covered in coffee.)</p>' +
    '<p>The first paragraph is nearly there. Four things, and then it is perfect. One: nobody needs your life story in the first paragraph. Two: that word you hate has crept back in, and brought &ldquo;very&rdquo; with it. Three: you have explained one of your own jokes, and an explained joke is a dead joke. Four: you crossed out the girl&rsquo;s green fingers. That was the best plant in the whole of draft one! A twist only plays fair if its clues are on the page. Put it back, but put it where it makes sense.</p>' +
    '<p>The book goes to the printer on Monday 19 October. I need this page, and an ending, on my desk by 9 a.m. that day.</p>' +
    '<p class="sig">With love and impatience, Bernice</p><p class="sub">Bernice Rafferty, Editor</p>';
  $('#letter').addEventListener('click', function () {
    if (busy) return;
    if (!told.has('mar')) { ER.say('A letter under a mug. &ldquo;That&rsquo;s Mum&rsquo;s,&rdquo; says Martin. &ldquo;Say hello first, then read it.&rdquo;'); return; }
    ER.read({ html: LETTER, cls: 'ed', clue: { id: 'ed', title: 'Bernice&rsquo;s letter', kind: 'Letter' }, done: function () {
      HT.terms(['play fair', 'plant']);
      if (told.set('letter')) { paint(); ER.say('&ldquo;Love and impatience,&rdquo; says Martin. &ldquo;That&rsquo;s editors for you.&rdquo;'); }
    } });
  });
  $('#mar').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Fits like a drawer,&rdquo; says Martin, running his thumb along the page.'); return; }
    ER.talk({
      who: 'Martin Gosling', role: 'Gran&rsquo;s son · makes cupboards', face: window.FACE('martin'),
      lines: [
        { note: 'Martin talks the way he planes wood: steadily, and with a joke whenever something matters.', a: '&ldquo;I read the spare copy last night. I didn&rsquo;t mean to. It was just lying there, being a story.&rdquo;' },
        { q: 'Did you build the hut?', a: '&ldquo;Spring before last. Finished it in April last year, painted it green, put the stove in. Mum said it was the first room she&rsquo;d ever had that nobody else wanted. Then we all started going down there.&rdquo;' },
        { q: 'Why do you want the son to be the visitor?', a: '&ldquo;Because it&rsquo;s nice. Because he&rsquo;d be keeping an eye on her.&rdquo; He wipes his hands on a rag. &ldquo;All right. Because I go down there every night at eleven with the big torch and look through the window, to check she&rsquo;s let the stove go out. I&rsquo;ve never once gone in. She doesn&rsquo;t know. She never notices anything once she&rsquo;s writing.&rdquo;' },
        { q: 'Have you seen anybody else down there at night?', a: '&ldquo;No. Well. Once or twice there&rsquo;s been a light in the hut, small and red, like a bicycle lamp. Elliot says it&rsquo;s a ghost. I say it&rsquo;s the fox, on a bicycle.&rdquo;' },
        { q: 'What do you think of the page?', a: '&ldquo;Nearly there. But Mum&rsquo;s left orders in the margin, Bernice has sent more orders in that letter on the bench, and her card in the hut has rules on it. I can cut wood. I can&rsquo;t cut a sentence without asking why.&rdquo;' }
      ],
      clue: { id: 'mar1', title: 'Martin, in the shed', kind: 'What he said' },
      done: function (seen) { if (seen && told.set('mar')) paint(); }
    });
  });
  $('#plans').addEventListener('click', function () {
    if (busy) return;
    HT.seed('plans', 'Martin&rsquo;s plans for the hut', '<p>Pinned on the shed wall, in blue pencil: HUT FOR MUM. 2.4 m &times; 1.8 m. Stove in back corner. Window facing the house. Paint: Garden Green. And a date: April 2025.</p>'.replace('&times;', '×'));
    ER.say('Martin&rsquo;s plans, in blue pencil: HUT FOR MUM. Window facing the house. Paint: Garden Green. April 2025.');
  });
  $('#torch').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'torch');
    HT.seed('torch', 'Martin&rsquo;s torch', '<p>A big white torch on a hook by the shed door, with a white bulb: the one Martin takes down the garden every night at eleven.</p>');
    ER.say('A big white torch, with a white bulb. &ldquo;Eleven o&rsquo;clock, every night,&rdquo; says Martin. &ldquo;Regular as a cuckoo clock.&rdquo;');
  });
  HT.thing('#radio', null, 'The radio is giving the weather: showers, then sunshine, then a clear cold evening. Gran would cut the lot.', isBusy);
  HT.thing('#kettle', 'kettle', 'A kettle and one mug, the right way up. Martin has never turned a mug upside down in his life.', isBusy);
  HT.thing('#arm', null, 'An armchair that came out of the house in 1998 and has been here ever since. It smells of sawdust and dog, although there has never been a dog.', isBusy);
  HT.thing('#win', null, 'Rain on the little window. Down the garden, the green hut; up the garden, the tall thin house.', isBusy);
  HT.thing('#ph', null, function () { return nextFile ? '&ldquo;Mum&rsquo;s greenhouse next,&rdquo; says Phoebe. &ldquo;She&rsquo;s got the carbon in there. She says it&rsquo;s full of irony.&rdquo;' : 'Phoebe is reading the page in the vice upside down, which she can do faster than most people read the right way up.'; }, isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  function tryLock() {
    if (busy) return;
    if (nextFile) { ER.say('The planed page, clamped in the vice.'); return; }
    if (!ready()) { ER.say('&ldquo;Hang on,&rdquo; says Martin. &ldquo;Before we cut anything, read Bernice&rsquo;s letter. And talk to me. I&rsquo;m good value.&rdquo;'); return; }
    openLock();
  }
  $('#vice').addEventListener('click', tryLock);
  $('#bench').addEventListener('click', tryLock);

  /* ---------- the lock: the page as twelve planks on the workbench ---------- */
  var ST = {
    s1: 'Somebody had sharpened my pencils.',
    s2: 'All six lay in a row on my desk, points to the window, like soldiers waiting for orders.',
    s3: 'I had left them blunt. I always leave them blunt; sharpening them is how I start.',
    s4: 'I am eighty-one, and I have written in this hut every morning for nine years.',
    s5: 'Nothing was missing.',
    s6: 'My mug, which I had left dirty, was clean and upside down on the shelf.',
    s7: 'Her school makes them correct their own work in green, and her fingers were green to the knuckle.',
    s8: 'Suddenly I felt very cold.',
    s9: 'Up at the house my son would be eating toast, his wife would be reading the last page of a book she had not started, the boy would be hoping for an earthquake, and the girl would be saying nothing.',
    s10: 'I counted my biscuits. Fourteen.',
    s11: 'Whoever came into my hut at night did not come for biscuits.',
    s12: 'This was a joke about my son, who eats them.'
  };
  var NOTE = { s7: 'It&rsquo;s the plant! But not here. <b>STET</b>', s12: 'Never explain a joke!' };
  var OFF = [['a', 'I shivered.'], ['b', 'I felt extremely cold.'], ['c', 'Suddenly, I shivered.'], ['d', 'A cold, strange, uneasy feeling came over me.']];
  var ORIG = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8', 's9', 's10', 's11', 's12'];
  var KEEPWHY = {
    s1: 'Martin holds the saw away. &ldquo;That&rsquo;s the line Mum moved to the top on purpose, in the second draft. The strongest thing goes first.&rdquo;',
    s2: '&ldquo;That&rsquo;s the pencils,&rdquo; says Martin. &ldquo;The whole scene is about the pencils. You can&rsquo;t saw the leg off a table.&rdquo;',
    s3: '&ldquo;That&rsquo;s the pencils again,&rdquo; says Martin. &ldquo;It tells you she noticed. Leave it.&rdquo;',
    s5: '&ldquo;Steady,&rdquo; says Martin. &ldquo;Her card says never cut a clue, even one you can&rsquo;t explain yet. Nothing missing: why would a visitor take nothing?&rdquo;',
    s6: '&ldquo;Steady,&rdquo; says Martin. &ldquo;Her card says never cut a clue, even one you can&rsquo;t explain yet. Why would a visitor wash a mug and turn it upside down? We don&rsquo;t know. So it stays.&rdquo;',
    s8: '&ldquo;She doesn&rsquo;t want it gone,&rdquo; says Martin. &ldquo;Her card says one exact word for two vague ones. One, not none. Try the plane.&rdquo;',
    s9: '&ldquo;That&rsquo;s the whole family,&rdquo; says Martin. &ldquo;And it&rsquo;s where the girl comes in. Mum would never cut her family. She&rsquo;d only change their names.&rdquo;',
    s10: '&ldquo;Steady,&rdquo; says Martin, who is fond of the biscuits. &ldquo;Bernice didn&rsquo;t ask for that to go, and the card says never cut a clue you can&rsquo;t explain yet.&rdquo;',
    s11: '&ldquo;That&rsquo;s the joke itself,&rdquo; says Martin. &ldquo;Cut the explanation, not the joke.&rdquo;'
  };
  function openLock() {
    var st = ER.flag('b-st') || { order: ORIG.slice(), cut: { s7: 1 }, pl: null }, tool = 'hand', held = null, open = null, done = false;
    lock = ER.el('div', 'wb');
    var icon = {
      hand: '<svg viewBox="0 0 34 22"><path d="M8 20v-9q0 -3 3 -3t3 3v-7q0 -3 3 -3t3 3v7q0 -3 3 -3t3 3v9q0 2 -2 2h-14q-2 0 -2 -2z" fill="#f4e6cc" stroke="#1a100a" stroke-width="1.4"/></svg>',
      saw: '<svg viewBox="0 0 34 22"><path d="M2 8h24l6 6h-30z" fill="#c8ccd0" stroke="#1a100a" stroke-width="1.4"/><path d="M2 14l3 4l3 -4l3 4l3 -4l3 4l3 -4l3 4l3 -4l3 4" fill="none" stroke="#1a100a" stroke-width="1.2"/><rect x="24" y="4" width="8" height="8" fill="#8a5a30" stroke="#1a100a"/></svg>',
      plane: '<svg viewBox="0 0 34 22"><path d="M3 16h28l-3 -8h-22z" fill="#8a5a30" stroke="#1a100a" stroke-width="1.4"/><path d="M14 8l4 -6h6l-4 6z" fill="#3a3a3e"/><path d="M6 19q4 -3 8 0" stroke="#e8c88a" fill="none" stroke-width="1.6"/></svg>',
      stet: '<svg viewBox="0 0 34 22"><text x="17" y="16" text-anchor="middle" font-family="Gochi Hand,cursive" font-size="14" fill="#2fa84a">STET</text></svg>'
    };
    lock.innerHTML = '<div class="tools"><h5>MARTIN&rsquo;S BENCH</h5>' +
      '<button type="button" class="tool" data-t="hand">' + icon.hand + '<span>HAND<small>pick a line up, put it in a gap</small></span></button>' +
      '<button type="button" class="tool" data-t="saw">' + icon.saw + '<span>SAW<small>cut a line</small></span></button>' +
      '<button type="button" class="tool" data-t="plane">' + icon.plane + '<span>PLANE<small>sharpen a line</small></span></button>' +
      '<button type="button" class="tool" data-t="stet">' + icon.stet + '<span>STET<small>let a cut line stand</small></span></button></div><div class="planks"></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="hand">Hand it to Martin</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg'), pl = lock.querySelector('.planks');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function save() { ER.flag('b-st', st); }
    function text(id) { return id === 's8' && st.pl ? OFF.filter(function (o) { return o[0] === st.pl; })[0][1] : ST[id]; }
    function draw() {
      var h = '<button type="button" class="gap" data-g="0"></button>';
      st.order.forEach(function (id, i) {
        var cls = 'st' + (st.cut[id] ? (id === 's7' && !st.sawn7 ? ' struck' : ' cut') : '') + (held === id ? ' held' : '') + (id === 's8' && st.pl ? ' new' : '');
        h += '<button type="button" class="' + cls + '" data-s="' + id + '">' + text(id) + (NOTE[id] ? '<span class="nt">' + NOTE[id] + '</span>' : '') + '</button>';
        if (open === id) { h += '<div class="offs">'; OFF.forEach(function (o) { h += '<button type="button" class="off" data-o="' + o[0] + '">' + o[1] + '</button>'; }); h += '</div>'; }
        h += '<button type="button" class="gap" data-g="' + (i + 1) + '"></button>';
      });
      pl.innerHTML = h;
      lock.classList.toggle('moving', !!held);
      ER.$$('.tool', lock).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tool); });
    }
    lock.addEventListener('click', function (e) {
      if (done) return;
      var t = e.target.closest('.tool'), s = e.target.closest('.st'), g = e.target.closest('.gap'), o = e.target.closest('.off');
      ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); });
      if (t) { tool = t.getAttribute('data-t'); held = null; open = null; ER.sfx.click(); draw(); msg({ hand: 'The hand: click a line to pick it up, then click a gap between two lines to put it down.', saw: 'The saw: click a line to cut it out.', plane: 'The plane: click a line to see sharper ways of saying it.', stet: 'STET: click a crossed-out or sawn line to let it stand.' }[tool]); return; }
      if (o) { st.pl = o.getAttribute('data-o'); open = null; HT.sfx.plane(); save(); draw(); msg('Martin blows the shavings off. &ldquo;' + text('s8') + '&rdquo;'); return; }
      if (g && held) {
        var at = +g.getAttribute('data-g'), from = st.order.indexOf(held);
        st.order.splice(from, 1); if (at > from) at--; st.order.splice(at, 0, held); held = null; ER.sfx.paper(); save(); draw(); msg('Moved.'); return;
      }
      if (!s) return;
      var id = s.getAttribute('data-s');
      if (tool === 'hand') { held = held === id ? null : id; ER.sfx.paper(); draw(); if (held) msg('Now click a gap between two lines.'); return; }
      if (tool === 'saw') {
        if (st.cut[id]) { msg(id === 's7' && !st.sawn7 ? 'That line is crossed out already. To bring it back, use STET.' : 'Already sawn off. If you want it back, STET.'); return; }
        st.cut[id] = 1; if (id === 's7') st.sawn7 = 1; held = null; HT.sfx.saw(); save(); draw(); msg('Sawn off.'); return;
      }
      if (tool === 'stet') {
        if (!st.cut[id]) { msg('STET is for a line that has been crossed out or sawn off. This one is standing already.'); return; }
        delete st.cut[id]; if (id === 's7') st.sawn7 = 0; HT.sfx.pencil(); save(); draw(); msg('STET: let it stand.'); return;
      }
      if (tool === 'plane') {
        if (st.cut[id]) { msg('You cannot plane a line that is not there.'); return; }
        if (id !== 's8') { msg('Martin runs the plane along it and nothing comes off. &ldquo;Already as sharp as it goes. Her card says one exact word does the work of two vague ones. Where are two vague words?&rdquo;'); return; }
        open = open === id ? null : id; draw(); msg('Choose the offcut that says it in one exact word, with nothing vague left.'); return;
      }
    });
    foot.querySelector('#hand').addEventListener('click', function () {
      if (done) return;
      function bad(id, t) { ER.sfx.no(); var n = lock.querySelector('.st[data-s="' + id + '"]'); if (n) n.classList.add('bad'); msg(t); }
      var i, id;
      if (st.cut.s7) { bad('s7', '&ldquo;The green fingers are still ' + (st.sawn7 ? 'sawn off' : 'crossed out') + ',&rdquo; says Martin. &ldquo;Mum&rsquo;s note says it&rsquo;s the plant, and Bernice says put it back.&rdquo;'); return; }
      for (i = 0; i < ORIG.length; i++) {
        id = ORIG[i];
        if (st.cut[id] && !ER.check('cut', id)) { bad(id, KEEPWHY[id] || 'Martin shakes his head. &ldquo;Nobody asked for that one to go.&rdquo;'); return; }
      }
      for (i = 0; i < ORIG.length; i++) {
        id = ORIG[i];
        if (!st.cut[id] && ER.check('cut', id)) {
          bad(id, id === 's4' ? '&ldquo;Bernice says nobody needs your life story in the first paragraph,&rdquo; says Martin. &ldquo;How old she is, how long she&rsquo;s had the hut. Nothing has happened yet.&rdquo;' : '&ldquo;Bernice says an explained joke is a dead joke,&rdquo; says Martin. &ldquo;And there&rsquo;s Mum in the margin saying the same.&rdquo;');
          return;
        }
      }
      if (!st.pl) { bad('s8', '&ldquo;That word she hates is still in there,&rdquo; says Martin, &ldquo;with &lsquo;very&rsquo; for company. Try the plane.&rdquo;'); return; }
      if (!ER.check('pl', st.pl)) {
        bad('s8', { b: '&ldquo;Extremely is only very in a better coat,&rdquo; says Martin. &ldquo;Still two vague words where one exact one would do.&rdquo;', c: '&ldquo;Suddenly&rsquo;s still there,&rdquo; says Martin. &ldquo;Her card says every suddenly goes.&rdquo;', d: '&ldquo;Now it&rsquo;s three vague words instead of two,&rdquo; says Martin. &ldquo;That&rsquo;s not planing, that&rsquo;s gluing.&rdquo;' }[st.pl]);
        return;
      }
      var live = st.order.filter(function (k) { return !st.cut[k]; }), p = live.indexOf('s7'), prev = p > 0 ? live[p - 1] : '';
      if (!ER.check('s7at', prev)) {
        var girl = live.indexOf('s9');
        bad('s7', p < girl ? '&ldquo;Her school,&rdquo; says Martin. &ldquo;Whose? When that line comes, nobody in the paragraph is a &lsquo;her&rsquo; yet. Put it after somebody it can belong to.&rdquo;' : '&ldquo;It belongs to the girl,&rdquo; says Martin. &ldquo;Put it right after her, before anything else gets in between.&rdquo;');
        return;
      }
      var rest = live.filter(function (k) { return k !== 's7'; }), want = ORIG.filter(function (k) { return rest.indexOf(k) >= 0; });
      for (i = 0; i < rest.length; i++) if (rest[i] !== want[i]) { bad(rest[i], '&ldquo;Mum only asked for one line to move,&rdquo; says Martin. &ldquo;Put the others back in the order she wrote them.&rdquo;'); return; }
      var cand = live.map(function (k) { return k === 's8' ? 's8' + st.pl : k; }).join('.');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The vice will not close. Something is wrong with this page: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('b-file', file);
      HT.sfx.plane();
      msg('Martin clamps the page, runs his thumb along it, and nods. &ldquo;Fits.&rdquo;');
      setTimeout(function () { ER.closeAll(); solved(); }, 2200);
    });
    draw();
    msg('Choose a tool on the left, then click a line. Nothing is final until you hand it to Martin.');
    ER.open('ov-lock', wrap);
  }

  function solved() {
    var FIN = 'Somebody had sharpened my pencils. All six lay in a row on my desk, points to the window, like soldiers waiting for orders. I had left them blunt. I always leave them blunt; sharpening them is how I start. Nothing was missing. My mug, which I had left dirty, was clean and upside down on the shelf. I shivered. Up at the house my son would be eating toast, his wife would be reading the last page of a book she had not started, the boy would be hoping for an earthquake, and the girl would be saying nothing. Her school makes them correct their own work in green, and her fingers were green to the knuckle. I counted my biscuits. Fourteen. Whoever came into my hut at night did not come for biscuits.';
    HT.mine('planed', 'The loose page, planed', '<p>' + FIN + '</p><p>CUT: the life story (nobody needs it yet) and the explained joke. SHARPENED: &ldquo;Suddenly I felt very cold&rdquo; became &ldquo;I shivered&rdquo;. STET and MOVED: the green fingers, put back after the girl, because &ldquo;her school&rdquo; needs a girl in front of it. KEPT: the mug and the biscuits. Never cut a clue you cannot explain yet.</p>');
    HT.terms(['revise', 'cut', 'sharpen', 'STET', 'plant']);
    paint(); busy = true;
    ER.narrate([
      'Martin reads the page aloud, slowly, the way he reads instructions for a flat-pack wardrobe. &ldquo;&hellip;and the girl would be saying nothing. Her school makes them correct their own work in green, and her fingers were green to the knuckle.&rdquo; He stops. &ldquo;That&rsquo;s good, that. I don&rsquo;t know what it&rsquo;s a plant for. But it&rsquo;s good.&rdquo;',
      '&ldquo;Who wrote STET in green, though?&rdquo; He looks at the margin. &ldquo;Not me. I don&rsquo;t do Latin.&rdquo; &ldquo;Bernice, probably,&rdquo; says Phoebe, very quickly. &ldquo;Editors do that.&rdquo;',
      'The rain stops as suddenly as it started. (Gran would cut that &ldquo;suddenly&rdquo;.) &ldquo;Your mum&rsquo;s got the typed carbon in the greenhouse,&rdquo; Martin tells Phoebe. &ldquo;She says it&rsquo;s full of irony. She means it&rsquo;s full of holes.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
