      '<p>How we know: every note in a margin is an order to the next draft. The exercise book says START with the pencils, cut the weather, change the names, and the typed page does all three. The typed page says Roles only, and the loose page has no names.</p>' +
      '<p>What changed: CUT the weather and &ldquo;suddenly&rdquo;; MOVED the pencils from the last line to the first; SHARPENED the names into roles; and the green fingers were CUT and then wanted back (STET).</p>');
    HT.terms(['draft', 'revise', 'cut', 'sharpen', 'margin note', 'carbon copy']);
    paint(); busy = true;
    ER.narrate([
      '&ldquo;Exercise book, carbon, loose page,&rdquo; says Phoebe. &ldquo;February, May, September. The neatest one is the middle one: she went back to pencil when the ribbon ran out.&rdquo;',
      '&ldquo;And look what she did between them. Cut the weather. Moved the pencils from the last line to the first, where you can&rsquo;t miss them. Changed the names, then took the names out altogether. And she cut the green fingers, and then she wanted them back.&rdquo; Phoebe stops, and starts again. &ldquo;Somebody wrote STET by them, anyway.&rdquo;',
      '&ldquo;The loose page isn&rsquo;t finished, though. Look at the notes in its margin. And Gran wants it gone over before Monday.&rdquo; She pulls its pin out and hands it to you. &ldquo;Dad&rsquo;s got the spare copy in his shed, but this is the one with the notes on. Bring it. Dad says revision is joinery. Don&rsquo;t tell him I told you that.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
