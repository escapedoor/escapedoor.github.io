    clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);box-sizing:border-box}
  .lab i{display:block;font-style:normal;font-family:'Outfit',sans-serif;font-size:10.5px;letter-spacing:.1em;color:#7a7a72;margin-top:2px}

  .pack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px;padding:8px;min-height:60px;background:#c8b088;border:2px dashed #4a3420;cursor:pointer}

  .ov-lock .pz-foot .btn{color:#1c2a1c;background:rgba(244,250,238,.92);border-color:#2f7a3e}

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  HT.put('#ali', 'alison', { h: 340, armR: 'up', armL: 'front' });
  HT.put('#ph', 'phoebe', { h: 318 });

  ER.init({
    theme: 'lit', story: 'hut', storyTitle: 'The Fourth Draft', id: 'glass', no: 'III', title: 'The Greenhouse',
    go: 'Along the path',
    intro: [
      'You planed the loose page until it fitted. Two cuts: the life story (nobody needs it yet) and the explained joke (an explained joke is a dead joke). One exact word for &ldquo;Suddenly I felt very cold&rdquo;: I shivered. And the green fingers got their STET, and moved to just after &ldquo;the girl&rdquo;, because &ldquo;her school&rdquo; needs a girl in front of it. You kept the mug and the biscuits: you cannot cut a clue before you know what it is for.',
      'The shower has passed. Alison Gosling&rsquo;s greenhouse stands on the sunny side of the garden, steaming gently, with one pane of glass mended with cardboard.'
    ],
    exit: {"next":"attic","w":{"3fd304f5":"c8b43ad0"}}, tags: {"L1":["12f4803b"],"L2":["f99fc6d5"],"L3":["26b2953b"],"L4":["620d08e9"],"L5":["4e902c24"],"L6":["d273bfde"],"L7":["52013c32"],"L8":["8d882f08"],"L9":["a792ac86"],"L10":["64865e46"],"L11":["75a152c1"]},
    hints: hints, onBegin: begin
  });

  told = HT.told('c-told'); nextFile = ER.flag('c-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('ali') && told.has('ho'); }
  function paint() {
    $('#ali').classList.toggle('ready', !told.has('ali'));
    $('#ho').classList.toggle('ready', told.has('ali') && !told.has('ho'));
    $('#trays').classList.toggle('ready', ready() && !nextFile);
    ER.pips((told.has('ali') ? 1 : 0) + (told.has('ho') ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['Every label is in its tray. The button at the bottom of the screen takes you up to the attic.', 'If you cannot see the button, close whatever is open (the Escape key) and look at the bottom of the screen.']];
    if (lock && document.body.contains(lock)) return ['trays', [
      'For each label, ask the handout&rsquo;s question: who expected what? Somebody saying the opposite of what they mean: verbal. What happens is the opposite of what was planned: situational. We know something a character does not: dramatic. Only chance: not irony.',
      'Two labels are things people say and mean: Martin&rsquo;s &ldquo;you never notice&rdquo; and Elliot&rsquo;s &ldquo;nobody knows&rdquo;. The irony is not in their words. It is in what we know and they do not.',
      'There are three of each kind of irony, and two that are not irony at all: the shop shut for the holidays, and the shared birthday. In Romeo and Juliet we know more than Romeo. In The Gift of the Magi each plan undoes the other.'
    ]];
    if (!ready()) return ['look', [
      'Alison is by the tomatoes on the right: talk to her.',
      'Gran&rsquo;s handout about irony is pinned to the greenhouse door on the left. Read it. Then click the seed trays on the staging.'
    ]];
    return ['trays', ['Everything is read. Click the four seed trays in the middle of the staging.', 'They are the black trays with white labels in them, between the watering can and the flowerpot.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Eleven labels, in four trays. Alison is watering them, which makes no difference at all.'); return; }
    if (told.has('in')) { busy = false; ER.say('The greenhouse, warm and green, dripping.'); return; }
    told.set('in');
    ER.narrate([
      'Inside it is warm and green and smells of tomato leaves. Tomato plants climb their canes almost to the roof. On the long slatted staging: four seed trays, a watering can, a notepad, and the thin grey carbon, held down by a flowerpot.',
      'Alison Gosling is in yellow gardening gloves, tying up a tomato that does not want to be tied. She works in the pharmacy at the hospital, and she reads the end of every book first.',
      '&ldquo;Hello, first reader,&rdquo; she says. &ldquo;Has Phoebe told you I want a burglar? I do. A burglar can be caught. You can&rsquo;t put a lock on a ghost.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  var HO = '<p class="hh">Thursday writing group &middot; handout 6 &middot; M. J. Gosling</p><h4>THREE KINDS OF IRONY</h4>' +
    '<p>Irony is a gap: between what is said and what is meant, or between what is expected and what is.</p>' +
    '<p><b>Verbal irony</b> is saying the opposite of what you mean. &ldquo;Lovely weather,&rdquo; in a hailstorm. When it is meant to hurt, it is called sarcasm.</p>' +
    '<p><b>Situational irony</b> is when the opposite of what was expected happens. The fire station burns down. The man who buys a better lock for his treasure locks himself out of it.</p>' +
    '<p><b>Dramatic irony</b> is when the reader knows something that a character does not. We have seen the letter go into his pocket; he is turning the house upside down to find it.</p>' +
    '<p><b>Not irony:</b> bad luck, or a coincidence. Rain on your picnic is weather. It becomes irony only if you chose the day because it never rains.</p>' +
    '<p class="rule">Twists are built out of irony. Ask: who expected what?</p>' +
    '<p class="back">On the back, in capitals: WATERING ROTA. Mon M. Tue A. Wed E (ha!). Thu P. Fri A. Sat whoever is here. Sun MARJORIE (she won&rsquo;t).</p>';
  $('#ho').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: HO, cls: 'ho', clue: { id: 'irony', title: 'Three kinds of irony', kind: 'Handout' }, done: function () {
      HT.terms(['irony', 'verbal irony', 'situational irony', 'dramatic irony', 'sarcasm', 'coincidence']);
      if (told.set('ho')) { paint(); ER.say('&ldquo;She gave that to her Thursday group,&rdquo; says Alison. &ldquo;I use the back for the watering rota. Nobody follows it. That&rsquo;s probably irony too.&rdquo;'); }
    } });
  });
  $('#ali').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Elliot&rsquo;s in the attic,&rdquo; says Alison. &ldquo;Take him a biscuit. Not one of Marjorie&rsquo;s: she counts them.&rdquo;'); return; }
    ER.talk({
      who: 'Alison Gosling', role: 'Martin&rsquo;s wife · hospital pharmacist', face: window.FACE('alison'),
      lines: [
        { note: 'Alison is brisk, kind, and dry enough to strike a match on.', a: '&ldquo;I read the carbon out here last night, among the tomatoes. Marjorie doesn&rsquo;t mind. Well. She minds, but she says she doesn&rsquo;t, which is nearly the same.&rdquo;' },
        { q: 'Why a burglar?', a: '&ldquo;Because a burglar is the kind of trouble you can do something about. You ring the police. You fit a lock. And then she moves her desk up to the spare room, where it&rsquo;s warm, and nobody has to walk down a dark garden at eleven o&rsquo;clock to look at a stove.&rdquo; She glances up the garden at the shed.' },
        { q: 'Do you really read the end first?', a: '&ldquo;Always. I can&rsquo;t enjoy the middle of anything until I know how it ends. Marjorie thinks it&rsquo;s cheating. I think it&rsquo;s good sense.&rdquo;' },
        { q: 'Has there really been a burglar?', a: '&ldquo;There was a smashed pane in August, and Elliot said he saw a man running away. Then we found his football under the tomatoes.&rdquo; She tightens a knot. &ldquo;So I bought a padlock for the hut, and Marjorie keeps the key under a flowerpot by the door. I put a smoke alarm in there as well. It has gone off once: when I made toast on her stove.&rdquo;' },
        { q: 'What is irony, exactly?', a: '&ldquo;Ask the handout,&rdquo; she says, nodding at the door. &ldquo;Marjorie says my note is full of irony. I said I meant every word. She said that was the irony.&rdquo;' }
      ],
      clue: { id: 'ali1', title: 'Alison, in the greenhouse', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('ali')) paint(); }
    });
  });
  $('#carbon').addEventListener('click', function () {
    if (busy) return;
    ER.say('The thin grey carbon of draft two, under a flowerpot, with a green correction on it. &ldquo;Somebody can spell,&rdquo; says Alison. &ldquo;It isn&rsquo;t Martin.&rdquo;');
  });
  $('#pane').addEventListener('click', function () {
    if (busy) return;
    HT.seed('pane', 'The cardboard pane', '<p>One pane of the greenhouse roof is cardboard, taped in. It was smashed in August. Elliot said he saw a burglar running away; his football was found under the tomatoes.</p>');
    ER.say('A pane of cardboard in the glass roof. &ldquo;Elliot&rsquo;s burglar,&rdquo; says Alison. &ldquo;Size five, black and white, answers to the name of Elliot.&rdquo;');
  });
  HT.thing('#pad', null, 'A notepad from the hospital pharmacy, the same as Alison&rsquo;s note under the hut door. She writes on everything in neat blue capitals.', isBusy);
  HT.thing('#can', 'watering can', 'A green watering can, half full of rainwater.', isBusy);
  HT.thing('#toms', 'tomato', 'Tomatoes, red and green, on canes as tall as the roof. &ldquo;The last of them,&rdquo; says Alison. &ldquo;Then I&rsquo;ll make chutney, and nobody will eat it.&rdquo;', isBusy);
  HT.thing('#ph', null, function () { return 'Phoebe is reading the handout on the door for the second time, very carefully, as if it might change.'; }, isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#trays').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Eleven labels, in four trays.'); return; }
    if (!ready()) { ER.say('&ldquo;Read the handout first,&rdquo; says Alison, pointing at the door with a tomato. &ldquo;And talk to me. I&rsquo;m the only one in this family who answers questions.&rdquo;'); return; }
    openLock();
  });

  /* ---------- the lock: eleven labels, four trays ---------- */
  var LB = [
    ['L1', 'Marvellous: just what a woman of seventy-eight needs, a stranger in her hut at midnight.', 'Alison&rsquo;s note', 'Read it aloud. Does Alison think a stranger at midnight is marvellous? When the words mean the opposite of what is meant, that is a way of speaking.'],
    ['L2', 'The fox: &ldquo;Do help yourself,&rdquo; I told him last June, when he had eaten every strawberry through the net.', 'draft one, page two', '&ldquo;Do help yourself,&rdquo; to a fox who has eaten every strawberry. Does she want him to? Set what she says against what she means.'],
    ['L3', 'Oh, brilliant, another ending where everybody has a nice cup of tea.', 'Elliot&rsquo;s note', 'Elliot calls it brilliant. Read the next two words of his note: &ldquo;Please no.&rdquo; Does he mean brilliant?'],
    ['L4', 'The smoke alarm Alison put in the hut has gone off once: when Alison made toast.', 'the hut', 'The alarm was put there to keep the hut safe from fire. Who set it off, and how? What was expected, and what happened?'],
    ['L5', 'Martin built the hut so that his mother could be alone. Now it is the busiest room in the house.', 'the garden', 'Why was the hut built, and what has it turned into? Set the plan against what happened.'],
    ['L6', 'Della sells her hair to buy a chain for Jim&rsquo;s watch. Jim sells his watch to buy combs for her hair.', 'O. Henry, The Gift of the Magi (1905)', 'Each of them plans the perfect present, and each plan makes the other&rsquo;s present useless. Is that something somebody says, something only the reader knows, or the opposite of what was planned?'],
    ['L7', '&ldquo;I know you never notice anything once you&rsquo;re in this hut.&rdquo; (Gran&rsquo;s note had already counted his biscuits.)', 'Martin&rsquo;s note', 'Martin means every word: he is not being ironic himself. But you have read Gran&rsquo;s note, and he has not. Who knows more here: Martin, or the reader?'],
    ['L8', '&ldquo;Nobody knows, I put it back exactly how I found it.&rdquo; (Gran&rsquo;s note had already told him to put it back the right way up.)', 'Elliot&rsquo;s note', 'Elliot means it. But Gran&rsquo;s note has already told him to put the exercise books back the right way up. Who knows more: Elliot, or us?'],
    ['L9', 'Romeo thinks Juliet is dead. We know she has only taken a drug that makes her sleep.', 'Shakespeare, Romeo and Juliet', 'Romeo does not know what the audience knows. When the audience knows more than a character, which kind is it?'],
    ['L10', 'The typewriter ribbon ran out in August, and the shop that sells ribbons was shut for the holidays.', 'the hut', 'A shop shut for the holidays is bad luck. Nobody planned the opposite, and nobody is saying anything. The handout has a tray for that.'],
    ['L11', 'Gran and Phoebe were born on the same day of the year: the third of March.', 'the family', 'Two people born on the same day: a coincidence. Nobody expected anything, and nobody says the opposite of what they mean.']
  ];
  var TR = [['v', 'VERBAL', 'saying the opposite of what you mean'], ['s', 'SITUATIONAL', 'the opposite of what was expected'], ['d', 'DRAMATIC', 'the reader knows; a character does not'], ['n', 'NOT IRONY', 'bad luck, coincidence']];
  function openLock() {
    var put = ER.flag('c-put') || {}, held = null, done = false;
    lock = ER.el('div', 'sow');
    var h = '<h5>Alison&rsquo;s seed trays &middot; which kind of irony is each label?</h5><div class="trays">';
    TR.forEach(function (t) { h += '<div class="tr" data-t="' + t[0] + '"><b>' + t[1] + '</b><small>' + t[2] + '</small><div class="in"></div></div>'; });
    h += '</div><div class="pack"></div>';
    lock.innerHTML = h;
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="water">Hand them to Alison</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg'), pack = lock.querySelector('.pack'), nodes = {};
    function msg(t) { m.innerHTML = ER.gloss(t); }
    HT.mix(LB, 23).forEach(function (l) { var b = ER.el('button', 'lab', l[1] + '<i>' + l[2] + '</i>'); b.type = 'button'; b.setAttribute('data-l', l[0]); nodes[l[0]] = b; });
    function draw() {
      Object.keys(nodes).forEach(function (k) {
        var at = put[k] ? lock.querySelector('.tr[data-t="' + put[k] + '"] .in') : pack;
        if (nodes[k].parentNode !== at) at.appendChild(nodes[k]);
        nodes[k].classList.toggle('held', held === k);
      });
      ER.$$('.tr', lock).forEach(function (t) { t.classList.toggle('want', !!held); });
    }
    function clearBad() { ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); }); }
    lock.addEventListener('click', function (e) {
      if (done) return;
      var l = e.target.closest('.lab'), tr = e.target.closest('.tr');
      if (l && held && tr && l.getAttribute('data-l') !== held) { put[held] = tr.getAttribute('data-t'); held = null; HT.sfx.pot(); ER.flag('c-put', put); clearBad(); draw(); return; }
      if (l) { var id = l.getAttribute('data-l'); held = held === id ? null : id; ER.sfx.paper(); clearBad(); draw(); return; }
      if (tr && held) { put[held] = tr.getAttribute('data-t'); held = null; HT.sfx.pot(); ER.flag('c-put', put); clearBad(); draw(); return; }
      if (e.target.closest('.pack') && held) { delete put[held]; held = null; ER.flag('c-put', put); draw(); return; }
      if (tr) msg('First click a label, then the tray it grows in.');
    });
    foot.querySelector('#water').addEventListener('click', function () {
      if (done) return;
      clearBad();
      var left = LB.filter(function (l) { return !put[l[0]]; }).length, i;
      if (left === LB.length) { ER.sfx.no(); msg('The trays are empty. Click a label, then the tray it grows in.'); return; }
      if (left) { ER.sfx.no(); msg('&ldquo;All of them,&rdquo; says Alison. &ldquo;I don&rsquo;t leave labels lying about: things get planted in the wrong place.&rdquo; ' + left + (left === 1 ? ' label is' : ' labels are') + ' still in the packet.'); return; }
      for (i = 0; i < LB.length; i++) {
        if (!ER.check(LB[i][0], put[LB[i][0]])) { ER.sfx.no(); nodes[LB[i][0]].classList.add('bad'); msg(LB[i][3] + ' (Alison only ever points at the first label that is wrong.)'); return; }
      }
      var cand = LB.map(function (l) { return l[0] + put[l[0]]; }).join('/');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The labels will not go in. Something is wrong with this page: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('c-file', file);
      HT.sfx.pot();
      msg('Alison pushes every label firmly into the soil and waters the lot, out of habit.');
      setTimeout(function () { ER.closeAll(); solved(); }, 2200);
    });
    draw();
    msg('Click a label, then the tray it belongs in. Click a label in a tray to pick it up again, and the packet to put it back.');
    ER.open('ov-lock', wrap);
  }

  function solved() {
    HT.mine('ironies', 'Eleven labels, four trays', '<p>VERBAL (the opposite of what is meant): Alison&rsquo;s &ldquo;Marvellous&rdquo;; &ldquo;Do help yourself&rdquo; to the fox; Elliot&rsquo;s &ldquo;brilliant&rdquo;.</p>' +
      '<p>SITUATIONAL (the opposite of what was expected): the smoke alarm and Alison&rsquo;s toast; the hut built for peace, now the busiest room; Della&rsquo;s hair and Jim&rsquo;s watch.</p>' +
      '<p>DRAMATIC (we know, they do not): Martin&rsquo;s &ldquo;you never notice&rdquo;; Elliot&rsquo;s &ldquo;nobody knows&rdquo;; Romeo at Juliet&rsquo;s side.</p>' +
      '<p>NOT IRONY: a shop shut for the holidays (bad luck); a shared birthday (coincidence).</p><p>Twists are built out of irony. Ask: who expected what?</p>');
    HT.terms(['irony', 'verbal irony', 'situational irony', 'dramatic irony', 'coincidence']);
    paint(); busy = true;
    ER.narrate([
      '&ldquo;Eleven labels, four trays,&rdquo; says Alison, peeling off her gloves. &ldquo;Twists are built out of irony, Marjorie says. So which tray will her twist grow in? We won&rsquo;t know that until we know the twist.&rdquo;',
      'She looks at Phoebe. &ldquo;You&rsquo;re very quiet, Phoebe. You&rsquo;re never quiet unless you&rsquo;ve done something.&rdquo; &ldquo;I&rsquo;m thinking,&rdquo; says Phoebe. &ldquo;People do.&rdquo;',
      '&ldquo;The exercise book is in the attic,&rdquo; says Alison. &ldquo;Draft one, the whole of it. Elliot&rsquo;s up there reading it for the third time and telling everybody he isn&rsquo;t.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>

</html>
