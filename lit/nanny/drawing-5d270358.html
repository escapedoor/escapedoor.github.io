  .acc{position:relative;padding:10px 14px 10px;background:#4a1418;background-image:radial-gradient(circle at 50% 40%,#6a2228,#3a0e12);border:1px solid #1a0406;box-shadow:0 26px 70px rgba(0,0,0,.7)}

  .st.held{outline:3px solid #e0b860;outline-offset:1px}
  .st.pick{outline:3px dashed #ff6a4a;outline-offset:1px}
  .st.out{text-decoration:line-through;text-decoration-color:#c8221a;text-decoration-thickness:2px}
  .st em{position:absolute;right:4px;bottom:2px;padding:0 5px;font-style:normal;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;color:#c8221a;border:1.5px solid #c8221a;background:rgba(255,255,255,.85);transform:rotate(-3deg)}
  .thr{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .thr path{fill:none;stroke:#ff3a2a;stroke-width:3;opacity:.9}
  .thr circle{fill:#ff3a2a}
  .why{display:none;gap:8px;justify-content:center;margin-top:8px}
  .why.on{display:flex}
  .why .btn{background:rgba(0,0,0,.35)}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#fel').innerHTML = NY.as('felicity', { h: 330, armR: 'out' });

  ER.init({
    theme: 'lit', story: 'nanny', storyTitle: 'Everything Is Somewhere', id: 'drawing', no: 'IV', title: 'The Drawing Room',
    go: 'Open the forbidden door',
    intro: [
      'In the kitchen you did four sayings word for word, for a boy who believes them: you put the storm in a teacup, stopped the ears of the wall with a tea cosy, let the cat out of the bag (he had been asleep on the tablecloths), and turned over a new leaf on the calendar. And Digby told everything: at three minutes to seven he stopped the hall clock, so that bedtime would never come. He left its door open. The glass was whole.',
      'Father&rsquo;s drawing room is on the first floor, and children are not allowed in it. Felicity opens the door anyway. &ldquo;If we are going to be in trouble,&rdquo; she says, &ldquo;we may as well be in trouble properly.&rdquo;'
    ],
    exit: {"next":"hall","w":{"8272010a":"317981d4","e18c9719":"4d75b927","609e5b5a":"4855494d","6e158e61":"19126170"}}, tags: {"clash":["b5e9f8e1","12019c1d","bc582073","78a45d0a","15ff9afc"],"clock":["3a12268d"],"fancy":["41e9055a"],"guess":["e30c47ab"],"agree":["05e8ff6d","1d3bcfbd","03246613","db851704","6ed740f8","6344b1e7","54b88219","03fad1c6","d325d81f"],"wrong":["e400fbf7","e968abbb","e50027ca"],"b":["2b2c17a2","0c1d0a9b"],"m":["9426085c"]},
    hints: hints, onBegin: begin
  });

  told = NY.told('d-told'); nextFile = ER.flag('d-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('moon') && told.has('scrap') && told.has('scope'); }
  function paint() {
    $('#moon').classList.toggle('ready', !told.has('moon'));
    $('#scrap').classList.toggle('ready', told.has('moon') && !told.has('scrap'));
    $('#scope').classList.toggle('ready', told.has('scrap') && !told.has('scope'));
    $('#table').classList.toggle('ready', ready() && !nextFile);
    var n = ['moon', 'scrap', 'scope', 'tube', 'dclock'].filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0);
    ER.pips(n, 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The three clashes are found. The button at the bottom of the screen goes down to the hall, where the second post has just come.']];
    if (lock && document.body.contains(lock)) return ['clash', [
      'Look for two sentences, on two different papers, that cannot both have happened. Begin with the crash: where was Miss Inkster when it came, by each account?',
      'There are three clashes: where Miss Inkster was when the glass broke; what the crash was; and whether the front door was somebody going out or somebody coming in. Mrs Spink&rsquo;s &ldquo;five to eleven&rdquo; against &ldquo;10.50&rdquo; is not one of them: remember her clock.',
      'Tie Felicity&rsquo;s &ldquo;beside me, holding my hand&rdquo; to Mrs Spink&rsquo;s &ldquo;She broke it&rdquo;; Felicity&rsquo;s &ldquo;the comet&rsquo;s tail&rdquo; to the register&rsquo;s &ldquo;one pane of glass&rdquo;; Mrs Spink&rsquo;s &ldquo;her follower, going out&rdquo; to the register&rsquo;s &ldquo;opened from outside, with a key&rdquo;. In each, click the sentence that is wrong, then say why: Felicity misunderstood, Mrs Spink saw what she wanted to see.'
    ]];
    if (!ready()) return ['look', [
      'Two things here must be read: the card inside the red book in the bookcase, and what lies open on Father&rsquo;s bureau, just below the books.',
      'Look at the telescope by the window as well. Then click the three papers on the round table.'
    ]];
    return ['clash', ['Everything is read. Click the papers on the round table in the middle of the room.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Three red threads still lie across the papers on the round table.'); return; }
    if (told.has('in')) { busy = false; ER.say('Father&rsquo;s drawing room, where children are not allowed.'); return; }
    told.set('in');
    ER.narrate([
      'The drawing room is dark red and very tidy: an aspidistra in a brass pot, a piano that nobody plays, a gilt mirror over the fireplace, a bookcase with a bureau below it, and a round table with a fringed cloth.',
      'By the tall window stands a brass telescope on three legs. Beside the fireplace, on the wall, is the top end of the speaking tube, with a whistle in its mouth.',
      'Felicity spreads three papers on the round table: her diary, the register, and Mrs Spink&rsquo;s letters. &ldquo;Three people told one night,&rdquo; she says. &ldquo;Somewhere they cannot all be true. There is a book about exactly this in Father&rsquo;s bookcase. The red one. I am not allowed to read it, so I have only read the first chapter.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var MOON = '<h4>The Moonstone, by Wilkie Collins (1868)</h4>' +
    '<p>A great diamond vanishes from a country house in one night. Collins does not tell the story himself. He lets several people tell it, one after another, and each of them may write only what <b>he or she saw</b>. One of them, Miss Clack, is so sure of her own goodness that the reader learns to believe nearly the opposite of what she says.</p>' +
    '<p><b>How to read several narrators:</b></p><p>&middot; Where they <b>agree</b>, it is probably true.</p><p>&middot; Where two of them <b>cannot both be true</b>, at most one is right.</p>' +
    '<p>&middot; Trust a narrator on what she saw and heard. Do not trust her on what she thinks it meant.</p>' +
    '<p>&middot; A difference in words is not always a clash. &ldquo;A giant&rdquo; and &ldquo;a man&rdquo; may be the same feet on the stairs.</p><p>F. H. (I only read the first chapter.)</p>';
  var SCRAP = '<h4>Comet, 1910. G. H.</h4>' +
    '<span class="cut"><i>12.iv.10</i>HALLEY&rsquo;S COMET. The famous comet, last seen in 1835, is now on its way back towards the Sun.</span>' +
    '<span class="cut"><i>3.v.10</i>THE COMET may now be seen before dawn, low in the east, by those who are willing to rise early.</span>' +
    '<span class="cut"><i>17.v.10</i>THE EARTH AND THE TAIL. On the night of Wednesday the 18th the Earth will pass through the tail of the comet. Nothing remarkable is expected to be seen.</span>' +
    '<p class="pencil">Thu. 19th. 2.15 a.m. Nothing whatever to be seen. G. H.</p>';

  $('#moon').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MOON, cls: 'bm', clue: { id: 'moon', title: 'The Moonstone: several narrators', kind: 'In Father&rsquo;s bookcase' }, done: function () {
      NY.terms(['account', 'clash', 'witness']);
      if (told.set('moon')) { paint(); ER.say('&ldquo;Miss Clack,&rdquo; says Felicity darkly. &ldquo;We have one of those downstairs.&rdquo;'); }
    } });
  });
  $('#scrap').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SCRAP, cls: 'scrap', clue: { id: 'scrap', title: 'Father&rsquo;s comet scrapbook', kind: 'On the bureau' }, done: function () {
      if (told.set('scrap')) { paint(); ER.say('&ldquo;FATHER?&rdquo; says Felicity. &ldquo;Father, who said the comet could manage without us? He has been cutting it out of the paper since April.&rdquo;'); }
    } });
  });
  $('#scope').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'telescope');
    NY.seed('scope', 'Father&rsquo;s telescope', '<p>A brass telescope on three legs, by the drawing-room window. Its brass feet are black with soot, as if they had stood among chimney pots, and there is a dried ring of dew on the big lens. Father says it is for checking the church clock across the square, through the window.</p>');
    if (told.set('scope')) paint();
    ER.say('Father&rsquo;s brass telescope. Its three brass feet are black with soot, as if they had stood among chimney pots, and there is a dried ring of dew on the big lens. &ldquo;He says it is for checking the church clock,&rdquo; says Felicity. &ldquo;Through the window. Indoors.&rdquo;');
  });
  $('#tube').addEventListener('click', function () {
    if (busy) return;
    if (told.set('tube')) paint();
    NY.terms(['speaking tube']);
    ER.say('The top end of the speaking tube. Put your ear to it and you can hear, very faintly and through something woolly, the kitchen: a spoon, a kettle, Mrs Spink humming. &ldquo;So that is how Cook hears everything,&rdquo; says Felicity. &ldquo;The walls really have got ears.&rdquo;');
  });
  $('#dclock').addEventListener('click', function () {
    if (busy) return;
    if (told.set('dclock')) paint();
    ER.say('Father&rsquo;s gilt clock on the mantelpiece: ten to twelve, exactly, by the church across the square. Father sets it every Sunday, from his watch.');
  });
  NY.thing('#photo', null, 'A photograph of a small, solemn boy in a sailor suit, holding a toy railway engine as if it were the crown jewels. On the back, in green ink: G. H., aged seven.', isBusy);
  NY.thing('#asp', 'aspidistra', 'An aspidistra: the plant that will grow anywhere, even in a drawing room where nobody laughs.', isBusy);
  NY.thing('#piano', null, '&ldquo;Mother played it,&rdquo; says Felicity, and does not say anything else.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#table').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Three threads, three crossed-out sentences.'); return; }
    if (!ready()) { ER.say('&ldquo;Not yet,&rdquo; says Felicity. &ldquo;Look round first. The red book in the bookcase. Father&rsquo;s bureau. And the telescope.&rdquo;'); return; }
    openLock();
  });

  /* ---------- the lock: three accounts side by side; three clashes; who is wrong, and why ---------- */
  var ST = {
    d: ['Felicity&rsquo;s diary', [
      ['d1', 'At five to seven Digby crept out, and came back saying it could never be seven o&rsquo;clock now.'],
      ['d2', 'At twenty-five past ten Miss I. woke us, and we went up the ladder to the roof.'],
      ['d3', 'When the great crash came, she was beside me, holding my hand.'],
      ['d4', 'The crash was the comet&rsquo;s tail hitting the house, I am sure.'],
      ['d5', 'She went down, and came back in four minutes exactly.'],
      ['d6', 'Long after, a giant came up through our room to the roof.']]],
    r: ['Miss Inkster&rsquo;s register', [
      ['r1', '6.57 pm. The time of this house: stopped. Stopped by: &mdash;'],
      ['r2', '8.10 pm. The roof key, borrowed from Mrs Spink.'],
      ['r3', '10.50 pm. The front door, opened from outside, with a key.'],
      ['r4', '10.50 pm. One temper, lost in the hall. Damage: one pane of glass.'],
      ['r5', '10.51 pm. The nanny went down, saw, and came back up.'],
      ['r6', '2.10 am. The hatch opened from below. Heavy feet.']]],
    c: ['Mrs Spink&rsquo;s letter', [
      ['c1', 'Ten past eight she comes down for the roof key, bold as brass.'],
      ['c2', 'At five to eleven by my clock I heard the front door go.'],
      ['c3', 'That was her follower, going out.'],
      ['c4', 'Up I went, and there she was on the stairs with her candle, and glass all over the hall.'],
      ['c5', 'She broke it, Lizzie, as sure as I am sitting here.'],
      ['c6', 'At two in the morning, a man&rsquo;s tread on the stairs, going up.']]]
  };
  var KIND = { m: 'MISUNDERSTOOD', b: 'BIASED', l: 'LEFT OUT' };
  function openLock() {
    var lines = ER.flag('d-lines') || [], held = null, pend = null, done = false;
    lock = ER.el('div', 'acc');
    var h = '<h5>Three accounts of one night &middot; tie together two sentences that cannot both be true</h5><div class="cols">';
    ['d', 'r', 'c'].forEach(function (k) {
      h += '<div class="cl"><h6>' + ST[k][0] + '</h6>';
      ST[k][1].forEach(function (s) { h += '<button type="button" class="st ' + k + '" data-s="' + s[0] + '">' + s[1] + '</button>'; });
      h += '</div>';
    });
    h += '</div><svg class="thr"></svg><div class="why" id="why"><button type="button" class="btn" data-k="m">She misunderstood what she heard</button><button type="button" class="btn" data-k="b">She saw what she wanted to see</button><button type="button" class="btn" data-k="l">She left something out</button></div>';
    lock.innerHTML = h;
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="clr">Take the threads off</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg'), thr = lock.querySelector('.thr'), why = lock.querySelector('#why');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function node(id) { return lock.querySelector('.st[data-s="' + id + '"]'); }
    function key(a, b) { return [a, b].sort().join('-'); }
    function keep() { ER.flag('d-lines', lines); }
    function draw() {
      ER.$$('.st', lock).forEach(function (n) { var id = n.getAttribute('data-s'); n.classList.toggle('held', held === id); n.classList.toggle('pick', !!(pend && !pend.w && (pend.a === id || pend.b === id))); n.classList.remove('out'); var e = n.querySelector('em'); if (e) n.removeChild(e); });
      var R = lock.getBoundingClientRect(), s = '', all = lines.slice(); if (pend) all.push(pend);
      all.forEach(function (L) {
        var a = node(L.a), b = node(L.b); if (!a || !b) return;
        var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), left = ra.left < rb.left ? [ra, rb] : [rb, ra];
        var x1 = left[0].right - R.left, y1 = left[0].top + left[0].height / 2 - R.top, x2 = left[1].left - R.left, y2 = left[1].top + left[1].height / 2 - R.top, mx = (x1 + x2) / 2;
        s += '<path d="M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"' + (L.k ? '' : ' stroke-dasharray="7 5"') + '/><circle cx="' + x1 + '" cy="' + y1 + '" r="4"/><circle cx="' + x2 + '" cy="' + y2 + '" r="4"/>';
        if (L.k) { var w = node(L.w); w.classList.add('out'); w.appendChild(ER.el('em', '', KIND[L.k])); }
      });
      thr.innerHTML = s;
      why.classList.toggle('on', !!(pend && pend.w));
    }
    function finish(pre) {
      if (lines.length < 3) { msg(pre + (lines.length === 1 ? 'One clash found. Two more.' : 'Two clashes found. One more.')); return; }
      var cand = lines.map(function (L) { return key(L.a, L.b) + ':' + L.w + L.k; }).sort().join('/');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('Felicity frowns: the threads look right, but something is wrong with this page. Tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('d-file', file);
      msg('Three threads, three sentences crossed out. Felicity sits back on her heels and lets out a long breath.');
      setTimeout(function () { ER.closeAll(); window.removeEventListener('resize', draw); solved(); }, 2600);
    }
    function propose(a, b) {
      var k = key(a, b);
      if (a.charAt(0) === b.charAt(0)) { ER.sfx.no(); msg('Those are both on the same paper. Set one narrator against another.'); return; }
      if (ER.check('clash', k)) {
        for (var i = 0; i < lines.length; i++) if (key(lines[i].a, lines[i].b) === k || lines[i].a === a || lines[i].b === a || lines[i].a === b || lines[i].b === b) { ER.sfx.no(); msg('You have tied that clash already, from another sentence. Look for a different one.'); return; }
        pend = { a: a, b: b }; NY.sfx.thread(); draw();
        msg('A clash: these two cannot both be true. <b>Which of them is wrong?</b> Click it.');
        return;
      }
      ER.sfx.no();
      if (ER.check('clock', k)) msg('Five to eleven and ten to eleven: is that really a clash? Remember Mrs Spink&rsquo;s kitchen clock.');
      else if (ER.check('fancy', k)) msg('A giant, and a man&rsquo;s tread: the same heavy feet going up at about two. They agree about what was heard. They only guess differently about who, and neither of them saw.');
      else if (ER.check('guess', k)) msg('Those two cannot both be right, true. But neither is a thing its narrator saw: both are guesses about the same crash. Set each guess against something that was really seen or heard.');
      else if (ER.check('agree', k)) msg('These two agree. When two narrators agree, a thing becomes more likely, not less.');
      else msg('These two can both be true at once. A clash is two things that cannot both have happened.');
    }
    lock.addEventListener('click', function (e) {
      if (done) return;
      var st = e.target.closest('.st'), kb = e.target.closest('#why .btn');
      if (pend && pend.w && kb) {
        var kk = kb.getAttribute('data-k');
        if (ER.check(kk, pend.w)) {
          pend.k = kk; lines.push(pend); pend = null; keep(); NY.sfx.stamp(); draw();
          finish('Felicity crosses the sentence out and writes <b>' + KIND[kk] + '</b> beside it. '); return;
        }
        ER.sfx.no();
        if (kk === 'l') msg('A thing left out cannot clash with anything: it is a gap, not a mistake. Is this narrator young and puzzled by what she heard, or does she want it to be so?');
        else if (pend.w.charAt(0) === 'd') msg('Does Felicity dislike anybody in this house? She heard a real crash, in the dark, and did not know what it was.');
        else msg('Mrs Spink knows perfectly well what breaking glass sounds like, and what a front door is. But she has made up her mind about Miss Inkster. Which kind of narrator does that make her?');
        return;
      }
      if (!st) return;
      var id = st.getAttribute('data-s');
      if (pend && !pend.w) {
        if (id !== pend.a && id !== pend.b) { msg('Click one of the two sentences on this thread: the one that cannot be true.'); return; }
        if (!ER.check('wrong', id)) { ER.sfx.no(); msg('That one is a thing its narrator saw or heard for herself. Which of the two is a guess about what it meant?'); return; }
        pend.w = id; NY.sfx.pencil(); draw(); msg('<b>Why is it wrong?</b> Choose below.'); return;
      }
      if (pend && pend.w) { msg('First say why that sentence is wrong: choose one of the three below.'); return; }
      if (!held) { held = id; NY.sfx.pencil(); draw(); msg('Now click a sentence on another paper that cannot be true if this one is.'); return; }
      if (held === id) { held = null; draw(); msg('Click a sentence, then one on another paper that cannot both be true with it.'); return; }
      var a = held; held = null; draw(); propose(a, id);
    });
    foot.querySelector('#clr').addEventListener('click', function () { if (done) return; lines = []; pend = null; held = null; keep(); draw(); msg('All the threads are off. Click a sentence, then one on another paper that cannot both be true with it.'); });
    window.addEventListener('resize', draw);
    msg('Click a sentence, then one on another paper that cannot both be true with it. Three such clashes are hidden here.');
    ER.open('ov-lock', wrap);
    setTimeout(draw, 60); setTimeout(draw, 400);
  }

  function solved() {
    NY.mine('clashes', 'Three accounts, three clashes', '<p>1. Mrs Spink: &ldquo;She broke it.&rdquo; Felicity: when the crash came, Miss Inkster was beside her on the roof, holding her hand; the register: she went down after. Mrs Spink is biased: she came up afterwards, saw the candle, and decided.</p>' +
      '<p>2. Felicity: the crash was the comet&rsquo;s tail. The register: one pane of glass, in the hall. Felicity misunderstood what she heard.</p>' +
      '<p>3. Mrs Spink: the front door was her follower going out. The register: opened from outside, with a key. Biased again. Her &ldquo;five to eleven&rdquo; is ten to eleven: her clock is five minutes fast.</p>' +
      '<p>So: at 10.50 somebody came in at the front door, with a key, and lost a temper in the hall, and the glass broke. Not Miss Inkster.</p>');
    NY.terms(['account', 'clash', 'witness']);
    paint(); busy = true;
    ER.narrate([
      'Felicity looks at the three red threads and the three crossed-out sentences for a long time.',
      '&ldquo;So,&rdquo; she says. &ldquo;At ten to eleven Miss Inkster was on the roof, holding my hand. Somebody came IN at the front door, from outside, with a key. That somebody lost a temper in the hall, and the glass broke. Cook never saw it happen. She came up afterwards, found Miss Inkster with the candle, and decided.&rdquo;',
      '&ldquo;And I decided it was a comet.&rdquo; She goes pink. &ldquo;Wrong, biased, and leaving out. We have one of each.&rdquo;',
      'Downstairs the knocker goes twice: the second post. &ldquo;The register still leaves out the names,&rdquo; says Felicity. &ldquo;Three times. And Miss Inkster gave me three tickets. Come on.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
