<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#fel').innerHTML = NY.as('felicity', { h: 330, armR: 'front' });

  ER.init({
    theme: 'lit', story: 'nanny', storyTitle: 'Everything Is Somewhere', id: 'night', no: 'I', title: 'The Night Nursery',
    go: 'Up five flights of stairs',
    intro: [
      'London, Thursday 19 May 1910. The King is to be buried tomorrow, and your mother has sent you up from the country to stay with your Harbottle cousins for the week, so that you can see the procession.',
      'You reached No. 9 Ilbert Square at twenty to ten this morning. Your cousin Felicity was waiting on the steps. She took your bag out of your hand and said: &ldquo;Thank goodness. You are the only person in this house who was not here last night.&rdquo; Then she pulled you up five flights of stairs.'
    ],
    exit: {"next":"day","w":{"812f5de7":"7d7bab30"}}, tags: {"a":["b95c0168"],"b":["8c12e485"],"c":["eaa63aae"],"d":["a8ced551"],"e":["91cf807b"],"g":["2bb0f439"],"h":["cb469f19"],"j":["bd7cbdba"],"k":["c46600fb"],"m":["146eb505"],"n":["f2130cfc"],"q":["98ea5c3c"]},
    hints: hints, onBegin: begin
  });

  told = NY.told('a-told'); nextFile = ER.flag('a-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('memo') && told.has('fel') && told.has('diary') && told.has('pov'); }
  function paint() {
    $('#memo').classList.toggle('ready', !told.has('memo'));
    $('#fel').classList.toggle('ready', told.has('memo') && !told.has('fel'));
    $('#diary').classList.toggle('ready', told.has('fel') && !told.has('diary'));
    $('#exb').classList.toggle('ready', told.has('diary') && !told.has('pov'));
    $('#slips').classList.toggle('ready', ready() && !nextFile);
    var n = ['memo', 'fel', 'diary', 'pov', 'tt'].filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0);
    ER.pips(n, 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The slips are sorted. The button at the bottom of the screen takes you across the landing to the day nursery.']];
    if (lock && document.body.contains(lock)) return ['slips', [
      'Ask of every slip: who is telling it? If somebody says I or we, and is not inside speech marks, the teller is inside the story.',
      'If the teller says she or he, ask: does the sentence stay with one person, with only what she sees, hears and thinks? Then it is limited, like a lamp carried by one person. If it goes into two heads, or to a place where nobody from the house could be, it is all-knowing.',
      'There are four of each. Watch the tricky ones: an I inside speech marks is a character talking; a slip can begin with She and still be a first-person diary if I comes later; and Felicity can write about herself as she.'
    ]];
    if (!ready()) return ['look', [
      'Start with the typed sheet lying on the nearer bed: Father&rsquo;s memorandum. Then talk to Felicity, in front of the window.',
      'Read three things before you sort anything: Father&rsquo;s memorandum, Felicity&rsquo;s diary (the red book on her pillow, once she has said you may) and the green exercise book on the washstand.'
    ]];
    return ['slips', ['Everything you need is read. The heap of paper slips on the window seat is Felicity&rsquo;s: click it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Felicity has folded the eight true slips into her diary.'); return; }
    if (told.has('in')) { busy = false; ER.say('The night nursery, at the top of the house. Digby&rsquo;s bed is still empty.'); return; }
    told.set('in');
    ER.narrate([
      'The night nursery is at the very top of the house, under the roof. Two iron beds, a rocking horse with one eye, a barred window full of chimney pots, and in the corner a ladder that goes up to a square hatch in the ceiling.',
      'One bed is made. The other is a tangle, and empty.',
      '&ldquo;That is Digby&rsquo;s,&rdquo; says Felicity. &ldquo;He is seven, and he has been sent down to the kitchen in disgrace, and he will not say one single word. Father is at the railway office until four. And at ten past four Miss Inkster leaves us for ever. If nobody can explain last night by then, she leaves without a character.&rdquo;',
      '&ldquo;A character is a letter from Father that says she is honest. Without one, nobody will ever give her work again.&rdquo; She points at a typed sheet lying on her bed. &ldquo;Read that first. Father made the whole house read it at breakfast.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var MEMO = '<h4>MEMORANDUM</h4><p class="sub">No. 9, Ilbert Square &middot; Thursday, 19th May, 1910 &middot; 7.20 a.m. &middot; To: all members of this household.</p>' +
    '<p>1. At 7.00 a.m. the Hall Clock was found STOPPED at 6.57, with its door open and its glass broken.</p>' +
    '<p>2. My gold watch, which lies on the hall table every night, is MISSING.</p>' +
    '<p>3. Miss Inkster was seen in the hall last night, with a candle, beside the broken glass. She has offered no explanation.</p>' +
    '<p>4. Miss Inkster leaves this house at 4.10 p.m. today, as arranged. I return at 4.00 p.m. If these matters have not been explained by then, she leaves without a character.</p>' +
    '<p class="sig">G. Harbottle</p>';
  var DIARY = '<h4>Wednesday 18th May 1910</h4><p class="when">(written at six on Thursday morning, by the window, because I cannot sleep)</p>' +
    '<p>At breakfast Father said the comet could manage without us. Bed at seven, as usual.</p>' +
    '<p>At five to seven Digby crept out, and came back puffing as if he had climbed a mountain, and said it could never be seven o&rsquo;clock now. Then the nursery clock struck seven. So it WAS, and he cried.</p>' +
    '<p>At twenty-five past ten Miss I. woke us, and we went up the ladder onto the ROOF. We never saw the comet. Miss I. said the sky is mostly waiting. When the great crash came, deep down in the house, she was beside me, holding my hand. It was the comet&rsquo;s tail hitting us, I am sure. She went down, and came back in four minutes exactly (I counted to 240), and said, &ldquo;Nothing that cannot be mended.&rdquo;</p>' +
    '<p>Long after, when we were in bed again, a giant came up through our room to the roof, breathing like Father does on the stairs. I put my head under the blanket. I am not ashamed of it.</p>';
  var POV = '<span class="cover">Composition &middot; Form II &middot; F. Harbottle</span><h4>Who is telling the story?</h4>' +
    '<p>Every story has a <b>narrator</b>: the voice that tells it. Its <b>point of view</b> is the place it stands to look from.</p>' +
    '<p><b>First person.</b> The narrator is inside the story and says I or we. She can tell only what she saw, heard and felt. &ldquo;I heard a crash.&rdquo;</p>' +
    '<p><b>Third person limited.</b> The narrator says she or he, but stays with one character, like a lamp carried by one person: we see what that person sees and know what she thinks, and nothing more. &ldquo;She heard a crash, and knew it was glass.&rdquo;</p>' +
    '<p><b>All-knowing</b> (omniscient). The narrator can go anywhere: into every room and every head, the past and the future. &ldquo;Downstairs, somebody was already sorry.&rdquo; Only an author can be all-knowing. A witness never can.</p>' +
    '<p>On the board, underlined twice: <span class="board">Ask of every sentence: who could know this?</span></p>';
  var TT = '<h4>HOUSE TIME-TABLE</h4><h5>No. 9 Ilbert Square &middot; Summer Service from 1st May 1910</h5><table>' +
    '<tr><td>7.00</td><td>Children rise. Wash.</td></tr><tr><td>7.20</td><td>Inspection in the hall: hands, nails, boots.</td></tr>' +
    '<tr><td>7.30</td><td>Breakfast. <s>No talking at meals.</s> <span class="green">Talking permitted, quietly. G.H. 9.v.10</span></td></tr>' +
    '<tr><td>8.32</td><td>Mr Harbottle departs for the office.</td></tr><tr><td>2.00</td><td>Walk in the Park, <s>until 3.30.</s> <span class="green">until 4.00, if fine. G.H. 13.v.10</span></td></tr>' +
    '<tr><td>6.30</td><td>Supper.</td></tr><tr><td>7.00</td><td>BED.</td></tr><tr><td>7.10</td><td>Lights out.</td></tr></table>' +
    '<p>Wednesdays: Mr Harbottle dines at the Railway Club. Departs 6.40 p.m.; returns by the 10.15, at 10.32 p.m.</p>' +
    '<p>STANDING ORDERS. 1. The Hall Clock is the time of this house. Nobody but Mr Harbottle touches it. 2. Keys to the front door are held by Mr Harbottle and Mrs Spink only. 3. No running on the stairs. 4. No child on the roof, at any time, for any reason. <span class="red">INCLUDING COMETS. G.H. 18.v.10</span></p>';

  $('#memo').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MEMO, cls: 'memo', clue: { id: 'memo', title: 'Father&rsquo;s memorandum', kind: 'Typed' }, done: function () {
      if (told.set('memo')) { paint(); ER.say('&ldquo;Seen with a candle,&rdquo; says Felicity, through her teeth. &ldquo;Ask me what I saw. I was there.&rdquo;'); }
    } });
  });
  $('#diary').addEventListener('click', function () {
    if (busy) return;
    if (!told.has('fel')) { ER.say('A red book on the pillow. On the cover: PRIVATE. NOT TO BE READ. THIS MEANS YOU, DIGBY. Better ask Felicity first.'); return; }
    ER.read({ html: DIARY, cls: 'diary', clue: { id: 'diary', title: 'Felicity&rsquo;s diary: the comet night', kind: 'Diary' }, done: function () {
      if (told.set('diary')) { paint(); ER.say('&ldquo;I wrote it before anybody started shouting,&rdquo; says Felicity. &ldquo;So it is what I saw, and nothing else.&rdquo;'); }
    } });
  });
  $('#exb').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: POV, cls: 'exb', clue: { id: 'pov', title: 'Who is telling the story?', kind: 'Exercise book' }, done: function () {
      NY.terms(['narrator', 'point of view', 'first person', 'third person limited', 'all-knowing']);
      if (told.set('pov')) { paint(); ER.say('&ldquo;We did that on Monday,&rdquo; says Felicity. &ldquo;I did not know it would be useful. Nothing at school ever is.&rdquo;'); }
    } });
  });
  $('#tt').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TT, cls: 'tt', clue: { id: 'tt', title: 'The House Time-Table', kind: 'On the nursery door' }, done: function () {
      if (told.set('tt')) { paint(); ER.say('&ldquo;The green writing is Father&rsquo;s,&rdquo; says Felicity. &ldquo;He has changed two rules since Miss Inkster came. He had never changed a rule in his life.&rdquo;'); }
    } });
  });
  $('#fel').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Now Miss Inkster,&rdquo; says Felicity. &ldquo;Across the landing.&rdquo;'); return; }
    ER.talk({
      who: 'Felicity Harbottle', role: 'your cousin · eleven', face: window.FACE('felicity'),
      lines: [
        { note: 'Felicity is eleven, with two long plaits and ink on her middle finger. She talks fast and low, like somebody who knows that walls have ears.', a: '&ldquo;Miss Inkster came on the second of May. She is the sixth nanny since Mother died. The others all left because of the Time-Table. She did not leave. She bent it.&rdquo;' },
        { q: 'What happened last night?', a: '&ldquo;The comet night. The newspapers said the Earth would pass through the comet&rsquo;s tail. Father said bed at seven, as usual, and went out to his club. This morning the hall clock was stopped, and broken, and his watch was gone, and Cook says she saw Miss Inkster in the hall with a candle. I wrote down everything at six this morning, before anybody shouted. It is in my diary, on the pillow. You may read it.&rdquo;' },
        { q: 'Is Miss Inkster a thief?', a: '&ldquo;She is the most honest person I know. She is also&hellip;&rdquo; Felicity lowers her voice. &ldquo;I think she may be magic. Don&rsquo;t laugh. She finds things. Everything. She is in the day nursery, across the landing, with her trunk.&rdquo;' },
        { q: 'Why won&rsquo;t she explain?', a: '&ldquo;She says she does not explain herself. She says: Nothing is ever lost. Everything is somewhere.&rdquo;' },
        { q: 'What are we going to do?', a: '&ldquo;I am writing Father the true history of last night, to give him at four.&rdquo; She points at a heap of paper slips on the window seat. &ldquo;But I have muddled up what I saw with what I made up. I want to be a novelist, you see. It is a terrible handicap. My exercise book on the washstand says how to tell them apart.&rdquo;' }
      ],
      clue: { id: 'fel1', title: 'Felicity, in the night nursery', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('fel')) paint(); }
    });
  });
  $('#ladder').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'hatch');
    NY.seed('soot', 'Soot on the ladder', '<p>On the top rung of the ladder to the roof hatch, high up where a tall person&rsquo;s hand would go, there is a black smear of soot. Felicity says it was not there on Tuesday, and that none of them touched a chimney last night.</p>');
    ER.say('The ladder to the roof hatch. On the top rung, high up where a tall person&rsquo;s hand would go, there is a black smear of soot. &ldquo;That was not there on Tuesday,&rdquo; says Felicity. &ldquo;And none of us touched a chimney.&rdquo;');
  });
  $('#slate').addEventListener('click', function () {
    if (busy) return;
    NY.seed('slate', 'Digby&rsquo;s slate', '<p>In chalk capitals: WHERE DOES TIME GO WHEN THE CLOCK STOPS? Digby asked Father that at breakfast on Wednesday. Father said: &ldquo;Nowhere. The hall clock is the time of this house.&rdquo;</p>');
    ER.say('Digby&rsquo;s slate, in chalk capitals: WHERE DOES TIME GO WHEN THE CLOCK STOPS? &ldquo;He asked Father at breakfast on Wednesday,&rdquo; says Felicity. &ldquo;Father said: Nowhere. The hall clock is the time of this house.&rdquo;');
  });
  NY.thing('#clock', null, 'The nursery clock on its shelf says four minutes to ten. &ldquo;It keeps good time,&rdquo; says Felicity. &ldquo;Father sets it from the hall clock every Sunday.&rdquo;', isBusy);
  NY.thing('#horse', 'rocking horse', 'The rocking horse has one glass eye. The other was lost in 1907. Miss Inkster found it on her second day, inside the horse.', isBusy);
  NY.thing('#scene path[fill="url(#sky)"], #scene rect[fill="url(#sky)"]', null, 'Over the bars of the window: wet slate roofs, chimney pots, and a pale May sky. Somewhere below, a newsboy is shouting about tomorrow&rsquo;s procession.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#slips').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Eight true slips, folded into the diary. Four crossed out.'); return; }
    if (!ready()) { ER.say('Felicity puts her hand on the slips. &ldquo;Not yet. Read Father&rsquo;s memorandum, my diary and the exercise book first, or you will sort them the way I did, which is wrongly.&rdquo;'); return; }
    openLock();
  });

  /* ---------- the lock: twelve slips, three envelopes ---------- */
  var SL = [
    ['a', 'She heard a crash far below her and knew at once that it was glass.', 'Slip &ldquo;She heard a crash&rdquo;: nobody says I. And it goes inside only one head, hers. One head is still one lamp.'],
    ['b', 'Out in space, the comet went on its way and never once thought of the Harbottles.', 'Slip &ldquo;Out in space&rdquo;: could anybody in this house know what a comet was thinking, out in space? Who could know this?'],
    ['c', 'She went down the ladder, and I counted to two hundred and forty.', 'Slip &ldquo;She went down the ladder, and I counted&rdquo;: read it to the end. Somebody in it is counting, and says so.'],
    ['d', '&ldquo;I shall be four minutes,&rdquo; the nanny said, and she was.', 'Slip &ldquo;I shall be four minutes&rdquo;: that I is inside speech marks. It is a character talking. Who is telling the sentence round it?'],
    ['e', 'I held Miss Inkster&rsquo;s hand on the roof, and it was as cold as the leads.', 'Slip &ldquo;I held Miss Inkster&rsquo;s hand&rdquo;: who says I here, and is she inside the story?'],
    ['g', 'Far below, Cook lay awake and was sure the nanny was up to no good, while the nanny, on the roof, was not thinking about Cook at all.', 'Slip &ldquo;Far below, Cook lay awake&rdquo;: count the heads it goes into. A lamp carried by one person lights one head.'],
    ['h', 'The nanny counted the chimney pots and found that there were eleven.', 'Slip &ldquo;The nanny counted the chimney pots&rdquo;: it says the nanny, not I, and it shows only what she did and saw.'],
    ['j', 'Everybody in the house was asleep by midnight, and each of them dreamed of something different.', 'Slip &ldquo;Everybody in the house&rdquo;: can one person see what everybody else is dreaming?'],
    ['k', 'We never saw the comet, though I looked until my eyes watered.', 'Slip &ldquo;We never saw the comet&rdquo;: we, and I. Who is telling it, and from where?'],
    ['m', 'Felicity held her breath, and was more frightened than she would ever admit.', 'Slip &ldquo;Felicity held her breath&rdquo;: Felicity wrote it, but she wrote herself as she. It stays inside one head: hers.'],
    ['n', 'The nanny went down the ladder, and two floors below her Cook was pulling on her dressing gown and muttering.', 'Slip &ldquo;The nanny went down the ladder, and two floors below&rdquo;: the nanny is on the ladder. Could her lamp light up Cook, two floors down, at the same moment?'],
    ['q', 'Digby came back to our room puffing, and told me it could never be seven now.', 'Slip &ldquo;Digby came back to our room&rdquo;: our room, told me. Who is telling it?']
  ];
  var BOX = [['f', 'FIRST PERSON', 'I or we, inside the story'], ['l', 'THIRD PERSON LIMITED', 'she or he: one lamp, one head'], ['a', 'ALL-KNOWING', 'anywhere, any head: only an author']];
  function openLock() {
    var put = ER.flag('a-put') || {}, held = null, done = false;
    lock = ER.el('div', 'scr');
    var h = '<h5>Felicity&rsquo;s envelopes &middot; who is telling each slip?</h5><div class="envs">';
    BOX.forEach(function (b) { h += '<div class="env" data-b="' + b[0] + '"><b>' + b[1] + '</b><small>' + b[2] + '</small><div class="in"></div></div>'; });
    h += '</div><div class="tray"></div>';
    lock.innerHTML = h;
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="seal">Give them to Felicity</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg'), tray = lock.querySelector('.tray'), nodes = {};
    function msg(t) { m.innerHTML = ER.gloss(t); }
    NY.mix(SL, 31).forEach(function (s) {
      var b = ER.el('button', 'slp', s[1]); b.type = 'button'; b.setAttribute('data-s', s[0]); nodes[s[0]] = b;
    });
    function draw() {
      Object.keys(nodes).forEach(function (k) {
        var n = nodes[k], at = put[k] ? lock.querySelector('.env[data-b="' + put[k] + '"] .in') : tray;
        if (n.parentNode !== at) at.appendChild(n);
        n.classList.toggle('held', held === k);
      });
      ER.$$('.env', lock).forEach(function (e) { e.classList.toggle('want', !!held); });
    }
    function clearBad() { ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); }); }
    lock.addEventListener('click', function (e) {
      if (done) return;
      var s = e.target.closest('.slp'), inEnv = s ? s.closest('.env') : null;
      if (s && held && inEnv && s.getAttribute('data-s') !== held) { put[held] = inEnv.getAttribute('data-b'); held = null; ER.sfx.paper(); ER.flag('a-put', put); clearBad(); draw(); return; }
      if (s) { var id = s.getAttribute('data-s'); held = held === id ? null : id; NY.sfx.pencil(); clearBad(); draw(); return; }
      var env = e.target.closest('.env');
      if (env && held) { put[held] = env.getAttribute('data-b'); held = null; ER.sfx.paper(); ER.flag('a-put', put); clearBad(); draw(); return; }
      if (e.target.closest('.tray') && held) { delete put[held]; held = null; ER.flag('a-put', put); draw(); return; }
      if (env) msg('First click a slip, then click the envelope it belongs in.');
    });
    foot.querySelector('#seal').addEventListener('click', function () {
      if (done) return;
      clearBad();
      var order = SL.map(function (s) { return s[0]; }), i, k;
      var left = order.filter(function (k) { return !put[k]; }).length;
      if (left === SL.length) { ER.sfx.no(); msg('The envelopes are empty. Click a slip, then the envelope it belongs in.'); return; }
      if (left) { ER.sfx.no(); msg('&ldquo;All of them, please,&rdquo; says Felicity. ' + left + (left === 1 ? ' slip is' : ' slips are') + ' still on the window seat.'); return; }
      for (i = 0; i < SL.length; i++) {
        k = SL[i][0];
        if (!ER.check(k, put[k])) { ER.sfx.no(); nodes[k].classList.add('bad'); msg(SL[i][2] + ' (Felicity only ever points to the first slip that is wrong.)'); return; }
      }
      var cand = order.map(function (k) { return k + '-' + put[k]; }).join('/');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('Felicity cannot make the envelopes close. Something is wrong with this page: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('a-file', file);
      ER.$$('.env[data-b="a"] .slp', lock).forEach(function (n) { n.classList.add('out'); });
      NY.sfx.pencil();
      msg('Felicity takes a thick pencil and crosses out every slip in the third envelope, one after another.');
      setTimeout(function () { ER.closeAll(); solved(); }, 2400);
    });
    draw();
    msg('Click a slip, then the envelope it belongs in. Click a slip in an envelope to pick it up again, and the window seat to put it back.');
    ER.open('ov-lock', wrap);
  }

  function solved() {
    NY.mine('sorted', 'Felicity&rsquo;s slips, sorted', '<p>First person (I or we, inside the story): her hand as cold as the leads; we never saw the comet; she went down and I counted to 240; Digby came back to our room.</p>' +
      '<p>Third person limited (one lamp): the nanny counted eleven chimney pots; she heard a crash and knew it was glass; &ldquo;I shall be four minutes,&rdquo; the nanny said; Felicity held her breath.</p>' +
      '<p>All-knowing, so made up, so crossed out: Cook awake while the nanny thought of other things; Cook pulling on her dressing gown two floors down; the comet in space; everybody&rsquo;s dreams.</p>' +
      '<p>Rule: a witness can only be first person or limited. Ask of every sentence: who could know this?</p>');
    NY.terms(['narrator', 'point of view', 'first person', 'third person limited', 'all-knowing']);
    paint(); busy = true;
    ER.narrate([
      '&ldquo;Four made up,&rdquo; says Felicity, looking at the crossed-out slips. &ldquo;I did not see Cook. I did not see anybody dream. And I certainly do not know what a comet thinks.&rdquo;',
      '&ldquo;So that is the rule for Father&rsquo;s history: nothing all-knowing. Only what somebody really saw or heard, from where they really were.&rdquo; She folds the eight good slips into her diary.',
      'She stops at the door. &ldquo;Nobody in this house is all-knowing,&rdquo; she says. &ldquo;Except possibly Miss Inkster. Come on.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
</body>
</html>
