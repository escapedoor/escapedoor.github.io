  #boots{animation:walk 7s linear infinite}
  @keyframes walk{0%{transform:translate(-260px,0)}100%{transform:translate(520px,0)}}
  #boots2{animation:walk2 11s linear infinite;animation-delay:-4s}
  @keyframes walk2{0%{transform:translate(480px,0)}100%{transform:translate(-300px,0)}}
  #bag.wrig{animation:wr 2.6s steps(1,end) infinite;transform-origin:1340px 330px}
  @keyframes wr{0%,80%{transform:rotate(0)}84%{transform:rotate(4deg)}88%{transform:rotate(-3deg)}92%{transform:rotate(2deg)}}
  #grate{animation:gr 1.6s steps(2,end) infinite alternate}
  @keyframes gr{from{opacity:.7}to{opacity:1}}
  #steam path{animation:st 3s steps(6,end) infinite;opacity:.0}
  @keyframes st{0%{opacity:0;transform:translate(0,0)}30%{opacity:.6}100%{opacity:0;transform:translate(-14px,-60px)}}
  #cat,#cosyOn{display:none}
  #scene.catout #cat{display:inline}
  #scene.catout #bag{opacity:.75}
  #scene.cosy #cosyOn{display:inline}
  #scene.cosy #cosyPot{display:none}

  /* the tray: the sayings on Miss Inkster's card, to be done word for word */
  .say{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:30;display:none;width:min(820px,96vw);padding:8px 12px 10px;background:#efe2c4;background-image:linear-gradient(170deg,#f4ead2,#e2cfa6);
    border:1px solid #8a6a3a;box-shadow:0 14px 40px rgba(0,0,0,.6);color:#2a2018}
  .say.on{display:block}
  .say p{margin:0 0 6px;font-family:'Alegreya',serif;font-size:16px;line-height:1.25;text-align:center}
  .say .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .sy{padding:5px 6px;border:1px solid #a8926a;background:#fbf6e8;color:#2a2018;font-family:'Alegreya',serif;font-style:italic;font-size:15.5px;line-height:1.1;border-radius:2px;cursor:pointer}
  .sy:hover{background:#fff}
  .sy.on{background:#2a2018;color:#f4ead2;border-color:#2a2018}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, step, pick = null;
  $('#dig').innerHTML = NY.as('digby', { h: 280, smile: 'down' });
  $('#cook').innerHTML = NY.as('spink', { h: 330, armL: 'front', armR: 'out' });
  $('#fel').innerHTML = NY.as('felicity', { h: 330, armL: 'front' });

  ER.init({
    theme: 'lit', story: 'nanny', storyTitle: 'Everything Is Somewhere', id: 'kitchen', no: 'III', title: 'The Kitchen',
    go: 'Down the back stairs',
    intro: [
      'You tied six of Felicity&rsquo;s wonders to lines in Miss Inkster&rsquo;s register: the tooth to a boy walking as if on a pebble; the King to the newsboys under the window; seeing through walls to the creak of the fourth stair; the laugh to Digby&rsquo;s question; the rain to the falling weather-glass; Father in the drawing room to the smoke from its chimney. Felicity had every fact right, and every reason wrong. The seventh wonder, the trunk, is in no line of the book at all.',
      'Now down: past the drawing room, past the hall and its broken clock, through the green baize door, and down the stone stairs to where the house keeps its kitchen. It is a quarter past eleven.'
    ],
    exit: {"next":"drawing","w":{"64c647f6":"cbcac668"}}, tags: {"k1":["9a04f9cc"],"k2":["d342701c"],"k3":["f090830c"],"k4":["a0d5a163"]},
    hints: hints, onBegin: begin
  });

  told = NY.told('c-told'); nextFile = ER.flag('c-file') || null; step = ER.flag('c-step') || 0;
  function isBusy() { return busy; }
  function ready() { return told.has('spink') && told.has('letters') && told.has('card'); }
  function paint() {
    var sc = $('#scene');
    sc.classList.toggle('catout', step >= 3);
    sc.classList.toggle('cosy', step >= 2);
    $('#bag').classList.toggle('wrig', step < 3);
    $('#calday').textContent = step >= 4 ? '19' : '18'; $('#calwd').textContent = step >= 4 ? 'THU' : 'WED';
    $('#cook').classList.toggle('ready', !told.has('spink'));
    $('#letter').style.display = told.has('spink') ? '' : 'none';
    $('#letter').classList.toggle('ready', told.has('spink') && !told.has('letters'));
    $('#card').classList.toggle('ready', told.has('letters') && !told.has('card'));
    $('#dig').classList.toggle('ready', ready() && !told.has('start'));
    $('#say').classList.toggle('on', told.has('start') && !nextFile && !busy);
    var n = ['spink', 'letters', 'card'].filter(function (k) { return told.has(k); }).length + (step >= 1 ? 1 : 0) + (step >= 3 ? 1 : 0) + (nextFile ? 1 : 0);
    ER.pips(n, 6);
  }
  var HINT = [
    ['Everybody is shouting, and Mrs Spink says it is a great fuss over a clock. Which saying on Miss Inkster&rsquo;s card means a great fuss about something small?',
      'Digby believes that a saying means exactly what its words say. Choose the saying in the tray at the bottom, then click the thing in the kitchen you would really do it with.',
      'A storm in a teacup: choose it, then click the blue teacup on the dresser.'],
    ['Digby is afraid that somebody is listening. Which saying on the card is about listening?',
      'The walls have ears. In this kitchen one wall really has an ear in it: the brass mouthpiece of the speaking tube, beside the door, which goes up to the drawing room.',
      'Choose &ldquo;The walls have ears&rdquo;, then click the speaking tube on the wall by the door.'],
    ['Digby says his secret is tied up tight and must never get out. Something else in this kitchen is tied up tight, and it is moving.',
      'Which saying means telling a secret, usually by mistake?',
      'Choose &ldquo;Let the cat out of the bag&rdquo;, then click the laundry bag on the back of the door.'],
    ['Digby wants to stop being bad. Which saying means starting again and doing better?',
      'A leaf can also be a page. Is there anything on the kitchen wall with pages, still showing yesterday?',
      'Choose &ldquo;Turn over a new leaf&rdquo;, then click the calendar on the wall.']
  ];
  function hints() {
    if (nextFile) return ['go', ['Digby has told everything. The button at the bottom of the screen goes up to the drawing room.']];
    if (told.has('start')) return ['step' + step, HINT[Math.min(step, 3)]];
    if (!ready()) return ['look', [
      'Talk to Mrs Spink, the cook, behind the table. She has something for you to read.',
      'Read Mrs Spink&rsquo;s letters (the blue sheets on the table, after you have talked to her) and Miss Inkster&rsquo;s card of sayings, pinned on the wall above Digby&rsquo;s stool.'
    ]];
    return ['start', ['Everything is read. Now click Digby, on his stool by the range.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Digby is eating a jam tart, with both hands. Mrs Spink is pretending not to watch him.'); return; }
    if (told.has('start')) { busy = false; paint(); cue(); return; }
    if (told.has('in')) { busy = false; ER.say('The kitchen. Digby has not said a word.'); return; }
    told.set('in');
    ER.narrate([
      'The kitchen is below the street. Through the barred window high up in the wall you can see the railings of the area, and the boots of London going past on the pavement above your head.',
      'A great black range, copper pans, a dresser of blue plates, a scrubbed table with flour on it and a kipper on a plate. A clock on the wall. And on the back of the door a laundry bag, which every now and then moves by itself.',
      'Mrs Spink, the cook, is rolling pastry as if it had done something wrong. On a stool in the corner sits Digby, in a sailor suit, with his lips pressed together so hard that they have gone white.',
      '&ldquo;He hasn&rsquo;t said a word since breakfast,&rdquo; says Mrs Spink. &ldquo;Not one. Not even for jam.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var LEAF1 = '<h4>Tuesday night, 17th May</h4><p>Dear Lizzie,</p>' +
    '<p>Well she is still here, the new one, Miss Inkster, a fortnight and a day, which is longer than any of the other five. Quiet as a cat and sees everything, which is not natural. She has moved my salt. She told the master my clock is five minutes fast. So it is, Lizzie, and always has been, so as I am never late with his breakfast, but it is not her business to notice.</p>' +
    '<p>Since she came the poor King has died, and now there is a comet coming with poison gas in its tail, a Frenchman in the paper says so. I don&rsquo;t say it is her doing. I only say.</p>' +
    '<p>And tonight through the master&rsquo;s speaking tube I heard her say to him, cool as a cucumber, &ldquo;Leave the comet to me.&rdquo; Now what does that mean, I should like to know?</p>';
  var LEAF2 = '<h4>Thursday morning, 19th May</h4>' +
    '<p>Well Lizzie, you will never credit it. Last night, Wednesday, at ten past eight, down she comes for the roof key and a candle, bold as brass. A follower, you mark my words. A man, on the roof!</p>' +
    '<p>The master was home and in his bed by a quarter to eleven, regular as clockwork. He always is, of a Wednesday.</p>' +
    '<p>At five to eleven by my clock I heard the front door go, soft. That was her follower, going out.</p>' +
    '<p>Then a crash fit to wake the dead. Up the back stairs I went in my curl-papers, and there she was on the stairs with her candle, and glass all over the hall. She broke it, Lizzie, as sure as I am sitting here, and all she says is, &ldquo;Go back to bed, Mrs Spink.&rdquo;</p>' +
    '<p>At two in the morning I heard a man&rsquo;s tread on the stairs, going up. Him again!</p><p>Your loving sister, Clara</p>';
  var CARD = '<h4>Sayings, and what they mean</h4><h5>For Digby. (Do not DO them, Digby.) C. I.</h5>' +
    '<p><b>A storm in a teacup:</b> a great fuss about something small.</p>' +
    '<p><b>The walls have ears:</b> be careful, somebody may be listening.</p>' +
    '<p><b>Let the cat out of the bag:</b> tell a secret, usually by mistake.</p>' +
    '<p><b>Turn over a new leaf:</b> start again, and do better.</p>' +
    '<p><b>In hot water:</b> in trouble.</p>' +
    '<p><b>Smell a rat:</b> feel sure that something is wrong.</p>' +
    '<p><b>No use crying over spilt milk:</b> do not be sad about what cannot be changed.</p>' +
    '<p><b>A red herring:</b> something that leads you away from the truth.</p>';

  $('#letter').addEventListener('click', function () {
    if (busy || !told.has('spink')) return;
    ER.read({ html: LEAF1, cls: 'letter', clue: { id: 'letter1', title: 'Mrs Spink to her sister: Tuesday', kind: 'Letter' }, done: function () {
      setTimeout(function () {
        ER.read({ html: LEAF2, cls: 'letter', clue: { id: 'letter2', title: 'Mrs Spink to her sister: the comet night', kind: 'Letter' }, done: function () {
          if (told.set('letters')) { paint(); ER.say('&ldquo;Every word God&rsquo;s truth,&rdquo; says Mrs Spink, rolling. Felicity opens her mouth, and shuts it again.'); }
        } });
      }, 250);
    } });
  });
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'card', clue: { id: 'card', title: 'Miss Inkster&rsquo;s card of sayings', kind: 'Card' }, done: function () {
      NY.terms(['idiom', 'literally', 'a storm in a teacup', 'the walls have ears', 'let the cat out of the bag', 'turn over a new leaf']);
      if (told.set('card')) { paint(); ER.say('&ldquo;He takes sayings at their word,&rdquo; says Felicity. &ldquo;Exactly at their word. Last week somebody told him to hold his tongue, and he did, with his fingers, for an hour.&rdquo;'); }
    } });
  });
  $('#cook').addEventListener('click', function () {
    if (busy) return;
    if (told.has('start')) { ER.say(nextFile ? '&ldquo;I may have been hasty,&rdquo; says Mrs Spink, to the pastry.' : '&ldquo;Don&rsquo;t mind me,&rdquo; says Mrs Spink. &ldquo;I&rsquo;m only the cook.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Clara Spink', role: 'the cook · fourteen years in this kitchen', face: window.FACE('spink'),
      lines: [
        { note: 'Mrs Spink is short and wide and floury, with a cap like a cottage loaf. She does not stop rolling.', a: '&ldquo;Fourteen years I&rsquo;ve cooked in this kitchen. Six nannies. And not one of them was ever caught creeping about the house at midnight with a candle, till this one.&rdquo;' },
        { q: 'What did you see last night?', a: '&ldquo;I&rsquo;ve written it all to my sister Lizzie, every word, and you may read it, because it&rsquo;s the truth.&rdquo; She wipes her hands and puts two blue sheets on the end of the table. &ldquo;Tuesday&rsquo;s, and this morning&rsquo;s. I haven&rsquo;t posted them yet.&rdquo;' },
        { q: 'Why don&rsquo;t you like Miss Inkster?', a: '&ldquo;Like her? She moved my salt. She told the master my clock was fast. And since the day she came, the poor King has died and there&rsquo;s a comet in the sky with poison in its tail. I don&rsquo;t say it&rsquo;s her doing. I only say.&rdquo;' },
        { q: 'Who has keys to the front door?', a: '&ldquo;The master, and me, and nobody else. Mine&rsquo;s on my apron string, where it&rsquo;s been since 1896.&rdquo; She pats it.' },
        { q: 'Is there a cat?', a: '&ldquo;Kipper. He goes up the back stairs to the hall every morning at six, after the mice, and walks the coal all over the house on his paws, the wicked thing. Where he is now I should like to know.&rdquo; Behind the door, the laundry bag gives a small, cross wriggle.' }
      ],
      clue: { id: 'spink1', title: 'Mrs Spink, in the kitchen', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('spink')) { paint(); NY.seed('paws', 'Kipper and the coal', '<p>Mrs Spink: the kitchen cat, Kipper, goes up the back stairs to the hall every morning at six, after the mice, and walks coal dust all over the house on his paws.</p>'); } }
    });
  });
  $('#kclock').addEventListener('click', function () {
    if (busy) return;
    NY.seed('kclock', 'The kitchen clock', '<p>The kitchen clock said twenty past eleven when the church across the square struck a quarter past. Mrs Spink keeps it five minutes fast, so that she is never late with the master&rsquo;s breakfast.</p>');
    ER.say('The kitchen clock says twenty past eleven. As you look at it, the church across the square strikes the quarter: a quarter past. &ldquo;Five minutes fast,&rdquo; says Mrs Spink, &ldquo;and always has been. I&rsquo;m never late with the master&rsquo;s breakfast.&rdquo;');
  });

  /* ---------- the lock: four sayings, done word for word for a boy who believes them ---------- */
  var SAYS = [['storm', 'A storm in a teacup'], ['walls', 'The walls have ears'], ['cat', 'Let the cat out of the bag'], ['leaf', 'Turn over a new leaf'],
    ['water', 'In hot water'], ['rat', 'Smell a rat'], ['milk', 'Crying over spilt milk'], ['herring', 'A red herring']];
  var FIT = { storm: 'cup', walls: 'tube', cat: 'bag', leaf: 'cal', water: 'kettle', rat: 'trap', milk: 'milk', herring: 'kipper' };
  var NAME = { cup: 'the teacup', tube: 'the speaking tube', bag: 'the laundry bag', cal: 'the calendar', kettle: 'the kettle', trap: 'the mousetrap', milk: 'the milk jug', kipper: 'the kipper', cook: 'Mrs Spink', dig: 'Digby', kclock: 'the clock', card: 'the card' };
  var CUE = [
    'Digby is crying, Felicity is stamping, and Mrs Spink throws up her floury hands: &ldquo;What a to-do! All this fuss, over a clock!&rdquo;',
    'Digby wipes his nose and whispers: &ldquo;I can&rsquo;t tell you here. Somebody might be listening. Even the walls.&rdquo; His eyes go to the brass mouthpiece by the door.',
    '&ldquo;But it&rsquo;s a secret,&rdquo; says Digby, &ldquo;and I&rsquo;ve tied it up tight, and I&rsquo;ll never, never let it out.&rdquo; Behind the door, the laundry bag gives a wriggle and a small cross mew.',
    '&ldquo;Now I&rsquo;m bad,&rdquo; says Digby. &ldquo;I&rsquo;ll be bad for ever and ever, and everybody will know.&rdquo; Mrs Spink glances at the wall. &ldquo;And that calendar still says Wednesday. I hadn&rsquo;t the heart to touch it this morning.&rdquo;'
  ];
  function cue() { if (step < 4) ER.say(CUE[step], 9000); }
  (function () {
    var row = $('#sayrow');
    NY.mix(SAYS, 5).forEach(function (s) {
      var b = ER.el('button', 'sy', s[1]); b.type = 'button'; b.setAttribute('data-k', s[0]); row.appendChild(b);
      b.addEventListener('click', function () { pick = pick === s[0] ? null : s[0]; NY.sfx.pencil(); ER.$$('.sy').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-k') === pick); }); $('#sayp').innerHTML = pick ? 'Now click the thing in the kitchen you would do it with.' : 'Choose a saying, then click the thing in the kitchen you would do it with.'; });
    });
  })();
  function unpick() { pick = null; ER.$$('.sy').forEach(function (n) { n.classList.remove('on'); }); $('#sayp').innerHTML = 'Choose a saying, then click the thing in the kitchen you would do it with.'; }
  function act(obj) {
    if (!pick) return false;
    var k = pick;
    unpick();
    if (FIT[k] !== obj) { ER.sfx.no(); ER.say('&ldquo;How would you do that with ' + NAME[obj] + '?&rdquo; says Felicity.'); return true; }
    if (step < 4 && ER.check('k' + (step + 1), k)) { advance(k); return true; }
    ER.sfx.no();
    var t = {
      storm: step > 0 ? 'Digby looks into the teacup. &ldquo;The storm&rsquo;s in there already,&rdquo; he says. &ldquo;With a saucer on.&rdquo;' : '',
      walls: step < 1 ? 'Nobody is whispering. Everybody is shouting.' : 'The tea cosy is still on the speaking tube.',
      cat: step < 1 ? 'Kipper the cat shoots out of the bag, looks at all the shouting, and goes straight back in. Nobody else notices.' : (step < 2 ? 'Kipper shoots out of the bag. Digby claps both hands over his mouth and looks at the speaking tube. Kipper goes back into the bag.' : 'Kipper is asleep by the range, and has no more to say.'),
      leaf: step < 3 ? 'You tear Wednesday off the calendar. Mrs Spink snatches it back and pins it up again. &ldquo;I&rsquo;ll say when it&rsquo;s Thursday in my kitchen, thank you.&rdquo;' : 'It is Thursday already.',
      water: 'Digby stares at the kettle in horror. &ldquo;I&rsquo;m in hot water already,&rdquo; he whispers. It does not help.',
      rat: 'Digby sniffs at the mousetrap. &ldquo;I can&rsquo;t smell a rat,&rdquo; he says. &ldquo;Only kipper.&rdquo;',
      milk: '&ldquo;Nobody is crying over milk,&rdquo; says Felicity. &ldquo;We are crying over Miss Inkster.&rdquo;',
      herring: '&ldquo;That,&rdquo; says Mrs Spink, &ldquo;is my dinner, not a clue.&rdquo;'
    }[k];
    if (k === 'cat' && step < 2) NY.sfx.mew();
    ER.say(t || 'Nothing happens.');
    return true;
  }
  function advance(k) {
    step++; ER.flag('c-step', step); busy = true; paint(); $('#say').classList.remove('on');
    if (k === 'storm') {
      ER.sfx.glass();
      ER.narrate(['You hold out the blue teacup from the dresser. Digby stops in the middle of a sob. He knows what it is for: there is one on the nursery mantelpiece.',
        'Solemnly he leans over the cup and puffs his storm into it. Felicity, scarlet, puffs hers in too. Mrs Spink, without a word, puts a saucer on top. The kitchen is quiet.'], function () { busy = false; paint(); cue(); });
    } else if (k === 'walls') {
      NY.sfx.whistle();
      ER.narrate(['You take the red tea cosy off the brown teapot and pull it down hard over the mouthpiece of the speaking tube. Digby looks at it, and nods. &ldquo;Now they can&rsquo;t hear.&rdquo;'], function () { busy = false; paint(); cue(); });
    } else if (k === 'cat') {
      NY.sfx.mew();
      ER.narrate([
        'You untie the laundry bag. Out shoots Kipper, the kitchen cat, who has been asleep on the clean tablecloths, and stalks off to the range with his tail in the air.',
        'Digby goes white. &ldquo;Now you&rsquo;ve done it. The cat&rsquo;s out of the bag.&rdquo; He takes a deep breath. &ldquo;So now I have to tell.&rdquo;',
        '&ldquo;At breakfast Father said the hall clock is the time of this house. So I thought: if it stops, it can never be seven o&rsquo;clock, and it can never be bedtime, and we can stay up for the comet.&rdquo;',
        '&ldquo;So at five to seven I went down. I jumped the creaky stair. I stood on the hall chair, and it wobbled, and I opened the little glass door and held the pendulum still until the clock stopped. It said three minutes to seven.&rdquo;',
        '&ldquo;I couldn&rsquo;t reach to shut the little door, so I left it open. And the glass was NOT broken. I never broke anything! Then I ran up, and the nursery clock struck seven anyway.&rdquo; He looks at his shoes. &ldquo;Time doesn&rsquo;t go anywhere when the clock stops. It just goes on without you.&rdquo;',
        '&ldquo;So the glass was whole at three minutes to seven,&rdquo; says Felicity slowly. &ldquo;Then who broke it?&rdquo;'
      ], function () {
        NY.mine('digby', 'Digby, in the kitchen', '<p>At breakfast Father said the hall clock is the time of this house. So at five to seven Digby went down, stood on the wobbly hall chair, and held the pendulum still until the clock stopped at 6.57, so that it could never be bedtime. He could not reach to shut the little door, so he left it open. The glass was whole when he left it. Then the nursery clock struck seven anyway.</p>');
        busy = false; paint(); cue();
      });
    } else {
      NY.sfx.tear();
      var file = ER.exit(['storm/walls/cat/leaf'], { wait: true });
      if (!file) { busy = false; ER.say('The calendar will not tear. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('c-file', file);
      ER.narrate([
        'You tear Wednesday off the calendar. Underneath: THURSDAY 19, clean and new. This time Mrs Spink lets it stay.',
        'Digby looks at it for a long time. &ldquo;A new leaf,&rdquo; he says. &ldquo;All right. I&rsquo;ll tell Father myself. At four o&rsquo;clock.&rdquo; Then he eats a jam tart, very fast, with both hands.',
        'Mrs Spink has stopped rolling. &ldquo;Glass whole at three minutes to seven,&rdquo; she says, to nobody. &ldquo;Well. I heard it go at five to eleven, and that&rsquo;s a fact.&rdquo;',
        '&ldquo;Three people told last night,&rdquo; says Felicity, gathering up the diary, the register and the letters. &ldquo;Me, Miss Inkster, and Cook. Father&rsquo;s drawing room has the biggest table in the house. Come on.&rdquo;'
      ], function () { busy = false; $('#go').classList.add('on'); paint(); });
    }
  }
  ['cup', 'tube', 'bag', 'cal', 'kettle', 'trap', 'milk', 'kipper'].forEach(function (id) {
    $('#' + id).addEventListener('click', function (e) {
      if (busy) return;
      if (told.has('start') && !nextFile && act(id)) return;
      var line = {
        cup: 'A blue teacup on the dresser, the twin of the one in the nursery.', tube: 'The speaking tube: a brass pipe down the wall from the drawing room, with a whistle in its mouthpiece. When the master blows down it, the whistle shrieks.',
        bag: step >= 3 ? 'An empty laundry bag. Kipper has gone.' : 'The laundry bag on the back of the door. It moves, now and then, by itself.', cal: 'A calendar with a page for every day. It still says WEDNESDAY 18.',
        kettle: 'The kettle, singing quietly to itself on the range.', trap: 'A mousetrap under the dresser, with a crumb of cheese in it. Kipper is not much use.',
        milk: 'A jug of milk with a blue rim.', kipper: 'A kipper on a plate: a smoked herring, red-brown and shiny. Mrs Spink&rsquo;s dinner.'
      }[id];
      ER.say(line);
      if (id === 'kipper') ER.wordAt(e.clientX, e.clientY, 'kipper');
    });
  });
  $('#dig').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;At four o&rsquo;clock,&rdquo; says Digby, through jam. &ldquo;I promised the calendar.&rdquo;'); return; }
    if (told.has('start')) { cue(); return; }
    if (!ready()) { ER.say('Digby presses his lips together and looks at the floor. Felicity shakes her head: &ldquo;Read what is here first. Cook&rsquo;s letters. And Miss Inkster&rsquo;s card, on the wall above him.&rdquo;'); return; }
    told.set('start'); busy = true; paint();
    NY.sfx.sob();
    ER.narrate([
      'Felicity kneels in front of the stool. &ldquo;Digby. Miss Inkster is going to leave without a character, and it is because of the clock. Your clock.&rdquo;',
      'Digby bursts into tears. Felicity, who did not mean to, bursts into tears as well, and stamps. Kipper, inside the laundry bag, yowls.',
      '&ldquo;He takes sayings at their word,&rdquo; Felicity sobs to you. &ldquo;So use them. Use Miss Inkster&rsquo;s card. Do them!&rdquo;'
    ], function () { busy = false; paint(); cue(); });
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#cat').addEventListener('click', function () { if (!busy) { NY.sfx.mew(); ER.say('Kipper, asleep by the range. His paws are black with coal dust.'); } });
})();
</script>
