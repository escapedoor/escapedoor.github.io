<style>
  body{--bg:#05070d;--accent:#ffb43a;--font-display:'Stardos Stencil',sans-serif;--font-ui:'Outfit',sans-serif;--font-body:'Alegreya',serif;
    --tc-bg:rgba(6,8,16,.97);--tc-ink:#e8ecf6;--cap-bg:rgba(8,10,20,.94);--panel:#121828;--face-bg:#1d2b48;--q-ink:#ffcf7a;--fade:#000;--hud-bg:rgba(8,10,20,.85)}
  .tc-room{font-family:'Stardos Stencil',sans-serif;font-size:clamp(44px,6vw,82px);letter-spacing:.06em;color:#ffb43a}
  .sO{font-family:'Outfit',sans-serif;text-anchor:middle}
  .sT{font-family:'Stardos Stencil',sans-serif;text-anchor:middle}
  #coveglow{opacity:0;transition:opacity 2.5s}
  #scene.lit #coveglow{opacity:1}
  #scene.lit #dark{opacity:0}
  #dark{transition:opacity 2.5s}
  .blink{animation:blink 1.1s steps(1,end) infinite}
  .blink.b2{animation-duration:1.7s}.blink.b3{animation-duration:.8s}
  @keyframes blink{50%{opacity:.25}}
  #spark{animation:spark 4.2s steps(1,end) infinite;opacity:0}
  @keyframes spark{0%,88%{opacity:0}90%{opacity:1}93%{opacity:0}95%{opacity:.9}97%{opacity:0}}
  #scene.lit #spark{display:none}
  #dialglow{animation:dg 3s ease-in-out infinite alternate}
  @keyframes dg{from{opacity:.45}to{opacity:.8}}

  /* the lock: the Year Dial and its three little brothers */
  .dials{padding:10px 14px 10px;background:#0e1220 linear-gradient(180deg,#151b2e,#0a0d18);border:1px solid #4a3a1a;box-shadow:0 26px 70px rgba(0,0,0,.8),inset 0 0 0 4px #05070d;color:#e8ecf6}
  .dials h5{margin:0 0 2px;font-family:'Stardos Stencil',sans-serif;font-weight:normal;font-size:18px;letter-spacing:.2em;text-align:center;color:#ffb43a}
  .dials svg{display:block;width:100%;height:auto;max-height:52vh}
  .dials .sec{cursor:pointer}
  .dials .sec:hover{fill:#5a4a1e}
  .dials .mk{cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
  .cd{position:relative;padding:6px 8px 6px 34px;border:2px solid #3a3a4a;border-radius:3px;background:#1a2032;color:#e8ecf6;text-align:left;font-family:'Alegreya',serif;font-size:14.5px;line-height:1.22}
  .cd b{position:absolute;left:7px;top:7px;width:20px;height:20px;border-radius:50%;color:#10121a;font-family:'Outfit',sans-serif;font-size:12px;line-height:20px;text-align:center}
  .cd small{display:block;margin-top:3px;font-family:'Outfit',sans-serif;font-size:11.5px;letter-spacing:.06em;color:#ffcf7a}
  .cd:hover{border-color:#8a7a4a}
  .cd.held{border-color:#ffb43a;background:#2a2a1e}
  .cd.bad{border-color:#ff5a3a;background:#3a1a14}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#zainab').innerHTML = SD.fig({ h: 320, coat: '#1c1c26', legs: '#24243a', skin: '#a8724e', hair: '#2a7a78', hairStyle: 'scarf', lanyard: '#e8802a', specs: true });
  $('#terry').innerHTML = SD.fig({ h: 330, coat: '#26324a', legs: '#1c2436', skin: '#e6bf9c', hair: '#b8b4ae', hairStyle: 'bald', armL: 'out', specs: true, smile: false, w: 1.08 });

  ER.init({
    theme: 'lit', story: 'stardust', storyTitle: 'Stardust at Half Past Seven', id: 'desk', no: 'III', title: 'The Control Desk',
    go: 'Into the dome',
    intro: [
      'You chose Sabine&rsquo;s pictures for the people who will really be in the seats: children from six to twelve, and their families. A light-year is a distance given as a time, like the seaside &ldquo;two hours away&rdquo;; but a car changes speed, and light never does. The galaxies move apart like raisins in rising dough; but a loaf has a middle and an edge, and the universe has neither. The firework in her own hand went back in Zainab&rsquo;s pocket: it was written on the back of a 1991 programme, a year before the show existed, and thrown away.',
      'The dome&rsquo;s back door is heavy, and it closes behind you with a sigh. Somebody in here is cutting wires.'
    ],
    exit: {"next":"scaffold","w":{"2dddc1ac":"91e1ef90","28f3e427":"87c743d8","7f468344":"c78c784c","ce891d98":"920fd48e","151e4625":"037b3c50","8449b9a2":"7be5b458","25e87d51":"c4189b55","6681abdd":"72afadf2","9ecb49c5":"bd979e8f","e76f42a0":"4a2eea1c","175162cc":"62a35ffa","c7cb0ac6":"b79ed19b","e2b46e06":"083b693f","7588e85b":"67e6c6a2","a1cc055a":"780be455","40a4cfc3":"69f3888a","ce5d7856":"3774ca50","32fd0ec3":"c6edf5f7"}}, tags: {"e1":["35407bdc"],"e2":["4b17f7a9"],"e3":["ac2f6d3e","e969a42b","0994937c"],"e4":["7ec6b829"],"e5":["d39a6f75"],"e6":["566fed74","1d2f1b16"],"e7":["b4e3b242","92468548","a31f7a42"],"e1d":["449cc94a"],"e2d":["e6da892c"],"e3d":["6a5edba8"],"e4d":["ddf87a81"],"e5d":["696810e1"],"e6d":["1be04dcc"],"e7d":["2b55378c"],"e2m":["78af7e3f"],"e5m":["621b78a0"]},
    hints: hints, onBegin: begin
  });

  told = SD.told('c-told'); nextFile = ER.flag('c-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('page') && told.has('cue'); }
  function paint() {
    $('#scene').classList.toggle('lit', !!nextFile);
    $('#page').classList.toggle('ready', !told.has('page'));
    $('#cue').classList.toggle('ready', !told.has('cue'));
    $('#toolbox').classList.toggle('ready', told.has('zainab') && !told.has('job') && !nextFile);
    $('#dial').classList.toggle('ready', ready() && !nextFile);
    var n = ['page', 'cue', 'zainab', 'terry', 'job'].filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0);
    ER.pips(n, 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The cues are set and the cove lights are back. The button at the bottom of the screen climbs the scaffolding after the next page.']];
    if (lock && document.body.contains(lock)) return ['dial', [
      'Read the cue card again (it is in your notebook). First decide which dial each card goes on: the year, December, the last hour of 31 December, or its last minute. Then work out where on that dial.',
      'For the big dial: 4.6 billion years is one third of 13.8 billion, so it goes one third of the year back from midnight on 31 December, which is four months back. For December, divide by 38 million to get the number of days before the end of the year. For the last hour, divide by 26,000 to get minutes before midnight; for the last minute, divide by 440 to get seconds.',
      'Both September cards are in September: one early, one late. The shells: 540 &divide; 38 is about 14 days before the end of the year. The first dinosaurs: about 6 days. The end of the great dinosaurs: less than 2 days. People like us: about 11 or 12 minutes before midnight. Writing: about 11 seconds.'
    ]];
    if (!ready()) return ['look', [
      'Two things on the control desk matter most: the script page lying on the desk to the left of the big amber dial, and the cue card clipped to the right of the dial.',
      'Click the page and the card. Zainab, the man at the cabinet, and the yellow card in his toolbox have something to tell you as well.'
    ]];
    return ['dial', ['Everything you need is read. Click the big amber Year Dial in the middle of the desk to set the cues.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The cove glows all round the dome, sunset-coloured. Terry is putting his tools away.'); return; }
    if (told.has('in')) { busy = false; ER.say('The dome, at a quarter to six. The cove lights are still dead.'); return; }
    told.set('in');
    ER.narrate([
      'The dome at a quarter to six is the darkest place in the building. Your eyes take a while. Then, slowly: rows of tilted red seats, the star projector in the middle like a black dumbbell studded with lenses, and the dome itself, curving up and over everything.',
      'At the back, a tower of scaffolding climbs into the dark. All the way round the bottom of the dome runs the cove: the hidden lights that make the sunset at the start of every show. Tonight they are dead.',
      'At the control desk, a page of the script lies beside the big amber dial, as if it had come in here on purpose.',
      'And somebody is half inside a grey metal cabinet next to the desk, cutting wires. When the third one parts, there is a small blue flash.',
      '&ldquo;That,&rdquo; Zainab whispers, &ldquo;is Terry.&rdquo; In a dome, a whisper comes back to you from the other side, so Terry hears it too.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var CUE = '<h4>THE YEAR DIAL</h4>' +
    '<p>Squeeze the whole history of the universe, <b>13.8 billion years</b>, into one year. The Big Bang is the first moment of 1 January. Now, tonight, is the last stroke of midnight on 31 December.</p>' +
    '<p>On this calendar:</p><table><tr><td>one month</td><td>&asymp; 1.15 billion years</td></tr><tr><td>one day</td><td>&asymp; 38 million years</td></tr><tr><td>one hour</td><td>&asymp; 1.6 million years</td></tr><tr><td>one minute</td><td>&asymp; 26,000 years</td></tr><tr><td>one second</td><td>&asymp; 440 years</td></tr></table>' +
    '<p>To place an event, ask what part of 13.8 billion years ago it is, and count back from midnight on 31 December. Example: 6.9 billion years ago is half of 13.8, so it goes at the turn of June and July.</p>' +
    '<p>Less than 1.15 billion years ago: use the DECEMBER dial. Less than 1.6 million years ago: the LAST HOUR of 31 December. Less than 26,000 years ago: its LAST MINUTE.</p>' +
    '<p><span class="stamp">SAGAN&rsquo;S COSMIC CALENDAR</span> &nbsp;The idea comes from Carl Sagan&rsquo;s book <i>The Dragons of Eden</i> (1977).</p>';
  var CUEROW = function (t) { return '<p><span class="gap">DIAL: ?</span> &nbsp;' + t + '</p>'; };
  var PAGE = SD.page('A YEAR IN THE DARK',
    '<p class="dir">(The dome goes black. The Year Dial lights 1 January.)</p>' +
    '<p>Let us squeeze all of it, 13.8 billion years, into one single year. At the first moment of 1 January, everything begins. For eight months there is no Sun at all: only gas, and stars, and galaxies being born.</p>' +
    CUEROW('The Sun and the Earth form.') + CUEROW('Life: the oldest fossils we have.') + CUEROW('Shells and skeletons in the sea.') + CUEROW('The first dinosaurs. Merry Christmas.') +
    CUEROW('The great dinosaurs die out.') + CUEROW('People like us.') + CUEROW('Writing: every king, every war, every poem you have ever heard of.') +
    '<p>And now: midnight. Happy New Year. You were born less than a second ago.</p>',
    'the cue column is empty: the cues were set on the night, by hand');
  var JOB = '<h4>JOB CARD &middot; CONTROL DESK</h4>' +
    '<p>4.10 pm. Cove lights dead, all four colours. Smell of hot plastic from the rack.</p>' +
    '<p>Dimmer channel 3 burnt out. Fuse F7 blown (black inside). Old fuse in my POCKET so nobody puts it back by mistake.</p>' +
    '<p>PLAN: cut channel 3 out. Run the cove on spare channel 9. New fuse. 40 minutes, and NOBODY touches the desk.</p>' +
    '<p>Then test every cue on the Year Dial before the doors open.</p><p>&mdash; T.S. (on this desk since 1988)</p>';

  $('#page').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PAGE, cls: 'script', clue: { id: 'scF0', title: 'A Year in the Dark (no cues)', kind: 'Script page' }, done: function () {
      if (told.set('page')) { paint(); ER.say('Seven events, and seven empty cues. The page does not say where on the dial each one goes: that was always done here, by hand.'); }
    } });
  });
  $('#cue').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CUE, cls: 'cue', clue: { id: 'cue', title: 'The Year Dial', kind: 'Cue card' }, done: function () {
      SD.terms(['cosmic calendar', 'billion', 'Big Bang']);
      if (told.set('cue')) { paint(); ER.say('Thirteen point eight billion years in one year. One day is thirty-eight million of them.'); }
    } });
  });
  $('#toolbox').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: JOB, cls: 'job', clue: { id: 'job', title: 'Terry&rsquo;s job card', kind: 'In the toolbox' }, done: function () {
      if (told.set('job')) { paint(); ER.say(nextFile ? 'Job done.' : 'Zainab reads it over your shoulder, and goes rather quiet.'); }
    } });
  });
  $('#zainab').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;I owe him an apology,&rdquo; says Zainab. &ldquo;And probably a biscuit.&rdquo;'); return; }
    ER.talk({
      who: 'Zainab Roper', role: 'presenter', face: window.FACE('zainab'),
      lines: [
        { note: 'Zainab keeps her voice down, which in a dome does no good at all.', a: '&ldquo;He&rsquo;s had the panels off since four. He pulled a fuse out of the desk and put it in his pocket: I watched him do it. And now the cove lights are dead.&rdquo;' },
        { q: 'Why would he wreck the show?', a: '&ldquo;At the staff meeting in March, when they asked about tonight, Terry said, and I quote: &lsquo;That projector belongs in a museum.&rsquo; He wants the new digital one. If tonight goes wrong, he gets it.&rdquo; She stops. &ldquo;I&rsquo;m not saying he would. I&rsquo;m saying he could.&rdquo;' },
        { q: 'What is the big amber dial?', a: '&ldquo;The Year Dial. On a normal night it moves the sky through the seasons: winter stars, summer stars. In Sabine&rsquo;s show it becomes a calendar of the whole universe. Every event in that scene has a cue: the dial lights one spot, and the dome changes. The cue column on the page is empty, because she always set the cues here, by hand, on the night.&rdquo;' },
        { q: 'Can we set the cues?', a: '&ldquo;The cue card clipped by the dial tells you how. It&rsquo;s only arithmetic. Very big arithmetic.&rdquo;' }
      ],
      clue: { id: 'zainab3', title: 'Zainab, in the dome', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('zainab')) paint(); }
    });
  });
  $('#terry').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Mind the third rung,&rdquo; says Terry, without looking up.'); return; }
    ER.talk({
      who: 'Terry Stobbs', role: 'he runs the control desk', face: window.FACE('terry'),
      lines: [
        { note: 'Terry Stobbs is half inside the grey cabinet, with a torch in his teeth and a pair of cutters in his hand. He takes the torch out to speak.', a: '&ldquo;Don&rsquo;t touch anything on the right-hand side of that desk. Don&rsquo;t touch anything on the left-hand side either.&rdquo;' },
        { q: 'What are you doing?', a: '&ldquo;What does it look like?&rdquo; He goes back into the cabinet. Snip. A small blue flash, and a word you are not supposed to know.' },
        { q: 'Can we use the Year Dial?', a: '&ldquo;The dial&rsquo;s on its own circuit. Set your cues if you must. Just the dial. Nothing else.&rdquo;' }
      ],
      clue: { id: 'terry1', title: 'Terry, at the cabinet', kind: 'What he said' },
      done: function (seen) { if (seen && told.set('terry')) paint(); }
    });
  });
  SD.thing('#fuse', 'fuse', 'A fuse in a little tray, burnt black inside. Somebody has written F7 on the tray beside it.', isBusy);
  SD.thing('#rack', 'dimmer', function () { return nextFile ? 'The cabinet door is shut. Inside it, channel nine is doing channel three&rsquo;s job.' : 'The dimmer rack: the cabinet that feeds the lights. Its door is open, and three wires have been cut.'; }, isBusy);
  SD.thing('#proj', 'star projector', 'The star projector: two black globes full of lenses on one long arm. Switched on, it throws thousands of stars onto the dome.', isBusy);
  SD.thing('#scaf', 'scaffolding', 'The painters&rsquo; scaffolding climbs right up into the dark. High up on it, something white is caught on a pole.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  function openOrSay() {
    if (busy) return;
    if (nextFile) { ER.say('Seven cues, set. The dial glows.'); return; }
    if (!ready()) { ER.say('The Year Dial. Before you touch it, read what is beside it: the script page on the left, and the cue card on the right.'); return; }
    openLock();
  }
  $('#dial').addEventListener('click', openOrSay);

  /* ---------- the lock: seven cues on four dials ---------- */
  var MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  var MONL = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var EVS = [
    ['e1', 'The first writing: all of written history begins.', 'About 5,000 years ago', '#e86a5a'],
    ['e2', 'The Sun and the Earth form.', '4.6 billion years ago', '#ffd23a'],
    ['e3', 'The first dinosaurs.', 'About 230 million years ago', '#6ad86a'],
    ['e4', 'The first modern humans: people like us.', 'About 300,000 years ago', '#5ac8f0'],
    ['e5', 'The oldest fossils of living things.', '3.5 billion years ago', '#c88af0'],
    ['e6', 'The great dinosaurs die out.', '66 million years ago', '#f0a05a'],
    ['e7', 'Animals with shells and hard skeletons appear in the seas.', 'About 540 million years ago', '#f07ac0']
  ];
  var D = { y: { cx: 230, cy: 285, R: 200, r: 122 }, d: { cx: 612, cy: 285, R: 140, r: 92 }, h: { cx: 902, cy: 152, R: 100, r: 60 }, m: { cx: 902, cy: 422, R: 88, r: 50 } };
  function P(d, rad, a) { var t = a * Math.PI / 180; return [(d.cx + rad * Math.sin(t)).toFixed(1), (d.cy - rad * Math.cos(t)).toFixed(1)]; }
  function arc(d, a0, a1) {
    var o0 = P(d, d.R, a0), o1 = P(d, d.R, a1), i1 = P(d, d.r, a1), i0 = P(d, d.r, a0), lg = a1 - a0 > 180 ? 1 : 0;
    return 'M' + o0 + 'A' + d.R + ' ' + d.R + ' 0 ' + lg + ' 1 ' + o1 + 'L' + i1 + 'A' + d.r + ' ' + d.r + ' 0 ' + lg + ' 0 ' + i0 + 'z';
  }
  function sectors() {
    var list = [], i, k;
    for (i = 0; i < 12; i++) for (k = 0; k < 3; k++) list.push({ id: 'y-' + MON[i] + '-' + 'eml'.charAt(k), d: 'y', a0: i * 30 + k * 10, a1: i * 30 + k * 10 + 10, name: ['early', 'the middle of', 'late'][k] + ' ' + MONF[i] });
    for (i = 0; i < 31; i++) list.push({ id: 'd' + (i + 1), d: 'd', a0: i * 360 / 31, a1: (i + 1) * 360 / 31, name: (i + 1) + ' December' });
    for (i = 0; i < 12; i++) list.push({ id: 'h' + i, d: 'h', a0: i * 30, a1: i * 30 + 30, name: '31 December, 11.' + ('0' + i * 5).slice(-2) + ' to ' + (i === 11 ? 'midnight' : '11.' + ('0' + (i * 5 + 5)).slice(-2) + ' pm') });
    for (i = 0; i < 4; i++) list.push({ id: 'm' + i, d: 'm', a0: i * 90, a1: i * 90 + 90, name: '31 December, the last minute: ' + (i * 15) + ' to ' + (i * 15 + 15) + ' seconds' });
    return list;
  }
  var SEC = sectors(), SECBY = {};
  SEC.forEach(function (s) { SECBY[s.id] = s; });
  function openLock() {
    var busyL = false, put = ER.flag('c-put') || {}, held = null;
    lock = ER.el('div', 'dials');
    var s = '<svg viewBox="0 0 1080 560">';
    /* the zoom lines: December opens into its own dial, 31 December into the last hour, the last five minutes into the last minute */
    s += '<g stroke="#ffb43a" stroke-width="1.5" stroke-dasharray="4 5" opacity=".55" fill="none"><path d="M' + P(D.y, D.y.R, 345) + 'L' + P(D.d, D.d.R, 330) + '"/><path d="M' + P(D.d, D.d.R, 354) + 'L' + P(D.h, D.h.R, 300) + '"/><path d="M' + P(D.h, D.h.R, 345) + 'L' + P(D.m, D.m.R, 15) + '"/></g>';
    ['y', 'd', 'h', 'm'].forEach(function (k) { var d = D[k]; s += '<circle cx="' + d.cx + '" cy="' + d.cy + '" r="' + (d.R + 4) + '" fill="#1a1406" stroke="#4a3a1a" stroke-width="3"/>'; });
    SEC.forEach(function (x) { s += '<path class="sec" data-s="' + x.id + '" d="' + arc(D[x.d], x.a0, x.a1) + '" fill="#2a2210" stroke="#6a5420" stroke-width="' + (x.d === 'y' && x.a0 % 30 ? 0.6 : 1.6) + '"/>'; });
    ['y', 'd', 'h', 'm'].forEach(function (k) { var d = D[k]; s += '<circle cx="' + d.cx + '" cy="' + d.cy + '" r="' + d.r + '" fill="#0e0c06" stroke="#6a5420" stroke-width="2"/>'; });
    var F = 'font-family="Outfit,sans-serif" text-anchor="middle"';
    MONL.forEach(function (m, i) { var p = P(D.y, D.y.R + 16, i * 30 + 15); s += '<text x="' + p[0] + '" y="' + (+p[1] + 5) + '" ' + F + ' font-size="14" font-weight="600" fill="#ffcf7a">' + m + '</text>'; });
    for (var i = 1; i <= 31; i++) { var p = P(D.d, D.d.R + 11, (i - 0.5) * 360 / 31); s += '<text x="' + p[0] + '" y="' + (+p[1] + 4) + '" ' + F + ' font-size="10" fill="#ffcf7a">' + i + '</text>'; }
    for (i = 0; i < 12; i += 3) { p = P(D.h, D.h.R + 13, i * 30); s += '<text x="' + p[0] + '" y="' + (+p[1] + 4) + '" ' + F + ' font-size="11" fill="#ffcf7a">11.' + ('0' + i * 5).slice(-2) + '</text>'; }
    for (i = 0; i < 4; i++) { p = P(D.m, D.m.R + 13, i * 90); s += '<text x="' + p[0] + '" y="' + (+p[1] + 4) + '" ' + F + ' font-size="11" fill="#ffcf7a">' + (i ? i * 15 + ' s' : '11.59') + '</text>'; }
    ['h', 'm'].forEach(function (k) { var q = P(D[k], D[k].R + 16, 326); s += '<text x="' + q[0] + '" y="' + q[1] + '" ' + F + ' font-size="10" fill="#fff6d0">midnight &#8635;</text>'; });
    s += '<text x="' + D.y.cx + '" y="' + (D.y.cy - 6) + '" ' + F + ' font-size="20" font-weight="700" letter-spacing="3" fill="#ffb43a">THE YEAR</text><text x="' + D.y.cx + '" y="' + (D.y.cy + 16) + '" ' + F + ' font-size="12" fill="#c8b07a">13.8 billion years</text>';
    s += '<text x="' + D.d.cx + '" y="' + (D.d.cy + 5) + '" ' + F + ' font-size="15" font-weight="700" letter-spacing="2" fill="#ffb43a">DECEMBER</text>';
    s += '<text x="' + D.h.cx + '" y="' + (D.h.cy - 2) + '" ' + F + ' font-size="11" font-weight="700" fill="#ffb43a">31 DEC</text><text x="' + D.h.cx + '" y="' + (D.h.cy + 12) + '" ' + F + ' font-size="10" fill="#c8b07a">the last hour</text>';
    s += '<text x="' + D.m.cx + '" y="' + (D.m.cy - 2) + '" ' + F + ' font-size="11" font-weight="700" fill="#ffb43a">THE LAST</text><text x="' + D.m.cx + '" y="' + (D.m.cy + 12) + '" ' + F + ' font-size="11" font-weight="700" fill="#ffb43a">MINUTE</text>';
    p = P(D.y, (D.y.R + D.y.r) / 2, 5); s += '<g><circle cx="' + p[0] + '" cy="' + p[1] + '" r="12" fill="#fff6d0" stroke="#ffb43a" stroke-width="2"/><text x="' + p[0] + '" y="' + (+p[1] + 5) + '" ' + F + ' font-size="14" fill="#5a3a06">&#9733;</text></g>';
    p = P(D.y, D.y.R + 40, 8); s += '<text x="' + (+p[0] + 30) + '" y="' + (+p[1] - 4) + '" ' + F + ' font-size="11" fill="#fff6d0">1 Jan: everything begins</text>';
    s += '<g class="mks"></g></svg>';
    lock.innerHTML = '<h5>The Year Dial &middot; set a cue for every event in the scene</h5>' + s + '<div class="cards"></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="setc">Test the cues</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg'), cards = lock.querySelector('.cards'), mks = lock.querySelector('.mks');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    EVS.forEach(function (e, i) {
      var b = ER.el('button', 'cd', '<b style="background:' + e[3] + '">' + (i + 1) + '</b>' + e[1] + ' <i>' + e[2] + '.</i><small></small>'); b.type = 'button'; b.setAttribute('data-e', e[0]); cards.appendChild(b);
    });
    function keep() { ER.flag('c-put', put); }
    function clearBad() { ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); }); }
    function draw() {
      var h = '';
      EVS.forEach(function (e, i) {
        var sid = put[e[0]], b = cards.querySelector('.cd[data-e="' + e[0] + '"]');
        b.classList.toggle('held', held === e[0]);
        b.querySelector('small').textContent = sid ? 'cue: ' + SECBY[sid].name : (held === e[0] ? 'now click its place on a dial' : 'not set');
        if (!sid) return;
        var x = SECBY[sid], d = D[x.d], q = P(d, (d.R + d.r) / 2, (x.a0 + x.a1) / 2), r = x.d === 'd' ? 9 : 12;
        h += '<g class="mk" data-e="' + e[0] + '"><circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + r + '" fill="' + e[3] + '" stroke="' + (held === e[0] ? '#fff' : '#10121a') + '" stroke-width="2.5"/>' +
          '<text x="' + q[0] + '" y="' + (+q[1] + 4.5) + '" font-family="Outfit,sans-serif" text-anchor="middle" font-size="' + (r + 1) + '" font-weight="700" fill="#10121a">' + (i + 1) + '</text></g>';
      });
      mks.innerHTML = h;
    }
    lock.addEventListener('click', function (e) {
      if (busyL || nextFile) return;
      var b = e.target.closest('.cd');
      if (b) { var id = b.getAttribute('data-e'); held = held === id ? null : id; SD.sfx.tick(); clearBad(); draw(); return; }
      var mk = e.target.closest('.mk');
      if (mk) { held = mk.getAttribute('data-e'); SD.sfx.tick(); draw(); return; }
      var sec = e.target.closest('.sec');
      if (sec && held) {
        var sid = sec.getAttribute('data-s');
        Object.keys(put).forEach(function (k) { if (put[k] === sid) delete put[k]; });
        put[held] = sid; held = null; SD.sfx.slide(); clearBad(); keep(); draw();
      } else if (sec) msg('First click one of the cards below, then click its place on a dial.');
    });
    foot.querySelector('#setc').addEventListener('click', function () {
      if (busyL || nextFile) return;
      clearBad();
      var i, e, sid, x, n;
      if (!Object.keys(put).length) { ER.sfx.no(); msg('No cue is set yet. Click a card, then click its place on one of the dials.'); return; }
      for (i = 0; i < EVS.length; i++) {
        e = EVS[i]; sid = put[e[0]]; n = 'Card ' + (i + 1) + ' (' + e[1].replace(/[.:].*$/, '') + ')';
        if (!sid) { ER.sfx.no(); cards.querySelector('.cd[data-e="' + e[0] + '"]').classList.add('bad'); msg(n + ' has no cue yet. Every event in the scene needs one.'); return; }
        if (ER.check(e[0], sid)) continue;
        x = SECBY[sid]; ER.sfx.no(); cards.querySelector('.cd[data-e="' + e[0] + '"]').classList.add('bad');
        var t;
        if (!ER.check(e[0] + 'd', x.d)) t = 'Terry looks up from the cabinet. &ldquo;' + n + ' is on the wrong dial.&rdquo; The cue card says: less than 1.15 billion years ago, December; less than 1.6 million, the last hour; less than 26,000, the last minute.';
        else if (x.d === 'y') t = ER.check(e[0] + 'm', sid.split('-')[1]) ? n + ': the right month, but not the right part of it. Early (1 to 10), the middle (11 to 20), or late (21 to the end)?' : n + ': not that month. What part of 13.8 billion years is it? Count back that part of the year from midnight on 31 December.';
        else if (x.d === 'd') t = n + ': not that day. One day of the calendar is about 38 million years. How many days before midnight on 31 December is that?';
        else if (x.d === 'h') t = n + ': not those five minutes. One minute of the calendar is about 26,000 years. How many minutes before midnight?';
        else t = n + ': not those fifteen seconds. One second of the calendar is about 440 years.';
        msg(t + ' <i>(Only the first cue that is wrong is ever shown.)</i>');
        return;
      }
      var cand = EVS.map(function (q) { return put[q[0]]; }).join('/');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The dial will not take the cues. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('c-file', file); busyL = true; held = null; draw(); SD.sfx.whirr();
      msg('One by one the cues light round the dial: two in September, three in December, and two crammed into the last hour of the last day.');
      setTimeout(function () { ER.closeAll(); solved(); }, 2600);
    });
    draw();
    msg('Click a card, then click its place on a dial. Click a cue on a dial to pick it up again. When all seven are set, test the cues.');
    ER.open('ov-lock', wrap);
  }

  function solved() {
    var put = ER.flag('c-put') || {}, row = function (e, t) { return '<p><span class="filled">' + SECBY[put[e]].name + '</span> &nbsp;' + t + '</p>'; };
    ER.addClue('scF', 'A Year in the Dark', SD.page('A YEAR IN THE DARK',
      '<p class="dir">(The dome goes black. The Year Dial lights 1 January.)</p>' +
      '<p>Let us squeeze all of it, 13.8 billion years, into one single year. At the first moment of 1 January, everything begins. For eight months there is no Sun at all: only gas, and stars, and galaxies being born.</p>' +
      row('e2', 'The Sun and the Earth form.') + row('e5', 'Life: the oldest fossils we have.') + row('e7', 'Shells and skeletons in the sea.') + row('e3', 'The first dinosaurs. Merry Christmas.') +
      row('e6', 'The great dinosaurs die out.') + row('e4', 'People like us.') + row('e1', 'Writing: every king, every war, every poem you have ever heard of.') +
      '<p>And now: midnight. Happy New Year. You were born less than a second ago.</p>', 'the cues pencilled in by hand'), 'script', 'Script page');
    SD.mine('calendar', 'The universe in one year', '<p>13.8 billion years = 1 year. 1 day &asymp; 38 million years, 1 minute &asymp; 26,000 years, 1 second &asymp; 440 years.</p>' +
      '<p>Sun and Earth, 4.6 billion: a third of the year back &rarr; early September. Oldest fossils, 3.5 billion: about a quarter back &rarr; late September.</p>' +
      '<p>Shells, 540 million &divide; 38 million &asymp; 14 days back &rarr; 17 December. First dinosaurs, 230 &divide; 38 &asymp; 6 days &rarr; 25 December. The end of the great dinosaurs, 66 &divide; 38 &asymp; 1.7 days &rarr; 30 December.</p>' +
      '<p>People like us, 300,000 &divide; 26,000 &asymp; 11.5 minutes &rarr; 11.48 pm on 31 December. Writing, 5,000 &divide; 440 &asymp; 11 seconds before midnight.</p>');
    SD.terms(['cosmic calendar', 'billion', 'Big Bang']);
    paint(); busy = true;
    setTimeout(function () { ER.sfx.clunk(); }, 900);
    ER.narrate([
      'Then, from the cabinet: a clunk. All the way round the bottom of the dome the cove lights come up, deep blue, then orange, then the pale gold of a sunset, and the town&rsquo;s skyline stands out black against it.',
      'Terry backs out of the cabinet and stands up, slowly, one hand on the small of his back. &ldquo;Channel three&rsquo;s dead as a doornail,&rdquo; he says. &ldquo;The cove&rsquo;s on nine now. I&rsquo;ve had the panels off since four o&rsquo;clock.&rdquo; He holds up a fuse, burnt black inside. &ldquo;This has been in my pocket so nobody puts it back by mistake.&rdquo;',
      '&ldquo;You said the projector belonged in a museum,&rdquo; says Zainab.',
      '&ldquo;It does. Doesn&rsquo;t mean I want her show to go wrong.&rdquo; He looks at the dial, at the seven little lights, and something in his face changes. &ldquo;I held the ladder on her opening night. Nineteen ninety-two. There&rsquo;s a photo.&rdquo;',
      'He nods up at the scaffolding. &ldquo;One of your pages went up there. I watched it go. Nuala&rsquo;s on the top lift, painting. Mind the third rung: it&rsquo;s loose.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
</body>
</html>
