<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#zainab').innerHTML = SD.fig({ h: 300, coat: '#1c1c26', legs: '#24243a', skin: '#a8724e', hair: '#2a7a78', hairStyle: 'scarf', lanyard: '#e8802a', armR: 'out', specs: true, smile: false });
  $('#nuala').innerHTML = SD.fig({ h: 300, coat: '#f2f0ea', legs: '#e8e6de', skin: '#f2cfb0', hair: '#c0562a', hairStyle: 'tied', band: '#3a8a5a', spots: true, armL: 'up',
    extra: '<path d="M-56 -274l-40 -170" stroke="#9a9a9a" stroke-width="5"/><rect x="-118" y="-470" width="46" height="18" rx="8" fill="#f6f6f0" stroke="#5a5a5a" stroke-width="2" transform="rotate(-20 -95 -461)"/>' });

  ER.init({
    theme: 'lit', story: 'stardust', storyTitle: 'Stardust at Half Past Seven', id: 'scaffold', no: 'IV', title: 'The Scaffolding',
    go: 'Climb up',
    intro: [
      'You set the Year Dial. With 13.8 billion years in one year, a day is about 38 million years and a second about 440. The Sun and the Earth went in early September (4.6 billion years ago is a third of the way back) and the oldest fossils in late September; the shells on 17 December, the first dinosaurs at Christmas, the end of the great dinosaurs on 30 December; people like us at about twelve minutes to midnight on 31 December, and all of written history in its last eleven seconds.',
      'And Terry was never wrecking the show. He was saving it: the cove lights had burnt out at ten past four, and the fuse in his pocket was the dead one. He held the ladder on Sabine&rsquo;s opening night.',
      'Now the ladder is yours. The scaffolding climbs up the back of the dome, lift after lift, to the very top, where the painters have propped open the hatch.'
    ],
    exit: {"next":"roof","w":{"cf5d345f":"624b4dc2"}}, tags: {"s1":["45e4ac92"],"s2":["e0cc8b38"],"s3":["ecb44dd7"],"s4":["95298ac6"],"s5":["4c0602ef"],"s6":["37a4d9ea"],"s7":["f130cc66"],"s8":["16831a5e"],"cut":["fa6b70ff","c2121c89"],"loud":["d27966fa"],"q":["4911323b"],"hyd":["3502c74d"]},
    hints: hints, onBegin: begin
  });

  told = SD.told('d-told'); nextFile = ER.flag('d-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('sheet') && told.has('pages') && told.has('zainab'); }
  function paint() {
    $('#sheet').classList.toggle('ready', !told.has('sheet'));
    $('#pages').classList.toggle('ready', !nextFile && (!told.has('pages') || ready()));
    $('#zainab').classList.toggle('ready', !told.has('zainab'));
    var n = ['sheet', 'pages', 'zainab', 'nuala'].filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0);
    ER.pips(n, 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The stardust page is whole. The last page went out through the hatch: the button at the bottom of the screen climbs out after it.']];
    if (lock && document.body.contains(lock) && lock.classList.contains('two')) return ['fact', [
      'The fact inside the metaphor has to be true word for word. The Iron page, in your notebook, says where the hydrogen came from.',
      'The hydrogen was made in the first few minutes, before there were any stars. So choose the sentence that leaves the hydrogen out.'
    ]];
    if (lock && document.body.contains(lock)) return ['marks', [
      'Sabine&rsquo;s front sheet gives the marks: F for a plain fact; S, M, P or H for the figure of speech that carries it; a cross for a figure that would leave a false idea. Read each sentence literally first: could it be true exactly as the words stand?',
      'Two sentences must be cut: one about the Sun (the Iron page says how a star really shines) and one about black holes (Zainab told you). One sentence sounds like boasting and is a plain fact. The one with &ldquo;like&rdquo; is a simile; the one that says you ARE something is a metaphor.',
      'A star that is born, lives and dies: personification. Numbers that make your head spin: hyperbole. An exploding star really can shine as brightly as a whole galaxy for a few weeks, and the iron in your blood really was made in stars: both plain facts.'
    ]];
    if (!ready()) return ['read', [
      'Three things up here: the sheet clipped to the guard rail in front of you, the pages caught on the pole on the right, and Zainab, who has just come up the ladder on the left.',
      'Read the sheet and the pages, and ask Zainab about black holes. Nuala, the painter, can tell you what happened to the pages.'
    ]];
    return ['pages', ['Everything is read. Click the pages on the pole again: the one with the white edge needs its margin marks back.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The margins are pencilled back. The hatch is a square of stars.'); return; }
    if (told.has('in')) { busy = false; ER.say('The top lift of the scaffolding, right under the dome.'); return; }
    told.set('in'); SD.sfx.gust();
    ER.narrate([
      'Six lifts up, the dome is so close that you could touch it. From the seats it looks like the sky. From up here it is a ceiling: a huge, curved, slightly dusty ceiling, with fresh white patches of primer where the painters have started.',
      'At the very top, the hatch stands open: a square of real night, with real stars in it. The draught pours up past you and out through it, cold and steady.',
      'A painter in white overalls is working on the patches round the hatch with a roller on a long pole. She has caught two of the pages and clipped them to a pole, and a sheet of notes to the guard rail.',
      'And on the dome itself, just above the boards, there are names in pencil. Somebody signed the ceiling, a long time ago.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var SHEET = '<h4>NOTES FOR WHOEVER READS THIS</h4><h5>the front sheet of the script &middot; 1992</h5>' +
    '<p>Read the facts plainly. Read the figures of speech warmly, and then give the fact inside them.</p>' +
    '<p>A <b>simile</b> says one thing is LIKE another, or AS big AS another. A <b>metaphor</b> says one thing IS another. <b>Personification</b> talks about a thing as if it were alive, or a person. <b>Hyperbole</b> exaggerates on purpose, so far that nobody takes it literally.</p>' +
    '<p>Beside every sentence I have pencilled one mark: <span class="mk">F</span> for a plain fact; <span class="mk">S</span> <span class="mk">M</span> <span class="mk">P</span> or <span class="mk">H</span> for the figure of speech that carries it; and a cross <span class="mk">&#10007;</span> for a figure to CUT, because a listener would go home believing something false. (&ldquo;Atoms are tiny solar systems&rdquo; was cut in 1991.)</p>' +
    '<p>A figure is welcome when the listener can find the true fact inside it.</p>' +
    '<p class="pen">Beware: some true facts are so big that they sound like boasting. Check before you call a thing hyperbole. &mdash; S.Q.</p>';
  var SG = SD.page('IRON',
    '<p class="dir">(House lights stay down. A single red star brightens in the dome.)</p>' +
    '<p>On our calendar, the Sun and the Earth are not born until September. But there is iron in your blood (hold your hand up to the light of that star), and that iron is older than the Sun. Where did it come from?</p>' +
    '<p>Not from the Big Bang. In its first few minutes the universe made almost all of its hydrogen, some helium, and hardly anything else. Nearly everything heavier was made later, by stars.</p>' +
    '<p>A star does not burn like a fire: nothing up there is burning, the way wood or gas burns. In its core, atoms are squeezed together so hard that they join, and that gives out light and heat. Hydrogen joins to make helium. In big stars, helium makes carbon and oxygen, and so on, step by step, all the way to iron.</p>' +
    '<p>And then&hellip;</p>');
  var LINES = [
    ['s1', 'A star is born, lives for millions or billions of years, and dies.'],
    ['s2', 'Our Sun is a great ball of fire.'],
    ['s3', 'Every atom of iron in your blood was made inside stars that blew themselves apart long before the Sun was born.'],
    ['s4', 'For a few weeks, one exploding star can shine as brightly as a whole galaxy.'],
    ['s5', 'The iron, carbon and oxygen they had made drifted out into space like seeds blown from a dandelion clock.'],
    ['s6', 'What is left behind can be a black hole: a cosmic vacuum cleaner that will one day swallow the whole universe.'],
    ['s7', 'The numbers in this part of the show are big enough to make your head spin.'],
    ['s8', 'So here is the simplest way to say it: you are made of stardust.']
  ];
  var SH = SD.page('STARDUST', '<p class="dir">(The red star swells, flares and is gone.)</p>' +
    LINES.map(function (l) { return '<p>' + l[1] + '</p>'; }).join('') + '<p><span class="gap">[the fact inside it]</span></p><p class="dir">(Darkness. Then, slowly, the stars come back.)</p>',
    'a stripe of white primer down the margin: every pencil mark under it is gone');

  $('#sheet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SHEET, cls: 'sheet', clue: { id: 'sheet', title: 'Notes for whoever reads this', kind: 'Front sheet' }, done: function () {
      SD.terms(['fact', 'figure of speech', 'simile', 'metaphor', 'personification', 'hyperbole']);
      if (told.set('sheet')) { paint(); ER.say('&ldquo;Read the figures warmly, and then give the fact inside them.&rdquo;'); }
    } });
  });
  function readPages(after) {
    ER.read({ html: SG, cls: 'script', clue: { id: 'scG', title: 'Iron', kind: 'Script page' }, done: function () {
      ER.read({ html: SH, cls: 'script', clue: { id: 'scH0', title: 'Stardust (margin painted over)', kind: 'Script page' }, done: function () {
        SD.terms(['element']);
        if (told.set('pages')) { paint(); ER.say('&ldquo;Iron&rdquo;, and &ldquo;Stardust&rdquo;. The second page has a white stripe of primer straight down its margin.'); }
        if (after) after();
      } });
    } });
  }
  $('#pages').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Both pages are in the folder now, the margin pencilled back.'); return; }
    if (!told.has('pages')) { readPages(); return; }
    if (!ready()) { ER.say(!told.has('sheet') ? 'Before you pencil anything back, read Sabine&rsquo;s notes on the sheet clipped to the guard rail: they say what the marks mean.' : 'Before you start, Zainab has something to say about one of these sentences. She is at the top of the ladder.'); return; }
    openLock();
  });
  $('#zainab').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Ten to seven,&rdquo; says Zainab. &ldquo;Doors at seven. Go.&rdquo;'); return; }
    ER.talk({
      who: 'Zainab Roper', role: 'presenter, not fond of heights', face: window.FACE('zainab'),
      lines: [
        { note: 'Zainab arrives at the top of the ladder a little out of breath and a little pale. She does not look down.', a: '&ldquo;I knew there was a reason I became a presenter and not a painter.&rdquo;' },
        { q: 'What is wrong with the page?', a: '&ldquo;The margin. Sabine pencilled a mark beside every sentence, so whoever read it knew how to say it: plainly, or warmly, or not at all. Primer has gone right down the side. Every mark is gone.&rdquo;' },
        { q: 'Do black holes really suck things in?', a: '&ldquo;No, and that&rsquo;s the thing everybody gets wrong. From far away, a black hole pulls exactly as hard as anything else with the same mass. If you swapped the Sun for a black hole of the same mass, the Earth would go round it just as it does now. It would get very cold, but it would not be swallowed. Black holes don&rsquo;t hoover.&rdquo;' },
        { q: 'And the stardust line?', a: '&ldquo;The most famous line in the show. People had it on T-shirts. Sabine always said the line was the easy part. The hard part was the sentence after it: the fact inside the picture.&rdquo;' }
      ],
      clue: { id: 'zainab4', title: 'Zainab, on the scaffolding', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('zainab')) { paint(); SD.terms(['black hole']); } }
    });
  });
  $('#nuala').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Go on,&rdquo; says Nuala, and steadies the ladder to the hatch. &ldquo;Mind the gutter.&rdquo;'); return; }
    ER.talk({
      who: 'Nuala Rawle', role: 'painter, on the top lift', face: window.FACE('nuala'),
      lines: [
        { note: 'Nuala Rawle has a roller on a long pole and primer in her eyebrows.', a: '&ldquo;Evening. Sorry about the draught. Primer stinks, so I propped the hatch at half past three. Nobody told me your whole show was going to take off up the stairs.&rdquo;' },
        { q: 'Did you see the pages?', a: '&ldquo;Three came up past me like pigeons. I caught two and that sheet of notes, and clipped them where they couldn&rsquo;t go anywhere. The third went straight out of the hatch. Onto the roof, if you&rsquo;re lucky.&rdquo;' },
        { q: 'What happened to the margin?', a: '&ldquo;That was me. I was doing the patches round the hatch when it went past, and I caught it with the roller. Only the edge, mind. The words are fine.&rdquo;' },
        { q: 'What are the names on the dome?', a: '&ldquo;Everybody who worked on the first show signed up here, in pencil, in 1992. On Monday I&rsquo;m meant to paint over them.&rdquo; She looks at them for a while. &ldquo;I&rsquo;ll do this bit last.&rdquo;' }
      ],
      clue: { id: 'nuala1', title: 'Nuala, on the top lift', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('nuala')) paint(); }
    });
  });
  SD.thing('#names', null, 'S. Quennell, opening night 1992. T. Stobbs &rsquo;92. And under them: <i>the whole crew, with love</i>, and three pencilled stars.', isBusy);
  SD.thing('#hatch', 'hatch', 'The hatch: a square of real sky. The draught goes out through it, and so did one of the pages.', isBusy);
  SD.thing('#ladder', null, 'The ladder you came up. Terry was right about the third rung.', isBusy);
  SD.thing('#tins', 'primer', 'Primer, a roller tray, and a dust sheet. On Monday this whole dome goes white.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: pencil the marks back into the margin ---------- */
  var MARKS = [['F', 'a plain fact'], ['S', 'simile'], ['M', 'metaphor'], ['P', 'personification'], ['H', 'hyperbole'], ['X', 'CUT: it misleads']];
  var FACTS = [['q1', 'Your body is made of tiny bits of dust that fell to Earth from the stars.'], ['q2', 'Every atom in your body, the hydrogen as well, was made inside a star.'],
    ['q3', 'Apart from the hydrogen, which is older than any star, nearly every atom in your body was made inside stars.'], ['q4', 'Stars and people are made of the same things, in the same amounts.']];
  var WHY = {
    F: 'Is that really a plain fact, word for word? Could it be true exactly as the words stand?',
    S: 'Is anything in it said to be LIKE something else, or AS &hellip; AS something?',
    M: 'Does it say that one thing IS another thing?',
    P: 'Is a thing being talked about as if it were alive, or a person?',
    H: 'Is it an exaggeration that nobody would take literally?',
    X: 'Would a listener really go home believing something false? If the fact inside is true, keep the figure and say it warmly.'
  };
  function sym(k) { return k === 'X' ? '&#10007;' : k; }
  function openLock() {
    var busyL = false, put = ER.flag('d-put') || {}, held = null, two = !!ER.flag('d-two');
    lock = ER.el('div', 'mg' + (two ? ' two' : ''));
    lock.innerHTML = '<div class="pg"><h6>STARDUST</h6>' + LINES.map(function (l) {
      return '<div class="ln" data-l="' + l[0] + '"><button type="button" class="bx" data-l="' + l[0] + '"></button><span>' + ER.gloss(l[1]) + '</span></div>';
    }).join('') + '<div class="fact"><p>And under &ldquo;stardust&rdquo;, the sentence that gives the fact inside it:</p>' +
      FACTS.map(function (f) { return '<button type="button" class="fq" data-q="' + f[0] + '">' + ER.gloss(f[1]) + '</button>'; }).join('') + '</div></div>' +
      '<div class="tools"><h6>Sabine&rsquo;s pencil marks</h6>' + MARKS.map(function (k) { return '<button type="button" class="tl" data-k="' + k[0] + '"><b>' + sym(k[0]) + '</b>' + k[1] + '</button>'; }).join('') +
      '<h6 style="margin-top:6px">Click a mark, then click the margin beside each sentence it belongs to.</h6></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="pencil">Read it through</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var m = foot.querySelector('.pmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('d-put', put); }
    function clearBad() { ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); }); }
    function draw() {
      ER.$$('.bx', lock).forEach(function (b) { var k = put[b.getAttribute('data-l')]; b.innerHTML = k ? sym(k) : ''; b.classList.toggle('on', !!k); });
      ER.$$('.tl', lock).forEach(function (b) { b.classList.toggle('held', b.getAttribute('data-k') === held); });
    }
    lock.addEventListener('click', function (e) {
      if (busyL || nextFile) return;
      var t = e.target.closest('.tl');
      if (t) { held = t.getAttribute('data-k'); SD.sfx.tick(); draw(); return; }
      var b = e.target.closest('.bx');
      if (b) {
        if (!held) { msg('First click one of Sabine&rsquo;s marks on the right, then the margin.'); return; }
        put[b.getAttribute('data-l')] = held; SD.sfx.pencil(); clearBad(); keep(); draw(); return;
      }
      var q = e.target.closest('.fq');
      if (q && lock.classList.contains('two')) {
        var id = q.getAttribute('data-q'); clearBad();
        if (!ER.check('q', id)) {
          ER.sfx.no(); q.classList.add('bad');
          msg(ER.check('hyd', id) ? '&ldquo;Not the hydrogen,&rdquo; says Zainab at once. &ldquo;Read the Iron page again: where was the hydrogen made?&rdquo;' : 'Is that true, word for word? The fact inside a metaphor has to be true exactly as it stands.');
          return;
        }
        finish(id);
      }
    });
    foot.querySelector('#pencil').addEventListener('click', function () {
      if (busyL || nextFile) return;
      clearBad();
      if (lock.classList.contains('two')) { msg('The marks are right. Now choose the sentence that goes under &ldquo;stardust&rdquo;: the fact inside it.'); return; }
      var i, l, k;
      for (i = 0; i < LINES.length; i++) {
        l = LINES[i][0]; k = put[l];
        if (!k) { ER.sfx.no(); lock.querySelector('.bx[data-l="' + l + '"]').classList.add('bad'); msg('Sentence ' + (i + 1) + ' has no mark yet. Every sentence gets one.'); return; }
        if (!ER.check(l, k)) {
          ER.sfx.no(); lock.querySelector('.bx[data-l="' + l + '"]').classList.add('bad'); lock.querySelector('.ln[data-l="' + l + '"]').classList.add('bad');
          var t = ER.check('cut', l) && k !== 'X' ? 'Zainab reads sentence ' + (i + 1) + ' aloud and frowns. &ldquo;A figure of speech, yes. But what would a listener believe afterwards? Is it true?&rdquo; (the Iron page says how a star shines; Zainab told you about black holes.)' :
            ER.check('loud', l) && k === 'H' ? 'Sentence ' + (i + 1) + ' sounds like boasting. But is it really an exaggeration? Read the last line of Sabine&rsquo;s notes again.' : 'Sentence ' + (i + 1) + ': ' + WHY[k];
          msg(t + ' <i>(Only the first mark that is wrong is ever shown.)</i>');
          return;
        }
      }
      ER.flag('d-two', true); lock.classList.add('two'); SD.sfx.pencil();
      msg('Every mark is right. Under &ldquo;you are made of stardust&rdquo; there is one more gap: the fact inside it. Choose the sentence.');
    });
    function finish(q) {
      var cand = LINES.map(function (l) { return put[l[0]]; }).join('-') + '/' + q;
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The pencil breaks. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('d-file', file); busyL = true; SD.sfx.pencil();
      var fact = FACTS.filter(function (f) { return f[0] === q; })[0][1];
      msg('Zainab reads the page through under her breath: plainly, warmly, plainly. Then the last line, the way Sabine always said it, slowly.');
      setTimeout(function () { ER.closeAll(); solved(fact); }, 2600);
    }
    draw();
    msg(two ? 'The marks are right. Now choose the fact inside &ldquo;stardust&rdquo;.' : 'Click one of Sabine&rsquo;s marks, then the margin beside each sentence it belongs to. When every sentence has its mark, read it through.');
    ER.open('ov-lock', wrap);
  }

  function solved(fact) {
    var put = ER.flag('d-put') || {};
    ER.addClue('scH', 'Stardust', SD.page('STARDUST', '<p class="dir">(The red star swells, flares and is gone.)</p>' +
      LINES.map(function (l) { return '<p><span class="filled" style="border:0">' + sym(put[l[0]]) + '</span>&nbsp; ' + l[1] + '</p>'; }).join('') +
      '<p><span class="filled" style="border:0">F</span>&nbsp; ' + fact + '</p><p class="dir">(Darkness. Then, slowly, the stars come back.)</p>', 'the margin marks pencilled back over the primer'), 'script', 'Script page');
    SD.mine('figures', 'Fact and figure', '<p>F, plain facts: the iron in your blood was made in stars; one exploding star can shine as brightly as a galaxy (it sounds like boasting, but it is true).</p>' +
      '<p>S: like seeds from a dandelion clock. P: a star is born, lives and dies. H: numbers to make your head spin. M: you are made of stardust.</p>' +
      '<p>Cut: &ldquo;a great ball of fire&rdquo; (nothing on the Sun is burning; its core joins atoms together) and &ldquo;a cosmic vacuum cleaner&rdquo; (from far away a black hole pulls no harder than a star of the same mass).</p>' +
      '<p>The fact inside &ldquo;stardust&rdquo;: apart from the hydrogen, which is older than any star, nearly every atom in your body was made inside stars.</p>');
    SD.terms(['fact', 'figure of speech', 'simile', 'metaphor', 'personification', 'hyperbole']);
    paint(); busy = true;
    ER.narrate([
      'Nuala has stopped painting to listen. &ldquo;Made of stardust,&rdquo; she says. &ldquo;I&rsquo;ve heard that. I always thought it was just a nice thing to say.&rdquo;',
      '&ldquo;It is a nice thing to say,&rdquo; says Zainab. &ldquo;It also happens to be true. That&rsquo;s the whole trick.&rdquo; She tucks the two pages into the folder with the others. Seven scenes out of eight, and the front sheet.',
      'Far below, a door bangs, and somebody laughs in the foyer: the first of the audience, early, being told politely to wait. Zainab looks at her stopwatch. &ldquo;Ten to seven.&rdquo;',
      'Nuala points her roller at the hatch. &ldquo;The last one went out there. I heard it go along the roof. There&rsquo;s a walkway round the outside of the dome, and a rail. Hold the rail.&rdquo;'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
</body>
</html>
