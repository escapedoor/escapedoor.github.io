  #flut rect:nth-child(3){animation-duration:7.6s;animation-delay:-4.6s}

  /* the lock: the brass rail of the walk */
  .walk{padding:12px 18px 12px;background:#2c2014 linear-gradient(180deg,#3a2a1a,#241a10);border:1px solid #8a6a3a;box-shadow:0 26px 70px rgba(0,0,0,.7);color:#f6ead2}

  .walk .track{display:block;width:100%;height:auto;touch-action:none}
  .walk .pin{cursor:grab}
  .walk .pin.sel line{stroke:#ffd27a}
  .walk .pin.sel text{fill:#ffd27a}
  .walk .ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;margin:6px 0 8px}
  .walk .pk{padding:6px 12px;border:2px solid #7a5a32;border-radius:3px;font-family:'Outfit',sans-serif;font-size:14px;letter-spacing:.12em;color:#f6ead2;background:#3a2a1a}

  .walk .ng{padding:6px 11px;border:1px solid #c8a060;border-radius:3px;font-family:'Outfit',sans-serif;font-size:14px;color:#f0c070;background:#2a1e12}
  .walk .ng:hover,.walk .pk:hover{border-color:#ffd27a}
  .walk .read{display:inline-block;min-width:170px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:18px;letter-spacing:.06em;color:#ffd27a}
  .walk .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .walk .box{padding:8px 10px 10px;background:rgba(0,0,0,.22);border:1px dashed #8a6a3a}
  .walk .box>i{display:block;margin:0 0 6px;font-style:normal;font-family:'Alegreya',serif;font-size:16.5px;line-height:1.3;color:#f0dcb8}
  .walk .opts{display:flex;flex-wrap:wrap;gap:6px}
  .walk .op{padding:5px 9px;border:2px solid #6a5030;border-radius:14px;font-family:'Outfit',sans-serif;font-size:13.5px;color:#f6ead2;background:#3a2a1a}

  .walk .op.on{border-color:#ffd27a;background:#5a3e20;color:#fff3d6}
  .walk .op.bad,.walk .pk.bad{border-color:#ff7a5a;background:#6a2a1a}

  .walk .sign .op.on{background:#ffe2a0;border-color:#c86a10;color:#2a1a08}

    if (lock && document.body.contains(lock)) return ['walk', [
      'Start with the Sun. The plaque says the brass ball is 14 cm across, and the real Sun is 1.4 million km across. So how many real kilometres does one centimetre of the model stand for?',
      'One centimetre of the model is 100,000 real kilometres. Divide each real distance by 100,000 to get centimetres, then by 100 to get metres. Do the same with the Earth&rsquo;s size (12,700 km), and with the nearest star (count the noughts: 1,000 metres make a kilometre).',
      'Mercury: 58,000,000 &divide; 100,000 = 580 cm, so Mercury goes 5.8 m from the Sun. Do Venus, the Earth and Mars the same way. The Earth&rsquo;s ball is 12,700 &divide; 100,000 = 0.127 cm across: how many millimetres is that? And 40,000,000,000,000 &divide; 100,000 = 400,000,000 cm: turn that into kilometres.'
    ]];
    if (!told.has('zainab')) return ['zainab', ['Zainab Roper, by the ticket desk, is going to read the script tonight. Click her.']];
    if (!allRead()) return ['read', [
      'Three things here matter: the brass plaque on the Sun&rsquo;s pillar by the doors, the page with a boot print on it on the floor by the ticket desk, and the map of the walk on the wall by the stairs.',
      'Click each of them. Everything you read goes into your notebook, so you can look at it again later.'

    return ['heap', ['Everything is read. Click the planets heaped at the far end of the brass rail, near the stairs, and put the walk back.']];
  }

  function X(m) { return 40 + m * 40; }

    svg += '</svg>';

  }

  function solved(st) {
    var bead = BEADS.filter(function (b) { return b[0] === st.b; })[0][1].split(' &middot; ')[0], sign = SIGNS.filter(function (b) { return b[0] === st.s; })[0][1];
    var v = st.v;
    ER.addClue('scB', 'A Grapefruit in the Foyer', SD.page('A GRAPEFRUIT IN THE FOYER',
      '<p class="dir">(The presenter stands by the dome door. House lights half up.)</p>' +
      '<p>On your way in tonight, you walked past the Sun. It is the brass ball by the front door, fourteen centimetres across: about the size of a grapefruit.</p>' +
      '<p>And you walked past the Earth. Did you see it? It is <span class="filled">' + bead + '</span>, <span class="filled">' + v.ear.toFixed(0) + '</span> metres from the grapefruit, at the foot of the stairs. Mercury is <span class="filled">' + v.mer.toFixed(1) + '</span> metres from the Sun, Venus <span class="filled">' + v.ven.toFixed(1) + '</span>, and Mars is out in the corridor, <span class="filled">' + v.mar.toFixed(1) + ' metres</span> away. Jupiter, a marble, is at the bus shelter.</p>' +
      '<p>So if the Sun is a grapefruit, where is the next grapefruit: the nearest star? <span class="filled">' + sign.split(':')[0] + ' away</span>.</p>' +
      '<p>Between here and there: nothing. Almost nothing at all.</p>', 'the numbers pencilled back over the boot print'), 'script', 'Script page');
    SD.mine('scale', 'The scale of the walk', '<p>Sun: 14 cm for 1,400,000 km, so 1 cm = 100,000 km (and 1 m = 10 million km).</p>' +
      '<p>Mercury 58 million km &rarr; 580 cm = 5.8 m. Venus 108 &rarr; 10.8 m. Earth 150 &rarr; 15 m. Mars 228 &rarr; 22.8 m.</p>' +
      '<p>The Earth: 12,700 km &rarr; 0.127 cm = about 1.3 mm, a pinhead.</p>' +
      '<p>The nearest star: 40,000,000,000,000 km &rarr; 400,000,000 cm = 4,000,000 m = 4,000 km. A tenth of the way round the world.</p>');
    SD.terms(['scale model', 'scale']);
    paint(); busy = true;
    ER.narrate([
      'A pinhead, fifteen metres from a grapefruit. Zainab stands at the foot of the stairs and looks back at the brass Sun by the door, and for a moment neither of you says anything. That is the whole trick of the first scene: the audience has walked it before anybody explains it.',
      '&ldquo;And the next grapefruit is four thousand kilometres away,&rdquo; she says. &ldquo;With nothing in between. Every time I read that line, I want to sit down.&rdquo;',
      'She pencils the numbers back over the boot print, small and neat, and puts the page in the blue folder. One scene back. At lunchtime there were ten sheets in that folder, and she counted them: a front sheet of notes, eight scenes, and one more sheet at the back.',
      'Up the stairwell, a door bangs in the draught. On the first floor there is only one door that is never locked: Sabine&rsquo;s old office, which nobody has used since she retired, and which the painters asked to have emptied today.'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
