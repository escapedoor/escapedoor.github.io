  /* the lock: two pages on the blotter, and the cards from the box */
  .blot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px;background:#1e3a2e linear-gradient(160deg,#25443a,#17302a);border:6px solid #5a3a22;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .blot h5{grid-column:1/3;margin:0;font-family:'Special Elite',monospace;font-weight:normal;font-size:17px;letter-spacing:.12em;text-align:center;color:#d8eedc}

  .sheetp p{margin:0 0 5px}
  .gp{min-height:46px;margin:4px 0 6px;border:2px dashed #b04a3a;background:rgba(176,74,58,.06);position:relative}
  .gp>i{z-index:1;position:absolute;right:6px;top:-11px;padding:0 5px;background:#f7f2e4;font-style:normal;font-family:'Caveat',cursive;font-size:17px;color:#b04a3a}
  .gp.bad{border-color:#ff5a3a;background:rgba(255,90,58,.18)}
  .gp .slip{box-shadow:none}
  .tray{grid-column:1/3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:7px;min-height:60px;background:rgba(0,0,0,.2);border:1px solid #4a6a5a}
  .tray .slip,.gp .slip{font-size:12.3px;line-height:1.22;padding:4px 7px;background:#fffdf4 repeating-linear-gradient(transparent 0 15px,rgba(80,120,170,.25) 15px 16px);border-top:5px solid #e06a5a}
  .slip.hand{font-family:'Caveat',cursive;font-size:17px;line-height:1.05;background:#fbf2dc;border-top-color:#8a6a3a}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#zainab').innerHTML = SD.fig({ h: 320, coat: '#1c1c26', legs: '#24243a', skin: '#a8724e', hair: '#2a7a78', hairStyle: 'scarf', lanyard: '#e8802a', armL: 'front', specs: true });

  ER.init({
    theme: 'lit', story: 'stardust', storyTitle: 'Stardust at Half Past Seven', id: 'office', no: 'II', title: 'The Writer&rsquo;s Office',
    go: 'Go in',
    intro: [
      'You found the scale of the walk on the plaque: a brass Sun 14 centimetres across for a real one 1.4 million kilometres across, so one centimetre stands for 100,000 kilometres. Divide by the same number every time, and Mercury goes back at 5.8 metres, Venus at 10.8, the Earth at 15 and Mars at 22.8, out in the corridor. The Earth itself is a pinhead, and the next grapefruit, the nearest star, would be 4,000 kilometres away. The first scene is back in the folder, with its numbers pencilled over the boot print.',
      'On the first floor the draught has found a door that is never locked. Sabine&rsquo;s old office has not been used since she retired, and the painters asked for it to be emptied today. At lunchtime, before she went home to change, Sabine came up and emptied it herself.'
    ],
    exit: {"next":"desk","w":{"54eba76d":"db331e85"}}, tags: {"cp":["4053e8f9"],"cb":["b4f23f9b"],"dp":["a2e0b173"],"db":["d32377c3"],"mis":["ea4d2b11","6e332d07"],"tech":["c86a74a3","956841b3"],"mixed":["ac632390"],"works":["426a8234"],"triv":["63bd898e","bff1a1fa","29f012b7"],"lyr":["552f9fda","b4965ebc","cf8f0ba4","162dd60f","312e530a","70c5526a"],"brk":["11424441","e02a1ed8","8eb77463","cede790b","eff3d858","1753ba9d"],"draft":["f70c84a6"]},
    hints: hints, onBegin: begin
  });

  told = SD.told('b-told'); nextFile = ER.flag('b-file') || null;
  function isBusy() { return busy; }
  function ready() { return told.has('pages') && told.has('nbk') && told.has('board'); }
  function paint() {
    $('#scene').classList.toggle('done', !!nextFile);
    $('#pages').classList.toggle('ready', !told.has('pages'));
    $('#nbk').classList.toggle('ready', told.has('pages') && !told.has('nbk'));
    $('#board').classList.toggle('ready', told.has('pages') && !told.has('board'));
    $('#bin').classList.toggle('ready', told.has('zainab') && !told.has('bin') && !nextFile);
    $('#box').classList.toggle('ready', ready() && !nextFile);
    var n = ['pages', 'nbk', 'board', 'zainab', 'bin'].filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0);
    ER.pips(n, 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The two pages are whole again. The button at the bottom of the screen goes through the back door, into the dome.']];
    if (lock && document.body.contains(lock)) return ['cards', [
      'Two pages, two gaps on each: first a picture, then one sentence that begins &ldquo;But&rdquo; and says where that picture breaks. Before you choose, look at the booking sheet again: who will be in the seats tonight?',
      'Leave out three kinds of card: a picture that would leave a false idea behind; a sentence that is true but is not a picture at all (it is for professors); and two pictures squashed into one sentence. For each &ldquo;But&rdquo;, choose the place where a child could really be misled, not a difference nobody would ever believe anyway.',
      'A light-year is a distance, not a time: the right picture gives a distance as a time, the way people talk about a journey. For the galaxies, rising dough suits a room of children, and a firework does not: a firework bursts out from one place, into a hall. And one &ldquo;But&rdquo; card says where the dough picture WORKS, not where it breaks.'
    ]];
    if (!told.has('pages')) return ['pages', ['The pages blew in under the door: they are lying on the floor just inside it, on the left. Click them.']];
    if (!ready()) return ['read', [
      'Two more things to read: Sabine&rsquo;s notebook, open on the desk under the green lamp, and the booking sheet pinned to the cork board.',
      'The notebook says how she chose a picture; the booking sheet says who is coming tonight. You need both. Zainab, and the bin, have something to say too.'
    ]];
    return ['box', ['Everything is read. The little wooden box on the desk marked ANALOGIES holds Sabine&rsquo;s cards: click it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Two pages whole again. Through the back door, somebody is swearing at a fuse.'); return; }
    if (told.has('in')) { busy = false; ER.say('Sabine&rsquo;s office. The skylight is full of stars now.'); return; }
    told.set('in'); SD.sfx.gust();
    ER.narrate([
      'The office door is banging gently in the draught, open, shut, open, like somebody who cannot make up their mind. You go in, and Zainab comes up the stairs behind you.',
      'It is a small green room under the roof, with a skylight full of evening. A desk, a typewriter, a lamp with a green shade, a cork board, a wall of books, and a cardboard box with S.Q. &mdash; HOME written on it in thick pen.',
      'The wastepaper bin is full to the top. Sabine cleared out her desk drawer this afternoon, and most of it went in there.',
      'Three pages from the script have blown in under the door and fanned out across the floorboards, as if somebody had dealt them.',
      'And on the desk, beside her notebook, there is a small wooden box of index cards. On its lid, in her square typewriter letters: ANALOGIES.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var GAP = '<span class="gap">[picture]</span>', BRK = '<span class="gap">[where the picture breaks]</span>';
  var SC = SD.page('THE NEXT GRAPEFRUIT',
    '<p class="dir">(The house lights go down. The dome fills with stars.)</p>' +
    '<p>So the Earth is a pinhead, fifteen metres from a grapefruit. Now take a bigger step. The nearest star, Proxima Centauri, is another grapefruit, four thousand kilometres away.</p>' +
    '<p>Its light takes more than four years to reach us. Astronomers say it is 4.2 light-years away.</p><p>' + GAP + '</p><p>' + BRK + '</p>' +
    '<p>Every star you can see in the dome tonight is further away than that.</p>');
  var SDp = SD.page('EVERYTHING IS MOVING APART',
    '<p class="dir">(The stars fade. Faint smudges of light appear all over the dome: galaxies.)</p>' +
    '<p>Our Sun is one star among hundreds of billions in our galaxy, the Milky Way. And beyond the Milky Way there are other galaxies: billions of them.</p>' +
    '<p>In the 1920s astronomers found something strange. Nearly all the other galaxies are moving away from us, and the further away a galaxy is, the faster it is going. That does not mean we are in the middle: from any galaxy, you would see the same thing.</p><p>' + GAP + '</p><p>' + BRK + '</p>' +
    '<p>The galaxies are not flying out through space. Space itself is stretching between them.</p>');
  var SE = SD.page('WHERE DID IT BEGIN?',
    '<p class="dir">(Very slowly, the smudges begin to slide back towards the top of the dome.)</p>' +
    '<p>If everything is moving apart today, then yesterday it was all a little closer together. Last year, closer still. Run the film backwards, a thousand million years at a time&hellip;</p>' +
    '<p>&hellip;and you come to a moment when everything we can see was packed into one tiny, unbelievably hot place.</p>' +
    '<p>When was that? And what has happened since?</p>');
  var NOTE = '<span class="date">March 1992</span><h4>Analogies</h4>' +
    '<svg viewBox="0 0 420 120"><g fill="none" stroke="#1d3d32" stroke-width="2.5"><circle cx="150" cy="60" r="52"/><circle cx="250" cy="60" r="52"/></g>' +
    '<g font-family="Caveat,cursive" font-size="19" fill="#1d3d32" text-anchor="middle"><text x="120" y="64">what they</text><text x="120" y="82">know</text><text x="280" y="64">what is</text><text x="280" y="82">new</text><text x="200" y="66" fill="#7a1e14">alike</text>' +
    '<text x="390" y="34" fill="#7a1e14">breaks!</text></g><path d="M300 30q40 -16 62 0" fill="none" stroke="#7a1e14" stroke-width="2"/></svg>' +
    '<p>An <b>analogy</b> explains something new by comparing it with something the listener already knows. It borrows the shape of the thing they know.</p>' +
    '<p>1. Choose it for the people in front of you. A picture that works for a room of professors will lose a room of nine-year-olds, and the other way round. Use things they have touched, eaten or done.</p>' +
    '<p>2. Every analogy <b>breaks down</b> somewhere: the real thing is like the picture in some ways, and not in others. Find the place where a listener would be MISLED, and say it out loud: &ldquo;But here the picture breaks&hellip;&rdquo; Don&rsquo;t waste that sentence on a difference nobody would believe anyway.</p>' +
    '<p>3. Never mix two pictures in one sentence.</p>' +
    '<p>4. A misleading analogy is worse than none. It leaves a false picture, and false pictures last for life.</p>' +
    '<p>I choose the picture on the night, when I know who is sitting under the dome.</p>';
  var BOOK = '<h4>LAST SHOW &middot; Saturday 7.30 pm</h4><h5>A Year in the Dark &middot; bookings &middot; doors 7.00</h5>' +
    '<table><tr><th>Who</th><th>Seats</th></tr>' +
    '<tr><td>Rosewarne Young Astronomers (ages 8 to 12), with two leaders</td><td>24</td></tr>' +
    '<tr><td>Family tickets (children from age 6)</td><td>62</td></tr>' +
    '<tr><td>Seat F1: Ms S. Quennell (the aisle, please, and a cushion)</td><td>1</td></tr>' +
    '<tr><td>Seat F2: guest of Ms Quennell</td><td>1</td></tr>' +
    '<tr><td><b>Total: SOLD OUT</b></td><td><b>88</b></td></tr></table>' +
    '<p>Staff tonight: Z. Roper (presenter), T. Stobbs (control desk), and our youngest volunteer (programmes and torch).</p>' +
    '<p class="hand">Last show, so expect tears. Tissues are behind the ticket desk. &mdash; box office</p>';
  var DRAFT = '<span class="date">(no date)</span><h4>Everything moving apart</h4>' +
    '<p>Try: think of a <b>firework</b> bursting in a dark, empty hall. Every spark flies away from the bang, and the fastest sparks get furthest.</p>' +
    '<p style="font-size:30px;color:#7a1e14">USE THIS ONE! &nbsp;S.</p>' +
    '<div style="margin-top:12px;padding:8px 12px;background:#efe6d0;font-family:Outfit,sans-serif;font-size:15px;line-height:1.35;color:#3a3020;transform:rotate(.6deg)">' +
    '<b style="color:#3a3020">On the back of the sheet, printed:</b><br>ROSEWARNE PLANETARIUM &middot; SPRING PROGRAMME 1991<br>The Sky This Spring (daily, 2 pm) &middot; Comet! (weekends) &middot; The Planets (school groups)</div>';

  $('#pages').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SC, cls: 'script', clue: { id: 'scC0', title: 'The Next Grapefruit (with gaps)', kind: 'Script page' }, done: function () {
      ER.read({ html: SDp, cls: 'script', clue: { id: 'scD0', title: 'Everything Is Moving Apart (with gaps)', kind: 'Script page' }, done: function () {
        ER.read({ html: SE, cls: 'script', clue: { id: 'scE', title: 'Where Did It Begin?', kind: 'Script page' }, done: function () {
          SD.terms(['light-year', 'galaxy']);
          if (told.set('pages')) { paint(); ER.say('Three pages. Two of them have gaps typed into them on purpose: [picture], and under it, [where the picture breaks].'); }
        } });
      } });
    } });
  });
  $('#nbk').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: NOTE, cls: 'note', clue: { id: 'analogies', title: 'Analogies', kind: 'Sabine&rsquo;s notebook' }, done: function () {
      SD.terms(['analogy', 'break down', 'misleading', 'mixed metaphor', 'audience']);
      if (told.set('nbk')) { paint(); ER.say('&ldquo;I choose the picture on the night, when I know who is sitting under the dome.&rdquo; So who is?'); }
    } });
  });
  $('#board').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOOK, cls: 'leaflet', clue: { id: 'booking', title: 'Bookings for the last show', kind: 'Cork board' }, done: function () {
      if (told.set('board')) { paint(); ER.say('Eighty-eight seats, sold out. You count the ages in your head.'); }
    } });
  });
  $('#bin').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DRAFT, cls: 'note', clue: { id: 'draft', title: 'A page from the bin', kind: 'In Sabine&rsquo;s hand' }, done: function () {
      if (told.set('bin')) { paint(); ER.say('&ldquo;Her own hand,&rdquo; says Zainab, over your shoulder. &ldquo;USE THIS ONE, in capitals. I&rsquo;d call that a clue.&rdquo;'); }
    } });
  });
  $('#zainab').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Raisins,&rdquo; says Zainab. &ldquo;Twelve years of physics, and I&rsquo;m going to say raisins. She was right, though.&rdquo;'); return; }
    ER.talk({
      who: 'Zainab Roper', role: 'presenter', face: window.FACE('zainab'),
      lines: [
        { note: 'Zainab looks round the office as if she has been in it before, which she has: she was nine, on a school trip, and Sabine let her type her name on the typewriter.', a: '&ldquo;Three pages. Light-years, everything moving apart, and where it all began. Two of them have holes in them.&rdquo;' },
        { q: 'Why are there gaps in the script?', a: '&ldquo;That was her way. She never typed the analogy into the script. She kept a box of them on cards and chose on the night, when she knew who was in. Then, under the picture, one more line: where the picture goes wrong. Every single time.&rdquo;' },
        { q: 'Which would you choose?', a: '&ldquo;Honestly? I&rsquo;d say it straight: the scale factor of the universe increases with time. No pictures, no lies. But I&rsquo;m not the one in the seats. Check who is.&rdquo;' },
        { q: 'What is in the bin?', a: '&ldquo;Her desk drawer, mostly. Thirty years of it. There&rsquo;s a page on the top in her own handwriting that says USE THIS ONE, in capitals. If she says use it, I&rsquo;m inclined to use it.&rdquo;' }
      ],
      clue: { id: 'zainab2', title: 'Zainab, in the office', kind: 'What she said' },
      done: function (seen) { if (seen && told.set('zainab')) paint(); }
    });
  });
  SD.thing('#type', 'typescript', 'Her typewriter. There is still a sheet on the roller, with one line typed on it years ago: <i>True is not enough.</i>', isBusy);
  SD.thing('#photo', null, 'A photograph labelled OPENING NIGHT: Sabine in 1992, laughing, beside the star projector, and a lanky young man in overalls holding a ladder as if it might escape.', isBusy);
  SD.thing('#cbox', null, 'S.Q. &mdash; HOME. Books, a scarf, a jar of pencils, and a tin of travel sweets with one sweet left in it.', isBusy);
  SD.thing('#globe', null, 'An old globe, faded by the skylight. Somebody has stuck a tiny gold paper star on this town.', isBusy);
  SD.thing('#mugs', null, 'Two mugs. One says I NEED SPACE. The other has a ring of very old tea in it.', isBusy);
  SD.thing('#sky', null, 'The skylight is full of evening. The first stars are out, and the draught whistles round the frame.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  function openOrSay() {
    if (busy) return;
    if (nextFile) { ER.say('The cards are back in the box, all but two.'); return; }
    if (!ready()) { ER.say(told.has('pages') ? 'A box of picture cards. Before you choose from it: how did Sabine choose (her notebook, on the desk), and who is coming tonight (the booking sheet, on the cork board)?' : 'A box of index cards. First pick up the pages that blew in under the door.'); return; }
    openLock();
  }
  $('#box').addEventListener('click', openOrSay);

  /* ---------- the lock: a picture and a "but" for each page ---------- */
  var CARDS = [
    ['a1', 'But the raisins do not get any bigger as the dough rises.'],
    ['a2', 'You know how people say the seaside is &lsquo;two hours away&rsquo;? That is a distance, given as a time. A light-year is the same kind of thing: the distance light travels in one year.'],
    ['a3', 'The galaxies are raisins in a rising cake, racing away from each other like runners at the sound of the starting gun.'],
    ['a4', 'But a car can go faster or slower. Light in empty space always goes at exactly the same speed, so a light-year is always exactly the same distance.'],
    ['a5', 'Think of a firework bursting in a dark, empty hall: every spark flies away from the bang. USE THIS ONE! S.', 'hand'],
    ['a6', 'But a loaf has a middle and an edge, and an oven round it. As far as anybody knows, the universe has no middle, no edge, and nothing outside it.'],
    ['a7', 'One light-year is 9.46 &times; 10<sup>12</sup> km: the speed of light multiplied by one Julian year of 365.25 days.'],
    ['a8', 'Think of dough with raisins in it, rising in a warm oven. As it swells, every raisin moves away from every other raisin, and the ones furthest apart move apart fastest.'],
    ['a9', 'But the seaside is a much nicer place to go than outer space.'],
    ['a10', 'The scale factor of the universe increases with cosmic time, so the proper distances between galaxies grow.'],
    ['a11', 'A light-year is like a very, very long year: the kind of year that light has.'],
    ['a12', 'But the seaside is not nearly as far away as a star.'],
    ['a13', 'But you can eat a cake, and you cannot eat a galaxy.']
  ];
  var SLOTS = [['cp', 'the light-year: picture'], ['cb', 'the light-year: where it breaks'], ['dp', 'moving apart: picture'], ['db', 'moving apart: where it breaks']];
  function openLock() {
    var busyL = false, put = ER.flag('b-put') || {};
    lock = ER.el('div', 'blot');
    lock.innerHTML = '<h5>Choose the picture for tonight&rsquo;s audience, and say where it breaks</h5>' +
      '<div class="sheetp"><b>THE NEXT GRAPEFRUIT</b><p>&hellip; The nearest star, Proxima Centauri, is another grapefruit, four thousand kilometres away. Its light takes more than four years to reach us. Astronomers say it is 4.2 light-years away.</p>' +
      '<div class="gp" data-s="cp"><i>picture</i></div><div class="gp" data-s="cb"><i>where it breaks</i></div><p>Every star you can see in the dome tonight is further away than that.</p></div>' +
      '<div class="sheetp"><b>EVERYTHING IS MOVING APART</b><p>&hellip; Nearly all the other galaxies are moving away from us, and the further away a galaxy is, the faster it is going. From any galaxy, you would see the same thing.</p>' +
      '<div class="gp" data-s="dp"><i>picture</i></div><div class="gp" data-s="db"><i>where it breaks</i></div><p>The galaxies are not flying out through space. Space itself is stretching between them.</p></div>' +
      '<div class="tray"></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="typein">Type them in</button>');
    var wrap = ER.el('div', 'pz'); wrap.appendChild(lock); wrap.appendChild(foot);
    var tray = lock.querySelector('.tray'), m = foot.querySelector('.pmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    CARDS.forEach(function (c) {
      var d = ER.el('div', 'slip dnd-item' + (c[2] ? ' ' + c[2] : ''), ER.gloss(c[1])); d.setAttribute('data-c', c[0]);
      var at = put[c[0]], s = at ? lock.querySelector('.gp[data-s="' + at + '"]') : null;
      (s && !s.querySelector('.slip') ? s : tray).appendChild(d);
    });
    function keep() {
      put = {}; ER.$$('.gp', lock).forEach(function (g) { var s = g.querySelector('.slip'); if (s) put[s.getAttribute('data-c')] = g.getAttribute('data-s'); });
      ER.flag('b-put', put);
    }
    function clearBad() { ER.$$('.bad', lock).forEach(function (n) { n.classList.remove('bad'); }); }
    ER.dnd(lock, { item: '.slip', slot: '.gp', home: tray, lock: function () { return busyL || !!nextFile; }, change: function () { keep(); clearBad(); SD.sfx.pencil(); } });
    function why(slot, c) {
      var pic = slot === 'cp' || slot === 'dp', ly = slot === 'cp' || slot === 'cb';
      if (pic && ER.check('brk', c)) return 'That card says where a picture breaks. This gap wants the picture itself.';
      if (!pic && !ER.check('brk', c)) return 'This gap wants the sentence that comes after the picture: the place where it breaks. Sabine always began that sentence with &ldquo;But&rdquo;.';
      if (ly !== ER.check('lyr', c)) return 'That card is about the other idea: ' + (ly ? 'everything moving apart, not the light-year.' : 'the light-year, not everything moving apart.');
      if (ER.check('draft', c)) return 'Zainab picks up the card from the bin and turns it over. On the back, printed: SPRING PROGRAMME 1991. &ldquo;The show opened in 1992,&rdquo; she says slowly. &ldquo;She wrote this a year before it, and today she finished throwing it away.&rdquo; And a firework bursts out from one place into a hall round it. What would the children go home believing?';
      if (ER.check('mis', c)) return 'Would a listener go home believing something false? Read her notebook again: a misleading analogy is worse than none.';
      if (ER.check('tech', c)) return 'True, every word of it. But it is not a picture at all, and who is in the seats tonight? Look at the booking sheet.';
      if (ER.check('mixed', c)) return 'Two pictures in one sentence. What does the notebook say about that?';
      if (ER.check('works', c)) return 'Look again: that is a place where the picture WORKS. Galaxies do not get bigger as space stretches, either. Where could a listener really be misled?';
      if (ER.check('triv', c)) return 'True, but would anybody ever have believed otherwise? Spend that sentence where a listener could really go wrong.';
      return 'That card does not belong in this gap.';
    }
    foot.querySelector('#typein').addEventListener('click', function () {
      if (busyL || nextFile) return;
      clearBad();
      var i, g, s, c;
      for (i = 0; i < SLOTS.length; i++) {
        g = lock.querySelector('.gp[data-s="' + SLOTS[i][0] + '"]'); s = g.querySelector('.slip');
        if (!s) { ER.sfx.no(); g.classList.add('bad'); msg('There is still an empty gap: ' + SLOTS[i][1] + '. Drag a card into it, or click a card and then the gap.'); return; }
        c = s.getAttribute('data-c');
        if (!ER.check(SLOTS[i][0], c)) {
          ER.sfx.no(); g.classList.add('bad'); s.classList.add('bad');
          msg(why(SLOTS[i][0], c) + ' <i>(Only the first gap that is wrong is ever shown.)</i>'); return;
        }
      }
      var cand = SLOTS.map(function (sl) { return lock.querySelector('.gp[data-s="' + sl[0] + '"] .slip').getAttribute('data-c'); }).join('/');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The typewriter jams. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('b-file', file); busyL = true; SD.sfx.pencil();
      var txt = {}; SLOTS.forEach(function (sl) { txt[sl[0]] = lock.querySelector('.gp[data-s="' + sl[0] + '"] .slip').innerHTML; });
      msg('Zainab feeds the two pages into the typewriter one after the other and types the cards in, hitting the keys hard, as if they might argue.');
      setTimeout(function () { ER.closeAll(); solved(txt); }, 2400);
    });
    msg('Drag a card from the box into each gap, or click a card and then a gap. Every card is one of Sabine&rsquo;s, and most of them are true. Not all of them belong here tonight.');
    ER.open('ov-lock', wrap);
  }

  function solved(t) {
    ER.addClue('scC', 'The Next Grapefruit', SD.page('THE NEXT GRAPEFRUIT',
      '<p class="dir">(The house lights go down. The dome fills with stars.)</p>' +
      '<p>So the Earth is a pinhead, fifteen metres from a grapefruit. Now take a bigger step. The nearest star, Proxima Centauri, is another grapefruit, four thousand kilometres away.</p>' +
      '<p>Its light takes more than four years to reach us. Astronomers say it is 4.2 light-years away.</p><p>' + t.cp + '</p><p>' + t.cb + '</p>' +
      '<p>Every star you can see in the dome tonight is further away than that.</p>'), 'script', 'Script page');
    ER.addClue('scD', 'Everything Is Moving Apart', SD.page('EVERYTHING IS MOVING APART',
      '<p class="dir">(The stars fade. Faint smudges of light appear all over the dome: galaxies.)</p>' +
      '<p>Our Sun is one star among hundreds of billions in our galaxy, the Milky Way. And beyond the Milky Way there are other galaxies: billions of them.</p>' +
      '<p>In the 1920s astronomers found something strange. Nearly all the other galaxies are moving away from us, and the further away a galaxy is, the faster it is going. That does not mean we are in the middle: from any galaxy, you would see the same thing.</p><p>' + t.dp + '</p><p>' + t.db + '</p>' +
      '<p>The galaxies are not flying out through space. Space itself is stretching between them.</p>'), 'script', 'Script page');
    SD.mine('pictures', 'Choosing a picture', '<p>Tonight&rsquo;s audience: mostly children from 6 to 12, and their families.</p>' +
      '<p>Light-year: &ldquo;two hours away&rdquo; gives a distance as a time. But it breaks: cars change speed, light never does.</p>' +
      '<p>Moving apart: raisins in rising dough. It works (the raisins do not grow, and neither do galaxies), but it breaks: dough has a middle and an edge; the universe has neither.</p>' +
      '<p>Out: the firework (a draft she threw away in 1991: it has a centre and a hall round it), the &ldquo;very long year&rdquo; (it makes a light-year a time), two pictures in one sentence, and the professors&rsquo; sentences.</p>');
    SD.terms(['analogy', 'break down', 'misleading', 'mixed metaphor', 'audience']);
    paint(); busy = true;
    ER.narrate([
      'Zainab reads the two pages aloud to the empty office, the way she will read them to eighty-eight people in two hours. The seaside. The dough. And after each one, the sentence that says where it stops being true.',
      '&ldquo;That&rsquo;s what I always loved about her shows,&rdquo; she says. &ldquo;She told you the lie and then took it back, and you trusted her more for it.&rdquo;',
      'She looks at the firework page from the bin for a while, then folds it carefully and puts it in her pocket instead of back in the bin.',
      'From the back of the office a short corridor leads to the dome&rsquo;s back door. Behind it there is a clang, a flash of blue light, and a voice saying something about fuses that is not in any script.'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
})();
</script>
