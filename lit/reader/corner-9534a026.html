  function hints() {
    if (nextFile) return ['go', ['Juno&rsquo;s six beginnings belong to books in the stacks. The button is at the bottom of the screen.']];
    if (srt && srt.parentNode) return ['sort', [
      'For each book, ask what the hero most needs to do or find out. Then find the picture on the guide that matches that problem. Two books go on every shelf.',
      'Six of the books are wearing another genre&rsquo;s coat: a ghost that is really a thief, a moon that is really a mountain, a journey in a walnut shell, a machine in a school, a school with a ghost in it, and a detective who never solves it. Decide by the main problem, not the setting.',
      'The Grey Lady is a thief, so Mystery. The Mountains of the Moon are in Africa, so Adventure. The walnut-shell boy and the Sea King: Fairy tale. The computer that prints tomorrow: Science fiction. Ellie and the head girl: School story. The chapel footsteps are never explained: Ghost story. And one book has every sign at once.'
    ]];
    if (!told.has('card')) return ['card', [
      'The corner was where Juno began. Is there anything of hers here?',
      'There is a card pinned to the bow of the red book boat, on the right. Click it.'
    ]];
    if (!told.has('guide')) return ['guide', [
      'Juno says: put every book back where it belongs. How did Mrs Pumphrey decide where a book belongs?',
      'Her shelving guide hangs in a red frame on the wall, near the boat. Read it.'
    ]];
    return ['crate', ['The books are in the crate on the rug. Click it, and put every book on its shelf.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Two books on every shelf. And Juno&rsquo;s own book, with six beginnings in it.'); return; }
    if (told.has('in')) { busy = false; ER.say('The children&rsquo;s corner. The books are still in the crate.'); return; }
    told.set('in');
    $('#scene').classList.remove('gone');
    ER.narrate([
      'It is a low, warm corner under the stairs, with a wooden boat to sit in, a rug like a map of an island, and a green dragon asleep along the wall. All the little shelves are empty.',
      'A big man in blue overalls is tipping the last books into a crate marked 10p, any old how. He sees Mrs Pumphrey and goes red to the ears.',
      '&ldquo;Council&rsquo;s orders, Mrs P,&rdquo; he says. &ldquo;Everything boxed by eleven.&rdquo; He picks up a box marked LOCAL HIST. and hurries off with it: not towards the front door and the skip, but through the little door marked BOILER ROOM, and down the stairs.',
      'Mrs Pumphrey watches him go. &ldquo;Archie Lumb,&rdquo; she says. &ldquo;Twenty-two years our caretaker. I would not have thought it of him.&rdquo;',
      'On the bow of the book boat, held on with a drawing pin, is a card in Juno&rsquo;s writing.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var CARD = '<h4>Pinned to the boat</h4><p>Mrs P,</p><p>Put every book back where it belongs, the way you taught me: two on every shelf.</p><p>The one that belongs on no shelf is mine.</p><p style="text-align:right">J.</p>';
  function guideHtml() {
    var G = [['m', 'Mystery', 'something has happened, and nobody knows who or how. A clue, a suspect, a sharp-eyed hero.'],
      ['a', 'Adventure', 'a dangerous journey through wild places: get there, get the treasure, get home alive.'],
      ['f', 'Fairy tale', 'once upon a time: kings, witches, magic, things in threes, and the youngest wins.'],
      ['s', 'Science fiction', 'the future, space, a machine: what if science changed everything?'],
      ['c', 'School story', 'one term at one school: a new pupil, a rival, a match, a rule broken.'],
      ['g', 'Ghost story', 'the past that will not rest. Cold rooms, footsteps in the dark. Is it real?']];
    return '<h4>Where does it go?</h4><h5>The shelving guide for the children&rsquo;s corner &middot; E. Pumphrey</h5>' +
      '<p>Every kind of book, every <b>genre</b>, has its signs: the <b>setting</b>, the hero, the problem, and the words on the first page.</p>' +
      G.map(function (g) { return '<div class="g">' + RD.iconSvg(g[0], '#1d4e6e', 28) + '<p><b>' + g[1] + ':</b> ' + g[2] + '</p></div>'; }).join('') +
      '<p class="rule">Books borrow each other&rsquo;s coats. Decide by the main problem, not the setting. A ghost that turns out to be a burglar in a sheet belongs to Mystery.</p>';
  }
  $('#boat').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'jcard', clue: { id: 'card', title: 'A card on the boat', kind: 'In Juno&rsquo;s writing' }, done: function () {
      if (told.set('card')) { paint(); ER.say('Two on every shelf. Mrs Pumphrey&rsquo;s shelving guide hangs in the red frame by the boat. And Archie is back, for another box.'); }
    } });
  });
  $('#guide').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: guideHtml(), cls: 'guide', clue: { id: 'guide', title: 'Where does it go?', kind: 'The shelving guide' }, done: function () {
      RD.terms(['genre', 'setting', 'mystery', 'adventure', 'fairy tale', 'science fiction', 'school story', 'ghost story']);
      if (told.set('guide')) { paint(); ER.say(ready() ? 'Six shelves, and a crate of books. Click the crate.' : 'Six shelves and six pictures. Is there anything of Juno&rsquo;s here?'); }
    } });
  });

  /* ---------- the people ---------- */
  $('#pumphrey').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Six beginnings,&rdquo; says Mrs Pumphrey. &ldquo;She always said a first line is a door. The stacks, then.&rdquo;' :
      !ready() ? '&ldquo;Juno started here when she was three,&rdquo; says Mrs Pumphrey. &ldquo;She read everything on these shelves by the time she was eight. Then she read it all again, to check.&rdquo;' :
      '&ldquo;Two on every shelf,&rdquo; says Mrs Pumphrey. &ldquo;I made that rule so that no shelf would ever look lonely. Juno thought it was a law of nature.&rdquo;');
  });
  $('#archie').addEventListener('click', function () {
    if (busy) return;
    if (told.has('archie')) { ER.say('&ldquo;Got to get these down before the Councillor counts them,&rdquo; says Archie. He does not say down where.'); return; }
    ER.talk({
      who: 'Archie Lumb', role: 'Caretaker · Hopwell Free Library', face: window.FACE('archie'),
      lines: [
        { note: 'A big, slow man in blue overalls, with a torch and a packet of mints in his top pocket. He has been the caretaker for twenty-two years and still bangs his head on the stairs.', a: '&ldquo;Archie Lumb. Caretaker. For two more days, anyway.&rdquo;' },
        { q: 'Where are you taking those boxes?', a: 'He looks at his boots. &ldquo;Nowhere. The skip. Council&rsquo;s orders.&rdquo;</p><p>He does not look like a man who is going to the skip.' },
        { q: 'Who tipped out the books?', a: '&ldquo;Me. Sorry, Mrs P. The Councillor said ten pence a book, sort them later. I said who&rsquo;s going to sort them later, and he said nobody, that&rsquo;s the point.&rdquo;' },
        { a: '&ldquo;I&rsquo;d help you, but I&rsquo;ve got to get these down before he counts them.&rdquo; And off he goes again, carefully, through the boiler-room door.' }
      ],
      clue: { id: 'archie', title: 'Archie Lumb, with a box', kind: 'What he said' },
      done: function (seen) { if (seen) told.set('archie'); }
    });
  });

  RD.thing('#dragon', null, 'A green dragon asleep on a pile of books. Somebody once painted reading glasses on it, and nobody has ever painted them out.', isBusy);
  RD.thing('#lowwin', null, 'A window only knee-high from the floor, so that a child sitting on the rug can read by daylight. Whoever built this corner had thought about children.', isBusy);
  RD.thing('#rad', 'radiator', 'The radiator is warm. It always is, in here: the boiler room is right underneath.', isBusy);
  RD.thing('#bdoor', null, 'BOILER ROOM. STAFF ONLY. You can hear Archie somewhere below, moving boxes about, and humming.', isBusy);
  RD.thing('#rug', null, 'A rug like a map of a treasure island, with a red X on it. The X is worn right through.', isBusy);
  RD.thing('#shelves', 'shelf', function () { return nextFile ? 'Two books on every shelf, under every picture.' : 'Six little shelves, each with a painted picture over it, and not one book on any of them.'; }, isBusy);
  $('#crate').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The crate is empty, except for a little sawdust and a sweet wrapper from about 1997.'); return; }
    if (!ready()) { ER.say(told.has('card') ? 'A crate of books, tipped in any old how. How do you decide where each one goes? Read Mrs Pumphrey&rsquo;s guide first.' : 'A crate of books, 10p each, tipped in any old how. Is there anything of Juno&rsquo;s in this corner?'); return; }
    openSort();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the shelves ---------- */
  function openSort() {
    var lockd = false, misses = 0, put = ER.flag('b-put') || {};
    srt = ER.el('div', 'srt');
    srt.innerHTML = '<div class="wall"></div><div class="right"><div class="crate"></div><div class="read"><b>Click a book to read its back cover here.</b></div>' +
      '<div class="foot"><p class="bmsg"></p><button type="button" class="btn" id="s-go">Step back and look</button></div></div>';
    var wall = srt.querySelector('.wall'), crate = srt.querySelector('.crate'), rd = srt.querySelector('.read'), m = srt.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    /* each shelf has two places, so that a book is put beside another and never on top of it */
    BINS.forEach(function (g) { var d = ER.el('div', 'shelf'); d.setAttribute('data-g', g); d.innerHTML = '<b>' + RD.iconSvg(g, '#7a2a1e', 18) + RD.GENRES[g] + '</b><div class="slot"></div><div class="slot"></div>'; wall.appendChild(d); });
    BOOKS.forEach(function (b) {
      var d = ER.el('div', 'bk dnd-item' + (b.id === 'juno' ? ' juno' : ''), '<h6>' + b.t + '</h6><p>' + b.b + '</p>');
      d.setAttribute('data-b', b.id); if (b.id !== 'juno') { d.style.borderLeftColor = b.c; d.querySelector('h6').style.background = b.c; }
      var at = put[b.id], sl = null;
      if (at) ER.$$('.shelf[data-g="' + at + '"] .slot', wall).forEach(function (x) { if (!sl && !x.querySelector('.bk')) sl = x; });
      (sl || crate).appendChild(d);
      d.addEventListener('pointerdown', function () { rd.innerHTML = ER.gloss('<b>' + b.t + '</b><br>' + b.b); });
    });
    function keep() {
      put = {}; ER.$$('.shelf', wall).forEach(function (s) { ER.$$('.bk', s).forEach(function (c) { put[c.getAttribute('data-b')] = s.getAttribute('data-g'); }); });
      ER.flag('b-put', put);
    }
    RD.swapIn(srt, '.bk', '.slot', crate);
    ER.dnd(srt, { item: '.bk', slot: '.slot', home: crate, lock: function () { return lockd || !!nextFile; }, change: function () {
      ER.$$('.shelf', wall).forEach(function (s) { s.classList.remove('bad'); });
      keep();
    } });
    srt.querySelector('#s-go').addEventListener('click', function () {
      var i, s, bs, n = 0, bad = null, file, parts = [];
      if (lockd || nextFile) return;
      ER.$$('.shelf', wall).forEach(function (sh) { n += sh.querySelectorAll('.bk').length; });
      if (n < 12) { ER.sfx.no(); msg('Six shelves, two books on each: ' + (12 - n) + (12 - n === 1 ? ' place is' : ' places are') + ' still empty. Drag a book onto a shelf, or click a book and then a shelf.'); return; }
      RD.sfx.slide();
      for (i = 0; i < 6 && !bad; i++) {
        s = wall.children[i]; bs = ER.$$('.bk', s).map(function (c) { return c.getAttribute('data-b'); });
        bs.forEach(function (b) { if (!bad && !ER.check('k-' + b, BINS[i])) bad = [s, b]; });
        parts.push(bs.sort().join('.'));
      }
      if (bad) {
        misses++; ER.sfx.no(); bad[0].classList.add('bad'); ER.shake(bad[0]);
        msg('<b>' + BYID[bad[1]].t + '</b>: ' + WHY[bad[1]] + (misses > 2 ? ' (Only the first wrong book is ever shown.)' : ''));
        return;
      }
      file = ER.exitOk([parts.join('-')]);
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('b-file', file); lockd = true;
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.corner = 1; ER.persist(true);
      msg('Two on every shelf. In the crate, one book is left: a cardboard cover held together with ribbon.');
      setTimeout(function () {
        ER.closeAll(); RD.solved(); paint(); busy = true;
        RD.mine('shelves', 'The corner, sorted', '<p>Mystery: The Footprints on the Ceiling; The Grey Lady of Craw Hall (the ghost is a thief).</p><p>Adventure: Three Hundred Miles by Canoe; To the Mountains of the Moon (in Africa).</p><p>Fairy tale: The Seven Silver Geese; The Boy Who Sailed in a Walnut Shell.</p><p>Science fiction: Signal from Ganymede; Tomorrow&rsquo;s News, Today (the school is only the setting).</p><p>School story: New Girl at Larkspur House; The Ghost of Dormitory Four (Ellie fears the head girl).</p><p>Ghost story: The Room at the Top of the Stairs; Footsteps in the Cold Chapel (never explained).</p><p>Left over, on no shelf: EVERYTHING, by J. Fennimore, aged 9.</p>');
        ER.narrate([
          'Two books on every shelf, under every picture, the way Mrs Pumphrey taught Juno, and the way she taught forty years of Story Club before her.',
          'In the crate there is one book left: a cardboard cover held together with ribbon. EVERYTHING, by J. Fennimore, aged 9. It has every sign on its cover at once, a crown and a rocket and a candle and a compass, which is why it belongs on no shelf at all.',
          'Mrs Pumphrey opens it. There is no story inside. There are six cards, each with one line copied out in Juno&rsquo;s best writing, and a note on top.'
        ], function () {
          readCards(function () {
            ER.narrate([
              '&ldquo;Beginnings,&rdquo; says Mrs Pumphrey. &ldquo;First lines. She copied them out. She would never tear a page out of a book. I taught her that too.&rdquo;',
              'Behind you, Archie comes back up the boiler-room stairs with nothing in his arms, sees you looking, and goes straight back down again.',
              '&ldquo;The stacks,&rdquo; says Mrs Pumphrey. &ldquo;Fiction, A to Z, at the back of the building. Come on.&rdquo;'
            ], function () { busy = false; $('#go').classList.add('on'); });
          });
        });
      }, 2200);
    });
    msg('Thirteen books in the crate, and six shelves that take two each. Drag a book onto a shelf, or click a book and then a shelf. Click a book to read its back cover.');
    ER.open('ov-lock', srt);
  }
  var CARDS = '<h4>Inside EVERYTHING</h4><p>Mrs P: these are beginnings. Give each one back to its book, in the stacks. One of them has no book down there. J.</p>' +
    '<p class="line">It was a bright cold day in April, and the clocks were striking thirteen.</p>' +
    '<p class="line">No one would have believed in the last years of the nineteenth century that this world was being watched keenly and closely by intelligences greater than man&rsquo;s and yet as mortal as his own; (it goes on)</p>' +
    '<p class="line">Mr. Sherlock Holmes, who was usually very late in the mornings, save upon those not infrequent occasions when he was up all night, was seated at the breakfast table.</p>' +
    '<p class="line">When Mr. Hiram B. Otis, the American Minister, bought Canterville Chase, every one told him he was doing a very foolish thing, as there was no doubt at all that the place was haunted.</p>' +
    '<p class="line">When Mary Lennox was sent to Misselthwaite Manor to live with her uncle everybody said she was the most disagreeable-looking child ever seen.</p>' +
    '<p class="line">Nobody in Hopwell believed that a girl could sail a ship, least of all her own father.</p>';
  function readCards(done) {
    ER.read({ html: CARDS, cls: 'jcard', clue: { id: 'cards', title: 'Six beginnings', kind: 'Inside Juno&rsquo;s book' }, done: done });
  }
})();
</script>
</body>
</html>
