  .sK{font-family:'Caveat',cursive;text-anchor:middle}

  /* the returns trolley: five books and their date labels */

  .trl .sp{width:52px;border-radius:3px 3px 0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);

  .trl .lab .by{font-family:'Alegreya',serif;font-style:italic;font-size:16px;margin:0 0 8px;color:#5a4e40}
  .trl .lab .rules{border:1px solid #2b2a26;padding:5px 8px;font-size:13.5px;line-height:1.35;margin-bottom:8px;text-transform:uppercase}
  .trl .lab .dates{display:flex;flex-wrap:wrap;gap:6px 14px;min-height:60px}
  .trl .lab .dates span{color:#5a2a8a;font-size:18px;transform:rotate(-2deg);display:inline-block}
  .trl .lab .dates span:nth-child(even){transform:rotate(1.5deg);color:#2a4a8a}
  .trl .lab .btn{position:absolute;right:14px;bottom:12px;--accent:#5a3a1a;color:#5a3a1a;background:#fff8e4}
  .trl .lab .empty{font-family:'Alegreya',serif;font-style:italic;color:#7a6e60;margin-top:90px;text-align:center}

  /* the mountain on the Story Club board */
  .mtn{width:min(1080px,97vw);-webkit-user-select:none;user-select:none}
  .mtn .board{position:relative;height:332px;background:#24382e;border:12px solid #7a5a36;border-bottom-width:16px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 70px rgba(0,0,0,.4)}

  .mtn .tray{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;padding:10px;background:rgba(0,0,0,.28);border-radius:4px;min-height:236px;align-items:start;align-content:start}
  .mtn .bm{position:relative;background:#fff8e6;color:#22201c;font-family:'Alegreya',serif;font-size:13.6px;line-height:1.22;padding:7px 8px 6px 9px;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.35);border-top:7px solid #e07a5f;min-height:104px}

  .mtn .foot .bmsg{color:#fbf2e4}

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told;

  /* the drawn details: rain, books left on the shelves, clock ticks, tickets, the trolley's books, Councillor Quigley */
  (function () {

  ER.init({
    theme: 'lit', story: 'reader', storyTitle: 'Don’t Skip to the End', id: 'desk', no: 'I', title: 'The Issue Desk',
    go: 'Push the green door',
    intro: [
      'Hopwell Free Library has stood on the corner of the Market Square since 1906. It has a green door, a brass plate, a clock that is always four minutes slow, and about nine thousand books.',

    function why(i, k) {
      if (k === 'hazel') return 'Mrs Pumphrey shakes her head. &ldquo;A bird in a hazel tree? In the Blue Fairy Book her godmother gives her the dress: read the pumpkin bookmark. That one is from the Grimms&rsquo; Ashputtel. It has no place on this mountain.&rdquo;';
      if (k === 'gold') return '&ldquo;A slipper made of gold?&rdquo; says Mrs Pumphrey. &ldquo;Look at the title she underlined: The Little Glass Slipper. That one is from the Grimms&rsquo; book. Leave it in the tray.&rdquo;';
      var part = PART[k];
      if (i === 0) return '&ldquo;The bottom of the mountain is the exposition,&rdquo; says Mrs Pumphrey. &ldquo;Life before the trouble starts: who she is, and what is wrong with her life. Has anything happened yet in this one?&rdquo;';
      if (i <= 3) return part === 2 ? '&ldquo;That one is on the climb,&rdquo; says Mrs Pumphrey, &ldquo;but not in that place. The climb goes one step at a time, in the order things happen.&rdquo;' :
        '&ldquo;The climb is the rising action,&rdquo; says Mrs Pumphrey. &ldquo;The trouble starts, and things get harder, step by step. Is this one on the way up?&rdquo;';
      if (i === 4) return k === 'pocket' ? '&ldquo;Her sisters at her feet,&rdquo; says Mrs Pumphrey. &ldquo;But that happens because of something else. What is the one moment after which nothing can go back?&rdquo;' :
        '&ldquo;The top is the climax,&rdquo; says Mrs Pumphrey, &ldquo;the moment her main problem is decided. What is her main problem? And when is it decided?&rdquo;';
      if (i === 5) return k === 'wax' ? '&ldquo;That is the top of the mountain,&rdquo; says Mrs Pumphrey, &ldquo;not the way down.&rdquo;' : k === 'lords' ? '&ldquo;That is how life is at the very end,&rdquo; says Mrs Pumphrey. &ldquo;The way down comes just before it.&rdquo;' :
        '&ldquo;The way down is the falling action,&rdquo; says Mrs Pumphrey: &ldquo;what happens because of the climax. Loose ends.&rdquo;';
      return k === 'pocket' ? '&ldquo;That ties up a loose end,&rdquo; says Mrs Pumphrey. &ldquo;But is it the very end, the new normal?&rdquo;' : '&ldquo;The far bottom is the resolution,&rdquo; says Mrs Pumphrey: &ldquo;how life is now that it is all over.&rdquo;';
    }
    mtn.querySelector('#m-go').addEventListener('click', function () {
      var got = [], i, c, empty, file;
      if (lockd || nextFile) return;
      ER.$$('.peg', board).forEach(function (p) { c = p.querySelector('.bm'); got.push(c ? c.getAttribute('data-k') : ''); });
      empty = got.filter(function (g) { return !g; }).length;
      if (empty) { ER.sfx.no(); msg('Seven places on the mountain, and ' + (empty === 7 ? 'all of them are' : empty + (empty === 1 ? ' is' : ' are')) + ' still empty. Drag a bookmark onto a place, or click a bookmark and then a place.'); return; }
      RD.sfx.chalk();
      for (i = 0; i < 7; i++) if (!ER.check('p' + (i + 1), got[i])) {
        misses++; ER.sfx.no();
        var peg = board.children[i + 1]; peg.classList.add('bad'); ER.shake(peg);
        msg(why(i, got[i]) + (misses > 2 ? ' (Only the first wrong place is ever shown. There may be others.)' : ''));
        return;
      }
      file = ER.exitOk([got.join('-')]);
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('a-file', file); lockd = true;
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.desk = 1; ER.persist(true);
      ER.$$('.peg .bm', board).forEach(function (b, j) {
        setTimeout(function () { RD.sfx.slide(); b.classList.add('flip'); b.innerHTML = BACK[b.getAttribute('data-k')]; }, 300 + j * 380);
      });
      setTimeout(function () { msg('On the back of each bookmark, in Juno&rsquo;s capitals, there is one word.'); }, 600);
      setTimeout(function () {
        ER.closeAll(); RD.solved(); paint(); busy = true;
        RD.mine('mountain', 'Cinderella on the mountain', '<p>1 Exposition: the girl in the cinders and the attic.</p><p>2 Rising action: the ball; the pumpkin coach; midnight and the glass slipper.</p><p>3 Climax: the slipper fits, as if it were made of wax.</p><p>4 Falling action: the other slipper; her sisters beg her pardon.</p><p>5 Resolution: the wedding, and rooms in the palace for the sisters.</p><p>Left out: the hazel-tree bird and the golden slipper, from the Grimms&rsquo; Ashputtel.</p><p>On the backs: GO TO THE CORNER WHERE I BEGAN.</p>');
        ER.narrate([
          'GO &middot; TO &middot; THE &middot; CORNER &middot; WHERE &middot; I &middot; BEGAN.',
          '&ldquo;The children&rsquo;s corner,&rdquo; says Mrs Pumphrey. &ldquo;She was three. She used to read the picture books upside down and tell me that I was holding mine the wrong way up.&rdquo;',
          'She looks down at her cardigan, sees that it is buttoned wrong, and buttons it again, properly, all the way up.',
          '&ldquo;Come along, then,&rdquo; she says. &ldquo;Before Councillor Quigley measures it.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 300 + 7 * 380 + 1800);
    });
    msg('Nine bookmarks, and seven places on the mountain. Drag a bookmark onto a place, or click a bookmark and then a place. When every place is filled, turn them over.');
    ER.open('ov-lock', mtn);
  }
})();
</script>
