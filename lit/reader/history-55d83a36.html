  /* the Gazette, with Mrs Pumphrey's two pencils */
  .gzl{width:min(780px,95vw)}
  .gzl .doc.gaz{width:100%;max-height:none}
  .gzl .sn{display:block;margin:0 0 5px;cursor:pointer;border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .gzl .sn:hover{background:rgba(255,255,255,.5)}
  .gzl .sn.t{background:rgba(200,50,40,.14);text-decoration:underline wavy #c4262e;text-decoration-thickness:2px;text-underline-offset:4px}
  .gzl .sn.s{background:rgba(40,130,70,.14);text-decoration:underline #2a7a4a;text-decoration-thickness:3px;text-underline-offset:4px}
  .gzl .sn sup{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;margin-left:2px}
  .gzl .sn.t sup{color:#c4262e}.gzl .sn.s sup{color:#2a7a4a}
  .gzl .sn.bad{outline:3px solid #ff8a7a}
  .gzl .legend{display:flex;gap:18px;justify-content:center;margin:8px 0 0;font-family:'Alegreya',serif;font-size:16px;color:#f3e8d4}
  .gzl .legend span b{display:inline-block;width:34px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .gzl .foot .bmsg{color:#f3e8d4}

  /* the catalogue card */
  .ccl{width:min(820px,95vw)}
  .ccl .card{background:#fbf8ee;color:#22201c;font-family:'Special Elite',monospace;font-size:16.5px;line-height:1.5;padding:16px 26px 14px;border-radius:3px;box-shadow:0 26px 70px rgba(0,0,0,.6);
    background-image:linear-gradient(transparent 31px,rgba(200,60,60,.5) 31px,rgba(200,60,60,.5) 33px,transparent 33px),linear-gradient(transparent 0,transparent);position:relative}
  .ccl .card:after{content:'';position:absolute;left:50%;bottom:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#2e1e18}
  .ccl .card h6{margin:0 0 12px;font-family:'Special Elite',monospace;font-weight:normal;font-size:14px;letter-spacing:.14em}
  .ccl .fld{display:flex;gap:10px;align-items:baseline;margin:0 0 4px}
  .ccl .fld>span{flex:0 0 220px;font-size:14px;color:#5a5048}
  .ccl .fld>em{flex:1;font-style:normal;border-bottom:2px dotted #8a7a62;min-height:26px;color:#1f3a7a;font-family:'Caveat',cursive;font-size:25px;line-height:1}
  .ccl .fld.bad>em{background:#ffd8cc}
  .ccl .card .fl{margin:8px 0 18px;font-size:14.5px}
  .ccl .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .ccl .grp{background:rgba(0,0,0,.28);border-radius:4px;padding:8px}
  .ccl .grp h5{margin:0 0 6px;font-family:'Goudy Bookletter 1911',serif;font-weight:normal;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#e2b86a}
  .ccl .tile{display:block;width:100%;margin:0 0 5px;padding:6px 8px;background:#f3e8d4;border:2px solid transparent;border-radius:3px;font-family:'Alegreya',serif;font-size:16px;color:#22201c;text-align:left;cursor:pointer}
  .ccl .tile:hover{border-color:#e2b86a}
  .ccl .tile.on{background:#1f3a7a;color:#fff}
  .ccl .foot .bmsg{color:#f3e8d4}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told, gzl = null, ccl = null;

  (function () {
    var s = '', i;
    ['1903', '1904', '1905', '', '1907', '1908'].forEach(function (y, j) {
      if (y) s += '<rect x="' + (40 + j * 32) + '" y="600" width="28" height="48" fill="' + ['#5a3a22', '#4a2e1e', '#5a3a22', '', '#4a2e1e', '#5a3a22'][j] + '"/><text x="' + (54 + j * 32) + '" y="630" class="sG" font-size="8" fill="#e8c88a" transform="rotate(-90 ' + (54 + j * 32) + ' 626)">' + y + '</text>';
    });
    for (i = 0; i < 6; i++) s += '<rect x="' + (40 + i * 34) + '" y="664" width="30" height="50" fill="' + ['#3a4a3a', '#5a2a2a', '#3a3a5a'][i % 3] + '"/>';
    $('#vols').innerHTML = s; s = '';
    [['#2f5a6a', 'A'], ['#6a2a5a', 'S'], ['#5a5a4a', 'D'], ['#7a6a3a', 'V']].forEach(function (b, j) {
      var x = 700 + j * 100;
      s += '<path d="M' + x + ' 410l40 -6 40 6v-60l-40 -6 -40 6z" fill="#f3e8d4" stroke="' + b[0] + '" stroke-width="5"/><path d="M' + (x + 40) + ' 344v60" stroke="#c8b898" stroke-width="2"/><rect x="' + (x + 50) + '" y="356" width="22" height="30" fill="' + b[0] + '" opacity=".6"/><path d="M' + (x + 6) + ' 360h28M' + (x + 6) + ' 370h24M' + (x + 6) + ' 380h28" stroke="#8a7a62" stroke-width="1.5"/>';
    });
    $('#cbooks').innerHTML = s; s = '';
    for (i = 0; i < 12; i++) s += '<rect x="' + (1262 + (i % 4) * 54) + '" y="' + (574 + Math.floor(i / 4) * 48) + '' + '" width="46" height="38" fill="#8a5a34" stroke="#3a2418" stroke-width="2"/><rect x="' + (1276 + (i % 4) * 54) + '" y="' + (582 + Math.floor(i / 4) * 48) + '" width="18" height="10" fill="#f3e8d4"/><circle cx="' + (1285 + (i % 4) * 54) + '" cy="' + (602 + Math.floor(i / 4) * 48) + '" r="3" fill="#c9a642"/>';
    $('#drawers').innerHTML = s;
    $('#quigley').innerHTML = window.FIG('quigley');
    $('#pumphrey').innerHTML = window.FIG('pumphrey', { right: true });
    $('#archie').innerHTML = window.FIG('archie', { box: false });
  })();

  ER.init({
    theme: 'lit', story: 'reader', storyTitle: 'Don’t Skip to the End', id: 'history', no: 'IV', title: 'The Local-History Room',
    go: 'Up the front stairs',
    intro: [
      'In the stacks, every first line went home to its book. There were two rockets: the line about the last years of the nineteenth century belonged to The War of the Worlds, from 1898, so the clocks striking thirteen belonged to the other one, Nineteen Eighty-Four. There were two books by Burnett: Mary Lennox is sent to her uncle&rsquo;s manor, not to a school, so her line went to The Secret Garden. Sherlock Holmes went to the magnifying glass, and Canterville Chase to its ghost.',
      'The sixth line was about Hopwell, and none of those books is. Treasure Island begins a long way from here.',
      'Twenty past two. The local-history room is up the front stairs, over the green door: maps, old photographs, and the town&rsquo;s own books. At three o&rsquo;clock it is to be emptied into a skip.'
    ],
    exit: {"next":"steps","w":{"a988b7a4":"aff9e57a"}}, tags: {"g1":["b0ea993e"],"g2":["05436cd1"],"g3":["141ffa89"],"g4":["b56c6c07"],"g5":["c35320cd"],"g6":["1f2ce136"],"au":["387babb6"],"pn":["6ffd548d"],"ti":["242f4069"]},
    hints: hints, onBegin: begin
  });

  told = RD.told('d-told'); nextFile = ER.flag('d-file') || null;
  function isBusy() { return busy; }
  function readAll() { return told.has('club') && told.has('letter') && told.has('receipt') && told.has('plan'); }
  function paint() {
    $('#scene').classList.toggle('archie', told.has('archie'));
    $('#club').classList.toggle('ready', !told.has('club'));
    $('#gaz').classList.toggle('ready', told.has('archie') && !told.has('gazdone'));
    $('#cat').classList.toggle('ready', told.has('gazdone') && told.has('case') && !nextFile);
    $('#case').classList.toggle('ready', told.has('gazdone') && !told.has('case'));
    ER.pips((told.has('club') ? 1 : 0) + (readAll() ? 1 : 0) + (told.has('gazdone') ? 1 : 0) + (told.has('case') ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The paper must go to the front steps by five o&rsquo;clock. The button is at the bottom of the screen.']];
    if (gzl && gzl.parentNode) return ['gazl', [
      'Ask of each sentence: does it say what somebody is like, or does it show what somebody did?',
      'Words like generous, a great lover of books, a credit to the town are somebody&rsquo;s opinion: telling. Sitting by the door all afternoon, lending an umbrella, leaving early: those are things people did.',
      'Three sentences tell (Mr Dowsett is generous; he loves books; the building is a credit) and three show (Mrs Dowsett writes the tickets; she gives the first ticket and her umbrella; Mr Dowsett speaks for four minutes and leaves).'
    ]];
    if (ccl && ccl.parentNode) return ['card', [
      'Three things to decide. Who really wrote the book? What name is on it? Which book is it? Use what people did, not what you were told.',
      'Gilbert&rsquo;s letter says the money came from his wife&rsquo;s sea stories, which she signed as a sea captain. And Juno&rsquo;s line has a real town and a real father in it, and no magic.',
      'The writer is the person who paid the builder and wrote out the tickets. The name on her books is a sea captain&rsquo;s, the one the Gazette says nobody has ever met. And Juno&rsquo;s line is an adventure, not a fairy tale: the book whose picture shows a girl steering a ship through the ice.'
    ]];
    if (!told.has('club')) return ['club', [
      'Mrs Pumphrey has brought her red Story Club folder up with her. It is on the table.',
      'Click the red folder on the table and read the sheet in it.'
    ]];
    if (!readAll()) return ['papers', [
      'Who really gave the library? The brass plate and the gilt board say one thing. What do the old papers in this room show?',
      'Read Gilbert Dowsett&rsquo;s letter (on the table), the framed receipt (on the wall at the right) and the plan pinned up beside it.'
    ]];
    if (!told.has('gazdone')) return ['gaz', ['Archie has brought back the Gazette for 1906. It is on the table. Click it, and mark each sentence with Mrs Pumphrey&rsquo;s pencils.']];
    if (!told.has('case')) return ['case', ['The glass case in the middle holds the books of Hopwell&rsquo;s own writers, open at their title pages. Look at them.']];
    return ['cat', ['Juno asked you to write the missing card. Click the catalogue cabinet at the right.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('A folded paper from 1906, and Juno&rsquo;s note: the steps, at five o&rsquo;clock.'); return; }
    if (told.has('in')) { busy = false; ER.say('The local-history room. The clock downstairs says it is getting late.'); return; }
    told.set('in');
    ER.narrate([
      'The room is long and low, under a sloping ceiling, with a round window over the Market Square. On every wall there is Hopwell: maps of it, photographs of it, and a stuffed pike that was caught in its river in 1911.',
      'In a glass case in the middle, four old books lie open at their title pages, under a card that says HOPWELL AUTHORS. Over the case hangs a gilt board: HOPWELL FREE LIBRARY. GIVEN BY GILBERT DOWSETT ESQ. 1906.',
      'Councillor Quigley is at the round window, looking down at the square, and saying &ldquo;forty-two&rdquo; to himself very softly, like a lullaby. &ldquo;Dowsett,&rdquo; he says, without turning round. &ldquo;Mill-owner. Businessman, like me. He&rsquo;d have loved a car park.&rdquo;',
      'Mrs Pumphrey puts her red Story Club folder on the table. Then she looks at the shelf of bound newspapers, and stops. &ldquo;The Gazette for 1906 has gone,&rdquo; she says. &ldquo;It was there on Thursday.&rdquo;'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var CLUB = '<h4>Shown and told</h4><h5>Story Club &middot; week four &middot; E. P.</h5>' +
    '<p>A writer can <b>tell</b> you about a <b>character</b>: &ldquo;She was brave.&rdquo; Or a writer can <b>show</b> you: &ldquo;She walked into the dark first, holding the torch for the others.&rdquo;</p>' +
    '<p>Telling is quick, and anybody can write it about anybody. Showing is <b>evidence</b>: what a person does, says and chooses, and what it costs them. From it, a reader can <b>infer</b>, that is, work out for herself, what the person is really like.</p>' +
    '<p class="rule">When what you are told and what you are shown disagree, believe what you are shown.</p>' +
    '<p>Three questions: What did they do? What did it cost them? So what kind of person are they?</p>';
  var LETTER = '<h4>To the Town Council of Hopwell &middot; 16 March 1905</h4><p>Gentlemen,</p>' +
    '<p>I am told that I am a generous man. I suppose I must be.</p>' +
    '<p>My wife has set her heart on a free library for the town. She will not have her own name on anything, so I am asked to put mine on it. Very well: let it be called my gift. It sounds better.</p>' +
    '<p>But let it be understood that not one penny of mine is spent on it. The builder is to be paid entirely with the money my wife has made from her little sea stories, which she insists on signing as a sea captain, of all things. I have not read them. I have no time for made-up things.</p>' +
    '<p class="sig">I remain, Gentlemen, yours faithfully,<br>G. Dowsett</p>';
  var RECEIPT = '<h4>J. Gledhill &amp; Sons, Builders, Hopwell</h4>' +
    '<p>Received of <b>Mrs L. Dowsett</b> the sum of Two Thousand Four Hundred Pounds (&pound;2,400), in full payment for the building of the Free Library in the Market Square, Hopwell.</p>' +
    '<p>2 June 1906. With thanks.</p><p style="text-align:center"><span class="stampd">PAID</span></p>';
  var PLAN = '<h4>Hopwell Free Library &middot; ground floor &middot; 1905</h4>' +
    '<svg viewBox="0 0 700 150"><g fill="none" stroke="#e8f0fa" stroke-width="2"><rect x="20" y="10" width="660" height="130"/><path d="M260 10v130M470 10v80M470 90h210"/><rect x="560" y="96" width="110" height="38"/><path d="M40 140v-26h40v26"/></g>' +
    '<g font-family="Oswald,sans-serif" font-size="14" fill="#e8f0fa"><text x="70" y="70">HALL &amp; ISSUE DESK</text><text x="330" y="70">STACKS</text><text x="520" y="50">CHILDREN</text><text x="566" y="120">low window</text><text x="40" y="108">door</text></g></svg>' +
    '<p class="pen">The children&rsquo;s corner must have a low window: children read on the floor. L.D.</p>' +
    '<p class="pen">Put the warm pipes under the corner, not the hall. L.D.</p>' +
    '<p class="pen">No turnstile at the door. Nobody pays to come in. Ever. L.D.</p>' +
    '<p>Typed by the architect: Mr Dowsett has asked for a smaller building.<br><span class="pen">Mr Dowsett is not paying for it. L.D.</span></p>';
  var CASE = '<h4>Hopwell Authors &middot; in the glass case, open at the title pages</h4>' +
    '<p><b>AGAINST THE WIND.</b> A Story of the Sea. By Captain L. Halyard. 1902. The picture: a girl at a ship&rsquo;s wheel, in a storm. Under it: &ldquo;She took the wheel herself, and steered for the gap in the ice.&rdquo;</p>' +
    '<p><b>THE SEA-KING&rsquo;S DAUGHTER.</b> By Captain L. Halyard. 1900. The picture: a girl riding a silver fish up through the waves. Under it: &ldquo;Once upon a time, the Sea-King had seven daughters.&rdquo;</p>' +
    '<p><b>THE DRAINS OF HOPWELL, and How to Mend Them.</b> By G. D. 1904. The picture: a plan of the pipes under the Market Square.</p>' +
    '<p><b>VERSES FOR A WET AFTERNOON.</b> By A Lady of Hopwell. 1898. The picture: an umbrella.</p>' +
    '<p>The case is locked.</p>';

  function after() {
    paint();
    if (readAll() && told.set('archie')) {
      busy = true; paint();
      ER.narrate([
        'Somebody is coming up the stairs, slowly, the way a big man climbs a small staircase. It is Archie Lumb, with a fat leather-bound volume in his arms. GAZETTE 1906.',
        '&ldquo;Looking for this, Mrs P?&rdquo; He puts it on the table, very gently. &ldquo;I&rsquo;ve been taking the local-history boxes down the boiler room all morning. Not to the skip. Behind the boiler, where it&rsquo;s dry.&rdquo;',
        '&ldquo;My great-grandad&rsquo;s in that photo,&rdquo; he says, nodding at the wall: the boy by the door, on opening day. &ldquo;First ticket this library ever gave out, he got. I wasn&rsquo;t letting him go in a skip.&rdquo;',
        'Mrs Pumphrey looks at him for a long moment. &ldquo;Archie,&rdquo; she says, &ldquo;I owe you an apology.&rdquo; Archie goes red to the ears, which seems to be what Archie does.'
      ], function () {
        busy = false; paint();
        RD.mine('archie', 'Archie and the boxes', '<p>Archie was not helping the Councillor. He carried the local-history boxes down to the boiler room to keep them out of the skip. His great-grandfather got the first ticket on opening day, 1906.</p>');
        ER.say('The Gazette for 1906 is on the table. Mrs Pumphrey takes a red pencil and a green one out of her bun.');
      });
    }
  }
  $('#club').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CLUB, cls: 'club', clue: { id: 'club', title: 'Shown and told', kind: 'The Story Club folder' }, done: function () {
      RD.terms(['character', 'telling', 'showing', 'evidence', 'infer']);
      if (told.set('club')) ER.say('Showing is evidence. The brass plate and the gilt board only tell.');
      after();
    } });
  });
  $('#letter').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LETTER, cls: 'old', clue: { id: 'letter2', title: 'Gilbert Dowsett&rsquo;s letter, 1905', kind: 'On the table' }, done: function () {
      if (told.set('letter')) ER.say('Not one penny of his. Her little sea stories, signed as a sea captain.');
      after();
    } });
  });
  $('#receipt').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RECEIPT, cls: 'receipt', clue: { id: 'receipt', title: 'The builder&rsquo;s receipt, 1906', kind: 'Framed, on the wall' }, done: function () {
      if (told.set('receipt')) ER.say('Received of Mrs L. Dowsett. Not of Mr Gilbert Dowsett.');
      after();
    } });
  });
  $('#plan').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PLAN, cls: 'plan', clue: { id: 'plan', title: 'The plan, with notes in pencil', kind: 'Pinned on the wall' }, done: function () {
      if (told.set('plan')) ER.say('A low window for the children, and warm pipes under the corner. You sat by both of them this morning.');
      after();
    } });
  });
  $('#case').addEventListener('click', function () {
    if (busy) return;
    if (!told.has('gazdone')) { ER.say('Four old books, open, behind locked glass. HOPWELL AUTHORS. First, who really gave this library?'); return; }
    ER.read({ html: CASE, cls: 'gaz', clue: { id: 'case', title: 'Hopwell Authors, in the glass case', kind: 'In the glass case' }, done: function () {
      if (told.set('case')) { paint(); ER.say('Two books by Captain L. Halyard. And the catalogue cabinet has no card for either of them.'); }
    } });
  });

  /* ---------- the people ---------- */
  $('#quigley').addEventListener('click', function () {
    if (busy) return;
    RD.sfx.jingle();
    ER.say(told.has('gazdone') ? '&ldquo;The wife?&rdquo; says Councillor Quigley. &ldquo;Says who? It says Gilbert on the board. In gold. You can&rsquo;t argue with gold.&rdquo;' :
      '&ldquo;Forty-two,&rdquo; says Councillor Quigley to the window. &ldquo;This room comes down first, then the stairs. Lovely.&rdquo;');
  });
  $('#pumphrey').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('gazdone') ? '&ldquo;Captain L. Halyard,&rdquo; says Mrs Pumphrey. &ldquo;The card in our catalogue says: real name unknown. It has said that since 1906.&rdquo;' :
      '&ldquo;I have looked at that gilt board every working day for forty-one years,&rdquo; says Mrs Pumphrey, &ldquo;and I never once asked whether it was true.&rdquo;');
  });
  $('#archie').addEventListener('click', function () {
    if (busy) return;
    ER.say('&ldquo;Everything&rsquo;s behind the boiler, Mrs P,&rdquo; says Archie. &ldquo;Maps, photos, the lot. Dry as a bone. Nobody looks behind a boiler.&rdquo;');
  });
  $('#gap').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('archie') ? 'The Gazette, every year since 1890. 1906 is on the table now.' : 'The Hopwell Gazette, bound in leather, a volume for every year. 1906 is missing. There is a box-shaped gap in the dust.');
  });
  RD.thing('#oc', 'Market Square', 'The Market Square from above. The sign on the far side says COMING SOON: 42 SPACES. People are already gathering by the steps for five o&rsquo;clock.', isBusy);
  RD.thing('#maps', 'map', 'A map of Hopwell in 1890. The Market Square is there, and the river. The library is not, yet.', isBusy);
  RD.thing('#photo', 'photograph', 'Opening day, 1906. A crowd in hats by the green door. At the front, a small barefoot boy holding a book as if it might fly away. Beside the door, half hidden, a woman sits at a little table, writing.', isBusy);
  RD.thing('#pike', null, 'A stuffed pike in a glass box. CAUGHT IN THE HOP, 1911. It looks as if it still has opinions about that.', isBusy);
  RD.thing('#gilt', null, 'HOPWELL FREE LIBRARY. GIVEN BY GILBERT DOWSETT ESQ. 1906. In gold leaf, for a hundred and twenty years.', isBusy);

  /* ---------- the Gazette, marked with two pencils ---------- */
  var SENT = [
    'Mr Gilbert Dowsett, the giver of the library, is a most generous and public-spirited gentleman.',
    'Mr Dowsett is known to be a great lover of books.',
    'Mrs Dowsett sat by the door all afternoon, and wrote out the first two hundred tickets with her own hand.',
    'She gave the very first ticket to a barefoot boy from Chandler&rsquo;s Yard, and lent him her own umbrella to carry his book home in the rain.',
    'Mr Dowsett made a speech of four minutes, and left early for a meeting at the mill.',
    'The new building is a credit to the town, and to all who had a hand in it.'
  ];
  var GWHY = [
    '&ldquo;A most generous gentleman,&rdquo; says Mrs Pumphrey. &ldquo;What does he do in that sentence? Nothing. The paper only says what he is like.&rdquo;',
    '&ldquo;Known to be,&rdquo; says Mrs Pumphrey. &ldquo;Known by whom? We see him do nothing with a book in that sentence.&rdquo;',
    '&ldquo;She sat there all afternoon, writing two hundred tickets by hand,&rdquo; says Mrs Pumphrey. &ldquo;Nobody tells us she cared. We see her do it.&rdquo;',
    '&ldquo;The first ticket, and her own umbrella, in the rain,&rdquo; says Mrs Pumphrey. &ldquo;That is something she did, and it cost her a wet walk home.&rdquo;',
    '&ldquo;Four minutes, and then off to the mill,&rdquo; says Mrs Pumphrey. &ldquo;Nobody says he was bored. We see him leave.&rdquo;',
    '&ldquo;A credit to the town,&rdquo; says Mrs Pumphrey. &ldquo;That is the newspaper&rsquo;s opinion. Does anybody do anything in that sentence?&rdquo;'
  ];
  function openGazette() {
    var lockd = false, misses = 0, mk = ER.flag('d-mk') || {};
    gzl = ER.el('div', 'gzl');
    gzl.innerHTML = '<div class="doc gaz"><h4>The Hopwell Gazette</h4><h5>Saturday 13 October 1906 &middot; One Penny</h5><h6>Our Free Library Opened</h6>' +
      '<p>' + SENT.map(function (s, i) { return '<span class="sn" data-i="' + i + '">' + s + '<sup></sup></span>'; }).join(' ') + '</p>' +
      '<p class="also">Also this week: Captain L. Halyard, the popular writer of sea stories, has sent a parcel of forty books to the new library. The Captain is believed to be a retired naval gentleman living quietly in the town, though nobody in Hopwell has ever met him.</p></div>' +
      '<div class="legend"><span><b style="background:#c4262e"></b>red pencil: TOLD</span><span><b style="background:#2a7a4a"></b>green pencil: SHOWN</span><span>(click a sentence to change its mark)</span></div>' +
      '<div class="foot"><p class="bmsg"></p><button type="button" class="btn" id="g-go">Show Mrs Pumphrey</button></div>';
    var m = gzl.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function show(n) { var v = mk[n.getAttribute('data-i')] || ''; n.classList.toggle('t', v === 't'); n.classList.toggle('s', v === 's'); n.querySelector('sup').textContent = v === 't' ? 'TOLD' : v === 's' ? 'SHOWN' : ''; }
    ER.$$('.sn', gzl).forEach(function (n) {
      show(n);
      n.addEventListener('click', function (e) {
        if (lockd || told.has('gazdone')) return;
        var i = n.getAttribute('data-i'); mk[i] = mk[i] === 't' ? 's' : mk[i] === 's' ? '' : 't';
        ER.flag('d-mk', mk); ER.sfx.click(); n.classList.remove('bad'); show(n);
      });
    });
    gzl.querySelector('#g-go').addEventListener('click', function () {
      var i, left = 0;
      if (lockd || told.has('gazdone')) return;
      for (i = 0; i < 6; i++) if (!mk[i]) left++;
      if (left) { ER.sfx.no(); msg('&ldquo;Every sentence gets a pencil,&rdquo; says Mrs Pumphrey. ' + left + (left === 1 ? ' sentence has' : ' sentences have') + ' no mark yet.'); return; }
      for (i = 0; i < 6; i++) if (!ER.check('g' + (i + 1), mk[i])) {
        misses++; ER.sfx.no(); var n = gzl.querySelector('.sn[data-i="' + i + '"]'); n.classList.add('bad');
        msg(GWHY[i] + (misses > 2 ? ' (Only the first wrong mark is ever shown.)' : ''));
        return;
      }
      lockd = true; told.set('gazdone'); RD.solved(true); paint();
      msg('&ldquo;Three told, and three shown,&rdquo; says Mrs Pumphrey. &ldquo;And every one of the shown ones is about her.&rdquo;');
      RD.mine('gazmarks', 'The Gazette, told and shown', '<p>Told: Mr Dowsett is generous; Mr Dowsett is a great lover of books; the building is a credit to the town.</p><p>Shown: Mrs Dowsett wrote out the first two hundred tickets by hand; she gave the first ticket to a barefoot boy and lent him her umbrella; Mr Dowsett spoke for four minutes and left early.</p><p>Also in the paper: Captain L. Halyard, writer of sea stories, sent forty books. Nobody in Hopwell has ever met him.</p>');
      ER.addClue('gazette', 'The Hopwell Gazette, 13 October 1906', '<h4>The Hopwell Gazette &middot; 13 October 1906</h4><p>' + SENT.join(' ') + '</p><p class="also">Also this week: Captain L. Halyard, the popular writer of sea stories, has sent a parcel of forty books to the new library. The Captain is believed to be a retired naval gentleman living quietly in the town, though nobody in Hopwell has ever met him.</p>', 'gaz', 'On the table', true);
      setTimeout(function () { ER.close(); }, 3600);
    });
    msg(told.has('gazdone') ? 'Three told, and three shown.' : 'Mrs Pumphrey hands you her two pencils. Mark each sentence: does it tell you what somebody is like, or show you what somebody did?');
    ER.open('ov-lock', gzl, function () { if (told.has('gazdone')) ER.say(told.has('case') ? 'Now the catalogue card.' : 'Now the four books in the glass case.'); });
  }
  $('#gaz').addEventListener('click', function () {
    if (busy) return;
    if (told.has('gazdone')) { ER.say('The Gazette for 1906. Three sentences told, and three shown.'); return; }
    openGazette();
  });

  /* ---------- the catalogue card ---------- */
  var FIELDS = [
    ['pn', 'Name on the book', [['halyard', 'Captain L. Halyard'], ['gd', 'G. D.'], ['lady', 'A Lady of Hopwell']]],
    ['au', 'Real name of the writer', [['gilbert', 'Gilbert Dowsett'], ['lavinia', 'Lavinia Dowsett'], ['nobody', 'Nobody knows']]],
    ['ti', 'Title', [['seaking', 'The Sea-King&rsquo;s Daughter'], ['wind', 'Against the Wind'], ['drains', 'The Drains of Hopwell'], ['verses', 'Verses for a Wet Afternoon']]]
  ];
  var CWHY = {
    gd: '&ldquo;G. D. wrote about drains,&rdquo; says Mrs Pumphrey. &ldquo;And Gilbert has no time for made-up things. Does he sound like a man who writes stories about a girl and a ship?&rdquo;',
    lady: '&ldquo;A Lady of Hopwell wrote poems about the rain,&rdquo; says Mrs Pumphrey. &ldquo;Read Gilbert&rsquo;s letter again. What did his wife sign her stories as?&rdquo;',
    gilbert: '&ldquo;Who told you Gilbert?&rdquo; says Mrs Pumphrey. &ldquo;The brass plate, the gilt board, the Gazette, the Councillor. All of it telling. Now: what did Gilbert do? Read his own letter.&rdquo;',
    nobody: '&ldquo;Somebody knows,&rdquo; says Mrs Pumphrey. &ldquo;Somebody paid the builder with the money from those stories. Look at the receipt.&rdquo;',
    seaking: '&ldquo;A girl and the sea, yes,&rdquo; says Mrs Pumphrey. &ldquo;But is there any magic in Juno&rsquo;s line? Once upon a time, a Sea-King? Or a real town and a real father?&rdquo;',
    drains: '&ldquo;That is a book about drains,&rdquo; says Mrs Pumphrey, &ldquo;and it does not begin with a girl.&rdquo;',
    verses: '&ldquo;That is a book of poems about the rain,&rdquo; says Mrs Pumphrey. &ldquo;Juno&rsquo;s line is the beginning of a story.&rdquo;'
  };
  function openCard() {
    var lockd = false, misses = 0, pick = ER.flag('d-pick') || {};
    ccl = ER.el('div', 'ccl');
    ccl.innerHTML = '<div class="card"><h6>HOPWELL FREE LIBRARY &middot; LOCAL HISTORY &middot; HOPWELL AUTHORS</h6>' +
      FIELDS.map(function (f) { return '<div class="fld" data-f="' + f[0] + '"><span>' + f[1] + ':</span><em></em></div>'; }).join('') +
      '<p class="fl">First line: &ldquo;Nobody in Hopwell believed that a girl could sail a ship, least of all her own father.&rdquo;</p></div>' +
      '<div class="tiles">' + FIELDS.map(function (f) { return '<div class="grp" data-f="' + f[0] + '"><h5>' + f[1] + '</h5>' + f[2].map(function (t) { return '<button type="button" class="tile" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>'; }).join('') + '</div>' +
      '<div class="foot"><p class="bmsg"></p><button type="button" class="btn" id="c-go">File the card</button></div>';
    var m = ccl.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function show() {
      FIELDS.forEach(function (f) {
        var v = pick[f[0]], lab = '';
        f[2].forEach(function (t) { if (t[0] === v) lab = t[1]; });
        ccl.querySelector('.fld[data-f="' + f[0] + '"] em').innerHTML = lab;
        ER.$$('.grp[data-f="' + f[0] + '"] .tile', ccl).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
      });
    }
    ER.$$('.tile', ccl).forEach(function (b) {
      b.addEventListener('click', function () {
        if (lockd || nextFile) return;
        var f = b.parentNode.getAttribute('data-f'); pick[f] = b.getAttribute('data-v'); ER.flag('d-pick', pick); ER.sfx.click();
        ccl.querySelector('.fld[data-f="' + f + '"]').classList.remove('bad'); show();
      });
    });
    show();
    ccl.querySelector('#c-go').addEventListener('click', function () {
      var i, f, file;
      if (lockd || nextFile) return;
      for (i = 0; i < 3; i++) if (!pick[FIELDS[i][0]]) { ER.sfx.no(); msg('&ldquo;A card with a blank on it is no use to anybody,&rdquo; says Mrs Pumphrey. Fill in all three lines.'); return; }
      for (i = 0; i < 3; i++) {
        f = FIELDS[i][0];
        if (!ER.check(f, pick[f])) {
          misses++; ER.sfx.no(); var row = ccl.querySelector('.fld[data-f="' + f + '"]'); row.classList.add('bad'); ER.shake(row);
          msg(CWHY[pick[f]] + (misses > 2 ? ' (Only the first wrong line is ever shown.)' : ''));
          return;
        }
      }
      file = ER.exit([pick.au + '-' + pick.pn + '-' + pick.ti], { wait: true });
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('d-file', file); lockd = true;
      msg('Mrs Pumphrey takes the card, reads it twice, and files it in the drawer marked H, where it should have been since 1906.');
      setTimeout(function () { ER.closeAll(); paint(); ending(); }, 3000);
    });
    msg('A blank card, as Juno asked. Choose one line for each part of it, then file it.');
    ER.open('ov-lock', ccl);
  }
  $('#cat').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('In the drawer marked H: HALYARD, Captain L. Real name: Lavinia Dowsett. At last.'); return; }
    if (!told.has('gazdone') || !told.has('case')) { ER.say('The catalogue cabinet for local history. Under H there is a card that says: HALYARD, Captain L. Real name unknown. Juno wants a better one. First, find out who gave this library, and look in the glass case.'); return; }
    openCard();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  function ending() {
    busy = true;
    RD.terms(['pen name']);
    RD.mine('cardmade', 'The card, filed', '<p>Name on the book: Captain L. Halyard.</p><p>Real name of the writer: Lavinia Dowsett (she paid the builder with the money from her sea stories; Gilbert&rsquo;s letter says so).</p><p>Title: Against the Wind (1902), a story of the sea. Juno&rsquo;s line has a real town and a real father in it, and no magic, so it is the adventure, not the fairy tale.</p>');
    ER.narrate([
      '&ldquo;Councillor,&rdquo; says Mrs Pumphrey, &ldquo;the glass case, please. You have the keys.&rdquo;',
      '&ldquo;What for?&rdquo; says Councillor Quigley. Then he looks at the case, and something hungry comes into his face. &ldquo;Has it got an ending?&rdquo; He unlocks it, snatches up Against the Wind, and opens it at the very last page.',
      '&ldquo;&hellip;and she brought the ship home,&rdquo; he reads. &ldquo;Happy ending. Knew it.&rdquo; He drops the book on the table and goes off to measure the stairs.',
      'Mrs Pumphrey picks it up and opens it, not at the end, but in the exact middle. There, folded flat between two pages, where only somebody reading the whole book would ever find it, is a thick yellow paper with a red seal. On top of it lies a note in Juno&rsquo;s writing.',
      'Mrs P: this was in the middle of her book. I read it on Thursday. Read the middle. Then take it to the front steps at five o&rsquo;clock. Councillor Quigley will read only the bottom bit. Let him. J.',
      '&ldquo;On Thursday she asked me to open this case,&rdquo; says Mrs Pumphrey slowly. &ldquo;She said she wanted to look at the pictures. She read the whole book standing up, and I locked it away again and never thought another thing about it.&rdquo;',
      'She unfolds the yellow paper and reads it, all of it, from the top. When she looks up her eyes are very bright. &ldquo;The steps,&rdquo; she says. &ldquo;Five o&rsquo;clock. Do not let me be late.&rdquo;'
    ], function () {
      RD.mine('juno3', 'Juno&rsquo;s last note', '<p>Mrs P: this was in the middle of her book. I read it on Thursday. Read the middle. Then take it to the front steps at five o&rsquo;clock. Councillor Quigley will read only the bottom bit. Let him. J.</p>');
      busy = false; $('#go').classList.add('on');
    });
  }
})();
</script>
</body>
</html>
