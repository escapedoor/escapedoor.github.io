      case 1: return at === '1984' ? '&ldquo;The last years of the nineteenth century: that is the 1890s,&rdquo; says Mrs Pumphrey. &ldquo;Look at the years on the spines. And look at the titles: this world is being watched.&rdquo;' :
        '&ldquo;Something greater than man is watching this world,&rdquo; says Mrs Pumphrey. &ldquo;Look for a rocket, and a year in the 1890s.&rdquo;';
      case 2: return '&ldquo;Mr Sherlock Holmes is the most famous detective there has ever been,&rdquo; says Mrs Pumphrey. &ldquo;Which spine has the magnifying glass?&rdquo;';
      case 3: return at === 'screw' ? '&ldquo;Both are ghost stories,&rdquo; says Mrs Pumphrey. &ldquo;But read the name of the house that Mr Otis buys. Then read the titles again.&rdquo;' :
        '&ldquo;The place was haunted,&rdquo; says Mrs Pumphrey. &ldquo;Look for a candle on the spine, and the name of the house in a title.&rdquo;';
      case 4: return at === 'princess' ? '&ldquo;The same writer, and a girl in both,&rdquo; says Mrs Pumphrey. &ldquo;But the bell on that spine means a school story. Is Mary sent to a school? She is sent to live with her uncle, at a manor.&rdquo;' :
        '&ldquo;Two of these spines are by the same writer, and both are about a girl,&rdquo; says Mrs Pumphrey. &ldquo;Which of them is not about a school?&rdquo;';
      default: return at === 'treasure' ? '&ldquo;Treasure Island begins at an inn called the Admiral Benbow, a long way from Hopwell,&rdquo; says Mrs Pumphrey. &ldquo;Robert Louis Stevenson never came near Hopwell. Read Juno&rsquo;s note again.&rdquo;' :
        '&ldquo;Is that book about Hopwell?&rdquo; says Mrs Pumphrey. &ldquo;Look at the name in the line, and read Juno&rsquo;s note again.&rdquo;';
    }
  }
  function openShelf() {
    var lockd = false, misses = 0, put = ER.flag('c-put') || {};
    stk = ER.el('div', 'stk');
    stk.innerHTML = '<div class="cards"><h5>Juno&rsquo;s six beginnings</h5></div><div class="right"><div class="shelf"></div><div class="read">Click a card to read it here.</div>' +
      '<div class="foot"><p class="bmsg"></p><button type="button" class="btn" id="k-go">Push them back in</button></div></div>';
    var cards = stk.querySelector('.cards'), shelf = stk.querySelector('.shelf'), rd = stk.querySelector('.read'), m = stk.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    SPINES.forEach(function (s) {
      var col = ER.el('div', 'col'); col.innerHTML = '<div class="sp" style="background:' + s.c + '"><div class="st">' + (s.g ? RD.iconSvg(s.g, '#f6efdc', 22) : '') + '</div><div class="ti">' + s.t + '</div><div class="au">' + s.a + '</div><div class="yr">' + s.y + '</div></div><div class="pk" data-s="' + s.id + '"></div>';
      shelf.appendChild(col);
    });
    var none = ER.el('div', 'col none'); none.innerHTML = '<div class="sp">no book down here</div><div class="pk" data-s="none"></div>'; shelf.appendChild(none);
    CARDS_ORDER.forEach(function (ci) {
      var d = ER.el('div', 'cd dnd-item', '<u>' + (ci + 1) + '</u>' + CARDS[ci]); d.setAttribute('data-c', ci);
      var at = put[ci], pk = at ? shelf.querySelector('.pk[data-s="' + at + '"]') : null;
      (pk && !pk.querySelector('.cd') ? pk : cards).appendChild(d);
      d.addEventListener('pointerdown', function () { rd.innerHTML = ER.gloss(CARDS[ci]); });
    });
    function keep() { put = {}; ER.$$('.pk', shelf).forEach(function (p) { var c = p.querySelector('.cd'); if (c) put[c.getAttribute('data-c')] = p.getAttribute('data-s'); }); ER.flag('c-put', put); }
    RD.swapIn(stk, '.cd', '.pk', cards);
    ER.dnd(stk, { item: '.cd', slot: '.pk', home: cards, lock: function () { return lockd || !!nextFile; }, change: function () { keep(); ER.$$('.pk', shelf).forEach(function (p) { p.classList.remove('bad'); }); } });
    stk.querySelector('#k-go').addEventListener('click', function () {
      var where = {}, n = 0, i, file;
      if (lockd || nextFile) return;
      ER.$$('.pk', shelf).forEach(function (p) { var c = p.querySelector('.cd'); if (c) { where[c.getAttribute('data-c')] = p.getAttribute('data-s'); n++; } });
      if (n < 6) { ER.sfx.no(); msg((6 - n) + (6 - n === 1 ? ' card is' : ' cards are') + ' still in Juno&rsquo;s book. Put every card under a spine, or in the pocket for the one with no book down here.'); return; }
      RD.sfx.slide();
      for (i = 0; i < 6; i++) if (!ER.check('l' + (i + 1), where[i])) {
        misses++; ER.sfx.no(); var pk = shelf.querySelector('.pk[data-s="' + where[i] + '"]'); pk.classList.add('bad'); ER.shake(pk);
        msg('Card ' + (i + 1) + ': ' + why(i, where[i]) + (misses > 2 ? ' (Only the first wrong card is ever shown.)' : ''));
        return;
      }
      file = ER.exitOk([KEY.map(function (k, j) { return where[j]; }).join('-')]);
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('c-file', file); lockd = true;
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.stacks = 1; ER.persist(true);
      msg('Mrs Pumphrey pushes five books back into the shelf, one by one, with the flat of her hand.');
      setTimeout(function () {
        ER.closeAll(); RD.solved(); paint(); busy = true;
        RD.mine('lines', 'Five beginnings, home', '<p>1 The clocks striking thirteen: Nineteen Eighty-Four, George Orwell, 1949 (a world that is wrong).</p><p>2 The nineteenth century, this world being watched: The War of the Worlds, H. G. Wells, 1898.</p><p>3 Mr. Sherlock Holmes at breakfast: The Hound of the Baskervilles, Arthur Conan Doyle, 1902.</p><p>4 Mr. Otis buys Canterville Chase: The Canterville Ghost, Oscar Wilde, 1887.</p><p>5 Mary Lennox, sent to her uncle&rsquo;s manor: The Secret Garden, Frances Hodgson Burnett, 1911 (not A Little Princess, which is set in a school).</p><p>6 No book in the stacks: Nobody in Hopwell believed that a girl could sail a ship, least of all her own father.</p>');
        ER.narrate([
          'Five beginnings have gone home. One card is left in your hand: Nobody in Hopwell believed that a girl could sail a ship, least of all her own father.',
          '&ldquo;Hopwell,&rdquo; says Mrs Pumphrey slowly. &ldquo;Nobody writes books about Hopwell. Nobody ever has, except &hellip;&rdquo; She stops.',
          'On the back of the card, very small, Juno has written: Its book is upstairs, where Hopwell keeps its own story. It has never had a card in the catalogue. Please write it one.',
          '&ldquo;The local-history room,&rdquo; says Mrs Pumphrey. &ldquo;And Councillor Quigley&rsquo;s men are emptying it into a skip at three o&rsquo;clock.&rdquo;'
        ], function () {
          RD.mine('back', 'On the back of card 6', '<p>Its book is upstairs, where Hopwell keeps its own story. It has never had a card in the catalogue. Please write it one. J.</p>', true);
          busy = false; $('#go').classList.add('on');
        });
      }, 2400);
    });
    msg('Six cards and eight spines. Drag each card into the pocket under its book, or click a card and then a pocket. One card has no book down here.');
    ER.open('ov-lock', stk);
  }
})();
</script>
